 amphibious_tank_chassis: "Amphibious Tank Chassis"
 amphibious_tank_chassis_desc: "A small tank hull specifically designed to float. To achieve this, strict limits have to be set on the size of the weapon and the thickness of the armor the vehicle carries."
 amphibious_tank_chassis_1: "Amphibious Tank Chassis"
 gwtank_chassis: "Inter-War Tank Development"
 gwtank_chassis_desc: "The tank has proven itself a powerful weapon in the Great War. While development has slowed in the intervening years, it is no doubt going to play a major role in the wars to come."
 armor_tech_1: "Basic Armor Protection"
 armor_tech_1_desc: "Smoke coverage and armor itself form the basis of tank protection."
 armor_tech_2: "Improved Armor Protection"
 armor_tech_2_desc: "Increased armor and ERA systems further improve tank protection."
 armor_tech_3: "Advanced Armor Protection"
 armor_tech_3_desc: "Widespread introduction of hard-kill measures, which target incoming threats actively, increases the survivability of our tanks."
 armor_tech_4: "Future Armor Protection"
 armor_tech_4_desc: "Advanced hard-kill measures result in threats being eliminated well before they ever have the chance to cause harm to our tanks.\n\n"
 armor_tech_5: "Electronic Warfare Systems"
 armor_tech_5_desc: "The future of warfare is heading towards drones, and defense against them is becoming a priority.\n\n"
 engine_tech_1: "Basic Engine"
 engine_tech_1_desc: "Where the tanks of the Great War were slow, lumbering beasts, the modern tank relies very much on speed and mobility to achieve victory."
 engine_tech_2: "Improved Engine"
 engine_tech_2_desc: "With bigger guns and heavier armor, the new generation of tanks requires a more powerful engine to remain mobile."
 engine_tech_3: "Advanced Engine"
 engine_tech_3_desc: "Mechanized warfare is a form of combat that requires fast decision making and fast movement of troops and supplies. If our tanks are to carry modern weapons and enough armor to survive on the battlefield, they require powerful engines to keep up with the motorized infantry."
 engine_tech_4: "Modern Engine"
 engine_tech_4_desc: "The numerous new additions to tanks made necessary by modern warfare have increased the weight of the vehicle substantially. To move all that mass around, we require engines that have a lot of power behind them."
