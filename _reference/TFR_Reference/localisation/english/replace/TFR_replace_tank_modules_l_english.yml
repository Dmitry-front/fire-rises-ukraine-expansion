 main_battle_tank_chassis: "Main Battle Tank Chassis"
 modern_tank_chassis: "Main Battle Tank"
 modern_tank_chassis_desc: ""
 main_battle_tank_chassis_desc: "Experience has shown that the designs of light, medium, and heavy tank are converging more and more. heavy tanks have gotten more mobile, while light tanks are carrying heavier armament and armor to survive. there is therefore value in unifying all three designs into a single type, which will be a universal Main Battle Tank."
 modern_tank_chassis_1: "Gen 2 Main Battle Tank"
 modern_tank_chassis_1_desc: "While not strictly based on technological realities, main battle tanks are often categorized according to their "generation". With the 1st generation containing such tanks as the T-54, M48 Patton and Centurion, the 2nd generation, represented by the likes of T-72, AMX 30 and Leopard 1, is characterized by the adoption of NBC protection, night-vision, main gun stabilization and mechanical fire-control systems. Hopelessly outdated by 2020, many 2nd generation MBT's still serve around the world."
 modern_tank_chassis_2: "Gen 3 Main Battle Tank"
 modern_tank_chassis_2_desc: "Starting from the end of the 70's, 3rd generation MBT's such as the T-90, M1 Abrams and the Challenger gain their status from the adoption of thermal imaging, computerized fire-control systems and composite armor."
 modern_tank_chassis_3: "Gen 4 Main Battle Tank"
 modern_tank_chassis_3_desc: "From the T-14 Armata to the Type 10 and Challenger 3, 4th generation MBT's make use of the latest in military breakthroughs, including increased digitalization and smaller crew sizes, integrated loitering munitions support and active protection systems."
 modern_tank_chassis_4: "Gen 5 Main Battle Tank"
 modern_tank_chassis_4_desc: "The 5th generation of MBT's introduces models with little to no human interaction, completely automated combat systems and innovative new payload delivery solutions."
