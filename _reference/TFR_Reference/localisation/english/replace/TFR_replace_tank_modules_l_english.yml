 medium_tank_amphibious_equipment_0: "Inter-War Medium Amphibious Tank"
 basic_medium_tank_chassis: "Basic Medium Tank Chassis"
 basic_medium_tank_chassis_short: "1934 Medium"
 basic_medium_tank_chassis_desc: "While light tanks have formed the backbone of mechanized formations in past years, it is becoming clear that their growth potential is nearly exhausted. In the future, we will need a bigger vehicle, which still retains a high level of mobility."
 improved_medium_tank_chassis: "Improved Medium Tank Chassis"
 improved_medium_tank_chassis_short:1 "1940 Medium"
 improved_medium_tank_chassis_desc: "Building on the experiences of previous generation of medium tanks, it is clear that a new design with greater carrying capacity is needed to stay relevant."
 advanced_medium_tank_chassis: "Advanced Medium Tank Chassis"
 advanced_medium_tank_chassis_short: "1943 Medium"
 advanced_medium_tank_chassis_desc: "The rapid growth of weight in weapon systems and armor strength requires an even bigger chassis, creating a vehicle the size of earlier heavy tanks."
 medium_tank_chassis_desc: "A balanced, mid-sized chassis that offers a lot flexibility for building a wide variety of vehicles."
 medium_tank_artillery_chassis_0: "Inter-War Medium SP Artillery"
 medium_tank_artillery_chassis: "Medium SP Artillery"
 medium_tank_artillery_chassis_desc: "A well-balanced vehicle, primarily for fire support of advancing infantry."
 medium_tank_artillery_chassis_1: "Basic Medium SP Artillery"
 medium_tank_artillery_chassis_2: "Improved Medium SP Artillery"
 medium_tank_artillery_chassis_3: "Advanced Medium SP Artillery"
 medium_tank_destroyer_chassis_0: "Inter-War Medium Tank Destroyer"
 medium_tank_destroyer_chassis: "Medium Tank Destroyer"
 medium_tank_destroyer_chassis_desc: "A well-balanced vehicle, carrying a powerful gun to destroy enemy armor."
 medium_tank_destroyer_chassis_1: "Basic Medium Tank Destroyer"
 medium_tank_destroyer_chassis_2: "Improved Medium Tank Destroyer"
 medium_tank_destroyer_chassis_3: "Advanced Medium Tank Destroyer"
 medium_tank_aa_chassis_0: "Inter-War Medium SP Anti-Air"
 medium_tank_aa_chassis: "Medium SP Anti-Air"
 medium_tank_aa_chassis_desc: "A well-balanced vehicle, carrying an anti-air gun to defend against enemy planes."
 medium_tank_aa_chassis_1: "Basic Medium SP Anti-Air"
 medium_tank_aa_chassis_2: "Improved Medium SP Anti-Air"
 medium_tank_aa_chassis_3: "Advanced Medium SP Anti-Air"
 heavy_tank_chassis_0: "Inter-War Heavy Tank Chassis"
 heavy_tank_chassis_1: "Basic Heavy Tank Chassis"
 heavy_tank_chassis_2: "Improved Heavy Tank Chassis"
 heavy_tank_chassis_3: "Advanced Heavy Tank Chassis"
 heavy_tank_amphibious_chassis_0: "Inter-War Heavy Tank Chassis (Amphibious)"
 heavy_tank_amphibious_chassis_1: "Basic Heavy Tank Chassis (Amphibious)"
 heavy_tank_amphibious_chassis_2: "Improved Heavy Tank Chassis (Amphibious)"
 heavy_tank_amphibious_chassis_3: "Advanced Heavy Tank Chassis (Amphibious)"
 heavy_tank_amphibious_equipment_0: "Inter-War Heavy Amphibious Tank"
 basic_heavy_tank_chassis: "Basic Heavy Tank Chassis"
 basic_heavy_tank_chassis_desc: "A thorough analysis of the Great War has shown that there is a need for a heavy vehicle to break through the enemy trench line and open up the way for lighter forces to exploit the breakthough. Such a vehicle should heavily armed and well armored, but doesn't have to be very fast."
 basic_heavy_tank_chassis_short: "1934 Heavy"
 improved_heavy_tank_chassis: "Improved Heavy Tank Chassis"
 improved_heavy_tank_chassis_desc: "While the nature of warfare has changed, there is still a place for a heavy vehicle with thick armor to create a breakthrough in the enemy lines, or to shore up defenses against an enemy attack."
 improved_heavy_tank_chassis_short:1 "1940 Heavy"
 advanced_heavy_tank_chassis: "Advanced Heavy Tank Chassis"
 advanced_heavy_tank_chassis_desc: "With the advances in armor and firepower, a modern tank needs to carry thick armor and a large gun to be effective. This necessitates a large vehicle."
 advanced_heavy_tank_chassis_short: "1943 Heavy"
 heavy_tank_chassis_desc: "A large chassis that can mount a heavy gun, thick armor, or both."
 heavy_tank_artillery_chassis: "Heavy SP Artillery"
