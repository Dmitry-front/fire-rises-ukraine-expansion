 ### EQUIPMENT MODULES ###
 
 tank_gasoline_engine: "Gasoline Engine"
 tank_gasoline_engine_desc: "An Engine running on gasoline will be faster for a given Engine Size, but the fuel will be much more prone to catching fire."
 tank_diesel_engine: "Diesel Engine"
 tank_diesel_engine_desc: "An Engine running on Diesel fuel is more reliable than a gasoline engine, but not as fast for the same Engine Size."
 tank_petrol_electric_engine: "Petrol-Electric Engine"
 tank_petrol_electric_engine_desc: "A combination of a petrol-driven engine providing power to an electric motor. Complex, expensive and unreliable, it does however offer unmatched performance in tactical movements."
 tank_gas_turbine_engine: "Turbine Engine"
 tank_gas_turbine_engine_desc: "An turbine developed from jet engines. High fuel consumption, but the highest speed of any engine at a given Engine Size."
 tank_riveted_armor: "Rolled Homogeneous Armor"
 tank_riveted_armor_desc: "is a type of armor made of a single steel composition hot-rolled to improve its material characteristics, as opposed to layered or cemented armour."
 tank_cast_armor: "Composite Armor"
 tank_cast_armor_desc: "'Composite Armor' can vary wildly. This may even include concrete mixed with spaced welded steel armor such as the famous 'Kill Dozer'. In general Composite armor is armor made of mixed materials: steel, ceramics, plastics and air. Most composite armours are lighter than their all-metal equivalent."
 tank_welded_armor: "Cast Armor"
 tank_welded_armor_desc: "Armor plates are welded to the chassis. A faster process than casting, while still providing good protection."
 tank_torsion_bar_suspension: "Torsion Bar"
 tank_torsion_bar_suspension_desc: "A fairly reliable suspension system of metal bars fixed to the vehicle chassis that provides a smoother ride than other suspension types."
 tank_christie_suspension: "4x4 Suspension"
 tank_christie_suspension_desc: ""
 tank_bogie_suspension: "Bogie Suspension"
 tank_bogie_suspension_desc: "A simple and fairly cheap type of suspension in which the roadwheels are mounted individually, allowing them to be easily replaced if damaged."
 tank_interleaved_suspension: "Hydropneumatic Suspension"
 tank_interleaved_suspension_desc: "Hydropneumatic Suspensions provide a sensitive, dynamic and high-capacity suspension that offers superior ride quality on a variety of surfaces."
 tank_light_one_man_tank_turret: "One Man Turret"
 tank_light_one_man_tank_turret_desc: "A small turret barely large enough to hold a single crew member, who is tasked with aiming and loading the main armament as well as keeping watch for targets and threats."
 tank_light_two_man_tank_turret: "Two Man Turret"
 tank_light_two_man_tank_turret_desc: "A turret that allows for two crew members to share the work of operating the armament and observing the situation. It still does not allow for an effective division of labor amongst the crew."
 tank_light_three_man_tank_turret: "Three Man Turret"
 tank_light_three_man_tank_turret_desc: "A turret big enough for the three crew members to divide the tasks of loading and aiming the main armament as well as staying aware of the situation around them."
 tank_light_fixed_superstructure_turret:1 "Light Fixed Superstructure"
 tank_light_fixed_superstructure_turret_desc: "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 tank_medium_one_man_tank_turret: "One Man Turret"
 tank_medium_one_man_tank_turret_desc: "A small turret barely large enough to hold a single crew member, who is tasked with aiming and loading the main armament as well as keeping watch for targets and threats."
 tank_medium_two_man_tank_turret: "Two Man Turret"
 tank_medium_two_man_tank_turret_desc: "A turret that allows for two crew members to share the work of operating the armament and observing the situation. It still does not allow for an effective division of labor amongst the crew."
 tank_medium_three_man_tank_turret: "Three Man Turret"
 tank_medium_three_man_tank_turret_desc: "A turret big enough for the three crew members to divide the tasks of loading and aiming the main armament as well as staying aware of the situation around them."
 tank_medium_fixed_superstructure_turret:1 "Medium Fixed Superstructure"
 tank_medium_fixed_superstructure_turret_desc: "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 tank_heavy_two_man_tank_turret: "Two Man Turret"
 tank_heavy_two_man_tank_turret_desc: "A turret that allows for two crew members to share the work of operating the armament and observing the situation. It still does not allow for an effective division of labor amongst the crew."
 tank_heavy_three_man_tank_turret: "Three Man Turret"
 tank_heavy_three_man_tank_turret_desc: "A turret big enough for the three crew members to divide the tasks of loading and aiming the main armament as well as staying aware of the situation around them."
 tank_heavy_fixed_superstructure_turret:1 "Heavy Fixed Superstructure"
 tank_heavy_fixed_superstructure_turret_desc: "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 tank_super_heavy_four_man_tank_turret: "Four Man Turret"
 tank_super_heavy_four_man_tank_turret_desc: "A massive turret with additional space for a second loader to service the main gun."
 tank_super_heavy_three_man_tank_turret: "Three Man Turret"
 tank_super_heavy_three_man_tank_turret_desc: "A turret big enough for the three crew members to divide the tasks of loading and aiming the main armament as well as staying aware of the situation around them."
 tank_modern_tank_turret: "Three Man Turret"
 tank_modern_tank_turret_desc: "A well-laid out turret allows four crew members to efficiently operate the main armament and keep track of their surroundings."
 tank_3_man_tank_turret: "Two Man Turret"
 tank_3_man_tank_turret_desc: ""
 tank_heavy_machine_gun: "Turret Mounted Machine Gun"
 tank_heavy_machine_gun_desc: "A machine gun provides decent anti-infantry capability for a low cost. Even with special armor-piercing ammunition, its anti-armor performance leaves a lot to be desired."
 flamethrower: "Flamethrower"
 flamethrower_desc: "A device to project a stream of burning liquid. While very useful in urban combat and against fortifications, it offers no anti-armor capability and has to be used by a specially-trained crew in a separate unit to be effective."
 tank_auto_cannon: "Automatic Cannon"
 tank_auto_cannon_desc: "Adapted from a fast-firing anti-air gun, this automatic cannon can lay down a hail of fire that is devastating to soft targets. The small caliber does limit its anti-armor performance."
 tank_auto_cannon_2: "Improved Automatic Cannon"
 tank_auto_cannon_2_desc: "Adapted from a fast-firing anti-air gun, this automatic cannon can lay down a hail of fire that is devastating to soft targets. The small caliber does limit its anti-armor performance."
 tank_anti_air_cannon: "Basic Anti-Air Gun"
 tank_anti_air_cannon_desc: "A fast-firing automatic gun designed to engage aircraft. It has limited potential as a fire-support weapon against ground targets."
 tank_anti_air_cannon_2: "Improved Anti-Air Gun"
 tank_anti_air_cannon_2_desc: "A fast-firing automatic gun designed to engage aircraft. It has limited potential as a fire-support weapon against ground targets."
 tank_anti_air_cannon_3: "Advanced Anti-Air Gun"
 tank_anti_air_cannon_3_desc: "A fast-firing automatic gun designed to engage aircraft. It has limited potential as a fire-support weapon against ground targets."
 tank_medium_howitzer: "Medium Howitzer"
 tank_medium_howitzer_desc: "A medium field howitzer adapted to be mounted in a vehicle. Its primary purpose is indirect fire support against soft targets, but it can be fired directly at a target if necessary. Carrying only a small amount of armor-percing ammunition, it is ill-suited for anti-tank work."
 tank_medium_howitzer_2: "Improved Medium Howitzer"
 tank_medium_howitzer_2_desc: "A medium field howitzer adapted to be mounted in a vehicle. Its primary purpose is indirect fire support against soft targets, but it can be fired directly at a target if necessary. Carrying only a small amount of armor-percing ammunition, it is ill-suited for anti-tank work."
 tank_heavy_howitzer: "Heavy Howitzer"
 tank_heavy_howitzer_desc: "A heavy field howitzer adapted to be mounted in a vehicle. Its primary purpose is indirect fire support against soft targets, but it can be fired directly at a target if necessary. Carrying only a small amount of armor-percing ammunition, it is ill-suited for anti-tank work."
 tank_small_cannon: "Cold-War Small Caliber Gun"
 tank_small_cannon_desc: "A small and cheap cannon, able to fire both anti-infantry and anti-armor rounds. Its small caliber limits its usefulness."
 tank_small_cannon_2: "Modern Small Caliber Gun"
 tank_small_cannon_2_desc: "A small and cheap cannon, able to fire both anti-infantry and anti-armor rounds. Its small caliber limits its usefulness."
 tank_small_cannon_3: "Advanced Small Caliber Gun"
 tank_small_cannon_3_desc: "A small and cheap cannon, able to fire both anti-infantry and anti-armor rounds. Its small caliber limits its usefulness."
 tank_medium_cannon: "Medium Cannon"
 tank_medium_cannon_desc: "A general-purpose weapon well suited to a wide variety of tasks. It excells at neither anti-infantry nor anti-tank work, but it provides a vehicle with a lot of flexibility."
 tank_medium_cannon_2: "Improved Medium Cannon"
 tank_medium_cannon_2_desc: "A general-purpose weapon well suited to a wide variety of tasks. It excells at neither anti-infantry nor anti-tank work, but it provides a vehicle with a lot of flexibility."
 tank_high_velocity_cannon: "Cold-War Smooth Bore Barrel Gun"
 tank_high_velocity_cannon_desc: "Contrary to belief, rifled barrels provide less accuracy when using sub-caliber ammunition. When using APFSDS or HEATFS, it is better to use a smooth barrel."
 tank_high_velocity_cannon_2: "Modern Smooth Bore Barrel Gun"
 tank_high_velocity_cannon_2_desc: "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
 tank_high_velocity_cannon_3: "Advanced Smooth Bore Barrel Gun"
 tank_high_velocity_cannon_3_desc: "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
 tank_heavy_cannon: "Cold-War Rifled Barrel Gun"
 tank_heavy_cannon_desc: "Most nations which still use rifled barrels in tanks employ them to support infantry along with general armor purposes. They typically use HESH ammunition against hardened enemy structures. On the downside, these barrels provide less accuracy for sub-caliber ammunition..."
 tank_heavy_cannon_2: "Modern Rifled Barrel Gun"
 tank_heavy_cannon_2_desc: "A weapon that can fire a large shell. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldly to be mounted in most vehicles not specifically designed to carry it."
 tank_heavy_cannon_3:1 "Advanced Rifled Barrel Gun"
 tank_heavy_cannon_3_desc: "A weapon that can fire a large shell. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldly to be mounted in most vehicles not specifically designed to carry it."
 tank_super_heavy_cannon: "Super-Heavy Cannon"
 tank_super_heavy_cannon_desc: "An absurdly large weapon with unmatched performance. There are very few things that this weapon can not destroy, and none of them have any business shooting at a tank."
 tank_close_support_gun: "Close Support Gun"
 tank_close_support_gun_desc: "A small weapon designed to fire high-explosive shells against enemy field fortifications to help the infantry on the attack. While capable of engaging tanks, its short barrel and limited ammunition make it unable to deal with more powerful enemy tanks."
 tank_radio_1: "Basic Radio"
 tank_radio_1_desc: "A basic two-way radio allows tanks to coordinate their tactical maneuvers on a small scale."
 tank_radio_2: "Improved Radio"
 tank_radio_2_desc: "An improved radio allows commanders effective control over larger formations of tanks, permitting large-scale operational maneuvers."
 tank_radio_3: "Advanced Radio"
 tank_radio_3_desc: "With a more powerful transmitter and better reception, this radio allows communications over dozens of kilometers and in the face of enemy jamming."
 tank_ai_computer: "AI Targeting Computer"
 tank_ai_computer_desc: "Remove the crew from the equation, what do you get? A non-stop killing machine. It has not thoughts, no emotions, and obeys your every command."
 amphibious_drive: "Amphibious Propulsion System"
 amphibious_drive_desc: ""
 secondary_turret_hmg:1 "Heavy Machine Gun"
 secondary_turret_hmg_desc: "A heavy machine gun in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 secondary_turret_small_cannon:1 "Secondary Smooth Bore Gun"
 secondary_turret_small_cannon_desc: "A small cannon in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 secondary_turret_close_support_gun:1 "Close Support Gun"
 secondary_turret_close_support_gun_desc: "A close support gun in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 sloped_armor: "Explosive Reactive Armor"
 sloped_armor_desc: "Armor placed at an angle to an incoming shell has a much greater effective thickness than the same amount of armor placed vertically. It also increases the chance that the shell will simply bounce off harmlessly. However, it requires the entire tank to be designed around it, making the vehicle more difficult to assemble."
 stabilizer: "Stabilizer"
 stabilizer_desc: "A mechanical device to keep the gun pointing in the same direction when the tank is moving. While not advanced enough to allow accurate firing on the move, it does allow the gunner to fire accurately during a short stop, without having to re-acquire the target."
 smoke_launchers: "Smoke Launchers"
 smoke_launchers_desc: "A battery of pyrotechnic devices that can be triggered from inside the tank to create a thick cloud of smoke to hide the tank. Very useful when on the defensive or after driving into an ambush."
 extra_ammo_storage: "Extra Ammunition Storage"
 extra_ammo_storage_desc: "Additional racks of ready ammunition allow the tank to stay in the fight much longer without resupply. However, if the armor is penetrated, the results are likely to be catastrophic. This is particularly problematic when attacking."
 turret_mounted_manpad_tech: "Turret Mounted MANPAD"
 turret_mounted_manpad_tech_desc: "Once laughed at by western 'military experts' in an ever increasing age of drone attacks; Turret mounted MANPADS operated internally, safe from outside attacks, may prove highly beneficial."
 turret_mounted_manpad: "Turret Mounted MANPAD"
 turret_mounted_manpad_desc: ""
 electronic_warfare_system: "Electronic Warfare System"
 electronic_warfare_system_desc: "A small and easily attachable EW system to protect the tank from increasingly more active FPV drones on the battlefield."
 wet_ammo_storage: "Blow-out Compartment"
 wet_ammo_storage_desc: "Ammunition stored in seperate blast-proof section of the tank dramatically reduses the chance of the crew being killed by a critical ammunition cook off"
 turret_mounted_atgm: "Turret Mounted ATGM"
 turret_mounted_atgm_desc: "An ATGM mounted on the turret of the tank allows for greater firepower, though the commander must expose himself in order to use it."
 active_protection_system: "Advanced Hardkill Active Protection System"
 active_protection_system_desc: "Truely next generation technology, APS allows for the tank to engage threats such as oncoming RPG rounds and elimnate them without the crew needing to take action."
 armor_tech_1_tt: "Enables Armor Upgrade values of 5 and above."
 armor_tech_2_tt: "Enables Armor Upgrade values of 10 and above."
 armor_tech_3_tt: "Enables Armor Upgrade values of 15 and above."
 armor_tech_4_tt: "Enables Armor Upgrade values of 18 and above."
