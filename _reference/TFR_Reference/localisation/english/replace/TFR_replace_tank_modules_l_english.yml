 light_tank_chassis: "Reconnaissance Tank"
 medium_tank_chassis: "Medium Tank"
 heavy_tank_chassis: "Heavy Tank"
 light_tank_chassis_0: "Early Light Tank Chassis"
 light_tank_chassis_desc: "A small and compact chassis, ideal for a cheap and light vehicle for duties such as reconnaisance and fire support. Its limited load capacity makes it unsuited for carrying heavy armor or large guns."
 light_tank_chassis_1: "Basic Light Tank Chassis"
 basic_light_tank_chassis: "Basic Light Tank Chassis"
 basic_light_tank_chassis_short: "Reconnaissance Tank Chassis II"
 basic_light_tank_chassis_desc: "Technological advances have made the designs of the immediate post-war period effectively obsolete. The modern battlefield requires a new, clean design incorporating advances in metallurgy and interior layout."
 light_tank_chassis_2: "Improved Light Tank Chassis"
 improved_light_tank_chassis: "Improved Light Tank Chassis"
 improved_light_tank_chassis_short: "Reconnaissance Tank Chassis III"
 improved_light_tank_chassis_desc: "A further iteration based on the experiences gained with previous light tanks, this chassis allows for better reliability and maintenance."
 light_tank_chassis_3: "Advanced Light Tank Chassis"
 advanced_light_tank_chassis: "Advanced Light Tank Chassis"
 advanced_light_tank_chassis_short: "Reconnaissance Tank Chassis IV"
 advanced_light_tank_chassis_desc: "With medium tanks increasingly taking center stage in the fight, light tanks have largely been relegated to supporting roles. A new chassis design is needed that takes the needs of these roles into account."
 light_tank_amphibious_chassis_0: "Inter-War Light Tank Chassis (Amphibious)"
 light_tank_amphibious_chassis_1: "Basic Light Tank Chassis (Amphibious)"
