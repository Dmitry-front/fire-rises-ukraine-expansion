 # Decisions
 UKR_establish_border_defense_system:0 "Establish Border Defense System"
 UKR_appeal_to_un_security_council:0 "Appeal to the UN Security Council"
 UKR_request_nato_partnership:0 "Request NATO Partnership"
 
 UKR_special_military_operation:0 "Armed Forces of Ukraine"  
 UKR_special_military_operation_desc:0 "Originally formed based on the Soviet military system, the Armed Forces of Ukraine have undergone a transformation to adapt to modern challenges. Large-scale reforms are underway: professional units are being established, intelligence capabilities are being enhanced, and advanced technologies are being implemented. The Ukrainian Armed Forces are evolving into an independent and highly effective force, capable not only of defending national sovereignty but also of setting new standards for warfare in the 21st century."  

 UKR_novorossiyan_offensive_decision:0 "Novorossiya Offensive"
 UKR_novorossiyan_offensive_decision_desc:0 "Strategic operation to reclaim territories in Eastern Ukraine"
 UKR_first_mobilization_wave:0 "First Mobilization Wave"
 UKR_first_mobilization_wave_desc:0 "Priority mobilization campaign aimed at the urgent staffing of the Armed Forces of Ukraine with personnel. Encompasses conscripts and reservists of categories A1 and A2. The mobilization provides for the conscription of up to 100,000 servicemen with subsequent three-month accelerated training course in the combat zone."
 UKR_second_mobilization_wave:0 "Second Mobilization Wave"
 UKR_second_mobilization_wave_desc:0 "Second strategic mobilization campaign aimed at staffing the Armed Forces of Ukraine with personnel, taking into account the operational situation. Encompasses conscripts and reservists of categories B1 and B2, with special attention to the training of armored forces, artillery, and air defense units specialists. The mobilization provides for the conscription of up to 125,000 servicemen with intensive training in real theater of military operations conditions."
 UKR_third_mobilization_wave:0 "Third Mobilization Wave"
 UKR_third_mobilization_wave_desc:0 "Final stage of large-scale conscription during a critical period of confrontation. Mobilization encompasses conscripts and reservists of categories C1 and C2, including military-trained citizens of older age groups and narrow-profile specialists."
 
 UKR_political_decisions:0 "Political Decisions"
 UKR_political_decisions_desc:0 "2020 has become a period of trials and opportunities for Ukraine. \n\nDomestic policy is characterized by the ongoing fight against corruption and the need for reforms to strengthen democratic institutions. \n\nIn the east of the country, tensions persist due to the ongoing conflict. \n\nForeign policy is aimed at deepening integration with the European Union and NATO, as well as finding support from the international community to resolve the conflict and ensure the territorial integrity of Ukraine. \n\nThe strategic situation requires strengthening the country's defense capabilities and finding ways for a peaceful settlement of the conflict."
 UKR_establish_border_defense_system_desc:0 "In conditions of growing tension, it is necessary to strengthen the country's defensive lines to protect our borders."
 UKR_appeal_to_un_security_council_desc:0 "The international community must be aware of the violations and threats that Ukraine faces. We must appeal to the UN Security Council for support."
 UKR_request_nato_partnership_desc:0 "To ensure the country's security, it is necessary to deepen cooperation with NATO and aspire to membership in the alliance."
 
 political_pressure:0 "Political Pressure"
 political_pressure_desc:0 "International pressure on Ukraine."
 diplomatic_support:0 "Diplomatic Support"
 diplomatic_support_desc:0 "Diplomatic support for Ukraine."
 hostile_status:0 "Hostile Status"
 hostile_status_desc:0 "Hostile attitude towards Ukraine."
 military_cooperation:0 "Military Cooperation"
 military_cooperation_desc:0 "Military cooperation with Ukraine."
 
 ukraine_category_name:0 "Ukrainian Foreign Policy"
 ukraine_influence_belarus:0 "Influence Belarus"
 ukraine_influence_belarus_desc:0 "Ukrainian officials establish discreet contact with their Belarusian counterparts through unofficial channels. Friendly meetings, diplomatic receptions, and casual hallway conversations at international summits-behind polite smiles lie hints, questions, and offers. 'The choice is always yours, but stability comes in many forms,' is the message between the lines. No promises are made, but the signals are clear."
 
 UKR_startup_ecosystem_category:0 "Ukrainian Startup Ecosystem"
 UKR_startup_ecosystem_category_desc:0 "After Volodymyr Zelensky's election as president in 2019, the Ukrainian government has taken a course towards active support of the IT sector and technology startups. The 'Diia City' concept and other initiatives aim to create favorable conditions for technology businesses. According to the National IT Association, by 2019, Ukraine's IT industry was showing annual growth of 20-25%, providing more than 4% of the country's GDP and being the third-largest export sector with a revenue of about $4.5 billion. The Zelensky government aims to transform Ukraine into a leading technology hub in Eastern Europe, increasing the share of IT in GDP to 10% by 2025."
 
 
 UKR_national_startup_fund:0 "Creation of the Ukrainian Startup Fund"
 UKR_national_startup_fund_desc:0 "The Ukrainian Startup Fund (USF), established by the Cabinet of Ministers of Ukraine's Resolution No. 740 of July 12, 2019, is a state fund with an initial budget of 440 million hryvnias (about $18 million). The fund's mission is to provide early-stage funding for technology startups through a transparent selection process. USF offers grants at the pre-seed stage of up to $25,000 and at the seed stage up to $50,000, with the possibility of receiving both grants for a total of up to $75,000. By the end of 2020, USF had funded more than 80 startups for a total of about $2 million, and by 2021 - more than 200 projects. The government expects that by 2025, startups supported by USF will create more than 10,000 high-paying jobs and attract at least $100 million in foreign investment into the Ukrainian economy."
 
 UKR_diia_city_initiative:0 "Implementation of the Diia City Special Legal Regime"
 UKR_diia_city_initiative_desc:0 "Diia City is a special legal regime for the IT industry, developed by the Ministry of Digital Transformation and adopted by the Verkhovna Rada in 2021 (bills No. 4303 and No. 5376). This regime offers unprecedented tax conditions and legal protection for technology companies in Ukraine. Instead of the standard corporate tax of 18%, Diia City resident companies pay only a 5% tax on distributed profits. For employees, there is a reduced income tax of 5% (instead of the standard 18%), and the unified social contribution is calculated from the minimum wage, not the actual wage. Gig contracts, introduced under the regime, provide flexible employment conditions, combining the benefits of employment and private entrepreneurship. To be a resident of Diia City, a company must have at least 9 employees with an average salary of not less than the equivalent of 1,200 euros per month. According to the Ministry of Digital Transformation's estimates, by 2025, more than 2,000 companies should become residents of Diia City, and Ukraine's IT exports will reach $16.5 billion."
 
 UKR_fund_invest_in_education:0 "Investments in Technical Education"
 UKR_fund_invest_in_education_desc:0 "The Government of Ukraine, in cooperation with leading universities (Igor Sikorsky KPI, V.N. Karazin KhNU, Ivan Franko LNU, Lviv Polytechnic National University), has launched a program to modernize technical education. As part of this initiative, the Ministry of Education and Science of Ukraine has allocated more than 250 million hryvnias for updating curricula, creating innovative laboratories, and establishing practical internship programs with technology companies. The 'IT Creative' program has been introduced, providing dual education where students spend part of their time studying at the university and part working in IT companies. In cooperation with EPAM, SoftServe, GlobalLogic, and other IT companies, more than 50 joint laboratories have been created in universities. According to the government, from 2020-2022, the number of IT graduates should increase by 35%, reaching 20,000 people annually, which will help meet the growing demand for specialists, estimated at 30,000-40,000 new jobs annually in Ukraine's IT sector."
 
 UKR_create_innovation_parks:0 "Creation of Regional Innovation Parks"
 UKR_create_innovation_parks_desc:0 "Following the model of the successful UNIT.City innovation park in Kyiv, with an area of 25 hectares and investments of more than $150 million, the Ukrainian government has launched a program to create additional innovation parks in major cities of the country. LvivTech.City is being created in Lviv with an area of 1.8 hectares and investments of more than $95 million, in Kharkiv - Ecopolis KhTZ on the territory of the former Kharkiv Tractor Plant with an area of 150 hectares and planned investments of up to $1 billion, in Odesa - Odesa Innovation Park on 5 hectares. Innovation parks provide office space, research laboratories, startup accelerators, and service infrastructure for technology companies. According to the 'Ukraine - Innovation Nation' strategy developed by the Ministry of Digital Transformation, by 2025, at least 8 full-fledged innovation parks should be created in various regions of the country, which will provide jobs for more than 70,000 specialists and attract investments of at least $2 billion."

 UKR_international_tech_partnerships:0 "Formation of International Technology Partnerships"
 UKR_international_tech_partnerships_desc:0 "The Ministry of Foreign Affairs and the Ministry of Digital Transformation of Ukraine are actively working to establish partnerships with leading technology ecosystems in the USA, UK, Germany, and other EU countries. In 2019-2021, memoranda of cooperation were signed with Silicon Valley (USA), Tech City UK (UK), Station F (France), and Digital Hub Initiative (Germany). Within the framework of the EU4Digital program, work has been launched to harmonize the digital markets of Ukraine and the EU with funding of more than 11 million euros. The Ukraine Global Innovation Fund has been created with a capitalization of $100 million for joint investments with international venture funds. According to the Ukrainian Venture Capital Association, thanks to international cooperation, the volume of investments in Ukrainian technology companies grew from $336 million in 2019 to more than $500 million in 2020. By 2025, the government plans to increase this figure to $1.5 billion annually. These partnerships contribute to knowledge exchange, investment opportunities, and access to international markets for Ukrainian technology companies."

 UKR_diia_city_benefits:0 "Benefits of Diia City"
 UKR_diia_city_benefits_desc:0 "Companies registered in the Diia City legal regime receive significant tax benefits: a 5% tax on distributed profits instead of the standard corporate tax of 18%, a reduced personal income tax for employees at 5% instead of 18%, and simplified labor regulations. This system is designed to attract both domestic and foreign technology investments. According to the Ministry of Digital Transformation, the tax burden for IT companies is reduced by an average of 40%. New tools for protecting intellectual property and investments have been introduced, including employee stock option plans (ESOPs), guarantees for copyright protection, and confidential information. The Diia City legal regime provides special corporate governance mechanisms, including the possibility of concluding corporate agreements under English law. According to expert forecasts, by 2025, thanks to these advantages, the number of IT specialists in Ukraine will grow from 200,000 to 450,000 people, and Ukrainian IT exports will increase 3-4 times."

 UKR_improved_tech_education:0 "Improved Technical Education"
 UKR_improved_tech_education_desc:0 "The modernization of technical education in Ukrainian universities is producing a new generation of qualified software developers, engineers, and technology entrepreneurs, supporting the growth of the country's innovation economy. More than 30 joint educational programs have been created between universities and leading technology companies. More than 100 hackathons and technology competitions are held annually with a total prize fund of more than 5 million hryvnias. A national IT education platform has been launched with free online courses, which by 2022 had been visited by more than 500,000 Ukrainians. According to a study by the IT Ukraine association, thanks to comprehensive educational initiatives, the average salary in the IT sector has increased by 15-20% and reached $2,500-3,000 per month, which is 5-6 times higher than the average salary in the country. Improved technical education also stimulates the emergence of R&D centers of international companies: from 2019-2021, more than 20 companies, including Amazon, Viber, Ring (Amazon), Snap, and others, opened such centers in Ukraine."

 unlock_decision_tooltip:0 "Unlocks decisions on the development of the Ukrainian startup ecosystem"
 UKR_startup_ecosystem_help:0 "These decisions allow you to strengthen Ukraine's technology sector through strategic investments and policy reforms"

 UKR_anti_corruption_campaign:0 "Launch Anti-Corruption Campaign"
 UKR_anti_corruption_campaign_desc:0 "Following the 'servant of the people' program, our government must fight the endemic corruption that has plagued Ukraine for decades. Drawing inspiration from successful models in Estonia and Georgia, we will implement a comprehensive strategy aimed at transparency in government, digitization of public services, and strengthening anti-corruption institutions. According to World Bank research, reducing opportunities for corruption through e-government has proven effective in transitional economies, reducing incidents of bribery by up to 70% in some sectors. This campaign will require significant political capital but represents a first decisive step towards meaningful reforms."

 UKR_establish_high_anticorruption_court:0 "Establish the High Anti-Corruption Court"
 UKR_establish_high_anticorruption_court_desc:0 "To consolidate our anti-corruption reforms, we need to establish an independent High Anti-Corruption Court with special jurisdiction over corruption cases. International experience from countries like Indonesia and Slovakia shows that specialized anti-corruption courts significantly increase conviction rates and reduce case processing times when properly implemented and insulated from political pressure. Research by the U4 Anti-Corruption Resource Centre indicates that such courts are most successful when judges undergo rigorous vetting and receive competitive compensation to resist bribes. While establishing this institution will temporarily strain our political resources, it will create lasting accountability mechanisms and send a powerful signal to both domestic and international stakeholders that Ukraine is committed to the rule of law."
 #In-game Relations
 diplomatic_treaty_ukr:0 "Diplomatic Agreement"
 diplomatic_treaty_ukr_desc:0 "This agreement strengthens relations between our countries and promotes the development of bilateral ties."
 #Main Focus - National Renewal Strategy
 UKR_path_to_new_ukraine:0 "Path to a New Ukraine"
 UKR_path_to_new_ukraine_desc:0 "After decades of uncertainty and external threats, under President Zelensky's leadership, Ukraine stands on the threshold of historic change. The successfully initiated economic transformation allows us to define key vectors for the nation's development. We must modernize our economy, ensure energy security, strengthen defense capabilities, and revive the national spirit. Our national renewal strategy will affect all aspects of the country's life - from energy and industry to education and culture. Only a strong, independent, prosperous Ukraine will have a full-fledged voice in international relations and ensure a dignified future for the next generations of its citizens."
 UKR_new_path_tooltip:0 "Opens opportunities for comprehensive development of Ukraine in three key areas: energy security, military modernization, and national revival."
 #Nuclear Safety and Energy
 UKR_chernobyl_legacy:0 "Chernobyl Legacy"
 UKR_chernobyl_legacy_desc:0 "The Chernobyl disaster of 1986 left an indelible mark on the history of Ukraine and the entire world. The completion of the New Safe Confinement ('Arch') over the destroyed fourth power unit - a grandiose engineering project costing more than 2 billion euros - allows us to seal the reactor for the next 100 years and prevent the release of radioactive substances into the environment. This unique structure, 110 meters high and weighing 36,000 tons, created in cooperation with international partners, is the largest movable land structure in the world. The 'Arch' not only solves the environmental problems of the exclusion zone but also demonstrates Ukraine's ability to implement technologically complex projects of world-class scale. By continuing international cooperation in this field, we will not only secure the exclusion zone for future generations but also become global experts in nuclear safety, paving the way for further safe development of nuclear energy."
 UKR_modernize_nuclear_facilities:0 "Modernization of Nuclear Power Plants"
 UKR_modernize_nuclear_facilities_desc:0 "Nuclear energy accounts for more than half of Ukraine's energy balance. Four operating nuclear power plants (Zaporizhzhia, Rivne, South Ukraine, and Khmelnytskyi) with 15 power units and a total capacity of more than 13 GW are strategic objects of national security. The large-scale modernization program includes the implementation of modern safety systems according to IAEA standards, updating automation and control equipment, replacing outdated systems and components, as well as extending the operational life of power units. Special attention is paid to the development of new nuclear fuel technologies that reduce dependence on imported supplies and increase economic efficiency. The modernization also provides for the implementation of modern spent nuclear fuel storage systems and solving the problem of radioactive waste. By 2030, our nuclear power plants should meet the strictest international safety and efficiency standards, which will not only extend their service life but also significantly increase their productivity and reliability."
 UKR_energy_independence:0 "Energy Independence"
 UKR_energy_independence_desc:0 "For decades, energy dependence has been Ukraine's Achilles' heel, making us vulnerable to political and economic pressure. Today, we are finally able to ensure complete energy independence. Our strategy includes the development of synthetic fuels, construction of plants for hydrogen production from nuclear energy, and complete abandonment of Russian energy imports. Modernization of the gas transportation system, development of renewable energy sources, and creation of a closed cycle of nuclear fuel production will transform Ukraine from a hostage of neighboring countries' energy policies into a fully self-sufficient state capable of exporting surplus energy to the European Union. The introduction of the latest energy-saving technologies and smart grids will significantly increase the efficiency of our industrial enterprises, reduce resource consumption, and strengthen the country's economic sovereignty. This is not just an economic issue - it is a matter of national security and sovereignty that will determine the future of our state for decades to come."
 UKR_energy_self_sufficiency:0 "Energy Self-Sufficiency"
 UKR_factory_efficiency_increase:0 "Production efficiency is significantly increased due to stable energy supply and the introduction of new energy-saving technologies"
 #Military Modernization
 UKR_military_adaptability:0 "Military Adaptability"
 UKR_military_adaptability_desc:0 "Ukraine is focusing on the development of military engineering, repair capabilities, and adaptation of weapons to modern realities. In conditions of unstable supplies and resource shortages, the ability to quickly restore damaged equipment, modernize outdated equipment, and effectively use captured weapons plays a key role. We are expanding the network of repair bases and creating mobile maintenance brigades capable of conducting field repairs even in difficult combat conditions. Additionally, the military education system is being reformed to provide training for highly qualified specialists in mechanics, electronics, and ballistics. Modern technologies and creative engineering solutions will minimize dependence on imports, increase combat capability, and strengthen the country's defense potential."
 UKR_military_adaptability_idea:0 "Military Adaptation"
 UKR_military_adaptability_tooltip:0 "Ukraine's defense industry and engineering units focus on adapting, modernizing, and restoring military equipment. Experienced engineers and technical personnel ensure rapid conversion and repair of equipment, minimizing dependence on external supplies. Educational programs and personnel training contribute to the development of technical specialties in the army, improving the efficiency of field repairs and logistics. Flexibility and technological adaptation allow the use of captured and outdated weapons with maximum efficiency, ensuring army sustainability under limited resources."
 UKR_military_industrial_complex:0 "Military-Industrial Complex"
 UKR_military_industrial_complex_desc:0 "The Ukrainian defense industry has enormous potential, inherited from Soviet times, and is capable of providing the army with modern domestically produced weapons. The state concern 'Ukroboronprom', which unites more than 100 enterprises in five main branches of the defense industry, is ready to establish serial production of modern weapons and military equipment. Priority areas include: production of 'Oplot' tanks with enhanced protection and powerful 125-mm guns, BTR-4 with 'Parus' combat module, modernized 'Verba' and 'Vilkha' MLRS with increased range and accuracy, 'Stugna-P' and 'Korsar' anti-tank systems capable of defeating modern armored vehicles, as well as unmanned systems for various purposes. \n\nDeconservation and repair of 120 modern tanks with their subsequent transfer to the Armed Forces of Ukraine will be the first step towards complete re-equipment of our armored forces. Special attention is paid to the development and production of high-precision ammunition."
 UKR_unique_tank_mods:0 "Unlocks access to unique Ukrainian armor modernizations, including the 'Knife' active protection system, new generation dynamic protection complexes, modern sighting complexes, and fire control systems"
 UKR_special_forces_equipment:0 "Special Operations Forces Equipment"
 UKR_special_forces_equipment_desc:0 "Modern conflicts require modern solutions. Ukraine's special operations forces should become an elite, highly effective tool for protecting national interests both on its territory and beyond. The equipment program includes the purchase and development of unmanned aerial and ground-based reconnaissance systems, modern communication equipment with multi-level encryption, high-precision sniper systems for various tactical tasks, non-lethal weapons for special operations, and individual soldier equipment according to NATO standards. Special attention is paid to the development of intelligence capabilities, including the training of specialists for agent work, radio interception, and cyber operations, as well as improving the skills of counter-sabotage operations and counter-terrorism. Equipped with the latest domestic and Western equipment, our special operations forces will become not only the elite of the Ukrainian army but also a powerful tool for ensuring national security in complex geopolitical conditions."
 #National Revival
 UKR_decommunization:0 "Decommunization"
 UKR_decommunization_desc:0 "The first wave of decommunization took place in 2013-2016: the 'Leninfall', the 2015 laws banning communist and Nazi symbols, opening archives and recognizing fighters for independence, the renaming of almost a thousand settlements and tens of thousands of streets. The second wave is harder: disputes remain over what counts as heritage, how to digitize and open the archives, what to teach in schools and who should define memory policy. It must be decided whether to stop, finish the job or find a middle way."
 UKR_decommunization_decisions:0 "Opens the 'Decommunization' category of decisions, allowing specific measures to be taken to eliminate the Soviet legacy, rename objects, and update historical memory"
 soviet_legacy:0 "Soviet legacy"
 #UKR_decommunization
 #Main event
 ukraine.1000.t:0 "Decommunization: The Second Wave"
 ukraine.1000.d:0 "The first wave of decommunization took place in 2013-2016 and was loud: the 'Leninfall' toppled more than thirteen hundred monuments to Lenin, the 2015 laws banned communist and Nazi symbols, handed the archives of the repressive organs to the Institute of National Memory and recognized fighters for independence, while the Rada renamed almost a thousand settlements and tens of thousands of streets changed their names. In Kyiv-controlled Ukraine not a single monument to Lenin is left, but the disputes have not gone anywhere.\n\nWhat remains is the hardest part: Red commanders on pedestals, Soviet mosaics on facades, enormous archives on paper, textbooks that argue over the names of eras, and an Institute that many consider too political. Radicals demand finishing what was started and writing history anew, moderates propose criticizing the repressions without erasing from memory the ordinary lives of millions of people.\n\nWhat will the second wave be?"
 ukraine.1000.a:0 "Time to finish what was started: the second wave."
 UKR_decommunization_begin_tt:0 "We are beginning the process of decommunization in Ukraine. Our decisions will determine the country's future attitude toward the Soviet past."

 #Event 1: Digital Archive of Repressions
 ukraine.1001.t:0 "The Digital Archive of Repressions"
 ukraine.1001.d:0 "Since 2015 the documents of the former state security organs have been open by law: any citizen can come to the SBU archive or the Institute of National Memory, and in the first year of the law the number of requests grew by 138 percent. But the archives lie on paper, only a small percentage is digitized, and one must travel to Kyiv for the reading room. Between 1917 and 1991 millions of Ukrainians became victims of repression: the Holodomor of 1932-1933, by historians' estimates, took several million lives, in the Great Terror of 1937-1938 hundreds of thousands were shot or exiled, and in 1944 the Crimean Tatars were deported.\n\nNow the question is technical and ethical at once: digitize everything and put it online, including the personal files of victims and informants, open access in a limited way while protecting privacy, or leave the archives in reading rooms."
 ukraine.1001.a:0 "Digitize everything and open access online."
 ukraine.1001.b:0 "Digitize, but restrict access to personal data."
 ukraine.1001.c:0 "Leave it as is: the reading room and paper."
 UKR_full_archive_access_tt:0 "§RRadical approach:§! Complete opening of archives will cause public resonance and indignation among supporters of leftist ideas. Many will learn about the fates of their relatives, but informant data will also be made public, leading to conflicts."
 UKR_moderate_archive_access_tt:0 "§YModerate approach:§! A selective approach to opening archives will preserve the memory of victims without violating the privacy of descendants of both victims and those guilty of repressions."
 UKR_nope_archive_access_tt:0 "§GStatus quo:§! The archives remain in reading rooms on paper: this will prevent public upheaval but make historical reconciliation harder."

 #Event 2: Dismantling of Soviet Monuments
 ukraine.1002.t:0 "What Is Left of the Monuments"
 ukraine.1002.d:0 "By 2020 not a single monument to Lenin is left in Kyiv-controlled Ukraine: more than five hundred were removed in 2013-2014 and by 2016 the count passed thirteen hundred; together with monuments to other communist figures about two and a half thousand monuments have been dismantled. Now the argument is about what remains: monuments to Red commanders such as Shchors, bas-reliefs, mosaics on facades and squares whose names nobody has used for a long time while the old signs stubbornly hang.\n\nSome demand removing everything without exception. Others propose removing only those tied to repressions and forced sovietization, while keeping cultural figures and war heroes. Still others believe monuments are part of history, whatever it is, and that the residents of a city should decide, not Kyiv."
 ukraine.1002.a:0 "Dismantle everything that remains, without exception."
 ukraine.1002.b:0 "Let the communities decide the fate of the monuments themselves."
 ukraine.1002.c:0 "Remove only monuments to those involved in repressions."
 ukraine.1002.m:0 "Keep the monuments as historical heritage."
 UKR_full_monuments_removal_tt:0 "§RRadical approach:§! Total dismantling of all Soviet monuments will cause division in society but will demonstrate a decisive break with the communist past."
 UKR_crowd_monuments_removal_tt:0 "§RRadical approach:§! Spontaneous destruction of monuments ('Leninopad') will create an atmosphere of civil disobedience and lead to episodes of violence, but will become a symbol of people's rejection of Soviet ideology."
 UKR_selective_monuments_removal_tt:0 "§YModerate approach:§! Selective dismantling will allow preservation of culturally significant monuments while getting rid of symbols of repression."
 UKR_keep_monuments_tt:0 "§GStatus quo:§! Preserving monuments will save financial costs and social conflicts but will slow down the process of national identification."

 #Event 3: Opening KGB Archives
 ukraine.1003.t:0 "The KGB Card Files: Names of Informants"
 ukraine.1003.d:0 "The KGB archives have been open by the 2015 law, and historians read in them the files of Vasily Blokhin, the chief executioner of the NKVD who personally shot thousands of people, and of Pavel Sudoplatov, the organizer of killings of Ukrainian nationalists abroad. But the archives also hold the card files of agents and lists of informants: the names of people who cooperated with the organs out of fear, for career or from conviction.\n\nOpening them fully means getting the truth, scandals and possibly revenge: many of those recorded there are alive, and the rest have living children. Poland, Germany and Czechia resolved this question differently, and each option had its price. What policy should be chosen toward these documents?"
 ukraine.1003.a:0 "Publish everything, including the lists of informants."
 ukraine.1003.b:0 "Access only for historians and researchers."
 ukraine.1003.c:0 "Limited access to selected materials."
 ukraine.1003.m:0 "Extend the state secrecy period for these documents."
 UKR_full_archives_tt:0 "§RRadical approach:§! Complete disclosure of archives will lead to high-profile revelations, public conflicts, and reassessment of historical events."
 UKR_historians_archives_tt:0 "§YModerate approach:§! Providing access only to professional historians will ensure scientific study of documents without excessive public resonance."
 UKR_limited_archives_tt:0 "§YModerate approach:§! Limited access to selected materials will allow gradual integration of new historical facts into public consciousness."
 UKR_keep_archives_secret_tt:0 "§GStatus quo:§! Maintaining the secrecy of archives will prevent possible conflicts but will hinder the process of historical reconciliation."

 #Event 4: Historical Education Reform
 ukraine.1004.t:0 "History Education Reform"
 ukraine.1004.d:0 "There have been no Soviet textbooks in schools since the 1990s, but the arguments about what to write in them and how never die down. What to call 1917-1921: the Ukrainian Revolution, a civil war, or the struggle for the independence of the Ukrainian People's Republic? Treat the Soviet period as an occupation or as one stage of one's own history? How much space to give to the Holodomor, the insurgent movement and the ordinary lives of millions of people?\n\nThe Holodomor is already in the curriculum, the question is the tone and who decides what goes into a textbook: historians, the ministry or public opinion. Radicals want to fix the formula 'the RSFSR is an occupier', moderates want scholarly language without political formulas."
 ukraine.1004.a:0 "Call the Soviet period an occupation and revise the curricula."
 ukraine.1004.b:0 "Leave the existing textbooks unchanged."
 ukraine.1004.c:0 "Create objective textbooks based on historical facts."
 ukraine.1004.m:0 "Make repressions and the regime's crimes the main emphasis."
 UKR_radical_education_reform_tt:0 "§RRadical approach:§! Complete rewriting of history from nationalist positions will break the connection with the Soviet historical narrative but may lead to new distortions."
 UKR_no_education_reform_tt:0 "§GStatus quo:§! Preserving existing textbooks will save resources but will conserve outdated interpretations of history."
 UKR_balanced_education_reform_tt:0 "§YModerate approach:§! Creating objective textbooks based on historical facts will help form critical thinking in the younger generation."
 UKR_emphasis_crimes_education_tt:0 "§YModerate-radical approach:§! Emphasis on the crimes of the regime will highlight its totalitarian nature while maintaining recognition of the social achievements of the Soviet period."

 #Event 5: Institute of National Memory
 ukraine.1005.t:0 "Relaunching the Institute of National Memory"
 ukraine.1005.d:0 "The Institute of National Memory has existed since 2006, and since 2014 it has been the main author of the new memory policy: the laws on fighters for independence, archives, renamings. Its work is praised for scale and criticized for politicization, and in December 2019 the leadership changed and the new director promises a different tone. The decision on its mandate is still to be made: what should the Institute be going forward?\n\nIt can remain an instrument of decommunization and Europeanization, promoting Western assessments of history, or become a scholarly center that acknowledges the complexity and ambiguity of the past. A special line is the Holodomor: a separate direction of research and commemoration would help to better understand its causes and consequences.\n\nWhich model of the Institute do we choose?"
 ukraine.1005.a:0 "The Institute as an instrument of decommunization and Europeanization."
 ukraine.1005.b:0 "Leave the Institute as it is: no new mandate and no money."
 ukraine.1005.c:0 "The Institute as a scholarly center of historical objectivity."
 ukraine.1005.m:0 "Make the study of the Holodomor the Institute's main direction."
 UKR_european_memory_tt:0 "§RRadical approach:§! The institute will actively promote European values and interpretations of history, contributing to Ukraine's integration into the Western cultural context."
 UKR_no_memory_institute_tt:0 "§GStatus quo:§! The Institute keeps its old mandate and budget: this saves funds but makes it harder to form a systematic memory policy."
 UKR_objective_memory_tt:0 "§YModerate approach:§! The institute will strive for historical objectivity, recognizing the complexity and ambiguity of the past."
 UKR_holodomor_memory_tt:0 "§YModerate-radical approach:§! Focus on Holodomor research will emphasize the tragic nature of Soviet policy towards Ukraine but maintain a scientific approach to history."

 #Final event
 ukraine.1006.t:0 "Results of Decommunization"
 ukraine.1006.d:0 "The second wave of decommunization is coming to an end. In recent years we have made decisions about archives, monuments, textbooks and the Institute, and society has had time to discuss them, dispute them and partly forget them. What remains is to assess the outcome.\n\nOur decisions have shaped a certain approach to historical heritage, and it will define public conversation and national identity for many years. What legacy will we leave to the next generations and what conclusions will they draw from our memory policy?"
 ukraine.1006.a:0 "Radical decommunization successfully completed!"
 ukraine.1006.b:0 "Moderate decommunization has borne fruit"
 ukraine.1006.c:0 "Mixed approach gave ambiguous results"
 ukraine.1006.m:0 "The process of decommunization has failed..."
 UKR_radical_path_completed_tt:0 "§RRadical decommunization:§! We have completely severed ties with the Soviet past, rewritten history from nationalist positions, and cleansed public space of communist symbolism. This has caused certain tensions in society but strengthened Ukrainian national identity and accelerated integration into the Western cultural context."
 UKR_moderate_path_completed_tt:0 "§YModerate decommunization:§! We have critically revised the Soviet heritage, recognized the crimes of the totalitarian regime, but maintained an objective approach to history. This has contributed to public reconciliation and the formation of a more mature national identity based on facts rather than myths."
 UKR_mixed_path_completed_tt:0 "§YMixed approach:§! Our decisions were not consistent, which led to ambiguous results. In some areas we showed radicalism, in others - moderation or even conservatism. This created certain confusion in historical policy but allowed us to take into account the diversity of opinions in Ukrainian society."
 UKR_bad_path_completed_tt:0 "§GFailure of decommunization:§! We could not develop a clear policy regarding the Soviet heritage, which led to the preservation of old interpretations of history and symbolism. This slowed down the formation of a modern Ukrainian identity and caused disappointment among patriotically minded citizens."
 UKR_decommunization_category:0 "Decommunization Measures"
 UKR_decommunization_category_desc:0 "Decommunization remains a crucial aspect of Ukraine's historical policy, aiming to remove Soviet legacy, strengthen national identity, and reshape historical narratives. These measures range from dismantling Soviet-era monuments to reforming historical education and opening intelligence archives. While controversial, these actions play a significant role in shaping Ukraine’s future."

 UKR_digital_repressions_archive:0 "Digitization of Repression Archives"
 UKR_digital_repressions_archive_desc:0 "The paper archives of repressions have been open since 2015, but one must travel to Kyiv for the reading room. The project converts documents to digital form and decides what to publish online and what to leave for historians and the families of victims. This step aims to commemorate the victims and give society access to historical materials."

 UKR_monuments_removal:0 "Dismantling Soviet Monuments"
 UKR_monuments_removal_desc:0 "After the 'Leninfall' Red commanders on pedestals, mosaics, bas-reliefs and disputed names remained. The decision determines what to remove and what to keep as history, and who decides: Kyiv, local communities or historians."

 UKR_kgb_archives:0 "KGB Archives: Card Files"
 UKR_kgb_archives_desc:0 "The documents of the former state security organs have been open under the 2015 law, but the question of agent card files and lists of informants remains disputed. The decision determines which materials to publish and which to leave for historians."

 UKR_history_education_reform:0 "Reform of Historical Education"
 UKR_history_education_reform_desc:0 "A revision of school and university curricula: what to call an occupation, how to teach the revolution of 1917-1921, the Holodomor and the insurgent movement. The ministry decides, but so does public debate."

 UKR_national_memory_institute:0 "Relaunching the Institute of National Memory"
 UKR_national_memory_institute_desc:0 "The Institute has existed since 2006 and since 2014 has been the main author of memory policy. The decision defines its mandate and priorities: an instrument of decommunization and Europeanization, a scholarly center, or a separate Holodomor track."
 UKR_national_memory_institute_radical:0 "Memory Institute: Decommunization Course"
 UKR_national_memory_institute_radical_desc:0 "The National Memory Institute has become a tool of active decommunization: renamings, archives, legislative initiatives. The state speaks about the past firmly and unambiguously, which unites some and irritates others."
 UKR_national_memory_institute_moderate:0 "Memory Institute: Historical Objectivity"
 UKR_national_memory_institute_moderate_desc:0 "The institute works as a scholarly body: open archives, research, discussions with historians from different countries. Slower, but without unnecessary scandals."
 UKR_national_memory_institute_moderate_Holodomor:0 "Holodomor Memory Institute"
 UKR_national_memory_institute_moderate_Holodomor_desc:0 "The institute's main focus is the study of the Holodomor and commemorating its victims. A shared tragedy unites society more strongly than any slogan."

 UKR_radical_decommunization_complete:0 "Radical Decommunization"
 UKR_radical_decommunization_complete_desc:0 "With a decisive break from the Soviet past, Ukraine has fully implemented radical decommunization. The dismantling of communist symbols, purging of pro-Soviet elements from state institutions, and strict ideological policies ensure the irreversibility of this course. While this strengthens national resilience, it also deepens ideological divisions with leftist movements."

 UKR_moderate_decommunization_complete:0 "Moderate Decommunization"
 UKR_moderate_decommunization_complete_desc:0 "Ukraine has adopted a balanced approach to decommunization, removing Soviet-era influences while maintaining political stability. The country prioritizes democratic values and academic progress, gradually reforming institutions without radical purges. This strategy fosters economic growth and international cooperation while avoiding excessive polarization."

 UKR_mixed_decommunization_outcome:0 "Mixed Approach to Decommunization"
 UKR_mixed_decommunization_outcome_desc:0 "A pragmatic course has been taken in decommunization, blending elements of reform and continuity. While communist and far-right ideologies lose influence, social democrats gain more presence in national discourse. The approach balances ideological transformation with economic pragmatism, promoting academic and social development."  

 UKR_ukrainian_renaissance:0 "Ukrainian Renaissance"
 UKR_ukrainian_renaissance_desc:0 "The revival of Ukrainian culture, language, and identity is not just a symbolic gesture but a strategic necessity in the conditions of information confrontation. The cultural revival of Ukraine is no less important than economic development or strengthening defense capabilities. State support for Ukrainian cinema (through the system of grants and subsidies from the State Film Agency), literature (the 'Ukrainian Book' program), music, theater, and other arts will attract creative youth and create conditions for the formation of a new cultural elite. Ukrainization of the information space through a system of quotas for Ukrainian-language content on radio and television, launching new cultural projects and channels, increasing the competitiveness of Ukrainian media products against Russian cultural expansion. \n\nThe 'Cultural Diplomacy' program provides for holding festivals of Ukrainian culture abroad, participating in international creative projects, and creating a positive image of the country. By strengthening our cultural identity, we create the basis for national unity and resist external information threats."
 UKR_cultural_reforms:0 "Cultural Reforms"
 UKR_culture_decisions:0 "Opens the 'Cultural Development' category of decisions, expanding opportunities for supporting national culture, the Ukrainian language, and promoting cultural projects"
 UKR_education_reform:0 "Education Reform"
 UKR_education_reform_desc:0 "The future of the nation is formed in classrooms and laboratories. School education is being transformed with an emphasis on a competency-based approach, introducing 12-year education with specialized education in senior classes. In higher education, university autonomy will be strengthened, anti-plagiarism systems and mechanisms of academic integrity will be implemented, and double diploma programs with European universities will be developed. Special attention is paid to the development of exact sciences, IT education, and engineering specialties to ensure technological breakthrough. The reform provides for the creation of a network of modern research laboratories with the latest equipment, attracting foreign scientists, and returning Ukrainian scientific personnel from abroad."
 UKR_education_future:0 "Education of the Future"
 # Technologies and Ideas
 UKR_nuclear_reactor_up:0 "Nuclear Reactor Modernization"
 UKR_synth_resources:0 "Synthetic Resources"

 # COVID Focuses
 UKR_address_covid_threat:0 "Address the COVID-19 Threat"
 UKR_address_covid_threat_desc:0 "The novel coronavirus, rapidly spreading across the globe, has reached our nation's borders.  The COVID-19 pandemic poses an unprecedented threat not only to the health of our citizens but also to the economic stability and national security of Ukraine.  The government must take immediate action to protect the population, mobilize medical resources, and minimize the socio-economic consequences of the crisis.  The time to act decisively is now - every day of delay could cost hundreds of lives and billions of hryvnias.  Only coordinated efforts from all branches of government and society will allow Ukraine to overcome this global challenge with minimal losses."

 # COVID Decision Names
 UKR_implement_adaptive_quarantine:0 "Implement Adaptive Quarantine"
 UKR_expand_healthcare_budget:0 "Expand Healthcare Budget"
 UKR_healthy_nation_program:0 "Launch the 'Healthy Nation' Program"
 UKR_vaccinate_population:0 "Vaccinate the Population"
 UKR_enforce_lockdowns:0 "Enforce Strict Lockdowns"
 UKR_use_army_aganist_covid:0 "Utilize the Army Against COVID-19"

 # COVID Decision Descriptions
 UKR_implement_adaptive_quarantine_desc:0 "In the face of the rapidly spreading COVID-19 pandemic, traditional methods of combating epidemics are proving ineffective.  Adaptive quarantine will allow us to implement restrictions based on the epidemiological situation in specific regions, dividing the country into 'zones' of varying levels of risk. This will help maintain a balance between the health of citizens and the functioning of the economy."

 UKR_expand_healthcare_budget_desc:0 "Ukraine's healthcare system was unprepared for a large-scale pandemic.  Urgently expanding the funding of the medical sector will allow us to purchase necessary equipment for hospitals, create additional bed capacity, and provide medical personnel with personal protective equipment.  Investing in healthcare is not just a measure against COVID-19, but a strategic investment in the future of the nation."

 UKR_healthy_nation_program_desc:0 "The pandemic has shown how important the overall health of the population is in resisting new threats.  The 'Healthy Nation' program will include information campaigns on disease prevention, the promotion of healthy lifestyles, and measures to strengthen the immunity of citizens.  Special attention will be paid to the development of sports at home: a series of online workouts, recommendations for organizing physical activity in a confined space, and advice on strengthening immunity through proper nutrition and daily routines. Through television and social media, citizens will have access to quality educational materials that will help them maintain their health even under quarantine restrictions. Let our people emerge from the pandemic stronger and healthier than ever before."

 UKR_vaccinate_population_desc:0 "From 2021 Ukraine begins to get vaccines, and the road to a final victory over the pandemic opens. The campaign runs for 40 days: vaccination points in service centres and clinics, mobile teams, queues and unhappy people in the queues. Each week of such a campaign takes some stability from the government, but at the end the COVID-19 crisis can be considered over."

 UKR_enforce_lockdowns_desc:0 "In the face of a critical increase in the incidence of the disease, we are forced to take decisive measures.  The introduction of a strict lockdown will temporarily limit economic activity and the freedom of movement of citizens, but will break the chains of virus transmission and reduce the burden on the medical system.  Strict restrictions today mean saved lives tomorrow."

 UKR_use_army_aganist_covid_desc:0 "In an emergency situation, it is necessary to use all available resources.  Servicemen of the Armed Forces of Ukraine can provide invaluable assistance in the fight against the pandemic: from deploying field hospitals to ensuring compliance with quarantine measures.  Army discipline and organization will help us overcome the crisis with minimal losses."

 # COVID Effects and Tooltips
 UKR_adaptive_quarantine_tooltip:0 "The introduction of adaptive quarantine will allow for a more flexible response to the epidemiological situation in different regions."
 UKR_expanded_healthcare_budget_tooltip:0 "Additional funding for healthcare will help deal with the crisis, but will temporarily reduce budget revenues."
 UKR_healthy_nation_initiative_tooltip:0 "The 'Healthy Nation' program will increase public awareness of COVID-19 prevention and improve public health."
 # COVID Decision Category
 UKR_covid_response_decisions:0 "Combating the COVID-19 Pandemic"
 UKR_covid_response_decisions_desc:0 "The coronavirus pandemic has become a serious challenge for Ukraine.  The government must take a number of measures to contain the spread of the infection, support the healthcare system, and minimize economic losses.  How quickly the country can overcome the crisis and return to normal life depends on the effectiveness of these decisions."

 # COVID National Spirits
 UKR_adaptive_quarantine:0 "Adaptive Quarantine"
 UKR_adaptive_quarantine_desc:0 "A system of restrictive measures based on dividing the country's territory into zones with different levels of epidemiological risk.  Each zone has its own set of restrictions depending on the incidence rates.  This approach allows to contain the spread of infection without completely stopping economic activity throughout the country, but requires significant administrative resources for monitoring and coordination."

 UKR_expanded_healthcare_budget:0 "Expanded Healthcare Budget"
 UKR_expanded_healthcare_budget_desc:0 "A significant increase in funding for the medical sector to combat the pandemic.  Additional funds are allocated for the purchase of ventilators, oxygen concentrators, personal protective equipment for medical workers, expansion of bed capacity, and additional payments to medical personnel.  These expenses place a heavy burden on the state budget, but are necessary to save the lives of citizens and prevent the collapse of the healthcare system."

 UKR_healthy_nation_initiative:0 "'Healthy Nation' Initiative"
 UKR_healthy_nation_initiative_desc:0 "A comprehensive state program aimed at strengthening the health of the population during the pandemic.  It includes a broad information campaign on COVID-19 prevention, the promotion of home exercise, recommendations for proper nutrition and daily routines to maintain immunity.  Participants in the program - famous athletes, doctors, and nutritionists - regularly conduct online classes and consultations.  The initiative not only helps citizens stay in shape during quarantine, but also promotes a more responsible attitude towards their own health."

 UKR_covid_crisis:0 "COVID-19 Crisis"
 UKR_covid_crisis_desc:0 "The coronavirus pandemic has caused a serious crisis in healthcare, the economy, and the social sphere.  Overcrowded hospitals, shortages of medical personnel and equipment, falling production, rising unemployment, and social tension - all this has become a reality for Ukraine.  The state is forced to balance between the need for strict quarantine measures to protect the health of citizens and maintaining economic activity.  Overcoming the crisis requires making difficult, sometimes unpopular decisions and mobilizing all available resources."

 # COVID-19 Start Event
 ukraine.400.t:0 "COVID-19 Reaches Ukraine"
 ukraine.400.d:0 "On March 3 the Ministry of Health confirms the first coronavirus case in Ukraine: a resident of Chernivtsi returned from Italy via Romania, tested positive and was hospitalised. In the coming days the government prepares a nationwide quarantine, closes schools, universities and cinemas, and borders for foreigners will be closed a few days later. In shops buckwheat and toilet paper are cleared from the shelves, masks vanish from pharmacies, and in the chats people argue about when all this will end.\n\nThe healthcare system, underfunded for years and reformed in parallel, finds itself between two fires: there are few hospitals and many responsible people. Experts warn that this is only the beginning, and unfortunately they turn out to be right."
 ukraine.400.a:0 "We must take decisive action."

 # COVID-19 End Event
 ukraine.401.t:0 "The COVID-19 Pandemic is Defeated"
 ukraine.401.d:0 "Today, the Ministry of Health of Ukraine announced the complete lifting of all anti-epidemic restrictions related to COVID-19.  Over the past two months, the number of new cases has consistently remained at a minimum level, and the healthcare system is operating normally.\n\nThe pandemic has been a serious challenge for our country.  We have lost many citizens, the economy has suffered significant damage, and some industries have not yet returned to pre-crisis levels.  However, the crisis also showed the ability of Ukrainian society to unite in the face of a threat and adapt to new realities.\n\nThe country's medical system has undergone significant development, new protocols for the treatment and prevention of infectious diseases have been introduced.  Many citizens have become more responsible about their health and hygiene.  These positive changes will remain with us even after the pandemic ends.\n\nAlthough COVID-19 has not completely disappeared, it no longer poses such a serious threat to public health as before.  Ukraine can finally turn this page of history and focus on recovery and development."
 ukraine.401.a:0 "We have endured this trial."

 # Tooltip for effect
 UKR_covid_tt:0 "The COVID-19 pandemic in Ukraine..."
 UKR_covid_over_tt:0 "The COVID-19 pandemic in Ukraine is over."

 # Decision category
 UKR_against_occupiers:0 "Confronting the Aggressor"
 UKR_against_occupiers_desc:0 "In this hour of trial, we must use all possible means to resist Russian aggression. Through diplomatic and military methods, we will ensure Ukraine's sovereignty."
 
 # International support decisions
 UKR_resistance_coalition:0 "Form a Resistance Coalition"
 UKR_resistance_coalition_desc:0 "Russia counted on the disunity of the international community. We need to create a coalition of democratic countries to support our struggle. European partners are ready to provide political and material support to Ukraine in confronting aggression."
 
 UKR_idea_resistance_coalition:0 "Resistance Coalition"
 UKR_idea_resistance_coalition_desc:0 "A united coalition of Western countries provides political, economic, and military support to Ukraine. This strengthens our position in the diplomatic arena and raises the morale of the population."
 
 UKR_regional_alliance:0 "Regional Defense Alliance"
 UKR_regional_alliance_desc:0 "Eastern European countries, sharing a common experience of resisting Russian pressure, are ready for closer defensive cooperation. Poland, the Baltic states, and Ukraine can create a regional bloc that will strengthen our collective security."
 
 UKR_idea_regional_alliance:0 "Eastern European Defense Alliance"
 UKR_idea_regional_alliance_desc:0 "Joint efforts of Eastern European countries to counter the Russian threat. The alliance provides for intelligence sharing, coordination of military actions, and logistical support."
 
 UKR_idea_regional_alliance_member:0 "Member of the Eastern European Defense Alliance"
 UKR_idea_regional_alliance_member_desc:0 "Our country is part of a regional alliance aimed at deterring Russian aggression in Eastern Europe."
 
 UKR_lend_lease_program:0 "Lend-Lease Program"
 UKR_lend_lease_program_desc:0 "Our Western partners are ready to provide necessary weapons and military equipment through a program similar to the historical US aid to allies during World War II. This is critically important for our ability to resist superior enemy forces."
 
 UKR_idea_lend_lease:0 "Western Lend-Lease"
 UKR_idea_lend_lease_desc:0 "Hundreds of weapons and thousands of equipment units are coming to the Ukrainian army from Western allies, significantly increasing our combat capability and allowing us to compensate for the enemy's numerical superiority."
 
 #Flot and Port
 UKR_port_infrastructure_investment:0 "Modernization of Odesa Port Infrastructure"
 UKR_port_infrastructure_investment_desc:0 "After the loss of Crimea and Russian aggression, the Odesa Port becomes a critically important node of the national economy. Before 2014, the port processed over 25 million tons of cargo annually, but the loss of Crimea reduced cargo turnover by 40%. Modernization includes expanding container terminals, reconstructing berth facilities, and implementing modern logistics technologies. Our goal is to increase cargo turnover to 35 million tons and transform Odesa into a key transport hub of the Black Sea region."

 UKR_maritime_revival:0 "Revival of Naval Potential"
 UKR_maritime_revival_desc:0 "After the annexation of Crimea, the Ukrainian Navy lost over 70% of its fleet. Today, two patrol boats of the 'Island' project remain in service - 'Glory to Ukraine' and 'Independence'. The fleet revival strategy involves creating a modern base in Odesa, purchasing new patrol vessels, and developing maritime aviation. Special emphasis is placed on light, high-speed boats capable of effectively operating in asymmetric warfare conditions."

 UKR_convoy_fleet_development:0 "Development of Maritime Trade"
 UKR_convoy_fleet_development_desc:0 "The trade war with Russia led to a collapse of bilateral trade from $38 billion in 2013 to less than $4 billion in 2022. Ukraine is forced to restructure logistics routes. The merchant fleet development program includes creating a national trading fleet capable of operating under blocked port conditions and alternative maritime corridors. Plans include increasing the number of bulk carriers and container ships to diversify international trade."

 UKR_maritime_doctrine_adaptation:0 "Adaptation of Naval Doctrine"
 UKR_maritime_doctrine_adaptation_desc:0 "The new naval doctrine considers lessons from the conflict in the Azov Sea and the loss of Crimea. Key principles: mobility, asymmetric actions, and high-tech weaponry. Special attention is given to unmanned maritime technology, coastal strike complexes, and integration of maritime components with land and air forces. The goal is to create a fleet capable of effectively operating in hybrid warfare conditions."

 UKR_maritime_defense_strategy:0 "Comprehensive Maritime Defense Strategy"
 UKR_maritime_defense_strategy_desc:0 "The strategy involves creating a multi-level maritime security system. Key elements include developing coastal defense systems with anti-ship missile complexes, creating a network of marine and air sensors, and preparing special maritime units for operations in complex tactical situations. Particular emphasis is placed on cyber defense and electronic warfare to counter Russian naval forces."

 UKR_port_infrastructure_tooltip:0 "Comprehensive Modernization of Port Infrastructure"
 UKR_convoy_fleet_development_tooltip:0 "Creation of a Modern Merchant Fleet"
 UKR_maritime_defense_strategy_tooltip:0 "Formation of an Effective Maritime Defense System"


 # Internal security decisions
 UKR_SBU_emergency_powers:0 "SBU Emergency Powers"
 UKR_SBU_emergency_powers_desc:0 "In wartime conditions, it is necessary to grant the Security Service of Ukraine expanded powers for effectively countering Russian agents, sabotage groups, and enemy propaganda on our territory."
 
 UKR_idea_SBU_emergency_powers:0 "Enhanced Counterintelligence Regime"
 UKR_idea_SBU_emergency_powers_desc:0 "The Security Service of Ukraine conducts active measures to identify spies, saboteurs, and supporters of the enemy. This increases our internal security, but requires additional resources and causes some damage to civil liberties."
 
 # Logistics and economy decisions
 UKR_carpathian_logistics_plan:0 "Carpathian Logistics Plan"
 UKR_carpathian_logistics_plan_desc:0 "The Carpathian region, with its mountainous terrain and hard-to-reach territories, can become a reliable rear for our military operations. The development of a special logistics plan, including the creation of backup fuel depots and the establishment of protected supply routes, will significantly strengthen our defensive position."
 
 UKR_idea_carpathian_logistics:0 "Carpathian Logistics Network"
 UKR_idea_carpathian_logistics_desc:0 "An extensive network of protected supply routes and depots in the Carpathian region provides a reliable rear for our armed forces. Even in case of temporary loss of control over eastern territories, we maintain logistical sustainability."
 
 UKR_civilian_vehicle_adaptation:0 "Civilian Vehicle Adaptation"
 UKR_civilian_vehicle_adaptation_desc:0 "In conditions of shortage of standard military equipment, it is necessary to mobilize and adapt civilian vehicles for military needs. Trucks, buses, and even tractors, after appropriate modification, can perform various tasks at the front."
 
 UKR_idea_adapted_civilian_vehicles:0 "Adapted Civilian Vehicles"
 UKR_idea_adapted_civilian_vehicles_desc:0 "Thousands of civilian vehicles have been modified for military purposes. Although they are inferior to specialized military equipment, their quantity and availability partially compensate for the technological superiority of the enemy."
 
 # Military preparation decisions
 UKR_air_defense_priority:0 "Air Defense Priority"
 UKR_air_defense_priority_desc:0 "The superiority of the Russian Air Force poses a serious threat. It is necessary to focus efforts on strengthening our air defense to protect key infrastructure facilities and troop formations."
 
 UKR_idea_air_defense_priority:0 "Enhanced Air Defense"
 UKR_idea_air_defense_priority_desc:0 "Concentrating resources on the development of air defense systems allows us to partially neutralize the enemy's air superiority. Key cities and military facilities are protected by air defense systems."
 
 UKR_minefield_key_directions:0 "Mining Key Directions"
 UKR_minefield_key_directions_desc:0 "Establishing minefields in the likely directions of enemy advance will significantly slow down the movement of enemy troops and increase their losses. Although this will create long-term problems for the civilian population, under current conditions it is a necessary measure."
 
 UKR_idea_minefields:0 "Extensive Minefields"
 UKR_idea_minefields_desc:0 "The most likely routes of enemy advance have been turned into dangerous minefields. This significantly slows down the advancement of enemy troops and increases their losses, but creates long-term humanitarian problems for the local population."
 
 # Rapid Armored Thrust
 UKR_rapid_armored_thrust:0 "Rapid Armored Thrust"
 UKR_rapid_armored_thrust_desc:0 "Concentration of armored units for a powerful breakthrough of the enemy's defense line, followed by rapid advancement deep into territory, cutting off supply routes and encircling the opponent. Based on 'lightning war' tactics, adapted to modern combat conditions."

 # Bayraktar TB2 Strike Coordination
 UKR_bayraktar_strike_coordination:0 "Bayraktar TB2 Strike Coordination"
 UKR_bayraktar_strike_coordination_desc:0 "Using Bayraktar TB2 drones for precision strikes on command posts, air defense systems, and enemy armor. Operational application of aerial reconnaissance data allows for effective coordination of ground forces and aviation actions."

 # Joint NATO Intelligence Operation
 UKR_nato_intelligence_operation:0 "Joint NATO Intelligence Operation"
 UKR_nato_intelligence_operation_desc:0 "Establishing close cooperation with NATO intelligence services to obtain up-to-date information about enemy troop movements, intentions, and vulnerabilities. Access to satellite data, communications interception, and allies' analytical expertise significantly increases the effectiveness of operation planning."

 # Night Raids Operation
 UKR_night_raids_operation:0 "Night Raids Operation"
 UKR_night_raids_operation_desc:0 "Conducting night raids by special forces units using modern night vision equipment. Sudden attacks during darkness disorganize the enemy, undermine their morale, and disrupt logistical chains, creating constant pressure on enemy positions."

 # Dnipro-Kyiv-Kherson Triangle Defense
 UKR_strategic_triangle_defense:0 "Dnipro-Kyiv-Kherson Triangle Defense"
 UKR_strategic_triangle_defense_desc:0 "Creating a fortified defensive perimeter connecting the strategically important cities of Dnipro, Kyiv, and Kherson. This defensive strategy maximally utilizes natural barriers, allowing control of key transport hubs and supply lines, creating a solid shield for protecting the country's core territory."

 # Project "Asgard" - Mobile Anti-Air Defense Network
 UKR_project_asgard:0 "Project 'Asgard' - Mobile Anti-Air Defense Network"
 UKR_project_asgard_desc:0 "Development and deployment of a distributed air defense system consisting of mobile anti-aircraft missile complexes integrated into a unified information network. Constant position changes and overlapping zones of responsibility make this system difficult to target for enemy aviation and missile strikes."
 
 # "Serpent's Path" Border Assault
 UKR_serpents_path_assault:0 "'Serpent's Path' Border Assault"
 UKR_serpents_path_assault_desc:0 "Conducting a series of coordinated attacks along the border using flexible infiltration and maneuvering tactics. Like a snake, attacking forces bypass strong enemy positions, concentrating on weak areas and important control nodes. This strategy allows for maximum effective use of limited resources."
 
 # "Azov Steel" Special Operation
 UKR_azov_steel_operation:0 "'Azov Steel' Special Operation"
 UKR_azov_steel_operation_desc:0 "Using elite units for high-risk operations deep behind the front line. Fighters, tempered in battle like steel, perform tasks to eliminate enemy commanders, sabotage key infrastructure, and capture strategically important positions, preparing the ground for larger-scale offensive actions."

 # Idea/bonus names
 UKR_armored_thrust_bonus:0 "Armored Forces Offensive Momentum"
 UKR_drone_strike_bonus:0 "Coordinated UAV Strikes"
 UKR_nato_intelligence_support:0 "NATO Intelligence Support"
 UKR_night_combat_bonus:0 "Night Combat Advantage"
 UKR_strategic_triangle:0 "Strategic Defense Triangle"
 UKR_asgard_defense_network:0 "'Asgard' Air Defense Network"
 UKR_offensive_momentum:0 "Offensive Momentum"
 UKR_azov_steel_operations:0 "Special Forces Operations"

 # Tooltips for mechanics
 UKR_rapid_armored_thrust_tooltip:0 "§YArmored and mechanized divisions will receive significant tactical advantages, enhancing their mobility and striking power.§!"
 UKR_bayraktar_strike_tooltip:0 "§YPrecision drone strikes will weaken the enemy's defensive capabilities and reduce the effectiveness of their air defense systems.§!"
 UKR_nato_intel_tooltip:0 "§YIntelligence from allies will enhance our tactical awareness and command effectiveness, as well as reveal enemy vulnerabilities.§!"
 UKR_night_raids_tooltip:0 "§YSpecial operations during nighttime will provide tactical advantages to our forces and undermine enemy morale.§!"
 UKR_strategic_triangle_tooltip:0 "§YCreating a fortified defensive area will provide significant advantages in defending key cities and improve logistics within the perimeter.§!"
 UKR_asgard_tooltip:0 "§YThe modernized air defense system will increase the protection of our troops and facilities from enemy air strikes.§!"
 UKR_serpents_path_tooltip:0 "§YThe offensive operation will allow our troops to more effectively overcome enemy defenses and advance in enemy territory.§!"
 UKR_azov_operation_tooltip:0 "§YSpecial units operating behind enemy lines will disrupt communications, demoralize personnel, and create favorable conditions for main forces.§!"

 #BLR - Cooperation
 UKR_idea_belarus_cooperation:0 "Ukrainian-Belarusian Cooperation"
 UKR_idea_belarus_cooperation_desc:0 "After democratic changes in Belarus, our countries have begun a new chapter in relations. Shared challenges and the pursuit of independence from Russian influence bring our nations closer together. Joint economic projects are already yielding results, while cultural exchange strengthens historical brotherhood."

 UKR_belarus_military_cooperation:0 "Military Cooperation with Belarus"
 UKR_belarus_military_cooperation_desc:0 "Our armed forces conduct joint exercises and exchange expertise. The shared border necessitates coordinated defense efforts, while unified training standards enhance the combat readiness of both armies. Establishing a secure northern flank significantly strengthens our security."

 ukraine_belarus_friendship_initial:0 "Ukrainian-Belarusian Friendship"
 ukraine_belarus_friendship_initial_desc:0 "The first steps toward strategic partnership with the new democratic Belarus have laid the foundation for long-term cooperation. Our peoples, united by a common Slavic heritage, are rediscovering each other."

 ukraine.500.t:0 "A New Chapter in Relations with Belarus"
 ukraine.500.d:0 "Political changes in Belarus present us with a unique window of opportunity. After decades of Lukashenko s authoritarian rule, the new leadership looks westward instead of eastward. Our diplomats report unprecedented openness from Belarusian officials to dialogue. The Ministry of Foreign Affairs proposes opening a new chapter in relations with our northern neighbor. Preliminary consultations indicate the potential for a strong partnership in economic, cultural, and possibly defense sectors. The historical ties between our peoples, which have always existed despite political barriers, could form the foundation of a new alliance.\n\n Analysts highlight potential economic benefits: restoring disrupted supply chains, access to new markets, and more efficient utilization of both countries' transit potential. Particularly promising are prospects for energy cooperation and transport corridor integration.\n\n However, some skeptics within military circles warn of possible instability in Belarus and the risks of premature rapprochement. Russia will undoubtedly see our alliance as a direct challenge to its interests, which could further escalate an already tense regional situation."

 ukraine.500.a:0 "Extend a Hand of Friendship to Belarus"
 ukraine.500.b:0 "Now Is Not the Time for Experiments"

 ukraine.501.t:0 "Deepening Cooperation with Belarus"
 ukraine.501.d:0 "Over the past months, our relations with the new democratic Belarus have strengthened significantly. Regular high-level meetings and growing trade volumes indicate the success of our chosen course. A symbolic gesture was the unveiling of a monument to the great Belarusian poet Yanka Kupala in Kyiv and a monument to Taras Shevchenko in Minsk.\n\n Now we have the opportunity to take cooperation to a qualitatively new level-military collaboration. The Ministry of Defense has presented an ambitious plan for joint actions, including regular exercises, military personnel exchanges, and the creation of a coordination council on border security.\n\n Special attention is given to air defense. Our experts have developed a scheme for the joint use of radar systems, which will significantly improve early warning capabilities against potential aerial threats. This is especially critical for Belarus, given the limited resources of its recovering army. The project also includes the establishment of a joint training center where servicemen from both countries will exchange experience in modern warfare.\n\n Not everyone in our leadership supports such close military cooperation. There are concerns that this may be perceived as forming an anti-Russian bloc, provoking a harsh reaction from the Kremlin. Additionally, questions remain regarding the stability of Belarus new government and its ability to withstand external pressure."

 ukraine.501.a:0 "Form a Military Alliance with Belarus"
 ukraine.501.b:0 "Limit Cooperation to Economic Partnership"

 ukraine.502.t:0 "A New Chapter in Relations with Belarus"
 ukraine.502.d:0 "Following the signing of the peace treaty, Belarus has regained its full independence. Our nations, bound by shared history and recent struggle, have a unique opportunity to start relations with a clean slate. Embassies of both countries have resumed their operations, and border checkpoints are now open for free movement of citizens. Our economists and engineers are already discussing joint projects for rebuilding infrastructure and industries damaged during the conflict. Many experts believe that close cooperation between our countries will not only accelerate the recovery process but also serve as a security guarantee in the face of possible future threats from the east."
 ukraine.502.a:0 "Develop full-scale cooperation in reconstruction"
 ukraine.502.b:0 "Focus on rebuilding with our own resources"
 belarus_mutual_defense_pact_tooltip:0 "Ukraine and Belarus initiate a joint reconstruction program"

 UKR_idea_belarus_construct:0 "Fraternal Reconstruction"
 UKR_idea_belarus_construct_desc:0 "Having endured years of conflict, Ukraine and Belarus have united their efforts to rise from the ashes of war. Joint infrastructure restoration projects, technology exchange, and coordination of economic programs allow both countries to more effectively overcome the consequences of destruction. Nations bound by shared history and recent struggle are creating a new foundation for cooperation-not from political ambitions, but from a genuine desire to build a peaceful and prosperous future for generations to come."

 #Secret Operation
 UKR_military_budget_expansion:0 "Strengthening Special Services and Military Intelligence"
 UKR_military_budget_expansion_desc:0 "In the conditions of ongoing hybrid warfare with the aggressor, it is critically important to enhance our defense capabilities. The main focus will be on supporting key intelligence units: the Main Intelligence Directorate, Special Operations Forces, technical reconnaissance and UAV units. The priority will be the development of special operations systems, strengthening the intelligence potential of special services with special attention to deep infiltration agent training. The powers of key units are significantly expanded in terms of conducting autonomous special operations and information security. Each invested resource is an additional chance to protect state sovereignty. Our motto: Information is a weapon, intelligence is the shield of national security."

 UKR_shadow_war_capabilities:0 "Asymmetric Counteraction to the Aggressor"
 UKR_shadow_war_capabilities_desc:0 "The war in the shadows is the daily reality of Ukrainian special units. The more territories the aggressor captures, the stronger the resistance becomes. Each new kilometer of occupied land gives birth to dozens of hidden resistance cells, forming an extensive network of underground organizations. Special Operations Forces have strategic tasks of deep enemy reconnaissance, conducting sabotage actions, disrupting enemy communications, and gathering critically important strategic information. The national spirit of unbrokenness is our main weapon. The unit structure includes elite special-purpose groups, marine units, and highly mobile airborne troops. Our strategic goal is to turn every piece of occupied land into a space of unpredictability and risk for the enemy."

 UKR_budget_military_expansion_tooltip:0 "§HRe-equipment and strengthening of special units will provide more opportunities to counter enemy informational, diplomatic, and intelligence influences§!"
 UKR_shadow_war_special_ops_tooltip:0 "§HExpanding asymmetric warfare capabilities will ensure support for independent and liberation forces in confronting aggressors, creating an extensive network of contacts and channels of influence§!"

 UKR_increased_funding_agency:0 "Expanding Intelligence Potential"
 UKR_increased_funding_agency_desc:0 "Targeted financing and support of special services allows for a significant increase in the country's intelligence potential. Favorable conditions are created for the rapid formation of intelligence networks, training of high-class specialists, and conducting complex special operations. Each additional resource invested in intelligence is multiplicatively repaid through strategic information and the ability to take preemptive actions."
  
 UKR_shadow_war_category:0 "Shadow War"  
 UKR_shadow_war_category_desc:0 "Hybrid conflicts define the new reality of international politics. Confronted with aggression and destabilization, Ukraine takes decisive steps to counter covert influence and threats from the Russian Federation. The shadow war unfolds on multiple fronts: from clandestine special operations and intelligence missions to diplomatic maneuvers and support for independent states across the CIS. These decisions will strengthen Ukraines position, secure strategic advantages, and protect national interests."  

 UKR_support_central_asian_resistance_KAZ:0 "Strategic Military Solidarity with Kazakhstan"  
 UKR_support_central_asian_resistance_KAZ_desc:0 "Rapid military supplies and expert support create an invisible shield of state sovereignty. Critical intelligence, advanced equipment, and strategic consultations are delivered to the country's leadership through special channels. Our goal is to strengthen defense capabilities and help preserve independence amidst growing geopolitical challenges."  

 UKR_support_central_asian_resistance_UZB:0 "Expert Military Support for Uzbekistan"  
 UKR_support_central_asian_resistance_UZB_desc:0 "Covert military corridors ensure the swift transfer of strategic weaponry and intelligence. Special military expert teams are ready to provide immediate advisory support to the country's leadership. Every communication channel and every shipment is a step toward enhancing national security and independence."  

 UKR_support_central_asian_resistance_TMS:0 "Tactical Military Support for Turkmenistan"  
 UKR_support_central_asian_resistance_TMS_desc:0 "An invisible network of military solidarity covers strategic areas of national security. Modern weapon systems, cutting-edge intelligence, and immediate expert support are ready to safeguard the country's sovereignty in critical moments."  

 UKR_support_central_asian_resistance_TAJ:0 "Operational Military Protection for Tajikistan"  
 UKR_support_central_asian_resistance_TAJ_desc:0 "Rapid military deliveries and deep intelligence support create a reliable shield against external threats. Specialized military expert teams are prepared to provide immediate strategic consultations to the country's leadership, ensuring maximum readiness for any scenario."  

 UKR_support_central_asian_resistance_KYR:0 "Comprehensive Military Solidarity with Kyrgyzstan"  
 UKR_support_central_asian_resistance_KYR_desc:0 "A multi-layered military support system includes rapid deliveries of modern weaponry, the transmission of critical intelligence, and readiness to provide immediate strategic consultations. Every communication channel adds extra potential for protecting national interests."  

 UKR_support_central_asian_resistance_GEO:0 "Covert Strategic Counteraction to Russian Aggression in Georgia"
 UKR_support_central_asian_resistance_GEO_desc:0 "Clandestine intelligence units conduct an extremely secretive operation to transfer critical information. Special groups analyze military risks, prepare detailed resistance plans, and transmit intelligence about potential invasions. Each intercepted document, each anonymous communication channel deals a precise blow to the Russian military machine. The operation is conducted with maximum anonymity, without official statements or public contacts."

 UKR_support_central_asian_resistance_AZR:0 "Covert Counteraction to Territorial Claims in Azerbaijan"
 UKR_support_central_asian_resistance_AZR_desc:0 "Deeply undercover specialist groups create strategic barriers against potential military aggression. Encrypted channels transmit intelligence about military movements, preparing preemptive strategies to protect state borders. Each intercepted Russian army plan is a fragment of a secret war for sovereignty."
 
 UKR_support_central_asian_resistance_ARM:0 "Shadowy Containment of Military Threat in Armenia"
 UKR_support_central_asian_resistance_ARM_desc:0 "A completely covert operation accompanying national security. Analytical groups track military risks in absolute secrecy, preparing resistance strategies. Each transmitted signal is an invisible strike against Russian military strategy, without official documents or public traces."

 #29.09 War
 # Main War Mood Category
 
 # Decisions for Controlling Hatred
 UKR_control_war_atrocities:0 "War Crimes Control"
 UKR_control_war_atrocities_desc:0 "Strict orders on treatment of prisoners and civilians, strengthening military police, OSINT monitoring, and training commanders in IHL norms reduce the escalation of hatred and strengthen allies' trust in our conduct of war."
 UKR_control_war_atrocities_tt:0 "Reduces hatred gain; improves partners' attitude toward compliance with the laws of war."


 # Decisions for Combating Fatigue
 UKR_rapid_reconstruction:0 "Emergency Reconstruction"
 UKR_rapid_reconstruction_desc:0 "Mobile bridge and engineering brigades, emergency power modules, repair of communications and supply routes accelerate the restoration of critical infrastructure, accepting short-term budgetary costs for the sake of rear stability."
 UKR_rapid_reconstruction_tt:0 "Temporary bonus to repair and supply with increased financial burden."


 UKR_civilian_relief:0 "Civilian Humanitarian Aid"
 UKR_civilian_relief_desc:0 "Organization of evacuation trains, deployment of temporary food and medical aid points, coordination of volunteer warehouses reduces social fatigue and maintains trust in authorities even under strikes on cities."
 UKR_civilian_relief_tt:0 "Supports the civilian population in combat zones."


 UKR_resilience_campaign:0 "Resilience Campaign"
 UKR_resilience_campaign_desc:0 "Information support, documentary reports, cultural visits to frontline cities, and work of psychologists increase the will to resist and keep morale at a high level, even if fueling the determination to take revenge on the enemy."


 UKR_honor_fallen:0 "Honor the Fallen"
 UKR_honor_fallen_desc:0 "State ceremonies, named companies and scholarships for families of the fallen form a culture of remembrance, raise fighting spirit, and consolidate society's readiness to endure the war until victory."




 # Additional Decisions
 UKR_veteran_psych_care:0 "Veteran Psychological Care"
 UKR_veteran_psych_care_desc:0 "Opening rehabilitation centers, support groups, and therapeutic programs help fighters cope with post-traumatic stress and maintain connection with civilian life."


 UKR_cultural_morale_boost:0 "Cultural Events for Morale"
 UKR_cultural_morale_boost_desc:0 "Concerts in bomb shelters, mobile theaters, exhibitions, and poetry evenings support the people's spirit and remind us what we are fighting for."


 # Monthly Ticks
 UKR_war_mood_monthly_tick:0 "War Mood Dynamics"
 UKR_war_mood_monthly_tick_title:0 "The War Continues"
 UKR_war_mood_monthly_tick_desc:0 "Every month of war leaves its mark on people's souls  both hatred for the enemy and fatigue from trials grow."

 # System Initialization
 ukrainewar.1.t:0 "War Has Begun"
 ukrainewar.1.d:0 "Without a declaration of war, the country's territory came under massive missile bombardment. Cruise missiles launched from Tu-95 and Tu-160 bombers, ballistic missiles from mobile systems, and Kalibr naval missiles struck the airfields of Boryspil, Ozerne, Chuhuiv, Kramatorsk, Chornobaivka, military warehouses, communication nodes, and command posts throughout the country from Kyiv to Odesa, from Kharkiv to Ivano-Frankivsk. More than a hundred missiles were launched in the first hour. The airspace filled with Russian Aerospace Forces. At the border, movement of armored columns is recorded from Belarusian territory toward Kyiv and Chernihiv, from Russia toward Kharkiv and Sumy, from Crimea toward Kherson and Mariupol, from occupied Donbas deep into Donetsk and Luhansk oblasts. The enemy is crossing the border simultaneously in four directions. The country is in shock. A peaceful morning shattered by explosions and sirens."
 ukrainewar.1.a:0 "Emergency session of the National Security and Defense Council"
 UKR_war_mood_initialized_tt:0 "'National War Mood' system activated: hatred and fatigue are being tracked, dynamic modifiers enabled."


 # First Strikes on Civilians
 ukrainewar.10.t:0 "Shock of War on Screens"
 ukrainewar.10.d:0 "The news feed brings footage of bombed schools and hospitals, craters on playgrounds, shattered apartment entrances, and hasty evacuations. Anger grows alongside fatigue  headquarters strengthen psychological support for troops and civilians, while volunteer networks expand aid in frontline cities."
 ukrainewar.10.a:0 "Memory and resilience"


 # Hatred Thresholds
 ukrainewar.25.t:0 "Growing Hatred for the Enemy"
 ukrainewar.25.d:0 "Reports from the front and testimonies of refugees paint a picture of methodical destruction of everything Ukrainian. They burn libraries, blow up monuments, deport children. On social media and in the streets, calls for merciless revenge are increasingly heard. This wave of anger strengthens the determination to fight, but risks consuming the very essence of the nation for which the war is being waged."
 ukrainewar.25.a:0 "The enemy will pay for every crime"
 UKR_hate_50_reached_tt:0 "Hatred for the enemy has reached critical levels."


 # Fatigue Thresholds
 ukrainewar.50.t:0 "War Fatigue"
 ukrainewar.50.d:0 "Months of fighting, endless casualty reports, queues at humanitarian points, and air raid sirens are beginning to erode the people's spirit. People are tired of constant tension, of seeing destruction, of the uncertainty of the future. Sentiments in society are growing for peace negotiations  any negotiations, just to stop the bloodshed."
 ukrainewar.50.a:0 "We need peace, but not at any cost"
 UKR_fatigue_75_reached_tt:0 "War fatigue is reaching dangerous levels."


 #New 01.10
 ukrainewar.100.t:0 "The Fall of Kyiv"
 ukrainewar.100.d:0 "The unthinkable has happened. Enemy forces have entered the capital of Ukraine. The golden domes of Kyiv's churches, the ancient streets of Podil, Independence Square - all are now under the control of the occupiers. The fall of Kyiv is not just the loss of a city. It is the symbol of our struggle, the heart of the nation, the center of our statehood.\n\nThe mood in society is becoming increasingly grim. Many are losing hope, the army is demoralized, and the political leadership is torn by debates about how to proceed. Yet even in this dark hour, voices are calling to continue the resistance. The capital may be lost, but the war is not yet over."
 ukrainewar.100.a:0 "This is a catastrophe..."
 UKR_kiev_lost_tt:0 "The loss of the capital severely undermines the morale of the nation and the army."
 ukrainewar.100.b:0 "We must take emergency measures!"
 UKR_kiev_emergency_measures_tt:0 "The government takes decisive steps to stabilize the situation and strengthen the defense."

 # Post-War Conversion
 ukrainewar.200.t:0 "End of War - Beginning of Recovery"
 ukrainewar.200.d:0 "The guns have fallen silent, but their echo will resonate in people's souls for a long time to come. Now comes a no less difficult task  to heal the wounds inflicted by war not only on cities and villages but also on citizens' hearts. Hatred can become the foundation for building a new strong nation, or it can turn into poison that contaminates the future. Fatigue will either become wisdom or paralyze the will to rebuild."
 ukrainewar.200.a:0 "We endured, now we will rebuild"
 UKR_postwar_conversion_tt:0 "War mood is converted into post-war effects."


 # Automatic Change Events
 ukrainewar.300.t:0 "Strikes on Civilian Infrastructure"
 ukrainewar.300.d:0 "Enemy missiles and drones methodically destroy power stations, water supplies, heating networks, and hospitals. Millions of people are left without light, heat, and communications in the middle of winter. These strikes have no military purpose  their goal is to break the people's spirit, to force surrender from cold and despair. But every destroyed boiler room only fuels hatred."
 ukrainewar.300.a:0 "They are torturing the people, but we will endure"


 ukrainewar.310.t:0 "New Wave of Mobilization"
 ukrainewar.310.d:0 "Fathers of families, students, workers  ordinary people, yesterday still peaceful citizens  arrive at draft offices. Farewells at train stations, mothers' tears, children's drawings with wishes for dad  war demands ever new sacrifices. Society is tired of constant send-offs, but understands: there is no alternative."
 ukrainewar.310.a:0 "Everyone will stand to defend the Motherland"


 # Hatred Modifier
 UKR_hate_dynamic:0 "Hatred for the Enemy"
 UKR_hate_dynamic_desc:0 "The more intensely the people hate the occupiers, the more fiercely they fight, but the greater the risk of losing humanity."


 # Fatigue Modifier
 UKR_war_fatigue_dynamic:0 "War Fatigue"
 UKR_war_fatigue_dynamic_desc:0 "Prolonged combat operations exhaust the nation's morale and undermine the ability to continue resistance."


 # Severe Post-War Trauma
 UKR_severe_war_trauma:0 "Deep Scars of War"
 UKR_severe_war_trauma_desc:0 "Destruction, loss, and suffering have left an indelible mark on people's souls. Society struggles to return to peaceful life, many suffer from post-traumatic stress. Recovery will take many years."


 UKR_moderate_war_trauma:0 "War Weariness"
 UKR_moderate_war_trauma_desc:0 "War has exhausted the physical and moral strength of the nation. People crave peace and stability, preferring to focus on recovery rather than new conflicts."


 UKR_light_war_trauma:0 "Combat Strain"
 UKR_light_war_trauma_desc:0 "The memory of war is still fresh, but the people are ready to move forward. Some wariness and caution are natural after the trials endured."


 # War-Hardened
 UKR_hardened_by_war:0 "Forged in Fire"
 UKR_hardened_by_war_desc:0 "War has transformed peaceful citizens into fearless warriors. The nation has passed through the crucible of battles and gained unbreakable resilience. Now nothing can break us."


 UKR_tempered_by_war:0 "Battle-Tested"
 UKR_tempered_by_war_desc:0 "The trials of war have strengthened the nation's character. People have become more determined and united, ready to defend their independence."


 # Temporary Decision Effects
 UKR_rapid_reconstruction_boost:0 "Emergency Recovery Program"
 UKR_rapid_reconstruction_boost_desc:0 "Mobilization of all resources for restoring critically important infrastructure accelerates repair work and lifts the people's spirits."


 # Sabotage at Any Cost
 UKR_sabotage_at_any_cost:0 "Sabotage at Any Cost"
 UKR_sabotage_at_any_cost_desc:0 "War demands decisive action from us. Our special services will launch a large-scale operation to undermine the Russian war machine from within. Saboteurs will attack railway junctions and ammunition depots, hackers will disrupt military communications systems, and agents on the ground will organize sabotage at defense enterprises. We will use the full power of the partisan movement in occupied territories to organize raids against Russian rear facilities. These actions will strengthen our forces and disorganize the enemy, but will require significant resources."
 UKR_sabotage_at_any_cost_tooltip:0 "A campaign of total sabotage begins against Russian military facilities and communications."
 
 # Everything Against the Enemy
 UKR_everything_against_enemy:0 "Everything Against the Enemy"
 UKR_everything_against_enemy_desc:0 "The time has come to launch a full-scale hybrid war against Russia. Our specialists will conduct a coordinated multi-level operation:\n\n§Y•§! Cyberattacks on the Russian banking system and government databases\n§Y•§! Massive information campaign targeting the Russian population and military personnel\n§Y•§! Bribery and recruitment of Russian officials and military\n§Y•§! Incitement of inter-ethnic and social conflicts within the Russian Federation\n§Y•§! Support for separatist movements in Russian borderlands\n§Y•§! Organization of leaks of compromising materials on Russian leadership\n§Y•§! Disinformation operations to undermine trust in Russian authorities\n\nThis will be total war on all fronts  from cyberspace to Russian regions."
 UKR_everything_against_enemy_tooltip:0 "§YRussia§! will receive a negative idea for §Y180 days§! that will seriously weaken its military potential and internal stability."


 # Idea for Russia (SOV)
 UKR_subversion_campaign:0 "Ukrainian Subversion Operation"
 UKR_subversion_campaign_desc:0 "Ukrainian special services have launched a large-scale campaign to destabilize Russia. Cyberattacks paralyze the banking system and government services, hackers breach military databases. Bribed officials leak classified information, and recruited officers sabotage military operations. In the regions, inter-ethnic conflicts are being stoked, separatists receive external support. Information attacks undermine the population's trust in authorities, compromising materials on high-ranking figures appear in the media. Society is split, the economy is cracking at the seams, and the war machine is malfunctioning."

 ### FOCUSES
 UKR_forge_professional_officer_corps:0 "Commander's School: The New Generation"
 UKR_forge_professional_officer_corps_desc:0 "2014 left a bitter lesson: our army collapsed under the assault of 'little green men' not from lack of courage, but from lack of §Ycommand professionalism§!.\n\nCrimea fell in three days. Donbas turned into a meat grinder where company commanders learned warfare right in the trenches, losing men to their own inexperience. The Minsk Protocols gave us breathing room - but this is only the calm before the storm. Moscow won't stop. The world knows this. §YWe§! know this.\n\nFrom 2020, we are launching a §Yprogram of total officer corps retraining§!. No half-measures. No 'reforms on paper'. Captains will learn operational planning by NATO standards - not in theory, but through simulations of real battles: defense of Ilovaisk, breakthrough near Debaltseve, holding Donetsk Airport.\n\nGenerals will undergo internships in NATO countries - where they §Yremember the price of freedom§!. They will study hybrid warfare, cyber threats, information operations. They will learn to win not through numbers, but through skill.\n\nThe enemy is at the gates. He awaits a moment of weakness. §YWe will not give him that moment.§!"

 UKR_UAV_warfare_revolution:0 "Eyes Over the Battlefield: UAV Doctrine"
 UKR_UAV_warfare_revolution_desc:0 "In 2014, Russian forces entered Crimea §Yinvisibly§!. Their columns moved at night, checkpoints appeared from nowhere, GRU special forces operated like ghosts. We had no eyes on the battlefield. Reconnaissance was hours, sometimes days late.\n\nIn Donbas, volunteers began launching commercial DJI drones over separatist positions. Improvised, unprofessional, but §Yeffective§!. By 2020, thousands of drones on the front line - from Chinese Mavics to Ukrainian 'Lelekas'.\n\nBut this is chaos. Brilliant innovations die with their operators. Effective tactics perish with battalions. §YIt's time to create a system.§!\n\nWe are developing the world's first §YUnmanned Warfare Doctrine for the 21st century army§!. Not as an aviation supplement - as a §Yseparate branch of forces§!. Every battalion will get its own UAV unit. Every company commander will have a reconnaissance operator under direct command.\n\nWe are standardizing training: from basic pilot preparation (5 days for commercial drones, 3 weeks for FPV kamikaze) to advanced courses in target designation and artillery coordination. We are creating §Ytactical employment schemes§!: 'Drone Line' for continuous front monitoring, 'Swarm' for air defense suppression, 'Hunter-Killer' for armored vehicle destruction.\n\nThe enemy still thinks in tanks and aircraft. §YWe think in algorithms and cameras.§!\n\nWhen the big war comes - and it will come - the sky over Ukraine will be §Yours§!. Not Su-35s and Ka-52s. §YThousands of small eyes that see everything and never sleep.§!"

 ### FOCUS TOOLTIPS
 UKR_officer_training_decisions_tooltip:0 "§YUnlocks officer training decisions:§!\n• Modern Artillery Course\n• Mobile Warfare Program\n• Urban Warfare Tactics School\n• Hybrid Operations School"
 UKR_drone_doctrine_tooltip:0 "§YUkraine becomes a pioneer of unmanned warfare§!\nReduced production cost for close air support and tactical bombers\nBonus to reconnaissance and enemy aircraft detection"

 ### DECISIONS
 UKR_staff_organization_course:0 "Staff Organization Course"
 UKR_staff_organization_course_desc:0 "The experience of 2014 showed: chaos in headquarters kills faster than enemy bullets. Loss of communication between units, supply failures, improper operation planning - all of this cost us Crimea and the first months of war in Donbas.\n\nWe will train generals in modern staff work standards: operation planning, coordination between branches of service, logistics, information flow management. A commander is not just someone who leads the charge, but someone who ensures the army has everything needed for victory."
 UKR_organizer_training_tooltip:0 "§G2 random generals§! will receive:\n• §Y+1 skill§!\n• §Y'Organizer' trait§!"

 UKR_mobile_warfare_program:0 "Mobile Warfare Program"
 UKR_mobile_warfare_program_desc:0 "Modern warfare is speed. We will train commanders in tank breakthrough tactics, mechanized unit coordination, and rapid battlefield maneuver."
 UKR_panzer_leader_training_tooltip:0 "§G2 random generals§! will receive:\n• §Y+1 skill§!\n• §Y'Panzer Leader' trait§!"

 UKR_infantry_tactics_school:0 "Urban Warfare Tactics School"
 UKR_infantry_tactics_school_desc:0 "Urban battles in Mariupol, Donetsk, Luhansk showed: infantry remains the main force in holding territory. We will prepare commanders for warfare in urban environments and trenches."
 UKR_infantry_leader_training_tooltip:0 "§G2 random generals§! will receive:\n• §Y+1 skill§!\n• §Y'Infantry Leader' trait§!"

 UKR_hybrid_operations_school:0 "Hybrid Operations School"
 UKR_hybrid_operations_school_desc:0 "21st century warfare is special operations, sabotage, psychological pressure. We will train generals in unconventional combat methods."
 UKR_hybrid_ops_training_tooltip:0 "§G2 random generals§! will receive:\n• §Y+1 skill§!\n• §Y'Trickster' or 'Commando' trait§!"

 ### NATIONAL SPIRIT
 UKR_UAV_warfare_pioneers:0 "Pioneers of Unmanned Warfare"
 UKR_UAV_warfare_pioneers_desc:0 "Ukraine has become a global laboratory of unmanned warfare. Tactics born in Donbas are studied in academies worldwide. We taught commercial drones to kill. We created a doctrine that doesn't yet exist in NATO. When the big war comes - the sky will be ours."

 # === WAR SPIRIT SYSTEM - HATRED ===
 UKR_war_spirit_hate_0:0 "Weak Military Resolve"
 UKR_war_spirit_hate_0_desc:0 "The onset of conflict has sparked the first manifestations of national unity and determination to resist the aggressor."

 UKR_war_spirit_hate_25:0 "Rising Hatred of the Enemy"
 UKR_war_spirit_hate_25_desc:0 "The population begins to experience increasingly strong hatred toward the invaders. Troop morale grows and patriotic sentiments intensify."

 UKR_war_spirit_hate_50:0 "Popular Anger"
 UKR_war_spirit_hate_50_desc:0 "War has ignited furious hatred of the enemy throughout the country. Citizens are ready to make sacrifices for victory, though this is beginning to affect social stability."

 UKR_war_spirit_hate_75:0 "Irreconcilable Enmity"
 UKR_war_spirit_hate_75_desc:0 "Hatred of the aggressor has reached unprecedented scale. Military effectiveness has increased significantly, but growing radicalism and economic sacrifices are beginning to create problems."

 UKR_war_spirit_hate_100:0 "Total War"
 UKR_war_spirit_hate_100_desc:0 "The country is gripped by fanatical hatred of the enemy. Everyone is ready to fight to the last, but extreme sentiments, political polarization, and resource depletion threaten the long-term stability of the state."


 # === WAR SPIRIT SYSTEM - FATIGUE ===
 UKR_war_spirit_fatigue_0:0 "Early War Fatigue"
 UKR_war_spirit_fatigue_0_desc:0 "The first signs of war fatigue are beginning to manifest in society."

 UKR_war_spirit_fatigue_25:0 "Growing War Fatigue"
 UKR_war_spirit_fatigue_25_desc:0 "The protracted conflict is beginning to exhaust the population. Support for the war declines, production falls, and trust in the government weakens."

 UKR_war_spirit_fatigue_50:0 "Deep War Fatigue"
 UKR_war_spirit_fatigue_50_desc:0 "Society is exhausted by war. Stability is under threat, fighting spirit drops, and the economy suffers from prolonged conflict. Increasingly more resources are required for civilian needs."

 UKR_war_spirit_fatigue_75:0 "Critical War Fatigue"
 UKR_war_spirit_fatigue_75_desc:0 "The country is on the brink of exhaustion. Troop morale is catastrophically falling, the economy is collapsing, and discontent is brewing in society. Radical ideas are finding more and more supporters."

 UKR_war_spirit_fatigue_100:0 "War Spirit Collapse"
 UKR_war_spirit_fatigue_100_desc:0 "The nation is completely exhausted by war. Society is on the verge of breakdown, the army is demoralized, the economy is in ruins. The government is losing legitimacy, and the country's ability to continue the war is seriously in question."


 # Decision tooltips
 UKR_veteran_psych_care_tt:0 "Reduces hatred and fatigue levels through work with traumatized veterans."
 UKR_cultural_morale_boost_tt:0 "Cultural events support the spirit of the people and reduce war fatigue."
 UKR_honor_fallen_tt:0 "Memory of heroes raises fighting spirit and partially compensates for fatigue."
 UKR_resilience_campaign_tt:0 "Information campaign reduces fatigue but may intensify hatred of the enemy."


