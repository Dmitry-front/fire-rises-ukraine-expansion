 #Events
 ukraine.1.t: "Ukraine Violates Minsk Protocol"
 ukraine.1.d: "The Ukrainian government has violated the peace agreement with the Federal State of Novorossiya and permitted Ukrianian army units to once again begin border clashes."
 ukraine.1.o1: "A wreckless endeavour"
 ukraine.1.o2: "Annul the agreement! Victory or death!"
 ukraine.2.t: "Ukraine Airlines Flight 752 Shot Down over Iran"
 ukraine.2.d: "The Iranian government has informed us that members of the Iranian Republican Guard Corps have accidentially shot down one of our airliners. The civilian jet which took off from Imam Khomeini International Airport was hit by a surface to air missile. All 176 passengers perished."
 ukraine.2.o1: "Horrible tragedy!"
 ukraine.3.t: "Russia Condemns Ukrainian 'Neo-Nazism'"
 ukraine.3.d: "In their latest attempt to undermine our government and portray their illegal occupation of Crimea and Donbas as justified, the Russian government has launched another wave of baseless accusations against us. Using their state propaganda networks like RT and Sputnik, their politicians and pundits have smeared President Zelensky's administration of being 'corrupt gangsters', 'neo-fascist Banderites', and 'the grandsons of Hitlerite collaborators'. \n\nWhile they may be correct about the existence of a few overzealous elements within units like the Azov Battalion, the other claims are flimsier than Putin's claims of democratic legitimacy! They're resorting to their old propaganda tricks, smearing any Ukrainian who fought against the Tsar or the Soviets as a foreign puppet or fascist madman. We shall not stand for this latest case of slander, and we shall call upon the rest of the world to condemn the Russians' blatant lies!"
 ukraine.3.a: "They may claim history is on their side, but it will vindicate us!"
 ukraine.5.t: "Invitation into NATO"
 ukraine.5.d: ""
 ukraine.5.a: "United we stand!"
 ukraine.12.t: "Ukraine vows to defend Kuban"
 ukraine.12.d: ""
 ukraine.12.a: "They know the alternative..." 
 ukraine.14.t: "Commie Uprising!"
 ukraine.14.d: ""
 ukraine.14.a: "Kill them all!"
 
 #SUB-SUB-ideologie
 UKR_liberal_oligarchy: "Liberal Oligarchy"

 ukraine.4.t:0 "Ukraine Prepares for War"
 ukraine.4.d:0 "Against the backdrop of a growing threat of military conflict, the Ukrainian government has initiated urgent measures to strengthen the country's defense capabilities. In collaboration with Poland and Romania, construction of fortifications in key regions has begun, as well as expansion of the military industry. In particular, new fortified areas have been deployed in Dnipro, Cherkasy Oblast, and Kyiv Oblast. This decision is part of an overall deterrence strategy aimed at defending critically important directions."
 ukraine.4.a:0 "We must be ready for any development of events"

 # Ukraine Elections 2024
 ukraine.13.t:0 "2024 Presidential Elections"
 ukraine.13.d:0 "The time has come for the next presidential elections in Ukraine. The election campaign has been tense, with two main candidates fighting for the future direction of the country.\n\nVolodymyr Zelensky, the incumbent president, promises to continue his reform program, strengthen democratic institutions, and maintain the country's western vector. His administration has made progress in fighting corruption and digital transformation, although critics point to growing authoritarian tendencies.\n\nPetro Poroshenko, representing a more traditional conservative approach, relies on experience and stability. He emphasizes economic pragmatism and closer ties with oligarchic structures, arguing that this is necessary for Ukraine's economic development.\n\nThe people have cast their votes, and the results will determine Ukraine's further path."
 ukraine.13.a:0 "Zelensky gets another term"
 ukraine.13.b:0 "Poroshenko returns to power"


 # Special Operation Event
 ukraine.11.t:0 "Border Crossing"
 ukraine.11.d:0 "Russian troops have begun a massive invasion across several border sectors. Artillery strikes have commenced on military facilities, airfields, and infrastructure across the country.\n\nPreliminary reports indicate that armored columns are advancing from multiple directions - from Crimea, from the eastern border near Kharkiv and Luhansk, and from Belarus in the north. Air raid alerts have been declared in Kyiv and other major cities, with enemy aircraft and missiles striking strategic targets.\n\nThe scale of the attack is unprecedented. This is a full-scale military invasion with the obvious goal of occupying the country. Our armed forces are mobilizing to repel the aggressor, but the situation is critical.\n\nThe enemy has crossed our borders. War has begun."
 ukraine.11.a:0 "We will defend every meter of our land"


 #Intelligence Report: Analysis of Russian Federation Actions
 UKR_intelligence_operation:0 "GUR Report"
 UKR_intelligence_operation_desc:0 "As a result of thorough analysis conducted by the Main Intelligence Directorate (GUR), a special unit has been formed for continuous monitoring of the Russian Federation's actions. The report, compiled based on data from external intelligence sources from France, the USA, as well as internal information, revealed the use by the Russian military of tactical schemes involving mobile strike groups, armored tank divisions, and operational units of the FSB and Foreign Intelligence Service. The report's recommendations indicate the need to strengthen control measures and rapid response to aggressive actions by the Russian Federation."
 ukraine.800.t:0 "GUR Report: Monitoring Russian Federation Actions"
 ukraine.800.d:0 "In February 2014, against the backdrop of mass protests on Maidan, intelligence sources recorded an emergency meeting of the top leadership of the Russian Federation, at which a plan to seize Crimea was approved. According to data, within three days after the meeting, the naval infantry of the Black Sea Fleet received combat orders, and GRU special forces of the Russian Federation began preparations for conducting operations on the peninsula. On February 27, armed formations seized the buildings of the Supreme Council and Council of Ministers, demonstrating a high level of tactical preparation of units such as the 45th Airborne Regiment and the 3rd GRU Special Forces Brigade, with coordination carried out from Moscow. By the morning of February 28, the airports of Simferopol and Belbek came under the control of Russian airborne troops, which allowed them to quickly occupy strategic objects on the peninsula. By early March, the number of Russian troops in the region was estimated at about 15 thousand people. In March, during a referendum, the peninsula was annexed, which was accompanied by active actions of the FSB and Foreign Intelligence Service special services and the use of mobile strike groups, including units of the 76th Airborne Division and other formations. Additional intelligence data indicates border crossings and movements of Russian units in the Gukovo and Donetsk area, which is confirmed by radio intercepts and operational reports.\n\nBased on the results of the analysis, during a meeting at the Main Intelligence Directorate, a decision was made to create a specialized department for constant monitoring of the actions of the Russian armed forces, as well as to appoint a new head of the Main Intelligence Directorate - Budanov, who will take over the coordination of measures in the field of national security."
 ukraine.800.a:0 "Confirm the report and appoint the minister"

  ### Kazakhstan ###
 ukraine.820.t:0 "Kazakh Volunteers Arrive in Ukraine"
 ukraine.820.d:0 "Following the Russian occupation of Kazakhstan, many patriots were forced to flee the country or go underground. Learning of our resistance to Russian aggression, a group of former Kazakh Army officers and volunteers formed a combat unit and arrived in Ukraine.\n\nThe battalion commander, Colonel Nurlan Kasymov, stated at a meeting with our military leadership: 'Our struggle is one. By fighting for Ukraine's freedom, we fight for Kazakhstan's freedom. The Kremlin will not stop until it enslaves all former Soviet republics. We will not allow this.'\n\nThe battalion consists of well-trained fighters, many of whom have experience in special forces units. They brought with them a certain amount of weaponry and are ready to enter combat immediately. Despite the difficulties of traveling through occupied territories, their morale is high, and their determination to repel the aggressor is unshakeable."
 ukraine.820.a:0 "Together we are stronger!"
 kazakh_volunteers_tooltip:0 "Received the §YKazakh Freedom Battalion§! with experienced fighters and modern weaponry."


 ### Uzbekistan ###
 ukraine.821.t:0 "Uzbek Volunteers Join the Ukrainian Resistance"
 ukraine.821.d:0 "Today, the Ukrainian border witnessed an unusual sight: a column of trucks under the flags of Uzbekistan and Ukraine delivered a group of volunteers who fled from Russian-occupied Uzbekistan. The battalion, named after the national hero Timur, consists of former Uzbek army servicemen and civilian patriots.\n\nThe battalion commander, Major Rustam Akhmedov, emphasized in his speech to Ukrainian officers: 'The Kremlin machine does not distinguish between our peoples - for it, we are all just territories on the map of an empire. But our peoples remember the taste of freedom, and we are ready to fight shoulder to shoulder with Ukrainian brothers.'\n\nThe Uzbek volunteers brought with them valuable medical personnel and equipment, which is especially important for front-line hospitals. Most of the fighters have military service experience, and they have already expressed a desire to participate in the most complex operations against the Russian occupiers."
 ukraine.821.a:0 "Our struggle is becoming international!"
 uzbek_volunteers_tooltip:0 "Received the §YTimur Battalion§! with experienced medical personnel."


 ### Georgia ###
 ukraine.822.t:0 "Georgian Freedom Legion Arrives at the Front"
 ukraine.822.d:0 "Following another Russian occupation of Georgia and the establishment of a puppet regime, thousands of Georgians were forced to leave their homeland. Today, the best among them arrived in Ukraine to form the Georgian Freedom Legion.\n\nThis is not the first time Georgian volunteers have fought for Ukraine. Since the time of the first Russian invasion in 2014, Georgian warriors have proven their devotion and courage on the battlefield. Now, with their own country occupied, they see the liberation of Ukraine as the first step toward liberating the entire region from Kremlin tyranny.\n\nThe legion commander, General Giorgi Mamulashvili, stated at a meeting with the President of Ukraine: 'Georgians will never forget 2008, just as Ukrainians will not forget 2014. Our memory and our pain unite us. But today we are also united by a common hope for victory. Freedom will come to Tbilisi through Kyiv.'\n\nThe legion is staffed with experienced fighters, many of whom already have experience fighting Russian occupiers both in Georgia and in Ukraine. Their mobile units are especially effective in urban conditions and mountainous terrain."
 ukraine.822.a:0 "For our freedom and yours!"
 georgian_volunteers_tooltip:0 "Received the §YGeorgian Freedom Legion§! with highly mobile units."


 ### Belarus ###
 ukraine.823.t:0 "Kastus' Kalinouski Regiment Joins Ukrainian Forces"
 ukraine.823.d:0 "Under conditions of total Kremlin control over Belarus, patriotic Belarusians who refused to recognize the puppet regime formed the Kastus' Kalinouski Regiment and arrived in Ukraine.\n\nThe history of this unit began during the first conflicts in Donbas, when small groups of Belarusian volunteers joined Ukrainian battalions. Over time, their numbers grew, especially after the brutal suppression of protests in Belarus. Now, with Russia fully controlling Belarusian territory, the regiment has become a true symbol of Belarusian resistance.\n\nAt the oath-taking ceremony, the regimental commander, former Lieutenant Colonel of the Belarusian Army Sergey Yanchuk, stated: 'Today, the fate of our peoples is being decided on the battlefields of Ukraine. Every Ukrainian city we defend from the occupiers is a step toward the liberation of Minsk, Gomel, Brest. Our struggle is inseparable.'\n\nThe Kalinouski Regiment is especially well-equipped and has a developed support system, including engineering, medical, and reconnaissance units. Many of the fighters have experience serving in elite units of the Belarusian army."
 ukraine.823.a:0 "Long Live Belarus! Glory to Ukraine!"
 belarusian_volunteers_tooltip:0 "Received the §YBelarusian Kastus' Kalinouski Regiment§! with comprehensive support."


 ### Azerbaijan ###
 ukraine.824.t:0 "Azerbaijani Brigade on the Ukrainian Front"
 ukraine.824.d:0 "Following Azerbaijan's absorption by Russia, many Azerbaijani military personnel refused to pledge allegiance to the new regime and were forced to flee. Today, an elite group of these officers and soldiers formed the Azerbaijani Brigade to fight on Ukraine's side.\n\nLed by Colonel Elshan Mamedov, the brigade has brought valuable experience gained during the Nagorno-Karabakh conflict. Their knowledge in the field of modern high-tech warfare, especially in the use of drones and anti-tank systems, could prove decisive in confronting Russian armored units.\n\n'We cannot stand aside while the empire expands again,' Colonel Mamedov stated. 'Ukraine today is the line of defense for all post-Soviet republics. If Kyiv falls, the torch of freedom will be extinguished. We will not allow this to happen.'\n\nThe Azerbaijani Brigade has already attracted the attention of Ukrainian command with its discipline and technical skills. Despite its relatively small size, this unit can have a significant impact at key points on the front."
 ukraine.824.a:0 "Their experience will be invaluable!"
 azerbaijani_volunteers_tooltip:0 "Received the §YAzerbaijani Brigade§! with experts in anti-tank warfare."


 ### Tajikistan ###
 ukraine.825.t:0 "Tajik Resistance Battalion Arrived in Ukraine"
 ukraine.825.d:0 "Following the Russian occupation of Tajikistan and the establishment of a pro-Kremlin regime, a group of Tajik military personnel and civilian activists formed a resistance battalion and, overcoming numerous obstacles, reached Ukrainian territory.\n\nThe battalion is led by former Tajik Army special forces commander Rustam Nazarov. 'Our peoples are united by a common past and, unfortunately, a common threat. The Kremlin will not stop at one country - its goal is to restore the empire. We must stop this aggression here and now,' he stated at a meeting with Ukrainian command.\n\nAlthough the Tajik battalion is inferior in size and equipment to other foreign formations, its fighters have invaluable experience in combat operations in mountainous terrain and guerrilla warfare. Many of them served in Tajik mountain brigades and are familiar with Russian military tactics and equipment.\n\nFor the Ukrainian army, the arrival of Tajik volunteers has not only military but also symbolic significance, demonstrating that resistance to Russian aggression unites peoples from Central Europe to Central Asia."
 ukraine.825.a:0 "The struggle for freedom has no borders!"
 tajik_volunteers_tooltip:0 "Received the §YTajik Resistance Battalion§! with guerrilla warfare experience."


 ### Armenia ###
 ukraine.828.t:0 "Armenian Ararat Battalion Joins the Fight"
 ukraine.828.d:0 "Today, a large group of Armenian volunteers who formed the 'Ararat Battalion' arrived at Ukrainian troop positions. After Russian troops entered Armenia, establishing full control there, many patriotic Armenians refused to accept the occupation and decided to continue the struggle on Ukrainian soil.\n\nBattalion commander, Colonel Aram Sargsyan, noted in his address to Ukrainian command: 'History has taught the Armenian people that freedom is never given easily; one must always fight for it. Today, the fate not only of Ukraine or Armenia, but of all the peoples of the former USSR is being decided here, on these battlefields. By winning here, we will begin the liberation of our native lands.'\n\nArmenian fighters possess significant combat experience, many of them participated in the Karabakh conflicts. Their anti-tank warfare skills and combat in difficult mountain conditions are especially valuable. The battalion is well-equipped with equipment and weaponry that volunteers managed to evacuate before Russian troops established full control over their country."
 ukraine.828.a:0 "Welcome, brothers in arms!"
 armenian_volunteers_tooltip:0 "Received the §YArmenian Ararat Battalion§! with specialists in artillery and anti-tank warfare."


 ### Turkmenistan ###
 ukraine.829.t:0 "Turkmen Mobile Unit in Service of Ukraine"
 ukraine.829.d:0 "Across the Caspian Sea and then by secret routes through the Caucasus, a group of Turkmen volunteers arrived in Ukraine. Despite Turkmenistan's isolationist policies and the subsequent occupation of the country by Russia, these brave people managed to organize resistance and ultimately reach Ukraine to continue the fight against a common enemy.\n\nThe unit is led by Major Dovlet Berdyev, a former commander of a Turkmen Army special forces unit. 'Turkmenistan has been closed off from the world for many years, but the hearts of our people have always been open to freedom. The Russian occupation showed us that neutrality is an illusion of security. Today we are here because we understand: if Ukraine falls, the entire region will plunge into the darkness of a new empire,' he stated at a meeting with Ukrainian officers.\n\nThe Turkmen volunteers formed a highly mobile unit specializing in rapid raids and reconnaissance operations. Many of the fighters have experience serving in desert regions, which makes them especially effective in the open spaces of southern Ukraine."
 ukraine.829.a:0 "Freedom unites all peoples!"
 turkmen_volunteers_tooltip:0 "Received the §YTurkmen Mobile Unit§! with high mobility and reconnaissance skills."


 ### Kyrgyzstan ###
 ukraine.830.t:0 "Kyrgyz Mountain Battalion Arrived in Ukraine"
 ukraine.830.d:0 "Following the occupation of Kyrgyzstan by Russian troops, a significant portion of Kyrgyz military personnel refused to obey the new regime. Overcoming numerous obstacles and persecution, a group of officers and soldiers managed to organize resistance and ultimately break through to Ukrainian territory, where they formed the Kyrgyz Mountain Battalion.\n\nThe battalion commander, Lieutenant Colonel Bolot Asanov, former commander of a Kyrgyz Army mountain rifle brigade, said in his first address to Ukrainian command: 'Our peoples are connected not only by a common Soviet past but also by a common aspiration for freedom. Kyrgyz have always been a free people of the mountains, and we will not accept the new Russian yoke. By fighting for Ukraine today, we fight for Kyrgyzstan's freedom tomorrow.'\n\nThe battalion specializes in combat operations in difficult terrain and air defense. The battalion's fighters have extensive experience serving in the mountainous regions of Tian Shan, which makes them especially valuable for operations in the hilly and mountainous regions of Ukraine. Despite limited heavy weaponry, their tactical training and fighting spirit compensate for this shortcoming."
 ukraine.830.a:0 "The mountain eagles join our struggle!"
 kyrgyz_volunteers_tooltip:0 "Received the §YKyrgyz Mountain Battalion§! with experience in combat in difficult terrain."

 
 # Focuses
 UKR_donbass_conflict_and_crimea_annexation:0 "Donbas Conflict and Crimean Annexation"
 UKR_donbass_conflict_and_crimea_annexation_desc:0 "In 2014, Russia annexed Crimea and supported separatist movements in Donbas, violating the 1994 Budapest Memorandum. These events became a turning point in Ukraine's modern history. As a result of hostilities, more than 13,000 people were killed, and millions of citizens were forced to leave their homes. Ukraine lost control over 7% of its territory, and the cost of losses in Donbas industry alone is estimated at $50 billion. Sanctions imposed against the aggressor became the first step toward international pressure, but the threat of full-scale war remains real."
 
 UKR_oligarchs_and_economy:0 "Oligarchs and the Economy"
 UKR_oligarchs_and_economy_desc:0 "Ukraine is among the countries with the highest level of economic inequality. By early 2020, more than 70% of key economic sectors were controlled by just a dozen oligarchs. The combined wealth of the country's largest tycoons – Rinat Akhmetov, Viktor Pinchuk, Ihor Kolomoisky – exceeded $14 billion, while the minimum wage remained at $150. Ukraine needs full-scale de-oligarchization; without it, the economy will remain hostage to private interests."
 
 UKR_corruption_and_power_consolidation:0 "Corruption and Power Consolidation"
 UKR_corruption_and_power_consolidation_desc:0 "Endemic corruption remains a serious problem for Ukraine. It is necessary to concentrate political will to combat it and carry out reforms in key state institutions.\n\n Reform of law enforcement agencies, NABU and SAP have not yet produced significant results, and schemes of 'kickbacks' and shadow deals continue to undermine trust in the authorities. Ukrainians need a decisive blow against corruption, otherwise the country will remain under the control of oligarchic clans."
 
 UKR_presidential_elections:0 "Presidential Elections"
 UKR_presidential_elections_desc:0 "The 2019 presidential elections became a symbol of distrust in the old political elite. Volodymyr Zelensky, receiving 73.2% of the vote in the second round, won the largest victory in the country's history. However, the new president's lack of political experience calls into question his ability to implement promised reforms. Oligarchic groups and pro-Russian forces are already looking for ways to regain control over power, and public trust can quickly disappear if there are no real changes."
 
 UKR_path_to_independence:0 "Path to Independence"
 UKR_path_to_independence_desc:0 "Ukraine faces a historic choice: become a fully sovereign state or remain in the shadow of geopolitical players. Russian dependence in the gas sector, army underfunding, and pressure from external creditors hinder development. To strengthen independence, it is necessary to develop our own economy, modernize the army, and carry out judicial reform. The time for compromises has passed – Ukraine must prove its independence to the world."
 
 UKR_european_integration:0 "European Integration"
 UKR_european_integration_desc:0 "Ukraine is confidently moving toward Europe. Since 2017, a visa-free regime with the EU has been in effect, and trade turnover with European countries increased by 7% in 2019. However, corruption and a weak legal system remain obstacles on the path to EU membership. In the coming years, the country must bring legislation into compliance with EU norms, reform the judicial system, and prove that Ukraine is Europe, not a gray buffer zone between East and West."
 
 UKR_secure_western_aid:0 "Secure Western Aid"
 UKR_secure_western_aid_desc:0 "Since the beginning of the war, Ukraine has received more than $3.8 billion in military aid from the USA, Great Britain, and the EU. Modern Javelin anti-tank systems, drone supplies, and AFU reforms have made the army stronger, but this is not enough. We need to continue building cooperation with NATO, attracting new technologies, and training military personnel according to Alliance standards. Without Western support, Ukraine risks being left alone against the enemy."
 
 UKR_develop_domestic_industry:0 "Develop Domestic Industry"
 UKR_develop_domestic_industry_desc:0 "Ukraine possesses colossal industrial potential. The country's defense industry was in the top 10 world weapons manufacturers, but after 2014, production fell by 40%. Factories in Kharkiv, Dnipro, and Zaporizhzhia require modernization to restore Ukraine's status as an industrial giant. Without a strong economy, the war cannot be won – the country needs a new industrialization!"
 
 UKR_defensive_fortifications:0 "Defensive Fortifications"
 UKR_defensive_fortifications_desc:0 "The fortification system in the east is Ukraine's shield. However, as of 2020, only 30% of planned fortifications were completed. The 'Wall' project on the border with Russia was never completed, and war could flare up with renewed force. To protect the country, it is urgently necessary to build fortifications, construct concrete pillboxes, and deploy minefields. Ukraine must become a fortress, not a corridor for invasion!"
 
 UKR_territorial_defense_forces:0 "Territorial Defense Forces"
 UKR_territorial_defense_forces_desc:0 "Forming territorial defense forces will allow mobilizing the civilian population to defend their regions and free up the regular army for other tasks.\n\n In conditions of hybrid warfare, every region must be ready for defense. Forming territorial defense forces will make it possible to mobilize hundreds of thousands of reservists and arm citizens. Poland, the Baltic states, and Finland have already implemented successful territorial defense models – Ukraine must follow the same path."
 
 UKR_diplomatic_offensive:0 "Diplomatic Offensive"
 UKR_diplomatic_offensive_desc:0 "Active diplomacy is a key element of our strategy. It is necessary to strengthen international pressure on the aggressor and secure the support of the world community. Ukraine must turn the international arena into a battlefield for truth. In 2019, a UN resolution supported Ukraine's territorial integrity, but Russia continues diplomatic pressure. We need to strengthen positions in the UN, OSCE, NATO, and attract more allies. Diplomacy is the weapon of the 21st century, and Ukraine must master it perfectly."
 
 UKR_national_reconciliation:0 "National Reconciliation"
 UKR_national_reconciliation_desc:0 "Internal unity is the foundation of a strong state. It is necessary to overcome regional differences and consolidate society around common values and goals. Ukrainians must be united in the face of external threats. Pro-Russian propaganda and internal conflicts weaken the country, and attempts to 'make peace' with the aggressor only fuel new crises. Unity is strength, and without it Ukraine cannot win. The time has come to put an end to old disputes and unite for the future!"


 UKR_economic_transformation:0 "Economic Transformation of Ukraine"
 UKR_economic_transformation_desc:0 "Ukraine's economic system needs deep modernization. Since gaining independence, the country's economy has faced challenges: an outdated industrial base, low investment levels, and complex administrative barriers. The government aims to create favorable conditions for entrepreneurship growth, improving the investment climate, and developing critically important sectors. An important part of reforms is improving tax policy, fighting corruption, and digitizing the economy."


 UKR_big_construction:0 "Big Construction"
 UKR_big_construction_desc:0 "The country's infrastructure requires significant investment: more than 90% of roads are in unsatisfactory condition, railway infrastructure wear exceeds 60%, and many regions lack modern transport logistics. Launching the 'Big Construction' program aims to modernize the road network, develop railway communications, and build new social facilities. This will create jobs and raise the overall level of economic development. However, the program requires significant budget resources, which may increase the burden on public finances."


 UKR_digital_economy:0 "Digital Economy"
 UKR_digital_economy_desc:0 "Ukraine is betting on digital transformation to accelerate economic growth. Implementation of electronic services, IT industry development, and support for innovative companies will help increase investment inflows and make government management more transparent. One of the key projects will be 'Diia.City' – a special regime for IT companies aimed at creating favorable business conditions, which should increase Ukraine's competitiveness in the global market."


 UKR_startup_support:0 "Startup Support"
 UKR_startup_support_desc:0 "Ukraine's startup ecosystem has great potential but faces a lack of investment and difficulties in entering international markets. Launching government programs to support innovative business will stimulate the development of technology companies. Special attention will be paid to fintech, agrotechnology, and artificial intelligence, where Ukrainian companies already demonstrate competitiveness."
 UKR_startup_ecosystem_tooltip:0 "Digital Ukraine. IT infrastructure development. Investment in IT startups."


 UKR_agricultural_reform:0 "Agricultural Reform"
 UKR_agricultural_reform_desc:0 "The agricultural sector is one of the key sectors in Ukraine's economy, but its efficiency is constrained by an outdated material base. More than 50% of agricultural equipment has been in use beyond its established service life, and the level of mechanization in certain segments remains low. Conducting reform will allow modernizing the agricultural sector, attracting investment, and increasing productivity, making Ukraine a strong player in the global food market."


 UKR_land_market_opening:0 "Opening the Land Market"
 UKR_land_market_opening_desc:0 "Launching land reform is an important step in developing the agricultural sector. Introduction of transparent mechanisms for buying and selling agricultural land will attract private investment and increase their value. However, this step is accompanied by public skepticism, as there is a risk of land concentration in the hands of large agricultural holdings. The state takes on the task of monitoring and regulating the market to avoid such consequences."


 UKR_invest_in_infrastructure:0 "Invest in Infrastructure"
 UKR_invest_in_infrastructure_desc:0 "Economic development is impossible without quality infrastructure. Investment in modernizing railways, ports, and logistics hubs will provide the country with new opportunities for trade and accelerate transport connections within the country. One of the key directions will be updating the rolling stock of 'Ukrzaliznytsia,' as well as developing high-speed railway lines, which will improve conditions for business and raise the living standards of the population."


 UKR_reform_general_staff_nato_standards:0 "General Staff Reform: NATO Standards"
 UKR_reform_general_staff_nato_standards_desc:0 "Modern wars require strict discipline, professional command, and effective management of combat operations. Integration of NATO standards into the structure of our General Staff will ensure coordination of forces at the level of the world's leading armies. This will improve strategic planning, operational flexibility, and cooperation with allies."


 UKR_mobile_tactics_doctrine:0 "Mobile Doctrine: Offensive Tactics"
 UKR_mobile_tactics_doctrine_desc:0 "Rapid movement, decisive strikes on key enemy positions, and striving for deep breakthrough – these are the foundations of modern mobile warfare. Development of mechanized and motorized units will allow us to apply maneuver warfare tactics, which will ensure superiority on the battlefield."


 UKR_modernize_tank_forces:0 "Modernize Tank Forces"
 UKR_modernize_tank_forces_desc:0 "Armored forces are the backbone of any modern army. Large-scale rearmament of our tank formations with the latest equipment will allow us to increase combat power, offensive speed, and fire support for infantry units. Investment in the development and production of modern tanks will strengthen our defense capabilities."


 UKR_blitzkrieg_tactics:0 "Blitzkrieg Tactics"
 UKR_blitzkrieg_tactics_desc:0 "History has proven that lightning-fast, high-intensity offensive operations can crush the enemy before they have time to regroup. Development of the concept of rapid maneuver, deep breakthrough, and close cooperation between tank, mechanized, and aviation formations will allow us to dominate in any combat conditions."


 UKR_combined_arms_doctrine:0 "Balanced Doctrine: Combined Operations"
 UKR_combined_arms_doctrine_desc:0 "Effective interaction of all branches of armed forces is the key to victory. Combined use of armored vehicles, infantry, artillery, and aviation will allow maximum effective use of the strengths of each of these elements. Competent coordination of forces will create a solid foundation for conducting offensive and defensive operations."


 UKR_mobile_groups_tactics:0 "Mobile Group Tactics"
 UKR_mobile_groups_tactics_desc:0 "Flexibility and speed are key elements of modern military strategy. Creating highly mobile strike groups will allow us to effectively respond to changes at the front, quickly concentrate forces at critical points, and deliver lightning strikes against the enemy."


 UKR_consolidate_tactical_gains:0 "Consolidate Tactical Gains"
 UKR_consolidate_tactical_gains_desc:0 "Victory on the battlefield is not only skillful attacks but also the ability to hold conquered positions. We will deploy fortified lines in strategically important directions, strengthen engineer troops, and ensure operational logistics, which will allow us to minimize losses and guarantee reliable retention of territories."


 UKR_defensive_doctrine:0 "Deep Defense: Defensive Doctrine"
 UKR_defensive_doctrine_desc:0 "Effective defense is not just holding positions but active maneuvering of forces, counterattacks, and echeloned defense. Development of a modern concept of deep defense will allow us to exhaust the enemy, destroy their communications, and create conditions for transitioning to a counteroffensive."

 # Ideas
 UKR_endemic_corruption:0 "Endemic Corruption"
 UKR_endemic_corruption_desc:0 "Corruption in Ukraine has deep historical roots dating back to Soviet times. State capture by oligarchs, inefficient bureaucracy, and weak rule of law have created a system where corruption permeates all levels of government and business. Transparency International studies consistently place Ukraine among the most corrupt countries in Europe, with estimated losses of 4-6% of annual GDP due to corruption. This systemic problem undermines economic development, scares away foreign investment, and destroys public trust in state institutions."
 
 UKR_corruption_reforming:0 "Anti-Corruption Reforms"
 UKR_corruption_reforming_desc:0 "Ukraine has begun implementing a comprehensive anti-corruption framework with new specialized institutions such as NABU (National Anti-Corruption Bureau) and NACP (National Agency on Corruption Prevention). Although these reforms follow successful models from countries like Romania and Georgia, they face significant resistance from stakeholders. Initial progress is encouraging but remains fragile, as shown by the mixed success of similar reforms in post-Soviet states. Economic studies show that reducing corruption levels could potentially increase Ukraine's annual GDP growth by 1-2%, although the transition period often disrupts established business practices and administrative processes."


 UKR_western_support:0 "Western Support"
 UKR_western_support_desc:0 "Ukraine receives significant financial, technical, and military assistance from Western countries, which enhances its defense capabilities and reform potential."
 
 UKR_industrial_revitalization:0 "Industrial Revitalization"
 UKR_industrial_revitalization_desc:0 "The program for modernizing and diversifying industry aims to increase the competitiveness of Ukrainian products and expand export potential."
 
 UKR_territorial_defense_idea:0 "Territorial Defense Forces"
 UKR_territorial_defense_idea_desc:0 "The new territorial defense system allows mobilizing the local population to protect critical infrastructure and combat sabotage groups."
 
 UKR_economic_reform_attempts:0 "Economic Reform Attempts"
 UKR_economic_reform_attempts_desc:0 "The government is making efforts to reform the economy, but resistance from oligarchs and bureaucracy slows these processes."


 UKR_government_corruption_low:0 "Ukrainian Oligarchy"
 UKR_government_corruption_low_desc:0 "Various oligarchic clans have long and firmly entered the sphere of influence of our power structures. Unspoken rewards for facilitation, bribery, extortion, and other abuses of power are widespread among civil servants. Despite existing anti-corruption legislation, the weak judicial system and unfavorable economic situation make enforcement of these laws extremely difficult, and in some cases completely impossible. Projects have been launched aimed at reducing the influence of oligarchs on the state."


 # Localization for Ideas
 UKR_big_construction_idea:0 "Big Construction Program"
 UKR_land_reform_idea:0 "Land Reform"
 UKR_digital_state_idea:0 "State in a Smartphone"
 UKR_startup_ecosystem_idea:0 "Ukrainian Startup Ecosystem"
 UKR_land_market_idea:0 "Open Land Market"
 UKR_infrastructure_modernization_idea:0 "Infrastructure Modernization"
 UKR_economic_transformation_idea:0 "Economic Transformation of Ukraine"


 UKR_big_construction_idea_desc:0 "The 'Big Construction' program is a large-scale project to modernize infrastructure across the entire country. Roads, schools, hospitals, and other infrastructure facilities are being built at an accelerated pace. Despite criticism about spending inefficiency, the program stimulates the economy and creates jobs."
 UKR_land_reform_idea_desc:0 "Opening the agricultural land market is a historic decision that ended a multi-year moratorium. Thanks to this reform, land becomes a full-fledged economic asset, attracting investment and stimulating modernization of the agricultural sector, which is one of the key drivers of the Ukrainian economy."
 UKR_digital_state_idea_desc:0 "The 'State in a Smartphone' initiative aims to digitalize government services and combat bureaucracy. The 'Diia' project allows citizens to quickly and conveniently receive government services, which not only increases the efficiency of the government apparatus but also significantly reduces opportunities for corruption."
 UKR_startup_ecosystem_idea_desc:0 "The government is actively working to create favorable conditions for the IT sector and startups. Tax incentives, special legal regimes, and the 'Startup Fund' form an ecosystem conducive to innovation. Ukrainian IT specialists, known for their high professionalism, are becoming an important export resource for the country."
 UKR_land_market_idea_desc:0 "Lifting the moratorium on agricultural land sales brings a huge segment of the economy 'out of the shadows.' Farmers gain access to credit resources by using land as collateral, and investors gain the opportunity to invest in promising agribusiness. Despite restrictions for foreigners, the land market stimulates investment inflows and modernization of agricultural production."
 UKR_infrastructure_modernization_idea_desc:0 "Large-scale modernization of transport infrastructure improves logistics and reduces transportation costs. New roads, bridges, and updated ports not only accelerate the movement of goods across the country but also strengthen Ukraine's role as a transit hub between Europe and Asia. Modern infrastructure is the foundation of a competitive economy."
 UKR_economic_transformation_idea_desc:0 "Ukraine's economic transformation aims to build a modern, competitive European-type economy. Ongoing reforms focus on deregulation, privatization of inefficient state enterprises, improving the investment climate, and integration into European economic structures. The key goal is to increase citizens' welfare and strengthen the state's economic stability."


 UKR_nato_command_structure:0 "NATO Command Structure"
 UKR_nato_command_structure_desc:0 "Ukraine is reforming its military system in accordance with NATO standards, improving operational planning and command management."
 
 UKR_blitzkrieg_doctrine:0 "Lightning War Doctrine"
 UKR_blitzkrieg_doctrine_desc:0 "Ukraine is betting on maneuverable offensive operations, increasing the speed and breakthrough power of its mechanized and motorized forces."
 
 UKR_rapid_offensive_operations:0 "Rapid Offensive Tactics"
 UKR_rapid_offensive_operations_desc:0 "Our army is focused on lightning attacks, surpassing the enemy in speed and initiative, but at the cost of greater resource and organizational requirements."
 
 UKR_mobile_battlegroups:0 "Mobile Battle Groups"
 UKR_mobile_battlegroups_desc:0 "The combination of artillery firepower and high mobility of mechanized units makes Ukrainian forces more flexible and balanced in combat."
 
 UKR_consolidation_tactics:0 "Position Consolidation Tactics"
 UKR_consolidation_tactics_desc:0 "Our army emphasizes defensive doctrine, improving the ability to dig in, fortify, and contain enemy advances."
 
 UKR_fortification_bureau:0 "Fortification Bureau"
 UKR_fortification_bureau_desc:0 "A specialized bureau has been created for the construction of defensive structures, fortification of lines, and protection of strategically important points."
 
 UKR_echeloned_defense:0 "Deep Echeloned Defense"
 UKR_echeloned_defense_desc:0 "Ukraine's defensive strategy is built on creating multi-layered fortified positions, complicating enemy breakthrough and minimizing losses."
 
 UKR_western_military_advisors:0 "Western Military Advisors"
 UKR_western_military_advisors_desc:0 "Cooperation with NATO has allowed attracting Western military experts, which contributes to modernizing our army and improving combat training."
 
 UKR_modern_command_and_control:0 "Modern Command and Control Systems"
 UKR_modern_command_and_control_desc:0 "Implementation of modern communications, intelligence, and coordination technologies makes Ukrainian armed forces more effective and organized in combat."


 UKR_fortification_construction:0 "Fortification Construction"
 UKR_fortification_construction_desc:0 "Ukraine has always faced threats, and now we need to strengthen our defense. Creating new fortifications and defensive structures will enhance our protection and slow enemy advancement. We will also improve engineering developments to accelerate construction and production of fortifications."


 UKR_deep_defense_tactics:0 "Deep Defense Tactics"
 UKR_deep_defense_tactics_desc:0 "We are adapting our strategy to modern realities by implementing deep echeloned defense. This tactic will allow us to hold positions, increasing the effectiveness of trench warfare and reducing damage from enemy attacks. Thanks to improved organization, our forces will be able to resist the aggressor for longer."

 # Additional Localizations for Ideas Mentioned in Events
 UKR_agricultural_boom:0 "Agricultural Boom"
 UKR_agricultural_boom_desc:0 "Opening the land market provided a powerful impetus for the development of the agricultural sector. New investments, available credit, and improved technologies increase the efficiency of agricultural production. Ukraine is confidently strengthening its status as the 'breadbasket of Europe,' increasing production and export of agricultural products."
 
 UKR_slow_land_reform:0 "Delayed Land Reform"
 UKR_slow_land_reform_desc:0 "Land reform is progressing more slowly than expected. Complex bureaucratic procedures, legal uncertainty, and persistent distrust limit activity in the land market. Although certain progress is noticeable, the reform's full potential is far from being realized."
 
 UKR_digital_leadership_idea:0 "Leadership in Digitalization"
 UKR_digital_leadership_idea_desc:0 "The 'Diia' project has become one of the most advanced digital government projects in the world. Ukraine has become an example for other countries in the field of digitalization of government services. The project's success has not only made citizens' lives more convenient but has also significantly reduced corruption risks by minimizing the human factor in bureaucratic procedures."
 
 UKR_digital_security_issues:0 "Digital Security Problems"
 UKR_digital_security_issues_desc:0 "Detected vulnerabilities in digital government systems have raised serious concerns about the security of citizens' personal data. A temporary slowdown in digitalization is necessary to conduct a comprehensive security audit and eliminate identified shortcomings."
 
 UKR_energy_price_control:0 "State Regulation of Energy Prices"
 UKR_energy_price_control_desc:0 "In the context of the energy crisis, the government introduced strict regulation of energy carrier prices and utility services. This measure protected the population from a sharp increase in tariffs but created an additional burden on the state budget and reduced the investment attractiveness of the energy sector."
 
 UKR_energy_market_adjustment:0 "Energy Sector Market Adaptation"
 UKR_energy_market_adjustment_desc:0 "The government allowed energy prices to be formed under the influence of market factors while expanding targeted subsidy programs for low-income segments of the population. Although this approach caused social tension in the short term, it creates incentives for increasing energy efficiency and attracting investment to the industry."
 
 UKR_investment_boom:0 "Investment Boom"
 UKR_investment_boom_desc:0 "A successful investment forum launched a whole series of major international projects in Ukraine. The inflow of foreign direct investment has noticeably accelerated, creating new jobs and stimulating economic growth. Investors are especially active in information technology, renewable energy, and agribusiness."
 
 UKR_investment_disappointment:0 "Insufficient Investor Interest"
 UKR_investment_disappointment_desc:0 "Despite extensive preparation, the investment forum did not meet expectations. International investors are showing caution, pointing to persisting problems in the areas of property rights protection, the judicial system, and corporate governance. Additional reforms are needed to improve the investment climate."
 
 UKR_export_focused_industry:0 "Export-Oriented Industry"
 UKR_export_focused_industry_desc:0 "The government actively supports industrial enterprises focused on exports. Export credits, tax benefits, and assistance in product certification according to international standards help Ukrainian manufacturers expand their presence in foreign markets. Growth in export revenue strengthens the national currency and improves the country's trade balance."
 
 UKR_domestic_industry_focus:0 "Domestic Industrial Market Development"
 UKR_domestic_industry_focus_desc:0 "The priority of economic policy has become the development of the domestic industrial market. Import substitution programs, government procurement of domestic products, and stimulation of domestic demand are aimed at creating a more sustainable and self-sufficient economic system, less dependent on fluctuations in world markets."


 # Additional Localizations for Ideas Mentioned in Events
 UKR_modified_land_reform_idea:0 "Modified Land Reform"
 UKR_modified_land_reform_idea_desc:0 "After mass protests, the government made concessions and introduced changes to the land reform. Restrictions on land concentration in one person's hands were tightened, and local communities were granted additional powers to control land transactions. These changes calmed part of the protesters but slowed the pace of reform and reduced its economic efficiency."


 UKR_booming_it_sector_idea:0 "Booming IT Sector"
 UKR_booming_it_sector_idea_desc:0 "The Ukrainian IT industry is experiencing a real golden age. Thanks to investments in infrastructure, education, and favorable conditions for technology business, IT services exports are becoming one of the key sources of foreign currency inflows to the country. 'Ukrainian Silicon Valley' is attracting more and more international investors and talent."


 UKR_it_tax_policy:0 "Increased IT Sector Taxation"
 UKR_it_tax_policy_desc:0 "The government introduced additional taxes for IT companies and changed the conditions for individual entrepreneurs in this sector. This ensured a short-term inflow of funds to the budget but caused dissatisfaction in the industry. Some companies have begun considering the possibility of relocating their offices to countries with more favorable tax regimes."


 UKR_construction_investigation:0 "Investigation of Abuses in 'Big Construction'"
 UKR_construction_investigation_desc:0 "After the exposure of large-scale corruption schemes in the 'Big Construction' program, an official investigation was launched. Many projects are temporarily suspended, and tender procedures are being reviewed. This has negatively affected the pace of infrastructure development but should lead to more efficient use of public funds in the future."


 UKR_government_anti_corruption:0 "Anti-Corruption Policy"
 UKR_government_anti_corruption_desc:0 "The Government of Ukraine has launched a series of anti-corruption reforms."

 # Events
 ukraine.105.t:0 "Violation of the Budapest Memorandum"
 ukraine.105.d:0 "The 1994 Budapest Memorandum provided Ukraine with security guarantees in exchange for giving up nuclear weapons. However, in 2014, Russia, one of the guarantors, annexed Crimea and supported separatists in eastern Ukraine, clearly violating its obligations. This called into question the effectiveness of international treaties and undermined the nuclear non-proliferation regime. The international community expressed concern, but no real steps were taken to restore Ukraine's territorial integrity."
 ukraine.105.a:0 "Demand the fulfillment of guarantees from other signatories!"
 ukraine.105.b:0 "We can only rely on our own strength."

 ukraine.106.t:0 "Economy in 2020"
 ukraine.106.d:0 "Ukraine's economy in 2020 is in a difficult position. GDP per capita remains one of the lowest in Europe. Despite certain successes in export diversification, dependency on raw materials persists. The banking system has stabilized after the 2014-2015 crisis, but lending to the real sector remains limited. Oligarchic groups control a significant part of the economy, hindering fair competition and investment attraction. The COVID-19 pandemic has exacerbated these problems, causing additional production cuts and rising unemployment."
 ukraine.106.a:0 "Intensify anti-corruption reforms."
 ukraine.106.b:0 "Focus on attracting investments."
 
 ukraine.107.t:0 "The Verkhovna Rada and Oligarchs"
 ukraine.107.d:0 "The Verkhovna Rada of Ukraine, despite the renewal of its composition, remains under significant influence from oligarchic groups. Many deputies represent the interests of big business, which sometimes leads to the blocking of important reforms. There is ongoing discussion of a de-oligarchization bill that should limit the influence of oligarchs on politics and media. However, experts doubt its effectiveness. President Zelensky is trying to consolidate power to implement necessary reforms but faces resistance from various political forces."
 ukraine.107.a:0 "Pass the de-oligarchization bill."
 ukraine.107.b:0 "Seek compromise with influential groups."

 ukraine.108.t:0 "Presidential Elections"
 ukraine.108.d:0 "In 2019, Ukraine held presidential elections that led to a change in the political elite. Volodymyr Zelensky, a well-known comedian with no political experience, won a convincing victory over incumbent President Petro Poroshenko. His success is explained by society's fatigue with corruption, the ongoing conflict in the east, and the unfulfilled promises of the previous government. Voters voted for change, hoping for a renewal of the political system and solutions to pressing problems. However, the new president's lack of political experience raises concerns among some segments of society and international partners."
 ukraine.108.a:0 "Zelensky wins by a landslide."
 ukraine.108.b:0 "Poroshenko maintains power (alternative history)."

 ukraine.100.t:0 "Path to Independence"
 ukraine.100.d:0 "Since gaining independence in 1991, Ukraine has traveled a difficult path of state-building. Today, the country faces a choice of strategic development direction. European integration and reforms remain a priority, but the conflict in the east and the annexation of Crimea create serious obstacles. The government seeks to strengthen defense capabilities while implementing necessary reforms. The people of Ukraine are increasingly vocal about their desire for true independence, freedom from corruption, and external influence. The chosen path will determine the country's future for decades to come."
 ukraine.100.a:0 "Ukraine will endure and prevail!"

 ukraine.110.t:0 "Diplomatic Offensive"
 ukraine.110.d:0 "Ukraine is intensifying diplomatic efforts to gain international support. The President and Foreign Minister are making numerous visits to European capitals and Washington. Issues of Ukraine's territorial integrity and the situation in the east of the country are being raised at international forums. Special attention is paid to interaction with NATO and the EU, as well as the development of bilateral relations with key partners. These efforts are bearing fruit: international pressure on Russia is increasing, and support for Ukraine is becoming more concrete and significant."
 ukraine.110.a:0 "Focus on partnership with the United States."
 ukraine.110.b:0 "Priority - European integration."

 ukraine.300.t:0 "Scandal Surrounding Arsen Avakov"
 ukraine.300.d:0 "Minister of Internal Affairs Arsen Avakov has found himself at the center of a corruption scandal. Public discontent is growing, reducing trust in the government."
 ukraine.300.a:0 "This is a blow to the country's stability!"

 ukraine.301.t:0 "Resignation of Arsen Avakov"
 ukraine.301.d:0 "After long months of political disputes and public pressure, Arsen Avakov was removed from the post of Minister of Internal Affairs. His resignation was the result of scandals related to corruption and inefficiency of reforms in law enforcement agencies.\n\nPublic reaction was mixed: some of the population supported the decision, seeing it as a step towards cleansing the government, while others believe that Avakov became a 'scapegoat' to divert attention from deeper problems. The president's image has suffered: some see this as weakness and indecision, others as an attempt to restore trust in the government."
 ukraine.301.a:0 "Accept the consequences and appoint a new minister."

 # Protests against land reform
 ukraine_economy.200.t:0 "Protests Against Opening the Land Market"
 ukraine_economy.200.d:0 "After the adoption of the law abolishing the moratorium on the sale of agricultural lands, mass protests erupted throughout the country. According to sociologists, about 72% of the population oppose opening the land market in its current form. Protesters, many of whom are small farmers and rural residents, are concerned about the possibility of land concentration in the hands of oligarchs and large agricultural holdings.\n\nThe Socialist Party, actively criticizing the land reform, has significantly strengthened its position by coordinating protest actions. In Kyiv, thousands of people gathered outside the Verkhovna Rada with placards saying 'Land to the People!' and 'No to the Sell-off of Ukraine!'.\n\nHow should the government respond to the situation?"
 ukraine_economy.200.a:0 "Suppress the protests - land reform is necessary for the country!"
 ukraine_economy.200.b:0 "Make adjustments to the land reform, taking into account the demands of protesters"

 # Growth of IT exports
 ukraine_economy.201.t:0 "IT Export Boom"
 ukraine_economy.201.d:0 "The program supporting startups and digitalization of the economy is yielding significant results. According to the National Bank of Ukraine, IT services exports grew by 36% over the past year, reaching $6.8 billion. Ukrainian IT specialists and companies are becoming increasingly competitive in the global market.\n\nThe IT Ukraine Association notes that the number of people working in the industry has grown to 285,000, with average salaries in the sector 3-4 times higher than the national average. Large international companies continue to open their R&D centers in Ukraine, attracted by the high level of training of local specialists and favorable tax regime for IT companies.\n\nSome economists suggest using the growing revenues of the sector to replenish the budget through additional taxation, while business representatives call for maintaining preferential conditions for further growth."
 ukraine_economy.201.a:0 "Maintain benefits for the IT sector and strengthen support"
 ukraine_economy.201.b:0 "Introduce additional taxes for IT companies - they can afford it"

 # Corruption scandal
 ukraine_economy.202.t:0 "Corruption Scandal in the 'Big Construction' Program"
 ukraine_economy.202.d:0 "An investigative journalism report by 'Nashi Groshi' revealed serious violations in the implementation of the 'Big Construction' program. According to journalists, the cost of road construction under the program exceeds the average market price by 30-40%, and the tender system is organized in such a way that most contracts go to companies associated with the close circle of high-ranking officials.\n\nAccording to the investigation, some projects use low-quality materials, which has already led to the premature deterioration of several recently repaired road sections. The total amount of potential abuses is estimated by experts at 2.3 billion hryvnias.\n\nOpposition politicians demand an immediate investigation and the resignation of several officials. How should we respond to this scandal?"
 ukraine_economy.202.a:0 "Initiate a thorough anti-corruption investigation"
 ukraine_economy.202.b:0 "Downplay the scandal and continue the 'Big Construction' program"

 # Results of land reform
 ukraine_economy.203.t:0 "First Results of Land Reform"
 ukraine_economy.203.d:0 "Enough time has passed since the opening of the land market to summarize the first results of this historic reform. According to the Ministry of Agrarian Policy, more than 42 thousand transactions with agricultural land with a total area of over 170 thousand hectares were registered in the first 6 months.\n\nThe National Bank of Ukraine notes that agricultural producers' access to credit has significantly improved - banks have begun to actively accept land rights as collateral. The amount of loans issued to the agricultural sector increased by 24% compared to the same period last year.\n\nHowever, the results of the reform are evaluated ambiguously by experts. Some economists point out that land prices turned out to be lower than predicted, and the share of foreign investment in the agricultural sector has not grown as significantly as expected. Opposition politicians continue to criticize the reform, pointing to the risks of monopolization of the land market."
 ukraine_economy.203.a:0 "The reform successfully stimulates the development of the agricultural sector"
 ukraine_economy.203.b:0 "The results of the reform are below expectations - adjustments are needed"

 # Results of "State in a Smartphone"
 ukraine_economy.204.t:0 "Successes of the 'State in a Smartphone' Program"
 ukraine_economy.204.d:0 "The 'Diia' application is becoming one of the most successful digital transformation projects in Europe. According to the Ministry of Digital Transformation, more than 12 million Ukrainians are already using the application, and the number of available digital services has exceeded 70.\n\nDigital passports, driver's licenses, birth certificates, and other documents in a smartphone have significantly simplified citizens' daily lives. According to a sociological survey, 76% of users positively evaluate the application, and Ukraine has entered the TOP-10 countries in the world in terms of digitalization of public services.\n\nHowever, recently there have been reports of several serious technical failures in the system and potential vulnerabilities in the protection of personal data. Cybersecurity experts warn of the need to strengthen the protection of the state's digital systems."
 ukraine_economy.204.a:0 "Continue developing the project and strengthen cybersecurity"
 ukraine_economy.204.b:0 "Temporarily suspend system expansion for a security audit"

 # Energy crisis
 ukraine_economy.205.t:0 "Energy Crisis"
 ukraine_economy.205.d:0 "Ukraine has been hit by an acute energy crisis. Natural gas prices on the European market have risen to a record $1,900 per thousand cubic meters, leading to a sharp increase in the cost of electricity and heating. According to the Ministry of Energy, coal reserves at thermal power plant warehouses are at a critically low level - less than 600,000 tons with a required minimum of 1.5 million tons.\n\nA number of industrial enterprises have already announced a temporary suspension of operations due to high energy prices. Sociological surveys show that more than 65% of Ukrainians are concerned about the cost of utilities in the upcoming heating season.\n\nThe government needs to urgently take measures to stabilize the situation in the energy sector."
 ukraine_economy.205.a:0 "Introduce state regulation of energy prices"
 ukraine_economy.205.b:0 "Allow the market to adapt, providing subsidies to the most vulnerable segments of the population"
 
 # Investment forum
 ukraine_economy.206.t:0 "Investment Forum 'Ukraine: The Future Begins Now'"
 ukraine_economy.206.d:0 "A large-scale investment forum 'Ukraine: The Future Begins Now' has opened at the Kyiv International Exhibition Center. The event is attended by more than 500 business representatives from 42 countries, including delegations from major international corporations and investment funds.\n\nPresident Zelensky personally presented Ukraine's investment potential, highlighting achievements in digitalization, infrastructure development, and land reform. Special attention at the forum is paid to the IT sector, renewable energy, the agro-industrial complex, and logistics projects.\n\nAccording to the Ministry of Economy, more than 30 investment projects with a total value of over $5 billion have been prepared. The successful conduct of the forum could be an important signal to international investors about Ukraine's readiness for an economic breakthrough."
 ukraine_economy.206.a:0 "Sign memoranda on major investment projects"
 ukraine_economy.206.b:0 "Foreign investors are cautious - the forum did not meet expectations"
 
 # Ukrainian industry in the global market
 ukraine_economy.207.t:0 "Ukrainian Industry in Global Markets"
 ukraine_economy.207.d:0 "After modernizing infrastructure and industrial capacities, Ukrainian enterprises have begun to more actively enter international markets. According to the State Statistics Service, exports of industrial products grew by 18.7% compared to the previous year.\n\nGrowth is particularly noticeable in mechanical engineering (+24.3%), food industry (+19.6%), and metallurgy (+15.2%). The recovery of the global economy after the pandemic has created favorable conditions for Ukrainian exporters.\n\nExperts note that the modernization of transport infrastructure has significantly improved logistics and reduced the cost of delivering products to foreign buyers. However, there are concerns that too active an orientation towards external markets could make the economy vulnerable to fluctuations in the global economic situation."
 ukraine_economy.207.a:0 "Support exporters and strengthen presence in international markets"
 ukraine_economy.207.b:0 "Focus on developing the domestic market for greater economic resilience"
