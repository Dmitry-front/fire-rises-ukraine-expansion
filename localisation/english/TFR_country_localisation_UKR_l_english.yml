 #Session 9: new keys for the block 1 chronicle and COVID
 ukraine.409.t:0 "The Bonuses That Never Arrived"
 ukraine.409.d:0 "Two months after the decision on pay supplements, medics begin to say that the bonuses of up to 300 percent are in the payslip but not in the account: some hospitals received money only for the first weeks, some nothing at all, and in the accounting offices nobody quite understands which coefficient to use. In the regions doctors record video appeals, in Kyiv the medics' union recalls strikes, and in the Ministry of Health they say the money has been transferred, just not everything to where it should go.\n\nThe problem is not malice but the fact that the promise was made faster than the payment scheme was designed. Now the matter must be closed before the discontent turns into protests in front of the ministry."
 ukraine.409.a:0 "Pay the arrears from the reserve and audit every hospital."
 ukraine.409.b:0 "Shift the blame to regional authorities and chief physicians."
 ukraine.409.c:0 "Promise to look into it and move on to the next questions."
 #Session 11: nationalist path, block 1 (small events)
 ukraine.1010.t:0 "The January 1 Torchlight March"
 ukraine.1010.d:0 "On January 1, the birthday of Stepan Bandera, a torchlight march traditionally takes place in Kyiv: a column of nationalists under Svoboda flags walks through the city centre, and similar rallies gather in Lviv and several other cities. The column is not the biggest, but there are plenty of cameras, and the story about a \"Banderite march\" instantly spreads across Russian and Polish news, each time under a new headline.\n\nThe police can escort the column and block traffic as they always have, can cite quarantine rules and shorten the route, or can pretend that nothing unusual is happening. The organisers ask not to be disturbed, the neighbours ask not to be provoked, and most townspeople glance at it and go back to their salad. The question is who will explain all this to foreign ambassadors afterwards."
 ukraine.1010.a:0 "Escort the column and keep order along the route."
 ukraine.1010.b:0 "Shorten the route, citing quarantine restrictions."
 ukraine.1010.c:0 "Do not interfere: the police act as the situation requires."
 ukraine.1011.t:0 "A Virus Against the Nation"
 ukraine.1011.d:0 "Since April a rumour has been spreading in social networks and closed groups that the virus did not appear by accident, that it is especially dangerous for Ukrainians, and that the quarantine is needed to weaken the country. People and right-wing communities on social media readily pick the theme up, anonymous channels add \"proof\" from translated clips and screenshots, and bloggers collect views. The ground for the rumour has long been prepared: according to polls, most Ukrainians already believe the virus was made in a laboratory.\n\nThe Ministry of Health asks people not to panic, right-wing bloggers demand an agenda of their own, and in the Office they argue whether to respond at all: object and you inflate it, stay silent and the rumour turns into background. Any choice here costs little but is remembered for a long time."
 ukraine.1011.a:0 "Go through the rumours with doctors and publish the facts via the Ministry of Health."
 ukraine.1011.b:0 "Do not react: the rumour will burn out by itself."
 ukraine.1011.c:0 "Play along with the anxiety: declare that the state will protect the nation from any threat."
 ukraine.1012.t:0 "Free Sternenko"
 ukraine.1012.d:0 "On February 23 the Primorskyi court of Odesa sentences Serhiy Sternenko, a former head of the Odesa branch of Right Sector and a Maidan participant, to seven years and three months in prison in a case over the abduction of a person. The defence calls the sentence political, supporters gather outside the courthouse and the Office of the President, the slogan \"Free Sternenko\" spreads across the cities, and opponents answer that a court is not a rally and the law is the same for everyone.\n\nSternenko is known not only for his activities in Odesa but also for sharp criticism of the authorities, so every word from the president will be read as a signal. You can say that the court and the appeal decide, you can remind everyone of equality before the law and the right to peaceful protest, or you can quietly back a softer measure of restraint, which supporters will call a concession and opponents will call interference."
 ukraine.1012.a:0 "Do not interfere: the court and the appeal decide."
 ukraine.1012.b:0 "State that the law is the same for everyone and peaceful protest is a right."
 ukraine.1012.c:0 "Support, through deputies, a request for a softer measure of restraint."
 ukraine.1013.t:0 "Video from the Cafe"
 ukraine.1013.d:0 "On January 16 the next article of the language law takes effect: staff at cafes, shops, salons and gyms must start a conversation with a customer in Ukrainian and switch to another language only at the customer's request. A few days later videos are circulating in which a customer and a waiter work out in which language to order coffee, with thousands of comments under them, and talk show hosts argue who the victim is: the person who was answered in a language not their own, or the waiter who is filmed without asking.\n\nThe language ombudsman receives complaints, and right-wing activists offer to inspect the venues themselves. Some think the country is finally ceasing to be shy of its language, others that in the middle of quarantine cafes are barely surviving anyway. The authorities can side with the law, give people time to get used to it, or joke that coffee does not depend on language."
 ukraine.1013.a:0 "Support the law and the ombudsman without concessions."
 ukraine.1013.b:0 "Give people time to adapt: first explain, then check."
 ukraine.1013.c:0 "Laugh it off: coffee does not depend on language."
 ukraine.1014.t:0 "\"Glory to the Heroes\" on the Shirt"
 ukraine.1014.d:0 "On June 7 the Ukrainian Association of Football presents the national team kit for the European Championship: it shows the outline of the country including Crimea and Donbas and two slogans, \"Glory to Ukraine!\" and \"Glory to the Heroes!\". A day later UEFA demands that \"Glory to the Heroes\" be removed as a political slogan. Russia calls the design a provocation, and social networks split into those who see an ordinary greeting in the words and those who see someone else's history in them.\n\nThe argument over a shirt is really an argument over whom the country calls heroes. This question will return more than once, and the stakes will be higher. For now the authorities are expected to do something simple: declare that the slogan stays, reach an agreement with UEFA, or leave the decision to the federation."
 ukraine.1014.a:0 "Insist: the slogan stays, let UEFA explain itself."
 ukraine.1014.b:0 "Agree: keep \"Glory to Ukraine!\" and drop the second slogan."
 ukraine.1014.c:0 "Leave the decision to the federation."
