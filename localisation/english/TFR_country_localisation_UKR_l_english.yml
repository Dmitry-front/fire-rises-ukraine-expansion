 # Tooltips for hatred stages
 UKR_HATE_STAGE_0_TOOLTIP: "§Y0-24: Initial Resolve§!\n\nThe people are just beginning to realize the scale of the threat. Air raid sirens wail in the cities, the first refugees flee from the eastern regions.\n\n§GPositive Effects:§!\n• Army Morale: §G+2%§!\n• War Support: §G+1%§!"

 UKR_HATE_STAGE_1_TOOLTIP: "§Y25-49: Rising Hatred§!\n\nThe enemy shows no mercy to civilians. Every news report of destroyed homes and murdered families ignites fury in Ukrainian hearts. Volunteers storm military recruitment centers.\n\n§GPositive Effects:§!\n• Core Defense: §G+2%§!\n• Army Morale: §G+5%§!\n• War Support: §G+2%§!\n• Army Attack: §G+2%§!\n• Nationalist Support: §G+1%§!"

 UKR_HATE_STAGE_2_TOOLTIP: "§Y50-74: Harsh Measures§!\n\nHatred becomes strength. Every strike against the enemy is vengeance for destroyed cities and murdered loved ones. The people demand decisive action.\n\n§GPositive Effects:§!\n• Core Defense: §G+3%§!\n• Army Morale: §G+8%§!\n• War Support: §G+4%§!\n• Army Attack: §G+5%§!\n• Conscription: §G+10%§!\n• Nationalist Support: §G+2%§!\n\n§RNegative Effects:§!\n• Stability: §R-2%§!"

 UKR_HATE_STAGE_3_TOOLTIP: "§Y75-99: Total Hatred§!\n\nThe enemy has crossed every line - deliberate strikes on residential areas, hospitals, schools. Every Ukrainian is ready to take up arms. There will be no mercy.\n\n§GPositive Effects:§!\n• Core Defense: §G+5%§!\n• Army Morale: §G+12%§!\n• War Support: §G+6%§!\n• Army Attack: §G+8%§!\n• Conscription: §G+15%§!\n• Special Forces Attack: §G+10%§!\n• Nationalist Support: §G+3%§!\n\n§RNegative Effects:§!\n• Stability: §R-5%§!\n• Consumer Goods: §R+2%§!"

 UKR_HATE_STAGE_4_TOOLTIP: "§Y100+: Fanatical Resistance§!\n\nThis is no longer a war - this is a struggle for the nation's survival. There is nowhere to retreat - behind us are our homes, our families. Victory or death!\n\n§GPositive Effects:§!\n• Army Morale: §G+15%§!\n• War Support: §G+8%§!\n• Army Attack: §G+12%§!\n• Core Defense: §G+15%§!\n• Conscription: §G+20%§!\n• Special Forces Attack: §G+15%§!\n• Nationalist Support: §G+5%§!\n• Fascist Support: §G+2%§!\n• National Socialist Support: §G+1%§!\n\n§RNegative Effects:§!\n• Stability: §R-8%§!\n• Consumer Goods: §R+5%§!\n• Political Power Cost: §R+10%§!"

 # Tooltips for fatigue stages
 UKR_FATIGUE_STAGE_0_TOOLTIP: "§Y0-24: Light Fatigue§!\n\nThe first days of war. Society is gripped by patriotic fervor, but the first weary faces of soldiers on rotation already appear.\n\n§RNegative Effects:§!\n• Stability: §R-1%§!\n• War Support: §R-1%§!"

 UKR_FATIGUE_STAGE_1_TOOLTIP: "§Y25-49: Growing Exhaustion§!\n\nMonths of protracted fighting drain the reserves. More and more death notices, fewer and fewer volunteers. In the rear, fatigue grows from constant anxiety and shortages of everything necessary. The economy creaks at the seams.\n\n§RNegative Effects:§!\n• Stability: §R-3%§!\n• Weekly Stability: §R-0.1%§!\n• War Support: §R-2%§!\n• Weekly War Support: §R-0.1%§!\n• Army Organization: §R-2%§!\n• Production Efficiency: §R-2%§!"

 UKR_FATIGUE_STAGE_2_TOOLTIP: "§Y50-74: Serious Fatigue§!\n\nThe war has turned into a bloody meat grinder. Endless losses at the front undermine faith in quick victory. Society increasingly demands negotiations, at least a temporary ceasefire.\n\n§RNegative Effects:§!\n• Stability: §R-6%§!\n• Weekly Stability: §R-0.5%§!\n• War Support: §R-4%§!\n• Weekly War Support: §R-0.1%§!\n• Army Organization: §R-5%§!\n• Army Morale: §R-3%§!\n• Production Efficiency: §R-5%§!\n• Consumer Goods: §R+3%§!\n• Libertarian Socialist Support: §R-1%§!\n• Conservative Support: §R-1%§!"

 UKR_FATIGUE_STAGE_3_TOOLTIP: "§Y75-99: Critical Fatigue§!\n\nThe country is on the brink of exhaustion. Industry barely copes, mobilization reserves are running out. More and more voices ask 'when will this end?'. Even the most steadfast begin to doubt.\n\n§RNegative Effects:§!\n• Stability: §R-10%§!\n• Weekly Stability: §R-1%§!\n• War Support: §R-8%§!\n• Weekly War Support: §R-1%§!\n• Army Organization: §R-8%§!\n• Army Morale: §R-6%§!\n• Mobilization Speed: §R-10%§!\n• Production Efficiency: §R-8%§!\n• Consumer Goods: §R+5%§!\n• Conservative Support: §R-1%§!\n• Libertarian Socialist Support: §R-2%§!"

 UKR_FATIGUE_STAGE_4_TOOLTIP: "§Y100+: Morale Collapse§!\n\nThe morale of the army and people is on the verge of collapse. Mass desertion, strikes at factories, anti-war rallies. The country demands peace - at any cost. Continuing the war threatens revolution.\n\n§RNegative Effects:§!\n• Stability: §R-15%§!\n• Weekly Stability: §R-2%§!\n• War Support: §R-12%§!\n• Weekly War Support: §R-10%§!\n• Army Organization: §R-12%§!\n• Army Morale: §R-10%§!\n• Mobilization Speed: §R-15%§!\n• Production Efficiency: §R-12%§!\n• Consumer Goods: §R+8%§!\n• Command Power Gain: §R-10%§!\n• Conservative Support: §R-2%§!\n• Libertarian Socialist Support: §R-4%§!\n• Market Liberal Support: §R-1%§!\n• Social Liberal Support: §R-1%§!\n• Surrender Limit: §R-5%§!\n\n§HRisk of capitulation or civil war!§!"

