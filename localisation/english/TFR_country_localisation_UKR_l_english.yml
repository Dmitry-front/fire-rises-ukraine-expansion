 UKR_serpents_path_tooltip:0 "§YThe offensive operation will allow our troops to more effectively overcome enemy defenses and advance in enemy territory.§!"
 UKR_azov_operation_tooltip:0 "§YSpecial units operating behind enemy lines will disrupt communications, demoralize personnel, and create favorable conditions for main forces.§!"

 #BLR - Cooperation
 UKR_idea_belarus_cooperation:0 "Ukrainian-Belarusian Cooperation"
 UKR_idea_belarus_cooperation_desc:0 "After democratic changes in Belarus, our countries have begun a new chapter in relations. Shared challenges and the pursuit of independence from Russian influence bring our nations closer together. Joint economic projects are already yielding results, while cultural exchange strengthens historical brotherhood."

 UKR_belarus_military_cooperation:0 "Military Cooperation with Belarus"
 UKR_belarus_military_cooperation_desc:0 "Our armed forces conduct joint exercises and exchange expertise. The shared border necessitates coordinated defense efforts, while unified training standards enhance the combat readiness of both armies. Establishing a secure northern flank significantly strengthens our security."

 ukraine_belarus_friendship_initial:0 "Ukrainian-Belarusian Friendship"
 ukraine_belarus_friendship_initial_desc:0 "The first steps toward strategic partnership with the new democratic Belarus have laid the foundation for long-term cooperation. Our peoples, united by a common Slavic heritage, are rediscovering each other."

 ukraine.500.t:0 "A New Chapter in Relations with Belarus"
 ukraine.500.d:0 "Political changes in Belarus present us with a unique window of opportunity. After decades of Lukashenko s authoritarian rule, the new leadership looks westward instead of eastward. Our diplomats report unprecedented openness from Belarusian officials to dialogue. The Ministry of Foreign Affairs proposes opening a new chapter in relations with our northern neighbor. Preliminary consultations indicate the potential for a strong partnership in economic, cultural, and possibly defense sectors. The historical ties between our peoples, which have always existed despite political barriers, could form the foundation of a new alliance.\n\n Analysts highlight potential economic benefits: restoring disrupted supply chains, access to new markets, and more efficient utilization of both countries' transit potential. Particularly promising are prospects for energy cooperation and transport corridor integration.\n\n However, some skeptics within military circles warn of possible instability in Belarus and the risks of premature rapprochement. Russia will undoubtedly see our alliance as a direct challenge to its interests, which could further escalate an already tense regional situation."

 ukraine.500.a:0 "Extend a Hand of Friendship to Belarus"
 ukraine.500.b:0 "Now Is Not the Time for Experiments"

 ukraine.501.t:0 "Deepening Cooperation with Belarus"
 ukraine.501.d:0 "Over the past months, our relations with the new democratic Belarus have strengthened significantly. Regular high-level meetings and growing trade volumes indicate the success of our chosen course. A symbolic gesture was the unveiling of a monument to the great Belarusian poet Yanka Kupala in Kyiv and a monument to Taras Shevchenko in Minsk.\n\n Now we have the opportunity to take cooperation to a qualitatively new level-military collaboration. The Ministry of Defense has presented an ambitious plan for joint actions, including regular exercises, military personnel exchanges, and the creation of a coordination council on border security.\n\n Special attention is given to air defense. Our experts have developed a scheme for the joint use of radar systems, which will significantly improve early warning capabilities against potential aerial threats. This is especially critical for Belarus, given the limited resources of its recovering army. The project also includes the establishment of a joint training center where servicemen from both countries will exchange experience in modern warfare.\n\n Not everyone in our leadership supports such close military cooperation. There are concerns that this may be perceived as forming an anti-Russian bloc, provoking a harsh reaction from the Kremlin. Additionally, questions remain regarding the stability of Belarus new government and its ability to withstand external pressure."

 ukraine.501.a:0 "Form a Military Alliance with Belarus"
 ukraine.501.b:0 "Limit Cooperation to Economic Partnership"

 ukraine.502.t:0 "A New Chapter in Relations with Belarus"
 ukraine.502.d:0 "Following the signing of the peace treaty, Belarus has regained its full independence. Our nations, bound by shared history and recent struggle, have a unique opportunity to start relations with a clean slate. Embassies of both countries have resumed their operations, and border checkpoints are now open for free movement of citizens. Our economists and engineers are already discussing joint projects for rebuilding infrastructure and industries damaged during the conflict. Many experts believe that close cooperation between our countries will not only accelerate the recovery process but also serve as a security guarantee in the face of possible future threats from the east."
 ukraine.502.a:0 "Develop full-scale cooperation in reconstruction"
 ukraine.502.b:0 "Focus on rebuilding with our own resources"
 belarus_mutual_defense_pact_tooltip:0 "Ukraine and Belarus initiate a joint reconstruction program"

 UKR_idea_belarus_construct:0 "Fraternal Reconstruction"
 UKR_idea_belarus_construct_desc:0 "Having endured years of conflict, Ukraine and Belarus have united their efforts to rise from the ashes of war. Joint infrastructure restoration projects, technology exchange, and coordination of economic programs allow both countries to more effectively overcome the consequences of destruction. Nations bound by shared history and recent struggle are creating a new foundation for cooperation-not from political ambitions, but from a genuine desire to build a peaceful and prosperous future for generations to come."

 #Secret Operation
 UKR_military_budget_expansion:0 "Strengthening Special Services and Military Intelligence"
 UKR_military_budget_expansion_desc:0 "In the conditions of ongoing hybrid warfare with the aggressor, it is critically important to enhance our defense capabilities. The main focus will be on supporting key intelligence units: the Main Intelligence Directorate, Special Operations Forces, technical reconnaissance and UAV units. The priority will be the development of special operations systems, strengthening the intelligence potential of special services with special attention to deep infiltration agent training. The powers of key units are significantly expanded in terms of conducting autonomous special operations and information security. Each invested resource is an additional chance to protect state sovereignty. Our motto: Information is a weapon, intelligence is the shield of national security."

 UKR_shadow_war_capabilities:0 "Asymmetric Counteraction to the Aggressor"
 UKR_shadow_war_capabilities_desc:0 "The war in the shadows is the daily reality of Ukrainian special units. The more territories the aggressor captures, the stronger the resistance becomes. Each new kilometer of occupied land gives birth to dozens of hidden resistance cells, forming an extensive network of underground organizations. Special Operations Forces have strategic tasks of deep enemy reconnaissance, conducting sabotage actions, disrupting enemy communications, and gathering critically important strategic information. The national spirit of unbrokenness is our main weapon. The unit structure includes elite special-purpose groups, marine units, and highly mobile airborne troops. Our strategic goal is to turn every piece of occupied land into a space of unpredictability and risk for the enemy."

 UKR_budget_military_expansion_tooltip:0 "§HRe-equipment and strengthening of special units will provide more opportunities to counter enemy informational, diplomatic, and intelligence influences§!"
 UKR_shadow_war_special_ops_tooltip:0 "§HExpanding asymmetric warfare capabilities will ensure support for independent and liberation forces in confronting aggressors, creating an extensive network of contacts and channels of influence§!"

 UKR_increased_funding_agency:0 "Expanding Intelligence Potential"
 UKR_increased_funding_agency_desc:0 "Targeted financing and support of special services allows for a significant increase in the country's intelligence potential. Favorable conditions are created for the rapid formation of intelligence networks, training of high-class specialists, and conducting complex special operations. Each additional resource invested in intelligence is multiplicatively repaid through strategic information and the ability to take preemptive actions."
  
 UKR_shadow_war_category:0 "Shadow War"  
 UKR_shadow_war_category_desc:0 "Hybrid conflicts define the new reality of international politics. Confronted with aggression and destabilization, Ukraine takes decisive steps to counter covert influence and threats from the Russian Federation. The shadow war unfolds on multiple fronts: from clandestine special operations and intelligence missions to diplomatic maneuvers and support for independent states across the CIS. These decisions will strengthen Ukraines position, secure strategic advantages, and protect national interests."  

 UKR_support_central_asian_resistance_KAZ:0 "Strategic Military Solidarity with Kazakhstan"  
 UKR_support_central_asian_resistance_KAZ_desc:0 "Rapid military supplies and expert support create an invisible shield of state sovereignty. Critical intelligence, advanced equipment, and strategic consultations are delivered to the country's leadership through special channels. Our goal is to strengthen defense capabilities and help preserve independence amidst growing geopolitical challenges."  

 UKR_support_central_asian_resistance_UZB:0 "Expert Military Support for Uzbekistan"  
 UKR_support_central_asian_resistance_UZB_desc:0 "Covert military corridors ensure the swift transfer of strategic weaponry and intelligence. Special military expert teams are ready to provide immediate advisory support to the country's leadership. Every communication channel and every shipment is a step toward enhancing national security and independence."  

 UKR_support_central_asian_resistance_TMS:0 "Tactical Military Support for Turkmenistan"  
 UKR_support_central_asian_resistance_TMS_desc:0 "An invisible network of military solidarity covers strategic areas of national security. Modern weapon systems, cutting-edge intelligence, and immediate expert support are ready to safeguard the country's sovereignty in critical moments."  

 UKR_support_central_asian_resistance_TAJ:0 "Operational Military Protection for Tajikistan"  
 UKR_support_central_asian_resistance_TAJ_desc:0 "Rapid military deliveries and deep intelligence support create a reliable shield against external threats. Specialized military expert teams are prepared to provide immediate strategic consultations to the country's leadership, ensuring maximum readiness for any scenario."  

 UKR_support_central_asian_resistance_KYR:0 "Comprehensive Military Solidarity with Kyrgyzstan"  
 UKR_support_central_asian_resistance_KYR_desc:0 "A multi-layered military support system includes rapid deliveries of modern weaponry, the transmission of critical intelligence, and readiness to provide immediate strategic consultations. Every communication channel adds extra potential for protecting national interests."  

 UKR_support_central_asian_resistance_GEO:0 "Covert Strategic Counteraction to Russian Aggression in Georgia"
 UKR_support_central_asian_resistance_GEO_desc:0 "Clandestine intelligence units conduct an extremely secretive operation to transfer critical information. Special groups analyze military risks, prepare detailed resistance plans, and transmit intelligence about potential invasions. Each intercepted document, each anonymous communication channel deals a precise blow to the Russian military machine. The operation is conducted with maximum anonymity, without official statements or public contacts."

 UKR_support_central_asian_resistance_AZR:0 "Covert Counteraction to Territorial Claims in Azerbaijan"
 UKR_support_central_asian_resistance_AZR_desc:0 "Deeply undercover specialist groups create strategic barriers against potential military aggression. Encrypted channels transmit intelligence about military movements, preparing preemptive strategies to protect state borders. Each intercepted Russian army plan is a fragment of a secret war for sovereignty."
 
 UKR_support_central_asian_resistance_ARM:0 "Shadowy Containment of Military Threat in Armenia"
 UKR_support_central_asian_resistance_ARM_desc:0 "A completely covert operation accompanying national security. Analytical groups track military risks in absolute secrecy, preparing resistance strategies. Each transmitted signal is an invisible strike against Russian military strategy, without official documents or public traces."

 #29.09 War
 # Main War Mood Category
 
 # Decisions for Controlling Hatred
 UKR_control_war_atrocities:0 "War Crimes Control"
 UKR_control_war_atrocities_desc:0 "Strict orders on treatment of prisoners and civilians, strengthening military police, OSINT monitoring, and training commanders in IHL norms reduce the escalation of hatred and strengthen allies' trust in our conduct of war."
 UKR_control_war_atrocities_tt:0 "Reduces hatred gain; improves partners' attitude toward compliance with the laws of war."


 # Decisions for Combating Fatigue
 UKR_rapid_reconstruction:0 "Emergency Reconstruction"
 UKR_rapid_reconstruction_desc:0 "Mobile bridge and engineering brigades, emergency power modules, repair of communications and supply routes accelerate the restoration of critical infrastructure, accepting short-term budgetary costs for the sake of rear stability."
 UKR_rapid_reconstruction_tt:0 "Temporary bonus to repair and supply with increased financial burden."


 UKR_civilian_relief:0 "Civilian Humanitarian Aid"
 UKR_civilian_relief_desc:0 "Organization of evacuation trains, deployment of temporary food and medical aid points, coordination of volunteer warehouses reduces social fatigue and maintains trust in authorities even under strikes on cities."
 UKR_civilian_relief_tt:0 "Supports the civilian population in combat zones."


 UKR_resilience_campaign:0 "Resilience Campaign"
 UKR_resilience_campaign_desc:0 "Information support, documentary reports, cultural visits to frontline cities, and work of psychologists increase the will to resist and keep morale at a high level, even if fueling the determination to take revenge on the enemy."


 UKR_honor_fallen:0 "Honor the Fallen"
 UKR_honor_fallen_desc:0 "State ceremonies, named companies and scholarships for families of the fallen form a culture of remembrance, raise fighting spirit, and consolidate society's readiness to endure the war until victory."




 # Additional Decisions
 UKR_veteran_psych_care:0 "Veteran Psychological Care"
 UKR_veteran_psych_care_desc:0 "Opening rehabilitation centers, support groups, and therapeutic programs help fighters cope with post-traumatic stress and maintain connection with civilian life."


 UKR_cultural_morale_boost:0 "Cultural Events for Morale"
 UKR_cultural_morale_boost_desc:0 "Concerts in bomb shelters, mobile theaters, exhibitions, and poetry evenings support the people's spirit and remind us what we are fighting for."


 # Monthly Ticks
 UKR_war_mood_monthly_tick:0 "War Mood Dynamics"
 UKR_war_mood_monthly_tick_title:0 "The War Continues"
 UKR_war_mood_monthly_tick_desc:0 "Every month of war leaves its mark on people's souls  both hatred for the enemy and fatigue from trials grow."

 # System Initialization
 ukrainewar.1.t:0 "War Has Begun"
 ukrainewar.1.d:0 "Without a declaration of war, the country's territory came under massive missile bombardment. Cruise missiles launched from Tu-95 and Tu-160 bombers, ballistic missiles from mobile systems, and Kalibr naval missiles struck the airfields of Boryspil, Ozerne, Chuhuiv, Kramatorsk, Chornobaivka, military warehouses, communication nodes, and command posts throughout the country from Kyiv to Odesa, from Kharkiv to Ivano-Frankivsk. More than a hundred missiles were launched in the first hour. The airspace filled with Russian Aerospace Forces. At the border, movement of armored columns is recorded from Belarusian territory toward Kyiv and Chernihiv, from Russia toward Kharkiv and Sumy, from Crimea toward Kherson and Mariupol, from occupied Donbas deep into Donetsk and Luhansk oblasts. The enemy is crossing the border simultaneously in four directions. The country is in shock. A peaceful morning shattered by explosions and sirens."
 ukrainewar.1.a:0 "Emergency session of the National Security and Defense Council"
 UKR_war_mood_initialized_tt:0 "'National War Mood' system activated: hatred and fatigue are being tracked, dynamic modifiers enabled."


 # First Strikes on Civilians
 ukrainewar.10.t:0 "Shock of War on Screens"
 ukrainewar.10.d:0 "The news feed brings footage of bombed schools and hospitals, craters on playgrounds, shattered apartment entrances, and hasty evacuations. Anger grows alongside fatigue  headquarters strengthen psychological support for troops and civilians, while volunteer networks expand aid in frontline cities."
 ukrainewar.10.a:0 "Memory and resilience"


 # Hatred Thresholds
 ukrainewar.25.t:0 "Growing Hatred for the Enemy"
 ukrainewar.25.d:0 "Reports from the front and testimonies of refugees paint a picture of methodical destruction of everything Ukrainian. They burn libraries, blow up monuments, deport children. On social media and in the streets, calls for merciless revenge are increasingly heard. This wave of anger strengthens the determination to fight, but risks consuming the very essence of the nation for which the war is being waged."
 ukrainewar.25.a:0 "The enemy will pay for every crime"
 UKR_hate_50_reached_tt:0 "Hatred for the enemy has reached critical levels."


 # Fatigue Thresholds
 ukrainewar.50.t:0 "War Fatigue"
 ukrainewar.50.d:0 "Months of fighting, endless casualty reports, queues at humanitarian points, and air raid sirens are beginning to erode the people's spirit. People are tired of constant tension, of seeing destruction, of the uncertainty of the future. Sentiments in society are growing for peace negotiations  any negotiations, just to stop the bloodshed."
 ukrainewar.50.a:0 "We need peace, but not at any cost"
 UKR_fatigue_75_reached_tt:0 "War fatigue is reaching dangerous levels."


 #New 01.10
 ukrainewar.100.t:0 "The Fall of Kyiv"
 ukrainewar.100.d:0 "The unthinkable has happened. Enemy forces have entered the capital of Ukraine. The golden domes of Kyiv's churches, the ancient streets of Podil, Independence Square — all are now under the control of the occupiers. The fall of Kyiv is not just the loss of a city. It is the symbol of our struggle, the heart of the nation, the center of our statehood.\n\nThe mood in society is becoming increasingly grim. Many are losing hope, the army is demoralized, and the political leadership is torn by debates about how to proceed. Yet even in this dark hour, voices are calling to continue the resistance. The capital may be lost, but the war is not yet over."
 ukrainewar.100.a:0 "This is a catastrophe..."
 UKR_kiev_lost_tt:0 "The loss of the capital severely undermines the morale of the nation and the army."
 ukrainewar.100.b:0 "We must take emergency measures!"
 UKR_kiev_emergency_measures_tt:0 "The government takes decisive steps to stabilize the situation and strengthen the defense."

 # Post-War Conversion
 ukrainewar.200.t:0 "End of War — Beginning of Recovery"
 ukrainewar.200.d:0 "The guns have fallen silent, but their echo will resonate in people's souls for a long time to come. Now comes a no less difficult task  to heal the wounds inflicted by war not only on cities and villages but also on citizens' hearts. Hatred can become the foundation for building a new strong nation, or it can turn into poison that contaminates the future. Fatigue will either become wisdom or paralyze the will to rebuild."
 ukrainewar.200.a:0 "We endured, now we will rebuild"
 UKR_postwar_conversion_tt:0 "War mood is converted into post-war effects."


 # Automatic Change Events
 ukrainewar.300.t:0 "Strikes on Civilian Infrastructure"
 ukrainewar.300.d:0 "Enemy missiles and drones methodically destroy power stations, water supplies, heating networks, and hospitals. Millions of people are left without light, heat, and communications in the middle of winter. These strikes have no military purpose  their goal is to break the people's spirit, to force surrender from cold and despair. But every destroyed boiler room only fuels hatred."
 ukrainewar.300.a:0 "They are torturing the people, but we will endure"


 ukrainewar.310.t:0 "New Wave of Mobilization"
 ukrainewar.310.d:0 "Fathers of families, students, workers  ordinary people, yesterday still peaceful citizens  arrive at draft offices. Farewells at train stations, mothers' tears, children's drawings with wishes for dad  war demands ever new sacrifices. Society is tired of constant send-offs, but understands: there is no alternative."
 ukrainewar.310.a:0 "Everyone will stand to defend the Motherland"


 # Hatred Modifier
 UKR_hate_dynamic:0 "Hatred for the Enemy"
 UKR_hate_dynamic_desc:0 "The more intensely the people hate the occupiers, the more fiercely they fight, but the greater the risk of losing humanity."


 # Fatigue Modifier
 UKR_war_fatigue_dynamic:0 "War Fatigue"
 UKR_war_fatigue_dynamic_desc:0 "Prolonged combat operations exhaust the nation's morale and undermine the ability to continue resistance."


 # Severe Post-War Trauma
 UKR_severe_war_trauma:0 "Deep Scars of War"
 UKR_severe_war_trauma_desc:0 "Destruction, loss, and suffering have left an indelible mark on people's souls. Society struggles to return to peaceful life, many suffer from post-traumatic stress. Recovery will take many years."


 UKR_moderate_war_trauma:0 "War Weariness"
 UKR_moderate_war_trauma_desc:0 "War has exhausted the physical and moral strength of the nation. People crave peace and stability, preferring to focus on recovery rather than new conflicts."


 UKR_light_war_trauma:0 "Combat Strain"
 UKR_light_war_trauma_desc:0 "The memory of war is still fresh, but the people are ready to move forward. Some wariness and caution are natural after the trials endured."


 # War-Hardened
 UKR_hardened_by_war:0 "Forged in Fire"
 UKR_hardened_by_war_desc:0 "War has transformed peaceful citizens into fearless warriors. The nation has passed through the crucible of battles and gained unbreakable resilience. Now nothing can break us."


 UKR_tempered_by_war:0 "Battle-Tested"
 UKR_tempered_by_war_desc:0 "The trials of war have strengthened the nation's character. People have become more determined and united, ready to defend their independence."


 # Temporary Decision Effects
 UKR_rapid_reconstruction_boost:0 "Emergency Recovery Program"
 UKR_rapid_reconstruction_boost_desc:0 "Mobilization of all resources for restoring critically important infrastructure accelerates repair work and lifts the people's spirits."


 # Sabotage at Any Cost
 UKR_sabotage_at_any_cost:0 "Sabotage at Any Cost"
 UKR_sabotage_at_any_cost_desc:0 "War demands decisive action from us. Our special services will launch a large-scale operation to undermine the Russian war machine from within. Saboteurs will attack railway junctions and ammunition depots, hackers will disrupt military communications systems, and agents on the ground will organize sabotage at defense enterprises. We will use the full power of the partisan movement in occupied territories to organize raids against Russian rear facilities. These actions will strengthen our forces and disorganize the enemy, but will require significant resources."
 UKR_sabotage_at_any_cost_tooltip:0 "A campaign of total sabotage begins against Russian military facilities and communications."
 
 # Everything Against the Enemy
 UKR_everything_against_enemy:0 "Everything Against the Enemy"
 UKR_everything_against_enemy_desc:0 "The time has come to launch a full-scale hybrid war against Russia. Our specialists will conduct a coordinated multi-level operation:\n\n§Y•§! Cyberattacks on the Russian banking system and government databases\n§Y•§! Massive information campaign targeting the Russian population and military personnel\n§Y•§! Bribery and recruitment of Russian officials and military\n§Y•§! Incitement of inter-ethnic and social conflicts within the Russian Federation\n§Y•§! Support for separatist movements in Russian borderlands\n§Y•§! Organization of leaks of compromising materials on Russian leadership\n§Y•§! Disinformation operations to undermine trust in Russian authorities\n\nThis will be total war on all fronts  from cyberspace to Russian regions."
 UKR_everything_against_enemy_tooltip:0 "§YRussia§! will receive a negative idea for §Y180 days§! that will seriously weaken its military potential and internal stability."


 # Idea for Russia (SOV)
 UKR_subversion_campaign:0 "Ukrainian Subversion Operation"
 UKR_subversion_campaign_desc:0 "Ukrainian special services have launched a large-scale campaign to destabilize Russia. Cyberattacks paralyze the banking system and government services, hackers breach military databases. Bribed officials leak classified information, and recruited officers sabotage military operations. In the regions, inter-ethnic conflicts are being stoked, separatists receive external support. Information attacks undermine the population's trust in authorities, compromising materials on high-ranking figures appear in the media. Society is split, the economy is cracking at the seams, and the war machine is malfunctioning."

 ### FOCUSES
 UKR_forge_professional_officer_corps:0 "Commander's School: The New Generation"
 UKR_forge_professional_officer_corps_desc:0 "2014 left a bitter lesson: our army collapsed under the assault of 'little green men' not from lack of courage, but from lack of §Ycommand professionalism§!.\n\nCrimea fell in three days. Donbas turned into a meat grinder where company commanders learned warfare right in the trenches, losing men to their own inexperience. The Minsk Protocols gave us breathing room — but this is only the calm before the storm. Moscow won't stop. The world knows this. §YWe§! know this.\n\nFrom 2020, we are launching a §Yprogram of total officer corps retraining§!. No half-measures. No 'reforms on paper'. Captains will learn operational planning by NATO standards — not in theory, but through simulations of real battles: defense of Ilovaisk, breakthrough near Debaltseve, holding Donetsk Airport.\n\nGenerals will undergo internships in NATO countries — where they §Yremember the price of freedom§!. They will study hybrid warfare, cyber threats, information operations. They will learn to win not through numbers, but through skill.\n\nThe enemy is at the gates. He awaits a moment of weakness. §YWe will not give him that moment.§!"

 UKR_UAV_warfare_revolution:0 "Eyes Over the Battlefield: UAV Doctrine"
 UKR_UAV_warfare_revolution_desc:0 "In 2014, Russian forces entered Crimea §Yinvisibly§!. Their columns moved at night, checkpoints appeared from nowhere, GRU special forces operated like ghosts. We had no eyes on the battlefield. Reconnaissance was hours, sometimes days late.\n\nIn Donbas, volunteers began launching commercial DJI drones over separatist positions. Improvised, unprofessional, but §Yeffective§!. By 2020, thousands of drones on the front line - from Chinese Mavics to Ukrainian 'Lelekas'.\n\nBut this is chaos. Brilliant innovations die with their operators. Effective tactics perish with battalions. §YIt's time to create a system.§!\n\nWe are developing the world's first §YUnmanned Warfare Doctrine for the 21st century army§!. Not as an aviation supplement — as a §Yseparate branch of forces§!. Every battalion will get its own UAV unit. Every company commander will have a reconnaissance operator under direct command.\n\nWe are standardizing training: from basic pilot preparation (5 days for commercial drones, 3 weeks for FPV kamikaze) to advanced courses in target designation and artillery coordination. We are creating §Ytactical employment schemes§!: 'Drone Line' for continuous front monitoring, 'Swarm' for air defense suppression, 'Hunter-Killer' for armored vehicle destruction.\n\nThe enemy still thinks in tanks and aircraft. §YWe think in algorithms and cameras.§!\n\nWhen the big war comes - and it will come - the sky over Ukraine will be §Yours§!. Not Su-35s and Ka-52s. §YThousands of small eyes that see everything and never sleep.§!"

 ### FOCUS TOOLTIPS
 UKR_officer_training_decisions_tooltip:0 "§YUnlocks officer training decisions:§!\n• Modern Artillery Course\n• Mobile Warfare Program\n• Urban Warfare Tactics School\n• Hybrid Operations School"
 UKR_drone_doctrine_tooltip:0 "§YUkraine becomes a pioneer of unmanned warfare§!\nReduced production cost for close air support and tactical bombers\nBonus to reconnaissance and enemy aircraft detection"

 ### DECISIONS
 UKR_staff_organization_course:0 "Staff Organization Course"
 UKR_staff_organization_course_desc:0 "The experience of 2014 showed: chaos in headquarters kills faster than enemy bullets. Loss of communication between units, supply failures, improper operation planning — all of this cost us Crimea and the first months of war in Donbas.\n\nWe will train generals in modern staff work standards: operation planning, coordination between branches of service, logistics, information flow management. A commander is not just someone who leads the charge, but someone who ensures the army has everything needed for victory."
 UKR_organizer_training_tooltip:0 "§G2 random generals§! will receive:\n• §Y+1 skill§!\n• §Y'Organizer' trait§!"

 UKR_mobile_warfare_program:0 "Mobile Warfare Program"
 UKR_mobile_warfare_program_desc:0 "Modern warfare is speed. We will train commanders in tank breakthrough tactics, mechanized unit coordination, and rapid battlefield maneuver."
 UKR_panzer_leader_training_tooltip:0 "§G2 random generals§! will receive:\n• §Y+1 skill§!\n• §Y'Panzer Leader' trait§!"

 UKR_infantry_tactics_school:0 "Urban Warfare Tactics School"
 UKR_infantry_tactics_school_desc:0 "Urban battles in Mariupol, Donetsk, Luhansk showed: infantry remains the main force in holding territory. We will prepare commanders for warfare in urban environments and trenches."
 UKR_infantry_leader_training_tooltip:0 "§G2 random generals§! will receive:\n• §Y+1 skill§!\n• §Y'Infantry Leader' trait§!"

 UKR_hybrid_operations_school:0 "Hybrid Operations School"
 UKR_hybrid_operations_school_desc:0 "21st century warfare is special operations, sabotage, psychological pressure. We will train generals in unconventional combat methods."
 UKR_hybrid_ops_training_tooltip:0 "§G2 random generals§! will receive:\n• §Y+1 skill§!\n• §Y'Trickster' or 'Commando' trait§!"

 ### NATIONAL SPIRIT
 UKR_UAV_warfare_pioneers:0 "Pioneers of Unmanned Warfare"
 UKR_UAV_warfare_pioneers_desc:0 "Ukraine has become a global laboratory of unmanned warfare. Tactics born in Donbas are studied in academies worldwide. We taught commercial drones to kill. We created a doctrine that doesn't yet exist in NATO. When the big war comes - the sky will be ours."

 # === WAR SPIRIT SYSTEM - HATRED ===
 UKR_war_spirit_hate_0:0 "Weak Military Resolve"
 UKR_war_spirit_hate_0_desc:0 "The onset of conflict has sparked the first manifestations of national unity and determination to resist the aggressor."

 UKR_war_spirit_hate_25:0 "Rising Hatred of the Enemy"
 UKR_war_spirit_hate_25_desc:0 "The population begins to experience increasingly strong hatred toward the invaders. Troop morale grows and patriotic sentiments intensify."

 UKR_war_spirit_hate_50:0 "Popular Anger"
 UKR_war_spirit_hate_50_desc:0 "War has ignited furious hatred of the enemy throughout the country. Citizens are ready to make sacrifices for victory, though this is beginning to affect social stability."

 UKR_war_spirit_hate_75:0 "Irreconcilable Enmity"
 UKR_war_spirit_hate_75_desc:0 "Hatred of the aggressor has reached unprecedented scale. Military effectiveness has increased significantly, but growing radicalism and economic sacrifices are beginning to create problems."

 UKR_war_spirit_hate_100:0 "Total War"
 UKR_war_spirit_hate_100_desc:0 "The country is gripped by fanatical hatred of the enemy. Everyone is ready to fight to the last, but extreme sentiments, political polarization, and resource depletion threaten the long-term stability of the state."


 # === WAR SPIRIT SYSTEM - FATIGUE ===
 UKR_war_spirit_fatigue_0:0 "Early War Fatigue"
 UKR_war_spirit_fatigue_0_desc:0 "The first signs of war fatigue are beginning to manifest in society."

 UKR_war_spirit_fatigue_25:0 "Growing War Fatigue"
 UKR_war_spirit_fatigue_25_desc:0 "The protracted conflict is beginning to exhaust the population. Support for the war declines, production falls, and trust in the government weakens."

 UKR_war_spirit_fatigue_50:0 "Deep War Fatigue"
 UKR_war_spirit_fatigue_50_desc:0 "Society is exhausted by war. Stability is under threat, fighting spirit drops, and the economy suffers from prolonged conflict. Increasingly more resources are required for civilian needs."

 UKR_war_spirit_fatigue_75:0 "Critical War Fatigue"
 UKR_war_spirit_fatigue_75_desc:0 "The country is on the brink of exhaustion. Troop morale is catastrophically falling, the economy is collapsing, and discontent is brewing in society. Radical ideas are finding more and more supporters."

 UKR_war_spirit_fatigue_100:0 "War Spirit Collapse"
 UKR_war_spirit_fatigue_100_desc:0 "The nation is completely exhausted by war. Society is on the verge of breakdown, the army is demoralized, the economy is in ruins. The government is losing legitimacy, and the country's ability to continue the war is seriously in question."


 # Decision tooltips
 UKR_veteran_psych_care_tt:0 "Reduces hatred and fatigue levels through work with traumatized veterans."
 UKR_cultural_morale_boost_tt:0 "Cultural events support the spirit of the people and reduce war fatigue."
 UKR_honor_fallen_tt:0 "Memory of heroes raises fighting spirit and partially compensates for fatigue."
 UKR_resilience_campaign_tt:0 "Information campaign reduces fatigue but may intensify hatred of the enemy."


 # Mood level descriptions
 ukr_hate_level_low:0 "Initial Resolve (0-24): The people are full of determination to repel the aggressor."
 ukr_hate_level_medium:0 "Rising Hatred (25-49): Reports of war crimes ignite anger in people's hearts."
 ukr_hate_level_high:0 "Harsh Measures (50-74): Society demands merciless struggle against the occupiers."
 ukr_hate_level_extreme:0 "Total Hatred (75-99): The thought of revenge consumes the nation's mind."
 ukr_hate_level_fanatical:0 "Fanatical Resistance (100+): Hatred has become a religion defining every action."


 ukr_fatigue_level_low:0 "Light Fatigue (0-24): War is still perceived as a temporary hardship."
 ukr_fatigue_level_medium:0 "Growing Exhaustion (25-49): People are tired of constant tension."
 ukr_fatigue_level_high:0 "Serious Fatigue (50-74): Pacifist sentiments are growing in society."
 ukr_fatigue_level_extreme:0 "Critical Fatigue (75-99): The people crave peace at any cost."
 ukr_fatigue_level_collapse:0 "Morale Collapse (100+): The will to resist is practically broken."


