# ===== Путь олигархов и вертикали, шаг 1 (PROPOSAL_oligarchs.md) =====
 UKR_ol_vertical:0 "Vertical and Clans"
 UKR_ol_vertical_desc:0 "The president stops pretending the inner circle does not exist. Four clans get seats at the table and a list of expectations, and the Office gets to decide who sits where. It is faster than reforms and costlier than it looks: every chair at the table will eventually send a bill."
 UKR_ol_state_partners:0 "State Partners"
 UKR_ol_state_partners_desc:0 "The channels and websites of the big holdings become 'partners of the state' in information policy. The justification: one picture of war and crisis. The price: the press depends on its owner, and the owner now expects a favour in return."
 UKR_ol_loyal_security:0 "Loyal Security Services"
 UKR_ol_loyal_security_desc:0 "Staffing decisions in the SBU, the National Guard and the prosecutor's office are made on a 'ours or theirs' basis. The justification: in a crisis you need people you can rely on. The price: the agencies are loyal to people rather than to the law, and the security circle expects gratitude."
 UKR_ol_procurement:0 "Procurement Through Our People"
 UKR_ol_procurement_desc:0 "Defence and infrastructure orders go to contractors from the inner circle: no long tenders, fast and guaranteed. The justification: the army does not wait for competitions. The price: the numbers in the reports grow faster than the quality in the warehouses, and the bill arrives later."
 UKR_ol_vertical_tt:0 "Opens the §YVertical§! window, the §YVertical and Clans§! balance and the shares and claims of four clans. The §YManaged Oligarchy§! spirit replaces the current oligarchy stage. A §Ylunch at the Office§! follows in a few days."
 UKR_ol_vertical_dev_tt:0 "§GShowcase§!: industry §G+0.02§!.\n§RBasement§!: society §R-0.01§!."
 UKR_ol_partners_dev_tt:0 "§GShowcase§!: stability and political power.\n§RBasement§!: society §R-0.02§!."
 UKR_ol_security_dev_tt:0 "§GShowcase§!: stability, political power, mobilisation speed.\n§RBasement§!: poverty protection §R-0.015§!."
 UKR_ol_procurement_dev_tt:0 "§GShowcase§!: military development §G+0.04§!, industry §G+0.02§!, weapons production speed.\n§RBasement§!: poverty protection §R-0.01§!. Not all of this will be real."
 UKR_ol_claim_priv_up_tt:0 "The claims of §YPrivat§! grow, and so does its share of power."
 UKR_ol_claim_sec_up_tt:0 "The claims of the §YSecurity Circle§! grow, and so does its share of power."
 UKR_ol_claim_met_sec_up_tt:0 "The claims and shares of §YMetals and Energy§! and the §YSecurity Circle§! grow."
 UKR_ol_claim_met_down_tt:0 "The claims of §YMetals and Energy§! fall and its share of power grows."
 UKR_ol_claim_priv_down_tt:0 "The claims of §YPrivat§! fall and its share of power grows."
 UKR_ol_claim_sec_down_tt:0 "The claims of the §YSecurity Circle§! fall and its share of power grows."
 UKR_ol_claim_met_sec_down_tt:0 "The claims of the §YSecurity Circle§! and §YMetals and Energy§! fall."
 UKR_ol_claims_all_down_tt:0 "The claims of all four clans fall slightly."
 UKR_ol_grudge_up_tt:0 "The clans will remember this: the hidden §Ygrudge§! grows."
 UKR_ol_bop_clans_tt:0 "The §YVertical and Clans§! balance shifts towards the §YClans§!."
 UKR_ol_bop_vertical_tt:0 "The §YVertical and Clans§! balance shifts towards the §YVertical§!."
 UKR_vp_pay_off_tt:0 "The clan's claims §G-30§!. The balance shifts slightly towards the §YClans§!."
 UKR_managed_oligarchy:0 "Managed Oligarchy"
 UKR_managed_oligarchy_desc:0 "The chaos of obligations has become a system: the clans know their places and the Office knows whom to call. Governing is easier, the price is the same, only now it is scheduled. Industry grows while society and poverty protection slowly sink."
 UKR_state_partners_idea:0 "State Partners"
 UKR_state_partners_idea_desc:0 "The big media holdings run information policy together with the state. Calmer on air, quieter in the courtrooms, costlier later."
 UKR_loyal_security_idea:0 "Loyal Security Services"
 UKR_loyal_security_idea_desc:0 "Key posts in the SBU, the National Guard and the prosecutor's office are held by people who do not ask extra questions. Order is guaranteed, independence is not."
 UKR_priority_procurement_idea:0 "Priority Procurement"
 UKR_priority_procurement_idea_desc:0 "Weapons and supplies go through trusted contractors, fast and without competitions. The figures in the reports are convincing; nobody has asked to check them yet."
 UKR_office_yermak:0 "Yermak's Office"
 UKR_office_yermak_desc:0 "Andriy Yermak, head of the Office of the President, decides whom to call, whom to invite to lunch and whose letter reaches the desk."
 UKR_office_yermak_shadow:0 "The Office in the Shadows"
 UKR_office_yermak_shadow_desc:0 "Yermak formally stays out of sight, but the calls still go through his office. The influence remains, the responsibility does not."
 UKR_office_stefanchuk:0 "Stefanchuk's Office"
 UKR_office_stefanchuk_desc:0 "The Office is now led by Ruslan Stefanchuk, a lawyer who knows how to dress any decision up as a law."
 UKR_undertow_1:0 "Undercurrent"
 UKR_undertow_1_desc:0 "Hidden spirit: growth of the opposition platform."
 UKR_undertow_2:0 "Undercurrent"
 UKR_undertow_2_desc:0 "Hidden spirit: growth of the opposition platform."
 UKR_undertow_3:0 "Undercurrent"
 UKR_undertow_3_desc:0 "Hidden spirit: growth of the opposition platform."
 UKR_arakhamia_premier:0 "Davyd Arakhamia"
 UKR_arakhamia_premier_desc:0 "Head of the Servant of the People faction in the Verkhovna Rada. Knows every deputy by his vote and every minister by his phone number."
 UKR_bohdan:0 "Andriy Bohdan"
 UKR_bohdan_desc:0 "A lawyer and former head of the Office of the President (2019-2020) who for many years represented the interests of Ihor Kolomoisky."
 UKR_vilkul:0 "Oleksandr Vilkul"
 UKR_vilkul_desc:0 "A politician from Kryvyi Rih and a former deputy prime minister. Represents the interests of the mining and metals sector."
 UKR_vertical_clans_balance:0 "Vertical and Clans"
 UKR_vertical_clans_balance_desc:0 "Who holds whom: the president the clans, or the clans the president? The balance shows where the country is leaning. Favours to the clans move it towards the clans, pressure on them towards the vertical. The centre is the president as arbiter: the most stable regime and the most modest in results."
 UKR_bop_clans:0 "Clans"
 UKR_bop_vertical:0 "Vertical"
 UKR_bop_vc_arbiter:0 "The President as Arbiter"
 UKR_bop_vc_clans_lead:0 "The Clans Negotiate"
 UKR_bop_vc_clans_dominate:0 "The Clans Dominate"
 UKR_bop_vc_clans_edge:0 "The State Held Captive"
 UKR_bop_vc_vertical_lead:0 "The Vertical Strengthens"
 UKR_bop_vc_vertical_dominate:0 "The Vertical Dominates"
 UKR_bop_vc_vertical_edge:0 "A Vertical Without Fuses"
 UKR_vertical_power:0 "The Vertical"
 UKR_vertical_power_desc:0 "The president no longer cleans up the inner circle but negotiates with it. Every favour to the clans gives a quick result and an entry in the debt book, every pressure gives control and a grudge. The balance shows who holds whom.\n\n§YClan loyalty:§! §Y[?UKR_ol_loyalty|0]§! out of 100 - [UKR_OL_LOYALTY_WORD]\n\n§YThe clans (share of power, claims):§!\nMetals and Energy (Akhmetov: SCM, Metinvest, DTEK): §Y[?UKR_cl_met_pct|0]%§!, claims §Y[?UKR_cl_met_claim|0]§!\nPrivat (Kolomoisky: Privat, 1+1 Media, Ukrnafta): §Y[?UKR_cl_priv_pct|0]%§!, claims §Y[?UKR_cl_priv_claim|0]§!\nGas and Chemicals (Firtash: Group DF, Ostchem, regional gas companies): §Y[?UKR_cl_gas_pct|0]%§!, claims §Y[?UKR_cl_gas_claim|0]§!\nSecurity Circle (SBU, National Guard, Interior Ministry, prosecutors): §Y[?UKR_cl_sec_pct|0]%§!, claims §Y[?UKR_cl_sec_claim|0]§!\n\n§YShowcase and basement§! (TFR scale, change since the start of the path):\nIndustry: §Y[?industrial_development_var|2]§! ([?UKR_ol_d_ind|2]) - [UKR_OL_TREND_IND]\nMilitary: §Y[?military_development_var|2]§! ([?UKR_ol_d_mil|2]) - [UKR_OL_TREND_MIL]\nFarming: §Y[?farming_development_var|2]§! ([?UKR_ol_d_farm|2]) - [UKR_OL_TREND_FARM]\nSociety: §Y[?society_development_var|2]§! ([?UKR_ol_d_soc|2]) - [UKR_OL_TREND_SOC]\nPoverty protection: §Y[?poverty_development_var|2]§! ([?UKR_ol_d_pov|2]) - [UKR_OL_TREND_POV]\nScience: §Y[?academic_development_var|2]§! ([?UKR_ol_d_acad|2]) - [UKR_OL_TREND_ACAD]"
 UKR_ol_trend_up2:0 "§Ggrowing fast§!"
 UKR_ol_trend_up1:0 "§Ggrowing§!"
 UKR_ol_trend_flat:0 "§Yholding§!"
 UKR_ol_trend_down1:0 "§Rsagging§!"
 UKR_ol_trend_down2:0 "§Rcollapsing§!"
 UKR_ol_loyalty_calm:0 "§Gthe clans are calm§!"
 UKR_ol_loyalty_grumble:0 "§Ythe clans grumble§!"
 UKR_ol_loyalty_bills:0 "§Rthe clans demand their bills§!"
 UKR_ol_loyalty_break:0 "§Rthe clans are on the brink of a break§!"
 UKR_vp_pay_off_met:0 "Compensation: Metals and Energy"
 UKR_vp_pay_off_met_desc:0 "Settle part of the debts to the metals and energy clan with an order, a tariff or a tax decision. Expensive, but cheaper than a grudge."
 UKR_vp_pay_off_priv:0 "Compensation: Privat"
 UKR_vp_pay_off_priv_desc:0 "Settle part of the debts to Privat with airtime, an oil quota or a convenient court ruling. Expensive, but cheaper than a grudge."
 UKR_vp_pay_off_gas:0 "Compensation: Gas and Chemicals"
 UKR_vp_pay_off_gas_desc:0 "Settle part of the debts to the gas and chemicals clan with a licence, a gas price or a decision on regional gas companies. Expensive, but cheaper than a grudge."
 UKR_vp_pay_off_sec:0 "Compensation: Security Circle"
 UKR_vp_pay_off_sec_desc:0 "Settle part of the debts to the security circle with a post, a budget or a closed case. Expensive, but cheaper than a grudge."
 ukraine_politics.600.t:0 "Lunch at the Office"
 ukraine_politics.600.d_yermak:0 "Lunch is set for half past one at the Office of the President on Bankova, and the invitations went out without an agenda, which is itself an agenda. Four people sit at the table: a representative of Rinat Akhmetov's group (SCM, Metinvest, DTEK), a man of Ihor Kolomoisky's (Privat, 1+1 Media, Ukrnafta), a representative of Dmytro Firtash (Group DF, Ostchem, regional gas companies; he himself has been in Vienna since 2014, where the proceedings on his extradition to the United States drag on) and a senior figure from the security bloc. Andriy Yermak pours the tea and explains that the lunch is a working one, not a political one.\n\nEveryone understands the format: the president no longer cleans up the inner circle, he formalises it. Each guest wants to know what he has been promised, and each understands that he will be asked for something in return. What remains is to choose the tone: negotiate, keep a distance or remind them whose Bankova this is."
 ukraine_politics.600.d_stefanchuk:0 "Lunch is set for half past one at the Office of the President on Bankova, and the invitations went out without an agenda, which is itself an agenda. Four people sit at the table: a representative of Rinat Akhmetov's group (SCM, Metinvest, DTEK), a man of Ihor Kolomoisky's (Privat, 1+1 Media, Ukrnafta), a representative of Dmytro Firtash (Group DF, Ostchem, regional gas companies; he himself has been in Vienna since 2014, where the proceedings on his extradition to the United States drag on) and a senior figure from the security bloc. The Office is now run by Ruslan Stefanchuk: he pours the tea and explains that the lunch is a working one and no minutes are needed.\n\nEveryone understands the format: the president no longer cleans up the inner circle, he formalises it. Each guest wants to know what he has been promised, and each understands that he will be asked for something in return. What remains is to choose the tone: negotiate, keep a distance or remind them whose Bankova this is."
 ukraine_politics.600.a:0 "Negotiate: a promise for everyone."
 ukraine_politics.600.b:0 "Keep a distance: listen and take notes."
 ukraine_politics.600.c:0 "Remind them whose Bankova this is."
 ukraine_politics.601.t:0 "Who Will Lead the Government"
 ukraine_politics.601.d:0 "The vertical needs a prime minister who does not discuss instructions but carries them out. Two names are on offer. Davyd Arakhamia, head of the Servant of the People faction in the Rada, knows every deputy by his vote and every minister by his phone number, and is considered a man who can negotiate without witnesses. Andriy Bohdan, the former head of the Office who left in February 2020, was for many years Ihor Kolomoisky's lawyer, and Privat will read his return as a sign that they have not been forgotten.\n\nThe first strengthens Bankova, the second returns part of the influence to the clans. The sitting prime minister can stay, but the clans' claims will not disappear, they will have to be settled another way."
 ukraine_politics.601.a:0 "Davyd Arakhamia: the faction and discipline."
 ukraine_politics.601.b:0 "Andriy Bohdan: Privat's old friendship."
 ukraine_politics.601.c:0 "Keep the sitting prime minister."
 ukraine_politics.602.t:0 "Who Gets the Economy"
 ukraine_politics.602.d:0 "In this arrangement the economy portfolio is not a technical post but a map of influence. Oleksandr Vilkul, a politician from Kryvyi Rih and a former deputy prime minister, represents the mining and metals sector, and the metallurgists are ready to back him in any formula that guarantees them energy and tariffs. Danylo Hetmantsev, chairman of the Rada's tax committee, is the president's man: under him taxes and tariffs will be set as Bankova needs them, not Kryvyi Rih and Zaporizhzhia.\n\nThe metals and energy people are waiting for an answer, and their claims grow along with their share of the budget. Keeping the sitting minister is safer, but then something will have to be offered elsewhere."
 ukraine_politics.602.a:0 "Oleksandr Vilkul: metal and energy."
 ukraine_politics.602.b:0 "Danylo Hetmantsev: taxes along Bankova's line."
 ukraine_politics.602.c:0 "Keep the sitting minister."
 ukraine_politics.603.t:0 "Who Gets the Interior Ministry"
 ukraine_politics.603.d:0 "The Interior Ministry is the National Guard, the police and the cadres who know where all the files are kept. Arsen Avakov ran the ministry from 2014 and left in 2020 after a scandal, but his people stayed in the regions, and bringing him back means bringing them back too. Denys Monastyrskyi, head of the ministry after Avakov's resignation, is loyal to Bankova and has no base of his own: betting on him makes the security services dependent on the Office rather than on the minister.\n\nThe security circle is waiting for an answer: will it be spoken to as a partner or as a contractor."
 ukraine_politics.603.a:0 "Arsen Avakov: the police, the National Guard and his own apparatus."
 ukraine_politics.603.b:0 "Denys Monastyrskyi: a minister with no base of his own."
 ukraine_politics.603.c:0 "Keep the sitting minister."
 ukraine_politics.604.t:0 "Who Buys for the Army"
 ukraine_politics.604.d:0 "Defence procurement is money, and money is relationships. Oleksii Reznikov, the defence minister, can explain why a contract had to be signed quickly and with precisely this supplier; after the story of eggs at 17 hryvnias the ministry has learned to answer such questions without a pause. The security circle and the metallurgists expect that under him the orders will go to their own people. Andrii Taran, his predecessor, is more an officer than a manager: the army is calmer with him and the contractors are bored.\n\nChoosing between them is choosing between orders and accountability. Leaving everything as it is is also possible, but the clans have their own views on what a tender should look like."
 ukraine_politics.604.a:0 "Oleksii Reznikov: procurement goes to our own."
 ukraine_politics.604.b:0 "Andrii Taran: an officer, not a manager."
 ukraine_politics.604.c:0 "Keep the sitting minister."
 ukraine_politics.605.t:0 "Who Will Know Everything"
 ukraine_politics.605.d:0 "Intelligence and counterintelligence know who promised what to whom. Ivan Bakanov, the president's childhood friend who once ran the Kvartal 95 studio, is a man of the system in the literal sense: nobody needs to explain to him whose agency this is. Kyrylo Budanov is a professional whose value is that he owes nothing to anyone, and therefore will not become part of the arrangement.\n\nFor the vertical it is a choice between controllability and quality, for the clans between their own man in the service and an independent one."
 ukraine_politics.605.a:0 "Ivan Bakanov: our own man in the service."
 ukraine_politics.605.b:0 "Kyrylo Budanov: a professional who owes nobody."
 ukraine_politics.605.c:0 "Keep the sitting minister."

# ===== Путь олигархов и вертикали, шаг 2 (PROPOSAL_oligarchs.md) =====
 UKR_ol_marathon:0 "Unified Marathon"
 UKR_ol_marathon_desc:0 "All the main channels go out in a joint broadcast: news, briefings and commentary in a single format. The justification: in war and crisis you cannot show ten versions of one event. The price: there is one version, and it has an editor."
 UKR_ol_concessions:0 "Concessions and Licences"
 UKR_ol_concessions_desc:0 "The state hands out rights to extraction, energy, gas and fertilisers: quickly and with guarantees, not by competition. The justification: the money is needed now and investors will not wait. The price: every licence is written to a specific recipient, and the recipient has a memory."
 UKR_ol_personnel_carousel:0 "Personnel Carousel"
 UKR_ol_personnel_carousel_desc:0 "Ministers and agency heads are replaced quickly and without explanation: whoever is needed today need not be needed tomorrow. The justification: flexibility and accountability. The price: experienced people leave, and those who stay remember that chairs are temporary."
 UKR_ol_emergency_powers:0 "NSDC Emergency Powers"
 UKR_ol_emergency_powers_desc:0 "The NSDC gains the right to take decisions that used to require a law: sanctions, blocks, control over the movement of assets. The justification: the threat is too fast for parliament. The price: laws lag behind decisions, and decisions have no statute of limitations."
 UKR_ol_clan_industry:0 "The Clans' Defence Industry"
 UKR_ol_clan_industry_desc:0 "The clans build and maintain military production at their own expense in exchange for guaranteed orders. The justification: the state lacks capacity. The price: the orders and the capacity belong to the same people, and there is nobody to check the prices."
 UKR_ol_mobilization_reserve:0 "Reserve by Lists"
 UKR_ol_mobilization_reserve_desc:0 "Part of the specialists receive a deferment by lists from enterprises and agencies. The justification: the economy and the administration must be preserved. The price: the lists are drawn up by those with an interest in them, and citizens quickly learn to read them."
 UKR_ol_soft_erosion:0 "Soft Erosion"
 UKR_ol_soft_erosion_desc:0 "The rules stay on paper and decisions are made by phone call. Nobody breaks the law openly: it is simply no longer noticed. The justification: stability is better than conflict. The price: institutions slowly rust and society gets used to 'that is how it is done'."
 UKR_ol_open_vertical:0 "The Open Vertical"
 UKR_ol_open_vertical_desc:0 "The president stops pretending: orders go from the top down, the clans submit directly, objections count as sabotage. The justification: war does not tolerate dual power. The price: any break in the chain becomes a crisis, and the dissatisfied no longer grumble but prepare."
 UKR_ol_clan_pact:0 "The Clan Pact"
 UKR_ol_clan_pact_desc:0 "The clans receive written guarantees: a share of procurement, preservation of assets, a seat at the table. The balance returns to the centre and the claims quieten for a while. The justification: stability. The price: the pact works until somebody wants more."
 UKR_ol_arbiter:0 "The President as Arbiter"
 UKR_ol_arbiter_desc:0 "The president declares himself an arbiter between interests: nobody wins completely, nobody leaves completely. This needs rules that can be adjusted and lawyers ready to adjust them. The justification: balance. The price: the rules serve the arbiter."
 UKR_ol_no_intermediaries:0 "A Vertical Without Intermediaries"
 UKR_ol_no_intermediaries_desc:0 "The clans are no longer intermediaries: decisions, appointments and licences come directly from the Office. The justification: fewer links, more speed. The price: the aggrieved no longer have an address for their claims, and they look for another."
 UKR_ol_constitution:0 "The Constitutional Commission"
 UKR_ol_constitution_desc:0 "A working group of lawyers proposes to 'clarify' the 1996 Constitution: terms, powers, the order of elections. The justification: the Constitution was written for a different state and war needs unity of command. The price: each amendment on its own sounds reasonable."
 UKR_ol_final_soft:0 "The Republic by Agreement"
 UKR_ol_final_soft_desc:0 "Everything works by agreement: the corporations know their quotas, the ministers their terms, the president his role as arbiter. Formally a republic, in fact a club. The justification: order and growth. The price: you cannot get into the club, and you cannot leave it either."
 UKR_ol_final_open:0 "The Corporate State"
 UKR_ol_final_open_desc:0 "The state is run like a large corporation: a vertical of orders, key performance indicators, internal investigations for the dissenting. The justification: efficiency and war. The price: everything rests on those at the top, and there is no replacement for them."
 UKR_ol_marathon_dev_tt:0 "§GShowcase§!: stability and war support.\n§RBasement§!: society §R-0.02§!.\nThe grudge of §YPrivat§! grows."
 UKR_ol_concessions_dev_tt:0 "§GShowcase§!: industry §G+0.03§!, farming §G+0.03§!, income §G+0.4§!.\n§RBasement§!: poverty protection §R-0.015§!. Not all of this will be real."
 UKR_ol_claim_met_gas_up_tt:0 "The claims and shares of §YMetals and Energy§! and §YGas and Chemicals§! grow."
 UKR_ol_carousel_dev_tt:0 "§GShowcase§!: political power, changing ministers is §G30%§! cheaper.\n§RBasement§!: society §R-0.02§!."
 UKR_ol_emergency_dev_tt:0 "§GShowcase§!: stability, political power, the §YHigh Police§! and §YHigh Prison§! laws.\n§RBasement§!: society §R-0.02§!, poverty protection §R-0.01§!, Western trust weakens."
 UKR_ol_clan_industry_dev_tt:0 "§GShowcase§!: military development §G+0.04§!, industry §G+0.02§!, a new arms factory.\n§RBasement§!: poverty protection §R-0.01§!, society §R-0.01§!. Not all of this will be real."
 UKR_ol_reserve_dev_tt:0 "§GShowcase§!: mobilisation speed, political power, the §YCivil Service Exemptions§! law.\n§RBasement§!: society §R-0.01§!, war support weakens."
 UKR_ol_soft_dev_tt:0 "§GShowcase§!: industry §G+0.03§!, stability and political power.\n§RBasement§!: society §R-0.02§!, science slowly sags."
 UKR_ol_soft_tt:0 "Opens the §Ysoft erosion§! branch: the clan pact and the president as arbiter. The §Yopen vertical§! branch closes."
 UKR_ol_open_dev_tt:0 "§GShowcase§!: industry §G+0.04§!, military development §G+0.03§!, political power and stability.\n§RBasement§!: society §R-0.04§!, Western trust falls. Not all of this will be real."
 UKR_ol_open_tt:0 "Opens the §Yopen vertical§! branch: a vertical without intermediaries and the constitutional commission. The §Ysoft erosion§! branch closes."
 UKR_ol_pact_dev_tt:0 "§GShowcase§!: stability, income growth.\n§RBasement§!: society §R-0.01§!."
 UKR_ol_clan_pact_tt:0 "The §YVertical and Clans§! balance returns to the centre. The claims of all clans §G-20§!."
 UKR_ol_arbiter_dev_tt:0 "§GShowcase§!: political power and stability.\n§RBasement§!: society §R-0.01§!."
 UKR_ol_arbiter_tt:0 "Opens the §Yshort constitutional package§!: the 'Rada under New Rules' and 'Courts and Justice' modules. The §Yconstitutional commission§! meets in a few days."
 UKR_ol_no_inter_dev_tt:0 "§GShowcase§!: political power, stability, the §YHighest Police§! law.\n§RBasement§!: society §R-0.03§!, poverty protection §R-0.02§!."
 UKR_ol_no_inter_tt:0 "The balance shifts strongly towards the §YVertical§!, and the hidden §Ygrudge§! of all clans grows."
 UKR_ol_constitution_tt:0 "Opens the §Yconstitutional package§! of six modules. The §Yconstitutional commission§! meets in a few days."
 UKR_ol_final_soft_dev_tt:0 "§GShowcase§!: industry §G+0.05§!, farming §G+0.03§!, stability §G+5%§!, economy type §Ycorporatism§!.\n§RBasement§!: society §R-0.03§!, science §R-0.03§!. Not all of this will be real."
 UKR_ol_final_open_dev_tt:0 "§GShowcase§!: industry §G+0.05§!, military development §G+0.04§!, stability §G+5%§!, economy type §Ystate capitalism§!, government type §Ypresidential dictatorship§!.\n§RBasement§!: society §R-0.04§!, poverty protection §R-0.04§!, science §R-0.03§!. Not all of this will be real."
 UKR_ol_target_met_tt:0 "The §YMetals and Energy§! clan is named a target: §Ypressure§! decisions open."
 UKR_ol_target_priv_tt:0 "The §YPrivat§! clan is named a target: §Ypressure§! decisions open."
 UKR_ol_target_gas_tt:0 "The §YGas and Chemicals§! clan is named a target: §Ypressure§! decisions open."
 UKR_ol_target_sec_tt:0 "The §YSecurity Circle§! is named a target: §Ypressure§! decisions open."
 UKR_ol_eu_up_tt:0 "European influence grows slightly."
 UKR_ol_eu_down_tt:0 "European influence falls slightly."
 UKR_ol_claim_met_priv_up_tt:0 "The claims of §YMetals and Energy§! and §YPrivat§! grow."
 UKR_vp_priority_procurement:0 "Priority Procurement"
 UKR_vp_priority_procurement_desc:0 "Weapons and supplies go through trusted contractors: fast and without tenders. The justification: the army does not wait for competitions. The price: the reports are convincing and nobody has yet asked to check them."
 UKR_vp_priority_procurement_tt:0 "§GShowcase§!: military development §G+0.02§!, faster weapons production for 90 days.\n§RBasement§!: poverty protection §R-0.005§!.\nThe claims of the §YSecurity Circle§! and §YMetals and Energy§! grow."
 UKR_vp_energy_concessions:0 "Energy Concessions"
 UKR_vp_energy_concessions_desc:0 "Hand the metals and energy clan the rights to generation and coal programmes. The justification: energy security. The price: tariffs and quotas are now written for the recipient."
 UKR_vp_energy_concessions_tt:0 "§GShowcase§!: industry §G+0.03§!, income §G+0.3§!.\n§RBasement§!: poverty protection §R-0.01§!.\nThe claims and share of §YMetals and Energy§! grow."
 UKR_vp_gas_licences:0 "Gas Licences and Fertilisers"
 UKR_vp_gas_licences_desc:0 "Give the gas clan extraction licences and favourable terms for fertiliser exports. The justification: agricultural exports. The price: the gas price for the consumer ceases to depend on the market."
 UKR_vp_gas_licences_tt:0 "§GShowcase§!: farming §G+0.03§!, income §G+0.3§!.\n§RBasement§!: society §R-0.01§!.\nThe claims and share of §YGas and Chemicals§! grow."
 UKR_vp_security_quota:0 "Posts Quota"
 UKR_vp_security_quota_desc:0 "Give the security circle a quota of posts in agencies and regions. The justification: experienced cadres. The price: experience is now checked by affiliation."
 UKR_vp_security_quota_tt:0 "§GShowcase§!: political power §G+3%§! for 90 days.\n§RBasement§!: poverty protection §R-0.005§!.\nThe claims of the §YSecurity Circle§! grow."
 UKR_vp_tax_holiday:0 "Tax Holiday for Investors"
 UKR_vp_tax_holiday_desc:0 "Exempt large investors from part of their taxes for several years. The justification: investment is needed. The price: the budget loses revenue, and the list of 'investors' strangely matches the guest list of the lunch."
 UKR_vp_tax_holiday_tt:0 "§GShowcase§!: industry §G+0.03§!, the §YLow Taxes§! law.\n§RBasement§!: poverty protection §R-0.015§!, income §R-0.2§!.\nThe claims of §YMetals and Energy§! and §YPrivat§! grow."
 UKR_vp_tax_audit:0 "Tax Audit"
 UKR_vp_tax_audit_desc:0 "An audit of the clan named by the event: scheduled, unscheduled and very attentive. The justification: equality before the law. The price: the equality applies to those who were chosen."
 UKR_vp_tax_audit_tt:0 "The target clan loses §R6§! points of share, its claims reset to zero, its hidden §Ygrudge§! grows. Political power §G+30§!, income §G+0.2§!, industry §G+0.02§!."
 UKR_vp_sanctions_domestic:0 "NSDC Sanctions Against a Clan"
 UKR_vp_sanctions_domestic_desc:0 "Impose sanctions on the assets of the target clan. The justification: national security. The price: 'selective justice', as the partners call it."
 UKR_vp_sanctions_domestic_tt:0 "The target clan loses §R8§! points of share, its claims reset, its §Ygrudge§! grows. Political power §G+20§!. European influence weakens."
 UKR_vp_court_case:0 "A Case Against the Defiant"
 UKR_vp_court_case_desc:0 "Open a case against the target clan and entrust it to the controlled agencies. The justification: the fight against corruption. The price: the fight goes in one direction only."
 UKR_vp_court_case_tt:0 "The target clan loses §R10§! points of share, its claims reset, its §Ygrudge§! grows. Political power §G+40§!. The controlled agencies are entrenched, European influence weakens."
 UKR_vp_security_rotation:0 "Security Rotation"
 UKR_vp_security_rotation_desc:0 "Rearrange the commanders and chiefs in the agency of the target clan. The justification: routine rotation. The price: all the other security officers read the order carefully."
 UKR_vp_security_rotation_tt:0 "The target clan loses §R6§! points of share, its §Ygrudge§! grows. Stability §G+1%§!. The security circle is uneasy: its claims grow."
 UKR_vp_unified_marathon:0 "Unified Information Marathon"
 UKR_vp_unified_marathon_desc:0 "Switch on round-the-clock joint broadcasting on all the holdings' channels. The justification: one picture of the day. The price: the viewer realises the picture is single and very even."
 UKR_vp_unified_marathon_tt:0 "§GShowcase§!: stability §G+3%§! and war support §G+3%§! for 120 days.\n§RBasement§!: society §R-0.01§!.\nThe grudge of §YPrivat§! grows."
 UKR_vp_private_security_law:0 "Private Security Law"
 UKR_vp_private_security_law_desc:0 "Grant private security firms extended powers. The justification: the state lacks manpower. The price: the guards belong to whoever pays them."
 UKR_vp_private_security_law_tt:0 "The §YPrivate Police§! law. Political power §G+20§!, the claims of the §YSecurity Circle§! grow."
 UKR_vp_draft_deferments:0 "General Deferments"
 UKR_vp_draft_deferments_desc:0 "Extend deferment from conscription to all key sectors and agencies. The justification: the economy has to work. The price: the fairness of the draft depends on where a person works."
 UKR_vp_draft_deferments_tt:0 "The §YGeneral Exemptions§! law: the draft weakens, political power is higher. §RBasement§!: society §R-0.01§!, war fatigue grows."
 UKR_vp_requisition:0 "Requisition of Capacity"
 UKR_vp_requisition_desc:0 "Temporarily place the clan's plants under state management for defence orders. The justification: war. The price: the owners remember whose order it was."
 UKR_vp_requisition_tt:0 "Faster weapons production and higher plant capacity for 70 days. The claims and hidden grudge of the §YMetals and Energy§! clan grow."
 UKR_vp_clan_industry:0 "A Clan's Defence Plant"
 UKR_vp_clan_industry_desc:0 "Commission the clan to build a new arms factory at its own expense. The justification: faster than the state budget. The price: the plant, the orders and the prices have one owner."
 UKR_vp_clan_industry_tt:0 "§GShowcase§!: military development §G+0.02§!, a new arms factory.\n§RBasement§!: poverty protection §R-0.005§!.\nThe claims and shares of §YMetals and Energy§! and the §YSecurity Circle§! grow."
 UKR_vp_handouts:0 "Presidential Payments"
 UKR_vp_handouts_desc:0 "One-off payments to pensioners, public-sector workers and families with children. The justification: support in hard times. The price: in two months the hard times return and the payments do not."
 UKR_vp_handouts_tt:0 "Income §R-0.8§!. Stability §G+4%§! for 75 days. Stability is not built but bought: after 75 days you will have to pay again."
 UKR_vp_tariff_freeze:0 "Tariff Freeze"
 UKR_vp_tariff_freeze_desc:0 "Freeze the tariffs on gas, heat and electricity. The justification: consumer protection. The price: the difference is made up by those who promised not to complain."
 UKR_vp_tariff_freeze_tt:0 "Stability §G+3%§! for 90 days. The claims of §YMetals and Energy§! and §YGas and Chemicals§! grow."
 UKR_vp_turn_wheel_poverty:0 "Turning the Wheel: A Social Package"
 UKR_vp_turn_wheel_poverty_desc:0 "Direct part of the funds to pensions, medicines and housing. The justification: a country cannot live forever on a reserve of patience. The price: the clans dislike it, they count the money in their own pockets."
 UKR_vp_turn_wheel_poverty_tt:0 "Poverty protection §G+0.05§!, income §R-0.5§!. The clans are displeased: the balance shifts to the §YClans§!, everyone's claims grow."
 UKR_vp_turn_wheel_society:0 "Turning the Wheel: A Thaw"
 UKR_vp_turn_wheel_society_desc:0 "Ease the pressure on the media and science, restore grants and reopen some cases. The justification: the country needs trust. The price: the clans see weakness in a thaw."
 UKR_vp_turn_wheel_society_tt:0 "Society §G+0.05§!, science §G+0.03§!, European influence grows slightly. The clans are displeased: the balance shifts to the §YClans§!, everyone's claims grow."
 UKR_vp_const_term:0 "Term and Continuity"
 UKR_vp_const_term_desc:0 "Postpone elections 'until stabilisation' by an amendment to the law on martial law and the Constitution. The justification: the country cannot afford campaigns at such a time. The price: the date of 'stabilisation' is not named."
 UKR_vp_const_term_tt:0 "Elections are postponed 'until stabilisation'. Stability §G+3%§!, Western trust falls. The Rada votes in a few days."
 UKR_vp_const_vertical:0 "A Single Vertical of Power"
 UKR_vp_const_vertical_desc:0 "Entrench the government's accountability to the president and simplify appointments in the regions. The justification: unity of command in wartime. The price: control converges in a single point."
 UKR_vp_const_vertical_tt:0 "The government is accountable to the president; government type §Ypresidential dictatorship§!. Political power §G+4%§!, society §R-0.05§!, stability at first §R-2%§!."
 UKR_vp_const_rada:0 "The Rada Under New Rules"
 UKR_vp_const_rada_desc:0 "Adopt an electoral law with closed lists and a higher threshold. The justification: consolidation and party responsibility. The price: the voters of small parties are left without a chamber."
 UKR_vp_const_rada_tt:0 "Closed lists and a high threshold: small parties lose popularity, Servant of the People gains. Political power §G+3%§!."
 UKR_vp_const_court:0 "Courts and Justice"
 UKR_vp_const_court_desc:0 "Change the way the Constitutional Court and the High Council of Justice are formed. The justification: cleansing the 'old system'. The price: the new system arrives with ready-made opinions."
 UKR_vp_const_court_tt:0 "The Constitutional Court and the High Council of Justice are formed differently; the controlled agencies are entrenched. Political power §G+5%§!, Western trust falls."
 UKR_vp_const_ngo:0 "Law on Public Funding of NGOs and Media"
 UKR_vp_const_ngo_desc:0 "Introduce registers and mandatory reporting for NGOs and media. The justification: transparency and security. The price: transparency is distributed unevenly."
 UKR_vp_const_ngo_tt:0 "Registers and reporting for NGOs and media. Political power §G+2%§!, society §R-0.05§!."
 UKR_vp_const_referendum:0 "The Referendum"
 UKR_vp_const_referendum_desc:0 "Put the amendments to a referendum to entrench what has been adopted by 'the will of the people'. The justification: legitimacy. The price: the outcome is not guaranteed, and a defeat would be conspicuous."
 UKR_vp_const_referendum_tt:0 "The referendum entrenches the adopted amendments. The outcome depends on stability, the court's opinion, the marathon and the Venice Commission's involvement. If it fails the amendments are rolled back."
 UKR_vp_bill_met:0 "Clan Bill: Metals and Energy"
 UKR_vp_bill_met_desc:0 "The 'Metals and Energy' clan reminds you of its debts. If within 60 days the claims do not fall below 70, it goes into opposition for half a year."
 UKR_vp_bill_priv:0 "Clan Bill: Privat"
 UKR_vp_bill_priv_desc:0 "The 'Privat' clan reminds you of its debts. If within 60 days the claims do not fall below 70, it goes into opposition for half a year."
 UKR_vp_bill_gas:0 "Clan Bill: Gas and Chemicals"
 UKR_vp_bill_gas_desc:0 "The 'Gas and Chemicals' clan reminds you of its debts. If within 60 days the claims do not fall below 70, it goes into opposition for half a year."
 UKR_vp_bill_sec:0 "Clan Bill: Security Circle"
 UKR_vp_bill_sec_desc:0 "The 'Security Circle' clan reminds you of its debts. If within 60 days the claims do not fall below 70, it goes into opposition for half a year."
 UKR_marathon_idea:0 "Unified Marathon"
 UKR_marathon_idea_desc:0 "One format, one editor, one version. Quieter on screen, louder in the street."
 UKR_personnel_carousel_idea:0 "Personnel Carousel"
 UKR_personnel_carousel_idea_desc:0 "Ministers are replaced quickly, cheaply and without explanation. The chairs are temporary and everyone knows it."
 UKR_emergency_powers_idea:0 "NSDC Emergency Powers"
 UKR_emergency_powers_idea_desc:0 "The NSDC decides what used to require a law. Faster, harder and without a statute of limitations."
 UKR_deferment_lists_idea:0 "Deferments by Lists"
 UKR_deferment_lists_idea_desc:0 "Deferments are issued by lists from enterprises and agencies. The lists are read carefully, from both sides."
 UKR_soft_erosion_idea:0 "Rust and Comfort"
 UKR_soft_erosion_idea_desc:0 "Everything works, but more slowly than a year ago. The rules are in place, they are just not noticed."
 UKR_open_vertical_idea:0 "The Mobilised Vertical"
 UKR_open_vertical_idea_desc:0 "Orders go from the top down, objections count as sabotage. Fast, hard and without a fallback."
 UKR_clan_pact_idea:0 "The Clan Pact"
 UKR_clan_pact_idea_desc:0 "Written guarantees instead of verbal promises. It works until somebody wants more."
 UKR_arbiter_idea:0 "The President as Arbiter"
 UKR_arbiter_idea_desc:0 "Nobody wins completely, nobody leaves completely. The rules serve the arbiter."
 UKR_final_soft_idea:0 "The Republic by Agreement"
 UKR_final_soft_idea_desc:0 "Formally a republic, in fact a club with quotas and unwritten rules. Stable and well fed for the club's members."
 UKR_final_open_idea:0 "The Corporate State"
 UKR_final_open_idea_desc:0 "A vertical of orders, key indicators and internal investigations for the dissenting. Fast, strong and resting on the word of those at the top."
 UKR_const_term_idea:0 "Elections After Stabilisation"
 UKR_const_term_idea_desc:0 "The election date is not named: when stabilisation arrives is decided by the one who announced it."
 UKR_const_vertical_idea:0 "A Single Vertical of Power"
 UKR_const_vertical_idea_desc:0 "The government answers to the president, the regions to the government. The chain is short, like patience."
 UKR_const_rada_idea:0 "The Rada Under New Rules"
 UKR_const_rada_idea_desc:0 "Closed lists and a high threshold: small parties vanish from the chamber, and their voters from the forecasts."
 UKR_const_court_idea:0 "A New Way of Forming the Courts"
 UKR_const_court_idea_desc:0 "The court and the High Council of Justice are formed differently. Opinions are predictable and signed on time."
 UKR_ngo_law_idea:0 "The Public Funding Law"
 UKR_ngo_law_idea_desc:0 "NGOs and media report their income and sources. Transparency is distributed unevenly."
 UKR_referendum_idea:0 "The People's Mandate"
 UKR_referendum_idea_desc:0 "The amendments are confirmed by referendum. To object now is to object to the people."
 UKR_vp_procurement_boost:0 "Accelerated Procurement"
 UKR_vp_procurement_boost_desc:0 "The contracts were signed quickly and deliveries are under way. The documents will be checked later."
 UKR_vp_quota_boost:0 "Posts Quota"
 UKR_vp_quota_boost_desc:0 "Our own people in the right posts speed up decisions."
 UKR_vp_marathon_boost:0 "Marathon on All Channels"
 UKR_vp_marathon_boost_desc:0 "One picture of the day on every screen."
 UKR_vp_requisition_boost:0 "Requisitioned Capacity"
 UKR_vp_requisition_boost_desc:0 "The plants work for defence by order. The owners remember whose order it was."
 UKR_vp_handouts_idea:0 "Presidential Payments"
 UKR_vp_handouts_idea_desc:0 "The money has been paid, the queues are quieter. In a month you will have to pay again."
 UKR_vp_tariff_freeze_idea:0 "Tariff Freeze"
 UKR_vp_tariff_freeze_idea_desc:0 "The bills have not risen. The difference is made up by those who promised not to complain."
 UKR_clans_grumble:0 "The Clans Grumble"
 UKR_clans_grumble_desc:0 "Clan loyalty is below normal: polite letters become less polite."
 UKR_clan_met_opposition:0 "Metals and Energy in Opposition"
 UKR_clan_met_opposition_desc:0 "Plants and power stations work strictly to the contract and not a minute beyond it."
 UKR_clan_priv_opposition:0 "Privat in Opposition"
 UKR_clan_priv_opposition_desc:0 "The airwaves and the banks remembered that they have an opinion of their own."
 UKR_clan_gas_opposition:0 "Gas and Chemicals in Opposition"
 UKR_clan_gas_opposition_desc:0 "Gas and fertiliser prices are being 'clarified' to the state's disadvantage."
 UKR_clan_sec_opposition:0 "The Security Circle in Opposition"
 UKR_clan_sec_opposition_desc:0 "Orders are carried out, but late and without initiative."
 ukraine_politics.616.t:0 "The Metals and Energy People Set Terms"
 ukraine_politics.616.d:0 "DTEK is in no hurry to sign a long-term contract for coal deliveries to state power plants until the tariff formula is revised, and Metinvest reminds everyone that export quotas are also negotiable. A representative of Rinat Akhmetov's group politely explains at the Office that this is not an ultimatum but 'parameters of cooperation'.\n\nThe meaning is clear to all: the clan believes it received less than it was promised at lunch. You can open a case and see how the market reacts, you can yield, or you can pretend the letter never arrived."
 ukraine_politics.616.a:0 "Open a case: the tax service and the NSDC are ready."
 ukraine_politics.616.b:0 "Yield: revise the tariff."
 ukraine_politics.616.c:0 "Pretend the letter never arrived."
 ukraine_politics.617.t:0 "Privat's Evening Broadcast"
 ukraine_politics.617.d:0 "1+1 puts a programme on ministry procurement into its evening schedule, while Ukrnafta postpones part of its dividend payments, citing an unresolved dispute with the state. Ihor Kolomoisky's man at the Office assures everyone that the channel's editorial policy does not depend on the owner, and the payment schedule depends on the court.\n\nThe coincidence of two decisions on the same day convinces nobody. Privat is testing how much the state needs its airtime and its oil."
 ukraine_politics.617.a:0 "Open a case: audit both the holding and Ukrnafta."
 ukraine_politics.617.b:0 "Yield: agree on airtime and dividends."
 ukraine_politics.617.c:0 "Pretend it is a coincidence."
 ukraine_politics.618.t:0 "Winter and the Regional Gas Companies"
 ukraine_politics.618.d:0 "The regional gas companies remind everyone of consumers' debts and ask for a revision of the gas distribution price, while Ostchem postpones fertiliser shipments to farmers until the export terms are clarified. A representative of Dmytro Firtash recalls that Firtash himself has lived in Vienna since 2014, but his companies work in every regional centre.\n\nWinter is near, the sowing season nearer still. The clan is testing who in this arrangement depends on whom."
 ukraine_politics.618.a:0 "Open a case: audit the licences and tariffs."
 ukraine_politics.618.b:0 "Yield: revise the distribution price."
 ukraine_politics.618.c:0 "Pretend the winter will pass."
 ukraine_politics.619.t:0 "A Dispute Over Appointments"
 ukraine_politics.619.d:0 "The heads of the National Guard and the SBU argue over whose people will get prosecutorial and regional posts, and both sides cite personal promises made at the lunch at the Office. The dispute has not left the offices yet, but personnel orders are stuck awaiting a signature, and the regions have learned to wait for instructions so as not to make mistakes.\n\nThe security circle knows how to take offence quietly and very precisely. The question is which of its commanders will be the first to decide that the promises were not enough."
 ukraine_politics.619.a:0 "Open a case: rotation and audits."
 ukraine_politics.619.b:0 "Yield: sign both lists."
 ukraine_politics.619.c:0 "Pretend it is a technical dispute."
 ukraine_politics.621.t:0 "The Constitutional Commission"
 ukraine_politics.621.d_office:0 "A working group on 'improving the Basic Law' meets in a closed hall of the Office. Lawyers lay out the 1996 Constitution article by article: where it is 'outdated', where it 'needs clarification', where it 'gets in the way'. The chairman of the group insists it is about wartime: unity of command, resilience, fewer vetoes.\n\nThe question is not what to change but how to present it. The working group can work quietly, invite the Venice Commission or sit behind closed doors."
 ukraine_politics.621.d_stefanchuk:0 "A working group on 'improving the Basic Law' meets in a closed hall of the Office. The group is chaired by Ruslan Stefanchuk himself, a lawyer who can present any amendment as if it had always existed. He lays out the 1996 Constitution article by article: where it is 'outdated', where it 'needs clarification', where it 'gets in the way', and insists it is about wartime: unity of command, resilience, fewer vetoes.\n\nThe question is not what to change but how to present it. The working group can work quietly, invite the Venice Commission or sit behind closed doors."
 ukraine_politics.621.a:0 "A working group of lawyers: quietly."
 ukraine_politics.621.b:0 "Public discussion, the Venice Commission invited."
 ukraine_politics.621.c:0 "A closed session."
 ukraine_politics.622.t:0 "The Vote in the Rada"
 ukraine_politics.622.d:0 "The first amendment goes to the floor. Servant of the People has enough votes on paper, but in practice a few deputies need to explain something to their voters, and a few clans need it not to be explained. The Speaker asks for a recess.\n\nYou can spend political power and obligations on the missing votes, or pass the law with a minimal margin and then spend a long time explaining why it passed 'on the second attempt'."
 ukraine_politics.622.a:0 "Buy the missing votes."
 ukraine_politics.622.b:0 "Pass it with a minimal margin."
 ukraine_politics.623.t:0 "The Constitutional Court's Opinion"
 ukraine_politics.623.d:0 "The Constitutional Court has received the request and is preparing an opinion. The judges, appointed under the new rules, are in no hurry and do not argue: the opinion will match the request, the only question is the wording. The Venice Commission offers to send observers.\n\nAccepting the opinion as it stands is cheap and quick. Inviting the Venice Commission costs more, but looks different."
 ukraine_politics.623.a:0 "Accept the opinion."
 ukraine_politics.623.b:0 "Request the Venice Commission's opinion."
 ukraine_politics.624.t:0 "The Referendum"
 ukraine_politics.624.d_passed:0 "The polling stations have closed, turnout by official figures was a little over half, and almost two-thirds voted 'for'. State television calls the result 'the choice of the people', the opposition calls the figures 'too even', and observers wait for the protocols.\n\nThe amendments come into force. It remains to get used to the fact that they now exist not only on paper."
 ukraine_politics.624.d_failed:0 "Turnout fell below the threshold, and more voted 'against' than the Office expected. The TV channels are still looking for a formulation, but the streets have already found theirs. Lawyers explain that no amendment will survive without a rollback of the neighbouring articles.\n\nThe price of the lesson will be high: not only political power, but the sense that the system is not omnipotent."
 ukraine_politics.624.a:0 "Accept the results."
 ukraine_politics.624.b:0 "Admit the failure."
 ukraine_politics.625.t:0 "The Referendum Collapses"
 ukraine_politics.625.d:0 "The opposition demands a recount, the clans quietly remind everyone that they never promised to vote for failure, and Venice prepares a sceptical opinion. The Office rolls back the amendments it was calling historic only yesterday.\n\nThe reform is not cancelled, it is postponed. What counts as temporary is decided by the one who can wait."
 ukraine_politics.625.a:0 "Roll back the amendments."

# ===== Путь олигархов и вертикали, шаг 3 (PROPOSAL_oligarchs.md) =====
 UKR_ol_paper_real_tt:0 "Part of the 'paper' growth is realised as a loss: industry and military development fall slightly."
 UKR_ol_claim_down_tt:0 "The clan's claims fall."
 UKR_ol_claim_up_tt:0 "The clan's claims grow."
 UKR_ol_claims_all_up_tt:0 "The claims of all four clans grow."
 ukraine_politics.610.t:0 "The Telethon: Ratings"
 ukraine_politics.610.d:0 "The unified marathon has been running for a month, and the rating agencies send in their figures. Many watch, fewer trust, and people switch channels more often than before, although there is, in essence, nowhere to switch to: the same presenter in different ties is on every screen. The editors suggest diluting the schedule: adding weather, sport and a TV series.\n\nIt can be decided in different ways: add entertainment, leave the marathon as it is, or give the editors the right to decide for themselves what goes on air."
 ukraine_politics.610.a:0 "Dilute it: weather, sport, a series."
 ukraine_politics.610.b:0 "Leave it as it is."
 ukraine_politics.610.c:0 "Leave the decision to the editors."
 ukraine_politics.611.t:0 "The Procurement Ripens"
 ukraine_politics.611.d:0 "Investigative journalists publish a comparison: in three months one agency bought a batch of supplies from one supplier at three times the market price. The supplier is listed as a 'trusted contractor', the contract was signed in a day, and the documents are in an open register because somebody forgot to close a tab. The meme about eggs at 17 hryvnias returns online.\n\nThe Office asks everyone not to blow it up: the orders were fulfilled, the army got what it needed. But the army did not get everything listed in the report, and the report is now being read by the whole country."
 ukraine_politics.611.a:0 "Dismiss a deputy and recalculate the contracts."
 ukraine_politics.611.b:0 "Call the publication a hit job."
 ukraine_politics.611.c:0 "Order a full audit."
 ukraine_politics.612.t:0 "The Bill: Metals and Energy"
 ukraine_politics.612.d:0 "The letter came by registered post, with a notice of delivery and an annex: a list of promises made over the year and a list of those fulfilled. The first is longer. The metals and energy people politely state that they are ready to wait, but not forever, and that the next tariff formula will be drawn up with the debts in mind.\n\nA 60-day mission has started: if the clan's claims do not fall below 70, it goes into opposition for half a year. You can settle at once, declare that there is no bill, or not reply."
 ukraine_politics.612.a:0 "Settle: yield."
 ukraine_politics.612.b:0 "Say that there is no bill."
 ukraine_politics.612.c:0 "Do not reply."
 ukraine_politics.613.t:0 "The Bill: Privat"
 ukraine_politics.613.d:0 "The bill arrives not as a letter but as a morning broadcast: a 1+1 presenter reads out 'viewers' questions' about the authorities' fulfilment of promises, and the questions suspiciously match the list that Privat handed to the Office last week.\n\nA 60-day mission has started: if the clan's claims do not fall below 70, it goes into opposition for half a year. You can settle at once, declare that there is no bill, or not reply."
 ukraine_politics.613.a:0 "Settle: yield."
 ukraine_politics.613.b:0 "Say that there is no bill."
 ukraine_politics.613.c:0 "Do not reply."
 ukraine_politics.614.t:0 "The Bill: Gas and Chemicals"
 ukraine_politics.614.d:0 "The bill arrives from Vienna as a polite lawyers' letter in which the word 'extradition' appears once and the word 'licences' eight times. Gas and Chemicals remind you that they have long-term obligations, and that winter and the sowing season will not wait.\n\nA 60-day mission has started: if the clan's claims do not fall below 70, it goes into opposition for half a year. You can settle at once, declare that there is no bill, or not reply."
 ukraine_politics.614.a:0 "Settle: yield."
 ukraine_politics.614.b:0 "Say that there is no bill."
 ukraine_politics.614.c:0 "Do not reply."
 ukraine_politics.615.t:0 "The Bill: The Security Circle"
 ukraine_politics.615.d:0 "The bill is presented not by letter but by a pause: orders are signed later than usual, inspections in the regions go more slowly, and in the chiefs' offices they increasingly remember who promised what.\n\nA 60-day mission has started: if the security circle's claims do not fall below 70, it goes into opposition for half a year. You can settle at once, declare that there is no bill, or not reply."
 ukraine_politics.615.a:0 "Settle: yield."
 ukraine_politics.615.b:0 "Say that there is no bill."
 ukraine_politics.615.c:0 "Do not reply."
 ukraine_politics.630.t:0 "The Platform in the Rada"
 ukraine_politics.630.d:0 "The Opposition Platform - For Life faction sounds noticeably louder in the Rada. Its deputies do not argue with the Office's decisions on the merits, they ask one and the same question: what will happen when the vertical ends? The chamber laughs less than last year, and some in Servant of the People already answer that question in a whisper.\n\nSociologists note a strange thing: the more often the authorities settle matters without parliament, the more willingly part of the electorate listens to those who promise 'life without the vertical'. What to do about it is for you to decide."
 ukraine_politics.630.a:0 "Pay no attention."
 ukraine_politics.630.b:0 "Order SBU checks."
 ukraine_politics.630.c:0 "Invite them to consultations."
 ukraine_politics.631.t:0 "Dialogue with Moscow"
 ukraine_politics.631.d:0 "The leader of the platform proposes to 'resume direct dialogue with Moscow before it is too late'. The wording is soft: trade, passports, humanitarian issues. Not a word about the vertical, but it is clear from the chamber that the vertical is the main argument: the fewer the institutions, the easier it is to persuade people that agreements can only be made at the top.\n\nYou can call the proposal a 'party of capitulation', stage a public debate, or simply switch off the microphone."
 ukraine_politics.631.a:0 "Call it a party of capitulation."
 ukraine_politics.631.b:0 "Stage a public debate."
 ukraine_politics.631.c:0 "Switch off the microphone."
 ukraine_politics.632.t:0 "The Peace Party"
 ukraine_politics.632.d:0 "Stickers saying 'Life Matters More' with the platform's discreet logo appear in the streets. The supporters are few, but they talk to those who are tired: to mothers who get no answer from the enlistment office, to workers whose deferment turned out not to be on the list, to residents of front-line towns where the electricity is running out. The vertical answers with what it has: airtime and inspections.\n\nThere is no point pretending that the fatigue is unrelated to how decisions are made. But nobody is obliged to draw conclusions from it."
 ukraine_politics.632.a:0 "Answer with a social package."
 ukraine_politics.632.b:0 "Answer with airtime and inspections."
 ukraine_politics.632.c:0 "Hold meetings with the families."
 ukraine_politics.633.t:0 "Whom the Street Hears"
 ukraine_politics.633.d:0 "A new wave of polls shows a curious picture: people are neutral towards the vertical, hostile towards the clans, and cautiously well disposed towards the platform, because it is the only one that speaks to the voter about his own life rather than about growth figures. The pollsters clarify that this is not support but 'a demand for an alternative'.\n\nYou can pre-empt it: commission your own polls, take over the rhetoric, or hide the data."
 ukraine_politics.633.a:0 "Commission your own polls."
 ukraine_politics.633.b:0 "Take over the rhetoric: talk about people's lives."
 ukraine_politics.633.c:0 "Hide the data."
 ukraine_politics.634.t:0 "Talks Behind Your Back"
 ukraine_politics.634.d:0 "The SBU reports: people from the platform's circle held talks in a third country with emissaries from Moscow. Formally the subject was humanitarian issues, but the make-up of the meeting does not look like a humanitarian mission. It also reports that the talks took place with the knowledge of some people from the clan circle who are dissatisfied with the vertical.\n\nYou can arrest, you can use it as leverage, or you can pretend there was no report: a vertical that created such an opposition has no right to be surprised."
 ukraine_politics.634.a:0 "Arrest the participants."
 ukraine_politics.634.b:0 "Use it as leverage."
 ukraine_politics.634.c:0 "Pretend not to have noticed."
 ukraine_politics.640.t:0 "Red Directors and the First Party of Power"
 ukraine_politics.640.d:0 "The Ukrainian vertical was not invented yesterday. In the 1990s President Leonid Kuchma relied on the 'red directors', regional barons and bankers who turned state enterprises into private ones. The Dnipropetrovsk and Donetsk clans got their fiefs and their politicians. Each side gave the other what it lacked: loyalty and resources.\n\nThe story is known: the clans proved stronger than the institutions and outlived the change of regime, because nobody took their plants away. Such a vertical works while the centre is stronger than the clans, and it gets costlier every year."
 ukraine_politics.640.a:0 "Draw the conclusion: do not repeat it."
 ukraine_politics.640.b:0 "Draw the conclusion: note the technique."
 ukraine_politics.641.t:0 "The 2004 Amendments: Reform in a Package"
 ukraine_politics.641.d:0 "In December 2004, at the height of the Orange Revolution, the Rada adopted amendments that transferred part of the president's powers to parliament and the government. The amendments were a compromise: they were adopted together with the election law and the condition of a repeat runoff, in a single package. They came into force in 2006.\n\nThe lesson for today is simple: the rules of power are often changed at a moment of crisis, as a package, as part of a bargain, and then it takes a long time to explain that this was a constitutional decision."
 ukraine_politics.641.a:0 "Draw the conclusion: do not repeat it."
 ukraine_politics.641.b:0 "Draw the conclusion: note the technique."
 ukraine_politics.642.t:0 "The Constitutional Court Decision of 2010"
 ukraine_politics.642.d:0 "On 30 September 2010 the Constitutional Court declared the 2004 law unconstitutional and restored the 1996 Basic Law with its strong presidency. Formally it is the decision of judges appointed by the president, the Rada and the congress of judges. In fact it appeared when all the necessary signatures came together for it.\n\nThe decision restored the strong presidency without a referendum and without a vote in parliament. It was not a coup but an opinion: the court applied a procedural argument, and that proved sufficient. The precedent remains in the textbooks."
 ukraine_politics.642.a:0 "Draw the conclusion: do not repeat it."
 ukraine_politics.642.b:0 "Draw the conclusion: note the technique."
 ukraine_politics.643.t:0 "The Kharkiv Accords"
 ukraine_politics.643.d:0 "In April 2010 agreements were signed in Kharkiv: the stay of Russia's Black Sea Fleet in Crimea was extended by 25 years, and gas for Ukraine became cheaper by about a hundred dollars per thousand cubic metres. The Rada ratified the agreements within a few hours, amid a scuffle and smoke bombs.\n\nA lesson about the price of a deal: decisions that look profitable in the budget may prove expensive in sovereignty. Such deals suit a vertical: they can be adopted quickly."
 ukraine_politics.643.a:0 "Draw the conclusion: do not repeat it."
 ukraine_politics.643.b:0 "Draw the conclusion: note the technique."
 ukraine_politics.644.t:0 "The Tymoshenko Case"
 ukraine_politics.644.d:0 "On 11 October 2011 a court sentenced former prime minister Yulia Tymoshenko to seven years for abuse of power in concluding the 2009 gas contracts. In 2013 the European Court of Human Rights found that her arrest and detention had violated the Convention. She was released in February 2014.\n\nA lesson about selective justice: it works while it looks like justice. When it is visible that the case is being run against one person, it begins to work for that person."
 ukraine_politics.644.a:0 "Draw the conclusion: do not repeat it."
 ukraine_politics.644.b:0 "Draw the conclusion: note the technique."
 ukraine_politics.645.t:0 "Mezhyhirya"
 ukraine_politics.645.d:0 "In February 2014 journalists and activists entered the Mezhyhirya residence and saw what had previously only been guessed at: a private zoo, a collection of cars, a shooting range, a gallery and accounting documents by the stack. The residence was built up over years, and it was privatised before the eyes of the whole country.\n\nThe lesson is vivid: a vertical does not end while the chain holds. When the chain breaks, the accounts are carried out of the doors."
 ukraine_politics.645.a:0 "Draw the conclusion: do not repeat it."
 ukraine_politics.645.b:0 "Draw the conclusion: note the technique."
 ukraine_politics.646.t:0 "The Laws of 16 January"
 ukraine_politics.646.d:0 "On 16 January 2014 the Rada adopted a package of laws by a show of hands: on liability for 'extremism', on restrictions for NGOs and on a number of measures against mass protests. The laws were called 'dictatorial', and two weeks later most of them were repealed under pressure from the street.\n\nA lesson about tempo: a law adopted faster than society can read it is usually repealed faster than it was adopted."
 ukraine_politics.646.a:0 "Draw the conclusion: do not repeat it."
 ukraine_politics.646.b:0 "Draw the conclusion: note the technique."
 ukraine_politics.647.t:0 "Belarus, 1996"
 ukraine_politics.647.d:0 "In November 1996 a referendum took place in Belarus: President Alexander Lukashenko received the right to appoint part of the upper chamber and to dissolve parliament, and his term was extended. The old parliament was dissolved, the Constitutional Court was warned, the opposition did not recognise the results. Later, in the 2004 referendum, the ban on a third term was also lifted.\n\nA lesson about sequence: first 'clarification of powers', then 'stability', then terms. Each amendment looks natural, and in sum they create a different state."
 ukraine_politics.647.a:0 "Draw the conclusion: do not repeat it."
 ukraine_politics.647.b:0 "Draw the conclusion: note the technique."
 ukraine_politics.648.t:0 "Russia, 2020"
 ukraine_politics.648.d:0 "In July 2020 a nationwide vote on constitutional amendments took place in Russia, which reset the president's previous terms, entrenched the priority of national over international law and added several social commitments. The vote was on a package of more than two hundred changes, and the voting itself was stretched over a week.\n\nA lesson about packaging: popular amendments are added to a disputed one so that the question becomes awkward: to object is to oppose the whole package."
 ukraine_politics.648.a:0 "Draw the conclusion: do not repeat it."
 ukraine_politics.648.b:0 "Draw the conclusion: note the technique."
 ukraine_politics.649.t:0 "Kazakhstan, 2022"
 ukraine_politics.649.d:0 "In June 2022, after the January unrest, Kazakhstan held a referendum on constitutional amendments: they changed the balance between the president, the government and parliament, abolished a number of privileges and barred the president's relatives from holding some public posts. The amendments were presented as a step towards a 'New Kazakhstan'. Critics noted that the main levers remained with the president, and that the rules for the transfer of power were set by those who held it.\n\nA lesson about presentation: the dismantling of some institutions can be shown as the reform of others."
 ukraine_politics.649.a:0 "Draw the conclusion: do not repeat it."
 ukraine_politics.649.b:0 "Draw the conclusion: note the technique."
 ukraine_politics.650.t:0 "The Year in Review"
 ukraine_politics.650.d:0 "A year has passed since the latest milestone of the vertical, and the Office's analysts have brought a summary. Growth is visible: the plants are working, orders are being fulfilled, output reports are getting thicker. Something else is visible too: in the cities people wait longer to see a doctor, the universities have fewer postgraduates, and the trade unions are acquiring people who were not seen there before.\n\nThe figures can be read in different ways. Some see growth and order, others see that growth is going its own way, apart from the people.\n\n§YShowcase:§!\nIndustry: §Y[?industrial_development_var|2]§! ([?UKR_ol_d_ind|2]) - [UKR_OL_TREND_IND]\nMilitary: §Y[?military_development_var|2]§! ([?UKR_ol_d_mil|2]) - [UKR_OL_TREND_MIL]\nFarming: §Y[?farming_development_var|2]§! ([?UKR_ol_d_farm|2]) - [UKR_OL_TREND_FARM]\n\n§YBasement:§!\nSociety: §Y[?society_development_var|2]§! ([?UKR_ol_d_soc|2]) - [UKR_OL_TREND_SOC]\nPoverty protection: §Y[?poverty_development_var|2]§! ([?UKR_ol_d_pov|2]) - [UKR_OL_TREND_POV]\nScience: §Y[?academic_development_var|2]§! ([?UKR_ol_d_acad|2]) - [UKR_OL_TREND_ACAD]\n\nClan loyalty: §Y[?UKR_ol_loyalty|0]§! - [UKR_OL_LOYALTY_WORD]\n\nThe decision is yours: carry on, turn the wheel or face the truth."
 ukraine_politics.650.a:0 "Carry on."
 ukraine_politics.650.b:0 "Turn the wheel: invest in poverty protection."
 ukraine_politics.650.c:0 "Turn the wheel: invest in society and science."
 ukraine_politics.650.e:0 "Face the truth: an audit of the indicators."
 ukraine_politics.651.t:0 "The Fifth Hour of the Marathon"
 ukraine_politics.651.d:0 "By the end of the fourth hour of the unified marathon the presenters had run out of topics and moved on to discussing the weather in various regions. By the end of the fifth they were discussing why the weather did not match the forecast. Viewers began sending comments, and the editors began reading them out, because there was nothing else to read.\n\nThe marathon has unexpectedly gained popularity as a genre: it is retold in memes. Accept it as a given, or ask the editors to bring back at least some variety?"
 ukraine_politics.651.a:0 "Accept it as a given."
 ukraine_politics.651.b:0 "Bring back variety."
 ukraine_politics.652.t:0 "The Acting Official"
 ukraine_politics.652.d:0 "By the end of the quarter, three of the five ministries have only 'acting' heads left. They sign papers with the prefix 'acting', carry business cards with a pencilled note and wait for a call every evening. Work goes on, documents are signed, but nobody remembers who is responsible for what, and the agencies have begun holding meetings 'just in case' with both contenders present.\n\nThe carousel works well while it turns. When it stops, it turns out there are fewer chairs than people."
 ukraine_politics.652.a:0 "Confirm the acting officials in post."
 ukraine_politics.652.b:0 "Keep the carousel turning."
 ukraine_politics.653.t:0 "The Lists"
 ukraine_politics.653.d:0 "The lists of specialists eligible for deferment grow faster than the number of specialists themselves. Posts such as 'consultant on consultations' and 'deputy head of the strategic planning section of the planning department' have appeared on the lists. Every personnel officer knows that any item can be challenged, and every boss knows that it is better not to.\n\nYou can tidy up the wording, cut the lists, or leave everything as it is: the lists are read carefully, but in different ways."
 ukraine_politics.653.a:0 "Tidy up the wording."
 ukraine_politics.653.b:0 "Cut the lists."
 ukraine_politics.653.c:0 "Leave it as it is."
 ukraine_politics.654.t:0 "The Sole Supplier"
 ukraine_politics.654.d:0 "Auditors have found in the tender register a purchase of forty thousand identical pens from a sole supplier who won a competition in which he was the only participant. The supplier really does make pens; he also makes body armour, repairs bridges and services the ministerial car pool.\n\nIngenuity does not deserve contempt, but it has to be checked: otherwise the reports become the only production that nobody controls."
 ukraine_politics.654.a:0 "Check all the 'sole' suppliers."
 ukraine_politics.654.b:0 "Leave it without consequences."
 ukraine_politics.655.t:0 "The Seven O'Clock Meeting"
 ukraine_politics.655.d:0 "Meetings at the Office are set for seven in the morning so that the ministers understand who starts the day first. It turned out that a vertical, unlike a horizontal, tolerates early rising badly: two ministers were late, one fell asleep, and the Office secretary suggested adding a clause on coffee to the regulations.\n\nThe coffee was added. Now the meetings last forty minutes longer, and decisions are taken ten minutes earlier."
 ukraine_politics.655.a:0 "Move it to nine."
 ukraine_politics.655.b:0 "Keep it at seven."
 ukraine_politics.660.t:0 "A Working Visit to Kryvyi Rih"
 ukraine_politics.660.d:0 "A working trip to Kryvyi Rih ends with a tour of a new rolling line: handsome shops, level stacks, very clean helmets. The director talks about plans and how important it is not to change the rules of the game in mid-season. At the end you are handed a folder with a list of requests, drafted so politely that a refusal of any of them would look tactless.\n\nThe Metals and Energy clan shows that it can be hospitable and persistent at the same time."
 ukraine_politics.660.a:0 "Take the folder and promise."
 ukraine_politics.660.b:0 "Return the folder unopened."
 ukraine_politics.660.c:0 "Pass the folder to the ministers."
 ukraine_politics.661.t:0 "An Evening on 1+1"
 ukraine_politics.661.d:0 "You are invited to the recording of an evening programme. The presenter asks questions as though he knew the answers in advance, then falls silent and waits for you to say them. A familiar lawyer from Privat sits in the audience, taking notes.\n\nBy the end of the broadcast it is clear that the format has changed: it is no longer for the viewers but so that everyone can see how you answer."
 ukraine_politics.661.a:0 "Answer as expected."
 ukraine_politics.661.b:0 "Answer your own way."
 ukraine_politics.661.c:0 "Decline the recording."
 ukraine_politics.662.t:0 "A Letter from Vienna"
 ukraine_politics.662.d:0 "Dmytro Firtash's lawyers report that the proceedings on his extradition to the United States are 'developing in a positive direction', and in an annex remind you of the licences promised at the lunch at the Office. The letter is drafted so that the two sentences look like chance neighbours.\n\nGas and Chemicals know how to wait, but do not like being kept waiting."
 ukraine_politics.662.a:0 "Reply: the matter is in hand."
 ukraine_politics.662.b:0 "Do not reply."
 ukraine_politics.662.c:0 "Reply sharply."
 ukraine_politics.663.t:0 "Dinner with the Commanders"
 ukraine_politics.663.d:0 "The dinner with the commanders of the security agencies is informal. The toasts are long, the handshakes firm, and conversations about personnel are held in low voices. At some point one of those present gently remarks that the system rests on people who are trusted, and everyone understands what he is getting at.\n\nThe security circle reminds you that a vertical rests not only on orders."
 ukraine_politics.663.a:0 "Raise a toast to loyalty."
 ukraine_politics.663.b:0 "Steer the talk to reforms."
 ukraine_politics.663.c:0 "Leave early."
 ukraine_politics.680.t:0 "The Warehouses Turned Out to Be Empty"
 ukraine_politics.680.d:0 "The inventory of warehouses in the first weeks of the war yields an unpleasant result: some of the items listed in the reports exist only in the reports. Somewhere ammunition is short, somewhere uniforms, and one warehouse reported six thousand items until an inspection found two hundred. The causes differ: write-offs 'on demand', accounting errors, somebody's careful decisions.\n\nIt is necessary to buy urgently and to look for the culprits urgently, and these two tasks get in each other's way."
 ukraine_politics.680.a:0 "Buy urgently, investigate later."
 ukraine_politics.680.b:0 "Find and punish the culprits."
 ukraine_politics.680.c:0 "Classify the results."
 ukraine_politics.681.t:0 "The Fall of the Inner Circle"
 ukraine_politics.681.d:0 "One of the key people of the inner circle, responsible for supply and relations with contractors, stops answering calls. Various reasons are given: illness, a quarrel, an offer from the other side. The result is the same: a chain of decisions that rested on one person worked with a delay.\n\nA vertical is built so that the faster it is, the more painful each failure. Centralised will is good while it has executors."
 ukraine_politics.681.a:0 "Appoint an urgent replacement."
 ukraine_politics.681.b:0 "Take over the management yourself."
 ukraine_politics.681.c:0 "Spread the functions among the clans."
 ukraine_politics.682.t:0 "Supply Through Our Own People"
 ukraine_politics.682.d:0 "An urgent order for front-line needs was fulfilled in nine days: a contractor from the inner circle raised the warehouses, found transport and delivered the cargo on time. The commanders in the combat zone are pleased, and the auditors are silent for now: in such moments the bills usually come later.\n\nThe vertical shows what it was built for: speed. It remains to decide how to regard the price, which is entered in another book."
 ukraine_politics.682.a:0 "Reward the contractors."
 ukraine_politics.682.b:0 "Take it for granted."
 ukraine_politics.690.t:0 "The State Held Captive"
 ukraine_politics.690.d:0 "The clans have stopped being petitioners: they dictate the order of appointments, the timing of payments and the priorities of procurement, while the Office approves what has already been decided. The president remains president, but each of his decrees is first read by those it affects. At meetings in the Office the word 'balance' is repeated more and more often, a word that once meant something quite different.\n\nThis is not a catastrophe while you pay. But you will have to pay more and more, and decide less and less."
 ukraine_politics.690.a:0 "Buy them off: pay the debts."
 ukraine_politics.690.b:0 "Split the clans."
 ukraine_politics.690.c:0 "Resign yourself."
 ukraine_politics.691.t:0 "The Revolt of the Elites"
 ukraine_politics.691.d:0 "The clans have realised that the vertical leaves them no place, and for the first time they speak with one voice. The groups of Akhmetov, Kolomoisky and Firtash are used to competing, but their lawyers now exchange letters. The security circle pretends that nothing is happening, and that is the most alarming thing. In closed chats they discuss not whether something will happen, but when exactly.\n\nA vertical is good as long as it is not opposed by everyone at once. Now you have a choice: suppress, retreat or declare a state of emergency."
 ukraine_politics.691.a:0 "Suppress: pressure on all the clans."
 ukraine_politics.691.b:0 "Retreat."
 ukraine_politics.691.c:0 "Declare a state of emergency."
 ukraine_politics.695.t:0 "Portrait of the Country: The Republic by Agreement"
 ukraine_politics.695.d_showcase:0 "Enough time has passed to sum things up. The republic by agreement works: the clans know their quotas, the ministers their terms, the figures in the reports match the figures in the warehouses, at least in the part that has been checked. The country looks calmer than a year ago, and this calm is not only on screen. The club is pleased with itself.\n\nThe price is known: one joins the club by invitation and leaves it only together with the others. It is a stable order, and while it is stable it holds."
 ukraine_politics.695.d_cracks:0 "The republic by agreement works, but the cracks are already visible. Some of the figures in the showcase exist only in the reports, some clans are beginning to count their quotas anew, and people outside the club are told that their time has not yet come. The system holds because nobody has yet decided to test its strength.\n\nSuch a state may last for years, or may end with a single awkward question."
 ukraine_politics.695.d_breach:0 "The republic by agreement has kept its outward form, but the basement could not take it. Poverty protection and society have fallen to a level at which polite explanations stop working: queues, delayed payments, closed institutions. The club still meets for lunches, but outside the hall it can already be heard.\n\nThis is not a catastrophe, it is an agenda. It has either to be closed or to stop being called order."
 ukraine_politics.695.a:0 "Consolidate what has been achieved."
 ukraine_politics.695.b:0 "Accept it as it is."
 ukraine_politics.695.c:0 "Carry out a review of the showcase."
 ukraine_politics.695.e:0 "Deal with the basement."
 ukraine_politics.695.f:0 "Close the subject."
 ukraine_politics.696.t:0 "Portrait of the Country: The Corporate State"
 ukraine_politics.696.d_showcase:0 "The corporate state shows results: the vertical of orders delivers indicators confirmed by inspections that also answer to the vertical. Industry is growing, the army receives what it ordered, public sentiment is neatly fitted to the reporting. Those who doubted have fallen silent. Those who have not fallen silent do not complain about the conditions.\n\nThis is efficient while there is somebody at the top to take decisions and while those at the top understand what they are doing."
 ukraine_politics.696.d_cracks:0 "The indicators are growing, but not all of them: some construction sites stand idle because the contractor was not paid, some plants have reported output that cannot be verified, and in the regions people ask more and more often where the money went. The vertical answers in the only way it has: with another vertical.\n\nThe system holds as long as it is faster than the accumulation of grievances."
 ukraine_politics.696.d_breach:0 "The vertical withstood the load in the plants but not in the cities. Poverty protection and society have fallen so low that the reports have stopped being convincing. The dissatisfied no longer ask but demand, and those who used to be silent speak aloud. A forceful solution is possible, but it will confirm everything they warned about.\n\nThe consequences depend on you: either you change course or you increase the pressure."
 ukraine_politics.696.a:0 "Consolidate what has been achieved."
 ukraine_politics.696.b:0 "Accept it as it is."
 ukraine_politics.696.c:0 "Carry out a review of the showcase."
 ukraine_politics.696.e:0 "Deal with the basement."
 ukraine_politics.696.f:0 "Increase the pressure."
 ukraine_politics.697.t:0 "The Street in the Basement"
 ukraine_politics.697.d:0 "The discontent the figures warned about takes to the streets: queues at the social security office, heating cut-offs, delayed wages. The rallies are joined even by those you considered loyal. The slogans are simple, and the main one concerns not your achievements but your entourage.\n\nYou can agree on compensation or show that the street does not decide. The second is cheaper today and dearer on any other day."
 ukraine_politics.697.a:0 "Agree: compensation."
 ukraine_politics.697.b:0 "Show who decides."

# ===== Путь олигархов, шаг 3: духи последствий =====
 UKR_ol_scandal_aftermath:0 "The Procurement Scandal"
 UKR_ol_scandal_aftermath_desc:0 "The publications about procurement ate into trust in the Office and part of its political power. The egg meme is back."
 UKR_ol_empty_depots:0 "Empty Warehouses"
 UKR_ol_empty_depots_desc:0 "Some of the warehouses exist only in the reports. The army and industry compensate with urgent purchases."
 UKR_ol_fragile_circle:0 "The Fragile Inner Circle"
 UKR_ol_fragile_circle_desc:0 "The chain of decisions rested on one person. A break in it costs the vertical dearly."
 UKR_ol_portrait_showcase:0 "The Showcase Holds"
 UKR_ol_portrait_showcase_desc:0 "The order looks solid and is confirmed by figures that nobody has yet challenged."
 UKR_ol_portrait_cracks:0 "Cracks in the Showcase"
 UKR_ol_portrait_cracks_desc:0 "The system works, but part of the figures exist only in the reports. One awkward question is enough."
 UKR_ol_portrait_breach:0 "The Basement Is Flooded"
 UKR_ol_portrait_breach_desc:0 "The discontent has left the offices. Order rests on explanations nobody is listening to."

 ukrainewar.110.t:0 "Kyiv Liberated"
 ukrainewar.110.d:0 "The Armed Forces have retaken the capital. Sappers are still at work, some districts remain without power and water, but the government is returning to the city centre and the state flag again flies over the Verkhovna Rada. The loss of the capital left a mark on every family, and its return means more to the country than any other victory of this war."
 ukrainewar.110.a:0 "The capital is ours again."
 ukrainewar.111.t:0 "Kharkiv Liberated"
 ukrainewar.111.d:0 "Ukrainian troops entered Kharkiv from the east and north. Saltivka, the industrial zone and the tractor plant district are in ruins, but the city lives: aid convoys move along the streets and the metro takes passengers again. Evacuated residents of Kharkiv are beginning to return."
 ukrainewar.111.a:0 "Kharkiv is back."
 ukrainewar.112.t:0 "Sumy Liberated"
 ukrainewar.112.d:0 "After weeks of fighting on the north-eastern approaches, the enemy has been pushed back from Sumy. The city endured shelling and siege but did not surrender. Rubble is being cleared at hospitals and schools, and power crews are restoring the lines."
 ukrainewar.112.a:0 "Sumy is free."
 ukrainewar.113.t:0 "Chernihiv Liberated"
 ukrainewar.113.d:0 "Chernihiv, long cut off from the rest of the country, is again under Ukrainian control. The bridges over the Desna are being restored, and the ancient churches that survived the shelling are open to residents. The city is returning to peaceful life slowly but steadily."
 ukrainewar.113.a:0 "Chernihiv is Ukrainian again."
 ukrainewar.114.t:0 "Zaporizhzhia Liberated"
 ukrainewar.114.d:0 "Zaporizhzhia has been returned to Ukrainian control. The Dnieper dam and the city's industrial plants are again operating under the protection of Ukrainian units. Authorities are assessing the damage and preparing a plan to restore power generation and the factories."
 ukrainewar.114.a:0 "Zaporizhzhia is with us."
 ukrainewar.115.t:0 "Kherson Liberated"
 ukrainewar.115.d:0 "Kherson is again under the Ukrainian flag. Residents came out into the streets of a city that spent weeks without communications and food supplies. Ahead lie demining of the surrounding area, restoring the water supply and searching for the missing."
 ukrainewar.115.a:0 "Kherson is back."
 ukrainewar.116.t:0 "Dnipro Liberated"
 ukrainewar.116.d:0 "Dnipro, a major transport and industrial hub on the great river, has been returned to Ukrainian control. The bridges and rail lines critical to supplying the army are being restored first. For both front and rear this is the return of a strategically important city."
 ukrainewar.116.a:0 "Dnipro is ours again."
 ukrainewar.117.t:0 "Zhytomyr Liberated"
 ukrainewar.117.d:0 "Zhytomyr, an important junction on the western approaches to the capital, is again in Ukrainian hands. The rail hub and the roads to Kyiv are working again, and supply to the central regions is returning to normal."
 ukrainewar.117.a:0 "Zhytomyr is free."
 ukrainewar.118.t:0 "Odesa Liberated"
 ukrainewar.118.d:0 "Odesa has been returned to Ukrainian control. The ports and the coastal quarters have suffered, but the city has kept its character: many languages are heard in the streets again, and port services have begun clearing the waters. The return of the sea gateway is of great importance to the national economy."
 ukrainewar.118.a:0 "Odesa is back."
 ukrainewar.119.t:0 "Lviv Liberated"
 ukrainewar.119.d:0 "Lviv has been returned to Ukrainian control. The old town, the squares and the churches that survived the fighting are open to residents. The city that took in refugees from across the country and became a hub of aid is returning to its role as the rear capital."
 ukrainewar.119.a:0 "Lviv is back."
