 #Session 11: nationalist path, block 3, step 3 (Parubiy, nuclear question, humour, history)
 UKR_parubiy_face:0 "Andriy Parubiy"
 UKR_parubiy_face_desc:0 "The former Speaker of the Rada and one of the commanders of the Maidan self-defence becomes the face of the Republic of Service: he can reconcile national democrats with veterans and speak to Lviv and Brussels at the same time."
 UKR_parubiy_legacy:0 "Memory of Parubiy"
 UKR_parubiy_legacy_desc:0 "The killing in Lviv on August 30, 2025 united for a few weeks those who argued about everything else. His name stays in the programme as a reminder of the price of public life."
 UKR_hunt_on_activists:0 "A Hunt on Activists"
 UKR_hunt_on_activists_desc:0 "Attacks on public figures in different cities force people to live with guards and fear. The investigation into each case goes separately, versions differ, and trust in security falls."
 UKR_np_face_sadovyi:0 "Sadovyi: Face of the Programme"
 UKR_np_face_sadovyi_desc:0 "The mayor of Lviv becomes the face of the Republic of Service: an administrator and negotiator who wears no shoulder straps. Stronger in diplomacy and city affairs, weaker on the veterans' rostrum."
 UKR_np_face_sternenko:0 "Sternenko: Face of the Programme"
 UKR_np_face_sternenko_desc:0 "A volunteer and public figure becomes the face of the programme: liked by veterans and the street, disliked by the Office. Charisma is higher, manageability lower."
 UKR_np_face_council:0 "Veterans' Council: Collective Leadership"
 UKR_np_face_council_desc:0 "The programme has no single face: the council makes decisions. More stable, but harder to speak with one voice."
 UKR_nc_nuclear_question:0 "The Nuclear Question"
 UKR_nc_nuclear_question_desc:0 "A statement about an audit of remaining nuclear technologies and specialists, without building weapons. The decision opens only at high world tension and provokes a huge diplomatic response."
 UKR_np_world_tension_tt:0 "World tension is above §Y50%§!."
 UKR_np_nuclear_penalty_tt:0 "Partners §Rsharply condemn§! the statement: EU aid is frozen for three months."
 ukraine_politics.723.t:0 "A Hunt on Activists"
 ukraine_politics.723.d:0 "Since September public figures have been attacked in several cities, from Lviv to Odesa: activists, journalists, participants of civic movements. The investigation into each case goes its own way, but in chats and on talk shows one question is heard more and more: is it chance or a system. The version of a Russian trace sounds ever more confident in official statements, although the evidence in the open is thin so far.\n\nThe national groups react differently: veterans demand protection, right-wing activists accuse the authorities of inaction, and officials carefully ask not to draw conclusions before a verdict. The authorities can strengthen protection of public figures, declare that the investigation is under way, or use the moment to tighten measures."
 ukraine_politics.723.a:0 "Strengthen protection of public figures and look into each case."
 ukraine_politics.723.b:0 "Declare that the investigation is under way and do not rush conclusions."
 ukraine_politics.723.c:0 "Use the moment and tighten security measures."
 ukraine_politics.720.t:0 "Shots in Lviv"
 ukraine_politics.720.d:0 "On August 30 Andriy Parubiy, a former Speaker of the Rada and one of the commanders of the Maidan self-defence, is shot dead in Lviv. The news arrives during the day, by evening people with candles gather near his house, and the mayor of Lviv, Andriy Sadovyi, reports that the farewell will be held in the Cathedral of St. George and will end at the Lychakiv Cemetery. The investigation, according to reports, is considering a version of a Russian order, but it is too early to draw conclusions.\n\nThe country looks not at the investigation but at the authorities: mourning, protection, accusations. The groups of the convention react in their own way: national democrats lose one of their leaders, veterans demand decisive measures, and the street looks for the culprits itself. The president decides what the first response will be."
 ukraine_politics.720.a:0 "Declare national mourning and demand a swift investigation."
 ukraine_politics.720.b:0 "Strengthen protection of public figures and close vulnerabilities."
 ukraine_politics.720.c:0 "Publicly name the Russian trace as per the investigation and deliver a note."
 ukraine_politics.721.t:0 "Farewell in Lviv"
 ukraine_politics.721.d:0 "On September 2 in the Cathedral of St. George and at the Lychakiv Cemetery in Lviv people bid farewell to Andriy Parubiy. Veterans, politicians of different parties and townspeople come, many of whom never voted for his party. The organisers ask the president to decide how the ceremony will go: a state one, with a mourning march of veterans, or closed to the family.\n\nEach option speaks both of him and of those who come after. A state funeral makes him part of the common pantheon, a march of veterans and druzhynas turns the farewell into a show of strength, a closed ceremony leaves the family in quiet but deprives people of a chance to say goodbye."
 ukraine_politics.721.a:0 "A state funeral and mourning."
 ukraine_politics.721.b:0 "A mourning march of veterans and druzhynas."
 ukraine_politics.721.c:0 "A closed farewell with the family."
 ukraine_politics.722.t:0 "After Lviv"
 ukraine_politics.722.d:0 "After the funeral an empty place remains in the civic programme: Parubiy was the man who reconciled national democrats with veterans and could talk to both Brussels and Lviv. Now the groups name different names, and each believes that its own candidate will continue the work.\n\nSadovyi, the mayor of Lviv, the host of the city of farewell, knows how to govern and negotiate but wears no shoulder straps. Sternenko, a volunteer and public figure, is liked by veterans and the street but not by the Office. The Veterans' Council proposes not to choose one: collective leadership, though without personal ambitions."
 ukraine_politics.722.a:0 "Sadovyi: the mayor of Lviv becomes the face of the programme."
 ukraine_politics.722.b:0 "Sternenko: a volunteer and public figure."
 ukraine_politics.722.c:0 "The Veterans' Council: collective leadership."
 ukraine_politics.740.t:0 "The Nuclear Question"
 ukraine_politics.740.d:0 "World tension is rising, and in Kyiv people again recall the Budapest Memorandum of 1994: Ukraine gave up nuclear weapons in exchange for guarantees that today look more modest than they did then. The National Corps and Svoboda demand a return to the conversation about nuclear potential, commentators recall how much such a programme costs, and ambassadors are already preparing words of condemnation.\n\nIt is not about a bomb but about a statement: you can announce an audit of the remaining technologies and specialists, refer the question to an expert commission, or not answer at all. Any answer will be read in Washington, Brussels and Moscow, and each will understand it in its own way."
 ukraine_politics.740.a:0 "Announce an audit of the nuclear potential (without building weapons)."
 ukraine_politics.740.b:0 "Refer the question to an expert commission."
 ukraine_politics.740.c:0 "Do not answer the talk."
 ukraine_politics.750.t:0 "The Chat of the Real Nationalists"
 ukraine_politics.750.d:0 "In the closed chat of the Council of the Nation the fourth hour of a conversation is under way that began with the agenda and reached the question \"who is the real one\". Each group sends a list of criteria by which another turns out not real enough: veterans consider real those who served, right-wing activists those who did not sell out, ultras those who did not leave the stands, and national democrats remind everyone that without rules of procedure there are no real ones. Screenshots circulate online faster than the minutes.\n\nThe chair asks to move on to the budget. The budget is discussed for twenty minutes, after which they return to the question of the real ones."
 ukraine_politics.750.a:0 "Gather the leaders at one table and close the chat."
 ukraine_politics.750.b:0 "Let them argue: it shows the strong and the weak."
 ukraine_politics.750.c:0 "Leave all the chats and read the minutes."
 ukraine_politics.751.t:0 "A Vyshyvanka in a Beer Advert"
 ukraine_politics.751.d:0 "A well-known brewery releases an advert with an actor in a vyshyvanka, and the network splits into those who see normal modern culture in it and those who think a vyshyvanka is not for beer. Right-wing activists demand a standard, the left remind everyone that a vyshyvanka is also a product, and in the comments someone advises not to argue about what to wear at all. The brewery notes that the advert is discussed better than any talk show.\n\nIs a position of the state needed here? You can say that fashion is not a matter of law, propose a voluntary standard for \"embroidered advertising\", or laugh it off in the official account."
 ukraine_politics.751.a:0 "Fashion is not a matter of law: do not interfere."
 ukraine_politics.751.b:0 "Propose a voluntary standard for advertising."
 ukraine_politics.751.c:0 "Laugh it off in the official account."
 ukraine_politics.752.t:0 "A Leak from the Council of the Nation"
 ukraine_politics.752.d:0 "A week before a session of the Council of the Nation its agenda appears in several anonymous channels, and by evening a list of disputed items too. The channels differ on who is to blame: some write that the leak comes from agencies, others that it comes from the Council itself, still others that it comes from the chat where everyone is listed and nobody reads. Nobody has seen the originals, but quotes spread across the network.\n\nYou can look for the source, make the agenda open and take away the channels' reason, or pretend nothing happened. All three paths cost a lot, but in different ways."
 ukraine_politics.752.a:0 "Find the source of the leak."
 ukraine_politics.752.b:0 "Make the agenda open."
 ukraine_politics.752.c:0 "Do not react."
 ukraine_politics.753.t:0 "The Borscht War"
 ukraine_politics.753.d:0 "A Russian TV channel declares that borscht is a Russian dish and the Ukrainian one is its poor copy. The usual clash begins online: culinary bloggers, historians and officials write about the origin of the soup without digging too deep into the facts. One brewery releases \"borscht for two\", and a cook from Poltava publishes a recipe that collects a million views.\n\nThe question is formally culinary, but in this dispute each side defends its country. The authorities can answer with a note, a meme or a culinary festival."
 ukraine_politics.753.a:0 "Send a foreign ministry note: borscht is Ukrainian."
 ukraine_politics.753.b:0 "Answer with a meme."
 ukraine_politics.753.c:0 "Hold a borscht festival."
 ukraine_politics.754.t:0 "The Veteran Barista"
 ukraine_politics.754.d:0 "A coffee shop opens in Kyiv where veterans get a discount and everyone else gets a queue. The owner, a former sapper, jokes that the queue is the main dish, and online people already argue whether this is decent: some call the idea honest, others remind everyone that a citizen need not prove where he was. Within a week the coffee shop becomes better known than some ministries.\n\nThe authorities can fix such benefits with a veteran's card, leave the matter to business, or note that everyone drinks coffee and discounts are good as long as they do not turn into a border."
 ukraine_politics.754.a:0 "Introduce a veteran's card."
 ukraine_politics.754.b:0 "Leave the decision to business."
 ukraine_politics.754.c:0 "Remind everyone that discounts should not divide people."
 ukraine_politics.755.t:0 "A Match and a Column"
 ukraine_politics.755.d:0 "Before a match between two capital teams ultras form a column and walk through the city centre chanting slogans that an hour ago were a song and now are news. The police escort them at a distance, cafe owners close their windows, and the rivals' fans post a reply video with better editing. By evening the column is discussed more than the score.\n\nThe street reminds everyone of itself at a convenient time, and each time it is a test: who is stronger, the state or the stands. You can strengthen the police, agree with the clubs, or pretend it is sport."
 ukraine_politics.755.a:0 "Strengthen the police and discipline along the routes."
 ukraine_politics.755.b:0 "Agree with the clubs and the leaders of the stands."
 ukraine_politics.755.c:0 "Do not notice: it is sport."
 ukraine_politics.770.t:0 "Kruty, January 1918"
 ukraine_politics.770.d:0 "On January 29, 1918, near the station of Kruty near Nizhyn, young volunteers, students and schoolboys tried to delay the advance of Bolshevik detachments on Kyiv. How many there were and who died, historians still dispute: some sources say three hundred, others fewer, and in common memory the main thing remained: they went and did not turn back. Every year on this day candles are lit in universities and schools.\n\nFor the Council of the Nation this story is a lesson about the price of the words \"to the last\". It can be told as a story of the courage of the young or as a warning that they must not be sent without support."
 ukraine_politics.770.a:0 "Take note: Kruty in the school curriculum."
 ukraine_politics.771.t:0 "Kholodnyi Yar, 1919-1922"
 ukraine_politics.771.d:0 "In 1919-1922 an insurgent republic operated in the forests of Kholodnyi Yar near Cherkasy: detachments of local peasants and former officers fought against everyone who came to the village with foreign orders, whites and reds alike. They had no organised army, only forest, communication and local memory. After the defeat \"Kholodnyi Yar\" remains a word for persistence without hope of victory.\n\nThe story is discussed carefully in textbooks: many legends, few documents. For the path it reminds us that resistance has roots earlier than all the present slogans."
 ukraine_politics.771.a:0 "Take note: include it in the local history programme."
 ukraine_politics.772.t:0 "Stus, September 1985"
 ukraine_politics.772.d:0 "Vasyl Stus, a poet and human rights defender, died on September 4, 1985 in a camp in the Perm region: he was tried twice for poems and participation in the human rights movement. In Soviet times his books circulated in samizdat, and today schoolchildren read them, often without knowing how they ended up in KGB reports.\n\nThe memory of him needs no slogans. The question is how the state meets it: through the school curriculum, poetry evenings or quiet reading rooms."
 ukraine_politics.772.a:0 "Take note: poetry evenings in schools and libraries."
 ukraine_politics.773.t:0 "Rukh, 1989"
 ukraine_politics.773.d:0 "In September 1989 the founding congress of the People's Movement of Ukraine took place in Kyiv: former dissidents, writers, workers and students gathered in one hall for the first time under a blue-and-yellow flag that not long before had been punished for carrying. Viacheslav Chornovil, who spent many years in camps and exile, became one of the leaders of the new movement. Two years later the country gained an independence that includes their work.\n\nRukh later split and weakened, but the school of public politics it gave remains. For national democrats it is a foundation, for the others an example of how not to lose a common hall."
 ukraine_politics.773.a:0 "Take note: open an exhibition about Rukh."
 ukraine_politics.774.t:0 "Revolution on the Granite, October 1990"
 ukraine_politics.774.d:0 "At the start of October 1990 students in Kyiv put up tents on the October Revolution Square, today's Independence Square, and declare a hunger strike: they demand the resignation of the government, new elections and service only on the territory of Ukraine. Two weeks later the authorities give way, and the tents become the country's first street university of politics. Students are supported by workers and teachers, and the square remembers what peaceful pressure looks like.\n\nFor the Council of the Nation this is an example of a civic initiative without weapons. It can be used, remembering one thing: it won because young people stood behind it, not a security group."
 ukraine_politics.774.a:0 "Take note: invite students to the Council."
 ukraine_politics.775.t:0 "Revolution of Dignity, February 2014"
 ukraine_politics.775.d:0 "From November 2013 to February 2014 hundreds of thousands of people gather on the Maidan and in Kyiv: students, veterans, priests, entrepreneurs, football ultras and volunteers who raise and keep a camp overnight. In February more than a hundred people die, they are called the Heavenly Hundred, and the memory of them becomes the main common text of different groups who on other days argue about much.\n\nFor the Council of the Nation the Maidan is not the victory of one group but a common wound. That is why any programme that tries to appropriate it gets a question in reply, and a programme that simply reads the names meets silence and agreement."
 ukraine_politics.775.a:0 "Take note: the names on the Council's lists."
 ukraine_politics.781.t:0 "Volunteers Ask for Passports"
 ukraine_politics.781.d:0 "A queue forms at consulates: foreign volunteers whose contracts are ending ask for citizenship under the new law. Among the applicants are Georgians, Belarusians, Kazakhs and Poles; officials find it hard to decide where service ends and politics begins. The bureaucracy for the first time works faster than promised, and the queue grows.\n\nRight-wing chats ask whether this is too generous, and veterans remind everyone that a promise cannot be taken back. The authorities can accept all who met the conditions, introduce an additional check, or limit the number per year."
 ukraine_politics.781.a:0 "Issue passports to all who met the conditions."
 ukraine_politics.781.b:0 "Introduce an additional SBU check."
 ukraine_politics.781.c:0 "Limit the number of passports per year."
 ukraine_politics.782.t:0 "Budapest and the Language Law"
 ukraine_politics.782.d:0 "Budapest summons the ambassador and demands guarantees for schools with Hungarian as the language of instruction in Transcarpathia: in the Hungarian view, the new law violates the rights of the minority. In Kyiv they answer that the schools remain, but the exam in Ukrainian is mandatory, and in Uzhhorod parents argue in which language their children should take the exam.\n\nHungary's position affects not only bilateral relations: EU matters and aid are on the table. You can enter talks, insist on your own, or propose a treaty on minority rights in exchange for movement toward the European Union."
 ukraine_politics.782.a:0 "Talks with Budapest: guarantees for minority schools."
 ukraine_politics.782.b:0 "Insist: the law stays unchanged."
 ukraine_politics.782.c:0 "Propose a treaty on minority rights."
 ukraine_politics.783.t:0 "Two Churches in One Temple"
 ukraine_politics.783.d:0 "After the law on a single church, Moscow Patriarchate parishes in several regions refuse to change jurisdiction, and the OCU asks the state not to rush people so that a dispute over faith does not turn into a dispute over buildings. In villages it comes to locks on doors and two services in one temple in turn, the synod and metropolitans exchange statements, and priests quietly ask for it all to end sooner.\n\nThe state can tighten requirements, give a transition period and return to dialogue, or leave the decision to the churches themselves. Each option costs something different: stability, political power or the trust of believers."
 ukraine_politics.783.a:0 "Tighten requirements and deadlines."
 ukraine_politics.783.b:0 "Give a transition period and return to dialogue."
 ukraine_politics.783.c:0 "Leave the decision to the churches."
 ukraine_politics.784.t:0 "A Veteran's Word"
 ukraine_politics.784.d:0 "At a session of the Council of the Nation a Crimean Tatar veteran tells what citizenship means when your native home has been taken: since 2014 his family has lived in another city, and he serves a country that promises to return it. The hall listens longer than the rules of procedure allow, and then the conversation unexpectedly returns to the value of service for those who had nothing to lose.\n\nThe civic programme gets a symbol better than any speech. The question is how to use it: reserve seats for Crimean Tatar veterans on the Council, make a recording of the speech public, or leave it as it is."
 ukraine_politics.784.a:0 "Reserve seats on the Council."
 ukraine_politics.784.b:0 "Publish the speech."
 ukraine_politics.784.c:0 "Leave it as it is."
 ukraine_politics.205.t:0 "The First Round"
 ukraine_politics.205.d:0 "31 March. Exactly five years ago the actor from “Servant of the People” reached the runoff with a result nobody expected. Today nobody is surprised, and that is the main problem.\n\nAccording to the Central Election Commission, with almost all protocols counted, Zelensky is first again with §Y[?UKR_r1_zel|0]%§! and Poroshenko second with §Y[?UKR_r1_por|0]%§!. The old margin is gone: the collapse of the union and the rumours around the Office have taken their toll. The other candidates together took §Y[?UKR_r1_other|0]%§!, and it is their voters who will decide in three weeks who becomes president. Poroshenko's headquarters is already celebrating the “return of experience” and printing posters for the runoff."
 ukraine_politics.205.d_high:0 "31 March. Exactly five years ago the actor from “Servant of the People” reached the runoff with a result nobody expected. Today there is nothing to be surprised about, but the margin is pleasantly bigger than forecast: according to the Central Election Commission Zelensky is first with §Y[?UKR_r1_zel|0]%§! and Poroshenko second with §Y[?UKR_r1_por|0]%§!.\n\nSociologists explain it simply: people remember the open registers and the honest answers to awkward questions, while the corridor rumours remained just rumours. The other candidates together took §Y[?UKR_r1_other|0]%§!, and their voters will decide the outcome in three weeks. Poroshenko's headquarters is printing posters for the runoff, but without its former confidence."
 ukraine_politics.205.d_low:0 "31 March. Exactly five years ago the actor from “Servant of the People” reached the runoff with a result nobody expected. Today the result is unexpected too, but in the other direction: according to the Central Election Commission Zelensky is first with only §Y[?UKR_r1_zel|0]%§! and Poroshenko second with §Y[?UKR_r1_por|0]%§!.\n\nSociologists agree on the diagnosis: too many “our own people”, too little transparency, and scandals that were never investigated do not get forgotten. The other candidates together took §Y[?UKR_r1_other|0]%§!, and Poroshenko's headquarters is already rehearsing a speech about the “return of experience”."
 ukraine_politics.205.a:0 "Three weeks. No days off."
 ukraine_politics.206.t:0 "Between the Rounds"
 ukraine_politics.206.d:0 "The campaign divides the map of the country into those who can still be persuaded. The map looks like a patchwork quilt: the left in the east, the right in the west, the young in the big cities, and those who want order a little everywhere.\n\nWinning them all is impossible. Every promise to one group repels another, and there are only two weeks left. The strategists await the president’s decision and prepare two versions of the press release in advance."
 ukraine_politics.206.a:0 "Fight for the left-wing voters."
 ukraine_politics.206.b:0 "Fight for the right-wing voters."
 ukraine_politics.206.c:0 "Fight for the young and IT."
 ukraine_politics.206.e:0 "Fight for those who want order."
 ukraine_politics.207.t:0 "The Runoff"
 ukraine_politics.207.d:0 "The country votes a second time. There are queues at the polling stations from early morning, photos of ballots that must not be published on social media, and observers from both campaigns recounting everything that can be recounted.\n\nBy midnight the exit polls are ready. Silence falls over headquarters: nobody wants to be the first to open the results. Someone jokes nervously that 2019 was easier, back then at least nobody knew what being president was like."
 ukraine_politics.207.a:0 "Open the results."
 ukraine_politics.214.t:0 "After the Runoff"
 ukraine_politics.214.d_wide:0 "The Central Election Commission has counted almost all protocols: Zelensky gets §Y[?UKR_r2_zel|0]%§!, Poroshenko §Y[?UKR_r2_por|0]%§!. The margin is such that Poroshenko's lawyers stop phoning the courts and start phoning the TV studios.\n\nBy morning Poroshenko concedes, thanks his voters and announces that he will keep working in opposition. At the president's headquarters the lights go off before midnight for the first time in a month, and the Office is already arguing about who gets the banquet hall."
 ukraine_politics.214.d_close:0 "According to the Central Election Commission Zelensky gets §Y[?UKR_r2_zel|0]%§!, Poroshenko §Y[?UKR_r2_por|0]%§!. There is a victory, but the margin is such that Poroshenko's headquarters instantly discovers the word “recount”.\n\nBy noon the lawyers of both sides are already at the Commission, and outside the building wait two sets of observers, two sets of journalists and one coffee seller who is, for the first time in years, happy with politics. The question is no longer who won, but how loudly it will be contested."
 ukraine_politics.214.d_mid:0 "Zelensky gets §Y[?UKR_r2_zel|0]%§!, Poroshenko §Y[?UKR_r2_por|0]%§!. The margin is confident but not crushing, and this is the case when both sides can consider themselves if not winners, then at least not losers.\n\nLate in the evening Poroshenko comes out to the journalists, says the fight for the country is not over, and leaves without answering a single question. In the president's Office this scene is read differently: some see respect for the voters in it, others a bid for the next five years."
 ukraine_politics.214.a:0 "Call Poroshenko and offer to talk."
 ukraine_politics.214.b:0 "Get to work. The answers will come in the Rada."
 ukraine_politics.214.c:0 "Let the Commission recount everything they ask for."
 ukraine_politics.214.d:0 "Go to court. We won fairly."
 ukraine_politics.214.e:0 "Invite the opposition to the table: reforms are behind us, we have nothing to fear."
 UKR_runoff_result_tt:0 "Runoff result: Zelensky §Y[?UKR_r2_zel|0]%§!, Poroshenko §Y[?UKR_r2_por|0]%§!."
 UKR_b2_bet_not_ready_tt:0 "The tree for this path is not ready yet and will appear in one of the next updates of the mod."
 UKR_left_maneuver_tt:0 "§gThis is tactics, not conviction: for the Office, backing the left is a way to take their votes before someone else does.§!"
 UKR_left_front_renamed_tt:0 "The Radical Party becomes the “Left Front”, and the “Union of Left Forces” expands into the “Union of Left Forces and Workers' Councils”."
 UKR_pop_social_democrat_pre_p1_tt:0 "Radical Party: §G+1%§! popularity"
 UKR_pop_libertarian_socialist_p1_tt:0 "Union of Left Forces: §G+1%§! popularity"
 UKR_pillar_fallback_tt:0 "No pillar was chosen: the bet goes to the one best supported by the president's past policy, with a penalty for the mismatch."
 UKR_left_front_surge:0 "Rise of the Left"
 UKR_left_front_surge_desc:0 "The §YLeft Front§! and the §YUnion of Left Forces§! run in the elections with their own lists. The rallies grow larger and the TV ratings of “Servant of the People” grow more worrying. The left electorate has suddenly turned out to be not silent at all, but very audible. The scale of the surge depends on how consistently the left built its coalition. The rallies slowly erode stability every week."
 # Block 2: scandal
 ukraine_politics.300.t:0 "The Searches"
 ukraine_politics.300.d:0 "A week after the victory, before the campaign billboards are even taken down, NABU detectives arrive with searches. According to investigators, the case is linked to the Head of the President’s Office Andriy Yermak. He denies all accusations.\n\nThe details are kept secret, but photos of people in body armour at familiar doors spread across every channel within an hour. The team’s festive mood ends at the same moment as the press office’s phone batteries."
 ukraine_politics.300.d_sub:0 "A week after the victory, despite the resubordination of the anti-corruption bodies, NABU detectives carry out searches. According to investigators, the case is linked to the Head of the President’s Office Andriy Yermak. He denies all accusations.\n\nThe Prosecutor General’s Office tries to take the case over, but too late: photos of the searches have already spread across every channel. It turns out you can subordinate the bodies, but not their detectives, and certainly not journalists’ phones."
 ukraine_politics.300.a:0 "This is a blow to the whole team."
 ukraine_politics.301.t:0 "Yermak"
 ukraine_politics.301.d:0 "Andriy Yermak is the person closest to the president, his right hand all these years and, according to investigators, a figure in the investigation. He denies everything and keeps coming to work as usual for now.\n\nDefending him means staking trust in the second term before the inauguration even happens. Letting him go means showing the inner circle what loyalty is worth in this office. Both options are bad, and that is the whole point of politics."
 ukraine_politics.301.a:0 "We do not give up our own."
 ukraine_politics.301.b:0 "Accept the resignation."
 ukraine_politics.302.t:0 "The Pillar Takes the Stage"
 ukraine_politics.302.d:0 "The president never decided whom he relies on, and now everyone can see it. At the height of the scandal nobody stands up for him: not the street, not the elites, not the experts.\n\nEven yesterday’s allies answer every other call. Loneliness at the top turned out to be not a metaphor but a very concrete empty briefing room."
 ukraine_politics.302.d_tech:0 "Overnight, Mykhailo Fedorov’s team publishes every contract the journalists are talking about and launches a public audit: “Everything is transparent, see for yourselves.”\n\nThe document site crashes under the load within twenty minutes, and that is the best advertising possible. For many it is an argument: a president who opens the registers himself can hardly be the head of a scheme."
 ukraine_politics.302.d_left:0 "Trade unions and veteran associations take to the streets demanding “to try the guilty, not to change course”. They use the scandal as an argument against the oligarchs around the government and for the president who promised to fight them.\n\nAt the rally outside the Rada, miners from Kryvyi Rih stand next to students from the Mohyla Academy. Kyiv has not seen such unity for a long time."
 ukraine_politics.302.d_olig:0 "The largest media holdings, as if on command, line up behind one message: “an attack on stability in difficult times”. Stories about the scandal move to the end of the news, after the weather forecast, and experts come on air to explain why now is not the time to rock the boat.\n\nIt all looks very professional. And very familiar to anyone who remembers Ukrainian television of the 2000s."
 ukraine_politics.302.d_nat:0 "Veteran councils and the territorial defence bring people out for “Unity Over Scandals” rallies. In formation, with flags, without a single broken window.\n\nTheir message is simple: the country faces a great threat, internal wars can wait. Many find this reasonable. Some find it a little too well organised."
 ukraine_politics.302.a:0 "The pillar holds."
 ukraine_politics.303.t:0 "Brussels Reacts"
 ukraine_politics.303.d:0 "The European Commission expresses “concern” and awaits the results of the investigation. In Brussels this word has a dozen shades, and diplomats in Kyiv spend half a day figuring out which one was used today.\n\nFor now, the neutral one. But the next statement may well contain the word “tranche”."
 ukraine_politics.303.d_sub:0 "The European Commission directly links the scandal to the resubordination of the anti-corruption bodies. The next aid tranche is suspended until their independence is restored.\n\nThe Ministry of Finance calculates how many months the budget can last without European money. The number comes out unpleasantly small."
 ukraine_politics.303.d_prot:0 "The European Commission notes that the investigation is proceeding without government interference and calls it “proof of the maturity of Ukrainian institutions”.\n\nIt is a rare case of a scandal with searches in the President’s Office being counted in Brussels as an achievement. The foreign minister asks for the statement to be printed and framed."
 ukraine_politics.303.a:0 "Duly noted."
 ukraine_politics.304.t:0 "The Inauguration"
 ukraine_politics.304.d:0 "Kyiv in May, the Verkhovna Rada, a hand on the Constitution and the Peresopnytsia Gospel. The president takes the oath for the second time.\n\nFive years ago this hall laughed and applauded. Today the applause is restrained: the Rada is split, the scandal has not died down, half the hall is already thinking about the next election. But the government has a pillar again, and five years to prove the choice was right."
 ukraine_politics.304.a:0 "The second term begins."
 ukraine_politics.310.t:0 "Silence"
 ukraine_politics.310.d:0 "The case that promised to be loud has suddenly become quiet. The Prosecutor General's Office is “studying the materials”, NABU detectives wait for answers to their requests, and in the office of the head of the Office the lights still burn late. According to the media, Andriy Yermak continues to meet ministers and governors, only now he does it in a car rather than in the reception room.\n\nFor the president this is a convenient arrangement: the chief adviser is in place, the case is in the archive, there is no noise. But in such arrangements there is always someone waiting for a pretext, and usually it is a journalist with a good source. It has to be decided how long this silence will last."
 ukraine_politics.310.a:0 "Leave everything as it is: silence is politics too."
 ukraine_politics.310.b:0 "Ask the head of the Office to step into the background: no meetings or calls in the president's name."
 ukraine_politics.310.c:0 "Explain to partners: procedural decisions are made by the Prosecutor General's Office, not by us."
 ukraine_politics.311.t:0 "The Leak"
 ukraine_politics.311.d:0 "Correspondence appears online that, according to journalists, relates to people in the circle of the head of the Office. Contracts, subcontracts and the question of how to make sure the “bureau notices nothing” are discussed. The authenticity of the documents is hard to confirm and even harder to refute, and a meme with a quote from the correspondence has already collected more views than the Office's official statement.\n\nThe opposition demands explanations, partners ask for confirmations, and the headquarters understands: if the leak turns out to be true, the former silence will prove very expensive. If it turns out to be false, any attempt to refute it will prove expensive."
 ukraine_politics.311.a:0 "Call the leak a fake and find whoever leaked it."
 ukraine_politics.311.b:0 "Demand an independent expert examination of the documents' authenticity."
 ukraine_politics.311.c:0 "Ask the head of the Office to explain himself publicly."
 ukraine_politics.312.t:0 "Who Is in the Office?"
 ukraine_politics.312.d:0 "The office of the head of the Office on Bankova stays empty for two weeks, and in that time everyone manages to draw up their own list of candidates. The security people want someone who understands security, the diplomats someone who will be heard in Brussels, the parliamentary faction one of their own. Every list ends with the same postscript: just do not let it turn out as before.\n\nAfter all the arguing four names remain. Mykhailo Fedorov promises to turn the Office into a service with reporting, Kyrylo Budanov to bring order and discipline, Andriy Sybiha to restore the Office's reputation in Brussels, and Davyd Arakhamia to keep everything as it is, only with less noise. The president chooses a person, but in fact he chooses what the Office will be for the coming years."
 ukraine_politics.312.a:0 "Mykhailo Fedorov: the Office as a service with public reporting."
 ukraine_politics.312.b:0 "Kyrylo Budanov: order, discipline and security."
 ukraine_politics.312.c:0 "Andriy Sybiha: reputation and bridges to Brussels."
 ukraine_politics.312.e:0 "Davyd Arakhamia: one of our own, fewer changes."
 ukraine_politics.313.t:0 "After Yermak"
 ukraine_politics.313.d:0 "The new head of the Office arrives with two cardboard boxes and one question: who among the staff remains from the previous team and what are they doing? The answer is almost everyone and almost everything. In the corridors people talk in whispers, and in accounting for the first time in many years they reconcile the accounts with the schedule of guest receptions.\n\nThe president understands that the Yermak case will not end with the resignation: the people he brought in and the connections he built will remain. Either the new team will clean out these connections, or they will clean out the team."
 ukraine_politics.313.a:0 "Carry out an internal audit of the Office and publish the results."
 ukraine_politics.313.b:0 "Replace key people quietly, without publications."
 ukraine_politics.313.c:0 "Keep the staff: professionals are needed."
 ukraine_politics.314.t:0 "The Case at the High Anti-Corruption Court"
 ukraine_politics.314.d:0 "The case of the head of the Office has been sent to the High Anti-Corruption Court: NABU announces it, and the same day the date of the first hearing appears on the court's website. The defence speaks of a political order and procedural violations, the prosecution of evidence that will be presented in court. The courtroom is packed: journalists, activists and several men in suits who never explained why they came.\n\nThe president, like everyone, watches the news. He has a choice: stay silent, as the procedure requires, or publicly distance himself from the man with whom he has spent all the years in power. Either decision will be read as a signal, and not only in Kyiv."
 ukraine_politics.314.a:0 "Do not interfere: the court is the court and the Office is the Office."
 ukraine_politics.314.b:0 "Publicly distance himself from the defendant."
 ukraine_politics.314.c:0 "Ask the court to take into account the defendant's services to the state."
 ukraine_politics.315.t:0 "Hearings Are Postponed"
 ukraine_politics.315.d:0 "The hearing in the case is postponed for the third time: first the lawyer fell ill, then a volume of the case file went missing, then the air conditioning in the courtroom broke. NABU calls it a tactic of delay, the Office calls it normal process, and journalists call it seasonal entertainment. The courtroom gradually empties, and public interest cools along with it.\n\nThe case has an important feature: it waits. While there is no verdict, every politician walks under it like under rain without an umbrella. Time plays for one of the sides, and the only question is which."
 ukraine_politics.315.a:0 "Publicly support speeding up the process."
 ukraine_politics.315.b:0 "Do not comment: the court knows what to do."
 ukraine_politics.315.c:0 "Through allies in the Rada propose revising the jurisdiction of such cases."
 ukraine_politics.316.t:0 "The President Against the Bureau"
 ukraine_politics.316.d:0 "The president publicly defended the head of the Office and ran into what he feared: the bureau does not intend to back down. NABU issues a statement the same day, written in the language one does not use when one wants to reach an agreement. The Prosecutor General is silent, ambassadors smile politely, and for the first time in years the word “crisis” appears in the news feed.\n\nIn the Office they are already calculating what comes next: either the case goes to court under the most inconvenient coverage, or someone has to give way. The president has been in politics too long not to understand: giving way now is cheaper than later."
 ukraine_politics.316.a:0 "Give way to the bureau: the case goes by the law, the Office does not interfere."
 ukraine_politics.316.b:0 "Go to conflict: revise the bureau's powers through the Rada."
 ukraine_politics.316.c:0 "Seek a compromise through Brussels: an independent assessment of the case."
 ukraine_politics.317.t:0 "After the Storm"
 ukraine_politics.317.d:0 "After a week that the Office calls difficult it turns out that an argument with the bureau cannot be won, one can only choose how to lose. Some deputies ostentatiously keep away from the president, while others, on the contrary, have grown closer: those who need someone's patronage. Sociologists note that people now divide politicians into those who explain themselves and those who do not.\n\nIt remains to decide how to live on: restore relations with the bureau and Brussels, or remain on the defensive, where it is safer but duller."
 ukraine_politics.317.a:0 "Restore dialogue with the bureau: regular meetings and joint briefings."
 ukraine_politics.317.b:0 "Remain on the defensive: fewer words, more decisions."
 ukraine_politics.317.c:0 "Make a neutral statement: the authorities respect the independence of the bodies."
 ukraine_politics.319.t:0 "The Yermak Case: The Outcome"
 ukraine_politics.319.d_court:0 "The High Anti-Corruption Court passes a verdict in a case that for many has long become a symbol of the era. Andriy Yermak is found guilty; the verdict is read without undue ceremony and with the obligatory note “subject to appeal”, which in Ukrainian legal proceedings works as an ellipsis.\n\nFor the president it is a hard day: the man who was at his side all these years leaves politics by a court decision. But the headlines abroad are quite different: “Kyiv has shown that independent institutions work”. In Brussels this is written with rare warmth, in the Office it is read through gritted teeth."
 ukraine_politics.319.d_deal:0 "The Yermak case ends the way most high-profile cases end: quietly and by the protocol. The former head of the Office concludes an agreement with the investigation, returns what the investigation considers disputed assets and leaves public life. The sentence is mild, the wording careful, and the word “deal” stands in every second headline.\n\nIn Brussels this is received with cautious approval: there is a result, though without a show trial. In Kyiv with relief: there will be no more hearings attended by people who give no reason for coming. The political outcome is even: nobody won, but nobody lost either."
 ukraine_politics.319.d_fade:0 "The Yermak case ends with nothing final: it simply stops moving. Procedural deadlines expire, jurisdiction changes, and one of the folders goes to the archive with a note that even lawyers cannot decipher. The former head of the Office appears at several events and gives an interview at none.\n\nPartners in Brussels record it as a failure: aid is frozen until new guarantees. Journalists call the story a ghost case, and in the corridors of the Rada the word “clan” is heard more and more often: around Bankova gather again those who know how to agree without a protocol."
 ukraine_politics.319.a:0 "Accept the verdict and close the page."
 ukraine_politics.319.b:0 "Accept the result: the main thing is that the case is closed."
 ukraine_politics.319.c:0 "Pretend the question does not exist."

 # Block 3: institutionalist technocrats
 UKR_t_svyrydenko_cabinet:0 "The Svyrydenko Cabinet"
 UKR_t_svyrydenko_cabinet_desc:0 "The second term begins with a new government. Yulia Svyrydenko, who ran the economy for years, becomes prime minister, and Mykhailo Fedorov continues the digital transformation. The bet is on institutions, not faces."
 UKR_t_diia_system:0 "Diia as a System"
 UKR_t_diia_system_desc:0 "Diia stops being an app and becomes the way the state works. The fewer papers and offices, the fewer places to take a bribe."
 UKR_t_digital_registry:0 "Unified Digital Registry"
 UKR_t_digital_registry_desc:0 "All registries, of conscripts, property and businesses, merge into one system. In peacetime it is convenience; in war it is speed."
 UKR_t_e_residency:0 "E-Residency"
 UKR_t_e_residency_desc:0 "Foreign entrepreneurs register businesses in Ukraine without coming here. They pay taxes here and can work from anywhere."
 UKR_t_it_export:0 "IT Exports"
 UKR_t_it_export_desc:0 "Programmers are the country's most stable export. The state makes their life easier and hopes they stay."
 UKR_t_diia_city_2:0 "Diia.City 2.0"
 UKR_t_diia_city_2_desc:0 "The second generation of the special regime for tech companies: more residents, simpler rules, links with universities."
 UKR_t_cloud_state:0 "Cloud State"
 UKR_t_cloud_state_desc:0 "Copies of all state registries are kept in allied data centres. If the servers in Kyiv go silent, the state keeps working."
 UKR_t_drone_army:0 "Drone Army"
 UKR_t_drone_army_desc:0 "Out of the UAV experiments grows a separate system: manufacturers, operators, schools, procurement through open platforms."
 UKR_t_cyber_troops:0 "Cyber Forces"
 UKR_t_cyber_troops_desc:0 "IT specialists in uniform and volunteers from the IT Army get structure, command and missions."
 UKR_t_digital_mobilization:0 "Digital Mobilisation"
 UKR_t_digital_mobilization_desc:0 "Call-up notices arrive in the app, records are kept online, and the enlistment office becomes a service. Faster and fairer, as long as the network works."
 UKR_t_open_state:0 "Open State"
 UKR_t_open_state_desc:0 "Data is public, contracts are open, decisions are explained. The West applauds, journalists are pleased, and the enemy reads the same registries."
 UKR_t_digital_control:0 "Digital Control"
 UKR_t_digital_control_desc:0 "All state data serves the speed of decisions and security. Effective, and alarming for those who remember how such systems end."
 UKR_t_transparent_budget:0 "Transparent Budget"
 UKR_t_transparent_budget_desc:0 "Every hryvnia of the budget is visible online in real time. Stealing becomes inconvenient."
 UKR_t_estonian_experience:0 "The Estonian Experience"
 UKR_t_estonian_experience_desc:0 "A joint programme with Estonia, which built a digital state while everyone else argued about paper passports."
 UKR_t_algorithms:0 "Algorithms Instead of Officials"
 UKR_t_algorithms_desc:0 "Licences, benefits and inspections are allocated by the system. Fast and bribe-free, and with no way to explain to the algorithm that it made a mistake."
 UKR_t_security_single_window:0 "Security Single Window"
 UKR_t_security_single_window_desc:0 "The security services see all registries in one window. Enemy agents feel cramped. So do citizens."
 UKR_t_state_without_territory:0 "A State Without Territory"
 UKR_t_state_without_territory_desc:0 "If the enemy takes the capital, it takes buildings, not the state. Registries, communications, payments and government will keep working from the cloud."
 UKR_t_liberal_corporatism:0 "Liberal Corporatism"
 UKR_t_liberal_corporatism_desc:0 "A country that learned to work without territory now learns to bargain without brawls. Government, business associations and trade unions sit at one table, and the rules of the market are written there rather than in the back rooms of those who once settled everything by phone call.\n\nBig capital gains predictability and loses its familiar levers. Unions get a seat and learn the word 'compromise'. The technocrats are pleased: at last a model that fits in a presentation and might even be implemented. Skeptics note that the table is sometimes round, yet two people still do the deciding."
 UKR_svyrydenko:0 "Yulia Svyrydenko"
 UKR_fedorov:0 "Mykhailo Fedorov"
 UKR_network_dependency:0 "Network Dependency"
 UKR_network_dependency_desc:0 "The digital state works fast, as long as there is electricity and connectivity. Every strike on the power grid now also hits the running of the country."
 UKR_digital_registry_idea:0 "Unified Digital Registry"
 UKR_digital_registry_idea_desc:0 "All registries in one system: mobilisation and decisions move faster."
 UKR_digital_mobilization_idea:0 "Digital Mobilisation"
 UKR_digital_mobilization_idea_desc:0 "Records, call-ups and conscription work online."
 UKR_it_export_idea:0 "IT Exports"
 UKR_it_export_idea_desc:0 "The tech sector feeds the budget and science."
 UKR_drone_army:0 "Drone Army"
 UKR_drone_army_desc:0 "Reconnaissance, spotting and strikes by drones produced all over the country."
 UKR_cyber_troops:0 "Cyber Forces"
 UKR_cyber_troops_desc:0 "Structured cyber forces protect our networks and break into others'."
 UKR_open_state:0 "Open State"
 UKR_open_state_desc:0 "Transparency as state policy: partners' trust grows, but so does vulnerability to leaks."
 UKR_digital_control:0 "Digital Control"
 UKR_digital_control_desc:0 "The state sees everything and decides quickly. Society feels it."
 UKR_security_single_window:0 "Security Single Window"
 UKR_security_single_window_desc:0 "The security services get access to all registries at once."
 UKR_eu_reconstruction_fund:0 "EU Reconstruction Fund"
 UKR_eu_reconstruction_fund_desc:0 "A multi-year European Union programme: grants and cheap loans for reconstruction in exchange for reforms. Every tranche is tied to a specific law."
 UKR_made_in_ukraine:0 "Made in Ukraine"
 UKR_made_in_ukraine_desc:0 "National cashback and localisation in public procurement support Ukrainian producers."
 UKR_svyrydenko_reforms:0 "Svyrydenko Cabinet Reforms"
 UKR_svyrydenko_reforms_desc:0 "The government's economic programmes: support for producers, loans, grants, deregulation and privatisation. The state does not build factories itself; it helps others build them."
 UKR_sv_made_in_ukraine:0 "Made in Ukraine"
 UKR_sv_made_in_ukraine_desc:0 "National cashback for Ukrainian goods and localisation requirements in public procurement."
 UKR_sv_affordable_loans:0 "Affordable Loans 5-7-9%"
 UKR_sv_affordable_loans_desc:0 "The state compensates businesses for loan interest. Enterprises get built, debt grows."
 UKR_sv_own_business_grants:0 "Own Business Grants"
 UKR_sv_own_business_grants_desc:0 "Micro-grants to start a business: barbershops, bakeries, workshops, and a little less poverty."
 UKR_sv_deregulation:0 "Deregulation"
 UKR_sv_deregulation_desc:0 "Hundreds of permits and certificates are abolished in one package. Less power for officials, fewer reasons for business to pay."
 UKR_sv_big_privatization:0 "Great Privatisation"
 UKR_sv_big_privatization_desc:0 "Loss-making state enterprises go under the hammer. The budget gets money, the trade unions get a reason to protest."
 UKR_sv_eu_reconstruction_fund:0 "EU Reconstruction Fund"
 UKR_sv_eu_reconstruction_fund_desc:0 "Modelled on the real Ukraine Facility (2024-2027): EU money for reconstruction and modernisation, but only as long as Ukraine delivers the promised reforms. Unavailable while EU aid is frozen."
 UKR_sv_industrial_parks:0 "Industrial Parks"
 UKR_sv_industrial_parks_desc:0 "Ready sites with roads, electricity and tax breaks for private investors."
 UKR_sv_institutions_work:0 "Institutions at Work"
 UKR_sv_institutions_work_desc:0 "Reforms stop depending on the enthusiasm of a single cabinet: orders turn into regulations, regulations into habit. Svyrydenko gets what every prime minister dreams of: the chance to take a holiday and not find a fire on return."
 UKR_sv_fedorov_defense:0 "Fedorov Goes to Defence"
 UKR_sv_fedorov_defense_desc:0 "The war showed that a digital minister can procure, connect and count faster than many people in uniform. Fedorov takes over the ministry and immediately asks why this process needs ten approvals."
 UKR_sv_fedorov_defense_upgrade:0 "Fedorov: The Technology Army"
 UKR_sv_fedorov_defense_upgrade_desc:0 "Drones, data and procurement through open platforms become the ministry's doctrine rather than its informal life. The military gets used to the app sometimes deciding faster than an order."
 UKR_upgrade_budanov:0 "Budanov: HUR at the Centre"
 UKR_upgrade_budanov_desc:0 "Intelligence stops being an auxiliary service: Budanov gains the right to plan operations, not merely report on other people's. The network grows faster than anyone can name it."
 UKR_sv_reforms_5_tt:0 "At least five reforms from the \"Svyrydenko Cabinet Reforms\" window completed"
 UKR_sv_fedorov_defense_tt:0 "Mykhailo Fedorov will head the Ministry of Defence"
 UKR_cloud_state_tt:0 "State registries are stored in allied data centres."
 UKR_state_without_territory_tt:0 "§YIf Kyiv falls, the blow to stability and war support will be halved.§!"
 UKR_state_without_territory_kyiv_tt:0 "The state keeps working from the cloud: the blow is softened."
 ukraine_politics.400.t:0 "The Svyrydenko Cabinet"
 ukraine_politics.400.d:0 "The new government is presented to the Rada. The prime minister is Yulia Svyrydenko, an economist who spent years negotiating with partners and writing business support programmes. Mykhailo Fedorov remains in charge of the digital transformation. Journalists call the cabinet 'boring'. The government takes it as a compliment."
 ukraine_politics.400.a:0 "Boring means it works."
 ukraine_politics.401.t:0 "Diia Is Down"
 ukraine_politics.401.d:0 "In the morning Diia will not open. Payments, certificates and digital passports stop working. A few hours later it becomes clear: a massive cyberattack on a data centre. For the first time the country understands how much it depends on one app."
 ukraine_politics.401.a:0 "Deploy backup servers abroad."
 ukraine_politics.401.b:0 "Wait it out and restore it ourselves."
 ukraine_politics.402.t:0 "The Garage Drone"
 ukraine_politics.402.d:0 "Three students from Kharkiv show off a reconnaissance drone built in a garage from robot vacuum parts, an old smartphone and a very large amount of electrical tape. It flies. It streams video. It even comes back. The military laughs right up until the first test."
 ukraine_politics.402.a:0 "Give them a grant and start production."
 ukraine_politics.402.b:0 "Hand the design over to the army."
 ukraine_politics.403.t:0 "The Leak"
 ukraine_politics.403.d:0 "Part of the open registry's data surfaces on an anonymous forum, along with personal data of officials and servicemen. The open state turned out to be open not only to its citizens."
 ukraine_politics.403.a:0 "Admit the mistake and close the vulnerability."
 ukraine_politics.403.b:0 "This is the work of Russian hackers."
 ukraine_politics.404.t:0 "Digital Panopticon"
 ukraine_politics.404.d:0 "Human rights activists and students gather outside the Cabinet of Ministers: 'The state knows more about us than we do.' Posters with an eye above the Diia logo become a meme in a single evening."
 ukraine_politics.404.a:0 "Give parliament control over the data."
 ukraine_politics.404.b:0 "Security comes first."
 ukraine_politics.405.t:0 "Conservatives Against the Digital"
 ukraine_politics.405.d:0 "Priests, rural communities and pensioners complain: the local office no longer accepts paper applications, and the nearest computer is twenty kilometres away. The opposition calls digitalisation 'a state for the young and urban'."
 ukraine_politics.405.a:0 "Keep paper services for those who need them."
 ukraine_politics.405.b:0 "The future will not wait."
 ukraine_politics.406.t:0 "The Estonian Experience"
 ukraine_politics.406.d:0 "An Estonian delegation arrives in Kyiv with a joint e-government programme. Tallinn shares its experience, Kyiv its scale. Both sides know on whose border the threat stands."
 ukraine_politics.406.a:0 "Digital allies are allies too."
 UKR_markarova:0 "Oksana Markarova"
 UKR_hetmantsev:0 "Danylo Hetmantsev"
 UKR_stefanishyna:0 "Olha Stefanishyna"
 UKR_sybiha:0 "Andriy Sybiha"
 UKR_klimkin:0 "Pavlo Klimkin"
 UKR_klymenko:0 "Ihor Klymenko"
 UKR_zguladze:0 "Eka Zguladze"
 UKR_shchyhol:0 "Yurii Shchyhol"
 UKR_malyuk:0 "Vasyl Maliuk"
 UKR_cabinet_actors_dynamic:0 "Independent Cabinet Actors"
 UKR_cabinet_actors_dynamic_desc:0 "Ministers and deputies from the technocratic camp are used to working without clearing things with the Presidential Office. Things move faster, but the president has more people to argue with and fewer levers: each such actor slightly reduces political power gain."
 UKR_tech_team_narrow:0 "Fedorov's Inner Circle"
 UKR_tech_team_narrow_desc:0 "Fedorov brings a few people who understand each other at half a word and treat outside approvals as a needless extra step. A small team, but fewer arguments in the corridors."
 UKR_tech_team_medium:0 "The Technocrat Team"
 UKR_tech_team_medium_desc:0 "Digital specialists, trade negotiators and agency managers take deputy posts. Reforms move noticeably faster, and the Presidential Office increasingly learns about them from the news."
 UKR_tech_team_wide:0 "The Technocrat Landing"
 UKR_tech_team_wide_desc:0 "Technocrats take deputy and leadership posts in almost every ministry. The state starts working by the rulebook, and rulebooks, as everyone knows, rarely match what Bankova wants."
 UKR_cabinet_talks_tt:0 "Svyrydenko will discuss candidates for economy, foreign affairs, interior and intelligence with the president"
 UKR_cabinet_actors_1_tt:0 "Independent cabinet actor: political power gain §R-1%§!"
 UKR_cabinet_actors_3_tt:0 "Independent cabinet actors (3): political power gain §R-3%§!"
 UKR_cabinet_actors_5_tt:0 "Independent cabinet actors (5): political power gain §R-5%§!"
 ukraine_politics.410.t:0 "Who Will Count the Money"
 ukraine_politics.410.d:0 "Yulia Svyrydenko arrives at the President's Office with a folder: three candidates for the economic bloc and a table of pros and cons for each. The president flips through it, marks something in red and sends it back with a question that, in this building, means "and who vouches for him". The talk is calm, like every conversation where both sides are counting who will keep more levers afterwards.\n\nTymofiy Mylovanov is an economist used to working with numbers rather than terms of office; he is Svyrydenko's man and is unlikely to clear every comma with the Office. Oksana Markarova speaks the language of donors and budget discipline, and she would be accepted without a fight in both Brussels and the Finance Ministry. Danylo Hetmantsev is the author of tax initiatives and a long-time ally of the president: he will have to be pushed through the prime minister and the faction, but there will be no questions about loyalty. Independent ministers work faster, but later they argue with the Office."
 ukraine_politics.410.a:0 "Tymofiy Mylovanov: let Svyrydenko's man count."
 ukraine_politics.410.b:0 "Oksana Markarova: a compromise that pleases everyone a little."
 ukraine_politics.410.c:0 "Danylo Hetmantsev: the president's choice."
 ukraine_politics.411.t:0 "The Face of the Country Abroad"
 ukraine_politics.411.d:0 "The next question is the Foreign Ministry, where the whole country answers for every word. Svyrydenko wants Ukraine to speak to partners in the language of programmes and deadlines, and the president wants partners to hear exactly what he hears himself.\n\nOlha Stefanishyna runs European integration and knows by heart the chapters Brussels asks about most often. Andriy Sybiha is a diplomat from the president's circle: there are no intermediaries between him and Bankova, and therefore no surprises. Pavlo Klimkin headed the ministry in 2014-2019 and remembers the Normandy format talks from more than press releases. He is listened to in the West, but he makes decisions himself, and not everyone likes that."
 ukraine_politics.411.a:0 "Olha Stefanishyna: European integration as a profession."
 ukraine_politics.411.b:0 "Andriy Sybiha: a man from the president's circle."
 ukraine_politics.411.c:0 "Pavlo Klimkin: a seasoned diplomat with no political debts."
 ukraine_politics.412.t:0 "The Man in Uniform"
 ukraine_politics.412.d:0 "The Interior Ministry is not just the police but half of every conversation about who really decides things in the country. Svyrydenko proposes candidates who can be called professionals, and the president adds that professionals should also answer the phone.\n\nEka Zguladze is known for the patrol police reform: after it, people got used to expecting courtesy from a patrol officer. Ihor Klymenko is a career police officer used to discipline and subordination, and no conflicts with the cabinet are expected from him. Denys Monastyrskyi knows the system from the inside and passes the president's list without extra questions. Ministers from the reformist camp argue more often than the Office would like."
 ukraine_politics.412.a:0 "Eka Zguladze: reform matters more than subordination."
 ukraine_politics.412.b:0 "Denys Monastyrskyi: a man known at Bankova."
 ukraine_politics.412.c:0 "Ihor Klymenko: a professional without political ambitions."
 ukraine_politics.413.t:0 "The One Who Knows Other People's Secrets"
 ukraine_politics.413.d:0 "Vasyl Maliuk: counterintelligence without extra words."
 ukraine_politics.413.a:0 "Yurii Shchyhol: the state's cyber shield."
 ukraine_politics.413.b:0 "Ivan Bakanov: an old friend who can be trusted."
 ukraine_politics.413.c:0 "Kyrylo Budanov: military intelligence with standing in the army."
 ukraine_politics.414.t:0 "The Second Tier"
 ukraine_politics.414.d:0 "The ministers are appointed, and it turns out that each of them has deputies who also have to be approved by someone. Svyrydenko proposes bringing in people from her own circle: digital specialists, trade negotiators, managers from agencies. The president notes that every new independent player is one more point where cabinet decisions turn from orders into a subject for discussion.\n\nMykhailo Fedorov stays in charge of digital transformation and will most likely bring Oleksandr Bornyakov and trade representative Taras Kachka. The wider the team, the more people in the government who can work without clearance, and the fewer ways the Office has to stop them with one phone call. It costs political capital, but together they move things faster."
 ukraine_politics.414.a:0 "Only Fedorov and his inner circle."
 ukraine_politics.414.b:0 "Fedorov, Bornyakov and Kachka: a medium-sized team."
 ukraine_politics.414.c:0 "A broad landing of technocrats in ministries and agencies."
 ukraine_politics.540.t:0 "Who Will Lead the Government"
 ukraine_politics.540.d:0 "The left coalition has its economy minister and immediately runs into a question nobody in Ukraine likes to ask aloud: who owns the cabinet? The sitting prime minister is ready to stay, but the unions remind everyone that their people go to rallies, not to committee sessions. Two leaders are on offer: Hryhoriy Osovyi, chairman of the Federation of Trade Unions of Ukraine, and Mykhailo Volynets, chairman of the Confederation of Free Trade Unions.\n\nThey get along with each other worse than with any government: the Federation is used to negotiating with every Rada convocation, the Confederation is used to setting conditions. If you worked with the Federation earlier, Osovyi arrives with a ready list of ministers and Volynets refuses to sit with those who once divided trade union property. If you kept your distance, it will be the other way round. Either way, a prime minister from the unions is a prime minister who cannot be removed with one phone call."
 ukraine_politics.540.a:0 "Hryhoriy Osovyi: union seniority and negotiating experience."
 ukraine_politics.540.a_no:0 "Hryhoriy Osovyi refuses: the Federation does not trust the Office's promises."
 ukraine_politics.540.b:0 "Mykhailo Volynets: an independent union at the head of the government."
 ukraine_politics.540.b_no:0 "Mykhailo Volynets refuses: he will not sit at one table with the Federation."
 ukraine_politics.540.c:0 "Keep the sitting prime minister."
 ukraine_politics.541.t:0 "The Coalition's Face Abroad"
 ukraine_politics.541.d:0 "In Brussels the left coalition needs a translator: in Europe the word \"left\" is read in different ways, and not always happily. Olha Stefanishyna can talk about labour rights in the language of EU directives, while Hanna Hopko is known for her work on the Rada's foreign affairs committee and a habit of not saying \"yes\" out of politeness.\n\nBoth will join only a government that does not quarrel with Europe: frozen aid or captured courts will close the door. The sitting minister remains a fallback: an experienced person whom the cabinet knows what to expect from, though no enthusiasm about the labour code should be expected."
 ukraine_politics.541.a:0 "Olha Stefanishyna: labour rights in the language of EU directives."
 ukraine_politics.541.a_no:0 "Olha Stefanishyna refuses: she will not join while EU aid is frozen."
 ukraine_politics.541.b:0 "Hanna Hopko: an independent voice in foreign affairs."
 ukraine_politics.541.b_no:0 "Hanna Hopko refuses: captured courts or frozen aid close the door."
 ukraine_politics.541.c:0 "Keep the sitting minister."
 ukraine_politics.542.t:0 "The Law or the Loud Statement"
 ukraine_politics.542.d:0 "The Interior Ministry in a left coalition is a question of trust not only in the police but in the coalition itself. Ruslan Riaboshapka and Vitaliy Kasko come from the prosecutor's office with reputations as reformers; both will agree only if the anti-corruption bodies and the courts do not speak with the voice of Bankova. Oleh Lyashko, a public politician known for sharp rhetoric, will agree at once and, judging by his manner, will explain it on air.\n\nThe first two are costlier and quieter, but their appointment is read in Brussels as a signal. The third is cheaper and louder: the noise will reach both the Rada and the European partners. The sitting minister, as usual, promises nothing and demands nothing."
 ukraine_politics.542.a:0 "Ruslan Riaboshapka: a reformer from the prosecutor's office."
 ukraine_politics.542.a_no:0 "Ruslan Riaboshapka refuses: he will not join without protection for the anti-corruption bodies."
 ukraine_politics.542.b:0 "Vitaliy Kasko: judicial reform matters more than speed."
 ukraine_politics.542.b_no:0 "Vitaliy Kasko refuses: the anti-corruption bodies are subordinated or the courts are captured."
 ukraine_politics.542.c:0 "Oleh Lyashko: cheap and very visible."
 ukraine_politics.542.e:0 "Keep the sitting minister."
 ukraine_politics.543.t:0 "An Army Without Middlemen"
 ukraine_politics.543.d:0 "In the left programme defence stands next to social policy: the army should not feed middlemen. Andriy Zahorodniuk, a former defence minister, has long spoken about transparent procurement and civilian oversight, and in such a programme he looks natural.\n\nHe will return if the coalition does not replace the unions with veterans' councils and does not pull the army into politics. The sitting minister is ready to stay: with him it is clear what to expect, while nobody yet knows what to expect from the others."
 ukraine_politics.543.a:0 "Andriy Zahorodniuk: transparent procurement and civilian oversight."
 ukraine_politics.543.a_no:0 "Andriy Zahorodniuk refuses: veterans' councils instead of unions and a politicised army do not suit him."
 ukraine_politics.543.b:0 "Keep the sitting defence minister."
 ukraine_politics.544.t:0 "The Left's Second Line"
 ukraine_politics.544.d:0 "The ministers are named, and it at once turns out that each of them has people without whom the coalition would become a cabinet of six. Zakhar Popovych and Oksana Dutchak from the Social Movement circle can talk about labour without slogans. The historian Taras Bilous and Mustafa Nayyem, who worked on reconstruction and procurement, can be added, and in the wide team the deputies Inna Sovsun, Lesia Vasylenko and Oleksandra Ustinova.\n\nThe wider the team, the more people in government who answer neither to Bankova nor to the Federation, and the harder it is for the Office to stop them with one phone call. In return society, stability and the fight against poverty gain more. Each such independent player lowers political power gain by 1%."
 ukraine_politics.544.a:0 "Only Popovych and Dutchak."
 ukraine_politics.544.b:0 "Popovych, Dutchak, Bilous and Nayyem: a medium team."
 ukraine_politics.544.c:0 "A wide team: also Sovsun, Vasylenko and Ustinova."
 ukraine_politics.544.e:0 "No second line: the ministers will manage on their own."
 ukraine_politics.545.t:0 "The Red Line in the Cabinet"
 ukraine_politics.545.d:0 "In practice the party line means a question nobody likes to answer: who in the government reads the party's decisions and who reads the economic plan? Petro Symonenko, leader of the Communist Party of Ukraine, arrives with a ready list of industries and people. For the party it is a return to big politics, for Europe a reason to recount what is called left here.\n\nDudin is ready to stay even without a portfolio: he points out that the Social Movement was not created for this. Decide who will count and who will explain."
 ukraine_politics.545.a:0 "Petro Symonenko will lead the economy, Dudin goes to the Rada."
 ukraine_politics.545.b:0 "Dudin remains minister."
 UKR_osovyi:0 "Hryhoriy Osovyi"
 UKR_volynets:0 "Mykhailo Volynets"
 UKR_symonenko:0 "Petro Symonenko"
 UKR_hopko:0 "Hanna Hopko"
 UKR_ryaboshapka:0 "Ruslan Riaboshapka"
 UKR_kasko:0 "Vitaliy Kasko"
 UKR_lyashko:0 "Oleh Lyashko"
 UKR_left_team_narrow:0 "The Social Movement Core"
 UKR_left_team_narrow_desc:0 "A few people from the circle of activists and labour researchers who know how a union works and do not confuse a slogan with a bill. A small team, but without needless arguments in the corridors."
 UKR_left_team_medium:0 "The Left Team"
 UKR_left_team_medium_desc:0 "A historian and a person who worked on reconstruction and procurement join the activists. The team no longer fits in one room, and the number of meetings shows it."
 UKR_left_team_wide:0 "A Wide Left Coalition in the Ministries"
 UKR_left_team_wide_desc:0 "Activists, scholars and reformist deputies in ministries and agencies. They rarely agree with each other and even more rarely with Bankova, but society, stability and the fight against poverty gain noticeably more."
 # Block 3, the left (DESIGN.md, 8.2)
 UKR_l_left_coalition:0 "The Left Coalition"
 UKR_l_left_coalition_desc:0 "The second term rests on the left wing of the Rada: social democrats, green leftists and trade-union deputies. Labour lawyer Vitaliy Dudin of Sotsialnyi Rukh becomes Minister of Social Policy and Labour. Capital is nervous, and for the first time in years the Rada feels like the master of the house. For Bankova this is calculation, not conviction: the president chooses the pillar that is strongest at the moment."
 UKR_l_union_alliance:0 "Alliance with the Unions"
 UKR_l_union_alliance_desc:0 "Trade unions are the only mass organisation present in every town and every plant. The government sits down with them as partners, not petitioners."
 UKR_l_labour_code:0 "The Labour Code"
 UKR_l_labour_code_desc:0 "The old code dates back to Soviet times; the drafts of new ones were dictated by employers. Now we write our own: wages, leave, protection from dismissal."
 UKR_l_welfare_state:0 "The Welfare State"
 UKR_l_welfare_state_desc:0 "Pensions, hospitals, schools and housing are not «expenses» but the foundation on which the country will survive a war. The budget will feel it."
 UKR_l_oligarch_audit:0 "Audit of Oligarch Assets"
 UKR_l_oligarch_audit_desc:0 "Before taking anything, one must know who owns what. A state audit examines how plants, mines and grids were privatised."
 UKR_l_strategic_sectors:0 "Nationalise the Strategic Sectors"
 UKR_l_strategic_sectors_desc:0 "Steel, energy, oil and chemicals are the sectors without which there is no surviving a war. The state takes control of them. The owners promise to sue, and Brussels frowns."
 UKR_l_cooperative_sector:0 "The Cooperative Sector"
 UKR_l_cooperative_sector_desc:0 "Some enterprises pass to their workforces. The first years will be hard: learning to run a plant has to happen on the go."
 UKR_l_army_not_for_oligarchs:0 "An Army Not for the Oligarchs"
 UKR_l_army_not_for_oligarchs_desc:0 "ATO veterans say it plainly: fight for the homeland, yes; for someone else's factories, no. The army receives social guarantees, and the soldier the knowledge that he defends his own."
 UKR_l_veteran_cooperatives:0 "Veteran Cooperatives"
 UKR_l_veteran_cooperatives_desc:0 "Veterans receive land, workshops and credit to work together. Those who held the line shoulder to shoulder run their business the same way."
 UKR_l_union_territorial_defense:0 "Union Territorial Defence"
 UKR_l_union_territorial_defense_desc:0 "Factory territorial defence cells are organised through the unions: people know each other, know the shops and know what they are defending."
 UKR_l_social_democracy:0 "Social Democracy"
 UKR_l_social_democracy_desc:0 "The path of the unions and socialists: a strong welfare state within a market economy, a Ukrainian take on the «Nordic model». Europe understands and approves."
 UKR_l_self_management:0 "Self-Management"
 UKR_l_self_management_desc:0 "The path of the anarchists and independent unions: workers' councils, cooperatives and local self-organisation. The economy starts slower, but a society that can organise itself is hard to break."
 UKR_l_orthodox_left:0 "The Orthodox Left"
 UKR_l_orthodox_left_desc:0 "The path of the radical communists: party discipline, planning and a firm hand. Fast and effective, but too much of this language sounds like it came from Moscow."
 UKR_l_social_dialogue:0 "Tripartite Social Dialogue"
 UKR_l_social_dialogue_desc:0 "The government, the unions and employers negotiate at one table. The Rada and Bankova stop their tug-of-war and sit side by side."
 UKR_l_welfare_economy:0 "The Welfare Economy"
 UKR_l_welfare_economy_desc:0 "The result of the economic reforms: oligarchic capitalism gives way to a market economy with strong social guarantees."
 UKR_l_workers_councils_focus:0 "Workers' Councils"
 UKR_l_workers_councils_focus_desc:0 "Workforce councils receive real power in enterprises and communities. Union territorial defence becomes popular self-defence."
 UKR_l_cooperative_economy:0 "The Cooperative Economy"
 UKR_l_cooperative_economy_desc:0 "The result of the economic reforms: workforces instead of oligarchs, cooperatives instead of holdings."
 UKR_l_party_line:0 "The Party Line"
 UKR_l_party_line_desc:0 "Discipline above debate. Decisions are made quickly, dissenters leave. The socialists are unhappy, but nobody asks them."
 UKR_l_gosplan:0 "Gosplan 2.0"
 UKR_l_gosplan_desc:0 "The result of the economic reforms: the nationalised sectors are brought together under a single state plan. It works fast, for as long as it works."
 UKR_l_republic_of_labour:0 "The Republic of Labour"
 UKR_l_republic_of_labour_desc:0 "Oligarchic Ukraine is a thing of the past. The country that meets the war belongs to those who work and fight. The chosen path decided what it has become."
 UKR_dudin:0 "Vitaliy Dudin"
 UKR_capital_flight:0 "Capital Flight"
 UKR_capital_flight_desc:0 "Investors dislike the word «nationalisation». Some money leaves the country, and construction slows."
 UKR_union_partnership:0 "Partnership with the Unions"
 UKR_union_partnership_desc:0 "The unions are partners of the government. Strikes are rare because issues are settled earlier."
 UKR_welfare_state:0 "The Welfare State"
 UKR_welfare_state_desc:0 "The state takes on pensions, healthcare and housing. Expensive, but people know what they are holding on to."
 UKR_state_sector:0 "The State Sector"
 UKR_state_sector_desc:0 "The strategic sectors are under state control. Production grows, foreign partners are wary."
 UKR_cooperative_sector:0 "Cooperative Sector: Early Years"
 UKR_cooperative_sector_desc:0 "Workforces are learning to run their enterprises. For now there are more meetings than products."
 UKR_cooperative_sector_mature:0 "The Cooperative Sector"
 UKR_cooperative_sector_mature_desc:0 "The cooperatives have matured: the workers know their business and hold on to their enterprise."
 UKR_army_not_for_oligarchs:0 "An Army Not for the Oligarchs"
 UKR_army_not_for_oligarchs_desc:0 "The soldier knows he defends his own land and his own people, not someone else's assets."
 UKR_veteran_cooperatives:0 "Veteran Cooperatives"
 UKR_veteran_cooperatives_desc:0 "The veterans work together and are ready to return to the ranks together."
 UKR_union_territorial_defense:0 "Union Territorial Defence"
 UKR_union_territorial_defense_desc:0 "Factory territorial defence units organised through the unions."
 UKR_peoples_self_defense:0 "Popular Self-Defence"
 UKR_peoples_self_defense_desc:0 "Workers' councils and communities organise the defence of their own towns and plants."
 UKR_nordic_model:0 "The «Nordic Model»"
 UKR_nordic_model_desc:0 "A welfare state, strong unions and agreements instead of conflicts. Brussels understands this."
 UKR_workers_councils:0 "Workers' Councils"
 UKR_workers_councils_desc:0 "Decisions are made from below. Slowly, but people stand by them."
 UKR_party_discipline:0 "Party Discipline"
 UKR_party_discipline_desc:0 "A firm line and no debate. Effective, but partners in the West look on with suspicion."
 UKR_red_doubt:0 "«Who Are We Fighting?»"
 UKR_red_doubt_desc:0 "Part of the left doubts whether the country should fight a «red» Russia. Kremlin propaganda adds fuel to the fire. The doubts grow with the strength of the orthodox wing in the coalition: the stronger it is, the louder the question. The communists and the Union of Left Forces rise, Servant of the People loses. In war, fatigue grows along with the doubts."
 UKR_republic_of_labour:0 "The Republic of Labour"
 UKR_republic_of_labour_desc:0 "The country belongs to those who work and fight."
 UKR_social_contract:0 "The Social Contract"
 UKR_social_contract_desc:0 "The left coalition government negotiates with the unions, takes strategic assets from the oligarchs and builds a welfare state. Power is shared between the Rada and Bankova, and the balance shows who is stronger right now.\n\n§YLeft groups in the coalition:§!\nTrade unions: §Y[?UKR_lf_unions|0]§!\nSocialists: §Y[?UKR_lf_socialists|0]§!\nAnarchists: §Y[?UKR_lf_anarchists|0]§!\nRadical communists: §Y[?UKR_lf_communists|0]§!"
 UKR_lc_collective_agreements:0 "Sectoral Collective Agreements"
 UKR_lc_collective_agreements_desc:0 "Unions and employers sign sector-wide agreements: wages, shifts, workplace safety."
 UKR_lc_progressive_tax:0 "Progressive Taxation"
 UKR_lc_progressive_tax_desc:0 "The flat rate becomes a thing of the past: those who earn more pay more. The wealthy regions are unhappy."
 UKR_lc_veteran_housing:0 "Land and Housing for ATO Veterans"
 UKR_lc_veteran_housing_desc:0 "A promise made for years is finally kept: veterans receive land and flats."
 UKR_lc_workers_cooperative:0 "A Workers' Cooperative at the Plant"
 UKR_lc_workers_cooperative_desc:0 "One more enterprise passes to its workforce."
 UKR_lc_nationalize_metinvest:0 "Nationalise Metinvest (Akhmetov)"
 UKR_lc_nationalize_metinvest_desc:0 "The steelworks of Rinat Akhmetov's group come under state control. The owner promises to challenge the decision in international courts."
 UKR_lc_nationalize_dtek:0 "Nationalise DTEK (Akhmetov)"
 UKR_lc_nationalize_dtek_desc:0 "The power plants and grids of Rinat Akhmetov's energy holding pass to the state. Tariffs are frozen, the shareholders are outraged."
 UKR_lc_nationalize_ukrnafta:0 "Nationalise Ukrnafta and Ukrtatnafta"
 UKR_lc_nationalize_ukrnafta_desc:0 "The state takes full control of oil production and the Kremenchuk refinery, run for years by managers of the Privat group. The group calls it a raid."
 UKR_lc_nationalize_ostchem:0 "Nationalise the Nitrogen Plants and Oblgazes (Firtash)"
 UKR_lc_nationalize_ostchem_desc:0 "The chemical plants and regional gas networks linked to Dmytro Firtash pass to the state. His lawyers are preparing lawsuits."
 UKR_lc_nationalize_media:0 "Nationalise the Oligarch TV Channels"
 UKR_lc_nationalize_media_desc:0 "1+1, Inter and the StarLightMedia channels pass into public ownership. The oligarchs lose their mouthpiece, and Bankova gains a new one. Journalists are alarmed."
 UKR_lc_general_strike:0 "General Strike"
 UKR_lc_general_strike_desc:0 "The unions bring people onto the streets to remind Bankova who the coalition rests on."
 UKR_lc_presidential_decree:0 "Presidential Decree"
 UKR_lc_presidential_decree_desc:0 "The President's Office settles the issue by decree without waiting for the Rada. Fast, but the allies will remember."
 UKR_left_dualism_balance:0 "Dual Power: the Rada and Bankova"
 UKR_left_dualism_balance_desc:0 "The president won, but governs relying on the left coalition in the Rada. Who is stronger, parliament with the unions or the President's Office?"
 UKR_bop_rada:0 "The Rada and the Unions"
 UKR_bop_bankova:0 "Bankova"
 UKR_bop_compromise:0 "A Working Compromise"
 UKR_bop_rada_leads:0 "The Rada Leads"
 UKR_bop_rada_dominates:0 "The Parliamentary Majority Dictates"
 UKR_bop_rada_takes_government:0 "The Rada Takes the Government"
 UKR_bop_bankova_leads:0 "Bankova Leads"
 UKR_bop_bankova_dominates:0 "The President's Office Vertical"
 UKR_bop_coalition_breaking:0 "The Coalition on the Brink"
 UKR_left_dualism_start_tt:0 "Unlocks the §YDual Power: the Rada and Bankova§! balance."
 UKR_lf_unions_up_tt:0 "The §Gtrade unions§! grow stronger in the coalition."
 UKR_lf_socialists_up_tt:0 "The §Gsocialists§! grow stronger in the coalition."
 UKR_lf_anarchists_up_tt:0 "The §Ganarchists§! grow stronger in the coalition."
 UKR_lf_communists_up_tt:0 "The §Gradical communists§! grow stronger in the coalition."
 UKR_lf_radicals_up_tt:0 "The §Ganarchists§! and §Gradical communists§! grow stronger in the coalition."
 UKR_lf_all_down_tt:0 "All left groups in the coalition §Rgrow weaker§!."
 UKR_oligarch_audit_tt:0 "Unlocks §Ynationalisation§! decisions in «The Social Contract»."
 UKR_european_influence_down_tt:0 "European influence §Rdecreases§!."
 UKR_european_influence_up_tt:0 "European influence §Gincreases§!."
 UKR_russian_influence_up_tt:0 "Russian influence §Rincreases§!."
 UKR_cooperative_sector_tt:0 "In a year the cooperatives will §Gmature§!."
 UKR_social_democracy_req_tt:0 "Trade unions or socialists at §Y30§! or more."
 UKR_self_management_req_tt:0 "Anarchists at §Y30§! or more."
 UKR_orthodox_left_req_tt:0 "Radical communists at §Y30§! or more."
 UKR_general_strike_req_tt:0 "Trade unions at §Y40§! or more."
 ukraine_politics.500.t:0 "The Left Coalition"
 ukraine_politics.500.d:0 "The new government is presented to the Rada. The Ministry of Social Policy and Labour is headed by Vitaliy Dudin, a lawyer who spent years defending workers in court and one of the founders of Sotsialnyi Rukh. Left-wing deputies give a standing ovation, business associations write open letters. For the first time in thirty years the government talks not about the «investment climate» but about wages. In the Office this is called “adaptive tactics”: when the voter changes, the agenda changes too."
 ukraine_politics.500.a:0 "Time to get to work."
 ukraine_politics.501.t:0 "Congress of the Left"
 ukraine_politics.501.d:0 "Everyone who calls themselves left has gathered in the Trade Unions House in Kyiv: FPU functionaries in suits, socialists with laptops, anarchists in hoodies and a few elderly communists with red folders. They will never agree on everything. But the government has to decide whose voice will be loudest in the coalition."
 ukraine_politics.501.a:0 "The unions are our foundation."
 ukraine_politics.501.b:0 "The socialists write the programme."
 ukraine_politics.501.c:0 "The anarchists know how to organise people."
 ukraine_politics.501.e:0 "The communists are disciplined."
 ukraine_politics.502.t:0 "The Labour Code in the Rada"
 ukraine_politics.502.d:0 "The draft of the new Labour Code is put to a vote. The unions demand that everything stays: the forty-hour week, protection from dismissal, collective agreements. Employers warn that business will go into the shadows. The votes need a compromise, or resolve."
 ukraine_politics.502.a:0 "Adopt the unions' code."
 ukraine_politics.502.b:0 "Find a compromise with business."
 ukraine_politics.503.t:0 "The FPU's Property"
 ukraine_politics.503.d:0 "Journalists publish an investigation: according to the media, over recent years the Federation of Trade Unions has sold off dozens of sanatoriums, holiday homes and buildings below market price. FPU head Hryhoriy Osovyi calls the publication an attack on the trade union movement. The independent KVPU unions led by Mykhailo Volynets demand an audit. A government that has bet on the unions must choose which of them it talks to."
 ukraine_politics.503.a:0 "Reform the FPU together with the independent unions."
 ukraine_politics.503.b:0 "Come to terms with the FPU leadership."
 ukraine_politics.504.t:0 "Brussels Is Concerned"
 ukraine_politics.504.d:0 "The European Commission expresses «serious concern» over the nationalisation and recalls the investment protection clauses of the Association Agreement. The European left, by contrast, sends letters of welcome. The EU ambassador asks for a meeting «at the earliest convenient time», that is, tomorrow morning."
 ukraine_politics.504.a:0 "Explain: it is a temporary wartime measure."
 ukraine_politics.504.b:0 "Our plants are our business."
 ukraine_politics.505.t:0 "The Cooperative Elects a Director"
 ukraine_politics.505.d:0 "At the first general meeting of a former engineering plant, the workers elected a director by secret ballot. It was... the old director. «At least he knows where the warehouse keys are», a welder explains to journalists. The director, who spent thirty years working «for the owner», now reports to the shop floor and seems pleased for the first time in years."
 ukraine_politics.505.a:0 "Democracy is democracy."
 ukraine_politics.505.b:0 "What matters is not who, but how."
 ukraine_politics.506.t:0 "A Monument or a Union"
 ukraine_politics.506.d:0 "The Institute of National Memory demands the removal of a Soviet mosaic from the facade of a trade-union Palace of Culture: under the decommunisation law it bears prohibited symbols. Left activists form a human chain: the mosaic, they say, was made by workers, not by the regime. Right-wing organisations promise to come and «help with the dismantling». The cabinet has to decide before the weekend."
 ukraine_politics.506.a:0 "The law is the law: take it down."
 ukraine_politics.506.b:0 "Cover the symbols and put up a plaque with context."
 ukraine_politics.506.c:0 "Leave it as it is."
 ukraine_politics.507.t:0 "Two Calls to Arms"
 ukraine_politics.507.d:0 "The left and the nationalists recruit in the same place: among ATO veterans and young men from industrial towns. One side calls them into «battalions without oligarchs», the other into veteran councils. The enlistment offices are confused, and social media is full of mutual accusations. The Ministry of Defence asks the government to restore order."
 ukraine_politics.507.a:0 "Joint veteran councils for everyone."
 ukraine_politics.507.b:0 "Back the left battalions."
 ukraine_politics.507.c:0 "Give way to the nationalists."
 ukraine_politics.508.t:0 "The Rada Takes the Government"
 ukraine_politics.508.d:0 "The left majority in the Rada no longer wants to wait for the president's decrees. A bill on the transition to a parliamentary republic is ready: the Rada forms the government, while the president remains guarantor and commander-in-chief. The coalition has the votes. The president has one last chance to respond."
 ukraine_politics.508.a:0 "Let parliament run the country."
 ukraine_politics.508.b:0 "Defend the powers of the president."
 ukraine_politics.509.t:0 "The Coalition on the Brink"
 ukraine_politics.509.d:0 "The left factions are tired of learning about government decisions from the President's Office Telegram channels. A joint statement bears the signatures of the unions, the socialists and even the cautious social democrats: either Bankova returns real powers to the Rada, or there is no more coalition."
 ukraine_politics.509.a:0 "Yield to the Rada."
 ukraine_politics.509.b:0 "Buy off part of the faction."
 ukraine_politics.510.t:0 "«Who Are We Fighting?»"
 ukraine_politics.510.d:0 "Russian TV channels enthusiastically show Ukrainian communists: «fraternal left-wing Ukraine will soon understand where its true friends are». Kremlin propaganda is crude, but some radical leftists start asking out loud whether it is worth fighting a Russia now ruled by the Communist Party. The army and the veterans watch the government with alarm."
 ukraine_politics.510.a:0 "We are fighting an aggressor, not a flag."
 ukraine_politics.510.b:0 "Crush the defeatism hard."
 ukraine_politics.511.t:0 "Huliaipole Fest"
 ukraine_politics.511.d:0 "The first self-management festival is held in Nestor Makhno's birthplace. Lectures on cooperatives, a craft fair, a beard contest and a reconstructed tachanka permanently guarded by the police. The locals are pleased: tourists have come to the town for the first time in years. Political scientists argue whether it is a festival or a party congress."
 ukraine_politics.511.a:0 "Let them have fun."
 ukraine_politics.511.b:0 "As long as nobody steals the tachanka."
 ukraine_politics.512.t:0 "The Cooperatives Mature"
 ukraine_politics.512.d:0 "Service event."
 # Block 3, the left: narrative events 520-534
 ukraine_politics.520.t:0 "The Pavlohrad Miners"
 ukraine_politics.520.d:0 "The miners of Pavlohrad refuse to come to the surface until their wage arrears are paid. The mining settlements remember July 1989: a strike that began in the Kuzbass engulfed the whole of Donbas within days, and hundreds of thousands of miners for the first time openly demanded from Moscow not only soap and wages but political change. Two years later the Soviet Union was gone. Ever since, a miner's helmet in Ukraine has been a symbol that patience underground is not endless."
 ukraine_politics.520.a:0 "The government steps in as mediator."
 ukraine_politics.520.b:0 "This is a dispute between workers and employer."
 ukraine_politics.521.t:0 "Kryvorizhstal: The Story of One Privatisation"
 ukraine_politics.521.d:0 "The ArcelorMittal Kryvyi Rih union demands wage indexation, and the TV channels show the old footage again. In 2004 the country's largest steelworks was sold to a consortium of Rinat Akhmetov and Viktor Pinchuk for roughly 800 million dollars. After the Orange Revolution the deal was cancelled, and in 2005 a repeat auction broadcast live was won by Mittal Steel, this time for 4.8 billion. For many Ukrainians it was the first lesson in what a country sold off among acquaintances is really worth."
 ukraine_politics.521.a:0 "Back the union's demands."
 ukraine_politics.521.b:0 "Do not scare off the largest investor."
 ukraine_politics.522.t:0 "Makhno in the Textbook"
 ukraine_politics.522.d:0 "The Ministry of Education is debating a new school history textbook. The dispute is over Nestor Makhno: in Soviet books he was a bandit, in the textbooks of the 1990s he barely featured. Yet in 1918-1921 his Revolutionary Insurgent Army controlled much of the south, and around Huliaipole a «free territory» existed with councils and communes and no state authority. Makhno fought the Whites, then the Reds, then the Hetmanate, and in the end lost to them all."
 ukraine_politics.522.a:0 "A complex figure: let the pupils argue."
 ukraine_politics.522.b:0 "One paragraph will do."
 ukraine_politics.523.t:0 "The Solidarity Kitchen"
 ukraine_politics.523.d:0 "In an industrial zone on the outskirts of Kyiv an anarchist collective has opened a free canteen for ATO veterans and their families. By day it feeds people, by evening it repairs radios and packs first-aid kits for those still serving. Above the entrance hang a black-and-red flag and a sign: «No gods, no masters, no hungry». Veterans who have never read Kropotkin come for the borscht and stay to help. The police have dropped in twice: both times they ate lunch and left."
 ukraine_politics.523.a:0 "A good deed needs no permit."
 ukraine_politics.524.t:0 "May Day"
 ukraine_politics.524.d:0 "On the first of May, trade-union columns march down Khreshchatyk with industry banners, socialists carry placards about wages, and a small group of anarchists brings drums. The holiday was born from the Chicago strike of 1886 for the eight-hour day, became a parade with reviewing stands in the Soviet Union, and after 1991 turned into a barbecue day. For the first time in years it is not only pensioners marching. On the next street, a right-wing counter-picket: «May Day is a Soviet relic»."
 ukraine_politics.524.a:0 "The ministers join the march."
 ukraine_politics.524.b:0 "The government congratulates everyone who works."
 ukraine_politics.525.t:0 "The Zarobitchany"
 ukraine_politics.525.d:0 "By estimates, three to five million Ukrainians work abroad: on Polish building sites, in Czech factories, in Italian kitchens. They send home more than ten billion dollars a year, more than all direct foreign investment in the country. The word «zarobitchany» has been familiar to Ukrainians since the 19th century, when Galician peasants left to earn money in Canada and America. The Ministry of Social Policy proposes a return programme: grants for a business and housing."
 ukraine_politics.525.a:0 "Call people home."
 ukraine_politics.525.b:0 "Remittances from abroad keep the economy afloat."
 ukraine_politics.526.t:0 "The Cooperative Against the Agroholding"
 ukraine_politics.526.d:0 "In the Poltava region, farmers have pooled their land shares into a cooperative and refused to renew the lease of a large agroholding that farms hundreds of thousands of hectares across the country. The land market opened only in 2021, after twenty years of moratorium, and now the village is deciding what it wants to be: owners or landlords. The agroholding offers double rent per share. The cooperative needs machinery and credit."
 ukraine_politics.526.a:0 "Give the cooperative a soft loan."
 ukraine_politics.526.b:0 "Let the market decide."
 ukraine_politics.527.t:0 "The Left and the Memory of the Holodomor"
 ukraine_politics.527.d:0 "On the fourth Saturday of November, deputies of the left coalition come to the memorial to the victims of the Holodomor. The famine of 1932-1933 was the result of forced collectivisation and grain requisitioning; Ukraine recognised it as a genocide of the Ukrainian people in 2006. For the Ukrainian left this is not someone else's subject: Sotsialnyi Rukh recalls that Stalinism destroyed both the peasants and those who believed in socialism. Candles burn in windows across the country."
 ukraine_politics.527.a:0 "We remember."
 ukraine_politics.528.t:0 "Berezil and the Executed Renaissance"
 ukraine_politics.528.d:0 "A Kharkiv theatre revives Mykola Kulish's «Myna Mazailo» staged from the notes of Les Kurbas. In the 1920s Kurbas and his Berezil theatre were the heart of the Ukrainian avant-garde: writers and directors believed the revolution would bring both social justice and a flowering of Ukrainian culture. In 1937 Kurbas and Kulish were shot at Sandarmokh together with hundreds of others. This generation is called the Executed Renaissance. The premiere is sold out."
 ukraine_politics.528.a:0 "Culture is memory too."
 ukraine_politics.529.t:0 "Wages in an Envelope"
 ukraine_politics.529.d:0 "The tax service and the unions jointly publish a study: by their estimate, one in three workers in the country receives part of their wages «in an envelope». The employer saves on taxes, the worker on a pension that will later not exist. The custom has survived every reform since the 1990s, when «black» wages were the only way to survive. The government decides how to fight the shadow economy: carrot or stick."
 ukraine_politics.529.a:0 "An amnesty for those who come out of the shadows."
 ukraine_politics.529.b:0 "Inspections at every enterprise."
 ukraine_politics.530.t:0 "Couriers Against the Platform"
 ukraine_politics.530.d:0 "Delivery couriers in Kyiv switch off their apps and line up their bikes in front of the company's office: rates have been cut again, and under their contracts they are not employees but «partners» with no leave and no insurance. In Europe courts are already recognising such couriers as employees. For the first time, the unions try to organise people who have neither a workshop nor a shift supervisor, only a rating on their phone."
 ukraine_politics.530.a:0 "A law on platform work."
 ukraine_politics.530.b:0 "Flexible work is freedom."
 ukraine_politics.531.t:0 "«Be Like Nina»"
 ukraine_politics.531.d:0 "Nurses from district hospitals are picketing again. The «Be Like Nina» medical workers' movement, which emerged in 2020, demands the salaries it was promised: the healthcare reform switched hospitals to «money follows the patient», and in small towns there is not enough money for staff. A nurse with thirty years' experience earns less than a courier. The pickets are quiet, but they are in every district centre."
 ukraine_politics.531.a:0 "Raise medical salaries."
 ukraine_politics.531.b:0 "Promise it in the next budget."
 ukraine_politics.532.t:0 "The Arsenal, January 1918"
 ukraine_politics.532.d:0 "The Mystetskyi Arsenal opens an exhibition on the January Uprising of 1918. Workers of Kyiv's Arsenal plant rose against the Central Rada in support of the advancing Bolsheviks; the uprising was crushed by the Sich Riflemen and the Free Cossacks, and in the same days students defending Kyiv fell at Kruty. Visitors walk through halls where shots were fired a century ago and argue: workers against a national government, a tragedy of classes or a tragedy of the nation?"
 ukraine_politics.532.a:0 "History is never simple."
 ukraine_politics.533.t:0 "The Last Mines of Volhynia"
 ukraine_politics.533.d:0 "The state mines of the Lviv-Volyn coal basin have been losing money for decades: they were opened in the 1950s, and coal here has long been dearer than imports. Closing them means leaving whole towns like Novovolynsk and Chervonohrad without work. European partners offer a «just transition» programme: retraining miners and new industries in place of the old mines. The miners' union is ready to talk, but not about closure «starting Monday»."
 ukraine_politics.533.a:0 "A just transition: work first, closure later."
 ukraine_politics.533.b:0 "Close the loss-making mines now."
 ukraine_politics.534.t:0 "Protasiv Yar"
 ukraine_politics.534.d:0 "Building fences have appeared again on the slopes of Protasiv Yar in Kyiv. A few years ago residents and activists, from pensioners to anarchists, blocked the construction of high-rises here by keeping watch on the slopes for weeks until a court cancelled the permits. Now the developer has new documents. Kyiv is being built up faster than it can debate, and for many city dwellers the fight for the park is their only experience of beating money."
 ukraine_politics.534.a:0 "The park stays a park."
 ukraine_politics.534.b:0 "The city needs housing."
 #Block 1 chronicle (2020-2022), batch 1
 ukraine.303.t:0 "Honcharuk's Tapes"
 ukraine.303.d:0 "On January 17 audio recordings of government meetings appear online. According to those who published them, Prime Minister Oleksiy Honcharuk discusses with colleagues how deeply the president understands economics, and is far from delighted. Honcharuk insists the recordings were stitched together from different pieces and taken out of context, but just in case he submits his resignation. Who recorded the conversations in the prime minister's office, and why, is the most popular question of the week.\n\nNow it is up to the president: accept the resignation and dissolve a cabinet not yet five months old, or give the young prime minister 'one more chance'. In the Rada they are already naming possible successors, and in the government they are very diligently discussing nothing but the budget."
 ukraine.303.a:0 "Accept the resignation and form a new cabinet."
 ukraine.303.b:0 "Do not accept it, let them work and we will see."
 ukraine.304.t:0 "A New Prime Minister"
 ukraine.304.d:0 "On March 4 the Rada votes to dismiss Oleksiy Honcharuk and appoints Denys Shmyhal, the former governor of Ivano-Frankivsk Oblast and a deputy prime minister, as prime minister. One hundred and eighty-eight days is one of the shortest terms in the history of Ukrainian governments, but nobody has time to mark it: the nameplates in ministerial offices are being changed, and at the Ministry of Defence the reformer Andriy Zahorodniuk is replaced by Andriy Taran.\n\nThe new prime minister promises not to talk but to work. He does not yet know that March 2020 will turn out to be the worst possible month for any promises, because something very contagious is coming into the world."
 ukraine.304.a:0 "Get to work."
 ukraine.302.t:0 "Bohdan Leaves, Yermak Arrives"
 ukraine.302.d:0 "On February 11 two decrees appear one after another on the president's website: Andriy Bohdan is relieved as head of the Office, and Andriy Yermak is appointed in his place. Bohdan, a lawyer whom the press links to the circle of Ihor Kolomoisky, had been seen at every important meeting until the last moment. Yermak is a film producer and lawyer, a long-time acquaintance of the president, who spent recent months on Donbas and talks with Moscow.\n\nIn the Office they call it 'assembling a team', in the corridors a victory of one group over another. Now it must be decided what the Office should be in a year when the country does not yet know what awaits it: a vertical with one centre, or an Office with specialised deputies and public rules."
 ukraine.302.a:0 "One Office, one vertical, one person who decides."
 ukraine.302.b:0 "Yermak leads, but the Office gets specialised deputies and rules."
 ukraine.402.t:0 "Novi Sanzhary"
 ukraine.402.d:0 "On February 20 a plane with people evacuated from Wuhan lands in Kharkiv: 45 Ukrainians and 27 foreigners from several countries who must spend two weeks apart from the rest of the country. The sanatorium in Novi Sanzhary in the Poltava region was chosen only the day before, and that is exactly the problem: locals learn about the guests from the news and chats, not from the authorities. By evening tyres are burning at the entrance, the road is blocked, and stones are flying at the buses.\n\nA three-hour drive turns into a nine-hour one. The buses move in a column under police escort, ten police officers are injured, about thirty locals are detained. While the column crawls towards the sanatorium, an 'official memo of the Ministry of Health' about infected evacuees spreads through the messengers. The ministry calls it a forgery, but a denial always travels slower than a rumour, especially along a night road with burning tyres.\n\nIt will later turn out that the evacuees are healthy, and that they spend two weeks in the sanatorium more quietly and calmly than everything around them. But for the country it is the first lesson of the epidemic: people fear not only the disease but also decisions being made without them. Now it is necessary to show how the authorities talk to a frightened town."
 ukraine.402.a:0 "Go there in person and talk to the people."
 ukraine.402.b:0 "Reinforce the police and close the road."
 ukraine.402.c:0 "Leave it to the Ministry of Health and local authorities."
 ukraine.403.t:0 "Fire Near Chornobyl"
 ukraine.403.d:0 "On April 4-5 dry grass and rubbish catch fire near the village of Rahivka next to the exclusion zone, and the wind does the rest: within days forests inside the zone are burning, the fire approaches radioactive waste storage sites, and smoke covers Kyiv, so that the capital's air briefly becomes one of the dirtiest in the world. Background radiation in the zone temporarily rises, in Kyiv it stays normal. Police detain a 27-year-old resident of a neighbouring village who admits to setting the grass on fire.\n\nBut the main question is not who threw the match. It is why, thirty-four years after the accident, the forestry, the rescuers and the zone administration cannot agree on who is responsible for what. The fire will be put out, the rest is a matter of reputation and, incidentally, of breathing."
 ukraine.403.a:0 "Send in the Emergency Service and the army and close the zone to everyone."
 ukraine.403.b:0 "Name the culprits: the arsonist, the forestry and the zone management."
 ukraine.403.c:0 "Assure everyone that radiation is normal and all is under control."
 ukraine_economy.208.t:0 "IMF Money"
 ukraine_economy.208.d:0 "On June 9 the IMF Executive Board approves an 18-month, five-billion-dollar stand-by programme for Ukraine. The first tranche, about two billion, arrives at once and is needed like air: a pandemic, collapsed exports and a hole in the budget. The main condition was met back in May: the Rada passed a law that prevents former owners of nationalised banks from getting them back through the courts.\n\nNow the question is whether the law will withstand the pressure. It has influential opponents, and the former owner of PrivatBank, Ihor Kolomoisky, by all accounts does not intend to give up. It must be decided how firmly to hold the line when the next tranche depends on the words 'independence of the National Bank'."
 ukraine_economy.208.a:0 "Hold the line and touch neither the independence of the National Bank nor the banking law."
 ukraine_economy.208.b:0 "Sign, but keep some room for manoeuvre."
 ukraine_economy.209.t:0 "Smolii Resigns"
 ukraine_economy.209.d:0 "On July 1 the head of the National Bank Yakiv Smolii submits his resignation and explains it by systematic political pressure. According to the media, it concerns both the dispute around PrivatBank and displeasure with interest rate policy. The Rada accepts the resignation on July 3. The IMF is silent, but everyone understands that this silence is expensive: the programme rests on the independence of the regulator, and in the middle of a crisis the regulator is left without a head.\n\nBy mid-July two likely candidates are being discussed in Kyiv. First Deputy Governor Serhiy Nikolaychuk is a professional from the inside, known to the market and the IMF mission for years. The head of the state-owned Ukrgasbank Kyrylo Shevchenko is a banker whom the Office knows better than the market does. IMF Managing Director Kristalina Georgieva meanwhile calls the president: the independence of the National Bank is a condition of the programme, not a wish."
 ukraine_economy.209.a:0 "Name Serhiy Nikolaychuk: a professional from the inside and calm for the IMF."
 ukraine_economy.209.b:0 "Name Kyrylo Shevchenko: a banker the Office finds easier to work with."
 ukraine.503.t:0 "Wagnergate"
 ukraine.503.d:0 "On July 29 near Minsk 33 Russians are detained whom the Belarusian side calls fighters of the Wagner PMC who came to destabilise the presidential campaign. A few days later an awkward detail emerges: Ukraine is involved in this story. According to journalists, the special services had been preparing the operation for months: to lure Wagner fighters who had fought in Donbas to a territory where they could be detained and tried. Something went wrong at the final stage.\n\nMinsk demands explanations, Moscow demands its people back, and Kyiv suddenly finds itself in a position it would rather never have been in. It remains to choose: insist on extradition, talk to Minsk quietly, or honestly admit that the operation took place and ended in failure."
 ukraine.503.a:0 "Demand extradition through a note, Interpol and public pressure."
 ukraine.503.b:0 "Talk to Minsk quietly, because the channel matters more than the scandal."
 ukraine.503.c:0 "Admit the operation and begin an internal investigation."
 ukraine.504.t:0 "Belarus Comes to Kyiv"
 ukraine.504.d:0 "After August 9 normal life does not return to Belarus: protests, arrests, searches of offices. For the IT sector, which provides about a fifth of Belarusian exports, this is a signal. By October hundreds of specialists move to Kyiv, followed by entire companies, and one of the relocated startups will later become a 'unicorn'. Ukraine is convenient for them: visa-free entry, a similar language, a five-percent tax for sole proprietors and free seats in coworking spaces in Kyiv, Lviv and Kharkiv.\n\nPolitically the issue is harder. Minsk looks at the 'hunt for IT specialists' without enthusiasm, Moscow with suspicion. On the other hand, several thousand programmers do not ask for loans, they only need clear rules."
 ukraine.504.a:0 "Open the doors to IT people: housing, visa windows and tax holidays."
 ukraine.504.b:0 "Help under the usual rules, without grand gestures."
 ukraine.504.c:0 "Do not interfere, so as not to spoil relations with Minsk."
 ukraine.850.t:0 "Karabakh: The Lesson of Drones"
 ukraine.850.d:0 "On September 27 war begins in Nagorno-Karabakh, and within two weeks it turns into a training film for general staffs. Azerbaijani Bayraktars strike Armenian tanks, radars and air defence systems, and the whole world watches the footage of the hits. For Ukraine, with six years of trench war in Donbas behind it and a contract for Turkish machines, this is neither news nor an abstraction. When Austria's Rotax stops deliveries of engines for Bayraktars, the Turks begin to look closely at Ukraine's Ivchenko-Progress and Motor Sich.\n\nIn the General Staff they argue about what to do with the lesson: buy more and faster, make our own, or observe, because a drone without trained operators and tactics remains just an expensive toy."
 ukraine.850.a:0 "Speed up purchases and servicing along the Turkish line."
 ukraine.850.b:0 "Build our own: design bureaus, engines and the Leleka."
 ukraine.850.c:0 "Watch and learn, buying only what is needed today."
 #Block 1 chronicle ideas
 UKR_last_chance_cabinet:0 "Cabinet on Probation"
 UKR_last_chance_cabinet_desc:0 "The prime minister was given a chance, but everyone understands that the chance is short. Ministers work looking over their shoulder at the president, and the president's team looks over its shoulder at the next leak. If the ruling party’s rating falls, stability falls with it."
 UKR_novi_sanzhary_panic:0 "Novi Sanzhary Panic"
 UKR_novi_sanzhary_panic_desc:0 "The tires in Novi Sanzhary have burned out, but the distrust remains. People do not believe they will be warned in advance, and just in case they do not believe those who try to warn them either. The distrust settles slowly every week: stability drains until people see that the state can warn them in time."
 UKR_zone_smoke:0 "Smoke Over Kyiv"
 UKR_zone_smoke_desc:0 "Kyivans spent a week breathing whatever the wind brought from Polissia. Press services insist everything is normal, while air quality apps insist otherwise. Some families who have somewhere else to go are rethinking their plans, and the population grows slower than it could."
 UKR_nbu_pressure:0 "Pressure Around the National Bank"
 UKR_nbu_pressure_desc:0 "The resignation of the regulator's head in the middle of a crisis is not the best recommendation for a borrower. The IMF mission asks questions and the market answers with the exchange rate. Borrowing becomes more expensive, and partners prefer to discuss risks over trade."
 UKR_belarus_tech_wave:0 "Belarus in Kyiv"
 UKR_belarus_tech_wave_desc:0 "Belarusian developers rent offices in Kyiv, Lviv and Kharkiv and bring their clients with them. Coworking spaces are full, landlords quietly raise prices, and together with the IT people come their families, doctors, teachers and cooks, who also create something."
 #Block 1 chronicle opinion modifiers
 ukr_extradition_demand:0 "Extradition Demand"
 ukr_quiet_channel:0 "Quiet Channel"
 ukr_poaching_it:0 "Taking In Techies"
 #Block 1 chronicle (2020-2022), batch 2
 ukraine.406.t:0 "Local Elections and the President's Survey"
 ukraine.406.d:0 "On October 25 Ukraine elects mayors and local councils and at the same time answers five questions from the president: the survey is held right on voting day. OSCE/ODIHR observers will later note that such a move could have given an advantage to the ruling party, and the opposition says so at once, and louder. The result for the Servant of the People is unpleasant: the party does not come first in any large city or any region. The local forces of the mayors win, and in Kyiv Vitali Klitschko leads confidently.\n\nIn the Office they say that local elections are always about people, not parties. But a year ago the Servant of the People took everything, and the difference is too visible not to be noticed. Now it must be decided what to conclude from this: work with the mayors, rebuild the party, or pretend nothing happened."
 ukraine.406.a:0 "Work with the mayors, because decentralization is a resource, not a threat."
 ukraine.406.b:0 "Strengthen the party vertical and draw conclusions."
 ukraine.406.c:0 "Pretend these were only local elections."
 ukraine.405.t:0 "The Constitutional Court Against Declarations"
 ukraine.405.d:0 "On October 27 the Constitutional Court, at the request of 47 deputies, declares the rules on electronic asset declarations unconstitutional: the National Agency on Corruption Prevention loses the right to check declarations, and criminal liability for false data is abolished. With one decision most of the anti-corruption system built since 2014 collapses, and in Brussels and Washington they remind everyone that visa-free travel and money are tied precisely to it. Cases of false declarations are left without an article.\n\nThe president has several paths: respond with force and rebuild the court, seek a lawful solution together with European lawyers, or accept the decision as a given. The question is what is scarier: a court without oversight or a government that decides too quickly how to deal with it."
 ukraine.405.a:0 "Dissolve the court with a bill terminating the powers of all judges."
 ukraine.405.b:0 "Turn to the Venice Commission and seek a lawful solution."
 ukraine.405.c:0 "Accept the court's decision and let the Rada sort it out."
 ukraine.404.t:0 "The President Falls Ill"
 ukraine.404.d:0 "On November 9 Volodymyr Zelensky writes on Telegram that he has tested positive for the coronavirus with a temperature of 37.5, and wishes everyone 36.6. Several officials close to him also fall ill, among them the head of the Office Andriy Yermak, Finance Minister Serhiy Marchenko and Defence Minister Andriy Taran. A few days later the president moves to the Feofania hospital so as not to infect anyone.\n\nFor a country where the second wave is already under way and a weekend quarantine is being introduced in a couple of days, this is more than medical news. People watch how the authorities behave when they themselves fall ill: show where they are being treated, or keep silent. In the Office they argue about how much truth the country is ready to bear."
 ukraine.404.a:0 "Speak openly about the diagnosis, the regime and working from isolation."
 ukraine.404.b:0 "Speak sparingly: feeling well, working - and that is all."
 ukraine.407.t:0 "The Entrepreneurs' Maidan"
 ukraine.407.d:0 "On December 15 thousands of entrepreneurs gather on Independence Square: sole proprietors, owners of cafes, fitness clubs and clothing shops whom the weekend restrictions deprive of income. They demand tax relief and try to pitch tents on the square, the police intervene, and it ends in clashes. The protest is called 'SaveFOP', and it knows how to return: the next big action will be in January.\n\nThe authorities find themselves between two fires: epidemiologists ask not to loosen the quarantine, while people without revenue ask at least not to finish them off. Every option costs someone dearly, and a January lockdown is already being discussed. There is also a fourth road, less spectacular: sit down with the organisers and move tax services for sole proprietors into Diia before they move their revenue into the shadows."
 ukraine.407.a:0 "Allow no tents on the square and keep the restrictions."
 ukraine.407.b:0 "Soften the regime for small business and postpone tax novelties."
 ukraine.407.c:0 "Pay aid to those shut down by the lockdown."
 ukraine.408.t:0 "Vaccines: We Take From Whoever Gives"
 ukraine.408.d:0 "On February 8 the government bans the registration of the Russian vaccine Sputnik V: the law on the 'aggressor state' does not allow medical products to be imported from Russia. Ukraine has no vaccine of its own, no supply agreements for the needed volume either, and hospitals work at the limit. On February 24 vaccination nevertheless starts with half a million doses of India's Covishield, followed by China's CoronaVac and other products.\n\nThe opposition demands to take any vaccine, supporters of the hard line reply that a vaccine from the aggressor state is not medicine but politics. It is for you to decide: which way the country leaves the pandemic and who will have to explain it."
 ukraine.408.a:0 "Buy only WHO-approved vaccines and wait in line without risk."
 ukraine.408.b:0 "Take from whoever gives, meaning Chinese and Indian supplies without politics."
 ukraine.408.c:0 "Ban nothing, let Sputnik in too."
 UKR_local_elections_setback:0 "Local Election Results"
 UKR_local_elections_setback_desc:0 "The Servant of the People did not come first in any large city, and in the Office they are still debating whose fault it is. While they debate, the party loses a little more. The ruling party’s rating drags stability along. Servant of the People loses, European Solidarity picks up the dissatisfied."
 UKR_constitutional_crisis:0 "Constitutional Crisis"
 UKR_constitutional_crisis_desc:0 "The president and the Constitutional Court exchange decrees and statements, and each side is sure the other is breaking the law. Partners in Brussels and Washington watch with growing concern. The harder the president’s line was, the harder the blow. Stability slowly falls every week, and European Solidarity picks up those who stand for the letter of the law."
 UKR_declaration_gap:0 "Declaration Gap"
 UKR_declaration_gap_desc:0 "The article on false declarations is gone and there is nobody to verify declarations. Officials are in no hurry to notice, but partners notice. The gap erodes trust a little every week: stability and partners’ trade confidence decline."
 #Block 1 chronicle (2020-2022), batch 3
 ukraine.310.t:0 "Medvedchuk's Channels"
 ukraine.310.d:0 "The NSDC takes a decision that Zelensky puts into effect that same evening: five-year sanctions against deputy Taras Kozak and three TV channels linked to Viktor Medvedchuk: 112 Ukraine, NewsOne and ZIK. The broadcast cuts off, with 17 of 19 NSDC members voting in favour. The government calls it a response to Russian propaganda. Free speech advocates reply that closing channels without a court decision, even bad ones, is a strange way to defend democracy.\n\nOver several years the channels managed to acquire a reputation. Critics recall talk shows where experts argued about a 'civil war' instead of Russian aggression, tickers promising to 'come to terms with Donbas', and broadcasts in which a vaccine from Moscow looked like salvation and Ukrainian medicine like a sentence. Supporters reply that millions watch these channels, and that the ratings of 112 were no worse than those of state ones. After the ban viewers quickly find the same broadcasts on YouTube, and in the staffs this is called the Streisand effect.\n\nWestern diplomats are generally restrained in their support, while Medvedchuk, head of the political council of OPZZh and Putin's kum, promises to appeal the decision and hints that this is only the beginning. Now it is for you to decide which way the next such case will go."
 ukraine.310.a:0 "Keep using the fast way, since it works."
 ukraine.310.b:0 "Secure the decision through the courts."
 ukraine.310.c:0 "Stop at what has been done."
 ukraine.312.t:0 "Kolomoisky on the List"
 ukraine.312.d:0 "U.S. Secretary of State Antony Blinken publicly names Ihor Kolomoisky as involved in significant corruption during his time as governor of Dnipropetrovsk Oblast and announces that he and his family are barred from entering the United States. The State Department adds that the businessman continues to undermine Ukraine's democratic institutions. For Kyiv this is an awkward moment: according to the media, Kolomoisky's influence reached the very top for years, and PrivatBank, nationalised in 2016, is still being argued over in the courts.\n\nKolomoisky has TV channels, lawyers and connections, and the government has a choice: use the occasion and move on, or cautiously wait to see how it ends. Some of the options are open only to those who have already gone against him: through the banking law, sanctions or checks on the TV channels. The rest can only join in or keep quiet."
 ukraine.312.a:0 "Join the pressure and begin checks on PrivatBank and the group's TV channels."
 ukraine.312.b:0 "Stay neutral, since the US has its decisions and we have our own justice."
 ukraine.311.t:0 "High Treason"
 ukraine.311.d:0 "The Prosecutor General announces a suspicion of high treason against Viktor Medvedchuk and Taras Kozak. According to the investigation, it concerns schemes with the resources of occupied Crimea, passing information on the position of Ukrainian troops, and a project with Russian special services to build a network of agents in Ukraine. A court leaves Medvedchuk under house arrest, the TV channels have been closed for three months, and in Moscow they speak of political repression and summon the ambassador for a talk.\n\nFor the government it is a chance to close the subject, for lawyers a reason to remind everyone of the presumption of innocence, and for intelligence a question of what is worth more: a show trial, a man who may one day be exchanged, or assets that can be frozen. Moscow has already made it clear that relations after this case will be colder than they were, and they were not warm to begin with."
 ukraine.311.a:0 "Take the case to a verdict without deals."
 ukraine.311.b:0 "Keep the case open as leverage."
 ukraine.313.t:0 "The Law on Oligarchs"
 ukraine.313.d:0 "On September 23 the Rada passes the 'law on oligarchs' in a single hour, without waiting for the conclusion of the Venice Commission. An oligarch is anyone who meets three of four criteria: influence on politics, on the media, ownership of monopolies and assets of over 90 million dollars. The decision on inclusion in the register is taken by the NSDC, and those on the list are banned from financing parties and taking part in privatisation. The president will sign the law on November 5, and for now it is called historic and dangerous at the same time.\n\nCritics are sure the law gives the president too much power over business: he decides who is an oligarch and who is not. Supporters reply that they have no other way to protect the country from people who buy politicians together with TV channels. It must be decided what the register will be like."
 ukraine.313.a:0 "Make the register strict and include everyone who meets the criteria."
 ukraine.313.b:0 "Keep the register soft, as a pressure tool instead of mass inclusions."
 ukraine.313.c:0 "Wait for the conclusion of the Venice Commission."
 ukraine.314.t:0 "Pandora Papers"
 ukraine.314.d:0 "On October 3 in Kyiv the film 'Offshore 95' by Slidstvo.info journalists is screened, made from the Pandora Papers materials. According to the journalists, the offshore network around the Kvartal 95 studio, owned by Zelensky and his partners, has existed since 2012, and some of the companies are linked to property in London. Among the beneficiaries they name friends of the president, including Ivan Bakanov, who now heads the SBU. Zelensky replies that under Yanukovych everyone built business this way, especially in television, and that the studio laundered nothing.\n\nFor a president who came with a promise to jail the corrupt, the story is awkward by definition: even without any violation of the law, questions remain questions. One can explain publicly, go to court, or hope that the news will quickly change."
 ukraine.314.a:0 "Explain publicly, with documents and answers to the journalists' questions."
 ukraine.314.b:0 "Go on the attack with lawsuits and a campaign against 'information attacks'."
 ukraine.314.c:0 "Do not respond, there will be other news in a week."
 ukraine.315.t:0 "The Speaker Leaves"
 ukraine.315.d:0 "On October 7 the Rada votes to dismiss Speaker Dmytro Razumkov: 284 deputies in favour. Not long ago he was considered one of the most popular politicians in the country, and after a dispute with the Office over the law on oligarchs he found himself in opposition inside his own faction. The next day Ruslan Stefanchuk, described as loyal to the president, is elected the new speaker.\n\nRazumkov says he is staying in politics, and many in the Servant of the People suddenly remember that the party's rating rested not only on the president. It is for you to decide: vote for the dismissal and secure discipline, or keep the speaker and live with two centres of power."
 ukraine.315.a:0 "Vote for the dismissal for the sake of discipline."
 ukraine.315.b:0 "Keep the speaker and agree on a balance."
 ukraine.318.t:0 "The Wagner Report"
 ukraine.318.d:0 "On November 17 Bellingcat journalists publish an investigation of the operation with the Wagner fighters that in 2020 it was preferred to keep quiet about. By their version, the Ukrainian special operation could have worked had it not been for interference from the President's Office, and an arrest in Kyiv could have taken place. The subject that was meant to be closed quietly returns to the front pages together with the question of who sabotaged the operation and why.\n\nIn the Office they say it is speculation, in the SBU that details cannot be disclosed, and in the opposition that it is one more proof that the authorities do not distinguish state interests from their own. It is for you to decide how to react."
 ukraine.319.t:0 "Defence Minister Replaced"
 ukraine.319.d:0 "Hidden event: in November 2021 Reznikov replaces Taran as defence minister."
 ukraine.318.a:0 "Remind everyone that we already acknowledged this story and there is nothing new."
 ukraine.318.b:0 "Deny it, because a journalists' investigation is not proof."
 ukraine.318.c:0 "Admit mistakes and conduct an internal review."
 ukraine.316.t:0 "The December 1-2 Coup"
 ukraine.316.d:0 "On November 26 at a press conference Zelensky announces that intelligence has obtained conversations of people preparing a coup for December 1-2: Russians take part in the recording, and they discuss recruiting Rinat Akhmetov, the richest man in the country. The president gives no details, the Kremlin denies everything, and Akhmetov calls the head of state's words an absolute lie. Zelensky allows that Akhmetov himself may have nothing to do with it, but is sure that his circle is drawing him into a war against the president.\n\nThe country watches this scene in bewilderment: coups are usually not announced at press conferences. Some see it as an alarm signal, others as a way to remind everyone about the law on oligarchs, and still others as simply a very awkward time for sorting things out between the authorities and the biggest business."
 ukraine.316.a:0 "Make the recordings public and name the names."
 ukraine.316.b:0 "Conduct a quiet SBU check and not another word in public."
 ukraine.316.c:0 "Invite Akhmetov to the Office and agree on rules."
 ukraine.317.t:0 "The Poroshenko Case"
 ukraine.317.d:0 "On December 20 the State Bureau of Investigation announces a suspicion of high treason against former president Petro Poroshenko. According to the investigation, it concerns organising coal supplies from the occupied territories of Donbas in 2014-2015, and Medvedchuk is also named among those mentioned in the case. Poroshenko calls the case political revenge, promises to return from abroad and on January 17 really does return; the court does not send him into custody.\n\nFor the authorities it is a hard choice. The case can become proof that the law is equal for all, or it can look like a reprisal against the main opponent. Everything depends on how convincing the materials are and how calmly the authorities behave."
 ukraine.317.a:0 "Go all the way and take the case to a verdict without compromises."
 ukraine.317.b:0 "Let the court decide, and the authorities neither interfere nor comment."
 ukraine.317.c:0 "Keep the case open, since while it is open the opposition behaves more quietly."
 ukraine.840.t:0 "Cyberattack on State Agencies"
 ukraine.840.d:0 "On the night of January 14 almost seventy websites of state bodies, among them the Foreign Ministry, the Defence Ministry, the Cabinet and the Emergency Service, look the same: a black background and a threatening message in Ukrainian, Russian and Polish. At the same time malware is found in the networks of several institutions that poses as ransomware but in fact wipes data. Specialists have no doubt about the Russian trace, Moscow denies involvement.\n\nThe main lesson is not that the sites went down but that the state keeps too many registries in one place, on servers in one building. What to do next: duplicate data in clouds, build centralised control, or limit oneself to statements."
 ukraine.840.a:0 "Duplicate the registries in a cloud outside the country."
 ukraine.840.b:0 "Centralise: one agency, one set of rules, one responsible person."
 ukraine.840.c:0 "Limit ourselves to statements, since hackers will always turn up."
 UKR_pandora_shadow:0 "Shadow of the Pandora Papers"
 UKR_pandora_shadow_desc:0 "The president did not answer the questions, and the questions did not go away. The Servant of the People loses the trust of voters who voted for honesty, not for nice explanations. Trust slips a little every week while the questions stay unanswered."
 ukraine.2.t:0 "Flight PS752 Shot Down Over Iran"
 ukraine.2.d:0 "On the morning of January 8 a Ukraine International Airlines plane takes off from Tehran for Kyiv, and a few minutes later it is shot down by two surface-to-air missiles of the Islamic Revolutionary Guard Corps. All 176 people on board die: 90 Iranian citizens, 55 Canadians, 11 Ukrainians (nine crew members and two passengers), 10 Swedes, 7 Afghans and 3 Britons. Among the dead are many students and young professionals returning to Canada after the holidays, and in the crew people whom colleagues considered the best in the company.\n\nFor three days Tehran speaks of a technical fault and is in no hurry to hand over the flight recorders. On January 11 Iran admits the mistake: the plane was taken for a target on the night the country fired on American bases in Iraq and awaited a response. Now Kyiv must choose a tone: demand a full investigation and compensation together with Canada, Sweden and Britain, or not aggravate relations. For the families of the dead this difference is not abstract."
 ukraine.2.o1:0 "Create an international group and demand an investigation and compensation."
 ukraine.2.o2:0 "Do not escalate and talk quietly, without loud statements."
 #Session 9: new keys for the block 1 chronicle and COVID
 ukraine_economy.209.c:0 "Do not hurry and leave the National Bank under a temporary deputy."
 ukraine.851.t:0 "PS752: What the Investigation Showed"
 ukraine.851.d:0 "After a month and a half the international group on flight PS752 has enough material to assemble the picture in one document. A Tor-M1 battery stood at a new location and had not been correctly aligned to the north, so the operator saw the target not where it was. Communication with the command post was down, and the operator, taking the aircraft for a cruise missile, fired two missiles about half a minute apart. The sky over Tehran was not closed, and the flight was not delayed: that day the airport worked as usual. The Iranian authorities speak of 'human error', the relatives say that there are too many human errors for a single tragedy.\n\nThe question the international group records on a separate line: it is not one operator at fault but a system that expected war and forgot about civilian aircraft. Iran meanwhile already names a sum: about 150 thousand dollars per victim's family, roughly 26 million for 176 people. Canada and Sweden believe that not only families should be paid: the aircraft, the airline's reputation and insurance payouts have been lost. It is for Kyiv to decide how much to demand and by what route."
 ukraine.851.a:0 "Accept Tehran's offer: about 150 thousand dollars per family, quickly and without disputes."
 ukraine.851.b:0 "Demand more: Montreal Convention standards, the cost of the aircraft and the airline expenses."
 ukraine.851.c:0 "Go to court together with Canada, Sweden and Britain."
 ukraine.852.t:0 "PS752: Payments"
 ukraine.852.d_accept:0 "The money arrives without loud statements: Tehran transfers the promised payments to the families of the victims, and the Foreign Ministry says the sum was named from the very beginning. For the relatives of the eleven Ukrainians on board it is no consolation, but at least a closed question. Canada and Sweden meanwhile keep talking about responsibility and truth, and against their background Kyiv's quiet position looks very calm indeed."
 ukraine.852.d_demand:0 "The talks drag on: Tehran agrees to recalculate part of the payments, but does not accept the airline's responsibility and values the aircraft in its own way. Lawyers argue over the Montreal Convention standards, while in Tehran they remind everyone that the country has already admitted guilt. Some money does arrive: the insurance sum for the lost aircraft and the first payments to families. The rest is a matter of correspondence, which in this story is measured in years."
 ukraine.852.d_court:0 "The claim is filed, and the court, as usual, is in no hurry. But the diplomatic effect arrives faster: Canada, Sweden and Britain act as a common front, and Iran has to answer not individual countries but the whole group at once. Part of the payments comes through negotiations parallel to the proceedings, and the rest depends on a decision that will take a long time. For the families something else matters more: the question is not closed, and it is remembered."
 ukraine.852.a:0 "Take note."
 ukraine.312.c:0 "Entrench the banking law and file new claims over PrivatBank."
 ukraine.312.e:0 "Check the licences and taxes of the Kolomoisky group's TV channels."
 ukraine.311.c:0 "Begin closed talks on an exchange of prisoners."
 UKR_covid_close_borders:0 "Close Borders and Air Traffic"
 UKR_covid_close_borders_desc:0 "The government closes the borders to foreigners and suspends international air traffic, as the neighbours have done. In the last days before closure people return from abroad, there are queues at checkpoints, and businesses living off travel are left without customers for the coming months. On the other hand, the epidemic no longer arrives from every airport at once."
 UKR_covid_doctors_bonuses:0 "Pay Supplements for Medics"
 UKR_covid_doctors_bonuses_desc:0 "Doctors and nurses who treat coronavirus patients receive supplements of up to 300 percent of their salary. For many it is the first raise in years, and for the budget one more line that was not in the plan. Promising is easy, paying is harder: the money must be found before people decide that the promise was only words."
 UKR_covid_oxygen_program:0 "Oxygen and Ventilators"
 UKR_covid_oxygen_program_desc:0 "Hospitals are short of oxygen: the lines were designed for other loads, and requests come in by the hundreds. The government buys concentrators and ventilators and agrees with industrial gas producers on converting part of their capacity. This money is not visible on the streets, but it is visible in intensive care."
 UKR_covid_weekend_quarantine:0 "Weekend Quarantine"
 UKR_covid_weekend_quarantine_desc:0 "Restrictions are introduced for weekends: cafes, restaurants, shopping centres and gyms are closed, grocery shops and pharmacies work. Epidemiologists call the measure a compromise between a full lockdown and inaction, entrepreneurs a way to ruin small business on Saturdays and Sundays. The decision will not please everyone, but the authorities rarely get a choice between 'everything' and 'nothing'."
 UKR_covid_certificates:0 "Covid Certificates in Diia"
 UKR_covid_certificates_desc:0 "Vaccination and test certificates in the Diia app become a pass for public-sector workers, transport and large events. For the state it is an opportunity to divide people into the protected and the risk-takers without new bans. For opponents of vaccination it is a reason to take to the streets, and for the Diia developers one more load on the servers."
 UKR_fop_distrust:0 "Entrepreneurs' Distrust"
 UKR_fop_distrust_desc:0 "Sole proprietors and cafe owners leave the Maidan feeling that the authorities listen only to epidemiologists. They keep working and paying taxes, but remember how the police met them. The distrust builds slowly: stability falls weakly but steadily. For the Future and Servant of the People lose."
 UKR_fop_tax_pause:0 "Tax Pause for Sole Proprietors"
 UKR_fop_tax_pause_desc:0 "Tax novelties are postponed and the regime for small business is softened. Entrepreneurs exhale, the budget loses a little, and by spring everyone will argue whether too much was promised. For the Future and Servant of the People gain a little trust from business."
 UKR_fop_support_payments:0 "Quarantine Payments"
 UKR_fop_support_payments_desc:0 "The state pays directly those shut down by the lockdown. Queues at tax offices grow, but so does the shops' revenue: money, strangely enough, gets spent. Those who needed support remember the payments: Servant of the People and the Radical Party rise. The closer the country is to the social agenda, the stronger the effect."
 UKR_fop_digital_deal:0 "Sole Proprietors in Diia"
 UKR_fop_digital_deal_desc:0 "Tax services for sole proprietors move into the app: reporting, registration, closing in a few taps. Small business gets less paperwork and more trust, and the developers one more reason to be proud. For the Future and Servant of the People gain a share of the digital electorate. The more the country already lives in Diia, the stronger the effect."
