 ukrainewar.101.t:0 "Kharkiv Has Fallen"
 ukrainewar.101.d:0 "Tank wedges broke through to the outskirts of Kharkiv at dawn. The last defenders waged fierce battles on the streets of Saltivka and in the city's industrial districts. Territorial defense fought near the walls of Turboatom and the Kharkiv Tractor Plant  symbols of the city's industrial might, which produced turbines for the entire Soviet Union. Derzhprom, a magnificent constructivist building, witness to all epochs of Kharkiv, once again found itself in a combat zone. The city that produced tanks, missile systems, and aircraft engines, a city with a population of one million, is now shrouded in smoke and destruction. Kharkiv was a scientific center with dozens of universities, a center of mechanical engineering and high technology. The loss of the country's second-largest city is a blow to defense capability and national morale."
 ukrainewar.101.a:0 "Organize emergency evacuation of the population!"
 ukrainewar.101.b:0 "We will return... We must return."
 UKR_kharkiv_evacuation_tt:0 "Evacuation of Kharkiv's civilian population organized. Residents and qualified personnel saved."
 UKR_kharkiv_lost_tt:0 "Loss of Kharkiv is a devastating blow. The industrial capital and defense center are in enemy hands."


 ukrainewar.102.t:0 "Sumy Abandoned"
 ukrainewar.102.d:0 "The battle for Sumy lasted a week. The enemy advanced from three directions, seeking to completely encircle the city. Defenders held positions in northern districts to the last, containing the advance to the center. Sumy, a city in the northeast, an important transport hub and center of chemical industry. Mineral fertilizers and pumping equipment were produced here, supplying the entire country. The city's population was a quarter million, many of whom worked at defense enterprises. The city park and central square, where families once strolled, are now cratered. Loss of control over Sumy opens the enemy's path to central oblasts."
 ukrainewar.102.a:0 "Save the people  evacuate the city!"
 ukrainewar.102.b:0 "Every house, every street will be avenged."
 UKR_sumy_evacuation_tt:0 "Evacuation of Sumy's population conducted. Some industrial equipment removed."
 UKR_sumy_lost_tt:0 "Sumy is lost. The northern transport corridor is under threat."


 ukrainewar.103.t:0 "Chernihiv Captured"
 ukrainewar.103.d:0 "Ancient Chernihiv, one of the oldest cities of Rus', fell after brutal fighting. The defense held on the approaches to the historic center, where 11th-century churches stand. Shelling damaged the Transfiguration Cathedral, an architectural monument from the time of Yaroslav the Wise. Chernihiv was a center of light industry and mechanical engineering; textiles, chemical fibers, and musical instruments were produced here. The population exceeded 285 thousand. The city is located on a strategic direction to the capital; its loss creates a threat of encirclement to northern oblasts. Fighting took place in the Desnianskyi district and on the bridge over the Desna River, a key transport artery. Historical memory of a thousand years found itself under the ashes of modern war."
 ukrainewar.103.a:0 "Evacuate the population and archives!"
 ukrainewar.103.b:0 "The ancient city remembers all wars. It will survive this one too."
 UKR_chernihiv_evacuation_tt:0 "Chernihiv's population evacuated. Some cultural treasures saved."
 UKR_chernihiv_lost_tt:0 "Loss of Chernihiv opens the path to the capital. The ancient city is in enemy hands."


 ukrainewar.104.t:0 "Zaporizhzhia Has Fallen"
 ukrainewar.104.d:0 "Zaporizhzhia held out to the end. Fighting took place on the left and right banks of the Dnipro, bridges exploding one after another. Defenders held the Dnipro Hydroelectric Station and industrial districts, understanding the city's strategic importance. Zaporizhzhia, a powerful industrial center where Europe's largest nuclear power plant is located, along with metallurgical plants and machine-building factories. Motor Sich produced aircraft engines for the entire world. The city's population exceeded 750 thousand. The city's symbol is the famous Zaporizhian Sich, cradle of Cossackdom, a place of strength and freedom. The loss of Zaporizhzhia means losing the energy heart of the country and a strategic bridge across the Dnipro. The enemy gained control of the ZNPP."
 ukrainewar.104.a:0 "Evacuation! Remove NPP specialists!"
 ukrainewar.104.b:0 "Zaporizhzhia is the heart of the country. This is unforgettable."
 UKR_zaporizhzhia_evacuation_tt:0 "Zaporizhzhia's population evacuated. NPP specialists withdrawn to safety."
 UKR_zaporizhzhia_lost_tt:0 "Catastrophic loss. Zaporizhzhia NPP and industrial center captured by the enemy."


 ukrainewar.105.t:0 "Kherson Abandoned"
 ukrainewar.105.d:0 "Kherson, the gateway to Crimea, a city at the mouth of the Dnipro, was captured after bloody street fighting. The last defenders retreated across the Antonivskyi Bridge, which was blown up to delay the advance. Kherson, a southern port city with a population of about 290 thousand, a center of shipbuilding and agricultural processing. Kherson Oblast is Ukraine's breadbasket, the largest producer of grain and vegetables. The city was famous for watermelons and tomatoes supplied throughout the country. The Kherson Shipbuilding Plant built ships for the fleet. The loss of Kherson cuts off land connection with southern territories and opens the enemy's path along the Black Sea coast toward Odesa."
 ukrainewar.105.a:0 "Evacuate civilians across the Dnipro!"
 ukrainewar.105.b:0 "Kherson will be liberated. The gateway to Crimea will not close."
 UKR_kherson_evacuation_tt:0 "Kherson's population evacuated across the Dnipro. Operation successful."
 UKR_kherson_lost_tt:0 "Kherson is lost. The southern direction is open to enemy advance."


 ukrainewar.106.t:0 "Dnipro Captured"
 ukrainewar.106.d:0 "Dnipro, the third-largest city in the country, the industrial heart of central Ukraine, fell after a two-week siege. Fighting took place in every district of the million-strong city. Defenders held defense at metallurgical plants and factories, using workshops as fortresses. Dnipro is a center of ferrous metallurgy, space and rocket industry. Pivdenmash produced launch vehicles for space programs; Interpipe supplied pipes worldwide. The city gave the country hundreds of cosmonauts and scientists. The Merefo-Kherson Bridge, the city's symbol connecting the banks of the mighty Dnipro, was the arena of fierce fighting. The loss of Dnipro means the loss of industrial potential, space technologies, and the country's most important transport hub."
 ukrainewar.106.a:0 "Organize evacuation! Save people and specialists!"
 ukrainewar.106.b:0 "Dnipro, a giant city. Its fall will not go unpunished."
 UKR_dnipro_evacuation_tt:0 "Mass evacuation of Dnipro's population conducted. Qualified personnel saved."
 UKR_dnipro_lost_tt:0 "Loss of Dnipro is a catastrophe. Industrial and space center captured."


 ukrainewar.107.t:0 "Zhytomyr Lost"
 ukrainewar.107.d:0 "Zhytomyr, an ancient city in the western direction, fell after tense fighting on the outskirts. The enemy sought to capture the city quickly to open the path to Kyiv from the west. Territorial defense fought in Koroliov and Bohun districts, delaying the advance. Zhytomyr, an oblast center with a population of 265 thousand, a center of light industry and woodworking. Furniture, musical instruments, textiles, and equipment for the food industry were produced here. The city is known for its granite deposits  Zhytomyr granite adorns buildings worldwide. The loss of Zhytomyr creates a threat to western oblasts and opens an additional corridor for advancing on the capital."
 ukrainewar.107.a:0 "Evacuate residents to the west!"
 ukrainewar.107.b:0 "Zhytomyr is an ancient city. It has seen everything. We will return."
 UKR_zhytomyr_evacuation_tt:0 "Zhytomyr's population evacuated to western oblasts."
 UKR_zhytomyr_lost_tt:0 "Loss of Zhytomyr opens the western direction for advance."


 ukrainewar.108.t:0 "Odesa Captured"
 ukrainewar.108.d:0 "Odesa, the pearl by the Black Sea, a Hero City with a population exceeding one million, fell after fierce fighting. Landing operations, assault on port districts, battles on the Potemkin Stairs and near the Opera House  all this became reality for a city that had endured great sieges in history. Odesa, the largest port city, gateway for grain and petroleum product exports, center of shipbuilding and oil refining. Odesa Port is one of the most important in the Black Sea. The silver anchor on a red field of the coat of arms symbolizes the city's maritime power. Odesa is the cultural capital of the south, birthplace of writers and artists, a city of humor and love of freedom. The loss of Odesa cuts Ukraine off from a significant portion of the Black Sea coast and destroys maritime trade routes."
 ukrainewar.108.a:0 "Evacuation through the port! Save the Hero City!"
 ukrainewar.108.b:0 "Odesa is unconquerable. History remembers all sieges."
 UKR_odesa_evacuation_tt:0 "Large-scale evacuation through Odesa Port. Population and cultural treasures saved."
 UKR_odesa_lost_tt:0 "Catastrophic loss. Odesa, the maritime capital, captured by the enemy."


 ukrainewar.109.t:0 "Lviv Occupied"
 ukrainewar.109.d:0 "Lviv, the cultural and spiritual capital of western Ukraine, a city of European architecture and love of freedom, was captured after desperate resistance. Fighting took place on the streets of the old city, near the walls of the Town Hall and St. George's Cathedral. Every cobblestone remembers the footsteps of kings, poets, and revolutionaries. Lviv, a city with a population of 720 thousand, a center of mechanical engineering, food, and light industry. Lviv Polytechnic trained engineers for the entire country. The city was a crucial transport hub connecting Ukraine with Europe. The city's symbol, the lion, embodies pride and unbending spirit. The loss of Lviv means losing the western bastion, cultural center, and connection with the European world. This is a blow to national identity."
 ukrainewar.109.a:0 "Organize evacuation! Save the cultural capital!"
 ukrainewar.109.b:0 "Lviv is unconquered. It will survive any yoke."
 UKR_lviv_evacuation_tt:0 "Lviv's population evacuated to Zakarpattia and Poland. Cultural treasures saved."
 UKR_lviv_lost_tt:0 "Loss of Lviv is a blow to the national spirit. The cultural capital is captured."

 # Liberation of Territory
 ukrainewar.400.t:0 "Liberation of Occupied Lands"
 ukrainewar.400.d:0 "Our troops enter liberated cities to jubilant cries from the population. Residents come out into the streets with blue-and-yellow flags, embrace soldiers, weep with joy. But along with triumph comes horror  evidence of occupiers' atrocities, mass graves, destroyed homes. Every liberated village is both a victory and a new pain."
 ukrainewar.400.a:0 "We remember every tortured soul"


 # International Support
 ukrainewar.500.t:0 "Wave of International Support"
 ukrainewar.500.d:0 "Weapons deliveries from abroad, humanitarian aid, sanctions against the aggressor  the whole world has taken our side. At airports, Javelins and HIMARS are unloaded; in ports, ships dock with medicines and food. This support gives strength to continue the struggle, but also reminds us of our dependence on allies."
 ukrainewar.500.a:0 "We are not alone in this fight"


 # Energy War
 ukrainewar.600.t:0 "War for Electricity"
 ukrainewar.600.d:0 "Enemy Geran drones and Kalibr missiles methodically destroy the country's energy system. Thermal and hydroelectric power stations turn into ruins, transformer substations burn. Millions of people sit without light in freezing temperatures. But energy workers heroically repair the damage, and people learn to live by candlelight."
 ukrainewar.600.a:0 "Darkness will not break our will"


 # Deportation of Children
 ukrainewar.700.t:0 "Abduction of Children"
 ukrainewar.700.d:0 "Terrible news arrives from occupied territories  invaders are forcibly removing Ukrainian children, sending them to 're-education' camps, giving them new documents and Russian names. Thousands of families are deprived of their children. This pain is unbearable  it turns even the most peace-loving citizens into furious avengers."
 ukrainewar.700.a:0 "We will find every stolen child"
 ukrainewar.700.b:0 "For this there is no forgiveness"


 # Grain Blockade
 ukrainewar.800.t:0 "Port Blockade"
 ukrainewar.800.d:0 "Black Sea ports are mined, merchant ships cannot export Ukrainian grain. Millions of tons of wheat that could feed the starving in Africa and Asia rot in grain elevators. The enemy uses hunger as a weapon not only against us but against the entire world. However, we find new routes  through the Danube, through railways to Poland."
 ukrainewar.800.a:0 "Ukraine will feed the world, no matter what"



 # Estonia - Kaitseliit
 baltic_defense.1.t:0 "Mobilization of Kaitseliit"
 baltic_defense.1.d:0 "In response to the threat of Russian aggression and our participation in the regional defense alliance, the Estonian government has declared full mobilization of the Estonian Defence League (Kaitseliit). This voluntary national defense organization, numbering over 25,000 members including affiliated organizations, is ready to stand in defense of the country's sovereignty.\n\nFour territorial defense districts are forming territorial defense battalions, equipped with modern weapons and trained intensively alongside NATO forces. Members of Kaitseliit know the local terrain exceptionally well and are capable of organizing effective guerrilla defense."
 baltic_defense.1.a:0 "For Estonia's independence!"
 estonia_kaitseliit_mobilization_tooltip:0 "§Y3 Kaitseliit territorial defense divisions mobilized§!"

 # Lithuania - Šauliai
 baltic_defense.2.t:0 "Mobilization of Lithuanian Riflemen's Union"
 baltic_defense.2.d:0 "The Lithuanian Riflemen's Union (Lietuvos šaulių sąjunga), a paramilitary organization with a rich history of fighting for independence, is declaring full mobilization. Approximately 14,000 riflemen, trained militarily and prepared for armed and civil resistance, are rising to defend the homeland.\n\nTerritorial rifle units, named after Lithuania's historical heroes and regions, are being formed throughout the country. These units, working closely with the regular armed forces, are prepared for guerrilla operations and territorial defense, drawing on the resistance traditions of the 1940s."
 baltic_defense.2.a:0 "The Riflemen are ready for battle!"
 lithuania_sauliai_mobilization_tooltip:0 "§Y3 Šauliai rifle divisions mobilized§!"

 # Latvia - Zemessardze
 baltic_defense.3.t:0 "Mobilization of Latvian National Guard"
 baltic_defense.3.d:0 "The Latvian National Guard (Zemessardze) - a component of the National Armed Forces - is conducting a full-scale mobilization of reservists. This organization, designed to involve Latvian citizens in state defense, is forming territorial defense brigades in all regions of the country.\n\nZemessardze brigades are equipped to perform territorial defense tasks, support civilian structures in crisis situations, and counter hybrid threats. The mobilized units are ready to protect critical infrastructure and organize defense of populated areas."
 baltic_defense.3.a:0 "For a free Latvia!"
 latvia_zemessardze_mobilization_tooltip:0 "§Y3 National Guard brigades mobilized§!"

 # Block 1: optional lean branch
 UKR_state_in_smartphone:0 "State in a Smartphone"
 UKR_state_in_smartphone_desc:0 "Passport, driving licence, certificates and benefits, all in one app. The Ministry of Digital Transformation promises that in a couple of years only the nostalgic will visit a bureaucrat. Sceptics ask what happens when the power goes out."
 UKR_nsdc_sanctions:0 "NSDC Sanctions"
 UKR_nsdc_sanctions_desc:0 "The National Security and Defence Council imposes sanctions on TV channels and individuals the authorities consider conduits of Russian influence. The decision is fast and effective, but the courts only get involved after the fact, and everyone notices."
 UKR_social_shield:0 "Social Shield"
 UKR_social_shield_desc:0 "Pension indexation, bonuses for medics and aid for those left jobless by COVID. The budget is cracking and the IMF frowns, but for the first time in ages the queues at the post office talk about the government without swearing."

 # Politics 2023 (ukraine_politics)
 ukraine_politics.100.t:0 "Political Year 2023"
 ukraine_politics.100.d:0 "Service event."
 ukraine_politics.101.t:0 "Echoes of the American War"
 ukraine_politics.101.d:0 "While Americans shoot at each other, it is getting harder in Kyiv to explain why the “Western model” answers every question. Grant programmes are cut, embassies are shrinking their staff, and partners answer calls politely, but later and later.\n\nFor the first time in years the liberal parties watch their ratings crawl down. Talk show experts argue whether the “end of history” has ended, while the grannies outside the apartment blocks settled it long ago: “America has no time for us now.” And it is getting harder to argue with them."
 ukraine_politics.101.a:0 "The course stays. The West will survive this too."
 ukraine_politics.101.b:0 "Time to rely on ourselves."
 ukraine_politics.102.t:0 "The Left Front"
 ukraine_politics.102.d:0 "In a rented hall of a former House of Culture, social democrats, green leftists, trade union activists and people from the Union of Left Forces sit at one table for the first time in years. They argue until they are hoarse, fight over seats on the podium and twice nearly walk out, but by evening they sign a joint statement.\n\nTheir language is simple: prices, wages, utility bills and oligarchs. Yesterday it was called populism; today, amid the crisis, more and more people understand it. The alliance promises to run for the Rada together, and the Radical Party is already looking at whom to walk with."
 ukraine_politics.102.a:0 "They are worth talking to."
 ukraine_politics.102.b:0 "Noise on social media is not a party yet."
 ukraine_politics.102.c:0 "Remind them who is in charge here."
 ukraine_politics.103.t:0 "The Right Turn"
 ukraine_politics.103.d:0 "The world is cracking at the seams, and the right is getting its share. “Our own first”, “a strong army”, “no more experiments” - slogans heard only at marches yesterday are repeated by evening news anchors today.\n\nEuropean Solidarity fills halls in the regional centres, Svoboda is back on the streets, and the comments under the president’s videos are increasingly written by people who voted for “new faces” in 2019. The right does not win the arguments. It is simply always on camera."
 ukraine_politics.103.a:0 "Seize their agenda."
 ukraine_politics.103.b:0 "Keep our distance."
 ukraine_politics.104.t:0 "Eggs at 17 Hryvnias"
 ukraine_politics.104.d:0 "Journalists publish documents: according to the media, an army catering contract prices one egg at 17 hryvnias. Not a dozen, one egg. At the supermarket down the street that money buys three, and at the market you would even get change. The ministry first speaks of a “technical error”, then of “prices including delivery to the zone of responsibility”, then simply stops answering the phone.\n\nMeanwhile the internet lives its own life: golden hens, the “National Egg Fund of Ukraine”, the exchange rate of “one army egg per dollar”. It is funny to everyone except those who signed the contract and those at the front who never saw those eggs."
 ukraine_politics.104.a:0 "Check every contract. And every egg."
 ukraine_politics.104.b:0 "Do not blow it up. They are just eggs."
 ukraine_politics.105.t:0 "Servant of the People Launches Its Campaign"
 ukraine_politics.105.d:0 "Less than two months remain before the Rada election. An old 2019 poster hangs in Servant of the People’s headquarters, and people try not to look at it: in four years the “new faces” have become rather familiar, and hope has turned into the question “what next?”.\n\nThe campaign strategists have been arguing for three days. Some want everything at once: digital, pensions, the army and order. The pollsters answer with a chart where “promise everything to everyone” ends in falling ratings. One clear programme is needed, and the president has to choose it."
 ukraine_politics.105.a:0 "Technocracy: the digital state and transparency."
 ukraine_politics.105.b:0 "Social programme: wages, pensions, prices."
 ukraine_politics.105.c:0 "Order: strong government and security."
 ukraine_politics.105.e:0 "Patriotic programme: army, language, memory."
 ukraine_politics.106.t:0 "The Tariff Winter"
 ukraine_politics.106.d:0 "March has turned out the way it only can when heating bills arrive together with a blizzard. In Dnipro and Kryvyi Rih the receipts are pinned to factory gates, and outside the trade union building on the Maidan the FPU gathers a thousand people: tariffs, wages, and the question of why the first grow faster than the second.\n\nThe government insists that the tariffs are “economically justified”, and that is perfectly true. The Office of the President sees it differently: every receipt on a factory gate is a vote that in October will go to whoever promises it louder. The question is not who is right, but who will inherit this anger."
 ukraine_politics.106.a:0 "Freeze household tariffs until the end of the heating season."
 ukraine_politics.106.b:0 "Meet the FPU and promise to review the tariff formula."
 ukraine_politics.106.c:0 "The market sets the tariffs. Aid goes only to those who really need it."
 ukraine_politics.107.t:0 "May Day"
 ukraine_politics.107.d:0 "On the first of May a column walks down Khreshchatyk the like of which has not been seen for ten years: trade union banners, green scarves, placards reading “Pay your taxes - get your rights” and a few pensioners with Soviet badges whom nobody invited but nobody drove away either. The FPU says a hundred thousand, the police say twenty, and the truth, as usual, lies somewhere between two press releases.\n\nThe march is peaceful, but everybody is watching it: the opposition asking “was that allowed?”, the Office asking “whose electorate is this?”. At the entrance to the Maidan stands a tent with a sign reading “Free legal aid for workers”, and the queue to it is longer than to any campaign headquarters in the past year."
 ukraine_politics.107.a:0 "Send a representative of the Office with greetings and a promise of dialogue."
 ukraine_politics.107.b:0 "Stay out of it. A march is a march."
 ukraine_politics.107.c:0 "Remind them that rallies must be approved in advance."
 ukraine_politics.108.t:0 "Veterans and the Left"
 ukraine_politics.108.d:0 "Veterans' organisations, used to approaching the authorities with requests, for the first time come to the left with a proposal. The reason is simple and very down to earth: compensation for damaged housing is delayed, and the sanatorium programme is fair only in the ministry's press release. In a Kyiv cafe a veteran with the call sign “Accountant” lays printouts in front of the union leaders and says a single sentence: “Here is what we owe, and here is what we are owed.”\n\nFor the left it is a gift: these are people who cannot be called either “agents of Moscow” or “populists”. For the nationalists it is a warning signal, since veterans have always been considered their base. In the Office they stay calm: whoever first offers the veterans apartments gets their votes, and what that is called is a secondary question."
 ukraine_politics.108.a:0 "Offer the veterans a housing programme and a working group at the Office."
 ukraine_politics.108.b:0 "Let them work it out themselves. The state is not a matchmaker."
 ukraine_politics.108.c:0 "Remind them that the veteran base of the army is represented by veteran councils, not trade unions."
 ukraine_politics.109.t:0 "The Founding Congress"
 ukraine_politics.109.d:0 "In a Kyiv building on the Maidan that remembers 2014, the founding congress of the “Left Front” takes place. The delegates argue for three hours about the name, five about the programme, and eight about who speaks last. It ends prosaically: the Radical Party, the social democrats, “Sotsialnyi Rukh”, the green left and trade union activists register a joint list, while anarchists and workers' councils gather around a renewed Union of Left Forces, a louder and younger coalition.\n\nFor “Servant of the People” this is bad news: some of the discontented go where answers are promised rather than personnel. For the Office the news is ambiguous: the left electorate has split into two camps, and now they will have to share it with each other. But that is exactly what politics knows how to exploit."
 ukraine_politics.109.a:0 "Support the registration: let them argue with the opposition, not with us."
 ukraine_politics.109.b:0 "Register them by the book and without undue haste."
 ukraine_politics.109.c:0 "Delay the registration: the signatures need to be checked twice."
 ukraine_politics.112.t:0 "The Red Line"
 ukraine_politics.112.d:0 "The CPU proposes a “single red list” to the Left Front, with a common emblem, common slogans and a common heritage, which, it turns out, divides worst of all. The Left Front answers politely and categorically: for younger voters an extra hammer and sickle is only a hindrance, and for “Euro-left” partners even more so.\n\nThe CPU is offended, the PSPU pretends nobody invited it either. In the Office of the President this is seen as a small gift: the more the left quarrel among themselves, the less airtime they take. But the gift can be multiplied or spoiled, and on that depends how the east will vote in half a year."
 ukraine_politics.112.a:0 "Quietly support the split: let the CPU and the Left Front share one voter."
 ukraine_politics.112.b:0 "Stay out of it. This is not our quarrel."
 ukraine_politics.112.c:0 "Publicly welcome the Left Front's choice: Ukraine needs a modern left."
 ukraine_politics.113.t:0 "The United List"
 ukraine_politics.113.d:0 "The Left Front announces the top five of its list. It is headed by the labour lawyer Vitaliy Dudin of “Sotsialnyi Rukh”, followed by representatives of the FPU, miners' unions and veterans' associations, and at the end an environmental activist who promises not to let developers into Protasiv Yar park. The list looks like a gathering of everyone who is usually not invited to TV.\n\nAirtime will now have to be provided: electoral law does not know the word “inconvenient”. In the Office of the President they look at the list with interest. Dudin is not an orator, but he is a lawyer who has won court cases against ministries, and in Ukraine that is stronger than any rally."
 ukraine_politics.113.a:0 "Offer cooperation after the election: a package of labour laws in exchange for support for the budget."
 ukraine_politics.113.b:0 "Attack them as “populists who promise what is not in the budget”."
 ukraine_politics.113.c:0 "Ignore them. Airtime is provided by law."
 ukraine_politics.115.t:0 "Kryvbas"
 ukraine_politics.115.d:0 "Miners in Kryvyi Rih come out to the factory gates: wages have not been indexed since last year, while the owner's profit, according to the union, has grown by a figure that accounting calls “non-public”. The Independent Miners' Union threatens to stop the mines, and for the first time in many years it is listened to not only in Kryvyi Rih but in Kyiv.\n\nFor the Office this is both a chance and a trap: to intervene means to oppose a major owner right before the election, not to intervene means to hand the mining region to those who will intervene in your place. In the corridors they remind each other that in 1989 it was the miners who first showed the country that it has a voice."
 ukraine_politics.115.a:0 "Act as a mediator: the owner and the union sit down at one table in the Office."
 ukraine_politics.115.b:0 "Offer the owner tax breaks in exchange for raising wages."
 ukraine_politics.115.c:0 "Stay out of it: labour disputes are settled by the court."
 ukraine_politics.116.t:0 "The Free Territory"
 ukraine_politics.116.d:0 "During the renovation of the district House of Culture in Huliaipole, workers find in a wall a file of yellowed leaflets: an invitation to the 1919 congress of peasants, workers and insurgents. Back then, at the height of the Civil War, this steppe town held the “free territory” of Nestor Makhno: councils without parties, communes without bosses and an insurgent army that lived off what its land produced. It ended the way almost all alliances with the stronger end: in November 1920 the Reds, with whom they had fought Wrangel together only yesterday, turned their weapons against the Makhnovists.\n\nThe local newspaper publishes the find with a comment by a local historian, and within a day it is forwarded to every left-wing chat. The anarchists of the Union of Left Forces and Workers' Councils read the leaflets as a programme, the trade unionists as a story of how an alliance without guarantees ends, and the journalists as an occasion for the headline “Makhno returns”. It has all happened before, only back then the anarchists had horse-drawn machine-gun carts and now they have chats."
 ukraine_politics.116.a:0 "Fund a museum of the “Free Territory” in Huliaipole: let the history be open."
 ukraine_politics.116.b:0 "Do not comment: history has textbooks and the Office has work to do."
 ukraine_politics.116.c:0 "Remind everyone that alliances with anarchists in history ended badly for everyone."
 ukraine_politics.117.t:0 "The Free Union"
 ukraine_politics.117.d:0 "In a Kyiv library an exhibition of forgotten Ukrainian thinkers opens for an anniversary, and visitors are surprised: it turns out Ukraine had its own socialism long before anyone explained what it should be. Mykhailo Drahomanov, in his Geneva exile, argued that freedom begins from below, from communities, unions and cooperatives, and not from a centre that always knows better. Serhiy Podolynsky, a doctor and economist, compared human labour with energy as early as 1880, and Marx and Engels discussed that work in their correspondence.\n\nThe social democrats of the Left Front quote Drahomanov; the anarchists and trade unionists of the Union of Left Forces and Workers' Councils quote the same man with different emphases. They argue about who his heir is, and for the first time in a long while they do it publicly and without mutual accusations. In the Office they note: the left has found a common ancestor, and so perhaps a common language."
 ukraine_politics.117.a:0 "Support Drahomanov readings: let the left idea be Ukrainian rather than imported."
 ukraine_politics.117.b:0 "Stress cooperatives and unions: free association is about workers' councils."
 ukraine_politics.117.c:0 "Do not interfere: history is the historians' business."
 ukraine_politics.118.t:0 "Social and National"
 ukraine_politics.118.d:0 "At a scholarly conference for the centenary of the Ukrainian revolution historians argue about what Soviet textbooks kept silent about. The Borotbists of 1918-1920 combined social justice with independence, and Mykola Skrypnyk, ten years later, built Ukrainisation inside the ruling party itself, until in 1933 the party decided that Ukrainisation had succeeded too well. Skrypnyk took his own life, and this ending is still the main argument of those who say that the national idea and the left idea sooner or later part ways.\n\nThe dispute is alive and quite modern. The Left Front says that the Ukrainian idea has always included justice, while Svoboda says that justice begins with language and memory. Journalists are pleased: left and right suddenly quote the same page. The Office understands that in 2023 patriotism is a currency like wages, and the only question is in whose wallet it will end up."
 ukraine_politics.118.a:0 "Accept the tradition: social justice and the Ukrainian idea do not contradict each other."
 ukraine_politics.118.b:0 "Play the national side: patriotism stands above party disputes."
 ukraine_politics.118.c:0 "Do not interfere: let historians and politicians argue without the Office."
 ukraine_politics.110.t:0 "Verkhovna Rada Election"
 ukraine_politics.110.d:0 "29 October. Polling stations open at eight in the morning, and by lunchtime it is clear that turnout is lower than in 2019: the euphoria of new faces is gone, the fatigue remains. By ten in the evening the exit polls paint a picture that makes Servant of the People’s headquarters stop opening the champagne.\n\nThe president’s party is still first, but its single-party majority is gone. The left enters the Rada as a visible faction for the first time in years, the right has grown stronger in the west and in the capital, and For the Future confidently holds its districts. In the morning journalists ask one question: whom will Servant of the People vote with now? Headquarters has no answer yet, only calculators."
 ukraine_politics.110.a:0 "Count the votes. And the allies."
 ukraine_politics.111.t:0 "A Pragmatic Alliance"
 ukraine_politics.111.d:0 "A week of talks takes place in restaurants where each party has its own private room and its own exit. By Friday Servant of the People and For the Future announce an alliance in the Rada.\n\nThere is no love in it. The president’s party is used to ruling alone, while the partner has its own sponsors, its own regional barons and a long memory of who kept whom off the air. Only arithmetic holds the alliance together: without it no law passes. Analysts give it a year. The boldest say six months, and the bookmakers are already taking bets."
 ukraine_politics.111.a:0 "What matters is votes in the chamber."
 ukraine_politics.114.t:0 "The Left Faction in the Rada"
 ukraine_politics.114.d:0 "The Left Front enters the Rada as a faction that they try to seat in the gallery at the first session, and it politely refuses. The first thing the deputies do is table three bills: a new labour code, a moratorium on tariff increases and a luxury tax that was instantly dubbed the “Mercedes tax” in the corridors.\n\nThe coalition of “Servant of the People” and “For the Future” reads the texts with pencils: the moratorium is expensive, the tax is doubtful, and the code is the only thing that can pass. The left know this themselves and wait for the Office's offer. In politics it rarely happens that a deal benefits both sides, and even more rarely that both understand it."
 ukraine_politics.114.a:0 "Back the labour code in first reading: let the left have a win, but not the moratorium."
 ukraine_politics.114.b:0 "Vote against the whole package: the Rada is no place for populism."
 ukraine_politics.114.c:0 "Trade the left's votes for support for the budget, without loud statements."
 ukraine_politics.120.t:0 "The Crisis Begins"
 ukraine_politics.120.d:0 "Service event."
 ukraine_politics.121.t:0 "Whispers in the Corridors"
 ukraine_politics.121.d:0 "The Rada canteen has gone suspiciously quiet. MPs who hugged in the corridors yesterday now greet each other with a nod, and journalists of the parliamentary pool exchange the same phrase: “Did you hear it too?”.\n\nThey say schemes are running around the President’s Office that no press release mentions. There is no proof yet. There are anonymous channels, “a source in the government” and the far too confident smiles of opposition MPs. Rumours are not a scandal yet. But scandals usually start exactly like this."
 ukraine_politics.121.a:0 "This is a smear campaign against us."
 ukraine_politics.121.b:0 "Let them check. We have nothing to hide."
 ukraine_politics.122.t:0 "A Second Warning Bell"
 ukraine_politics.122.d:0 "According to investigators, a mid-level official at one of the ministries spent years approving contracts with the “right” firms. Nothing loud: a modest salary, a modest office and a very immodest country house registered to his mother-in-law.\n\nOn its own the scandal is small; in other circumstances it would be forgotten within a week. But now everyone understands: this is a thread, and someone is already pulling it. The only question is what is on the other end."
 ukraine_politics.122.a:0 "Suspend him and hand the case to NABU."
 ukraine_politics.122.b:0 "Keep the dirty laundry at home."
 ukraine_politics.123.t:0 "The Ally Gets Nervous"
 ukraine_politics.123.d:0 "For the Future knows how to count, and in recent weeks it has been counting very carefully. If the rumours are true, a big scandal lies ahead, and the ally does not intend to sink with the president’s party.\n\nIts MPs increasingly vote “according to conscience”, skip sessions “for family reasons” and give interviews about “responsibility to voters”. For those who know this language, it is all clear: the suitcases are packed, only the moment remains to be chosen."
 ukraine_politics.123.a:0 "Offer them more. The alliance must hold."
 ukraine_politics.123.b:0 "Let them go. We will not buy loyalty."
 ukraine_politics.124.t:0 "The Alliance Collapses"
 ukraine_politics.124.d:0 "The statement comes out on Friday evening, when every journalist is already on the way home: For the Future leaves the alliance. The wording is careful, about “responsibility to voters” and “disagreement with personnel decisions”. The real reason reads between the lines: the ally does not intend to sink with the president’s party and is leaving while there are still lifeboats.\n\nBy Monday Servant of the People has no working majority. Every law now has to be assembled vote by vote, like a mosaic, and independent MPs suddenly discover that their support is worth more than they thought. Pollsters record a drop in the ratings, and in the Rada corridors people start greeting the opposition again."
 ukraine_politics.124.a:0 "Then we will negotiate with each of them."
 ukraine_politics.125.t:0 "The Street Demands Change"
 ukraine_politics.125.d:0 "There are no tents on the Maidan yet, but the thermoses have come out. People take to the streets in Kyiv, Lviv, Kharkiv and Dnipro, and it is no longer a one-off protest. Students demand fair elections, veterans demand justice, entrepreneurs demand to be left alone, trade unions demand wages. Everyone demands change, and each means something different.\n\nThe president watches the streams in his Office and understands the main thing: the old pillar has crumbled. The presidential election is ahead, and he must decide whom to bet on for a second term. If there is one."
 ukraine_politics.125.a:0 "Time to choose a new pillar."

 # Block 2: focuses
 UKR_b2_campaign_2024:0 "Campaign 2024"
 UKR_b2_campaign_2024_desc:0 "The Rada alliance has collapsed, the streets demand change, and three months remain until the election. The campaign moves into a new office that still smells of paint, and the first thing it does is hang a map of Ukraine studded with coloured pins.\n\nEvery colour is a group of people to lean on. The president must decide whom he takes into a second term, and this map will soon become much simpler."
 UKR_b2_veterans_against_oligarchs:0 "Veterans Against Oligarchs"
 UKR_b2_veterans_against_oligarchs_desc:0 "ATO veterans do not want to fight for someone else’s factories. They remember whose mines they guarded in 2014 and who later received compensation for it. Social guarantees, land for veterans, an alliance with the trade unions: Donbas as a question of justice, not only of defence.\n\nLeft-wing voters will hear this gladly. The owners of those very factories will hear it too, but with a very different expression. In the Office this is called not conviction but audience reach: the president needs votes, and the veterans need apartments."
 UKR_b2_veteran_councils:0 "Veteran Councils"
 UKR_b2_veteran_councils_desc:0 "People who have gone through Donbas since 2014 no longer trust ministries or parties. But they trust each other. Veteran councils attached to regional administrations, a territorial defence reserve and a seat at the table when the army’s future is decided.\n\nThis is a strong pillar: disciplined, respected and ready to take to the streets. The question is whose side it will take if one day the government does something it does not like."
 UKR_b2_transparent_state:0 "Transparent State"
 UKR_b2_transparent_state_desc:0 "Prozorro, open registers, electronic declarations and Diia, where a certificate is quicker to get than a pen is to find. Every person standing between a citizen and a decision is one more hand that something can be slipped into. We are removing the hands.\n\nThe old offices will not like it: they lived for years on “the paperwork has not arrived yet”. But young voters and Western partners will finally see that reform is more than a word from a press release."
 UKR_b2_loyal_people:0 "Our People on the Ground"
 UKR_b2_loyal_people_desc:0 "A crisis is no time for experiments. Trusted people take the key regional posts: classmates, former colleagues, those with whom the president once shared a dressing room. Decisions are made quickly and by hand, over the phone, without unnecessary commissions.\n\nIt works as long as these people stay loyal. Ukrainian history knows many cases when “our own” suddenly became strangers, and it usually happened at the worst possible moment."
 UKR_b2_meet_voters:0 "Meeting the Voters"
 UKR_b2_meet_voters_desc:0 "The president travels the country: factories in Zaporizhzhia, villages in the Poltava region, universities in Lviv. No teleprompter, no pre-selected questions, and a security detail that gets nervous at every handshake.\n\nThe questions are uncomfortable: about utility bills, roads, that very official with the country house. But for the first time in a long while people see the president not on a phone screen but two metres away."
 UKR_b2_subordinate_anticorruption:0 "Subordinate the Anti-Corruption Bodies"
 UKR_b2_subordinate_anticorruption_desc:0 "NABU and SAP come under the control of the Prosecutor General. Officially, for the sake of a “single vertical of investigations” and “eliminating duplication of functions”. It sounds like a dull administrative reform, which is exactly why it is passed on a Friday evening.\n\nUnofficially everyone understands why it is needed three months before the election. Embassies are already drafting “concerned” statements, and investigative journalists feel truly needed for the first time in years."
 UKR_b2_protect_anticorruption:0 "Protect NABU's Independence"
 UKR_b2_protect_anticorruption_desc:0 "The president publicly guarantees the independence of NABU and SAP, even if their investigations lead into his own Office. He says it live, looking into the camera, and a minute later every phone in the Office rings at once.\n\nWestern partners applaud. His inner circle stays silent but remembers. Such a step either makes a politician untouchable or leaves him completely alone, and which of the two it will be will become clear very soon."
 UKR_b2_bet_technocrats:0 "Bet on the Technocrats"
 UKR_b2_bet_technocrats_desc:0 "Yulia Svyrydenko, Mykhailo Fedorov and the young reformers who believe the state is a service, not a welfare office. The digital state, open registers and European integration as the programme of the second term.\n\nThey have ideas, a reputation in the West and a spreadsheet for every occasion. They lack only one thing: the habit of dealing with people who do not read spreadsheets."
 UKR_b2_bet_left:0 "Bet on the Left"
 UKR_b2_bet_left_desc:0 "Trade unions, veterans, Sotsialnyi Rukh and the left-wing MPs of the new Rada. The social state, a labour code and pressure on the oligarchs as the programme of the second term.\n\nBehind them stand the street, the mining towns and everyone tired of paying for other people’s crises. Against them stands almost everyone who owns a TV channel.\n\nThe president does not become left-wing because of this: he remains a politician who knows how to lead in time what would otherwise be led by someone else. It is a calculation, not a conversion to a new faith."
 UKR_b2_bet_oligarchs:0 "Bet on the Vertical"
 UKR_b2_bet_oligarchs_desc:0 "Big business, media holdings and loyal security officials. Stability through deals with those who have the resources, the factories and the airtime.\n\nIt is the most reliable and the oldest path in Ukrainian politics. It always works. Until one day it stops."
 UKR_b2_bet_nationalists:0 "Bet on the Nationalists"
 UKR_b2_bet_nationalists_desc:0 "Veteran councils, territorial defence and the right-wing electorate. National mobilisation as the programme of the second term: the army, language, memory and readiness for the great threat from the east.\n\nThis is a pillar that knows how to hold the line. The question is how much room that line will leave for those who think differently."
