 UKR_rapid_armored_thrust_tooltip:0 "§YArmored and mechanized divisions will receive significant tactical advantages, enhancing their mobility and striking power.§!"
 UKR_bayraktar_strike_tooltip:0 "§YPrecision drone strikes will weaken the enemy's defensive capabilities and reduce the effectiveness of their air defense systems.§!"
 UKR_nato_intel_tooltip:0 "§YIntelligence from allies will enhance our tactical awareness and command effectiveness, as well as reveal enemy vulnerabilities.§!"
 UKR_night_raids_tooltip:0 "§YSpecial operations during nighttime will provide tactical advantages to our forces and undermine enemy morale.§!"
