 # Духи от фокусов (PROPOSAL_spirits.md, пакет 5)
 UKR_decommunization_dispute:0 "The Decommunization Dispute"
 UKR_decommunization_dispute_desc:0 "Street names, monuments and textbooks are discussed in kitchens and TV studios. The one-time hit to stability has already landed, and the dispute drags on: stability falls a little every week, Svoboda gains, the CPU and PSPU lose. The further the country has gone into the national agenda, the louder the dispute."
 UKR_euro_momentum:0 "European Momentum"
 UKR_euro_momentum_desc:0 "Visits, agreements and pretty flags at press conferences. Partners are readier to talk trade, stability slowly rises every week, and For the Future and Servant of the People collect those who voted for Europe. OPZZh loses supporters meanwhile. The more the country lives on digital services, the stronger the effect."
 UKR_diplomatic_surge:0 "Diplomatic Offensive"
 UKR_diplomatic_surge_desc:0 "The Foreign Ministry works without days off: calls, visits, notes. Relations with partners grow faster and cost less to maintain. Political power comes in a little faster."
 UKR_reconciliation_mood:0 "Mood of Reconciliation"
 UKR_reconciliation_mood_desc:0 "The Donbas question and shared memory sound calmer than before. Stability and support for defense slowly rise every week, OPZZh loses, the Radical Party gains. The more the country has dealt with social issues, the stronger the effect."
 UKR_sanctions_regime:0 "Sanctions Regime"
 UKR_sanctions_regime_desc:0 "The NSDC decides fast, the courts catch up later. Political power comes in faster, partners’ trade confidence dips slightly, and stability slowly drains every week. OPZZh complains about “political repression” but loses supporters. The harder the line, the louder the effect."
 UKR_party_machine:0 "The Party Machine"
 UKR_party_machine_desc:0 "Regional branches, loyal heads of administrations and lists at every level. Political power comes in faster, but stability slowly drains every week: the machine has to feed its own. OPZZh grows because the vertical also attracts those used to old schemes, and Servant of the People loses part of its voters."
 UKR_veteran_wave:0 "The Veteran Wave"
 UKR_veteran_wave_desc:0 "Veterans go into local councils and campaign headquarters. Support for defense slowly rises every week, and the Radical Party and the Union of Left Forces take the votes of those against the oligarchs. The closer the country is to the social agenda, the louder the wave."
 UKR_cultural_reforms_desc:0 "New programs, festivals and school courses. Stability slowly rises every week and political decisions cost less. The closer the country is to the national agenda, the more Svoboda and European Solidarity grow."
 UKR_decommunization_dispute_dynamic:0 "Voter mood: the decommunization dispute"
