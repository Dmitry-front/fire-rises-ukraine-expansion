 # Лестницы олигархата и коррупции: волны реформ (PROPOSAL_spirits.md, пакет 4)
 UKR_deoligarchization_wave:0 "Wave of De-Oligarchization"
 UKR_deoligarchization_wave_desc:0 "The registry, the asset audit and cases against beneficiaries stay in the news: the reforms are visible, and the losers are loud. Stability, political power and partners’ trust rise for a while, Servant of the People gains, For the Future and OPZZh lose. The lower the step, the stronger the wave."
 UKR_anticorruption_wave:0 "Wave of Anti-Corruption Reforms"
 UKR_anticorruption_wave_desc:0 "New procedures, independent institutions and the first high-profile cases. Stability and partners’ trust rise for a while, Servant of the People gains, OPZZh loses. The second step is stronger than the first."
