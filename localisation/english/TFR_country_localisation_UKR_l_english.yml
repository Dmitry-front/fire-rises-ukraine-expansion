 UKR_rada_2023_order_tt:0 "Rada election results (party popularity):\n  Servant of the People: §Y42%§!\n  For the Future: §Y11%§!\n  European Solidarity: §Y15%§!\n  Left Front: §Y9%§!\n  Union of Left Forces: §Y5%§!\n  OPZZh: §Y7%§!\n  Svoboda: §Y5%§!\n  National Corps: §Y3%§!\n  CPU: §Y2%§!\n  PSPU: §Y1%§!"
 UKR_rada_2023_right_tt:0 "Rada election results (party popularity):\n  Servant of the People: §Y38%§!\n  For the Future: §Y10%§!\n  European Solidarity: §Y17%§!\n  Left Front: §Y9%§!\n  Union of Left Forces: §Y5%§!\n  OPZZh: §Y5%§!\n  Svoboda: §Y8%§!\n  National Corps: §Y5%§!\n  CPU: §Y2%§!\n  PSPU: §Y1%§!"
 UKR_sn_collapse_loss_tt:0 "Servant of the People loses §R[?UKR_sn_loss|0]%§! popularity. The votes go to other parties."
 UKR_west_trust_crisis:0 "Crisis of Trust in the West"
 UKR_west_trust_crisis_desc:0 "While America wages war on itself, the “Western path” is getting harder to sell to Ukrainian voters. Grants are cut, partners are busy with their own fires, and “where are our allies?” is asked on every talk show. The first to feel it are the parties that promised for years that the West would sort everything out: §YServant of the People§! and §YFor the Future§!. Stability leaks away a little every week, and trade partners prefer to discuss risks over contracts. The less the country relies on digital services, the more it hurts."
 UKR_left_consolidation:0 "Left Consolidation"
 UKR_left_consolidation_desc:0 "Trade unions, social democrats and young leftists speak with one voice for the first time in years, and that voice is about prices, wages and utility bills. Their rallies draw not only students with placards but miners, nurses and teachers. §YThe Radical Party§! and §YUnion of Left Forces§! are rising. The more the country has dealt with social issues, the louder the rallies sound. They also slowly reduce stability and political power gain."
 UKR_right_turn:0 "The Right Turn"
 UKR_right_turn_desc:0 "“Our own first”, “a strong army”, “no more experiments”. Slogans heard only at marches yesterday are repeated today by evening news anchors. The right does not win the arguments; it is simply always on camera. §YEuropean Solidarity§! and §YSvoboda§! are rising. A country that was heading for a national agenda reacts more strongly. War support slowly grows while stability slowly falls: the streets are louder."
 UKR_eggs_scandal:0 "Eggs at 17"
 UKR_eggs_scandal_desc:0 "The country knows the price of a single army egg better than the hryvnia exchange rate. Every new meme about the golden hen costs §YServant of the People§! a little trust. If the scandal is investigated, it will be forgotten quickly. If it is hushed up, it will keep resurfacing until the elections. An investigation softens the consequences, a cover-up amplifies them. The lower the ruling party rating, the worse the stability."
 UKR_corridor_rumours:0 "Whispers in the Corridors"
 UKR_corridor_rumours_desc:0 "There is no proof, but there are anonymous channels, “sources in the Office” and MPs who suddenly stopped saying hello in the canteen. Rumours are not yet a scandal, but §YServant of the People§! loses points every day they circulate in the Rada. The more half-truths piled up over the year, the stronger the rumours. Stability and the government’s grip slowly drain away every week."
 UKR_street_demands:0 "The Street Demands Change"
 UKR_street_demands_desc:0 "There are no tents on the Maidan yet, but the thermoses have come out. Students, veterans, entrepreneurs and trade unions demand change, and each of them means something different. Until the president shows whom he relies on, §YServant of the People§! keeps losing, while §YEuropean Solidarity§! and §Ythe Radical Party§! gather the discontented. Stability and war support slowly fall every week. The more half-truths and top-down rule piled up, the louder the street."
 UKR_oligarchs_retreating:0 "The Oligarchy in Retreat"
 UKR_oligarchs_retreating_desc:0 "The register of influential persons works, TV channels are losing their owners, and fewer MPs vote “as the office on Hrushevskoho told them”. The clans have not vanished: they went into the shadows, moved assets to relatives and are waiting for the wind to change. The next step brings another wave of de-oligarchization, stronger than the last."
 UKR_oligarchs_remnants:0 "Remnants of the Oligarchy"
 UKR_oligarchs_remnants_desc:0 "The big clans have been taken apart, but old habits outlive people. Somewhere in the regions a director still knows whom to call, and a regional court still settles a case “the human way”. A little more, and it will be mere corruption rather than a system. The last step removes the spirit entirely and brings the strongest wave of de-oligarchization."
 UKR_pop_communist_p5_tt:0 "CPU: §G+5%§! popularity"
 UKR_pop_conservative_m1_tt:0 "European Solidarity: §R-1%§! popularity"
 UKR_pop_conservative_p1_tt:0 "European Solidarity: §G+1%§! popularity"
 UKR_pop_conservative_p2_tt:0 "European Solidarity: §G+2%§! popularity"
 UKR_pop_conservative_p3_tt:0 "European Solidarity: §G+3%§! popularity"
 UKR_pop_libertarian_socialist_p6_tt:0 "Union of Left Forces: §G+6%§! popularity"
 UKR_pop_national_socialist_p1_tt:0 "Svoboda: §G+1%§! popularity"
 UKR_pop_national_socialist_p2_tt:0 "Svoboda: §G+2%§! popularity"
 UKR_pop_national_socialist_p3_tt:0 "Svoboda: §G+3%§! popularity"
 UKR_pop_social_democrat_m1_tt:0 "Left Front: §R-1%§! popularity"
 UKR_pop_social_democrat_p1_tt:0 "Left Front: §G+1%§! popularity"
 UKR_pop_social_democrat_p2_tt:0 "Left Front: §G+2%§! popularity"
 UKR_pop_social_democrat_p3_tt:0 "Left Front: §G+3%§! popularity"
 UKR_pop_social_democrat_p5_tt:0 "Left Front: §G+5%§! popularity"
 UKR_pop_social_liberal_p1_tt:0 "Servant of the People: §G+1%§! popularity"
 UKR_pop_social_liberal_p2_tt:0 "Servant of the People: §G+2%§! popularity"
 UKR_pop_social_liberal_p3_tt:0 "“Servant of the People”: §G+3%§! popularity"
 UKR_pop_social_liberal_m2_tt:0 "“Servant of the People”: §R-2%§! popularity"
 UKR_union_za_maibutnie_tt:0 "For the Future joins the ruling coalition."
 UKR_b2_bet_technocrats_tt:0 "§YWho they are:§! the reformers around Yulia Svyrydenko and Mykhailo Fedorov: the digital state, open registers, European integration.\n§YWhat they will demand:§! independent anti-corruption bodies, a transparent budget and cabinet seats for their people.\n§YRisk:§! the old elites and security services dislike it when everything is visible."
 UKR_b2_bet_left_tt:0 "§YWho they are:§! the trade unions, Sotsialnyi Rukh, left-wing veteran groups and euro-left MPs.\n§YWhat they will demand:§! a new labour code, social guarantees and accountability of the oligarchs for the privatisation of the 90s.\n§YRisk:§! big capital and Brussels will grow wary.\n§YFor the president:§! this is not ideology but a way to keep power by taking the lead of the left agenda before others do."
 UKR_b2_bet_oligarchs_tt:0 "§YWho they are:§! big business, media holdings and loyal security officials.\n§YWhat they will demand:§! untouchable assets, “understanding” regulators and quiet on the air.\n§YRisk:§! the anti-corruption bodies, the street and the European partners."
 UKR_b2_bet_nationalists_tt:0 "§YWho they are:§! veteran councils, territorial defence and the right-wing parties.\n§YWhat they will demand:§! the army first in the budget, a firm language and memory policy, no concessions to Moscow.\n§YRisk:§! the left, the Russian-speaking regions and cautious Western capitals."
 UKR_b2_bet_hidden_tt:0 "§gThe consequences of this choice will become clear after the inauguration.§!"
 # Block 2: ideas
 UKR_captured_judiciary:0 "Controlled Anti-Corruption Bodies"
 UKR_captured_judiciary_desc:0 "NABU and SAP formally work, but in practice they coordinate. Governing has become easier; partners have become more worried."
 UKR_eu_aid_frozen:0 "EU Aid Frozen"
 UKR_eu_aid_frozen_desc:0 "Brussels has suspended tranches until the independence of the anti-corruption bodies is restored. While the tranches are frozen, stability slowly drains every week, and the ruling party’s rating drags it down. Servant of the People loses, European Solidarity picks up supporters of the European course."
 UKR_pillar_organic:0 "Organic Alliance"
 UKR_pillar_organic_desc:0 "The president's new pillar continues everything he did before. Allies trust him, voters understand him. The pillar’s confidence slowly strengthens stability every week."
 UKR_pillar_mismatch_minor:0 "Unexpected Alliance"
 UKR_pillar_mismatch_minor_desc:0 "The choice of pillar surprised supporters and opponents alike. The new allies have yet to trust the president. Distrust slowly erodes stability every week, and the ruling party’s rating drags it down."
 UKR_pillar_mismatch:0 "A 180-Degree Turn"
 UKR_pillar_mismatch_desc:0 "The president has leaned on those he worked against for years. Old supporters feel betrayed, new ones do not trust him. Every week stability slowly leaves along with the trust of former supporters, and the ruling party’s rating drags it down."
 # Block 2: tooltips
 UKR_yermak_resurfaces_tt:0 "The case is quietly dropped. Yermak steps into the shadows, but people like him never disappear for good."
 UKR_yermak_trial_tt:0 "The case goes to court. The judges will decide, not the Office."
 UKR_yermak_resigned_tt:0 "Yermak resigns. The investigation continues without public pressure."
 # Block 2: campaign events
 ukraine_politics.200.t:0 "The Campaign Begins"
 ukraine_politics.200.d:0 "The new year begins with a political vacuum. There is no alliance in the Rada, the ruling party’s ratings are at rock bottom, and less than three months remain until the presidential election. The Olivier salad is not even finished, and the campaign team already gathers for a night meeting.\n\nThey leave at dawn, red-eyed and with one conclusion: the old slogans no longer work. The “new faces” have aged, the “servant of the people” has become the government, and the country must be shown whom the president will rely on next. The campaign begins."
 ukraine_politics.200.a:0 "Let us begin. Coffee for everyone."
 ukraine_politics.201.t:0 "Stadium 2.0"
 ukraine_politics.201.d:0 "In 2019 candidate Zelensky challenged Poroshenko to a debate at the Olimpiyskiy, and Poroshenko answered: “Stadium it is.” Five years later history comes full circle.\n\nPoroshenko records a video in front of the same stadium and returns the challenge: this time it is the sitting president who must answer for the results. Social media is delighted, everyone has déjà vu, and the stadium management cautiously asks who is paying for the rent this time."
 ukraine_politics.201.a:0 "Stadium it is. Again."
 ukraine_politics.201.b:0 "Debate online, through Diia, with a viewers’ vote."
 ukraine_politics.201.c:0 "The president works, he does not perform at stadiums."
 ukraine_politics.202.t:0 "Army. Language. Faith. Experience."
 ukraine_politics.202.d:0 "Poroshenko’s campaign updates its old 2019 slogan with one word: to army, language and faith it adds “dosvid”, experience. Billboards appear overnight, and each carries the same subtext: “we already knew how to govern, while you spent five years learning”.\n\nThe blow is precise: the collapse of the alliance, the rumours around the Office, “five years of experiments”. Silence is not an option, and how we answer will be remembered for a long time. The campaign team argues whether to answer on substance or in a way that becomes a meme."
 ukraine_politics.202.a:0 "Answer with facts and figures."
 ukraine_politics.202.b:0 "Answer with social promises."
 ukraine_politics.202.c:0 "Answer hard."
 ukraine_politics.202.e:0 "Seize the patriotic agenda."
 ukraine_politics.204.t:0 "NABU Checks the Contracts"
 ukraine_politics.204.d:0 "According to the media, the anti-corruption bureau is gathering material on contracts linked to the circle around the President’s Office. Officially no one confirms anything. Unofficially everyone knows in which offices the shredders have not been switched off for two weeks.\n\nInvestigative journalists keep watch outside the NABU building, and in the Rada corridors people are placing bets on whether the detectives will make it before the election."
 ukraine_politics.204.d_sub:0 "According to the media, the anti-corruption bureau was gathering material on contracts linked to the circle around the President’s Office, but after the resubordination the case has “stalled”. Detectives are moved to other cases, folders travel to the Prosecutor General’s Office.\n\nJournalists publish the leaks themselves, and each new one sounds louder than the official silence. Western ambassadors say the word “concern” more and more often, and more and more slowly."
 ukraine_politics.204.d_prot:0 "According to the media, the anti-corruption bureau is gathering material on contracts linked to the circle around the President’s Office. The president guaranteed the bureau its independence, and now the investigation is going full force.\n\nThe president’s circle looks at him as if he had signed his own sentence. Western partners look at him as if they had seen a real reformer for the first time. Which of them is right will soon be clear."
 ukraine_politics.204.a:0 "Let us see what they find."
 ukraine_politics.208.t:0 "Candidate Registration"
 ukraine_politics.208.d:0 "The Central Election Commission accepts documents from candidates, and the queue outside the building is longer than the one for a certificate in Diia on its first day. The candidate's deposit is measured in millions of hryvnias, but there are dozens of applicants all the same: some want the presidency, some want airtime, and some just dream of seeing their surname on the ballot next to a famous one.\n\nAmong the applicants are people with very familiar surnames and very strange programmes. The Office of the President knows perfectly well what “technical” candidates are for: they split the vote and spoil the map. The only question is whose map it is and who will use it."
 ukraine_politics.208.a:0 "Do not interfere. Let the voters make sense of the list themselves."
 ukraine_politics.208.b:0 "Quietly back a few “technical” candidates in the opposition's regions."
 ukraine_politics.208.c:0 "Propose a law against look-alike candidates: ban similar surnames on the ballot."
 ukraine_politics.209.t:0 "What Was Remembered After the Debate"
 ukraine_politics.209.d_accept:0 "Yesterday the Olimpiyskiy gathered so many people that the billboards by the metro complained of competition. The debate lasted almost three hours: Poroshenko reminded everyone of the collapse of the union and the “eggs at 17”, the president answered with budget figures and asked not to confuse a campaign with a TV show.\n\nNobody named a winner, but social media has already picked its leader: a meme in which both candidates stand on an empty stand arguing over which of them owns the emptiness. The headquarters believes the stadium played into the hands of whoever was ready for the questions, and now it must decide what to build the coming weeks on."
 ukraine_politics.209.d_online:0 "The debate through Diia gathered three million viewers and one technical glitch that lasted exactly as long as it took everyone to discuss it. The opposition compared the format to a talk show with buttons, while supporters of the president called it the country's first honest rostrum. Viewers voted with their smartphones and then argued about what exactly they had pressed.\n\nBoth headquarters declared victory, and both are right: the numbers in the app can be read however you like. The Office is pleased with something else: young voters watched a political broadcast to the end for the first time in the campaign."
 ukraine_politics.209.d_refuse:0 "The president did not come out to the Olimpiyskiy, but the stadium gathered anyway: Poroshenko spoke alone, and his headquarters brought an empty chair for the sitting head of state onto the stand. The photo of the chair went round all the news, and the question “where is the president?” turned into a meme within a day.\n\nThe Office insists the head of state was working, and that is true: the photos from his office show a pile of documents and a very tired face. But the voter looks not at the documents but at the chair, and the headquarters has already understood that."
 ukraine_politics.209.d:0 "The debate is behind us and the headquarters sums up. What voters remembered will be clear from the next polls: while the leaders argue about figures, the ratings honestly show whom they believed.\n\nEvery headquarters has its own version of what happened, and each has a chart. The task for the coming weeks is simple: do not let the opponent write the summary for us."
 ukraine_politics.209.a:0 "Put the emphasis on the results of the first term."
 ukraine_politics.209.b:0 "Put the emphasis on the future: what people will get in a second term."
 ukraine_politics.209.c:0 "Do not comment on the outcome and get back to work."
 ukraine_politics.210.t:0 "Dialogue with Moscow"
 ukraine_politics.210.d:0 "Yuriy Boyko and the Opposition Platform announce that the only way to end the tariff winter and the drawn-out pause in relations with the neighbour is direct dialogue with Moscow. The slogan is short, the words “peace” and “gas” feature in every second sentence, and in the polls of the south-east this gives a stable few percent. TV channels that sang a different tune yesterday suddenly open their airtime to him.\n\nFor the Office this is an unpleasant and very useful storyline at once. Unpleasant, because the topic drifts into tariffs and security. Useful, because any answer can be used: silence, a check or a public argument. The only question is what to pay with."
 ukraine_politics.210.a:0 "Ignore it: every minute of airtime for him works for us."
 ukraine_politics.210.b:0 "Ask the SBU to check the funding sources of the OPZZh campaign."
 ukraine_politics.210.c:0 "Propose a public debate: let him explain what exactly he offers Moscow."
 ukraine_politics.211.t:0 "The List of Candidates"
 ukraine_politics.211.d:0 "The list of candidates is growing, and it contains more famous surnames than the president has friends. Vitali Klitschko is running at the national level for the first time, betting on the capital's districts and talk of city problems. Dmytro Razumkov, the former Speaker of the Rada, is campaigning against the “vertical”. A dozen more candidates share the remaining percentages and the free airtime between them.\n\nThe headquarters calculates whom it can agree with before the runoff: none of them will get through, but the votes of their electorates may turn out to be decisive. Deals will have to be made, and the sooner the cheaper."
 ukraine_politics.211.d_spoilers:0 "The list of candidates is growing, and it contains more famous surnames than the president has friends. Vitali Klitschko is running at the national level for the first time, betting on the capital's districts and talk of city problems. Dmytro Razumkov, the former Speaker of the Rada, is campaigning against the “vertical”. A dozen more candidates share the remaining percentages and the free airtime between them.\n\nJournalists have already noticed that the campaigns of several “technical” candidates look suspiciously like donor campaigns: the same contractors, the same headquarters, the same jokes. The Office, of course, denies everything, but TV channels do not need proof to ask the question on air."
 ukraine_politics.211.a:0 "Start talks with Klitschko's team: Kyiv against Bankova is a bad storyline."
 ukraine_politics.211.b:0 "Work with Razumkov: he criticises us but does not fight us."
 ukraine_politics.211.c:0 "Make no deals: in the runoff everyone will come to us."
 ukraine_politics.212.t:0 "E-Voting for the Diaspora"
 ukraine_politics.212.d:0 "The Ministry of Digital Transformation brings a presentation to the Office: millions of Ukrainians abroad, seven-hour queues at embassies and a pilot project for voting through Diia with biometric identity confirmation. It sounds beautiful. The law, however, still knows only the paper ballot, and the opposition explains in advance that Diia is a way to vote for whoever was sent from above.\n\nThe initiative may bring the votes of the diaspora, where the president is supported, or it may bring headlines that the government wants digital elections. Time is limited: for the law to make it before 31 March, the Rada will have to vote this week."
 ukraine_politics.212.a:0 "Submit a bill for a diaspora pilot."
 ukraine_politics.212.b:0 "We are not ready yet: more paper polling stations and consulates."
 ukraine_politics.212.c:0 "Decline: paper only, no experiments."
 ukraine_politics.213.t:0 "The Day of Silence"
 ukraine_politics.213.d:0 "On the eve of the runoff the day of silence arrives, but, as usual, there is no silence: TV channels air not campaigning but analysis, messengers carry thousands of clips, and social networks show unexpected polls. The headquarters has plenty of questions: whoever breaks the rules first gets a fine and headlines, and whoever holds out gets an awkward pause in the conversation with the voter.\n\nThe media holdings wait for a signal: they have airtime, the headquarters has no wish to pay fines. In the Office they decide how to spend the day without breaking the law and without giving the airwaves to opponents."
 ukraine_politics.213.a:0 "Agree with the media holdings: neutral “analytical” pieces instead of campaigning."
 ukraine_politics.213.b:0 "Observe the silence law to the last minute."
 ukraine_politics.213.c:0 "Launch memes: they do not count as campaigning, the courts have not decided that yet."
 ukraine_politics.220.t:0 "The Veterans' Congress"
 ukraine_politics.220.d:0 "A congress of ATO veterans takes place in Kyiv, to which representatives of the trade unions and the Office of the President are invited for the first time. The hall is noisy: some demand land and housing, others benefits and sanatoriums, still others that officials come at least once without a tie and without the word “optimisation”. The organisers have laid printouts on the tables: the register of veterans, the list of promised apartments and a column marked “done” that was empty yesterday.\n\nFor the president this is a chance to show that his interest in veterans is not only electoral. Politically it is simple: the veteran community is one of the most disciplined audiences in the country, and whoever gives it land today gets votes tomorrow. The only question is where to start."
 ukraine_politics.220.a:0 "Land plots for veterans under the new register."
 ukraine_politics.220.b:0 "Subsidised housing and mortgages: priority for veterans."
 ukraine_politics.220.c:0 "A common table with the unions: one negotiation format for veterans and workers."
 ukraine_politics.221.t:0 "The Veterans' Councils Forum"
 ukraine_politics.221.d:0 "The hall of the veterans' forum smells of coffee, uniform and principle. The organisers are veterans' councils attached to regional administrations, which for a year have been seeking a say in the appointment of territorial defence commanders and in the distribution of veterans' programmes. On the stage is a map of the country with flags: which council is where, whose reserve is whose and who answers to whom.\n\nFor the Office this is a chance to get a pillar that does not need to be fed with party money: the councils are disciplined, they are heard in the army, and in their presence the opposition suddenly becomes more careful with its words. But every right of voice handed to the councils will later have to be taken back, and returning it is often harder than giving it."
 ukraine_politics.221.a:0 "Give the councils the right to recommend territorial defence commanders."
 ukraine_politics.221.b:0 "Keep the councils advisory: listen, but decide ourselves."
 ukraine_politics.221.c:0 "Hand part of the veterans' programmes to the local councils."
 ukraine_politics.222.t:0 "The First Awkward Publication"
 ukraine_politics.222.d:0 "The registers open, and the first thing journalists find is not a spy scheme but the purchase of park benches at a price for which a small yacht could be bought. The data is publicly available, questions appear within an hour, and the minister whose department bought the benches appears within two.\n\nFor the president this is a moment of choice: the “Transparent State” has just worked against his own team. It can be used as proof of an honest system, or it can be quietly hushed up before the word “benches” becomes a meme. It already has."
 ukraine_politics.222.a:0 "Dismiss the person responsible and publish the investigation. The system works."
 ukraine_politics.222.b:0 "Demand the money back and settle for a reprimand."
 ukraine_politics.222.c:0 "Call the purchase market-based and shift the attention."
 ukraine_politics.223.t:0 "Our People Let Us Down"
 ukraine_politics.223.d:0 "The regional head appointed from “our own people” does what any “own person” can do: solves problems quickly, by hand and by phone. Two weeks later the prosecutor's office comes to him with the question of why his cousin holds the contract for repairing all the bridges of the region. The governor insists the bridges were in poor condition, and that is true, and also that everything is transparent, and that is already a question.\n\nThis is the very moment experts warned about: the system of “our people” is efficient exactly until the first scandal. The voter does not know the details yet, but the TV channels are already choosing a headline. A decision is needed today."
 ukraine_politics.223.a:0 "Dismiss him and order an inspection: “our own” are accountable too."
 ukraine_politics.223.b:0 "Cover for him: the contract is legal and the questions are political."
 ukraine_politics.223.c:0 "Quietly move the governor to another post."
 ukraine_politics.224.t:0 "An Awkward Question"
 ukraine_politics.224.d:0 "A meeting with voters in the Poltava region. The president has already answered questions about tariffs and roads when a woman in the front row, a retired teacher, stands up and asks about an official with a dacha registered in his mother-in-law's name. The security tenses, aides look for the right phrase, and the hall waits, because the whole hall has watched the news.\n\nThe answer will take ten seconds and will be remembered for ten years. The video is already in every second person's messenger, and the headquarters understands that this is perhaps the most important episode of the whole trip."
 ukraine_politics.224.a:0 "Admit the problem: NABU and the court should deal with it, not us."
 ukraine_politics.224.b:0 "Answer with humour and steer the conversation to roads."
 ukraine_politics.224.c:0 "Promise to check personally and publish a report every month."
 ukraine_politics.225.t:0 "A Law on Friday Evening"
 ukraine_politics.225.d:0 "The law on the resubordination of NABU and SAP passes the Rada on a Friday evening, when the journalists have already left and the deputies have not yet reached the airport. By Sunday the first rally gathers outside the bureau building: hundreds of people with homemade placards, and by Monday the ambassadors of the G7 countries all say the same word: “concerned”.\n\nIn the Office this is called a technical reform, but the word “technical” stopped being reassuring after the first news bulletin. The street is still small, the embassies are still polite and the opposition has not yet been given a pretext. It is up to the president to decide how expensive this Friday will turn out to be."
 ukraine_politics.225.a:0 "Meet the activists and explain the point of the reform."
 ukraine_politics.225.b:0 "Do not change course: the law is passed, the matter is closed."
 ukraine_politics.225.c:0 "Offer the embassies consultations: the law can be amended."
 ukraine_politics.226.t:0 "The Circle Asks Him to Reconsider"
 ukraine_politics.226.d:0 "At a closed meeting in the Office the president is carefully, without unnecessary words, told that the guarantee of NABU's independence is a beautiful decision but an expensive one. Deputies list contracts that could become a subject of interest and surnames better not mentioned. One adviser jokes that independent bodies are fine as long as they are independent of others.\n\nWestern partners, meanwhile, are phoning with congratulations. The president knows the price of both sides: he can be Brussels' favourite but lonely in his own office, or he can be inconvenient to everyone at once. The decision is made, but explaining it will take long."
 ukraine_politics.226.a:0 "The decision stands. Independence is not up for bargaining."
 ukraine_politics.226.b:0 "Give the circle guarantees: the investigations will not touch the inner circle."
 ukraine_politics.226.c:0 "Propose a compromise: rules of procedure for detectives, but no interference in cases."
 #Session 11: nationalist path, block 2 (2024 campaign)
 ukraine_politics.230.t:0 "A Single Candidate for the Right"
 ukraine_politics.230.d:0 "In January Svoboda and the National Corps discuss whether to go into the presidential election with a single candidate. In 2019 the joint list of the right gathered a little over two percent, and the mutual reproaches have not ended since: each side considers the other not right-wing enough and is sure that its own leader should stand first on the ballot. There is, however, only one ballot.\n\nThe Office of the President watches with interest: a single right-wing candidate will take votes from Poroshenko, while a fragmented right will take a few from everyone. You can help them agree through mutual acquaintances, hinder them through mutual acquaintances too, or limit yourself to the role of a spectator and keep your reputation clean."
 ukraine_politics.230.a:0 "Nudge the right toward a single candidate through mutual acquaintances."
 ukraine_politics.230.b:0 "Do not interfere: let the right decide for themselves."
 ukraine_politics.230.c:0 "Play on their disagreements and back the dispute over leadership."
 ukraine_politics.231.t:0 "\"In Ukraine\" or \"on Ukraine\""
 ukraine_politics.231.d:0 "On the eve of the campaign debates an old dispute over a preposition flares up online. A foreign TV channel puts \"on Ukraine\" in its captions, the Ministry of Foreign Affairs politely writes to the editors, and feeds fill with dictionaries, linguists and the question \"what do you say when you go to Poland?\". The dispute unexpectedly brings together people who agree on nothing else, and at once splits everyone else.\n\nThe campaign team decides whether to intervene: a letter to editors looks solid, a meme looks lively, and a right-wing bill on a single norm in official texts promises a loud headline and a long discussion. Voters meanwhile ask about tariffs and prices, but talk shows do not call about prices, they call about the preposition."
 ukraine_politics.231.a:0 "Send editors an official letter from the Ministry of Foreign Affairs."
 ukraine_politics.231.b:0 "Laugh it off with a meme from the president's team."
 ukraine_politics.231.c:0 "Back the right-wing bill on a single norm in official texts."
 ukraine_politics.232.t:0 "\"Zrada\" or \"Peremoga\""
 ukraine_politics.232.d:0 "Every evening talk show hosts divide the government's decisions into \"zrada\" (betrayal) and \"peremoga\" (victory): an opened road is a peremoga, a postponed law is a zrada, a rescheduled session is a zrada with signs of peremoga. The show's rating grows faster than any candidate's, and politicians come to the studio to find out in advance which category their decisions will be put in.\n\nThe president's team understands that the format cannot be ignored: if you do not choose the category yourself, it will be chosen for you. You can release a \"peremoga of the week\" of your own, admit a couple of \"zradas\" and close the subject, or answer with numbers alone and hope the meme tires first."
 ukraine_politics.232.a:0 "Release our own \"peremoga of the week\": roads, contracts, figures."
 ukraine_politics.232.b:0 "Publicly admit a couple of \"zradas\" and close the subject."
 ukraine_politics.232.c:0 "Answer only with numbers and stay out of the game."
 ukraine_politics.233.t:0 "Language in the Debates"
 ukraine_politics.233.d:0 "In the final debate the host asks about language: quotas on television, the law on services, schools for national minorities in the west. The topic brings no new voters but can lose old ones, and all the candidates know it. Hungary watches Transcarpathia, Romania watches Bukovina, and in Kharkiv and Odesa people turn on the television to hear whether they have been forgotten.\n\nYou can hold the line of the law without amendments, offer a transition period and amendments for minority schools, or sidestep the question by saying that tariffs and security come first. Any answer will be heard by someone as a promise and by someone else as a threat."
 ukraine_politics.233.d_enf:0 "In the final debate the host asks about language and recalls that in January 2021 you backed the law and the ombudsman without concessions. The topic brings no new voters but can lose old ones, and all the candidates know it. Hungary watches Transcarpathia, Romania watches Bukovina, and in Kharkiv and Odesa people turn on the television to hear whether they have been forgotten.\n\nYou can confirm the earlier line, offer a transition period and amendments for minority schools, or sidestep the question by saying that tariffs and security come first. Any answer will be heard by someone as a promise and by someone else as a threat."
 ukraine_politics.233.d_trans:0 "In the final debate the host asks about language and recalls that in January 2021 you proposed giving people time to adapt: first explain, then check. The topic brings no new voters but can lose old ones, and all the candidates know it. Hungary watches Transcarpathia, Romania watches Bukovina, and in Kharkiv and Odesa people turn on the television to hear whether they have been forgotten.\n\nYou can tighten the line, lock in the soft approach with amendments for minority schools, or sidestep the question by saying that tariffs and security come first. Any answer will be heard by someone as a promise and by someone else as a threat."
 ukraine_politics.233.a:0 "The law is not up for discussion: language is the foundation of the state."
 ukraine_politics.233.b:0 "Offer amendments: a transition period for minority schools."
 ukraine_politics.233.c:0 "Sidestep the question: tariffs and security first."
 ukraine_politics.234.t:0 "Veterans' Forum"
 ukraine_politics.234.d:0 "Between the rounds veterans' organisations hold a forum in Kyiv. On stage are ATO participants, military volunteers and medics, and in the front row sits the leader of the National Corps, Andriy Biletsky, who speaks briefly and to the point: veterans need rights, not gratitude. The hall applauds standing, cameras show the presidential delegation in the middle of the hall, and every gesture of it will be read as a political signal.\n\nAny reaction suits the leader of the National Corps: a handshake confirms his status, distance strengthens the role of the opposition, and absence gives a reason for offence. But the voters of the second round are looking not at him but at how the future president behaves in front of people who have fought."
 ukraine_politics.234.a:0 "Shake hands and publicly thank the veterans."
 ukraine_politics.234.b:0 "Speak about veterans' rights and avoid political slogans."
 ukraine_politics.234.c:0 "Send a minister: the president is busy."
 UKR_right_unity_push:0 "The Right Looks for a Single Candidate"
 UKR_right_unity_push_desc:0 "The right-wing field stirs: Svoboda and the National Corps try on a common banner. The centre loses a little, the right gains a little, and everyone is nervous. The more confidently the country was heading for a national agenda, the louder the unification. Stability falls a little every week."
 UKR_language_dispute:0 "Language Dispute"
 UKR_language_dispute_desc:0 "After the language debate people argue in studios and cafes: the topic unites some and frightens others. Until the dispute settles, stability slowly falls every week. Svoboda rises, Servant of the People loses part of its Russian-speaking voters."
 UKR_veteran_spotlight:0 "Veterans in the Spotlight"
 UKR_veteran_spotlight_desc:0 "The handshake at the forum was remembered. Veterans' organisations ask for what was promised, and conscripts look at them in a new light. While the veterans are in the frame, war support slowly grows every week. The veteran agenda works for the right: Svoboda and the National Corps rise."
 #Session 11: nationalist path, block 3, step 1 (skeleton)
 UKR_np_convent:0 "National Convention"
 UKR_np_convent_desc:0 "National democrats and veterans, the Azov movement, Svoboda and the street gather in one hall and one chat. There is one question: who owns the state, and whose programme will underpin the second term. The president will choose the programme, but power will have to be shared with each of the groups."
 UKR_np_veteran_councils:0 "Veterans' Councils"
 UKR_np_veteran_councils_desc:0 "Veterans' organisations get seats on regional and city councils and a voice in the distribution of land, housing and benefits. It is a cheap way to turn discontent into status and an armed street into a public council, if there is enough patience."
 UKR_np_memory_institutes:0 "Institutes of Memory"
 UKR_np_memory_institutes_desc:0 "The Institute of National Memory gets more funding and more work: museums, educational programmes, memorial weeks, archives. Memory becomes a state project, and so a subject of argument over whose it is."
 UKR_np_heroes_upa:0 "Heroes of the UPA"
 UKR_np_heroes_upa_desc:0 "The state officially recognises the fighters for independence of the twentieth century and their commanders: monuments, streets, state ceremonies. Radicals are pleased, neighbours are nervous, and historians remind everyone that every country has its own heroes and not all of them are equally pleasant to others."
 UKR_np_heroes_present:0 "Heroes of Our Time"
 UKR_np_heroes_present_desc:0 "The state creates a canon of those who died on the Maidan, in the ATO and in other recent battles: a pantheon, a law on commemoration, walls of memory. The new heroes are known by name, but radicals will ask what happened to the ancestors."
 UKR_np_convent_tt:0 "Opens the §YCouncil of the Nation§! window, the §YCivic - Ethnic§! scale and the power shares of four groups. In a few days the convention will choose a §Yprogramme§!."
 UKR_nation_council:0 "Council of the Nation"
 UKR_nation_council_desc:0 "The Council of the Nation brings together four groups who argue every day about which of them is the real one. The decisions of this window move the Civic - Ethnic scale and the shares of influence of the groups.\n\n§YPower shares:§!\nNational democrats and veterans: §Y[?UKR_np_demo_pct|0]%§!\nThe Azov movement: §Y[?UKR_np_azov_pct|0]%§!\nSvoboda: §Y[?UKR_np_svoboda_pct|0]%§!\nThe street: §Y[?UKR_np_street_pct|0]%§!"
 UKR_nc_veteran_council:0 "Veterans' Council"
 UKR_nc_veteran_council_desc:0 "Gather veterans from all regions: listen, promise and fix a little of what was promised before. A cheap way to get political power and two months of a conscription boost."
 UKR_nc_memorial_week:0 "Memorial Week"
 UKR_nc_memorial_week_desc:0 "A week of ceremonies, exhibitions and school lessons of memory. War support and stability rise while historians prepare their comments."
 UKR_nc_plast_camp:0 "Plast Camp"
 UKR_nc_plast_camp_desc:0 "A summer camp for teenagers: tents, songs, first aid and a little military training. The reserve and society benefit, and the scale shifts toward the civic nation."
 UKR_nc_calm_street:0 "Talks with the Street"
 UKR_nc_calm_street_desc:0 "Quiet meetings with the organisers of actions, ultras and leaders of small groups. The street loses some influence and partners are calmer, but the radicals will remember who \"calmed\" them."
 UKR_nc_national_rally:0 "National Assembly"
 UKR_nc_national_rally_desc:0 "A big rally with flags, songs and speeches. Political power and war support rise at once, but the scale shifts toward the ethnic nation and the \"street\" grows stronger."
 UKR_np_civic_ethnic_balance:0 "The Nation: Civic or Ethnic"
 UKR_np_civic_ethnic_balance_desc:0 "Whom does the state belong to: those who serve, or those who were born and speak the language? The scale shows where the country is leaning."
 UKR_bop_np_civic:0 "Civic Nation"
 UKR_bop_np_ethnic:0 "Ethnic Nation"
 UKR_bop_np_compromise:0 "National Compromise"
 UKR_bop_np_civic_leads:0 "Service Over Origin"
 UKR_bop_np_civic_dominates:0 "Citizenship by Service"
 UKR_bop_np_civic_edge:0 "Service Counts for Everyone"
 UKR_bop_np_ethnic_leads:0 "Language and Origin First"
 UKR_bop_np_ethnic_dominates:0 "A Nation of Blood and Language"
 UKR_bop_np_ethnic_edge:0 "The Street Is Out of Control"
 ukraine_politics.700.t:0 "National Convention"
 ukraine_politics.700.d:0 "The convention meets in one of Kyiv's halls, and the rows show at once who is who: national democrats and veterans sit with notebooks, the Azov movement stands against the wall in an even line, Svoboda takes the front row with flags, and the street has settled in the balcony with phones. Each group has brought its own draft programme and is ready to defend it down to the last comma of the rules of procedure.\n\nThe president chooses the programme. \"A Republic of Service\" makes a citizen of whoever serves the country, regardless of origin and language. \"Army-Nation\" turns the military school into the foundation of the state. \"Ridnyi Dim\" puts language, origin and faith at the centre, and will cost the most. Andriy Biletsky remains Minister of Internal Affairs whichever you choose, but his role differs."
 ukraine_politics.700.a:0 "A Republic of Service: the nation is those who serve."
 ukraine_politics.700.b:0 "Army-Nation: the army as school and frame of the state."
 ukraine_politics.700.c:0 "Ridnyi Dim: language, origin, faith."
 ukraine_politics.701.t:0 "Convention: Dividing Power"
 ukraine_politics.701.d:0 "The programme is chosen, and now it is decided who gets how much. On the table are posts in the Council of the Nation, seats on supervisory boards, funding for veterans' organisations and the right to speak first. Every group believes it deserves more than it is offered, and the convention chat has been discussing the rules of procedure for the second hour.\n\nNow national democrats and veterans hold §Y[?UKR_np_demo_pct|0]%§! of influence, the Azov movement §Y[?UKR_np_azov_pct|0]%§!, Svoboda §Y[?UKR_np_svoboda_pct|0]%§!, and the street §Y[?UKR_np_street_pct|0]%§!. You can divide equally, bet on the main group of the programme, or invite everyone and pay for peace."
 ukraine_politics.701.a:0 "Parity: each group gets an equal slice."
 ukraine_politics.701.b:0 "Power to the programme's main group, the rest are offended."
 ukraine_politics.701.c:0 "Broad coalition: posts for everyone, at a higher price."
 ukraine_politics.730.t:0 "Service Counts for Everyone"
 ukraine_politics.730.d:0 "The law on service begins to work in practice: foreign volunteers, Crimean Tatars in the ranks, and Russian-speaking veterans from Kharkiv and Odesa receive the same citizenship and the same rights as everyone else who served. In right-wing chats this is called a betrayal of the idea of the nation, in foreign newspapers a rare example of civic nationalism that did not forget the word \"civic\".\n\nRight-wing radicals are offended, veterans are pleased, and Brussels praises Ukrainian laws for the first time in a long while. But if the scale is not held back, Svoboda and the street will go into opposition to their own path."
 ukraine_politics.730.a:0 "Accept: service is citizenship."
 ukraine_politics.730.b:0 "Slow down: leave the disputed points for later."
 ukraine_politics.731.t:0 "The Street Is Out of Control"
 ukraine_politics.731.d:0 "In the evening after the assembly a column leaves the square and reaches a shopping centre whose owner has put up a menu in Russian. An hour later there are three versions of what happened online, and in the morning embassies ask questions to which the Ministry of Internal Affairs has no short answers. The street felt that the state was on its side and decided not to wait for warrants.\n\nYou can stop the column hard with police and the National Guard, agree with the organisers and give them \"public patrolling\", or declare that this is the will of the people. The first costs political power, the second the trust of partners, the third money and EU aid."
 ukraine_politics.731.a:0 "Stop it hard: police and the National Guard."
 ukraine_politics.731.b:0 "Agree on \"public patrolling\"."
 ukraine_politics.731.c:0 "Declare it the will of the people."
 UKR_np_republic_of_service:0 "A Republic of Service"
 UKR_np_republic_of_service_desc:0 "A citizen is one who serves. Rights and benefits for veterans, citizenship for foreign legionaries, and questions for everyone else about where they were."
 UKR_np_army_nation:0 "Army-Nation"
 UKR_np_army_nation_desc:0 "The army and veterans' corps are the school and frame of the state. A strong defence, weak civilian ministries."
 UKR_np_native_home:0 "Ridnyi Dim"
 UKR_np_native_home_desc:0 "Language, origin and faith as the basis of the state. More cohesive inside, colder outside."
 UKR_np_veterans_integrated:0 "Veterans' Councils Instead of Druzhynas"
 UKR_np_veterans_integrated_desc:0 "Former volunteer battalions and druzhynas pass under veterans' councils: less street, more public oversight."
 UKR_national_corps_patronage:0 "National Corps Patronage"
 UKR_national_corps_patronage_desc:0 "Former volunteer units are built into the National Guard and the army, and graduates of their schools hold posts in the agencies. The army gets personnel, and the civilian authorities get another influential neighbour."
 UKR_far_right_legalised:0 "Legalised Far Right"
 UKR_far_right_legalised_desc:0 "Right-wing organisations have received official status and access to agencies and budgets. The street no longer hides, and the state no longer pretends not to notice."
 UKR_np_boost_veterans:0 "The Veterans' Council Works"
 UKR_np_boost_veterans_desc:0 "Veterans see that they are being listened to and are more willing to call young people to service."
 UKR_np_boost_memorial:0 "Memorial Week"
 UKR_np_boost_memorial_desc:0 "Shared memory calms disputes for a few weeks and lifts the mood."
 UKR_np_boost_rally:0 "Echo of the National Assembly"
 UKR_np_boost_rally_desc:0 "The rally gave a lot of energy and it has not yet dissipated. Part of that energy will go into unpleasant stories."
 UKR_biletsky_civic:0 "Andriy Biletsky"
 UKR_biletsky_civic_desc:0 "The founder of Azov heads the Ministry of Internal Affairs within the frame of the civic programme: veterans' councils instead of druzhynas, service instead of slogans. Some think he has matured, others that he has adapted."
 UKR_biletsky_army:0 "Andriy Biletsky"
 UKR_biletsky_army_desc:0 "The founder of Azov runs the Ministry of Internal Affairs as a military school: veteran cadres, hard discipline, patronage over units that consider themselves his people."
 UKR_biletsky_ethnic:0 "Andriy Biletsky"
 UKR_biletsky_ethnic_desc:0 "The founder of Azov is at the Ministry of Internal Affairs under a programme where his influence is shared with Svoboda and the street. He is needed, but not convenient for everyone."
 UKR_np_program_civic_tt:0 "Programme: §YA Republic of Service§!. The nation is those who serve. The scale starts on the civic side, and the spirit of far-right meddling is replaced by veterans' councils."
 UKR_np_program_army_tt:0 "Programme: §YArmy-Nation§!. The army as school and frame of the state. The scale is in the centre, and the spirit of far-right meddling turns into National Corps patronage."
 UKR_np_program_ethnic_tt:0 "Programme: §YRidnyi Dim§!. Language, origin, faith. The scale is on the ethnic side and right-wing organisations are legalised. §RThe highest price of all§!."
 UKR_np_biletsky_civic_tt:0 "Andriy Biletsky heads the Ministry of Internal Affairs: §Ya veteran in a civic frame§!."
 UKR_np_biletsky_army_tt:0 "Andriy Biletsky heads the Ministry of Internal Affairs: §Ya ministry as a military school§!."
 UKR_np_biletsky_ethnic_tt:0 "Andriy Biletsky heads the Ministry of Internal Affairs: §Yinfluence shared with Svoboda and the street§!."
 UKR_np_demo_up_tt:0 "The influence of §Gnational democrats and veterans§! grows."
 UKR_np_demo_down_tt:0 "The influence of §Rnational democrats and veterans§! falls."
 UKR_np_azov_up_tt:0 "The influence of the §GAzov movement§! grows."
 UKR_np_svoboda_up_tt:0 "The influence of §GSvoboda§! grows."
 UKR_np_street_up_tt:0 "The influence of the §Rstreet§! grows."
 UKR_np_street_down_tt:0 "The influence of the §Gstreet§! falls."
 UKR_np_lead_group_up_tt:0 "The programme's main group is §Gstrongly boosted§!, the rest are §Roffended§!."
 UKR_np_all_up_tt:0 "All four groups receive §Gposts and influence§!."
 UKR_np_right_groups_down_tt:0 "The influence of §RSvoboda and the street§! falls."
 #Session 11: nationalist path, block 3, step 2 (programme branches, decisions, heroes)
 UKR_np_civic_veterans_law:0 "Law on Veteran-Citizens"
 UKR_np_civic_veterans_law_desc:0 "The law fixes that service gives rights: housing and land benefits, priority in hiring for the civil service, a voice in local councils. Accountants are already counting how much honesty will cost."
 UKR_np_civic_service_citizenship:0 "Service and Citizenship"
 UKR_np_civic_service_citizenship_desc:0 "Foreign volunteers, Crimean Tatars and Russian-speaking veterans receive citizenship for service. Right-wing chats call it a betrayal, foreign newspapers a rare example of civic nationalism."
 UKR_np_civic_veteran_credit:0 "Veterans' Credit"
 UKR_np_civic_veteran_credit_desc:0 "Preferential loans and state orders for veterans' small business. The veteran barista stops being a meme and becomes a taxpayer."
 UKR_np_civic_plast_defense:0 "Plast Camps and Territorial Defence"
 UKR_np_civic_plast_defense_desc:0 "Summer camps and school clubs receive military training, and territorial defence gets permanent mentors. The reserve grows, and parents argue whether there is too much drill in the schedule."
 UKR_np_civic_nation_in_ranks:0 "A Nation in Ranks"
 UKR_np_civic_nation_in_ranks_desc:0 "The country adopts its own formula: a citizen is one who serves, and the state owes him the same. The economy moves to a mixed model with veterans' preferences."
 UKR_np_army_school:0 "Corps-School"
 UKR_np_army_school_desc:0 "Military schools at the corps become the basis of education: discipline, physical training, history. Graduates arrive in the agencies already with the \"right\" outlook, and the ministries do not notice at once."
 UKR_np_army_artels:0 "Veterans' Artels"
 UKR_np_army_artels_desc:0 "Former fighters receive state orders for equipment repair, drone production and gear. Defence industry grows, and the civilian sector thinks it has been passed over again."
 UKR_np_army_axis:0 "Baltic - Black Sea Axis"
 UKR_np_army_axis_desc:0 "The Intermarium idea: an alliance of states from the Baltic to the Black Sea as an alternative to both Moscow and Brussels. Warsaw and Bucharest listen, and the memory of Volhynia shows where the alliance has a weak link."
 UKR_np_army_arms:0 "Arms for Citizens"
 UKR_np_army_arms_desc:0 "A law allows citizens licensed weapons for service in the reserve. The reserve grows, and local police are surprised to find that the neighbour now has an opinion too, and it is loaded."
 UKR_np_army_final:0 "Army-Nation"
 UKR_np_army_final_desc:0 "The army becomes the frame of the state: schools, artels, reserves and veterans' councils are subordinated to the corps. The economy passes under military control, and the question of who runs the country becomes a question of rank."
 UKR_np_ethnic_language_school:0 "Language and School"
 UKR_np_ethnic_language_school_desc:0 "All state institutions and schools switch to Ukrainian, minority schools remain but with strict requirements. Transcarpathia and Bukovina read the news more carefully than usual."
 UKR_np_ethnic_church:0 "A Single Church"
 UKR_np_ethnic_church_desc:0 "The state supports a single local church and restricts structures tied to Moscow. For some this is the defence of the country, for others state interference in faith."
 UKR_np_ethnic_economy:0 "National Economy"
 UKR_np_ethnic_economy_desc:0 "Tariffs, quotas and priority for Ukrainian producers: import substitution instead of openness. Factories get orders, consumers get price tags."
 UKR_np_ethnic_citizenship:0 "Citizenship Law"
 UKR_np_ethnic_citizenship_desc:0 "Citizenship goes to those born on Ukrainian territory and to ethnic Ukrainians, the rest after ten years of residence and an exam in language and history. The right is pleased, the neighbours are not, and notaries get new work."
 UKR_np_ethnic_final:0 "Ridnyi Dim"
 UKR_np_ethnic_final_desc:0 "The state finally defines itself through language, origin and faith. There is more cohesion inside, fewer friends outside, and the economy moves to a corporatist model."
 UKR_nc_language_law2:0 "Language Law 2"
 UKR_nc_language_law2_desc:0 "All state institutions and schools work only in Ukrainian, minority schools remain but with strict requirements. Society grows in the west, and Hungary and Romania write notes."
 UKR_nc_media_quotas:0 "90% Quotas"
 UKR_nc_media_quotas_desc:0 "The share of Ukrainian in the media is no less than ninety percent. Political power grows, freedom of speech is discussed, and producers look for ways to re-edit television series."
 UKR_nc_passport_nation:0 "Passport of the Nation"
 UKR_nc_passport_nation_desc:0 "The \"nationality\" line returns to the passport. Political power grows, stability falls, and human rights defenders write letters."
 UKR_nc_lustration:0 "Lustration"
 UKR_nc_lustration_desc:0 "Officials and security officers of former regimes are vetted. Corruption retreats a step, stability sags, and the old guard is offended."
 UKR_nc_rehab_upa:0 "Rehabilitation of the Fighters"
 UKR_nc_rehab_upa_desc:0 "The state fixes in law the status and commemoration of the fighters for independence of the twentieth century. Radicals are pleased, and Warsaw begins a dispute over memory."
 UKR_nc_visa_russia:0 "Visa Regime with Russia"
 UKR_nc_visa_russia_desc:0 "Visas are introduced for entry from Russia. Moscow's influence weakens, war support grows, and border guards get used to queues."
 UKR_nc_no_brussels:0 "A Course Without Brussels"
 UKR_nc_no_brussels_desc:0 "Kyiv declares that joining the EU is no longer a goal. Political power and independence grow, EU aid is frozen. An expensive and nearly irreversible decision."
 UKR_nc_strategic_corps:0 "Strategic Enterprises to the Corps"
 UKR_nc_strategic_corps_desc:0 "The National Corps gets the right to manage strategic enterprises through veterans' corps. Industry and the army grow, oligarchs retreat, and economy ministers get nervous."
 UKR_nc_military_schools:0 "Military Schools at the Corps"
 UKR_nc_military_schools_desc:0 "The corps open new classes, training grounds and courses. The army gets cadres, the state gets expenses."
 UKR_nc_volunteer_corps_status:0 "Status of the Volunteer Corps"
 UKR_nc_volunteer_corps_status_desc:0 "Volunteer corps are given official status, funding and a place in the defence structure. The reserve grows, and civilian officials get used to new neighbours."
 UKR_nc_service_decree:0 "Decree on Citizenship for Service"
 UKR_nc_service_decree_desc:0 "The decree gives citizenship to those who served in Ukrainian units regardless of origin and language. Volunteers from other countries come more willingly, and right-wing chats make noise."
 UKR_nc_tatar_council:0 "Crimean Tatar Veterans in the Council"
 UKR_nc_tatar_council_desc:0 "Veterans from among the Crimean Tatars receive seats in the Council of the Nation. The civic programme gets a symbol, and the EU a reason to praise."
 UKR_nc_veteran_grants:0 "Veterans' Business: Grants"
 UKR_nc_veteran_grants_desc:0 "Small grants to open a business: a workshop, a coffee shop, a farm. Each grant costs little, each business brings in a little more."
 UKR_np_nation_in_ranks:0 "A Nation in Ranks"
 UKR_np_nation_in_ranks_desc:0 "A citizen is one who serves, and the state owes him the same. The army and society speak the same language."
 UKR_np_army_nation_final:0 "The Army State"
 UKR_np_army_nation_final_desc:0 "The corps have become the frame of the state: schools, artels and reserves are subordinated to a single vertical. The country is strong in defence and weak in civilian life."
 UKR_np_native_home_final:0 "House of the Nation"
 UKR_np_native_home_final_desc:0 "Language, origin and faith define the state. More cohesive inside, colder outside, and the economy pays for this price."
 UKR_np_import_substitution:0 "Import Substitution"
 UKR_np_import_substitution_desc:0 "Tariffs and quotas protect Ukrainian producers. Factories are busy, consumers pay."
 ukraine_politics.710.t:0 "Field of Mars: Returning the Names"
 ukraine_politics.710.d:0 "In Lviv, at the Lychakiv Cemetery, on the Field of Mars where Sich riflemen, insurgents and those who fell in recent years lie, a state ceremony of reburial of the remains of fighters of the twentieth-century liberation struggle is being prepared. The organisers have invited the president, veterans' organisations and descendants. Local historians argue about names, priests about the order of the service, and officials about how many people the site can hold so that nobody takes offence.\n\nThe ceremony will be a signal: the president can come and speak, send a delegation headed by a minister, or hold it without political slogans, only a military ritual and a list of names. Radicals will watch the tone of the speech, neighbours the words about memory, and historians everything at once."
 ukraine_politics.710.a:0 "Come and speak: the state recognises the fighters."
 ukraine_politics.710.b:0 "Send a delegation headed by a minister."
 ukraine_politics.710.c:0 "Hold the ceremony without political slogans: a military ritual and a list of names."
 ukraine_politics.711.t:0 "Field of Mars: Farewell to the Heroes of Our Time"
 ukraine_politics.711.d:0 "At the Lychakiv Cemetery in Lviv, on the Field of Mars where Sich riflemen, insurgents and those who fell in recent years lie, a state ceremony of farewell takes place for those who died on the Maidan, in the ATO and in other battles of recent years. The host reads not figures but names and cities, and the list turns out longer than the organisers expected. Families ask not to turn the ceremony into a rally, veterans' organisations ask for places on the rostrum, and ministers ask for rules of procedure.\n\nThe president decides how to hold this day: stand in line with the families, give a short speech, or hand the organisation to the Ministry of Veterans. Each option costs political power and will be remembered differently, and radicals watch with interest whether the speech forgets the ancestors."
 ukraine_politics.711.a:0 "Stand in ranks together with the families of the fallen."
 ukraine_politics.711.b:0 "A short speech and a minute of silence."
 ukraine_politics.711.c:0 "Hand the organisation to the Ministry of Veterans."
 ukraine_politics.712.t:0 "Warsaw's Reply"
 ukraine_politics.712.d:0 "A few days later Polish politicians and newspapers recall Volhynia in 1943: Warsaw considers those events genocide, Kyiv does not accept that definition, and the memory of them is different in the two countries and painful in both. Polish news writes that the Ukrainian state honours those whom Poland remembers differently, Ukrainian politicians answer that each country has its own heroes, and historians on both sides ask for quiet.\n\nForeign ministry channels are working, but the president's reply is expected quickly: its tone will decide whether this is an episode of diplomatic politeness or a drawn-out dispute. Exhumations and monuments, trade and the neighbour's aid are all connected, and a mistake here can be expensive."
 ukraine_politics.712.a:0 "Reply with a note and offer a joint commission of historians."
 ukraine_politics.712.b:0 "Call it Ukraine's internal affair."
 ukraine_politics.712.c:0 "Compromise: resume exhumations, keep the monuments."
 ukr_np_upa_dispute:0 "Dispute over Memory"
 ukr_np_upa_dialogue:0 "Dialogue on Memory"
 ukr_np_language_law:0 "Language Law"
