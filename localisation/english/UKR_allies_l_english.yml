l_english:
 UKR_allies_category:0 "European NATO"
 UKR_allies_category_desc:0 "We ask and hope to be heard. The trust of European capitals grows with victories, restraint, reforms and transparency, and falls with losses, scandals and recklessness.\n\n§YTrust:§! [UKR_NATO_TRUST_DISPLAY]\n§YNATO unity:§! [UKR_NATO_UNITY_DISPLAY]"
 UKR_ALLIES_TITLE:0 "§YEuropean NATO§!"
 UKR_ALLIES_TRUST_LABEL:0 "Trust"
 UKR_ALLIES_UNITY_LABEL:0 "NATO unity"
 UKR_ALLIES_TRUST_TOOLTIP:0 "§YEuropean NATO trust§!\n\nHow far the capitals of Europe believe that help to Ukraine will not be wasted. It grows with victories, restraint in war, reforms and transparency, and falls with losses, scandals and escalation.\n\n§YLatest change:§! [UKR_NATO_TRUST_LAST]"
 UKR_ALLIES_UNITY_TOOLTIP:0 "§YNATO unity§!\n\nThe state of the alliance under the TFR mechanic (levels 1 to 5). We do not change it, only take it into account: the more united NATO is, the more equipment arrives in aid packages.\n\nLevel 3 is the normal volume, lower is less, higher is more. While the alliance has no levels yet (before the US split), the volume is normal.\n\nAid volume now: §Y[?UKR_nato_aid_mult|0]%§! of normal."
