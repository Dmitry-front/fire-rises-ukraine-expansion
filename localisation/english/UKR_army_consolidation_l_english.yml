l_english:
 UKR_army_consolidation:0 "New Model Army"
 UKR_army_consolidation_desc:0 "The army reform went in parts: a new command system, the officer school, drones, the chosen doctrine. Each part delivered, but running them separately has become awkward. The General Staff folds everything into one field manual and one training system. The rules become common to all branches and needless approvals disappear."
 UKR_army_consolidation_tooltip:0 "§YMerges into one spirit:§!\nNATO Command Structure, Pioneers of Unmanned Warfare and the spirits of the chosen doctrine. The combined bonus is §G10% higher§! than the sum of the originals, penalties do not grow."
 UKR_army_reform_offensive:0 "New Model Army: Maneuver"
 UKR_army_reform_offensive_desc:0 "A single system of command, reconnaissance and drones serves the offensive doctrine. Staffs plan faster and mobile units break through sooner."
 UKR_army_reform_combined:0 "New Model Army: Combined Operations"
 UKR_army_reform_combined_desc:0 "A single manual ties infantry, artillery, armor and reconnaissance into one scheme. Units hold longer and cooperate without extra approvals."
 UKR_army_reform_defensive:0 "New Model Army: Deep Defense"
 UKR_army_reform_defensive_desc:0 "A single defense system unites command, reconnaissance and engineering. Positions are built faster, hold longer and cost less to supply."
