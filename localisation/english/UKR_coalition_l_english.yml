l_english:
 ukraine_coalition.1.t:0 "The First Coalition Headquarters"
 ukraine_coalition.1.d_seat:0 "The European capitals have agreed on a joint headquarters that ties together deliveries, training and operational plans, and we have been invited to the table as a participant, not only as a petitioner. This is how the formats of support for Ukraine that appeared in 2022 work: regular meetings of defense ministers from dozens of countries who set out who hands over what and when, and coordination centers where officers of donor countries work next to Ukrainian ones.\n\nFor us this means access to joint planning and faster decisions: our requests are now treated as parts of one plan rather than one by one. The allies offer to place liaison officers in our staff. It is convenient, but some decisions will have to be coordinated."
 ukraine_coalition.1.d_guest:0 "The coalition is setting up a joint headquarters, but for now we are only listened to. Decisions are made by the capitals that give the most equipment and money, and a seat at the table depends on trust: we are invited as guests, we can state our needs and receive data, but we cannot vote. Trust grows from victories, restraint and kept promises, and then we will be seated as equals.\n\nThe allies still offer to place liaison officers in our staff, so that they understand what we lack and can plead our case at home."
 ukraine_coalition.1.a:0 "Accept the liaison officers"
 ukraine_coalition.1.b:0 "Decisions stay with Kyiv"
 ukraine_coalition.2.t:0 "A Permanent Seat at the Table"
 ukraine_coalition.2.d:0 "The trust we have built has paid off. The allies are ready to move us from participants of the headquarters to permanent members of the core group: our representative will see the full picture of deliveries and take part in planning the next stages instead of receiving a ready schedule.\n\nIn reality, countries outside an alliance get a seat at a joint table not through a defense treaty but through a format: a standing council or contact group where a partner takes part in discussions as an equal but does not assume the defense obligations of others. This is exactly the status we are offered. The price is a duty to share data on losses and on how aid is used."
 ukraine_coalition.2.a:0 "Accept the permanent seat"
 ukraine_coalition.2.b:0 "Decline, so as not to tie our hands"
 ukraine_coalition.10.t:0 "Who Commands the Coalition"
 ukraine_coalition.10.d_ger:0 "Berlin has taken the lead of the bloc, but the choice of a leader did not settle who actually commands. Paris reminds everyone that France and Britain have their own nuclear forces and Germany does not, and asks to share command between the three capitals. London backs the idea of a three-way headquarters. Berlin replies that it pays the most and supplies the most equipment.\n\nThe dispute over who is in charge is older in Europe than the present war: in 1966 France left the integrated command of NATO and returned to it only in 2009, because it did not want to hand over decisions about its forces. We are asked to side with one of them, because our voice in the bloc has become weighty."
 ukraine_coalition.10.d_fra:0 "Paris has taken the lead of the bloc, and Berlin and London are unhappy. Germany reminds everyone that it has the largest economy in Europe and the largest share of deliveries, and asks that this be taken into account. London points to its experience of joint operations and close intelligence ties and proposes a three-way headquarters.\n\nThe dispute over who is in charge is older in Europe than the present war: in 1966 France left the integrated command of NATO and returned to it only in 2009, because it did not want to hand over decisions about its forces. Now it falls to France to play the role it avoided for decades. We are asked to side with one of them."
 ukraine_coalition.10.d_eng:0 "London has taken the lead of the bloc, and Berlin and Paris are unhappy about it. Germany believes the leader should be the one who pays and supplies the most. France insists that it has its own nuclear capability and an independent line, and is not ready to follow someone else's plan.\n\nThe dispute over who is in charge is older in Europe than the present war: in 1966 France left the integrated command of NATO and returned to it only in 2009, because it did not want to hand over decisions about its forces. Leadership without the consent of the others is fragile, and we are asked to take a side."
 ukraine_coalition.10.d_none:0 "The bloc has no recognised leader for now: Berlin, Paris and London argue over whose line will become the common one, and each pulls the blanket to its own side. Germany pays the most, France and Britain have their own nuclear forces, and nobody is ready to submit to another.\n\nThe dispute over who is in charge is older in Europe than the present war: in 1966 France left the integrated command of NATO and returned to it only in 2009, because it did not want to hand over decisions about its forces. We are asked to take a side, because our opinion in the bloc has begun to count."
 ukraine_coalition.10.a:0 "Back the leader of the bloc"
 ukraine_coalition.10.b:0 "Propose a joint staff with officers of all three countries"
 ukraine_coalition.10.c:0 "Stay out of it: our business is the front"
 ukraine_coalition.11.t:0 "Gas and Ukrainian Storage"
 ukraine_coalition.11.d:0 "A winter without Russian gas turns out to be hard: Germany, which spent decades building its industry on the pipe from Russia, looks for where to store gas and what to replace the missing volumes with. Ukraine has some of the largest underground gas storage facilities in Europe, and in reality they served European traders as a warehouse for many years. Berlin asks us to open them for European purchases.\n\nBut our winter is hard too: strikes on the power grid, restrictions, and gas pumped in for Europe will not reach our homes. We can open the storage, keep the gas for ourselves, or offer a trade: storage in exchange for air defense."
 ukraine_coalition.11.a:0 "Open the storage for European purchases"
 ukraine_coalition.11.b:0 "Keep the gas for ourselves"
 ukraine_coalition.11.c:0 "Storage in exchange for air defense"
 ukraine_coalition.12.t:0 "The Register of Formations"
 ukraine_coalition.12.d:0 "The allies want to know who they are handing weapons to. Around the army there are dozens of volunteer battalions, foreign volunteers and territorial defense, and the chain of command is not clear for every unit. Donors need a single register: who belongs to the armed forces, how issued equipment is accounted for and who answers for its fate.\n\nIn reality such demands arise with any large aid effort: end-user tracking is a normal part of export control, and some volunteer formations have already caused disputes in the parliaments of donor countries. A register will raise trust, but some volunteers and their supporters will see it as an attack on their independence."
 ukraine_coalition.12.a:0 "Introduce a single register under joint oversight"
 ukraine_coalition.12.b:0 "Fold the volunteers into the army without a public register"
 ukraine_coalition.12.c:0 "Refuse: volunteers answer only to Kyiv"
 ukraine_coalition.30.t:0 "Operation Davout: France Asks for Support"
 ukraine_coalition.30.d:0 "Paris is preparing an amphibious operation against Crimea. For France this is the first major landing from the sea in decades, and it needs data on coastal defenses, air defense and enemy fleet positions that Ukrainian intelligence knows best.\n\nAn amphibious landing is the hardest type of operation: it needs air superiority, clearing of the approaches and coordination of all arms, so such operations are prepared for months, and partners who know the theater are asked to help with intelligence and cover. We are asked for the same: to commit resources without opening a second front for ourselves."
 ukraine_coalition.30.a:0 "Commit intelligence, air defense and covering aircraft"
 ukraine_coalition.30.b:0 "Limit ourselves to sharing information"
 ukraine_coalition.30.c:0 "Ask to include a Ukrainian contingent"
 ukraine_coalition.31.t:0 "Operation Davout: The Outcome"
 ukraine_coalition.31.d_win:0 "The French operation has succeeded: the landing force has gained a foothold on the Crimean coast, and the peninsula has stopped being an unreachable rear for the enemy. Success in such operations is the merit of the whole chain: intelligence, cover, supply and the endurance of the infantry on the beach.\n\nFor us this is a chance to speak of Crimea not as something lost but as a question on the agenda. But the allies value a calm tone: statements that are too loud may alarm the capitals that fear escalation."
 ukraine_coalition.31.d_fail:0 "The operation has failed: the landing did not gain a foothold, and France had to pull its forces back. Amphibious landings fail even for strong armies, it is enough to recall Dieppe in 1942 and Gallipoli in 1915, and the ally's society bears losses hard.\n\nParis needs support, and we need its faith in the common cause. But we have a right to our own opinion: we can stand beside it in public or quietly keep our distance."
 ukraine_coalition.31.a:0 "Declare: Crimea is back on the agenda"
 ukraine_coalition.31.b:0 "Keep the rhetoric down: the allies need a quiet success"
 ukraine_coalition.31.c:0 "Publicly support the ally"
 ukraine_coalition.31.d:0 "Keep our distance: everyone has their own mistakes"
 ukraine_coalition.32.t:0 "The Joint Offensive"
 ukraine_coalition.32.d:0 "Germany, France and Britain have agreed on a joint offensive against Russia. It is a rare case when allies agree not only on deliveries but on a single plan: strikes along several axes at the same time so that the enemy cannot shift reserves.\n\nFor us the main question is what role we have been given. Large offensive operations of coalitions are won by coordinated timing, supply and air superiority, not by the number of divisions, and a partner who cannot keep up with the common schedule lets the others down."
 ukraine_coalition.32.a:0 "Take the main axis"
 ukraine_coalition.32.b:0 "Pinning attacks on the secondary axis"
 ukraine_coalition.32.c:0 "Decline: the army is worn out"
 ukraine_coalition.50.t:0 "Hints at Negotiations"
 ukraine_coalition.50.d:0 "War fatigue is growing in the European capitals: budgets are cracking, voters ask how much longer this will last, and some politicians speak openly of 'freezing the line'. The diplomats do not demand yet, they only hint that it would be easier for the allies to keep helping if Kyiv showed readiness for contacts.\n\nIn reality, partners' pressure on a country at war usually goes exactly like this: first closed meetings and 'exchanges of views', then conditions attached to new aid packages. We asked for help and cannot pretend we hear nothing."
 ukraine_coalition.50.a:0 "Reject it publicly"
 ukraine_coalition.50.b:0 "Agree to closed consultations"
 ukraine_coalition.50.c:0 "Demand security guarantees instead of a freeze"
 ukraine_coalition.51.t:0 "The Allies' Conditions"
 ukraine_coalition.51.d:0 "The hints are over. The capitals have made it clear that the next aid packages will be tied to taking part in negotiations: without steps toward them the queues for deliveries will stretch, and each new request will cost more, in attention paid to the partners' advice.\n\nSuch conditionality of aid (deliveries in exchange for reforms or steps in diplomacy) is an ordinary tool: international lenders have used it for decades. Accepting the conditions gives the army and society a breather, refusing risks trust and our seat at the headquarters."
 ukraine_coalition.51.a:0 "Accept the conditions and sit down at the table"
 ukraine_coalition.51.b:0 "Refuse"
 ukraine_coalition.52.t:0 "A Roadmap of Guarantees"
 ukraine_coalition.52.d:0 "The allies are ready to talk not about a freeze but about what comes after: security guarantees. In reality the question of 'what will hold an aggressor back after a ceasefire' was answered in different ways: membership in an alliance (Article 5 of the North Atlantic Treaty of 1949), bilateral guarantees with obligations of assistance, a permanent presence of allied troops, and large-scale military aid that makes a new attack too costly.\n\nWe are offered the last path: long-term agreements on deliveries, training and joint production. It is not membership, but it is a clear horizon, which a tired society needs no less than the front."
 ukraine_coalition.52.a:0 "Accept the roadmap"
 ukraine_coalition.52.b:0 "Insist on membership with no compromise"
 ukraine_coalition.70.t:0 "Layered Air Defense"
 ukraine_coalition.70.d_l2:0 "Two tiers of protection now work over the key sites: long-range anti-aircraft systems engage large targets, while self-propelled anti-aircraft guns and mobile groups cover the low altitudes. In reality the layers of air defense do not replace each other: an expensive missile spent on a cheap drone loses on cost, and an anti-aircraft gun cannot reach a ballistic target.\n\nStrikes on infrastructure will become rarer and weaker, but the stock of interceptors melts with every attack and will have to be replenished with requests to the allies."
 ukraine_coalition.70.d_l3:0 "A layered system now works over the capital and the power-grid hubs: long-range systems intercept ballistic missiles, medium and short ranges cover cruise missiles, and anti-aircraft guns and mobile machine-gun groups catch drones. It is the most expensive part of defense, but it saves the most lives.\n\nStrikes on infrastructure are now noticeably rarer and weaker, but the stock of interceptors is used up with every attack and will have to be kept up all the time."
 ukraine_coalition.70.a:0 "Conserve the interceptors"
 ukrainewar.300.d_l2:0 "Enemy missiles and drones strike power stations, water supplies and heating networks again, but some targets can be covered: anti-aircraft systems and mobile groups shoot down a significant share of the raid. Some areas are left without power, but not for weeks, and society endures these strikes more easily than before.\n\nHowever, the stock of interceptors melts with every attack."
 ukrainewar.300.d_l3:0 "A raid of missiles and drones tries to break through the layered defense of the capital and the power hubs, and most targets are shot down. Isolated hits cause outages, but the city does not plunge into darkness, and the enemy strategy of pressure on the rear stalls.\n\nThe price of such a shield is the constantly expended interceptors."
 UKR_air_defense_level_1:0 "Sky Shield: Level One"
 UKR_air_defense_level_1_desc:0 "Separate anti-aircraft batteries cover the capital and a few key sites. They will not stop a raid, but they noticeably limit the damage. The level depends on air defense points (requests to Germany, France and Lithuania) and on the air defense priority; points melt with every strike."
 UKR_air_defense_level_2:0 "Sky Shield: Level Two"
 UKR_air_defense_level_2_desc:0 "Two tiers of protection: long-range systems and short-range anti-aircraft guns. Strikes on infrastructure are rarer and weaker. The stock of interceptors melts with every attack."
 UKR_air_defense_level_3:0 "Sky Shield: Level Three"
 UKR_air_defense_level_3_desc:0 "A layered system around the capital and the power-grid hubs. Strikes on infrastructure are noticeably rarer and weaker. Keeping the shield up requires constantly replenishing the stock of interceptors."
 UKR_coalition_seat_1:0 "Participant of the Coalition Headquarters"
 UKR_coalition_seat_1_desc:0 "Our officers work in the allies' joint headquarters: access to planning and faster decisions on our requests."
 UKR_coalition_seat_2:0 "A Permanent Seat at the Headquarters"
 UKR_coalition_seat_2_desc:0 "Ukraine's permanent representative takes part in the coalition's core planning group and sees the full picture of deliveries. In return we share data on losses and on how aid is used."
 UKR_joint_planning:0 "Joint Planning with the Allies"
 UKR_joint_planning_desc:0 "Allied officers and our staff planners prepare operations together, and the plans come out faster and better coordinated."
 UKR_coalition_friction:0 "Chill in the Coalition"
 UKR_coalition_friction_desc:0 "Some of the allies are unhappy with our position. Diplomats have to spend more time on explanations."
 UKR_gas_squeeze:0 "Gas in European Storage"
 UKR_gas_squeeze_desc:0 "Part of the gas went into storage for European purchases, and our homes and industry get less heat. The price of friendship with the allies in a hard winter."
 UKR_peace_pressure:0 "The Allies' Pressure to Negotiate"
 UKR_peace_pressure_desc:0 "The capitals tie new aid packages to steps toward negotiations. Every request takes more effort, and society is tired of uncertainty. The prices of requests to the countries have risen for a time."
 UKR_security_track:0 "The Security Guarantees Roadmap"
 UKR_security_track_desc:0 "The country has a clear horizon: long-term agreements on deliveries, training and joint production. It is not membership, but society has an answer to the question 'what next'."
 UKR_ad_attrition_tt:0 "With a §Y35%§! chance part of the interceptors is used up: air defense points §R-1§!"
 UKR_trust_reason_22:0 "§G+3§! backed the common line of the coalition"
 UKR_trust_tt_coalition_loyal:0 "European NATO trust: §G+3§!"
 UKR_trust_reason_23:0 "§R-3§! went against the common line of the coalition"
 UKR_trust_tt_coalition_strain:0 "European NATO trust: §R-3§!"
 UKR_trust_reason_24:0 "§G+3§! transparency: the register of formations"
 UKR_trust_tt_transparency:0 "European NATO trust: §G+3§!"
 UKR_trust_reason_25:0 "§G+3§! took part in a joint operation"
 UKR_trust_tt_joint_op:0 "European NATO trust: §G+3§!"
 UKR_trust_reason_26:0 "§R-3§! refused pressure to negotiate"
 UKR_trust_tt_talks_refused:0 "European NATO trust: §R-3§!"
 UKR_trust_reason_27:0 "§G+2§! agreed to consultations"
 UKR_trust_tt_talks_open:0 "European NATO trust: §G+2§!"
 UKR_ALLIES_AD_LABEL:0 "Sky shield"
 UKR_ALLIES_AD_TOOLTIP:0 "§YSky shield§!\n\nThe level of air defense from 0 to 3. It comes from air defense points (requests to Germany, France and Lithuania) and the air defense priority. The higher the level, the rarer and weaker the strikes on civilian infrastructure. With every strike the stock of interceptors may melt."
 UKR_ALLIES_SEAT_LABEL:0 "Seat at HQ"
 UKR_ALLIES_SEAT_TOOLTIP:0 "§YSeat at the coalition headquarters§!\n\nGuest, participant or permanent seat. The level depends on trust and on your decisions in the coalition. Participants of the headquarters plan faster and get more even decisions on requests."
 UKR_AD_LEVEL_0:0 "§R0, unprotected sky§!"
 UKR_AD_LEVEL_1:0 "§O1, separate batteries§!"
 UKR_AD_LEVEL_2:0 "§Y2, two tiers§!"
 UKR_AD_LEVEL_3:0 "§G3, layered system§!"
