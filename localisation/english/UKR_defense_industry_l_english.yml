l_english:
 UKR_defense_industry_category:0 "Defence Industry"
 UKR_defense_industry_category_desc:0 "Ukrainian defence plants run on wear and enthusiasm. The state can give them an order, money and staff: for the duration of a programme the chosen equipment gets cheaper, and when it ends the organisation receives funding for its own development."
 UKR_mio_cost_2B:0 "£dx  §H2B§!"
 UKR_mio_cost_2B_blocked:0 "£dx  §R2B§!"
 UKR_mio_cost_3B:0 "£dx  §H3B§!"
 UKR_mio_cost_3B_blocked:0 "£dx  §R3B§!"
 UKR_mio_cost_5B:0 "£dx  §H5B§!"
 UKR_mio_cost_5B_blocked:0 "£dx  §R5B§!"
 UKR_mio_funds_200_tt:0 "When the programme ends the organisation will receive §G200§! funds"
 UKR_mio_funds_250_tt:0 "When the programme ends the organisation will receive §G250§! funds"
 UKR_mio_funds_300_tt:0 "When the programme ends the organisation will receive §G300§! funds"
 UKR_malyshev_organization:0 "Malyshev Plant and Morozov Design Bureau"
 UKR_malyshev_organization_desc:0 "The Kharkiv tank-building centre, heir to the T-64 and T-84 school: medium and light tanks. Batches are small, but the running gear is reliable and the protection solutions are home-grown."
 UKR_malyshev_initial_trait:0 "Kharkiv Tank-Building School"
 UKR_malyshev_initial_trait_desc:0 "Organisation speciality: Malyshev Plant and Morozov Design Bureau"
 UKR_armor_repair_organization:0 "Armoured Repair Plants"
 UKR_armor_repair_organization_desc:0 "Plants in Lviv, Kyiv and Mykolaiv repair and refit vehicles. In a war of attrition, a machine returned to service is worth more than a new one."
 UKR_armor_repair_initial_trait:0 "Repair and Refit"
 UKR_armor_repair_initial_trait_desc:0 "Organisation speciality: Armoured Repair Plants"
 UKR_kraz_organization:0 "KrAZ and Wheeled Armoured Vehicle Makers"
 UKR_kraz_organization_desc:0 "The Kremenchuk truck plant and private assemblers build trucks and wheeled armoured personnel carriers with high cross-country ability."
 UKR_kraz_initial_trait:0 "Kremenchuk School"
 UKR_kraz_initial_trait_desc:0 "Organisation speciality: KrAZ and Armoured Vehicle Makers"
 UKR_drone_cluster_organization:0 "Fort Enterprise and the UAV Defence Cluster"
 UKR_drone_cluster_organization_desc:0 "Fort in Vinnytsia makes small arms to domestic and licensed designs, and next to it grows a cluster of drone makers: Ukrspecsystems, Skyeton, Athlon Avia, volunteer workshops and private start-ups. A classic arms plant and garage workshops in one organisation: from a rifle to a reconnaissance drone."
 UKR_drone_cluster_initial_trait:0 "Workshops and Volunteers"
 UKR_drone_cluster_initial_trait_desc:0 "Organisation speciality: Fort Enterprise and the UAV Defence Cluster"
 UKR_antonov_organization:0 "Antonov"
 UKR_antonov_organization_desc:0 "The Kyiv aircraft-building school: transport aircraft, long range and heavy payloads."
 UKR_antonov_initial_trait:0 "Kyiv Aircraft-Building School"
 UKR_antonov_initial_trait_desc:0 "Organisation speciality: Antonov"
 UKR_motor_sich_organization:0 "Motor Sich, Ivchenko-Progress and the Aircraft Repair Plants"
 UKR_motor_sich_organization_desc:0 "Zaporizhzhia engines for aircraft, helicopters and drones, and the repair plants of Lviv, Mykolaiv and Chuhuiv that keep Soviet MiG-29s and Su-27s flying and sometimes make them better than new. Engine and airframe in one loop."
 UKR_motor_sich_initial_trait:0 "Zaporizhzhia Engine School"
 UKR_motor_sich_initial_trait_desc:0 "Organisation speciality: Motor Sich, Ivchenko-Progress and the Aircraft Repair Plants"
 UKR_mykolaiv_yard_organization:0 "Mykolaiv Shipyards and Sea Drones"
 UKR_mykolaiv_yard_organization_desc:0 "The Black Sea Shipyard, Zorya-Mashproekt and the designers of uncrewed boats: corvettes, gas-turbine plants, coastal defence and swarm drones. The small fleet of a country that has no large one."
 UKR_mykolaiv_yard_initial_trait:0 "Black Sea Shipbuilding School"
 UKR_mykolaiv_yard_initial_trait_desc:0 "Organisation speciality: Mykolaiv Shipyards and Sea Drones"
 UKR_mio_trait_oplot_engine:0 "6TD-type Engine"
 UKR_mio_trait_oplot_engine_desc:0 "Kharkiv diesel experience: more speed and reliability."
 UKR_mio_trait_reactive_armor:0 "Reactive Armour"
 UKR_mio_trait_reactive_armor_desc:0 "Armour and protection rise, but the tank costs more."
 UKR_mio_trait_light_chassis:0 "Morozov Light Chassis"
 UKR_mio_trait_light_chassis_desc:0 "Light tanks are faster and cheaper: the Kharkiv school builds lightened vehicles on a proven running gear."
 UKR_mio_trait_light_support_tank:0 "Light Infantry-Support Tank"
 UKR_mio_trait_light_support_tank_desc:0 "Light tank firepower and breakthrough rise, armour is weaker."
 UKR_mio_trait_trophy_fund:0 "Trophy Fund"
 UKR_mio_trait_trophy_fund_desc:0 "Captured vehicles quickly return to service and need few resources."
 UKR_mio_trait_field_repair:0 "Forward Repair"
 UKR_mio_trait_field_repair_desc:0 "Repair crews work close to the line, so production lines reach peak efficiency faster."
 UKR_mio_trait_wheeled_chassis:0 "Wheeled APCs"
 UKR_mio_trait_wheeled_chassis_desc:0 "Speed and fuel economy of light mechanized vehicles on poor roads."
 UKR_mio_trait_mine_resistant_hull:0 "Mine-Resistant Hull"
 UKR_mio_trait_mine_resistant_hull_desc:0 "Better crew protection for APCs and IFVs at a higher cost."
 UKR_mio_trait_garage_workshops:0 "Garage Workshops"
 UKR_mio_trait_garage_workshops_desc:0 "Production grows faster and costs less, but build quality suffers."
 UKR_mio_trait_volunteer_funding:0 "Volunteer Funding"
 UKR_mio_trait_volunteer_funding_desc:0 "Fundraising and donations speed up the organisation's income."
 UKR_mio_trait_neuro_guidance:0 "Neural Guidance"
 UKR_mio_trait_neuro_guidance_desc:0 "Drones find targets more precisely and break through defences faster."
 UKR_mio_trait_transport_school:0 "Transport Aviation School"
 UKR_mio_trait_transport_school_desc:0 "Longer range and lower cost of heavy aircraft."
 UKR_mio_trait_rough_field_landing:0 "Rough-Field Landing"
 UKR_mio_trait_rough_field_landing_desc:0 "Higher reliability and lower fuel consumption."
 UKR_mio_trait_ivchenko_engines:0 "Ivchenko Engines"
 UKR_mio_trait_ivchenko_engines_desc:0 "Engine thrust and reliability improve."
 UKR_mio_trait_fuel_economy:0 "Fuel Economy"
 UKR_mio_trait_fuel_economy_desc:0 "Longer range through careful fuel use."
 UKR_mio_trait_mig29_upgrade:0 "MiG-29 Upgrade"
 UKR_mio_trait_mig29_upgrade_desc:0 "New avionics improve agility and firepower, but raise the cost."
 UKR_mio_trait_su27_overhaul:0 "Su-27 Overhaul"
 UKR_mio_trait_su27_overhaul_desc:0 "Extended airframe life and better defence."
 UKR_mio_trait_gas_turbines:0 "Gas Turbines"
 UKR_mio_trait_gas_turbines_desc:0 "Ship speed and fuel economy."
 UKR_mio_trait_coastal_defense:0 "Coastal Defence"
 UKR_mio_trait_coastal_defense_desc:0 "Stronger air defence and cheaper ships, with shorter range."
 UKR_mio_malyshev_boost:0 "Tank Modernisation Programme"
 UKR_mio_malyshev_boost_desc:0 "Kharkiv shops work in boosted mode: medium and light tanks cost less."
 UKR_mio_trophy_boost:0 "Trophy Programme"
 UKR_mio_trophy_boost_desc:0 "Repair and refit of captured vehicles has been put on a production footing."
 UKR_mio_kraz_boost:0 "KrAZ Wheeled APC Programme"
 UKR_mio_kraz_boost_desc:0 "Kremenchuk assemblers received a state order: light mechanized vehicles and trucks cost less."
 UKR_mio_drone_boost:0 "UAV Workshops"
 UKR_mio_drone_boost_desc:0 "State orders and volunteers together: drones are cheaper and hit more accurately."
 UKR_mio_antonov_boost:0 "Transport Aviation Programme"
 UKR_mio_antonov_boost_desc:0 "Kyiv designers received an order: heavy and transport aircraft cost less."
 UKR_mio_motor_sich_boost:0 "Aero-Engine Programme"
 UKR_mio_motor_sich_boost_desc:0 "Zaporizhzhia engine makers work with the plants: light and medium aircraft cost less."
 UKR_mio_aircraft_boost:0 "Fighter Modernisation Programme"
 UKR_mio_aircraft_boost_desc:0 "Repair plants upgrade onboard systems: fighters are more reliable and agile."
 UKR_mio_yard_boost:0 "Mykolaiv Shipyards Programme"
 UKR_mio_yard_boost_desc:0 "The yards received an order for small ships: they cost less."
 UKR_mio_malyshev_overhaul:0 "Tank Modernisation in Kharkiv"
 UKR_mio_malyshev_overhaul_desc:0 "Give the Kharkiv plant a state order and staff: for half a year medium and light tanks get cheaper, and when the programme ends the organisation receives funding."
 UKR_mio_trophy_repair:0 "Trophy Programme"
 UKR_mio_trophy_repair_desc:0 "Put the repair and refit of captured and damaged vehicles on a production footing. For the duration, armour is more reliable and repairs go faster."
 UKR_mio_kraz_armored:0 "State Order for KrAZ APCs"
 UKR_mio_kraz_armored_desc:0 "Give Kremenchuk assemblers a state order for wheeled APCs and trucks: cheaper for the duration."
 UKR_mio_drone_workshops:0 "Support for UAV Workshops"
 UKR_mio_drone_workshops_desc:0 "Bring volunteers, startups and the state order together. Drones are cheaper and more accurate for the duration."
 UKR_mio_antonov:0 "Transport Aviation Programme"
 UKR_mio_antonov_desc:0 "Order heavy and transport aircraft from Antonov: cheaper for the duration."
 UKR_mio_motor_sich:0 "Aero-Engine Programme"
 UKR_mio_motor_sich_desc:0 "Link Zaporizhzhia engine makers with the aircraft plants: light and medium aircraft are cheaper for the duration."
 UKR_mio_aircraft_overhaul:0 "Fighter Modernisation"
 UKR_mio_aircraft_overhaul_desc:0 "Repair plants upgrade MiG-29s and Su-27s: fighters are more reliable and agile for the duration."
 UKR_mio_mykolaiv_yard:0 "Order for the Mykolaiv Yards"
 UKR_mio_mykolaiv_yard_desc:0 "Place an order for corvettes and small ships at the yards: cheaper for the duration."
 UKR_artillery_works_organization:0 "Artem, Luch and Pivdenne Design Bureaus"
 UKR_artillery_works_organization_desc:0 "The Artem plant in Kyiv, the Luch design bureau in Kyiv and the Pivdenne design bureau in Dnipro: from a howitzer on a wheeled chassis to the Neptune anti-ship cruise missile. In time private missile makers such as Fire Point with its Flamingo missile may join them."
 UKR_artillery_works_initial_trait:0 "Artillery School"
 UKR_artillery_works_initial_trait_desc:0 "Organisation speciality: Artem, Luch and Pivdenne Design Bureaus"
 UKR_radio_electronics_organization:0 "Radio-Electronics Enterprises"
 UKR_radio_electronics_organization_desc:0 "Kyiv and Kharkiv enterprises such as Kvant and Kvertus: radio sets, electronic warfare and optics. The customer is undemanding only on paper: communications must work in mud, under jamming, and the first time."
 UKR_radio_electronics_initial_trait:0 "Radio-Electronics School"
 UKR_radio_electronics_initial_trait_desc:0 "Organisation speciality: Radio-Electronics Enterprises"
 UKR_mio_trait_railway_workshops:0 "Railway Workshops"
 UKR_mio_trait_railway_workshops_desc:0 "Armoured trains and platforms are built from whatever is on the tracks: better armour and air defence at a lower cost."
 UKR_mio_trait_nato_calibre:0 "NATO Calibre Transition"
 UKR_mio_trait_nato_calibre_desc:0 "Shared ammunition with allies: weapon accuracy and reliability improve."
 UKR_mio_trait_modular_rifle:0 "Modular Rifle"
 UKR_mio_trait_modular_rifle_desc:0 "One platform for different tasks: defence and breakthrough rise, and so does the cost."
 UKR_mio_trait_self_propelled_guns:0 "Self-Propelled Howitzers"
 UKR_mio_trait_self_propelled_guns_desc:0 "A howitzer on a wheeled or tracked chassis fires and moves away: firepower and breakthrough improve."
 UKR_mio_trait_shoot_and_scoot:0 "Shoot and Scoot"
 UKR_mio_trait_shoot_and_scoot_desc:0 "Crews leave the position before the reply arrives: better survivability and reliability."
 UKR_mio_trait_coastal_missile:0 "Coastal Missile System"
 UKR_mio_trait_coastal_missile_desc:0 "Missiles against ships and coastal targets: a stronger blow against heavy targets, but costlier."
 UKR_mio_trait_missile_guidance:0 "Missile Guidance"
 UKR_mio_trait_missile_guidance_desc:0 "Inertial and satellite guidance: more accurate strikes and faster research."
 UKR_mio_trait_field_radios:0 "Secure Field Radios"
 UKR_mio_trait_field_radios_desc:0 "Encrypted radios for staffs and battalions: more reliable and cheaper."
 UKR_mio_trait_electronic_warfare:0 "Electronic Warfare"
 UKR_mio_trait_electronic_warfare_desc:0 "Jamming and signals-intelligence stations: infantry breakthrough and defence improve, research is faster."
 UKR_mio_trait_unmanned_boats:0 "Uncrewed Boats"
 UKR_mio_trait_unmanned_boats_desc:0 "Uncrewed strike boats: faster and cheaper, but less durable."
 UKR_mio_trait_sea_drone_swarm:0 "Sea Drone Swarm"
 UKR_mio_trait_sea_drone_swarm_desc:0 "Drone groups probe defences and detect targets: better detection and air defence, cheaper ships."
 UKR_mio_fort_boost:0 "Infantry Arms Programme"
 UKR_mio_fort_boost_desc:0 "Arms plants work in boosted mode: small arms are cheaper and more reliable."
 UKR_mio_artillery_boost:0 "Artillery Programme"
 UKR_mio_artillery_boost_desc:0 "Artillery works received a state order: guns cost less."
 UKR_mio_luch_boost:0 "Missile Programme"
 UKR_mio_luch_boost_desc:0 "The design bureaus received a missile order: cruise missiles and rocket systems cost less and fly farther."
 UKR_mio_radio_boost:0 "Communications and Electronics Programme"
 UKR_mio_radio_boost_desc:0 "Radio-electronics plants received an order: support equipment is cheaper and more reliable."
 UKR_mio_sea_drones_boost:0 "Sea Drone Programme"
 UKR_mio_sea_drones_boost_desc:0 "Workshops received an order for uncrewed boats: light ships cost less."
 UKR_mio_fort_arms:0 "Arming the Infantry"
 UKR_mio_fort_arms_desc:0 "Give the arms plants a state order and staff: for the duration small arms are cheaper and more reliable, and when it ends the organisation receives funding."
 UKR_mio_artillery_works:0 "Order for the Artillery Works"
 UKR_mio_artillery_works_desc:0 "Place an order for guns: cheaper for the duration."
 UKR_mio_luch_missiles:0 "Missile Programme"
 UKR_mio_luch_missiles_desc:0 "Fund the Luch and Yuzhnoye design bureaus: cruise missiles and rocket systems are cheaper for the duration."
 UKR_mio_radio_electronics:0 "Communications and Radio-Electronics"
 UKR_mio_radio_electronics_desc:0 "Order secure communications and electronic warfare equipment: cheaper and more reliable for the duration."
 UKR_mio_sea_drones:0 "Sea Drone Programme"
 UKR_mio_sea_drones_desc:0 "Support the uncrewed boat workshops: light ships are cheaper for the duration."
