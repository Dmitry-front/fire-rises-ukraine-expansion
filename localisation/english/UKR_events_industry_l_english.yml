l_english:
 ukraine_industry.1.t:0 "The First Batch from Kharkiv"
 ukraine_industry.1.d:0 "The Morozov Design Bureau and the Malyshev Plant in Kharkiv are the school that gave the world the T-64, the T-80 and the Oplot. In recent years they have lived on small batches: few orders, money that arrives late, and engineers who remember the Soviet workshops retiring one by one. The programme you paid for has finally delivered: the first refreshed batch, with the 6TD engine, reactive armour and new sights, stands in the factory yard.\n\nA general has come for the acceptance and the director meets him in a shop where a 1985 schedule still hangs on the wall. The army is ready to take every last vehicle. But the export contract that has dragged on for years (Thailand remembers the Oplot) also asks to be closed at last."
 ukraine_industry.1.a:0 "Everything goes to the army: exports can wait."
 ukraine_industry.1.b:0 "Close the export contract: the plant needs the money."
 ukraine_industry.2.t:0 "The Column at the Gates"
 ukraine_industry.2.d:0 "Behind the fences of the armoured repair plants in Lviv, Kyiv and Mykolaiv stand hundreds of stored vehicles: T-64s, T-72s, infantry fighting vehicles. Some are trophies left from the fighting of 2014-2015; they rusted in the open and sat in the ledgers as \"property awaiting assessment\". The programme has given the plant a line, and the director has laid two lists on the table.\n\nThe first holds vehicles that can be returned to service after a couple of months of work. The second holds those that are cheaper to hand to the steelmakers, who have long been calling about scrap. The same old T-72 can become a tank or three tonnes of good steel."
 ukraine_industry.2.a:0 "Return everything possible to service."
 ukraine_industry.2.b:0 "Sell part for scrap and invest in the line."
 ukraine_industry.3.t:0 "Wheels from Kremenchuk"
 ukraine_industry.3.d:0 "The Kremenchuk Automobile Plant is remembered for the dump trucks that hauled gravel across the whole Union. Now its shops stand civilian lorries side by side with wheeled armoured vehicles such as the Spartan and the Raptor: the same axles, the same welders, different armour. The army's order has put the line back to work, and for the first time in years the director is not counting the days to payday.\n\nThe shop floor does not stretch. The gates can release armoured carriers for the brigades, or lorries for export: KrAZ is known and bought in Africa and the Middle East, and hard currency is needed now as much as armour."
 ukraine_industry.3.a:0 "Armoured carriers for the brigades."
 ukraine_industry.3.b:0 "Export the lorries: currency matters more now."
 ukraine_industry.4.t:0 "The Garage Workshop"
 ukraine_industry.4.d:0 "The cluster grew not out of factories but out of volunteer workshops. In one garage near Kyiv reconnaissance drones are put together almost on a knee, in the next boards are soldered, in a third someone writes a program that tells a tank from a tractor and mostly does not confuse them. The vibration test stand was once a coffee machine, and nobody complains: it works.\n\nWhile you were paying for the programme, the General Staff prepared a forty-page document: certification, standards, acceptance reports. The craftsmen read it in silence. A state order would bring money and stability, but every paper would slow the cycle from idea to position. The question is what to risk: order or speed."
 ukraine_industry.4.a:0 "Certification and a state order: order matters."
 ukraine_industry.4.b:0 "Leave the garages alone: speed matters more."
 ukraine_industry.5.t:0 "The Second Mriya"
 ukraine_industry.5.d:0 "In an Antonov hangar near Kyiv an unfinished second An-225 Mriya fuselage has stood for decades: on paper it is about three-quarters complete. Every few years investors appear in the press with plans to finish it, and each time the matter ends with a handsome ceremony and an empty line in the budget.\n\nThe programme has given the plant resources, and the chief designer proposes the loudest option: finish the largest aircraft in the world and show that Ukraine can not only repair but build. The other path is more modest: a series of An-178 transports for the army and air transport command, which will not make the covers but will reach the units."
 ukraine_industry.5.a:0 "Finish the second Mriya: the country will show itself."
 ukraine_industry.5.b:0 "A series of An-178 for the army."
 ukraine_industry.6.t:0 "The Zaporizhzhia Engines"
 ukraine_industry.6.d:0 "Motor Sich makes engines that sit on helicopters and aircraft in dozens of countries and in recent years on Turkish drones as well. The plant has more than once found itself at the centre of a story: a Chinese investor (Skyrizon) bought part of the shares, the SBU opened cases, Washington voiced displeasure, and the engineers simply wanted the orders not to run out.\n\nThe programme has brought money, and now three different papers lie on your desk: an investor's offer to give the plant a new life for a stake, a draft decree on state control, and a memorandum on a joint venture with Turkish partners. Each path gives something and takes something from the country."
 ukraine_industry.6.a:0 "Sell a stake to the investor: the money matters, the risk is tolerable."
 ukraine_industry.6.b:0 "Take the plant under state control."
 ukraine_industry.6.c:0 "A joint venture with Turkey: engines for all."
 ukraine_industry.7.t:0 "A Second Service Life"
 ukraine_industry.7.d:0 "The aircraft repair plants in Lviv, Mykolaiv and Chuhuiv have for years kept Soviet MiG-29s and Su-27s in the air: they replace spars, rewrite documentation, and sometimes make a machine more reliable than a new one. The work is quiet and unnoticed, but it is what keeps the fleet from turning into an open-air museum.\n\nThe programme has brought the plants funds, and two scenarios are heard at the meeting. The first: a deep modernisation of the MiG-29 with modern avionics so that the old machines live another ten years. The second looks further: sooner or later Western fighters may appear in Ukrainian skies, and they will need a base, standards and specialists whom it is better to start training now."
 ukraine_industry.7.a:0 "A deep modernisation of the MiG-29 and Su-27."
 ukraine_industry.7.b:0 "A maintenance hub for future Western aircraft."
 ukraine_industry.8.t:0 "The Unfinished Corvette"
 ukraine_industry.8.d:0 "On the slipway of the Black Sea Shipyard in Mykolaiv stands the hull of a Project 58250 corvette, Volyn: laid down back in 2011, the money ran out before the steel. Next door Zorya-Mashproekt builds gas-turbine plants that navies in many countries buy, except its own. The ship has become a local landmark: workers joke that it is older than half their trainees.\n\nThe programme has returned money to the yards, and the question is now sharp. Finish the hull at home: slow, expensive, but the whole chain stays in the country. Or order the missing systems and hull blocks from partners, as is already done on neighbouring projects, and bring the ship to completion in Mykolaiv."
 ukraine_industry.8.a:0 "Finish at home: let the chain stay in the country."
 ukraine_industry.8.b:0 "Systems from partners, assembly in Mykolaiv."
 ukraine_industry.9.t:0 "Arms for Defence"
 ukraine_industry.9.d:0 "The Fort plant in Vinnytsia makes pistols and rifles carried by police officers and National Guardsmen, some under licence from Israeli designs. Territorial defence needs a lot of arms and at once: not parade weapons but simple, sturdy ones that yesterday's accountant can master after two weeks of training.\n\nThe programme has brought the plant an order, but an old dilemma lies in the corner of the warehouse. The army is gradually moving to the 5.56 NATO cartridge, which simplifies supply from partners. But the warehouses are full of 5.45, and reservists and volunteers need something right now."
 ukraine_industry.9.a:0 "Move to the NATO calibre."
 ukraine_industry.9.b:0 "Keep 5.45 for reservists and territorial defence for now."
 ukraine_industry.10.t:0 "The Gun the Front Is Waiting For"
 ukraine_industry.10.d:0 "In military textbooks the word \"artillery\" has not yet gone out of fashion, and the designers know it. A new wheeled 155 mm gun stands on the testing ground (Bohdana on paper, various things in the designers' conversations): mobile, with ready automation, on a domestic chassis. A few unpleasant test cycles remain before series production.\n\nThe generals are in a hurry. Every month without new guns is a month when brigade supply rests on old stock. But a series that is too fast means small breakdowns at the worst moment, and then trust in domestic artillery will have to be earned again."
 ukraine_industry.10.a:0 "Speed up the series: the front needs guns."
 ukraine_industry.10.b:0 "See the tests through."
 ukraine_industry.11.t:0 "Neptune"
 ukraine_industry.11.d:0 "The Kyiv design bureau Luch and Dnipro's Pivdenne made missiles quietly and without shop windows for many years. Now their joint work, the Neptune anti-ship cruise missile, is passing trials and entering coastal defence. Range, a low signature and domestic engines make it a serious argument in any talk about Black Sea security.\n\nThe question arises of what to do with the fame. An exhibition in Europe would attract buyers and friends, but Moscow will read it as a challenge. The closed path gives the army time and surprise but leaves the plants a modest budget. The designers, as usual, hope the decision will be made before the end of the quarter."
 ukraine_industry.11.a:0 "Show it at an exhibition and open export talks."
 ukraine_industry.11.b:0 "Keep it secret: the army needs surprise."
 ukraine_industry.12.t:0 "Our Own Airwaves"
 ukraine_industry.12.d:0 "Radio-electronics is the field where Ukraine's army has to learn faster than anyone. Plants near Kyiv and Kharkiv make radio sets, electronic warfare equipment and optics, and programmers at the workshops write firmware at night because by day hardware and money are needed. Obsolete Soviet-style radios are being replaced with whatever can be found.\n\nThe programme has given the plants resources and raised the question of standards. Build our own communications and EW system: fast, tailored to our needs, with a risk of incompatibility. Or adopt NATO standards and adjust the plants to them: slower, costlier, but the sets will talk to allies."
 ukraine_industry.12.a:0 "Our own communications and EW system."
 ukraine_industry.12.b:0 "Compatibility with NATO standards."
 ukraine_industry.13.t:0 "A Boat Without a Crew"
 ukraine_industry.13.d:0 "The idea is simple and a little mad: a fast boat, no crew, satellite link, a camera and a charge. A naval power with a big fleet would laugh at such an idea, while a country with almost no fleet finds it interesting. Designers in Mykolaiv and Odesa call the project by three different names so that nobody understands what it is about.\n\nThe programme has brought money, and now the question of secrecy is decided. A closed HUR project gives the element of surprise and protects it from prying eyes, but remains a purely internal matter. Demonstration trials for partners will attract allies and money, but from that day the project stops being a secret."
 ukraine_industry.13.a:0 "A closed HUR project."
 ukraine_industry.13.b:0 "Demonstration trials for partners."
