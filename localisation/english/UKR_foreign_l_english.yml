l_english:
 UKR_req_opt_full:0 "Agree in full."
 UKR_req_opt_part:0 "Agree in part."
 UKR_req_opt_no:0 "Refuse."
 UKR_req_res_full:0 "We thank you. The aid will be used with full accounting."
 UKR_req_res_part:0 "It is better than nothing. We thank you."
 UKR_req_res_no:0 "We understand. We will return to the question later."
 UKR_req_wait_tt:0 "The answer will come in about §Y[?UKR_req_delay|0]§! days; price and delay depend on trust (now §Y[?UKR_req_pct|0]%§! of the base price)."
 UKR_req_wait_b_tt:0 "The answer will come in about §Y[?UKR_req_delay_b|0]§! days (the Baltic states answer quickly); the price depends on trust (now §Y[?UKR_req_pct|0]%§! of the base price)."
 ukr_allies_request_met:0 "Ukraine's request met"
 ukr_allies_request_partial:0 "Ukraine's request partly met"
 ukr_allies_grain_dispute:0 "The grain dispute: complaints and pressure"
 ukr_allies_grain_solidarity:0 "Agreement to the grain restrictions"
 ukr_allies_exhumations:0 "Exhumations in Volhynia allowed"

 UKR_req_pl_hub:0 "Ask Warsaw: a transit hub"
 UKR_req_pl_hub_desc:0 "We ask Poland to receive allied cargo in the south-east of the country and to transship it for Ukraine.\n\n§YWhat it is.§! The junction airfields and railway stations of the Subcarpathian region. The track gauge changes at the border (1435 mm in Europe, 1520 mm in Ukraine), so wagons are transshipped or have their bogies swapped.\n§YIn reality.§! From February 2022 a large share of Western military aid went through south-eastern Poland, above all through Rzeszow-Jasionka airport; allied forces covered the hub.\n§YWhat it gives.§! Losses and stockpiles are replenished faster, and rear-area equipment arrives."
 ukraine_foreign.300.t:0 "Kyiv's request: a transit corridor"
 ukraine_foreign.300.d:0 "Ukraine asks us to open the south-eastern airfields and stations to allied cargo and to take on the transshipment. The decision will have to be defended before voters: the hub can become a target."
 ukraine_foreign.310.t:0 "Warsaw's answer: the transit hub"
 ukraine_foreign.310.d_full:0 "Warsaw has agreed: the airport and the stations of the Subcarpathian region handle allied cargo around the clock. Trains cross into Ukraine without long stops."
 ukraine_foreign.310.d_part:0 "Poland opened the corridor only in part: some flights and trains are accepted, the rest by special permission. It is better than nothing."
 ukraine_foreign.310.d_no:0 "Warsaw refused. The chancellery fears that the hub would become a target and asks us to return to the question later."

 UKR_req_pl_arms:0 "Ask Warsaw: arms from Polish arsenals"
 UKR_req_pl_arms_desc:0 "We ask Poland to hand over part of its equipment and ammunition from its own stores while allied industry gets up to speed.\n\n§YWhat it is.§! T-72 tanks and Polish PT-91 Twardy tanks (in the Polish army since the 1990s), 155 mm Krab self-propelled howitzers (since the mid-2010s) and Piorun man-portable air defence systems (since 2010).\n§YIn reality.§! In 2022 Poland was the first NATO member to hand over more than two hundred T-72 tanks, then Krab howitzers and thousands of Grom and Piorun launchers.\n§YWhat it gives.§! Artillery, air defence crews and armour that can be sent into battle within weeks."
 ukraine_foreign.301.t:0 "Kyiv's request: arms from Polish stores"
 ukraine_foreign.301.d:0 "Ukraine asks us to hand over part of the tanks, howitzers and air defence systems from the arsenals of the Polish Army. The military warns that our own stores will run empty."
 ukraine_foreign.311.t:0 "Warsaw's answer: arms from the arsenals"
 ukraine_foreign.311.d_full:0 "Warsaw has handed over tanks, howitzers and air defence systems from the arsenals of the Polish Army. The columns are already moving to the border."
 ukraine_foreign.311.d_part:0 "Poland handed over only part of what was asked: the rest is needed by its own army. But tanks and howitzers are already moving to the border."
 ukraine_foreign.311.d_no:0 "Warsaw refused: the defence ministry considers its stocks to be at the minimum acceptable level. The request can be repeated later."

 UKR_req_pl_medevac:0 "Ask Warsaw: hospitals and casualty evacuation"
 UKR_req_pl_medevac_desc:0 "We ask Poland to admit our wounded to its hospitals and to organise medical evacuation across the border.\n\n§YWhat it is.§! Evacuation trains and aircraft, hospital beds in the Subcarpathian and other voivodeships, rehabilitation. The sooner a wounded soldier reaches a hospital, the better the chance of returning him to the ranks.\n§YIn reality.§! Poland took in more than a million refugees from Ukraine, and Polish hospitals also treated wounded servicemen; evacuation was coordinated with the EU and NATO.\n§YWhat it gives.§! For a time, part of the casualties return to the ranks."
 ukraine_foreign.302.t:0 "Kyiv's request: hospitals and evacuation"
 ukraine_foreign.302.d:0 "Ukraine asks us to admit wounded servicemen and to organise evacuation across the border. The request falls on hospitals that are already overloaded."
 ukraine_foreign.312.t:0 "Warsaw's answer: hospitals and evacuation"
 ukraine_foreign.312.d_full:0 "Warsaw has agreed: evacuation trains and aircraft head to Poland, and hospitals have set aside hundreds of beds. Many of the wounded will return to the ranks."
 ukraine_foreign.312.d_part:0 "Poland has set aside hospital places, but evacuation will have to be carried out by our own means: there is not enough transport."
 ukraine_foreign.312.d_no:0 "Warsaw refused: the hospitals are overloaded with refugees. We ask to return to the question later."

 UKR_req_ger_air:0 "Ask Berlin: a shield for the sky"
 UKR_req_ger_air_desc:0 "We ask Germany to hand over air defence systems and self-propelled guns to protect our cities and the power grid.\n\n§YWhat it is.§! IRIS-T SLM medium-range air defence systems, Gepard self-propelled anti-aircraft guns (in Bundeswehr service from 1976 until 2010) and Patriot missile systems.\n§YIn reality.§! From autumn 2022 Germany supplied IRIS-T SLM and about fifty Gepards, and later, together with partners, Patriot batteries.\n§YWhat it gives.§! Air defence equipment for the stockpile and a step towards protecting infrastructure from air strikes."
 ukraine_foreign.400.t:0 "Kyiv's request: an air defence shield"
 ukraine_foreign.400.d:0 "Ukraine asks for air defence systems to protect its cities and the power grid. The answer will decide how many missiles and systems Germany can release without baring its own air defence."
 ukraine_foreign.410.t:0 "Berlin's answer: a shield for the sky"
 ukraine_foreign.410.d_full:0 "Berlin has agreed: medium-range air defence systems and self-propelled guns are arriving at our depots. The cities have a better chance of surviving the strikes."
 ukraine_foreign.410.d_part:0 "Germany released part of the systems requested: the rest, the chancellery says, is needed by its own army and awaits industrial orders."
 ukraine_foreign.410.d_no:0 "Berlin refused: the chancellery cites emptying depots and awaits a new order for industry. The request can be repeated later."

 UKR_req_ger_credit:0 "Ask Berlin: a credit line"
 UKR_req_ger_credit_desc:0 "We ask Germany to lead financial support: concessional loans, guarantees and direct grants for the budget and procurement.\n\n§YWhat it is.§! Part of the aid comes as a grant, part as a concessional loan tied to reforms and reporting. A loan increases debt, a grant does not.\n§YIn reality.§! From 2022 Germany provided grants and guarantees and took part in EU macro-financial assistance and the common G7 programme; payments were tied to reforms and reports.\n§YWhat it gives.§! Money for the budget and some debt. The less corruption there is, the more readily it is given."
 ukraine_foreign.401.t:0 "Kyiv's request: financial support"
 ukraine_foreign.401.d:0 "Ukraine asks for a credit line and budget grants. The finance ministry reminds us that the money will have to be accounted for before the Bundestag."
 ukraine_foreign.411.t:0 "Berlin's answer: the credit line"
 ukraine_foreign.411.d_full:0 "Berlin has agreed: part of the funds will come as a grant, part as a concessional loan tied to reforms. The budget for the coming months is covered."
 ukraine_foreign.411.d_part:0 "Germany gave less than requested: guarantees for part of the loan and a modest grant. The rest only after a report on reforms."
 ukraine_foreign.411.d_no:0 "Berlin refused: the chancellery demands that we first account for past tranches and reforms. The request can be repeated later."

 UKR_req_ger_armor:0 "Ask Berlin: heavy equipment"
 UKR_req_ger_armor_desc:0 "We ask Germany to hand over tanks, infantry fighting vehicles and self-propelled howitzers from Bundeswehr stocks and from industry.\n\n§YWhat it is.§! Leopard 2 tanks (in Germany since 1979, the 2A6 version since 2001), Marder infantry fighting vehicles (since 1971) and PzH 2000 self-propelled howitzers (since 1998).\n§YIn reality.§! In 2022 Germany handed over the first PzH 2000, and in January 2023, after months of dispute, agreed to Leopard 2 and Marder when the United States and other allies decided to join.\n§YWhat it gives.§! Armour and artillery for offensive operations; but without trust it is hard to extract such a decision from Berlin."
 ukraine_foreign.402.t:0 "Kyiv's request: heavy equipment"
 ukraine_foreign.402.d:0 "Ukraine asks for tanks, infantry fighting vehicles and self-propelled howitzers. The chancellor hesitates: he does not want escalation and waits to see what the allies decide."
 ukraine_foreign.412.t:0 "Berlin's answer: heavy equipment"
 ukraine_foreign.412.d_full:0 "Berlin has agreed: Leopards, Marders and self-propelled howitzers are heading for our depots. The decision came with difficulty, but the road is open."
 ukraine_foreign.412.d_part:0 "Germany handed over part of the equipment: the rest, the chancellery says, will follow once the allies join the decision."
 ukraine_foreign.412.d_no:0 "Berlin refused: the chancellery does not want to «walk ahead of the allies». The request can be repeated later."

 UKR_req_fra_caesar:0 "Ask Paris: an artillery contract"
 UKR_req_fra_caesar_desc:0 "We ask France to supply wheeled self-propelled howitzers and shells and to sign a long-term contract with industry.\n\n§YWhat it is.§! CAESAR: a 155 mm howitzer on a 6x6 truck chassis; in the French army since 2008, it changes position quickly after firing and is therefore harder to hit with counter-battery fire.\n§YIn reality.§! Since 2022 France has handed Ukraine dozens of CAESARs (some paid for by other countries, Denmark among them) and ordered new batches from industry.\n§YWhat it gives.§! Mobile artillery and shells for it; the answer depends on how much France can release without baring its own army."
 ukraine_foreign.420.t:0 "Kyiv's request: an artillery contract"
 ukraine_foreign.420.d:0 "Ukraine asks for CAESAR self-propelled howitzers and shells. The general staff warns that the stock of shells for our own army is limited."
 ukraine_foreign.430.t:0 "Paris's answer: the artillery contract"
 ukraine_foreign.430.d_full:0 "Paris has agreed: CAESAR howitzers and shells for them are heading to Ukraine. Industry has received the order."
 ukraine_foreign.430.d_part:0 "France gave part of what was asked: fewer howitzers, and shells only according to the production schedule."
 ukraine_foreign.430.d_no:0 "Paris refused: its own forces are short of shells. The request can be repeated later."

 UKR_req_fra_air:0 "Ask Paris: aircraft and air defence missiles"
 UKR_req_fra_air_desc:0 "We ask France to hand over surface-to-air missile systems, cruise missiles and combat aircraft.\n\n§YWhat it is.§! SAMP/T (Franco-Italian, Aster 30 missiles), SCALP-EG cruise missiles (twin of the British Storm Shadow, range over 250 km) and Mirage 2000 fighters (in French service since the 1980s).\n§YIn reality.§! France delivered SCALP in 2023 and SAMP/T in 2023-2024, and then prepared the transfer of Mirage 2000-5 aircraft.\n§YWhat it gives.§! Air defence cover, long-range strikes on the rear and combat aircraft; but Paris gives up such systems cautiously."
 ukraine_foreign.421.t:0 "Kyiv's request: aircraft and air defence missiles"
 ukraine_foreign.421.d:0 "Ukraine asks for surface-to-air missile systems, cruise missiles and fighters. Each of these systems is taken from France's own inventory."
 ukraine_foreign.431.t:0 "Paris's answer: aircraft and missiles"
 ukraine_foreign.431.d_full:0 "Paris has agreed: air defence systems, cruise missiles and fighters are arriving at our depots. The decision was taken at presidential level."
 ukraine_foreign.431.d_part:0 "France released part: air defence systems and missiles, but the aircraft will have to wait."
 ukraine_foreign.431.d_no:0 "Paris refused: the Elysee considers such systems too sensitive. The request can be repeated later."

 UKR_req_fra_volunteers:0 "Ask Paris: a register of foreign volunteers"
 UKR_req_fra_volunteers_desc:0 "We ask France to help with the registration and vetting of foreign volunteers: to accept applications at consulates, to agree lists and to lift legal risks from those who return.\n\n§YWhat it is.§! A single register: who has come, where he serves, who vouches for him. Vetting removes the allies' question of whether radicals and mercenaries are slipping into Ukraine.\n§YIn reality.§! Since 2022 thousands of foreigners, French citizens among them, have joined the International Legion for the Defence of Ukraine; European states took this differently, from silent tolerance to warnings.\n§YWhat it gives.§! An inflow of people and experience, a formal status for volunteers and fewer suspicions; but if radicals are strong with us, Paris will refuse."
 ukraine_foreign.422.t:0 "Kyiv's request: a register of volunteers"
 ukraine_foreign.422.d:0 "Ukraine asks us to help with the registration of foreign volunteers and to allow applications at consulates. A parliamentary commission asks who exactly will go and under whose command."
 ukraine_foreign.432.t:0 "Paris's answer: the register of volunteers"
 ukraine_foreign.432.d_full:0 "Paris has agreed: consulates accept applications and the lists are checked jointly. There are fewer questions about the volunteers."
 ukraine_foreign.432.d_part:0 "France allowed registration but did not permit applications at consulates: volunteers will go at their own risk."
 ukraine_foreign.432.d_no:0 "Paris refused: the Elysee does not want to answer for citizens fighting abroad. The request can be repeated later."

 UKR_req_eng_intel:0 "Ask London: an intelligence partnership"
 UKR_req_eng_intel_desc:0 "We ask Britain to share intelligence and to help protect our communication channels.\n\n§YWhat it is.§! Signals and electronic intelligence, satellite imagery, joint threat assessment and cipher protection.\n§YIn reality.§! Before the 2022 invasion Britain and the United States declassified part of the data on Russia's plans, and since February 2022 the British Ministry of Defence has published regular reviews of the course of the war.\n§YWhat it gives.§! For a time, interception and data gathering improve; but London shares only with those who can keep secrets."
 ukraine_foreign.440.t:0 "Kyiv's request: intelligence sharing"
 ukraine_foreign.440.d:0 "Ukraine asks for permanent data sharing and help in protecting its communications. The intelligence services remind us: sources are vulnerable and leaks are expensive."
 ukraine_foreign.450.t:0 "London's answer: the intelligence partnership"
 ukraine_foreign.450.d_full:0 "London has agreed: a permanent channel of exchange is open and data arrives daily. Counter-intelligence is checking our communication channels."
 ukraine_foreign.450.d_part:0 "Britain agreed to a limited exchange: part of the data we will receive only as assessments, without the original sources."
 ukraine_foreign.450.d_no:0 "London refused: the services are not sure our channels are secure. The request can be repeated later."

 UKR_req_eng_training:0 "Ask London: a training mission"
 UKR_req_eng_training_desc:0 "We ask Britain to organise the training of our recruits and officers on its territory.\n\n§YWhat it is.§! Courses at British training areas: combined-arms training, small-unit tactics, medicine, combat engineering, commander training.\n§YIn reality.§! From June 2022 Britain led Operation Interflex: instructors from several countries trained recruits in a few weeks, and over the years of the operation tens of thousands of people were trained.\n§YWhat it gives.§! Army experience and faster training of divisions for the duration of the mission."
 ukraine_foreign.441.t:0 "Kyiv's request: a training mission"
 ukraine_foreign.441.d:0 "Ukraine asks us to take recruits and officers for training at British training areas. The army is assessing how many instructors can be pulled from its own units."
 ukraine_foreign.451.t:0 "London's answer: the training mission"
 ukraine_foreign.451.d_full:0 "London has agreed: our recruits and officers are going to British training areas and instructors begin recruitment. Training will take weeks, not months."
 ukraine_foreign.451.d_part:0 "Britain accepted fewer trainees: officers wait for the next intake, recruits will go through shortened training."
 ukraine_foreign.451.d_no:0 "London refused: there are not enough instructors for its own units. The request can be repeated later."

 UKR_req_eng_missiles:0 "Ask London: anti-tank and long-range missiles"
 UKR_req_eng_missiles_desc:0 "We ask Britain to hand over anti-tank systems and long-range missiles.\n\n§YWhat it is.§! NLAW (a Swedish-British disposable anti-tank weapon, in the British army since 2009), Starstreak (a laser-guided air defence system, since 1997) and Storm Shadow (a cruise missile with a range of over 250 km, with the RAF since the early 2000s).\n§YIn reality.§! In 2022 Britain handed over thousands of NLAWs, then Starstreak, and in May 2023 became the first Western country to supply Storm Shadow, restricting how it could be used.\n§YWhat it gives.§! Anti-tank and air defence equipment and a long-range strike on the rear; London asks for guarantees that the missiles will not be misused."
 ukraine_foreign.442.t:0 "Kyiv's request: missiles"
 ukraine_foreign.442.d:0 "Ukraine asks for anti-tank and air defence systems and long-range missiles. The Ministry of Defence is discussing the conditions of use."
 ukraine_foreign.452.t:0 "London's answer: missiles"
 ukraine_foreign.452.d_full:0 "London has agreed: anti-tank and air defence systems and long-range missiles are supplied to Ukraine. The conditions of use are set out."
 ukraine_foreign.452.d_part:0 "Britain handed over part of what was asked: anti-tank and air defence systems, while there is no decision on the long-range missiles yet."
 ukraine_foreign.452.d_no:0 "London refused: the conditions of use have not been agreed. The request can be repeated later."

 UKR_req_eng_naval:0 "Ask London: a maritime coalition and drones"
 UKR_req_eng_naval_desc:0 "We ask Britain to lead a maritime coalition and to help Ukraine with a fleet without a fleet: uncrewed boats, minehunters, training of sailors.\n\n§YWhat it is.§! Uncrewed surface and underwater drones, minehunters and coastal defence while the large ships are locked behind the straits.\n§YIn reality.§! In 2022 Ukraine was the first to use uncrewed boats in combat; in 2023 Britain and Norway created the Maritime Capability Coalition, and London handed Ukraine Sandown-class minehunters.\n§YWhat it gives.§! Funds and technology for the drone and naval drone cluster, experience for the sailors and a step towards the security of the Black Sea."
 ukraine_foreign.443.t:0 "Kyiv's request: a maritime coalition"
 ukraine_foreign.443.d:0 "Ukraine asks us to lead a maritime coalition and to help with uncrewed boats, minehunters and training. The Admiralty reminds us that ships cannot enter the Black Sea because of the strait regime."
 ukraine_foreign.453.t:0 "London's answer: the maritime coalition"
 ukraine_foreign.453.d_full:0 "London has agreed: a maritime coalition is being formed, defence organisations receive funding and sailors get places in British schools."
 ukraine_foreign.453.d_part:0 "Britain agreed to part: help with training and modest funding, but the coalition is postponed."
 ukraine_foreign.453.d_no:0 "London refused: the Admiralty is not ready to take on commitments in the Black Sea. The request can be repeated later."

 UKR_req_est_package:0 "Ask Tallinn: a quick package"
 UKR_req_est_package_desc:0 "We ask Estonia to hand over at once from its own stocks whatever can be shipped within days.\n\n§YWhat it is.§! A small but quick package: 155 mm FH-70 howitzers (in European armies since the 1970s), Javelin portable anti-tank systems (since 1996) and ammunition.\n§YIn reality.§! Estonia handed Ukraine FH-70 howitzers and Javelins and is among the countries giving the most aid as a share of GDP; deliveries began even before February 2022.\n§YWhat it gives.§! Small but urgent help; Tallinn answers faster than the others."
 ukraine_foreign.460.t:0 "Kyiv's request: an urgent package"
 ukraine_foreign.460.d:0 "Ukraine asks us to hand over from our stocks whatever can be shipped within days. Estonia has little, but the decision is taken without long arguments."
 ukraine_foreign.470.t:0 "Tallinn's answer: the quick package"
 ukraine_foreign.470.d_full:0 "Tallinn has agreed: howitzers, anti-tank systems and ammunition are already on their way. The package is small, but it arrived in time."
 ukraine_foreign.470.d_part:0 "Estonia handed over what it can: part of the howitzers and ammunition. It simply has nothing more."
 ukraine_foreign.470.d_no:0 "Tallinn refused: stocks after earlier transfers are at a minimum. The request can be repeated later."

 UKR_req_lat_drones:0 "Ask Riga: a drone coalition"
 UKR_req_lat_drones_desc:0 "We ask Latvia, together with Britain, to lead a coalition on drones: joint purchases, funding of workshops and deliveries.\n\n§YWhat it is.§! Joint purchases and production funding: reconnaissance drones, strike FPVs, ground robots. Latvia takes on the coordination.\n§YIn reality.§! In February 2024 Latvia and Britain led the «Drone Coalition» in the Ramstein format; Latvia also handed Ukraine Stinger air defence systems.\n§YWhat it gives.§! Funds for the drone cluster and air defence missiles."
 ukraine_foreign.461.t:0 "Kyiv's request: a drone coalition"
 ukraine_foreign.461.d:0 "Ukraine asks us to lead a coalition on drones: joint purchases and funding of workshops. The army is ready to coordinate if partners confirm their contributions."
 ukraine_foreign.471.t:0 "Riga's answer: the drone coalition"
 ukraine_foreign.471.d_full:0 "Riga has agreed: the coalition is formed, the first money goes to the workshops and air defence missiles are already on their way."
 ukraine_foreign.471.d_part:0 "Latvia agreed to part: modest contributions and air defence missiles, but the common coalition is for now without partners."
 ukraine_foreign.471.d_no:0 "Riga refused: without the consent of partners Latvia is not ready to take on the coordination. The request can be repeated later."

 UKR_req_lit_support:0 "Ask Vilnius: air defence missiles and instructors"
 UKR_req_lit_support_desc:0 "We ask Lithuania to hand over portable air defence systems and to send instructors.\n\n§YWhat it is.§! Stinger man-portable air defence systems (in NATO armies since 1981) and instructors to train crews and sappers.\n§YIn reality.§! Lithuania handed Ukraine Stingers, and society raised money for aid: in 2022 a popular fundraiser for a Bayraktar drone was so quick that the manufacturer decided to donate the machine.\n§YWhat it gives.§! Air defence missiles, experience and a step towards protecting the sky."
 ukraine_foreign.462.t:0 "Kyiv's request: air defence and instructors"
 ukraine_foreign.462.d:0 "Ukraine asks for portable air defence systems and instructors. Lithuania answers carefully: its own stocks are small, but society demands help."
 ukraine_foreign.472.t:0 "Vilnius's answer: air defence and instructors"
 ukraine_foreign.472.d_full:0 "Vilnius has agreed: air defence missiles are heading to Ukraine and instructors are training crews. Lithuanians raised money even before the government decided."
 ukraine_foreign.472.d_part:0 "Lithuania handed over part of the missiles and promised instructors later."
 ukraine_foreign.472.d_no:0 "Vilnius refused: the government awaits the answer of its Baltic partners. The request can be repeated later."

 ukraine_foreign.320.t:0 "Grain on the Polish border"
 ukraine_foreign.320.d:0 "Ukrainian grain moving in transit through Poland settles on the local market and collapses prices for Polish farmers. Warsaw threatens an import ban, and farmers and hauliers block the crossings. In our reality this happened in the spring of 2023: Poland, Hungary and Slovakia closed their markets to Ukrainian grain, the EU introduced temporary restrictions, and Kyiv complained to the WTO.\n\nWe must now decide how to respond."
 ukraine_foreign.320.a:0 "Accept the ban and send the grain through the «solidarity lanes»."
 ukraine_foreign.320.b:0 "Complain to the WTO and press through Brussels."
 ukraine_foreign.320.c:0 "Quiet talks: export licences and quotas."
 UKR_pl_exhumations:0 "Allow exhumations in Volhynia"
 UKR_pl_exhumations_desc:0 "We give Warsaw permission to search for and exhume the remains of Polish victims of the Volhynia tragedy of 1943-1944 and to tend the burial sites. In return we ask for the same treatment of Ukrainian graves in Poland.\n\n§YWhat it is.§! Commissions of historians and forensic experts, work in the villages of Volhynia and Galicia, coordination with local authorities. The subject is painful: it is a matter of memory for both Poles and Ukrainians.\n§YIn reality.§! In 2025, for the first time in many years, exhumations began in the village of Puzhnyky (Ternopil Oblast), agreed between Kyiv and Warsaw.\n§YWhat it gives.§! Poland's attitude warms noticeably and trust grows; part of the nationalists are displeased."
 ukraine_foreign.321.t:0 "The exhumations have begun"
 ukraine_foreign.321.d:0 "Polish and Ukrainian experts have begun their work in the field. The first remains have been found and received with respect. The question remains difficult, but the conversation has begun, and Warsaw has noticed."
 ukraine_foreign.321.a:0 "We continue the work."

 UKR_pl_hub_idea:0 "Polish transit hub"
 UKR_pl_hub_idea_desc:0 "Allied cargo flows through south-eastern Poland: losses and stockpiles are replenished faster."
 UKR_pl_hub_idea_lim:0 "Limited Polish hub"
 UKR_pl_hub_idea_lim_desc:0 "Poland lets part of the allied cargo through: reinforcement is slightly faster."
 UKR_pl_medevac_idea:0 "Polish medical evacuation"
 UKR_pl_medevac_idea_desc:0 "The wounded are treated in Polish hospitals: part of them return to the ranks."
 UKR_pl_medevac_idea_lim:0 "Limited evacuation to Poland"
 UKR_pl_medevac_idea_lim_desc:0 "Poland takes part of the wounded: fewer return to the ranks."
 UKR_vol_vetted_idea:0 "Vetted volunteers"
 UKR_vol_vetted_idea_desc:0 "Foreign volunteers are registered and vetted: the army gains experience faster."
 UKR_vol_vetted_idea_lim:0 "Registered volunteers"
 UKR_vol_vetted_idea_lim_desc:0 "Volunteers are registered only in part: the effect is more modest."
 UKR_uk_intel_idea:0 "British intelligence partnership"
 UKR_uk_intel_idea_desc:0 "London shares intelligence and helps protect our communication channels."
 UKR_uk_intel_idea_lim:0 "Limited exchange with Britain"
 UKR_uk_intel_idea_lim_desc:0 "London shares only assessments, without the original sources."
 UKR_uk_training_idea:0 "British training mission"
 UKR_uk_training_idea_desc:0 "Recruits and officers train at British training areas: divisions train faster."
 UKR_uk_training_idea_lim:0 "Shortened British mission"
 UKR_uk_training_idea_lim_desc:0 "Britain accepts fewer trainees: the effect is more modest."
