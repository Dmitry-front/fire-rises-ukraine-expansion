l_english:
 UKR_golden_age:0 "Ukraine's Golden Age"
 UKR_golden_age_desc:0 "The elections are behind us, the alliance of Servant of the People and For the Future holds the Rada, and the course begun in 2020 has paid off: reconciliation with the regions is written into law, the army serves under new regulations, roads and bridges are being built, and school curricula have been rewritten. The Bankova is drafting a ten-year development plan and assures everyone that the hardest part is behind us. Pollsters are happy, the telethon is cheerful, and for the first time in years the Rada votes without brawls in the corridors.\n\nA government that succeeds at everything tends to relax. The alliance in the Rada rests on calculation, not friendship, the corridors increasingly ask who signed what behind closed doors, and the journalists' questions are still polite. Golden ages in history have rarely ended as planned."
 UKR_golden_age_available_tt:0 "The parliamentary elections are over and the Rada alliance is formed"
