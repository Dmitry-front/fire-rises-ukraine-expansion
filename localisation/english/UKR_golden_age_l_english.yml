 UKR_golden_age:0 "Ukraine's Golden Age"
 UKR_golden_age_desc:0 "Parliament is elected, the Rada alliance is in place, and the reforms are done: the army runs on new regulations, roads are being built, school curricula have been rewritten, and Kyiv is busy with work rather than feuds. The Presidential Office is drafting a ten-year programme and promises the hardest part is behind us. Pollsters are pleased, the press is cautious for now, and the opposition is quiet for now.\n\nThese are usually the very moments when it pays to check more often who is doing what behind closed doors."
 UKR_golden_age_available_tt:0 "The parliamentary elections are over and the Rada alliance is formed"
