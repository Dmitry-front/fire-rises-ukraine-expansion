l_english:
 UKR_golden_age:0 "Ukraine's Golden Age"
 UKR_golden_age_desc:0 "The elections are behind us, the alliance of Servant of the People and For the Future holds the Rada, and the course begun in 2020 has paid off: reconciliation with the regions is written into law, the army serves under new regulations, roads and bridges are being built, and school curricula have been rewritten. The Bankova is drafting a ten-year development plan and assures everyone that the hardest part is behind us. Pollsters are happy, the telethon is cheerful, and for the first time in years the Rada is not staging boxing matches on live television.\n\nThe sun rises over the golden fields of Ukraine, and it seems that the future is finally arriving: the wheat bends in the wind as in the old poems, and morning smoke rises over the new neighbourhoods and the old village houses. How badly we want to believe that from here on things can only get better. But this story, like any true Ukrainian story, has a second page, and it is not so simple."
 UKR_golden_age_available_tt:0 "The parliamentary elections are over and the Rada alliance is formed"
