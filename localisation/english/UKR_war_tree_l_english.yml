 UKR_w_tt_election_ban:0 "No elections are held while the war lasts"
 UKR_w_tt_tree_intro:0 "The war tree is open: five directions and the focuses of your pillar"
 UKR_w_tt_tier2:0 "Second-tier focuses are open"
