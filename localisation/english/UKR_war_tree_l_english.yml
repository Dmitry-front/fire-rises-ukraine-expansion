l_english:
 UKR_w_war_comes_home:0 "War Comes to Every Home"
 UKR_w_war_comes_home_desc:0 "Sirens, shelters, columns on the roads. What was discussed for years has become daily life: the country wakes up in a different war.\n\nThis focus completes on its own and marks the line: from this day, politics, the economy and everyday life answer to a single question."
 UKR_w_martial_law:0 "Martial Law and a Unified Headquarters"
 UKR_w_martial_law_desc:0 "Martial law is a special legal regime: limits on travel and assembly, the right of the state to requisition resources for defence, and a ban on elections. A week goes to decrees, a parliamentary vote and the creation of a unified headquarters where the army, the government and communications meet.\n\nWhile the war lasts, no elections are held. From here the tree branches: every choice opens new decisions and temporary national spirits, but closes other paths."
 UKR_w_supreme_command:0 "Supreme Commander's Headquarters"
 UKR_w_supreme_command_desc:0 "The Headquarters is the body where the head of state and the military decide together how to fight. A single centre shortens the path from order to execution, and the General Staff gains the right to plan for the whole country.\n\nMakes it possible to fortify the border."
 UKR_w_unified_command:0 "Unified Command"
 UKR_w_unified_command_desc:0 "The whole army, the Territorial Defence and the security forces answer to a single staff. Planning is simpler and offensive operations are better coordinated, but local commanders lose some initiative.\n\nUnlocks an offensive decision."
 UKR_w_operational_commands:0 "Operational Commands"
 UKR_w_operational_commands_desc:0 "The front is divided into sectors with their own commanders, who are given the right to decide on the spot. Units become more flexible and resilient, but the overall plan is harder to keep.\n\nUnlocks a decision for a fast armoured thrust."
 UKR_w_battle_experience:0 "Battle Experience into Doctrine"
 UKR_w_battle_experience_desc:0 "The lessons of the first months are written into regulations: what worked, what cost needless losses. Instead of yesterday's textbooks, the practice of the front. The gain depends on the chosen command system.\n\nUnlocks a decision for assaulting a fortified position."
 UKR_w_general_mobilization:0 "General Mobilization"
 UKR_w_general_mobilization_desc:0 "Conscription across the whole country: reservists, volunteers, specialists. People must be trained, clothed and armed, and every conscript is one person fewer at the factory or in the field.\n\nUnlocks the second and third mobilization waves and a choice of how the state will gather its people."
 UKR_w_pay_the_soldiers:0 "Decent Pay"
 UKR_w_pay_the_soldiers_desc:0 "A contract with decent pay, payments to families, benefits for the wounded. People enlist more willingly and stay at the front longer, but the budget pays every month.\n\nMutually exclusive choice: the method of mobilization - money, slogans or coercion."
 UKR_w_call_to_the_nation:0 "Call to the Nation"
 UKR_w_call_to_the_nation_desc:0 "Mobilization by slogans: history, language, the image of the enemy. A wave of volunteers and high morale, but such rhetoric feeds hatred and strengthens the nationalists.\n\nMutually exclusive choice: the method of mobilization."
 UKR_w_forced_mobilization:0 "Forced Conscription"
 UKR_w_forced_mobilization_desc:0 "Raids at enlistment offices, summonses served in the street, fines for evasion. The army gets people fast, but society is unhappy and allies do not approve.\n\nMutually exclusive choice: the method of mobilization."
 UKR_w_reserve_and_veterans:0 "Reserve and Veterans"
 UKR_w_reserve_and_veterans_desc:0 "Former fighters return as instructors, the wounded are treated and retrained, reservists complete their training. The result depends on how the country mobilized its people earlier.\n\nUnlocks decisions on honouring the fallen and helping veterans."
 UKR_w_united_news:0 "United News"
 UKR_w_united_news_desc:0 "All television channels broadcast one shared programme: a single picture, less panic, no contradictions. But free media lose their voice, and trust in the official version rests only on successes.\n\nMutually exclusive choice: wartime information policy. Unlocks the resilience campaign."
 UKR_w_open_communication:0 "Open Communication"
 UKR_w_open_communication_desc:0 "Daily briefings, honest casualty figures, debate on air. Trust and transparency grow and allies see an open country, but the enemy also reads everything we say.\n\nMutually exclusive choice: wartime information policy. Unlocks the cultural campaign."
 UKR_w_relocate_industry:0 "Relocate Industry to the West"
 UKR_w_relocate_industry_desc:0 "Factories are dismantled and moved from the east and south to the west: machine tools, people, archives. Months of downtime, but then production returns where it is harder to reach.\n\nUnlocks the Carpathian logistics plan and the dispersal of production."
 UKR_w_state_war_order:0 "State Defence Order"
 UKR_w_state_war_order_desc:0 "The state places orders directly and sets prices and deadlines. Predictable and controlled, but private initiative is limited. Strengthens the tank, repair and artillery enterprises.\n\nMutually exclusive choice: who runs wartime production. Unlocks an additional defence project."
 UKR_w_private_contracts:0 "Private Producer Contracts"
 UKR_w_private_contracts_desc:0 "Orders go to private companies: drones, radio electronics, boats. Speed and inventiveness are higher, but control is weaker and profits go to the owners.\n\nMutually exclusive choice: who runs wartime production. Unlocks an additional defence project."
 UKR_w_sky_shield:0 "Shield of the Sky"
 UKR_w_sky_shield_desc:0 "Layered air defence: long-range systems around the capital and energy hubs, anti-aircraft crews and mobile fire groups cover the cities. Every system is expensive, but strikes on infrastructure become rarer and weaker."
 UKR_w_resilient_grid:0 "Resilient Power Grid"
 UKR_w_resilient_grid_desc:0 "Distributed generation, reserve substations, mobile repair crews. Strikes on the power system still hurt, but the lights come back sooner.\n\nUnlocks a decision for power repair crews."
 UKR_w_appeal_to_the_world:0 "Appeal to the World"
 UKR_w_appeal_to_the_world_desc:0 "Speeches in parliaments and international organizations, eyewitness accounts, daily material for the press. The sympathy of the world is a resource that has to be renewed constantly.\n\nUnlocks the Western aid package, the resistance coalition and a donor conference."
 UKR_w_europe_first:0 "Europe First"
 UKR_w_europe_first_desc:0 "A course for a firm bond with the European capitals: joint staffs, consultations, openness. Aid flows more reliably, but we take on obligations and lose some independence.\n\nMutually exclusive choice: whom to lean on. Unlocks lend-lease and an intelligence operation with NATO."
 UKR_w_own_strength:0 "Self-Reliance"
 UKR_w_own_strength_desc:0 "Not to ask but to produce. A bet on domestic factories and designers: slower and more expensive, but we do not depend on other people's decisions.\n\nMutually exclusive choice: whom to lean on. Adds funds to the defence industry organizations."
 UKR_w_regional_security:0 "Regional Security"
 UKR_w_regional_security_desc:0 "Agreements with the nearest neighbours: shared depots, shared air defence, fast data exchange. This is not joining an alliance, but a step toward one.\n\nUnlocks the regional alliance and, with good coalition trust, raises Ukraine's seat in the headquarters."
 UKR_w_drone_war:0 "Drones at the Front"
 UKR_w_drone_war_desc:0 "Mass-produced reconnaissance and strike drones, assembled in workshops and factories, provide what artillery lacks: eyes on the front line and a cheap strike.\n\nUnlocks strike coordination and a drone batch."
 UKR_w_deep_strikes:0 "Deep Strikes"
 UKR_w_deep_strikes_desc:0 "Depots, headquarters and crossings behind the front line become targets. This breaks the enemy's logistics and lifts morale, but European capitals fear escalation.\n\nMutually exclusive choice: how to fight. Unlocks night raids, a sabotage war and an all-out response."
 UKR_w_attrition_defense:0 "Defence of Attrition"
 UKR_w_attrition_defense_desc:0 "Not to lunge forward but to wear down: minefields, defence in depth, fire on advancing columns. Less risk and more trust from partners, but the initiative belongs to the enemy.\n\nMutually exclusive choice: how to fight. Unlocks the defence of the strategic triangle."
 UKR_w_black_sea_drones:0 "Black Sea: Uncrewed Boats"
 UKR_w_black_sea_drones_desc:0 "A fleet without ships: boats carrying explosives and reconnaissance pin the enemy down in the sea. Cheap and effective against large ships.\n\nUnlocks a naval operation."
 UKR_w_p_tech_digital_hq:0 "Digital Headquarters"
 UKR_w_p_tech_digital_hq_desc:0 "A single digital platform for commanders, volunteers and logistics: requests, maps, records. The technocrats build the management of the war as a data system.\n\nThis focus is available only on the technocrat path."
 UKR_w_p_tech_drone_command:0 "Unmanned Systems Command"
 UKR_w_p_tech_drone_command_desc:0 "A separate branch of the forces: drones, communications, operator training. The technocrats carry startup experience to the front."
 UKR_w_p_left_labor_front:0 "Labour Front"
 UKR_w_p_left_labor_front_desc:0 "Trade unions and work collectives take on part of the work of the rear: defence orders, repairs, help for families. The president widens his audience: the war is presented as a common cause rather than the army's concern alone.\n\nThis focus is available only on the left path."
 UKR_w_p_left_people_defense:0 "People's Defence"
 UKR_w_p_left_people_defense_desc:0 "Local self-defence detachments, village patrols, basic skills training for civilians. The mobilization base widens through volunteers on the ground."
 UKR_w_p_olig_business_cabinet:0 "Business in the War Cabinet"
 UKR_w_p_olig_business_cabinet_desc:0 "Major owners join operational councils: logistics, fuel, communications. Things move faster, but the influence of money on state decisions grows.\n\nThis focus is available only on the oligarch path."
 UKR_w_p_olig_patron_battalions:0 "Patronage of Units"
 UKR_w_p_olig_patron_battalions_desc:0 "Holdings take responsibility for individual units: supply, transport, repair. The front gets more equipment, and the owners gain political capital."
 UKR_w_p_nat_nation_council:0 "Council of the Nation"
 UKR_w_p_nat_nation_council_desc:0 "Ideological leadership of mobilization: memory, language, ritual, the image of the enemy. The nationalists set the tone of public mood.\n\nThis focus is available only on the nationalist path."
 UKR_w_p_nat_volunteer_corps:0 "Volunteer Corps"
 UKR_w_p_nat_volunteer_corps_desc:0 "Volunteer formations receive official status and supplies. Fighting spirit is high, but control over them provokes disputes and worries allies."
 UKR_wi_martial_law:0 "Martial Law"
 UKR_wi_martial_law_desc:0 "A special wartime legal regime: the country lives by the laws of defence. People and resources are mobilized faster, but freedoms are restricted and no elections are held while the war lasts."
 UKR_wi_stavka:0 "The Headquarters"
 UKR_wi_stavka_desc:0 "A single centre for military decisions shortens the path from order to execution."
 UKR_wi_unified_command:0 "Unified Command"
 UKR_wi_unified_command_desc:0 "All forces answer to one staff: offensive operations are coordinated, but local commanders are bound by orders from above."
 UKR_wi_operational:0 "Operational Commands"
 UKR_wi_operational_desc:0 "Sectors of the front are run by their own commanders: flexibility and resilience grow, the overall plan becomes harder to keep."
 UKR_wi_staff_rhythm:0 "Staff Rhythm"
 UKR_wi_staff_rhythm_desc:0 "The experience of the first months has become clear procedures: plans are prepared faster and orders arrive more precisely."
 UKR_wi_local_initiative:0 "Local Initiative"
 UKR_wi_local_initiative_desc:0 "Commanders in the sectors have got used to deciding for themselves: units learn faster and hold positions better."
 UKR_wi_military_pay:0 "Decent Army Pay"
 UKR_wi_military_pay_desc:0 "Good pay for fighters and families: people serve more willingly and stay in the ranks longer, but costs grow every month."
 UKR_wi_patriotic_wave:0 "Patriotic Wave"
 UKR_wi_patriotic_wave_desc:0 "Slogans, history and the image of the enemy have raised volunteers and morale. Such a wave is never eternal and needs fresh words."
 UKR_wi_forced_draft:0 "Forced Conscription"
 UKR_wi_forced_draft_desc:0 "The army gets people fast, but every raid at an enlistment office undermines trust in the authorities."
 UKR_wi_unified_info:0 "Unified Information Broadcast"
 UKR_wi_unified_info_desc:0 "A single picture of the day reduces panic and lifts morale, but free voices are heard less and less."
 UKR_wi_open_comms:0 "Open Communication"
 UKR_wi_open_comms_desc:0 "Honest briefings and public debate strengthen the trust of society and allies, though they also give material to the enemy."
 UKR_wi_relocation:0 "Relocated Industry"
 UKR_wi_relocation_desc:0 "Factories are moving west: first downtime and costs, then output where it is harder to reach."
 UKR_wi_state_order:0 "State Defence Order"
 UKR_wi_state_order_desc:0 "Direct state orders give predictable deliveries and clear deadlines."
 UKR_wi_private_contracts:0 "Private Defence Contracts"
 UKR_wi_private_contracts_desc:0 "Flexible private producers master new things faster, but the state finds them harder to control."
 UKR_wi_sky_shield:0 "Shield of the Sky"
 UKR_wi_sky_shield_desc:0 "New air defence systems and mobile groups cover cities and the power system."
 UKR_wi_resilient_grid:0 "Resilient Power Grid"
 UKR_wi_resilient_grid_desc:0 "Distributed generation and reserve substations: a strike on one hub no longer blacks out a city."
 UKR_wi_world_sympathy:0 "Sympathy of the World"
 UKR_wi_world_sympathy_desc:0 "Appeals to the world have drawn the attention of the press and public sympathy. It is not permanent capital and cools with time."
 UKR_wi_europe_course:0 "European Course"
 UKR_wi_europe_course_desc:0 "A close bond with the European capitals gives political weight, but some decisions have to be coordinated."
 UKR_wi_self_reliance:0 "Self-Reliance"
 UKR_wi_self_reliance_desc:0 "A bet on domestic production: slower and more expensive, but other people's decisions no longer decide our supply."
 UKR_wi_regional:0 "Regional Agreements"
 UKR_wi_regional_desc:0 "Shared depots and fast data exchange with neighbours ease supply."
 UKR_wi_drone_surge:0 "Drone Surge"
 UKR_wi_drone_surge_desc:0 "Mass-produced drones provide reconnaissance and a cheap strike along the whole front."
 UKR_wi_deep_strike:0 "Deep Strikes"
 UKR_wi_deep_strike_desc:0 "Strikes behind the front line break the enemy's logistics and lift morale, but worry the European capitals."
 UKR_wi_attrition:0 "Defence of Attrition"
 UKR_wi_attrition_desc:0 "Minefields and defence in depth: the enemy pays for every kilometre."
 UKR_wi_black_sea:0 "The Black Sea"
 UKR_wi_black_sea_desc:0 "Uncrewed boats pin down the enemy fleet and open the sea lanes."
 UKR_wi_pause:0 "Operational Pause"
 UKR_wi_pause_desc:0 "Units have had time to refit and rest; organization is higher and reinforcement is faster."
 UKR_wi_grid_repair:0 "Power Repair Crews"
 UKR_wi_grid_repair_desc:0 "The crews are already in place: the lights come back sooner."
 UKR_wi_p_tech_digital_hq:0 "Digital Headquarters"
 UKR_wi_p_tech_digital_hq_desc:0 "Requests, maps and records in one system: decisions are made faster."
 UKR_wi_p_tech_drone_command:0 "Unmanned Systems Command"
 UKR_wi_p_tech_drone_command_desc:0 "A separate branch of the forces with its own operator training and communications."
 UKR_wi_p_left_labor_front:0 "Labour Front"
 UKR_wi_p_left_labor_front_desc:0 "Trade unions and work collectives help the rear: orders, repairs, help for families."
 UKR_wi_p_left_people_defense:0 "People's Defence"
 UKR_wi_p_left_people_defense_desc:0 "Local self-defence detachments widen the mobilization base."
 UKR_wi_p_olig_business_cabinet:0 "Business in the War Cabinet"
 UKR_wi_p_olig_business_cabinet_desc:0 "Owners in operational councils speed up decisions, but money influences politics more."
 UKR_wi_p_olig_patron_battalions:0 "Patronage of Units"
 UKR_wi_p_olig_patron_battalions_desc:0 "Holdings supply and repair individual units."
 UKR_wi_p_nat_nation_council:0 "Council of the Nation"
 UKR_wi_p_nat_nation_council_desc:0 "Ideological leadership of mobilization sets the tone of public mood."
 UKR_wi_p_nat_volunteer_corps:0 "Volunteer Corps"
 UKR_wi_p_nat_volunteer_corps_desc:0 "Volunteer formations have received status and supplies; spirit is high, but there is no shortage of disputes over control."
 UKR_wd_operational_pause:0 "Operational Pause"
 UKR_wd_operational_pause_desc:0 "The front needs time: to refill units, rotate the exhausted, restore communications. A short pause in active operations lowers fatigue and raises organization, but the enemy gets a breather too."
 UKR_wd_mobilization_campaign:0 "Mobilization Campaign"
 UKR_wd_mobilization_campaign_desc:0 "Another intake of people. The result depends on the chosen method of mobilization: money brings fewer people but a calmer society; slogans lift morale and hatred; coercion brings the most people and the most discontent."
 UKR_wd_factory_dispersal:0 "Dispersal of Production"
 UKR_wd_factory_dispersal_desc:0 "Workshops are spread across small sites, depots hidden, shifts rearranged. Every raid now breaks less, although production efficiency drops."
 UKR_wd_donor_conference:0 "Donor Conference"
 UKR_wd_donor_conference_desc:0 "An international meeting where donor countries announce contributions and list what they will go to: budget, energy, reconstruction. Good preparation and transparent reports raise the trust of partners."
 UKR_wd_drone_batch:0 "Drone Batch"
 UKR_wd_drone_batch_desc:0 "Another batch of drones from workshops and factories goes to the front. Cheap, fast, and a little smarter every time."
 UKR_wd_grid_repair:0 "Power Repair Crews"
 UKR_wd_grid_repair_desc:0 "Crews with stocks of equipment leave right after a strike and restore substations under fire. The lights come back sooner and people see that the state is working."
 ukrainewar.810.t:0 "War Comes to Every Home"
 ukrainewar.810.d:0 "The morning begins not with an alarm clock but with a siren. In basements and the metro, neighbours with children and bags; on the highways, columns; at cash machines, silence. Only yesterday the country argued about cabinets and taxes, today every conversation is about where the exit is and how much time we have.\n\nNobody sleeps in the offices: martial law, a unified headquarters, mobilization and contact with partners must be settled in a single week. Then the war tree begins: every decision opens new possibilities but closes others. We will have to choose fast."
 ukrainewar.810.a:0 "We have been heading here. Now, to work."
 ukrainewar.811.t:0 "Martial Law"
 ukrainewar.811.d:0 "Parliament has voted for martial law and general mobilization. The decree restricts travel and assembly, bans elections for the duration of the war and hands part of the powers to military administrations. It is neither victory nor defeat but an instrument: it lets the state demand what defence cannot do without, and that is exactly why it must not be stretched without need.\n\nThe unified headquarters has brought the army, the Territorial Defence, the border guards, intelligence and civilian authority under one roof. The question is no longer what to do, but how."
 ukrainewar.811.a:0 "It has to be so."
 ukrainewar.812.t:0 "The War Drags On"
 ukrainewar.812.d:0 "The first weeks are behind us. The front has stabilized, but it is clear that there will be no quick resolution. Other tools are needed: to train, to build, to negotiate, to produce. It is time to think not about the first days but about the first months and years.\n\nSecond-tier focuses open on the war tree."
 ukrainewar.812.a:0 "We prepare for a long war."
