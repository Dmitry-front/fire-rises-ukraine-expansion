 UKR_special_military_operation:0 "Вооружённые Силы Украины"
 UKR_special_military_operation_desc:0 "Формировавшиеся на основе советской военной системы, Вооружённые Силы Украины прошли путь трансформации, адаптируясь к современным вызовам. Идут масштабные реформы: создаются профессиональные части, усиливается разведывательный потенциал, внедряются передовые технологии. ВСУ становятся независимой и высокоэффективной силой, способной не только защищать государственный суверенитет, но и задавать новые стандарты ведения войны в XXI веке."
 
 UKR_novorossiyan_offensive_decision:0 "Наступление на Новороссию"
 UKR_novorossiyan_offensive_decision_desc:0 "Стратегическая операция по возвращению территорий восточной Украины"
 UKR_first_mobilization_wave:0 "Первая волна мобилизации"
 UKR_first_mobilization_wave_desc:0 "Первоочередная мобилизационная кампания, направленная на срочное комплектование Вооружённых сил Украины личным составом. Охватывает призывников и резервистов категорий A1 и A2. Мобилизация предусматривает призыв до 100 000 военнослужащих с последующим трёхмесячным ускоренным курсом подготовки в зоне боевых действий."
 UKR_second_mobilization_wave:0 "Вторая волна мобилизации"
 UKR_second_mobilization_wave_desc:0 "Вторая стратегическая мобилизационная кампания, нацеленная на комплектование Вооружённых сил Украины личным составом с учётом оперативной обстановки. Охватывает призывников и резервистов категорий B1 и B2, с особым вниманием к подготовке специалистов бронетанковых войск, артиллерии и подразделений противовоздушной обороны. Мобилизация предусматривает призыв до 125 000 военнослужащих с интенсивной подготовкой в условиях реального театра военных действий."
 UKR_third_mobilization_wave:0 "Третья волна мобилизации"
 UKR_third_mobilization_wave_desc:0 "Заключительный этап масштабного призыва в критический период противостояния. Мобилизация охватывает призывников и резервистов категорий C1 и C2, включая военнообученных граждан старших возрастных групп и специалистов узкого профиля."

 UKR_political_decisions:0 "Политические решения"
 UKR_political_decisions_desc:0 "2020 год стал для Украины периодом испытаний и возможностей. \n\nВнутренняя политика характеризуется продолжающейся борьбой с коррупцией и необходимостью проведения реформ для укрепления демократических институтов. \n\nНа востоке страны сохраняется напряженность, вызванная продолжающимся конфликтом. \n\nВнешняя политика направлена на углубление интеграции с Европейским Союзом и НАТО, а также на поиск поддержки со стороны международного сообщества для разрешения конфликта и обеспечения территориальной целостности Украины. \n\nСтратегическая ситуация требует укрепления обороноспособности страны и поиска путей для мирного урегулирования конфликта."
 UKR_establish_border_defense_system_desc:0 "В условиях нарастающей напряженности необходимо усилить оборонительные рубежи страны, чтобы защитить наши границы."
 UKR_appeal_to_un_security_council_desc:0 "Международное сообщество должно знать о нарушениях и угрозах, с которыми сталкивается Украина. Мы должны обратиться за поддержкой к Совету Безопасности ООН."
 UKR_request_nato_partnership_desc:0 "Для обеспечения безопасности страны необходимо углублять сотрудничество с НАТО и стремиться к членству в альянсе."

