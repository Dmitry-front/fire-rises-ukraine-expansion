 UKR_vp_pay_off_met:0 "Компенсация: Металл и энергетика"
 UKR_vp_pay_off_met_desc:0 "Закрыть часть долгов перед металлургами и энергетиками: заказом, тарифом или налоговым решением. Дорого, но дешевле, чем обида."
 UKR_vp_pay_off_priv:0 "Компенсация: Приват"
 UKR_vp_pay_off_priv_desc:0 "Закрыть часть долгов перед «Приватом»: эфирным временем, нефтяной квотой или удобным судебным решением. Дорого, но дешевле, чем обида."
 UKR_vp_pay_off_gas:0 "Компенсация: Газ и химия"
 UKR_vp_pay_off_gas_desc:0 "Закрыть часть долгов перед газовщиками и химиками: лицензией, ценой на газ или решением по облгазам. Дорого, но дешевле, чем обида."
 UKR_vp_pay_off_sec:0 "Компенсация: Силовой круг"
 UKR_vp_pay_off_sec_desc:0 "Закрыть часть долгов перед силовым кругом: должностью, бюджетом или закрытым делом. Дорого, но дешевле, чем обида."
 ukraine_politics.600.t:0 "Обед в Офисе"
 ukraine_politics.600.d_yermak:0 "Обед назначен на половину второго в Офисе президента на Банковой, и приглашения ушли без повестки, что само по себе повестка. За столом четверо: представитель группы Рината Ахметова (СКМ, «Метинвест», ДТЭК), человек Игоря Коломойского («Приват», «1+1 Медиа», «Укрнафта»), представитель Дмитрия Фирташа (Group DF, «Остчем», облгазы; сам он с 2014 года в Вене, где тянется процесс о его выдаче США) и высокий чин из силового блока. Андрей Ермак разливает чай и объясняет, что обед рабочий, а не политический.\n\nФормат понятен всем: президент больше не чистит окружение, он его оформляет. Каждый хочет знать, что ему обещано, и каждый понимает, что с него спросят. Остаётся выбрать тон: договариваться, держать дистанцию или напомнить, чья здесь Банковая."
 ukraine_politics.600.d_stefanchuk:0 "Обед назначен на половину второго в Офисе президента на Банковой, и приглашения ушли без повестки, что само по себе повестка. За столом четверо: представитель группы Рината Ахметова (СКМ, «Метинвест», ДТЭК), человек Игоря Коломойского («Приват», «1+1 Медиа», «Укрнафта»), представитель Дмитрия Фирташа (Group DF, «Остчем», облгазы; сам он с 2014 года в Вене, где тянется процесс о его выдаче США) и высокий чин из силового блока. Офис теперь ведёт Руслан Стефанчук: он разливает чай и объясняет, что обед рабочий, а протокол вести не нужно.\n\nФормат понятен всем: президент больше не чистит окружение, он его оформляет. Каждый хочет знать, что ему обещано, и каждый понимает, что с него спросят. Остаётся выбрать тон: договариваться, держать дистанцию или напомнить, чья здесь Банковая."
 ukraine_politics.600.a:0 "Договариваться: каждому по обещанию."
 ukraine_politics.600.b:0 "Держать дистанцию: слушать и записывать."
 ukraine_politics.600.c:0 "Напомнить, чья здесь Банковая."
 ukraine_politics.601.t:0 "Кто возглавит правительство"
 ukraine_politics.601.d:0 "Вертикали нужен премьер, который не обсуждает указания, а исполняет их. Предлагают двух. Давид Арахамия, глава фракции «Слуга народа» в Раде, знает каждого депутата по голосованию и каждого министра по телефону, и его считают человеком, который умеет договариваться без свидетелей. Андрей Богдан, бывший глава Офиса, ушедший в феврале 2020 года, много лет был адвокатом Игоря Коломойского, и в «Привате» его возвращение прочтут как знак, что о них не забыли.\n\nПервый укрепит Банковую, второй вернёт часть влияния кланам. Можно оставить действующего премьера, но клановые претензии от этого не исчезнут, их придётся гасить другим способом."
 ukraine_politics.601.a:0 "Давид Арахамия: фракция и дисциплина."
 ukraine_politics.601.b:0 "Андрей Богдан: старая дружба «Привата»."
 ukraine_politics.601.c:0 "Оставить действующего премьера."
 ukraine_politics.602.t:0 "Кому достанется экономика"
 ukraine_politics.602.d:0 "В этой конструкции портфель экономики не профильная должность, а карта влияния. Александр Вилкул, политик из Кривого Рога и бывший вице-премьер, представляет горно-металлургический сектор, и металлурги готовы поддержать его в любой формуле, где им гарантируют энергию и тарифы. Даниил Гетманцев, председатель налогового комитета Рады, человек президента: налоги и тарифы при нём будут решаться так, как нужно Банковой, а не Кривому Рогу и Запорожью.\n\nМеталлурги и энергетики ждут ответа, а их претензии растут вместе с их долей в бюджете. Оставить действующего министра безопаснее, но тогда им придётся что-то предложить в другом месте."
 ukraine_politics.602.a:0 "Александр Вилкул: металл и энергия."
 ukraine_politics.602.b:0 "Даниил Гетманцев: налоги по линии Банковой."
 ukraine_politics.602.c:0 "Оставить действующего министра."
 ukraine_politics.603.t:0 "Кому достанется МВД"
 ukraine_politics.603.d:0 "МВД это Нацгвардия, полиция и кадры, которые знают, где лежат все дела. Арсен Аваков руководил ведомством с 2014 года и ушёл в 2020-м после скандала, но его люди остались в регионах, и вернуть его значит вернуть и их. Денис Монастырский, глава МВД после отставки Авакова, лоялен Банковой и собственной базы не имеет: ставка на него делает силовиков зависимыми от Офиса, а не от министра.\n\nСиловой круг ждёт ответа: с ним будут говорить как с партнёром или как с исполнителем."
 ukraine_politics.603.a:0 "Арсен Аваков: полиция, Нацгвардия и свой аппарат."
 ukraine_politics.603.b:0 "Денис Монастырский: министр без собственной базы."
 ukraine_politics.603.c:0 "Оставить действующего министра."
 ukraine_politics.604.t:0 "Кто закупает для армии"
 ukraine_politics.604.d:0 "Оборонные закупки это деньги, а деньги это отношения. Алексей Резников, министр обороны, умеет объяснять, почему контракт нужно было заключить быстро и именно с этим поставщиком; после истории с яйцами по 17 гривен министерство научилось отвечать на такие вопросы без паузы. Силовой круг и металлурги рассчитывают, что при нём заказы пойдут своим. Андрей Таран, его предшественник, скорее офицер, чем менеджер: с ним армии спокойнее, а подрядчикам скучнее.\n\nВыбор между ними это выбор между заказами и отчётностью. Оставить всё как есть тоже можно, но у кланов своё мнение о том, как должен выглядеть тендер."
 ukraine_politics.604.a:0 "Алексей Резников: закупки идут своим."
 ukraine_politics.604.b:0 "Андрей Таран: офицер, а не менеджер."
 ukraine_politics.604.c:0 "Оставить действующего министра."
 ukraine_politics.605.t:0 "Кто будет знать всё"
 ukraine_politics.605.d:0 "Разведка и контрразведка знают, кто что обещал и кому. Иван Баканов, друг детства президента, прежде руководивший студией «Квартал 95», человек системы в буквальном смысле: ему не нужно объяснять, чьё это ведомство. Кирилл Буданов профессионал, чья ценность в том, что он не должен никому, а значит, не станет частью конструкции.\n\nДля вертикали это выбор между управляемостью и качеством, для кланов выбор между своим человеком в службе и независимым."
 ukraine_politics.605.a:0 "Иван Баканов: свой человек в службе."
 ukraine_politics.605.b:0 "Кирилл Буданов: профессионал, который никому не должен."
 ukraine_politics.605.c:0 "Оставить действующего министра."
