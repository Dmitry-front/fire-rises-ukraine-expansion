 #UKR MOD
 
 ukraine.4.t:0 "Украина готовится к войне"
 ukraine.4.d:0 "На фоне нарастающей угрозы военного конфликта правительство Украины инициировало срочные меры по укреплению обороноспособности страны. В сотрудничестве с Польшей и Румынией начато строительство фортификационных сооружений в ключевых регионах, а также расширение военной промышленности. В частности, новые укрепрайоны были развернуты в Днепре, Черкасской области и Киевской. Это решение стало частью общей стратегии сдерживания, нацеленной на защиту критически важных направлений."
 ukraine.4.a:0 "Мы должны быть готовы к любому развитию событий"

 # Выборы в Украине 2024
 ukraine.13.t:0 "Президентские выборы 2024 года"
 ukraine.13.d:0 "Настало время очередных президентских выборов в Украине. Предвыборная кампания была напряженной, два основных кандидата боролись за будущее направление развития страны.\n\nВолодымир Зеленский, действующий президент, обещает продолжить свою реформаторскую программу, укрепить демократические институты и сохранить западный вектор страны. Его администрация добилась прогресса в борьбе с коррупцией и цифровой трансформации, хотя критики указывают на растущие авторитарные тенденции.\n\nПетр Порошенко, представляющий более традиционный консервативный подход, делает ставку на опыт и стабильность. Он подчеркивает экономический прагматизм и более тесные связи с олигархическими структурами, утверждая, что это необходимо для экономического развития Украины.\n\nНарод отдал свои голоса, и результаты определят дальнейший путь Украины."
 ukraine.13.a:0 "Зеленский получает еще один срок"
 ukraine.13.b:0 "Порошенко возвращается к власти"

 # Событие спецоперации
 ukraine.11.t:0 "Пересечение границы"
 ukraine.11.d:0 "Российские войска начали массированное вторжение через несколько пограничных секторов. Артиллерийские обстрелы начались по военным объектам, аэродромам и объектам инфраструктуры по всей стране.\n\nПредварительные доклады сообщают, что бронированные колонны наступают с нескольких направлений - из Крыма, с восточной границы около Харькова и Луганска, и из Беларуси на севере. Воздушная тревога объявлена в Киеве и других крупных городах, вражеская авиация и ракеты наносят удары по стратегическим целям.\n\nМасштаб атаки беспрецедентен. Это полномасштабное военное вторжение с очевидной целью оккупации страны. Наши вооружённые силы мобилизуются для отпора агрессору, но ситуация критическая.\n\nПротивник пересёк наши границы. Война началась."
 ukraine.11.a:0 "Мы будем защищать каждый метр нашей земли"

 #Разведывательный отчёт: Анализ действий РФ
 l_russian:
 UKR_intelligence_operation:0 "Отчёт ГУР"
 UKR_intelligence_operation_desc:0 "В результате тщательного анализа, проведённого Главным разведывательным управлением (ГУР), сформирован специальный отряд для постоянного контроля над действиями Российской Федерации. Отчёт, составленный на основании данных внешних источников разведки из Франции, США, а также внутренней информации, выявил применение российскими военными тактических схем, предусматривающих использование мобильных ударных групп, бронетанковых дивизий и оперативных подразделений ФСБ и Службы внешней разведки. Рекомендации доклада указывают на необходимость усиления мер по контролю и быстрого реагирования на агрессивные действия РФ."
 ukraine.800.t:0 "Отчёт ГУР: Контроль над действиями РФ"
 ukraine.800.d:0 "В феврале 2014 года, на фоне массовых протестов на Майдане, разведывательные источники зафиксировали экстренное совещание высшего руководства Российской Федерации, на котором был утверждён план по захвату Крыма. По данным, в течение трёх дней после совещания, морская пехота Черноморского флота получила боевые приказы, а спецназ ГРУ РФ начал подготовку к проведению операции на полуострове. 27 февраля вооружённые формирования захватили здания Верховного Совета и Совета министров, демонстрируя высокий уровень тактической подготовки подразделений, таких как 45-й полк ВДВ и 3-я бригада спецназа ГРУ, с координацией, осуществляемой из Москвы. К утру 28 февраля аэропорты Симферополя и Бельбека перешли под контроль российских десантных войск, что позволило оперативно занять стратегические объекты на полуострове. К началу марта численность российских войск в регионе оценивалась в около 15 тысяч человек. В марте, в ходе референдума, полуостров был аннексирован, что сопровождалось активными действиями спецслужб ФСБ и Службы внешней разведки и применением мобильных ударных групп, в том числе подразделений 76-й дивизии ВДВ и других формирований. Дополнительные разведданные свидетельствуют о пересечениях границы и перемещениях российских подразделений в районе Гуково и Донецка, что подтверждают радиоперехваты и оперативные отчёты. \n\nПо итогам анализа, в ходе совещания в Главном разведывательном управлении было принято решение о создании специализированного отдела для постоянного мониторинга действий российских вооружённых сил, а также о назначении нового начальника Главного Управления Разведки - Буданова, который возьмёт на себя координацию мер в области национальной безопасности."
 ukraine.800.a:0 "Подтвердить доклад и назначить министра"

 ### Казахстан ###
 ukraine.820.t:0 "Казахские Добровольцы Прибывают в Украину"
 ukraine.820.d:0 "После российской оккупации Казахстана многие патриоты были вынуждены бежать из страны или уйти в подполье. Узнав о нашем сопротивлении российской агрессии, группа бывших офицеров Казахской армии и добровольцев сформировала боевое подразделение и прибыла в Украину.\n\nКомандир батальона, полковник Нурлан Касымов, на встрече с нашим военным руководством заявил: «Наша борьба едина. Сражаясь за свободу Украины, мы сражаемся и за свободу Казахстана. Кремль не остановится, пока не поработит все бывшие советские республики. Мы не допустим этого».\n\nБатальон состоит из хорошо подготовленных бойцов, многие из которых имеют опыт в спецподразделениях. Они привезли с собой некоторое количество вооружения и готовы немедленно вступить в бой. Несмотря на трудности пути через оккупированные территории, их боевой дух высок, а решимость дать отпор агрессору непоколебима."
 ukraine.820.a:0 "Вместе мы сильнее!"
 kazakh_volunteers_tooltip:0 "Получен §YКазахский Батальон Свободы§! с опытными бойцами и современным вооружением."

 ### Узбекистан ###
 ukraine.821.t:0 "Узбекские Добровольцы Присоединяются к Украинскому Сопротивлению"
 ukraine.821.d:0 "Сегодня украинская граница стала свидетелем необычного зрелища: колонна грузовиков под флагами Узбекистана и Украины доставила группу добровольцев, бежавших из оккупированного Россией Узбекистана. Батальон, названный в честь национального героя Тимура, состоит из бывших военнослужащих узбекской армии и гражданских патриотов.\n\nКомандир батальона, майор Рустам Ахмедов, в своей речи перед украинскими офицерами подчеркнул: «Кремлевская машина не различает наши народы - для неё мы все лишь территории на карте империи. Но наши народы помнят вкус свободы, и мы готовы сражаться плечом к плечу с украинскими братьями».\n\nУзбекские добровольцы привезли с собой ценный медицинский персонал и оборудование, что особенно важно для фронтовых госпиталей. Большинство бойцов имеет опыт военной службы, и они уже выразили желание участвовать в наиболее сложных операциях против российских оккупантов."
 ukraine.821.a:0 "Наша борьба становится международной!"
 uzbek_volunteers_tooltip:0 "Получен §YБатальон Тимура§! с опытным медицинским персоналом."

 ### Грузия ###
 ukraine.822.t:0 "Грузинский Легион Свободы Прибывает на Фронт"
 ukraine.822.d:0 "После очередной российской оккупации Грузии и установления марионеточного режима, тысячи грузин вынуждены были покинуть родину. Сегодня лучшие из них прибыли в Украину, чтобы сформировать Грузинский Легион Свободы.\n\nЭто не первый раз, когда грузинские добровольцы сражаются за Украину. Еще со времен первого российского вторжения в 2014 году грузинские воины доказали свою преданность и отвагу на поле боя. Теперь, когда их собственная страна оккупирована, они видят в освобождении Украины первый шаг к освобождению всего региона от кремлевской тирании.\n\nКомандир легиона, генерал Георгий Мамулашвили, на встрече с президентом Украины заявил: «Грузины никогда не забудут 2008 год, как украинцы не забудут 2014-й. Наша память и наша боль объединяют нас. Но сегодня нас объединяет еще и общая надежда на победу. В Тбилиси свобода придет через Киев».\n\nЛегион укомплектован опытными бойцами, многие из которых уже имеют опыт борьбы с российскими оккупантами как в Грузии, так и в Украине. Их мобильные подразделения особенно эффективны в городских условиях и горной местности."
 ukraine.822.a:0 "За нашу и вашу свободу!"
 georgian_volunteers_tooltip:0 "Получен §YГрузинский Легион Свободы§! с высокомобильными подразделениями."

 ### Беларусь ###
 ukraine.823.t:0 "Полк Кастуся Калиновского Присоединяется к Украинским Силам"
 ukraine.823.d:0 "В условиях тотального контроля Кремля над Беларусью, патриотически настроенные белорусы, отказавшиеся признать марионеточный режим, сформировали Полк имени Кастуся Калиновского и прибыли в Украину.\n\nИстория этого подразделения началась еще во время первых конфликтов на Донбассе, когда небольшие группы белорусских добровольцев присоединились к украинским батальонам. Со временем их количество росло, особенно после жестокого подавления протестов в Беларуси. Теперь, когда Россия полностью контролирует белорусскую территорию, полк стал настоящим символом белорусского сопротивления.\n\nНа церемонии принятия присяги командир полка, бывший подполковник белорусской армии Сергей Янчук, произнес: «Сегодня судьба наших народов решается на полях сражений Украины. Каждый украинский город, который мы защитим от оккупантов - это шаг к освобождению Минска, Гомеля, Бреста. Наша борьба неразделима».\n\nПолк Калиновского особенно хорошо оснащен и имеет развитую систему поддержки, включая инженерные, медицинские и разведывательные подразделения. Многие из бойцов имеют опыт службы в элитных частях белорусской армии."
 ukraine.823.a:0 "Жыве Беларусь! Слава Украине!"
 belarusian_volunteers_tooltip:0 "Получен §YБелорусский Полк Кастуся Калиновского§! со всесторонней поддержкой."

 ### Азербайджан ###
 ukraine.824.t:0 "Азербайджанская Бригада на Украинском Фронте"
 ukraine.824.d:0 "После поглощения Азербайджана Россией многие азербайджанские военные отказались присягать новому режиму и были вынуждены бежать. Сегодня элитная группа этих офицеров и солдат сформировала Азербайджанскую Бригаду, чтобы сражаться на стороне Украины.\n\nВозглавляемая полковником Эльшаном Мамедовым, бригада привнесла ценный опыт, полученный во время конфликта в Нагорном Карабахе. Их знания в области современного высокотехнологичного боя, особенно в использовании беспилотников и противотанковых систем, могут оказаться решающими в противостоянии российским бронетанковым подразделениям.\n\n«Мы не можем стоять в стороне, когда империя снова расширяется, - заявил полковник Мамедов. - Украина сегодня - это линия обороны всех постсоветских республик. Если падет Киев, потухнет факел свободы. Мы не позволим этому произойти».\n\nАзербайджанская бригада уже привлекла внимание украинского командования своей дисциплиной и техническими навыками. Несмотря на относительно небольшую численность, это подразделение может оказать значительное влияние в ключевых точках фронта."
 ukraine.824.a:0 "Их опыт будет неоценим!"
 azerbaijani_volunteers_tooltip:0 "Получена §YАзербайджанская Бригада§! с экспертами по противотанковой борьбе."

 ### Таджикистан ###
 ukraine.825.t:0 "Таджикский Батальон Сопротивления Прибыл в Украину"
 ukraine.825.d:0 "После российской оккупации Таджикистана и установления прокремлевского режима, группа таджикских военных и гражданских активистов сформировала батальон сопротивления и, преодолев множество препятствий, добралась до территории Украины.\n\nБатальон возглавляет бывший командир спецназа таджикской армии Рустам Назаров. «Наши народы объединяет общее прошлое и, к сожалению, общая угроза. Кремль не остановится на одной стране - его цель восстановить империю. Мы должны остановить эту агрессию здесь и сейчас», - заявил он на встрече с украинским командованием.\n\nХотя таджикский батальон уступает по численности и оснащению другим иностранным формированиям, его бойцы имеют бесценный опыт боевых действий в горной местности и партизанской войны. Многие из них служили в таджикских горных бригадах и знакомы с российской военной тактикой и техникой.\n\nДля украинской армии приход таджикских добровольцев имеет не только военное, но и символическое значение, демонстрируя, что сопротивление российской агрессии объединяет народы от Центральной Европы до Средней Азии."
 ukraine.825.a:0 "Борьба за свободу не имеет границ!"
 tajik_volunteers_tooltip:0 "Получен §YТаджикский Батальон Сопротивления§! с опытом партизанской войны."

 ### Армения ###
 ukraine.828.t:0 "Армянский Батальон Арарат Присоединяется к Борьбе"
 ukraine.828.d:0 "Сегодня в расположение украинских войск прибыла крупная группа армянских добровольцев, сформировавшая «Батальон Арарат». После того как российские войска вошли в Армению, установив там полный контроль, многие патриотически настроенные армяне отказались мириться с оккупацией и решили продолжить борьбу на украинской земле.\n\nКомандир батальона, полковник Арам Саркисян, в своем обращении к украинскому командованию отметил: «История научила армянский народ, что свобода никогда не дается просто так, за неё всегда приходится сражаться. Сегодня судьба не только Украины или Армении, но и всех народов бывшего СССР решается здесь, на этих полях сражений. Победив здесь, мы начнем освобождение наших родных земель».\n\nАрмянские бойцы обладают значительным боевым опытом, многие из них участвовали в карабахских конфликтах. Особенно ценны их навыки противотанковой борьбы и ведения боя в сложных горных условиях. Батальон хорошо укомплектован техникой и вооружением, которое добровольцам удалось вывезти перед тем, как российские войска установили полный контроль над их страной."
 ukraine.828.a:0 "Добро пожаловать, братья по оружию!"
 armenian_volunteers_tooltip:0 "Получен §YАрмянский Батальон Арарат§! с специалистами по артиллерийской и противотанковой борьбе."

 ### Туркменистан ###
 ukraine.829.t:0 "Туркменский Мобильный Отряд на Службе Украине"
 ukraine.829.d:0 "Через Каспийское море и далее тайными путями через Кавказ в Украину прибыла группа туркменских добровольцев. Несмотря на изоляционистскую политику Туркменистана и последующую оккупацию страны Россией, эти смелые люди сумели организовать сопротивление и в конечном итоге добраться до Украины, чтобы продолжить борьбу с общим врагом.\n\nВозглавляет отряд майор Довлет Бердыев, бывший командир спецподразделения туркменской армии. «Туркменистан долгие годы был закрыт от мира, но сердца наших людей всегда были открыты свободе. Российская оккупация показала нам, что нейтралитет - это иллюзия безопасности. Сегодня мы здесь, потому что понимаем: если падет Украина, весь регион погрузится во тьму новой империи», - заявил он на встрече с украинскими офицерами.\n\nТуркменские добровольцы сформировали высокомобильный отряд, специализирующийся на быстрых рейдах и разведывательных операциях. Многие из бойцов имеют опыт службы в пустынных регионах, что делает их особенно эффективными на открытых пространствах юга Украины."
 ukraine.829.a:0 "Свобода объединяет все народы!"
 turkmen_volunteers_tooltip:0 "Получен §YТуркменский Мобильный Отряд§! с высокой мобильностью и разведывательными навыками."

 ### Кыргызстан ###
 ukraine.830.t:0 "Кыргызский Горный Батальон Прибыл в Украину"
 ukraine.830.d:0 "После оккупации Кыргызстана российскими войсками значительная часть кыргызских военных отказалась подчиняться новому режиму. Преодолев множество препятствий и преследований, группа офицеров и солдат сумела организовать сопротивление и в итоге пробиться на территорию Украины, где сформировала Кыргызский Горный Батальон.\n\nКомандир батальона, подполковник Болот Асанов, бывший командир горно-стрелковой бригады кыргызской армии, в своем первом обращении к украинскому командованию сказал: «Наши народы связывает не только общее советское прошлое, но и общее стремление к свободе. Кыргызы всегда были вольным народом гор, и мы не смиримся с новым российским игом. Сражаясь за Украину сегодня, мы сражаемся за свободу Кыргызстана завтра».\n\nБатальон специализируется на ведении боевых действий в сложной местности и противовоздушной обороне. Бойцы батальона имеют богатый опыт службы в горных районах Тянь-Шаня, что делает их особенно ценными для операций в холмистых и горных районах Украины. Несмотря на ограниченное количество тяжелого вооружения, их тактическая подготовка и боевой дух компенсируют этот недостаток."
 ukraine.830.a:0 "Горные орлы присоединяются к нашей борьбе!"
 kyrgyz_volunteers_tooltip:0 "Получен §YКыргызский Горный Батальон§! с опытом ведения боя в сложной местности."

 # Фокусы
 UKR_donbass_conflict_and_crimea_annexation:0 "Конфликт на Донбассе и аннексия Крыма"
 UKR_donbass_conflict_and_crimea_annexation_desc:0 "В 2014 году Россия аннексировала Крым и поддержала сепаратистские движения на Донбассе, нарушив Будапештский меморандум 1994 года. Эти события стали поворотным моментом в современной истории Украины. В результате боевых действий погибло более 13 000 человек, а миллионы граждан вынуждены были покинуть свои дома. Украина потеряла контроль над 7% своей территории, а стоимость потерь только в промышленности Донбасса оценивается в $50 млрд. Санкции, введённые против агрессора, стали первым шагом к международному давлению, но угроза полномасштабной войны остаётся реальной."
 
 UKR_oligarchs_and_economy:0 "Олигархи и экономика"
 UKR_oligarchs_and_economy_desc:0 "Украина входит в число стран с наибольшим уровнем экономического неравенства. К началу 2020 года более 70% ключевых секторов экономики контролировались всего десятком олигархов. Состояние крупнейших магнатов страны - Рината Ахметова, Виктора Пинчука, Игоря Коломойского - в сумме превышало 14 млрд долларов, в то время как минимальная зарплата оставалась на уровне 150 долларов. Украина нуждается в полномасштабной деолигархизации без этого экономика останется в заложниках у частных интересов."
 
 UKR_corruption_and_power_consolidation:0 "Коррупция и консолидация власти"
 UKR_corruption_and_power_consolidation_desc:0 "Эндемичная коррупция остаётся серьёзной проблемой для Украины. Необходимо сконцентрировать политическую волю для борьбы с ней и провести реформы в ключевых государственных учреждениях.\n\n Реформа правоохранительных органов, НАБУ и САП пока не дали значительных результатов, а схемы «откатов» и теневых сделок продолжают подрывать доверие к власти. Украинцам нужен решительный удар по коррупции, иначе страна останется во власти олигархических кланов."
 
 UKR_presidential_elections:0 "Президентские выборы"
 UKR_presidential_elections_desc:0 "Президентские выборы 2019 года стали символом недоверия к старой политической элите. Владимир Зеленский, набравший 73,2% голосов во втором туре, одержал крупнейшую победу в истории страны. Однако отсутствие политического опыта нового президента ставит под сомнение его способность реализовать обещанные реформы. Олигархические группировки и пророссийские силы уже ищут способ вернуть контроль над властью, а доверие общества может быстро исчезнуть, если не будет реальных изменений."
 
 UKR_path_to_independence:0 "Путь к независимости"
 UKR_path_to_independence_desc:0 "Украина стоит перед историческим выбором: стать полностью суверенным государством или оставаться в тени геополитических игроков. Российская зависимость в газовом секторе, недофинансирование армии и давление внешних кредиторов тормозят развитие. Чтобы укрепить независимость, необходимо развивать собственную экономику, модернизировать армию и провести судебную реформу. Время компромиссов прошло - Украина должна доказать миру свою самостоятельность."
 
 UKR_european_integration:0 "Европейская интеграция"
 UKR_european_integration_desc:0 "Украина уверенно движется к Европе. С 2017 года действует безвизовый режим с ЕС, а товарооборот с европейскими странами вырос на 7% в 2019 году. Однако коррупция и слабая правовая система остаются препятствиями на пути к членству в Евросоюзе. В ближайшие годы стране предстоит привести законодательство в соответствие с нормами ЕС, реформировать судебную систему и доказать, что Украина - это Европа, а не серый буфер между Востоком и Западом."
 
 UKR_secure_western_aid:0 "Обеспечить западную помощь"
 UKR_secure_western_aid_desc:0 "С начала войны Украина получила более $3,8 млрд военной помощи от США, Великобритании и ЕС. Современные противотанковые комплексы Javelin, поставки беспилотников и реформы ВСУ сделали армию сильнее, но этого недостаточно. Нам нужно продолжать наращивать сотрудничество с НАТО, привлекать новые технологии и готовить военные кадры по стандартам Альянса. Без поддержки Запада Украина рискует остаться один на один с врагом."
 
 UKR_develop_domestic_industry:0 "Развитие отечественной промышленности"
 UKR_develop_domestic_industry_desc:0 "Украина обладает колоссальным промышленным потенциалом. ВПК страны входил в топ-10 мировых производителей вооружений, но после 2014 года производство упало на 40%. Заводы в Харькове, Днепре и Запорожье требуют модернизации, чтобы вернуть Украине статус промышленного гиганта. Без сильной экономики войну не выиграть - стране нужна новая индустриализация!"
 
 UKR_defensive_fortifications:0 "Оборонительные укрепления"
 UKR_defensive_fortifications_desc:0 "Система фортификаций на востоке - это щит Украины. Однако на 2020 год лишь 30% запланированных укреплений были завершены. Проект «Стена» на границе с Россией так и не завершён, а война может вспыхнуть с новой силой. Чтобы защитить страну, необходимо срочно возводить укрепления, строить бетонные доты и развернуть минные заграждения. Украина должна стать крепостью, а не коридором для вторжения!"
 
 UKR_territorial_defense_forces:0 "Силы территориальной обороны"
 UKR_territorial_defense_forces_desc:0 "Формирование сил территориальной обороны позволит мобилизовать гражданское население для защиты своих регионов и освободит регулярную армию для выполнения других задач.\n\n В условиях гибридной войны каждая область должна быть готова к обороне. Формирование сил территориальной обороны даст возможность мобилизовать сотни тысяч резервистов и вооружить граждан. Польша, страны Балтии и Финляндия уже внедрили успешные модели территориальной обороны - Украина должна идти по тому же пути."
 
 UKR_diplomatic_offensive:0 "Дипломатическое наступление"
 UKR_diplomatic_offensive_desc:0 "Активная дипломатия - ключевой элемент нашей стратегии. Необходимо усилить международное давление на агрессора и заручиться поддержкой мирового сообщества. Украина должна превратить международную арену в поле боя за правду. В 2019 году резолюция ООН поддержала территориальную целостность Украины, но Россия продолжает дипломатическое давление. Нам нужно усилить позиции в ООН, ОБСЕ, НАТО и привлечь больше союзников. Дипломатия - это оружие XXI века, и Украина должна владеть им в совершенстве."
 
 UKR_national_reconciliation:0 "Национальное примирение"
 UKR_national_reconciliation_desc:0 "Внутреннее единство - основа крепкого государства. Необходимо преодолеть региональные различия и консолидировать общество вокруг общих ценностей и целей. Украинцы должны быть едины перед лицом внешних угроз. Пророссийская пропаганда и внутренние конфликты ослабляют страну, а попытки «замириться» с агрессором только разжигают новые кризисы. Единство - это сила, и без него Украина не сможет победить. Пришло время поставить точку в старых спорах и объединиться ради будущего!"

 UKR_economic_transformation:0 "Экономическая трансформация Украины"
 UKR_economic_transformation_desc:0 "Экономическая система Украины нуждается в глубокой модернизации. С момента обретения независимости экономика страны сталкивается с вызовами: устаревшая промышленная база, низкий уровень инвестиций и сложные административные барьеры. Правительство ставит цель создать благоприятные условия для роста предпринимательства, улучшения инвестиционного климата и развития критически важных отраслей. Важной частью реформ является улучшение налоговой политики, борьба с коррупцией и цифровизация экономики."

 UKR_big_construction:0 "Большая стройка"
 UKR_big_construction_desc:0 "Инфраструктура страны требует значительных вложений: более 90% автодорог в неудовлетворительном состоянии, износ железнодорожной инфраструктуры превышает 60%, а во многих регионах отсутствует современная транспортная логистика. Запуск программы "Большая стройка" нацелен на модернизацию дорожной сети, развитие железнодорожного сообщения и строительство новых социальных объектов. Это создаст рабочие места и повысит общий уровень экономического развития. Однако программа требует значительных бюджетных ресурсов, что может увеличить нагрузку на госфинансы."

 UKR_digital_economy:0 "Цифровая экономика"
 UKR_digital_economy_desc:0 "Украина делает ставку на цифровую трансформацию, чтобы ускорить экономический рост. Внедрение электронных услуг, развитие IT-индустрии и поддержка инновационных компаний помогут увеличить приток инвестиций и сделать государственное управление более прозрачным. Одним из ключевых проектов станет "Дія.City" - специальный режим для IT-компаний, направленный на создание благоприятных условий для бизнеса, что должно повысить конкурентоспособность Украины на глобальном рынке."

 UKR_startup_support:0 "Поддержка стартапов"
 UKR_startup_support_desc:0 "Стартап-экосистема Украины обладает большим потенциалом, но сталкивается с нехваткой инвестиций и трудностями в выходе на международные рынки. Запуск государственных программ по поддержке инновационного бизнеса позволит стимулировать развитие технологических компаний. Особое внимание будет уделено финтеху, агротехнологиям и искусственному интеллекту, где украинские компании уже демонстрируют конкурентоспособность."
 UKR_startup_ecosystem_tooltip:0 "Цифровая Украина. Развитие IT-инфраструктуры. Инвестиции в IT-стартапы."

 UKR_agricultural_reform:0 "Реформа сельского хозяйства"
 UKR_agricultural_reform_desc:0 "Сельскохозяйственная отрасль является одной из ключевых в экономике Украины, но её эффективность сдерживается устаревшей материальной базой. Более 50% сельскохозяйственной техники эксплуатируется дольше установленного срока службы, а уровень механизации в отдельных сегментах остается низким. Проведение реформы позволит модернизировать аграрный сектор, привлечь инвестиции и повысить производительность, сделав Украину сильным игроком на мировом продовольственном рынке."

 UKR_land_market_opening:0 "Открытие рынка земли"
 UKR_land_market_opening_desc:0 "Запуск земельной реформы - важный шаг в развитии аграрного сектора. Введение прозрачных механизмов купли-продажи сельскохозяйственных земель позволит привлечь частные инвестиции и повысить их стоимость. Однако этот шаг сопровождается общественным скептицизмом, так как существует риск концентрации земли в руках крупных агрохолдингов. Государство берет на себя задачу мониторинга и регулирования рынка, чтобы избежать подобных последствий."

 UKR_invest_in_infrastructure:0 "Инвестиции в инфраструктуру"
 UKR_invest_in_infrastructure_desc:0 "Экономическое развитие невозможно без качественной инфраструктуры. Вложение в модернизацию железных дорог, портов и логистических узлов обеспечит стране новые возможности для торговли и ускорит транспортное сообщение внутри страны. Одним из ключевых направлений станет обновление подвижного состава "Укрзалізниці", а также развитие скоростных железнодорожных магистралей, что улучшит условия для бизнеса и повысит уровень жизни населения."

 UKR_reform_general_staff_nato_standards:0 "Реформа Генерального штаба: Стандарты НАТО"
 UKR_reform_general_staff_nato_standards_desc:0 "Современные войны требуют строгой дисциплины, профессионального командования и эффективного управления боевыми операциями. Интеграция стандартов НАТО в структуру нашего Генерального штаба обеспечит координацию войск на уровне ведущих армий мира. Это позволит повысить стратегическое планирование, оперативную гибкость и взаимодействие с союзниками."

 UKR_mobile_tactics_doctrine:0 "Мобильная доктрина: Тактика наступления"
 UKR_mobile_tactics_doctrine_desc:0 "Быстрое передвижение, решительные удары по ключевым позициям противника и стремление к глубокому прорыву - вот основы современной мобильной войны. Развитие механизированных и моторизованных частей позволит нам применять тактику манёвренных боевых действий, что обеспечит превосходство на поле боя."

 UKR_modernize_tank_forces:0 "Модернизация танковых войск"
 UKR_modernize_tank_forces_desc:0 "Бронетанковые войска являются основой любой современной армии. Масштабное перевооружение наших танковых соединений новейшими образцами техники позволит нам увеличить боевую мощь, скорость наступления и огневую поддержку пехотных подразделений. Инвестиции в разработку и производство современных танков укрепят нашу обороноспособность."

 UKR_blitzkrieg_tactics:0 "Тактика Блицкрига"
 UKR_blitzkrieg_tactics_desc:0 "История доказала, что молниеносные, высокоинтенсивные наступательные операции способны сокрушить врага ещё до того, как он успеет перегруппироваться. Развитие концепции быстрого манёвра, глубокого прорыва и тесного взаимодействия между танковыми, механизированными и авиационными соединениями позволит нам доминировать в любых боевых условиях."

 UKR_combined_arms_doctrine:0 "Сбалансированная доктрина: Совместные операции"
 UKR_combined_arms_doctrine_desc:0 "Эффективное взаимодействие всех родов войск - залог победы. Совместное применение бронетехники, пехоты, артиллерии и авиации позволит максимально эффективно использовать сильные стороны каждого из этих элементов. Грамотная координация сил создаст прочную основу для ведения наступательных и оборонительных операций."

 UKR_mobile_groups_tactics:0 "Тактика мобильных групп"
 UKR_mobile_groups_tactics_desc:0 "Гибкость и скорость - ключевые элементы современной военной стратегии. Создание высокомобильных ударных групп позволит нам эффективно реагировать на изменения на фронте, быстро сосредотачивать силы в критических точках и наносить молниеносные удары по противнику."

 UKR_consolidate_tactical_gains:0 "Закрепление тактических успехов"
 UKR_consolidate_tactical_gains_desc:0 "Победа на поле боя - это не только умелые атаки, но и способность удерживать завоёванные позиции. Мы развернём укреплённые рубежи на стратегически важных направлениях, усилим инженерные войска и обеспечим оперативную логистику, что позволит нам минимизировать потери и гарантировать надёжное удержание территорий."

 UKR_defensive_doctrine:0 "Глубокая оборона: Оборонительная доктрина"
 UKR_defensive_doctrine_desc:0 "Эффективная оборона - это не просто удержание позиций, а активное маневрирование войсками, контрудары и эшелонированная защита. Разработка современной концепции глубокой обороны позволит нам истощать противника, разрушать его коммуникации и создавать условия для перехода в контрнаступление."
 
 # Идеи
 UKR_endemic_corruption:0 "Эндемичная коррупция"
 UKR_endemic_corruption_desc:0 "Коррупция в Украине имеет глубокие исторические корни, уходящие во времена Советского Союза. Захват государства олигархами, неэффективная бюрократия и слабое верховенство закона создали систему, где коррупция пронизывает все уровни власти и бизнеса. Исследования Transparency International стабильно ставят Украину в ряд наиболее коррумпированных стран Европы, с примерной оценкой потерь в 4-6% годового ВВП из-за коррупции. Эта системная проблема подрывает экономическое развитие, отпугивает иностранные инвестиции и разрушает доверие общества к государственным институтам."
 
 UKR_corruption_reforming:0 "Антикоррупционные реформы"
 UKR_corruption_reforming_desc:0 "Украина начала внедрять комплексную антикоррупционную структуру с новыми специализированными институтами, такими как НАБУ (Национальное антикоррупционное бюро) и НАПК (Национальное агентство по предотвращению коррупции). Хотя эти реформы следуют успешным моделям таких стран, как Румыния и Грузия, они сталкиваются со значительным сопротивлением заинтересованных сторон. Начальный прогресс обнадёживает, но остаётся хрупким, как показывает неоднозначный успех подобных реформ в постсоветских государствах. Экономические исследования показывают, что снижение уровня коррупции потенциально может увеличить годовой рост ВВП Украины на 1-2%, хотя переходный период часто нарушает устоявшиеся бизнес-практики и административные процессы."

 UKR_western_support:0 "Западная поддержка"
 UKR_western_support_desc:0 "Украина получает значительную финансовую, техническую и военную помощь от западных стран, что повышает её обороноспособность и потенциал реформирования."
 
 UKR_industrial_revitalization:0 "Промышленное возрождение"
 UKR_industrial_revitalization_desc:0 "Программа модернизации и диверсификации промышленности направлена на повышение конкурентоспособности украинской продукции и увеличение экспортного потенциала."
 
 UKR_territorial_defense_idea:0 "Силы территориальной обороны"
 UKR_territorial_defense_idea_desc:0 "Новая система территориальной обороны позволяет мобилизовать местное население для защиты критической инфраструктуры и борьбы с диверсионными группами."
 
 UKR_economic_reform_attempts:0 "Попытки экономических реформ"
 UKR_economic_reform_attempts_desc:0 "Правительство предпринимает усилия по реформированию экономики, однако сопротивление олигархов и бюрократии замедляет эти процессы."

 UKR_government_corruption_low:0 "Украинский Олигархат"
 UKR_government_corruption_low_desc:0 "Различные олигархические кланы уже давно и прочно вошли в сферу влияния наших властных структур. В среде государственных служащих широко распространены негласные вознаграждения за содействие, взяточничество, вымогательство и другие злоупотребления властью. Несмотря на уже существующее антикоррупционное законодательство, слабая судебная система и неблагоприятная экономическая ситуация делают исполнение этих законов крайне затруднительным, а в некоторых случаях и вовсе невозможным. Были запущены проекты, направленные на снижение влияния олигархов на государство."

 # Локализация для идей
 UKR_big_construction_idea:0 "Программа «Большое строительство»"
 UKR_land_reform_idea:0 "Земельная реформа"
 UKR_digital_state_idea:0 "Государство в смартфоне"
 UKR_startup_ecosystem_idea:0 "Экосистема украинских стартапов"
 UKR_land_market_idea:0 "Открытый рынок земли"
 UKR_infrastructure_modernization_idea:0 "Модернизация инфраструктуры"
 UKR_economic_transformation_idea:0 "Экономическая трансформация Украины"

 UKR_big_construction_idea_desc:0 "Программа «Большое строительство» - это масштабный проект по модернизации инфраструктуры в рамках всей страны. Дороги, школы, больницы и другие объекты инфраструктуры строятся ускоренными темпами. Несмотря на критику о неэффективности расходов, программа стимулирует экономику и создает рабочие места."
 UKR_land_reform_idea_desc:0 "Открытие рынка земли сельскохозяйственного назначения - историческое решение, положившее конец многолетнему мораторию. Благодаря этой реформе земля становится полноценным экономическим активом, привлекая инвестиции и стимулируя модернизацию аграрного сектора, являющегося одним из ключевых драйверов украинской экономики."
 UKR_digital_state_idea_desc:0 "Инициатива «Государство в смартфоне» направлена на дигитализацию государственных услуг и борьбу с бюрократией. Проект «Дія» позволяет гражданам быстро и удобно получать государственные услуги, что не только повышает эффективность госаппарата, но и значительно снижает возможности для коррупции."
 UKR_startup_ecosystem_idea_desc:0 "Правительство ведет активную работу по созданию благоприятных условий для IT-сектора и стартапов. Налоговые стимулы, специальные правовые режимы и «Фонд стартапов» формируют экосистему, способствующую инновациям. Украинские IT-специалисты, известные своим высоким профессионализмом, становятся важным экспортным ресурсом страны."
 UKR_land_market_idea_desc:0 "Отмена моратория на продажу сельскохозяйственных земель выводит «из тени» огромный сегмент экономики. Фермеры получают доступ к кредитным ресурсам, используя землю как залог, а инвесторы - возможность вкладывать средства в перспективный агробизнес. Несмотря на ограничения для иностранцев, рынок земли стимулирует приток инвестиций и модернизацию сельскохозяйственного производства."
 UKR_infrastructure_modernization_idea_desc:0 "Масштабная модернизация транспортной инфраструктуры улучшает логистику и снижает транспортные издержки. Новые дороги, мосты и обновленные порты не только ускоряют движение товаров по стране, но и укрепляют роль Украины как транзитного хаба между Европой и Азией. Современная инфраструктура - залог конкурентоспособной экономики."
 UKR_economic_transformation_idea_desc:0 "Экономическая трансформация Украины направлена на построение современной, конкурентоспособной экономики европейского типа. Проводимые реформы направлены на дерегуляцию, приватизацию неэффективных государственных предприятий, улучшение инвестиционного климата и интеграцию в европейские экономические структуры. Ключевой целью является повышение благосостояния граждан и укрепление экономической устойчивости государства."

 UKR_nato_command_structure:0 "Структура командования НАТО"
 UKR_nato_command_structure_desc:0 "Украина реформирует свою военную систему в соответствии со стандартами НАТО, улучшая планирование операций и управление командованием."
 
 UKR_blitzkrieg_doctrine:0 "Доктрина молниеносной войны"
 UKR_blitzkrieg_doctrine_desc:0 "Украина делает ставку на маневренные наступательные операции, повышая скорость и прорывную мощь своих механизированных и моторизированных войск."
 
 UKR_rapid_offensive_operations:0 "Тактика стремительного наступления"
 UKR_rapid_offensive_operations_desc:0 "Наша армия ориентирована на молниеносные атаки, превосходя противника в скорости и инициативе, но за счёт большей потребности в ресурсах и организации."
 
 UKR_mobile_battlegroups:0 "Мобильные боевые группы"
 UKR_mobile_battlegroups_desc:0 "Сочетание огневой мощи артиллерии и высокой мобильности механизированных подразделений делает украинские войска более гибкими и сбалансированными в бою."
 
 UKR_consolidation_tactics:0 "Тактика укрепления позиций"
 UKR_consolidation_tactics_desc:0 "Наша армия делает акцент на оборонительную доктрину, улучшая возможности окопаться, укрепляться и сдерживать наступление противника."
 
 UKR_fortification_bureau:0 "Бюро фортификаций"
 UKR_fortification_bureau_desc:0 "Создано специализированное бюро для строительства оборонительных сооружений, укрепления рубежей и защиты стратегически важных точек."
 
 UKR_echeloned_defense:0 "Глубокоэшелонированная оборона"
 UKR_echeloned_defense_desc:0 "Оборонительная стратегия Украины строится на создании многослойных укреплённых позиций, усложняющих прорыв противника и минимизирующих потери."
 
 UKR_western_military_advisors:0 "Западные военные советники"
 UKR_western_military_advisors_desc:0 "Сотрудничество с НАТО позволило привлечь западных военных экспертов, что способствует модернизации нашей армии и улучшению боевой подготовки."
 
 UKR_modern_command_and_control:0 "Современные системы командования и управления"
 UKR_modern_command_and_control_desc:0 "Внедрение современных технологий связи, разведки и координации делает украинские вооружённые силы более эффективными и организованными в бою."

 UKR_fortification_construction:0 "Строительство укреплений"
 UKR_fortification_construction_desc:0 "Украина всегда стояла перед лицом угроз, и сейчас нам необходимо усилить нашу оборону. Создание новых укреплений и фортификационных сооружений повысит нашу защиту и замедлит продвижение врага. Мы также улучшим инженерные разработки, чтобы ускорить строительство и производство фортификаций."

 UKR_deep_defense_tactics:0 "Тактика глубокой обороны"
 UKR_deep_defense_tactics_desc:0 "Мы адаптируем нашу стратегию к современным реалиям, внедряя глубоко эшелонированную оборону. Эта тактика позволит нам удерживать позиции, увеличивая эффективность окопных боёв и снижая урон от вражеских атак. Благодаря улучшенной организации наши войска смогут дольше противостоять агрессору."

 # Дополнительные локализации для идей, упомянутых в событиях
 UKR_agricultural_boom:0 "Аграрный бум"
 UKR_agricultural_boom_desc:0 "Открытие рынка земли дало мощный импульс развитию аграрного сектора. Новые инвестиции, доступные кредиты и усовершенствованные технологии повышают эффективность сельскохозяйственного производства. Украина уверенно укрепляет свой статус «житницы Европы», наращивая производство и экспорт сельхозпродукции."
 
 UKR_slow_land_reform:0 "Затянувшаяся земельная реформа"
 UKR_slow_land_reform_desc:0 "Земельная реформа продвигается медленнее, чем ожидалось. Сложные бюрократические процедуры, правовая неопределенность и сохраняющееся недоверие ограничивают активность на рынке земли. Хотя определённый прогресс заметен, полный потенциал реформы далек от реализации."
 
 UKR_digital_leadership_idea:0 "Лидерство в цифровизации"
 UKR_digital_leadership_idea_desc:0 "Проект «Дія» превратился в один из самых передовых проектов цифрового правительства в мире. Украина стала примером для других стран в области цифровизации государственных услуг. Успех проекта не только сделал жизнь граждан удобнее, но и значительно сократил коррупционные риски за счет минимизации человеческого фактора в бюрократических процедурах."
 
 UKR_digital_security_issues:0 "Проблемы цифровой безопасности"
 UKR_digital_security_issues_desc:0 "Обнаруженные уязвимости в системах цифрового правительства вызвали серьезные опасения относительно безопасности персональных данных граждан. Временное замедление темпов цифровизации необходимо для проведения комплексного аудита безопасности и устранения выявленных недостатков."
 
 UKR_energy_price_control:0 "Государственное регулирование цен на энергоресурсы"
 UKR_energy_price_control_desc:0 "В условиях энергетического кризиса правительство ввело жесткое регулирование цен на энергоносители и коммунальные услуги. Эта мера защитила население от резкого роста тарифов, но создала дополнительную нагрузку на государственный бюджет и снизила инвестиционную привлекательность энергетического сектора."
 
 UKR_energy_market_adjustment:0 "Рыночная адаптация энергетического сектора"
 UKR_energy_market_adjustment_desc:0 "Правительство позволило ценам на энергоресурсы формироваться под влиянием рыночных факторов, одновременно расширив программу адресных субсидий для малообеспеченных слоев населения. Хотя этот подход вызвал социальное напряжение в краткосрочной перспективе, он создает стимулы для повышения энергоэффективности и привлечения инвестиций в отрасль."
 
 UKR_investment_boom:0 "Инвестиционный бум"
 UKR_investment_boom_desc:0 "Успешный инвестиционный форум дал старт целой серии крупных международных проектов в Украине. Приток прямых иностранных инвестиций заметно ускорился, создавая новые рабочие места и стимулируя экономический рост. Особенно активны инвесторы в сферах информационных технологий, возобновляемой энергетики и агробизнеса."
 
 UKR_investment_disappointment:0 "Недостаточный интерес инвесторов"
 UKR_investment_disappointment_desc:0 "Несмотря на масштабную подготовку, инвестиционный форум не оправдал возложенных на него надежд. Международные инвесторы проявляют осторожность, указывая на сохраняющиеся проблемы в сфере защиты прав собственности, судебной системы и корпоративного управления. Необходимы дополнительные реформы для улучшения инвестиционного климата."
 
 UKR_export_focused_industry:0 "Экспортоориентированная промышленность"
 UKR_export_focused_industry_desc:0 "Правительство активно поддерживает промышленные предприятия, ориентированные на экспорт. Экспортные кредиты, налоговые льготы и помощь в сертификации продукции по международным стандартам помогают украинским производителям расширять присутствие на зарубежных рынках. Рост экспортной выручки укрепляет национальную валюту и улучшает торговый баланс страны."
 
 UKR_domestic_industry_focus:0 "Развитие внутреннего промышленного рынка"
 UKR_domestic_industry_focus_desc:0 "Приоритетом экономической политики стало развитие внутреннего промышленного рынка. Программы импортозамещения, государственные закупки отечественной продукции и стимулирование внутреннего спроса нацелены на создание более устойчивой и самодостаточной экономической системы, менее зависимой от колебаний на мировых рынках."

 # Дополнительные локализации для идей, упомянутых в событиях
 UKR_modified_land_reform_idea:0 "Модифицированная земельная реформа"
 UKR_modified_land_reform_idea_desc:0 "После массовых протестов правительство пошло на уступки и внесло изменения в земельную реформу. Ограничения на концентрацию земли в одних руках были ужесточены, а местным громадам предоставлены дополнительные полномочия по контролю за земельными сделками. Эти изменения успокоили часть протестующих, но замедлили темпы реформы и снизили её экономическую эффективность."

 UKR_booming_it_sector_idea:0 "Бурный рост IT-сектора"
 UKR_booming_it_sector_idea_desc:0 "Украинская IT-индустрия переживает настоящий золотой век. Благодаря инвестициям в инфраструктуру, образование и благоприятным условиям для технологического бизнеса, экспорт IT-услуг становится одним из ключевых источников валютных поступлений в страну. «Украинская Кремниевая долина» привлекает всё больше международных инвесторов и талантов."

 UKR_it_tax_policy:0 "Повышенное налогообложение IT-сектора"
 UKR_it_tax_policy_desc:0 "Правительство ввело дополнительные налоги для IT-компаний и изменило условия работы для ФЛП в этом секторе. Это обеспечило краткосрочный приток средств в бюджет, но вызвало недовольство в отрасли. Некоторые компании начали рассматривать возможность релокации своих офисов в страны с более благоприятным налоговым режимом."

 UKR_construction_investigation:0 "Расследование злоупотреблений в «Большом строительстве»"
 UKR_construction_investigation_desc:0 "После выявления масштабных коррупционных схем в программе «Большое строительство» было начато официальное расследование. Многие проекты временно приостановлены, а тендерные процедуры пересматриваются. Это негативно сказалось на темпах инфраструктурного развития, но должно привести к более эффективному использованию государственных средств в будущем."

 UKR_government_anti_corruption:0 "Антикоррупционная политика"
 UKR_government_anti_corruption_desc:0 "Правительство Украины запустило серию антикоррупционных реформ."
 # События
 ukraine.105.t:0 "Нарушение Будапештского меморандума"
 ukraine.105.d:0 "Будапештский меморандум 1994 года предоставил Украине гарантии безопасности в обмен на отказ от ядерного оружия. Однако в 2014 году Россия, один из гарантов, аннексировала Крым и поддержала сепаратистов на востоке Украины, явно нарушив свои обязательства. Это поставило под вопрос эффективность международных договоров и подорвало режим нераспространения ядерного оружия. Мировое сообщество выразило озабоченность, но реальных шагов для восстановления территориальной целостности Украины не последовало."
 ukraine.105.a:0 "Требовать выполнения гарантий от других подписантов!"
 ukraine.105.b:0 "Рассчитывать можно только на свои силы."
 
 ukraine.106.t:0 "Экономика на 2020 год"
 ukraine.106.d:0 "Экономика Украины в 2020 году находится в сложном положении. ВВП на душу населения остаётся одним из самых низких в Европе. Несмотря на определённые успехи в диверсификации экспорта, зависимость от сырьевых товаров сохраняется. Банковская система стабилизировалась после кризиса 2014-2015 годов, но кредитование реального сектора ограничено. Олигархические группы контролируют значительную часть экономики, что препятствует честной конкуренции и привлечению инвестиций. Пандемия COVID-19 усугубила эти проблемы, вызвав дополнительное сокращение производства и рост безработицы."
 ukraine.106.a:0 "Активизировать антикоррупционные реформы."
 ukraine.106.b:0 "Сосредоточиться на привлечении инвестиций."
 
 ukraine.107.t:0 "Верховная Рада и олигархи"
 ukraine.107.d:0 "Верховная Рада Украины, несмотря на обновление состава, остаётся под значительным влиянием олигархических групп. Многие депутаты представляют интересы крупного бизнеса, что порой приводит к блокированию важных реформ. Проходит обсуждение законопроекта о деолигархизации, который должен ограничить влияние олигархов на политику и СМИ. Однако его эффективность вызывает сомнения у экспертов. Президент Зеленский пытается консолидировать власть для проведения необходимых реформ, но сталкивается с сопротивлением различных политических сил."
 ukraine.107.a:0 "Провести законопроект о деолигархизации."
 ukraine.107.b:0 "Искать компромисс с влиятельными группами."
 
 ukraine.108.t:0 "Президентские выборы"
 ukraine.108.d:0 "В 2019 году в Украине прошли президентские выборы, которые привели к смене политической элиты. Владимир Зеленский, известный комедийный актёр без политического опыта, одержал убедительную победу над действующим президентом Петром Порошенко. Его успех объясняется усталостью общества от коррупции, непрекращающегося конфликта на востоке и невыполненных обещаний предыдущей власти. Избиратели проголосовали за перемены, надеясь на обновление политической системы и решение насущных проблем. Однако отсутствие политического опыта у нового президента вызывает опасения у части общества и международных партнёров."
 ukraine.108.a:0 "Зеленский побеждает с разгромным счётом."
 ukraine.108.b:0 "Порошенко удерживает власть (альтернативная история)."
 
 ukraine.100.t:0 "Путь к независимости"
 ukraine.100.d:0 "С момента обретения независимости в 1991 году Украина прошла сложный путь государственного строительства. Сегодня страна стоит перед выбором стратегического направления развития. Европейская интеграция и реформы остаются приоритетом, однако конфликт на востоке и аннексия Крыма создают серьёзные препятствия. Правительство стремится укрепить обороноспособность и одновременно проводить необходимые реформы. Народ Украины всё громче заявляет о своём стремлении к настоящей независимости, свободе от коррупции и внешнего влияния. Выбранный путь определит будущее страны на десятилетия вперёд."
 ukraine.100.a:0 "Украина выстоит и победит!"
 
 ukraine.110.t:0 "Дипломатическое наступление"
 ukraine.110.d:0 "Украина активизирует дипломатические усилия для получения международной поддержки. Президент и министр иностранных дел совершают многочисленные визиты в европейские столицы и Вашингтон. На международных форумах поднимаются вопросы территориальной целостности Украины и ситуации на востоке страны. Особое внимание уделяется взаимодействию с НАТО и ЕС, а также развитию двусторонних отношений с ключевыми партнёрами. Эти усилия приносят результаты: международное давление на Россию усиливается, а поддержка Украины становится более конкретной и значимой."
 ukraine.110.a:0 "Сосредоточиться на партнёрстве с США."
 ukraine.110.b:0 "Приоритет - европейская интеграция."

 ukraine.300.t:0 "Скандал вокруг Арсена Авакова"
 ukraine.300.d:0 "Министр внутренних дел Арсен Аваков оказался в центре коррупционного скандала. В обществе нарастает недовольство, что снижает доверие к правительству."
 ukraine.300.a:0 "Это удар по стабильности страны!"

 ukraine.301.t:0 "Отставка Арсена Авакова"
 ukraine.301.d:0 "После долгих месяцев политических споров и общественного давления Арсен Аваков был отстранён с поста министра внутренних дел. Его отставка стала результатом скандалов, связанных с коррупцией и неэффективностью реформ в правоохранительных органах.\n\nОбщественная реакция оказалась неоднозначной: часть населения поддержала решение, видя в нём шаг к очищению власти, другая часть считает, что Аваков стал 'козлом отпущения' для отвлечения внимания от более глубоких проблем. Имидж президента пострадал: одни видят в этом слабость и нерешительность, другие попытку восстановить доверие к власти."
 ukraine.301.a:0 "Принять последствия и назначить нового министра."

 # Протесты против земельной реформы
 ukraine_economy.200.t:0 "Протесты против открытия рынка земли"
 ukraine_economy.200.d:0 "После принятия закона об отмене моратория на продажу сельскохозяйственных земель по всей стране вспыхнули массовые протесты. По данным социологов, около 72% населения выступают против открытия рынка земли в текущем виде. Протестующие, среди которых много мелких фермеров и сельских жителей, обеспокоены возможностью концентрации земель в руках олигархов и крупных агрохолдингов.\n\nСоциалистическая партия, активно критикующая земельную реформу, значительно укрепила свои позиции, координируя протестные акции. В Киеве под Верховной Радой собрались тысячи людей с плакатами «Землю народу!» и «Нет распродаже Украины!».\n\nКак правительство должно отреагировать на сложившуюся ситуацию?"
 ukraine_economy.200.a:0 "Подавить протесты - земельная реформа необходима стране!"
 ukraine_economy.200.b:0 "Внести коррективы в земельную реформу, учитывая требования протестующих"

 # Рост IT-экспорта
 ukraine_economy.201.t:0 "Бум IT-экспорта"
 ukraine_economy.201.d:0 "Программа поддержки стартапов и цифровизации экономики приносит значительные результаты. По данным Национального банка Украины, экспорт IT-услуг вырос на 36% за последний год, достигнув отметки в 6,8 миллиардов долларов. Украинские IT-специалисты и компании становятся всё более конкурентоспособными на мировом рынке.\n\nАссоциация IT Ukraine отмечает, что количество работающих в отрасли выросло до 285 000 человек, а средняя зарплата в секторе в 3-4 раза превышает среднюю по стране. Крупные международные компании продолжают открывать свои R&D-центры в Украине, привлеченные высоким уровнем подготовки местных специалистов и благоприятным налоговым режимом для IT-компаний.\n\nНекоторые экономисты предлагают использовать растущие доходы сектора для пополнения бюджета через дополнительное налогообложение, в то время как представители бизнеса призывают сохранить льготные условия для дальнейшего роста."
 ukraine_economy.201.a:0 "Сохранить льготы для IT-сектора и усилить поддержку"
 ukraine_economy.201.b:0 "Ввести дополнительные налоги для IT-компаний - они могут себе это позволить"

 # Коррупционный скандал
 ukraine_economy.202.t:0 "Коррупционный скандал в программе «Большое строительство»"
 ukraine_economy.202.d:0 "Журналистское расследование издания «Наші гроші» выявило серьезные нарушения в реализации программы «Большое строительство». По данным журналистов, стоимость строительства дорог в рамках программы превышает среднерыночную на 30-40%, а система тендеров организована таким образом, что большинство контрактов достается компаниям, связанным с близким окружением высших чиновников.\n\nСогласно расследованию, на некоторых объектах используются некачественные материалы, что уже привело к преждевременному разрушению нескольких недавно отремонтированных участков дорог. Общая сумма потенциальных злоупотреблений оценивается экспертами в 2,3 миллиарда гривен.\n\nОппозиционные политики требуют немедленного расследования и отставки ряда должностных лиц. Как реагировать на этот скандал?"
 ukraine_economy.202.a:0 "Инициировать тщательное антикоррупционное расследование"
 ukraine_economy.202.b:0 "Преуменьшить скандал и продолжить программу «Большое строительство»"

  # Результаты земельной реформы
 ukraine_economy.203.t:0 "Первые результаты земельной реформы"
 ukraine_economy.203.d:0 "Прошло уже достаточно времени с момента открытия рынка земли, чтобы подвести первые итоги этой исторической реформы. По данным Министерства аграрной политики, за первые 6 месяцев было зарегистрировано более 42 тысяч сделок с сельскохозяйственной землей общей площадью свыше 170 тысяч гектаров.\n\nНациональный банк Украины отмечает, что доступ сельхозпроизводителей к кредитам значительно улучшился - банки начали активно принимать права на землю в качестве залогового обеспечения. Сумма кредитов, выданных аграрному сектору, увеличилась на 24% по сравнению с аналогичным периодом прошлого года.\n\nОднако результаты реформы оцениваются экспертами неоднозначно. Некоторые экономисты указывают на то, что цены на землю оказались ниже прогнозируемых, а доля иностранных инвестиций в аграрный сектор выросла не так значительно, как ожидалось. Оппозиционные политики продолжают критиковать реформу, указывая на риски монополизации земельного рынка."
 ukraine_economy.203.a:0 "Реформа успешно стимулирует развитие аграрного сектора"
 ukraine_economy.203.b:0 "Результаты реформы ниже ожиданий - нужно вносить коррективы"

 # Результаты "Государства в смартфоне"
 ukraine_economy.204.t:0 "Успехи программы «Государство в смартфоне»"
 ukraine_economy.204.d:0 "Приложение «Дія» становится одним из самых успешных проектов цифровой трансформации в Европе. По данным Министерства цифровой трансформации, более 12 миллионов украинцев уже пользуются приложением, а количество доступных цифровых услуг превысило 70.\n\nЦифровые паспорта, водительские права, свидетельства о рождении и другие документы в смартфоне значительно упростили повседневную жизнь граждан. Согласно социологическому опросу, 76% пользователей положительно оценивают приложение, а Украина вошла в ТОП-10 стран мира по темпам цифровизации государственных услуг.\n\nОднако в последнее время появились сообщения о нескольких серьезных технических сбоях в работе системы и потенциальных уязвимостях в защите персональных данных. Эксперты по кибербезопасности предупреждают о необходимости усиления защиты цифровых систем государства."
 ukraine_economy.204.a:0 "Продолжить развитие проекта и усилить кибербезопасность"
 ukraine_economy.204.b:0 "Временно приостановить расширение системы для аудита безопасности"

 # Энергетический кризис
 ukraine_economy.205.t:0 "Энергетический кризис"
 ukraine_economy.205.d:0 "Украину накрыл острый энергетический кризис. Цены на природный газ на европейском рынке выросли до рекордных 1900 долларов за тысячу кубометров, что привело к резкому повышению стоимости электроэнергии и отопления. По данным Министерства энергетики, запасы угля на складах ТЭС находятся на критически низком уровне - менее 600 тысяч тонн при необходимом минимуме в 1,5 миллиона тонн.\n\nРяд промышленных предприятий уже объявили о временной приостановке работы из-за высоких цен на энергоносители. Социологические опросы показывают, что более 65% украинцев обеспокоены стоимостью коммунальных услуг в предстоящий отопительный сезон.\n\nПравительству необходимо срочно принять меры для стабилизации ситуации в энергетическом секторе."
 ukraine_economy.205.a:0 "Ввести государственное регулирование цен на энергоресурсы"
 ukraine_economy.205.b:0 "Позволить рынку адаптироваться, предоставив субсидии наиболее уязвимым слоям населения"

 # Инвестиционный форум
 ukraine_economy.206.t:0 "Инвестиционный форум «Украина: Будущее Начинается Сейчас»"
 ukraine_economy.206.d:0 "В международном выставочном центре Киева открылся масштабный инвестиционный форум «Украина: Будущее Начинается Сейчас». В мероприятии принимают участие более 500 представителей бизнеса из 42 стран мира, включая делегации от крупнейших международных корпораций и инвестиционных фондов.\n\nПрезидент Зеленский лично представил инвестиционный потенциал Украины, подчеркнув достижения в сфере цифровизации, инфраструктурного развития и земельной реформы. Особое внимание на форуме уделено IT-сектору, возобновляемой энергетике, агропромышленному комплексу и логистическим проектам.\n\nПо данным Министерства экономики, подготовлено более 30 инвестиционных проектов общей стоимостью свыше 5 миллиардов долларов. Успешное проведение форума может стать важным сигналом для международных инвесторов о готовности Украины к экономическому прорыву."
 ukraine_economy.206.a:0 "Подписать меморандумы о крупных инвестиционных проектах"
 ukraine_economy.206.b:0 "Иностранные инвесторы осторожны - форум не оправдал ожиданий"

 # Украинская индустрия на мировом рынке
 ukraine_economy.207.t:0 "Украинская промышленность на мировых рынках"
 ukraine_economy.207.d:0 "После модернизации инфраструктуры и промышленных мощностей украинские предприятия начали активнее выходить на международные рынки. По данным Государственной службы статистики, экспорт промышленной продукции вырос на 18,7% по сравнению с предыдущим годом.\n\nОсобенно заметен рост в машиностроении (+24,3%), пищевой промышленности (+19,6%) и металлургии (+15,2%). Восстановление мировой экономики после пандемии создало благоприятные условия для украинских экспортеров.\n\nЭксперты отмечают, что модернизация транспортной инфраструктуры значительно улучшила логистику и снизила затраты на доставку продукции зарубежным покупателям. Однако существуют опасения, что слишком активная ориентация на внешние рынки может сделать экономику уязвимой к колебаниям мировой конъюнктуры."
 ukraine_economy.207.a:0 "Поддержать экспортеров и усилить присутствие на международных рынках"
 ukraine_economy.207.b:0 "Сосредоточиться на развитии внутреннего рынка для большей устойчивости экономики"

