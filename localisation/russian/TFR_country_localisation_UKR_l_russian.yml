 ukrainewar.100.t:0 "Падение Киева"
 ukrainewar.100.d:0 "Невероятное случилось. Вражеские войска вошли в столицу Украины. Золотые купола киевских церквей, древние улицы Подола, Майдан Независимости всё это теперь под контролем оккупантов. Падение Киева это не просто потеря города. Это символ нашей борьбы, сердце нации, центр нашей государственности.\n\nНастроение в обществе становится всё более мрачным. Многие теряют надежду, армия деморализована, а политическое руководство раздирается спорами о том, как действовать дальше. Однако даже в этот тёмный час звучат голоса, призывающие продолжать сопротивление. Столица может быть потеряна, но война ещё не проиграна."
 ukrainewar.100.a:0 "Это катастрофа..."
 UKR_kiev_lost_tt:0 "Потеря столицы серьезно подрывает моральный дух нации и армии."
 ukrainewar.100.b:0 "Мы должны принять чрезвычайные меры!"
 UKR_kiev_emergency_measures_tt:0 "Правительство предпринимает решительные шаги для стабилизации ситуации и укрепления обороны."

 ukrainewar.101.t:0 "Харьков пал"
 ukrainewar.101.d:0 "Танковые клинья прорвались к окраинам Харькова на рассвете. Последние защитники вели ожесточённые бои на улицах Салтовки и в промышленных районах города. Территориальная оборона сражалась у стен «Турбоатома» и Харьковского тракторного завода  символов индустриальной мощи города, производивших турбины для всего Советского Союза. Госпром величественное здание конструктивизма, свидетель всех эпох Харькова, вновь оказался в зоне боевых действий. Город, где производили танки, ракетные системы и авиационные двигатели, город с миллионным населением, теперь окутан дымом и разрушением. Харьков был научным центром с десятками университетов, центром машиностроения и высоких технологий. Потеря второго по величине города страны удар по обороноспособности и моральному духу нации."
 ukrainewar.101.a:0 "Организовать экстренную эвакуацию населения!"
 ukrainewar.101.b:0 "Мы вернёмся... Мы обязаны вернуться."
 UKR_kharkiv_evacuation_tt:0 "Организована эвакуация мирного населения Харькова. Жители и квалифицированные кадры спасены."
 UKR_kharkiv_lost_tt:0 "Потеря Харькова тяжелейший удар. Промышленная столица и оборонный центр в руках врага."

 ukrainewar.102.t:0 "Сумы оставлены"
 ukrainewar.102.d:0 "Бои за Сумы длились неделю. Враг наступал с трёх направлений, стремясь окружить город полностью. Защитники удерживали позиции в северных районах до последнего, сдерживая продвижение к центру. Сумы город на северо-востоке, важный транспортный узел и центр химической промышленности. Здесь производили минеральные удобрения и насосное оборудование, снабжавшее всю страну. Население города составляло четверть миллиона человек, многие из которых работали на оборонных предприятиях. Городской парк и центральная площадь, где когда-то гуляли семьи, теперь изрыты воронками. Потеря контроля над Сумами открывает врагу путь к центральным областям."
 ukrainewar.102.a:0 "Спасти людей эвакуировать город!"
 ukrainewar.102.b:0 "Каждый дом, каждая улица будут отомщены."
 UKR_sumy_evacuation_tt:0 "Эвакуация населения Сум проведена. Часть промышленного оборудования вывезена."
 UKR_sumy_lost_tt:0 "Сумы потеряны. Северный транспортный коридор под угрозой."

 ukrainewar.103.t:0 "Чернигов захвачен"
 ukrainewar.103.d:0 "Древний Чернигов, один из старейших городов Руси, пал после жестоких боёв. Оборона держалась на подступах к историческому центру, где стоят храмы XI века. Обстрелы повредили Спасо-Преображенский собор архитектурный памятник времён Ярослава Мудрого. Чернигов был центром лёгкой промышленности и машиностроения, здесь производили текстиль, химические волокна и музыкальные инструменты. Население превышало 285 тысяч человек. Город расположен на стратегическом направлении к столице, его потеря создаёт угрозу окружения северных областей. Бои велись в Деснянском районе и на мосту через реку Десну ключевой транспортной артерии. Историческая память тысячи лет оказалась под пеплом современной войны."
 ukrainewar.103.a:0 "Эвакуировать население и архивы!"
 ukrainewar.103.b:0 "Древний город помнит все войны. Он переживёт и эту."
 UKR_chernihiv_evacuation_tt:0 "Население Чернигова эвакуировано. Часть культурных ценностей спасена."
 UKR_chernihiv_lost_tt:0 "Потеря Чернигова открывает путь к столице. Древний город в руках врага."

 ukrainewar.104.t:0 "Запорожье пало"
 ukrainewar.104.d:0 "Запорожье держалось до конца. Бои шли на левом и правом берегах Днепра, мосты взрывались один за другим. Защитники удерживали ДнепроГЭС и промышленные районы, понимая стратегическое значение города. Запорожье мощный индустриальный центр, где расположена крупнейшая в Европе атомная электростанция, металлургические комбинаты и машиностроительные заводы. «Мотор Сич» производил авиационные двигатели для всего мира. Население города превышало 750 тысяч человек. Символ города знаменитая Запорожская Сечь, колыбель казачества, место силы и свободы. Потеря Запорожья означает потерю энергетического сердца страны и стратегического моста через Днепр. Враг получил контроль над ЗАЭС."
 ukrainewar.104.a:0 "Эвакуация! Вывезти специалистов АЭС!"
 ukrainewar.104.b:0 "Запорожье сердце страны. Это незабываемо."
 UKR_zaporizhzhia_evacuation_tt:0 "Население Запорожья эвакуировано. Специалисты АЭС выведены в безопасное место."
 UKR_zaporizhzhia_lost_tt:0 "Катастрофическая потеря. Запорожская АЭС и промышленный центр захвачены врагом."

 ukrainewar.105.t:0 "Херсон оставлен"
 ukrainewar.105.d:0 "Херсон ворота в Крым, город у устья Днепра захвачен после кровопролитных уличных боёв. Последние защитники отступали через Антоновский мост, который был подорван для задержки наступления. Херсон южный портовый город с населением около 290 тысяч человек, центр судостроения и переработки сельскохозяйственной продукции. Херсонская область житница Украины, крупнейший производитель зерна и овощей. Город славился арбузами и помидорами, которые поставлялись по всей стране. Херсонский судостроительный завод строил корабли для флота. Потеря Херсона перерезает сухопутную связь с южными территориями и открывает врагу путь вдоль черноморского побережья к Одессе."
 ukrainewar.105.a:0 "Эвакуировать мирных жителей через Днепр!"
 ukrainewar.105.b:0 "Херсон будет освобождён. Ворота в Крым не закроются."
 UKR_kherson_evacuation_tt:0 "Население Херсона эвакуировано через Днепр. Операция прошла успешно."
 UKR_kherson_lost_tt:0 "Херсон потерян. Южное направление открыто для наступления врага."

 ukrainewar.106.t:0 "Днепр захвачен"
 ukrainewar.106.d:0 "Днепр третий по величине город страны, индустриальное сердце центральной Украины пал после двухнедельной осады. Бои шли в каждом районе миллионного города. Защитники держали оборону на металлургических комбинатах и заводах, используя цеха как крепости. Днепр центр чёрной металлургии, космической и ракетной промышленности. «Южмаш» производил ракеты-носители для космических программ, «Интерпайп» поставлял трубы по всему миру. Город дал стране сотни космонавтов и учёных. Мерефо-Херсонский мост символ города, соединяющий берега могучего Днепра был ареной ожесточённых боёв. Потеря Днепра это потеря промышленного потенциала, космических технологий и важнейшего транспортного узла страны."
 ukrainewar.106.a:0 "Организовать эвакуацию! Спасти людей и специалистов!"
 ukrainewar.106.b:0 "Днепр город-гигант. Его падение не останется безнаказанным."
 UKR_dnipro_evacuation_tt:0 "Массовая эвакуация населения Днепра проведена. Квалифицированные кадры спасены."
 UKR_dnipro_lost_tt:0 "Потеря Днепра катастрофа. Промышленный и космический центр захвачен."

 ukrainewar.107.t:0 "Житомир потерян"
 ukrainewar.107.d:0 "Житомир, древний город на западном направлении, пал после напряжённых боёв на окраинах. Враг стремился захватить город быстро, чтобы открыть путь к Киеву с запада. Территориальная оборона сражалась в Корольовском и Богунском районах, задерживая продвижение. Житомир областной центр с населением 265 тысяч человек, центр лёгкой промышленности и деревообработки. Здесь производили мебель, музыкальные инструменты, текстиль и оборудование для пищевой промышленности. Город известен своими гранитными месторождениями житомирский гранит украшает здания по всему миру. Потеря Житомира создаёт угрозу западным областям и открывает дополнительный коридор для наступления на столицу."
 ukrainewar.107.a:0 "Эвакуировать жителей на запад!"
 ukrainewar.107.b:0 "Житомир древний город. Он видел всё. Мы вернёмся."
 UKR_zhytomyr_evacuation_tt:0 "Население Житомира эвакуировано в западные области."
 UKR_zhytomyr_lost_tt:0 "Потеря Житомира открывает западное направление для наступления."

 ukrainewar.108.t:0 "Одесса захвачена"
 ukrainewar.108.d:0 "Одесса жемчужина у Чёрного моря, город-герой с населением свыше миллиона человек пала после ожесточённых боёв. Десантные операции, штурм портовых районов, бои на Потёмкинской лестнице и у Оперного театра всё это стало реальностью для города, переживавшего великие осады в истории. Одесса крупнейший портовый город, ворота для экспорта зерна и нефтепродуктов, центр судостроения и нефтепереработки. Одесский порт один из важнейших в Чёрном море. Серебряный якорь на красном поле герба символизирует морскую мощь города. Одесса культурная столица юга, родина писателей и художников, город юмора и свободолюбия. Потеря Одессы отрезает Украину от значительной части черноморского побережья и уничтожает морские торговые пути."
 ukrainewar.108.a:0 "Эвакуация через порт! Спасти город-герой!"
 ukrainewar.108.b:0 "Одесса несдаваема. История помнит все осады."
 UKR_odesa_evacuation_tt:0 "Масштабная эвакуация через Одесский порт. Население и культурные ценности спасены."
 UKR_odesa_lost_tt:0 "Катастрофическая потеря. Одесса морская столица захвачена врагом."

 ukrainewar.109.t:0 "Львов оккупирован"
 ukrainewar.109.d:0 "Львов, культурная и духовная столица западной Украины, город европейской архитектуры и свободолюбия, захвачен после отчаянного сопротивления. Бои шли на улицах старого города, у стен Ратуши и собора Святого Юра. Каждая брусчатка помнит шаги королей, поэтов и революционеров. Львов город с населением 720 тысяч человек, центр машиностроения, пищевой и лёгкой промышленности. Львовская политехника готовила инженеров для всей страны. Город был важнейшим транспортным узлом, соединяющим Украину с Европой. Символ города лев олицетворяет гордость и несгибаемость. Потеря Львова означает потерю западного бастиона, культурного центра и связи с европейским миром. Это удар по национальной идентичности."
 ukrainewar.109.a:0 "Организовать эвакуацию! Спасти культурную столицу!"
 ukrainewar.109.b:0 "Львов непокорённый. Он переживёт любое иго."
 UKR_lviv_evacuation_tt:0 "Население Львова эвакуировано в Закарпатье и Польшу. Культурные ценности спасены."
 UKR_lviv_lost_tt:0 "Потеря Львова удар по национальному духу. Культурная столица захвачена."


  # Освобождение территории
 ukrainewar.400.t:0 "Освобождение оккупированных земель"
 ukrainewar.400.d:0 "Наши войска входят в освобождённые города под ликующие крики населения. Жители выходят на улицы с сине-жёлтыми флагами, обнимают солдат, плачут от радости. Но вместе с триумфом приходит и ужас свидетельства зверств оккупантов, массовые захоронения, разрушенные дома. Каждое освобождённое село это и победа, и новая боль."
 ukrainewar.400.a:0 "Мы помним каждого замученного"

 # Международная поддержка
 ukrainewar.500.t:0 "Волна международной поддержки"
 ukrainewar.500.d:0 "Поставки оружия из-за рубежа, гуманитарная помощь, санкции против агрессора весь мир встал на нашу сторону. В аэропортах разгружают Javelin'ы и HIMARS, в портах швартуются корабли с медикаментами и продовольствием. Эта поддержка даёт силы продолжать борьбу, но напоминает и о нашей зависимости от союзников."
 ukrainewar.500.a:0 "Мы не одиноки в этой борьбе"

 # Энергетическая война
 ukrainewar.600.t:0 "Война за электричество"
 ukrainewar.600.d:0 "Вражеские дроны «Герань» и ракеты «Калибр» методично уничтожают энергетическую систему страны. Тепловые и гидроэлектростанции превращаются в руины, трансформаторные подстанции горят. Миллионы людей сидят без света при минусовых температурах. Но энергетики героически восстанавливают повреждения, а люди учатся жить при свечах."
 ukrainewar.600.a:0 "Тьма не сломит нашу волю"

 # Депортация детей
 ukrainewar.700.t:0 "Похищение детей"
 ukrainewar.700.d:0 "С оккупированных территорий поступают страшные вести захватчики принудительно вывозят украинских детей, отправляют в лагеря «перевоспитания», дают им новые документы и русские имена. Тысячи семей лишены своих детей. Эта боль невыносима она превращает даже самых миролюбивых граждан в яростных мстителей."
 ukrainewar.700.a:0 "Мы найдём каждого украденного ребёнка"
 ukrainewar.700.b:0 "За это нет прощения"

 # Зерновая блокада
 ukrainewar.800.t:0 "Блокада портов"
 ukrainewar.800.d:0 "Черноморские порты заминированы, торговые суда не могут вывозить украинское зерно. Миллионы тонн пшеницы, которая могла бы накормить голодающих в Африке и Азии, гниют в элеваторах. Враг использует голод как оружие не только против нас, но и против всего мира. Однако мы находим новые пути через Дунай, через железные дороги в Польшу."
 ukrainewar.800.a:0 "Украина будет кормить мир, несмотря ни на что"


 # Событие помощи в Балтийских странах
 # Эстония - Кайтселийт
 baltic_defense.1.t:0 "Мобилизация Кайтселийт"
 baltic_defense.1.d:0 "В связи с угрозой российской агрессии и участием в региональном оборонительном альянсе, правительство Эстонии объявило полную мобилизацию Лиги обороны Эстонии (Kaitseliit). Эта добровольная военная организация национальной обороны, насчитывающая более 25,000 членов включая аффилированные организации, готова встать на защиту суверенитета страны.\n\nЧетыре территориальных округа обороны формируют батальоны территориальной обороны, оснащённые современным оружием и прошедшие интенсивную подготовку совместно с силами НАТО. Члены Кайтселийт отлично знают местную территорию и способны организовать эффективную партизанскую оборону."
 baltic_defense.1.a:0 "За независимость Эстонии!"
 estonia_kaitseliit_mobilization_tooltip:0 "§YМобилизовано 3 дивизии территориальной обороны Кайтселийт§!"

 # Литва - Шауляй
 baltic_defense.2.t:0 "Мобилизация Союза стрелков Литвы"
 baltic_defense.2.d:0 "Союз стрелков Литвы (Lietuvos šaulių sąjunga), парамилитарная организация с богатой историей борьбы за независимость, объявляет полную мобилизацию. Около 14,000 шауляй, прошедших военную подготовку и готовых к вооружённому и гражданскому сопротивлению, встают на защиту родины.\n\nТерриториальные стрелковые части, названные в честь исторических героев и регионов Литвы, формируются по всей стране. Эти подразделения, тесно сотрудничающие с регулярными вооружёнными силами, готовы к партизанским действиям и территориальной обороне, опираясь на традиции сопротивления 1940-х годов."
 baltic_defense.2.a:0 "Шауляй готовы к бою!"
 lithuania_sauliai_mobilization_tooltip:0 "§YМобилизовано 3 дивизии стрелковых частей Шауляй§!"

 # Латвия - Земессардзе
 baltic_defense.3.t:0 "Мобилизация Национальной гвардии Латвии"
 baltic_defense.3.d:0 "Национальная гвардия Латвии (Zemessardze) - компонент Национальных вооружённых сил - проводит полномасштабную мобилизацию резервистов. Эта организация, призванная вовлечь граждан Латвии в оборону государства, формирует бригады территориальной обороны во всех регионах страны.\n\nБригады Земессардзе оснащены для выполнения задач территориальной обороны, поддержки гражданских структур в кризисных ситуациях и противодействия гибридным угрозам. Мобилизованные подразделения готовы защищать ключевую инфраструктуру и организовывать оборону населённых пунктов."
 baltic_defense.3.a:0 "За свободную Латвию!"
 latvia_zemessardze_mobilization_tooltip:0 "§YМобилизовано 3 бригады Национальной гвардии§!"

 # Блок 1: необязательная ветка склонностей
 UKR_state_in_smartphone:0 "Государство в смартфоне"
 UKR_state_in_smartphone_desc:0 "Паспорт, права, справки и пособия - в одном приложении. Команда Минцифры обещает, что через пару лет к чиновнику будут ходить только ностальгирующие. Скептики спрашивают, что будет, когда отключат свет."
 UKR_nsdc_sanctions:0 "Санкции СНБО"
 UKR_nsdc_sanctions_desc:0 "Совет национальной безопасности и обороны вводит санкции против телеканалов и лиц, которых власть считает проводниками российского влияния. Решение быстрое и эффективное, но суд в этой схеме участвует постфактум - и это замечают все."
 UKR_social_shield:0 "Социальный щит"
 UKR_social_shield_desc:0 "Индексация пенсий, доплаты медикам и помощь тем, кого ковид оставил без работы. Бюджет трещит, МВФ морщится, зато в очередях на почте впервые за долгое время говорят о правительстве без мата."

 # Политика 2023 года (ukraine_politics)
 ukraine_politics.100.t:0 "Политический год 2023"
 ukraine_politics.100.d:0 "Служебное событие."
 ukraine_politics.101.t:0 "Эхо американской войны"
 ukraine_politics.101.d:0 "Пока в Соединённых Штатах стреляют друг в друга, в Киеве всё труднее объяснять, почему «западная модель» - это ответ на все вопросы. Грантовые программы урезаны, партнёры заняты собой, а либеральные партии впервые за годы видят, как их рейтинги ползут вниз. Эксперты по телевизору спорят, закончился ли «конец истории», и если да, то кто теперь за него платит."
 ukraine_politics.101.a:0 "Курс не меняется. Запад переживёт и это."
 ukraine_politics.101.b:0 "Пора рассчитывать на себя."
 ukraine_politics.102.t:0 "Левый фронт"
 ukraine_politics.102.d:0 "Социал-демократы, зелёные левые и профсоюзные активисты впервые за много лет садятся за один стол. Их общий язык - цены, зарплаты и олигархи, и на фоне кризиса этот язык понимают всё больше людей. Новое объединение обещает идти на выборы в Раду единым списком."
 ukraine_politics.102.a:0 "С ними стоит поговорить."
 ukraine_politics.102.b:0 "Шум в соцсетях - ещё не партия."
 ukraine_politics.102.c:0 "Напомнить им, кто здесь власть."
 ukraine_politics.103.t:0 "Правый поворот"
 ukraine_politics.103.d:0 "Мир трещит по швам, и на этом фоне правые получают своё: «сначала - свои», «сильная армия», «никаких экспериментов». Консерваторы и националисты набирают очки на ток-шоу и в регионах, а их лозунги неожиданно звучат из уст людей, которые ещё вчера голосовали за «новые лица»."
 ukraine_politics.103.a:0 "Перехватить их повестку."
 ukraine_politics.103.b:0 "Держать дистанцию."
 ukraine_politics.104.t:0 "Яйца по 17 гривен"
 ukraine_politics.104.d:0 "Журналисты публикуют документы: по версии СМИ, в контракте на питание для армии яйцо стоит 17 гривен. Не десяток, одно яйцо. В супермаркете у дома за эти деньги можно купить три, а на рынке ещё и сдачу дадут. Министерство сначала говорит о «технической ошибке», потом о «ценах с доставкой в зону ответственности», потом просто перестаёт отвечать на звонки.\n\nИнтернет тем временем живёт своей жизнью: золотые курицы, «яичный фонд Украины», курс «одно армейское яйцо к доллару». Смешно всем, кроме тех, кто этот контракт подписывал, и тех, кто на фронте эти яйца так и не увидел."
 ukraine_politics.104.a:0 "Проверить каждый контракт. И каждое яйцо."
 ukraine_politics.104.b:0 "Не раздувать. Это просто яйца."
 ukraine_politics.105.t:0 "Старт кампании «Слуги народа»"
 ukraine_politics.105.d:0 "До выборов в Раду меньше двух месяцев. Партия президента больше не может выехать на «новых лицах» и надежде: избиратель устал и хочет понять, куда страна идёт дальше. Штаб требует одной ясной программы - попытка обещать всё всем убьёт кампанию."
 ukraine_politics.105.a:0 "Технократия: цифровое государство и прозрачность."
 ukraine_politics.105.b:0 "Социальная программа: зарплаты, пенсии, цены."
 ukraine_politics.105.c:0 "Порядок: сильная власть и безопасность."
 ukraine_politics.105.e:0 "Патриотическая программа: армия, язык, память."
 ukraine_politics.110.t:0 "Выборы в Верховную Раду"
 ukraine_politics.110.d:0 "29 октября. Участки открываются в восемь утра, и уже к обеду ясно, что явка ниже, чем в 2019-м: эйфория новых лиц прошла, а усталость осталась. Экзитполы к десяти вечера рисуют картину, от которой в штабе «Слуги народа» перестают открывать шампанское.\n\nПартия президента остаётся первой, но однопартийного большинства больше нет. Левые впервые за много лет заходят в Раду заметной фракцией, правые укрепились на западе и в столице, а «За будущее» уверенно держит свои округа. Утром журналисты задают один вопрос: с кем «Слуга народа» будет голосовать теперь? В штабе на него пока нет ответа, только калькуляторы."
 ukraine_politics.110.a:0 "Считаем голоса. И союзников."
 ukraine_politics.111.t:0 "Прагматический союз"
 ukraine_politics.111.d:0 "После недели переговоров «Слуга народа» и «За будущее» объявляют о союзе в Раде. Любви в нём нет: партия президента привыкла править одна, а у партнёра свои спонсоры, свои региональные бароны и долгая память о том, кто кого и когда не пустил в эфир. Держит союз только арифметика: без него не проходит ни один закон. Аналитики дают ему год. Самые смелые говорят про полгода."
 ukraine_politics.111.a:0 "Главное - голоса в зале."
 ukraine_politics.120.t:0 "Начало кризиса"
 ukraine_politics.120.d:0 "Служебное событие."
 ukraine_politics.121.t:0 "Шёпот в кулуарах"
 ukraine_politics.121.d:0 "В Раде и в редакциях говорят одно и то же: вокруг Офиса президента работают схемы, о которых не пишут в пресс-релизах. Доказательств пока нет, есть только слухи, анонимные каналы и слишком уверенные улыбки депутатов оппозиции."
 ukraine_politics.121.a:0 "Это грязная кампания против нас."
 ukraine_politics.121.b:0 "Пусть проверят. Нам нечего скрывать."
 ukraine_politics.122.t:0 "Второй звоночек"
 ukraine_politics.122.d:0 "По версии следствия, чиновник среднего звена одного из министерств годами согласовывал контракты с «правильными» фирмами. Сам по себе скандал небольшой, но все понимают: это ниточка, и кто-то уже тянет за неё."
 ukraine_politics.122.a:0 "Отстранить и передать дело в НАБУ."
 ukraine_politics.122.b:0 "Не выносить сор из избы."
 ukraine_politics.123.t:0 "Союзник нервничает"
 ukraine_politics.123.d:0 "В «За будущее» умеют считать. Если слухи правдивы, большой скандал впереди, и тонуть вместе с партией президента союзник не собирается. Его депутаты всё чаще голосуют «по совести», а руководство фракции говорит об «ответственности перед избирателем». Для тех, кто знает этот язык, всё ясно."
 ukraine_politics.123.a:0 "Предложить им больше. Союз нужно удержать."
 ukraine_politics.123.b:0 "Пусть уходят. Мы не будем покупать лояльность."
 ukraine_politics.124.t:0 "Распад союза"
 ukraine_politics.124.d:0 "Заявление выходит в пятницу вечером, когда все журналисты уже в пути домой: «За будущее» покидает союз. Формулировки аккуратные, про «ответственность перед избирателем» и «несогласие с кадровыми решениями». Настоящая причина читается между строк: тонуть вместе с партией президента союзник не собирается и уходит, пока шлюпки ещё есть.\n\nК понедельнику у «Слуги народа» нет рабочего большинства. Каждый закон теперь собирают по голосу, как мозаику, а депутаты-одиночки вдруг выясняют, что их поддержка стоит дороже, чем они думали. Социологи фиксируют падение рейтинга, а в коридорах Рады снова начинают здороваться с оппозицией."
 ukraine_politics.124.a:0 "Значит, будем договариваться с каждым."
 ukraine_politics.125.t:0 "Улица требует перемен"
 ukraine_politics.125.d:0 "На Майдане и в областных центрах выходят люди. Это ещё не революция, но уже не разовая акция: студенты, ветераны, предприниматели и профсоюзы требуют перемен, каждый своих. Президент понимает, что прежняя опора рассыпалась. Впереди выборы, и нужно решить, на кого делать ставку."
 ukraine_politics.125.a:0 "Время выбирать новую опору."

 # Блок 2: фокусы
 UKR_b2_campaign_2024:0 "Кампания 2024"
 UKR_b2_campaign_2024_desc:0 "Союз в Раде распался, на улицах требуют перемен, а до выборов три месяца. Президенту предстоит решить, с кем он идёт на второй срок."
 UKR_b2_veterans_against_oligarchs:0 "Ветераны против олигархов"
 UKR_b2_veterans_against_oligarchs_desc:0 "Ветераны АТО не хотят воевать за чужие заводы. Социальные гарантии, земля ветеранам, союз с профсоюзами - Донбасс как вопрос справедливости, а не только обороны."
 UKR_b2_veteran_councils:0 "Ветеранские советы"
 UKR_b2_veteran_councils_desc:0 "Люди, прошедшие Донбасс с 2014 года, давно не верят ни министерствам, ни партиям. Зато они верят друг другу. Ветеранские советы при областных администрациях, резерв территориальной обороны и место за столом, когда решается судьба армии.\n\nЭто сильная опора: дисциплинированная, уважаемая и готовая выйти на улицу. Вопрос в том, чью сторону она займёт, если однажды правительство сделает что-то, что ей не понравится."
 UKR_b2_transparent_state:0 "Прозрачное государство"
 UKR_b2_transparent_state_desc:0 "Prozorro, открытые реестры, электронные декларации и «Дія», в которой справку можно получить быстрее, чем найти ручку. Каждый человек между гражданином и решением - это ещё одна рука, в которую можно что-то положить. Мы убираем руки.\n\nСтарым кабинетам это не понравится: там годами жили за счёт того, что «бумага ещё не пришла». Зато молодые избиратели и западные партнёры наконец увидят, что реформы - это не только слово из пресс-релиза."
 UKR_b2_loyal_people:0 "Свои люди на местах"
 UKR_b2_loyal_people_desc:0 "Кризис - не время для экспериментов. На ключевые посты идут проверенные люди, решения принимаются быстро и вручную. Эффективно, пока эти люди остаются своими."
 UKR_b2_meet_voters:0 "Встречи с избирателями"
 UKR_b2_meet_voters_desc:0 "Президент едет по стране: заводы, сёла, университеты. Без телесуфлёра и с неудобными вопросами."
 UKR_b2_subordinate_anticorruption:0 "Подчинить антикоррупционные органы"
 UKR_b2_subordinate_anticorruption_desc:0 "НАБУ и САП переходят под контроль генерального прокурора. Официально - ради «единой вертикали расследований» и «исключения дублирования функций». Звучит как скучная административная реформа, и именно поэтому её проводят в пятницу вечером.\n\nНеофициально все понимают, зачем это нужно за три месяца до выборов. Посольства уже готовят «обеспокоенные» заявления, а журналисты-расследователи впервые за много лет чувствуют себя по-настоящему нужными."
 UKR_b2_protect_anticorruption:0 "Защитить независимость НАБУ"
 UKR_b2_protect_anticorruption_desc:0 "Президент публично гарантирует независимость антикоррупционных органов - даже если их расследования приведут в его собственный Офис. Окружение этого не простит."
 UKR_b2_bet_technocrats:0 "Ставка на технократов"
 UKR_b2_bet_technocrats_desc:0 "Команда Михаила Фёдорова, цифровое государство и прозрачность как программа второго срока."
 UKR_b2_bet_left:0 "Ставка на левых"
 UKR_b2_bet_left_desc:0 "Профсоюзы, ветераны и евролевые: социальное государство и давление на олигархов как программа второго срока."
 UKR_b2_bet_oligarchs:0 "Ставка на вертикаль"
 UKR_b2_bet_oligarchs_desc:0 "Крупный бизнес, медиахолдинги и лояльные силовики: устойчивость через договорённости с теми, у кого ресурсы."
 UKR_b2_bet_nationalists:0 "Ставка на националистов"
 UKR_b2_bet_nationalists_desc:0 "Ветеранские советы, территориальная оборона и правый электорат: национальная мобилизация как программа второго срока."
 UKR_rada_2023_digital_tt:0 "Итоги выборов в Раду (популярность партий):\n  «Слуга народа»: §Y43%§!\n  «За будущее»: §Y12%§!\n  «Европейская Солидарность»: §Y15%§!\n  Радикальная партия: §Y9%§!\n  Союз левых сил: §Y5%§!\n  ОП-ЗЖ: §Y5%§!\n  «Свобода»: §Y5%§!\n  «Национальный корпус»: §Y3%§!\n  КПУ: §Y2%§!\n  ПСПУ: §Y1%§!"
 UKR_rada_2023_left_tt:0 "Итоги выборов в Раду (популярность партий):\n  «Слуга народа»: §Y39%§!\n  «За будущее»: §Y10%§!\n  «Европейская Солидарность»: §Y14%§!\n  Радикальная партия: §Y12%§!\n  Союз левых сил: §Y9%§!\n  ОП-ЗЖ: §Y5%§!\n  «Свобода»: §Y5%§!\n  «Национальный корпус»: §Y3%§!\n  КПУ: §Y2%§!\n  ПСПУ: §Y1%§!"
 UKR_rada_2023_order_tt:0 "Итоги выборов в Раду (популярность партий):\n  «Слуга народа»: §Y42%§!\n  «За будущее»: §Y11%§!\n  «Европейская Солидарность»: §Y15%§!\n  Радикальная партия: §Y9%§!\n  Союз левых сил: §Y5%§!\n  ОП-ЗЖ: §Y7%§!\n  «Свобода»: §Y5%§!\n  «Национальный корпус»: §Y3%§!\n  КПУ: §Y2%§!\n  ПСПУ: §Y1%§!"
 UKR_rada_2023_right_tt:0 "Итоги выборов в Раду (популярность партий):\n  «Слуга народа»: §Y38%§!\n  «За будущее»: §Y10%§!\n  «Европейская Солидарность»: §Y17%§!\n  Радикальная партия: §Y9%§!\n  Союз левых сил: §Y5%§!\n  ОП-ЗЖ: §Y5%§!\n  «Свобода»: §Y8%§!\n  «Национальный корпус»: §Y5%§!\n  КПУ: §Y2%§!\n  ПСПУ: §Y1%§!"
 UKR_sn_collapse_loss_tt:0 "«Слуга народа» теряет §R[?UKR_sn_loss|0]%§! популярности. Голоса расходятся по другим партиям."
 UKR_west_trust_crisis:0 "Кризис доверия к Западу"
 UKR_west_trust_crisis_desc:0 "Пока Америка воюет сама с собой, «западный путь» в Украине всё труднее продавать избирателю. Гранты урезаны, партнёры заняты своими пожарами, а вопрос «а где же наши союзники?» звучит на каждом ток-шоу. Первыми это чувствуют партии, которые годами обещали, что Запад всё решит: §Y«Слуга народа»§! и §Y«За будущее»§!."
 UKR_left_consolidation:0 "Левая консолидация"
 UKR_left_consolidation_desc:0 "Профсоюзы, социал-демократы и молодые левые впервые за много лет говорят одним голосом, и этот голос о ценах, зарплатах и тарифах. На их митинги приходят не только студенты с плакатами, но и шахтёры, медсёстры и учителя. Растут §YРадикальная партия§! и §YСоюз левых сил§!."
 UKR_right_turn:0 "Правый поворот"
 UKR_right_turn_desc:0 "«Сначала свои», «сильная армия», «хватит экспериментов». Лозунги, которые вчера звучали только на маршах, сегодня повторяют ведущие вечерних эфиров. Правые не побеждают в спорах, они просто всё время в кадре. Растут §Y«Европейская Солидарность»§! и §Y«Свобода»§!."
 UKR_eggs_scandal:0 "Яйца по 17"
 UKR_eggs_scandal_desc:0 "Страна выучила цену одного армейского яйца лучше, чем курс гривны. Каждый новый мем с золотой курицей стоит §Y«Слуге народа»§! немного доверия. Если скандал расследуют, о нём забудут быстро. Если замнут, он будет всплывать до самых выборов."
 UKR_corridor_rumours:0 "Шёпот в кулуарах"
 UKR_corridor_rumours_desc:0 "Доказательств нет, зато есть анонимные каналы, «источники в Офисе» и депутаты, которые вдруг перестали здороваться в буфете. Слухи ещё не скандал, но §Y«Слуга народа»§! теряет очки каждый день, пока они ходят по Раде."
 UKR_street_demands:0 "Улица требует перемен"
 UKR_street_demands_desc:0 "Палатки на Майдане пока не стоят, но термосы уже носят. Студенты, ветераны, предприниматели и профсоюзы требуют перемен, и у каждого они свои. Пока президент не покажет, на кого опирается, §Y«Слуга народа»§! теряет, а §Y«Европейская Солидарность»§! и §YРадикальная партия§! собирают недовольных."
 UKR_oligarchs_retreating:0 "Олигархат отступает"
 UKR_oligarchs_retreating_desc:0 "Реестр влиятельных лиц заработал, телеканалы теряют хозяев, а в Раде всё меньше депутатов, которые голосуют «как сказали из офиса на Грушевского». Кланы не исчезли: они ушли в тень, переписали активы на родственников и ждут, когда ветер переменится."
 UKR_oligarchs_remnants:0 "Остатки олигархата"
 UKR_oligarchs_remnants_desc:0 "Большие кланы разобраны на части, но старые привычки живут дольше людей. Где-то в области директор всё ещё знает, кому звонить, а областной суд всё ещё решает дело «по-человечески». Ещё немного, и это будет просто коррупция, а не система."
 UKR_pop_communist_p5_tt:0 "КПУ: §G+5%§! популярности"
 UKR_pop_conservative_m1_tt:0 "«Европейская Солидарность»: §R-1%§! популярности"
 UKR_pop_conservative_p1_tt:0 "«Европейская Солидарность»: §G+1%§! популярности"
