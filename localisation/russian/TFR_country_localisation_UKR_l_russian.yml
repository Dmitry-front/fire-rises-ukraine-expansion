# ===== Путь олигархов и вертикали, шаг 1 (PROPOSAL_oligarchs.md) =====
 UKR_ol_vertical:0 "Вертикаль и кланы"
 UKR_ol_vertical_desc:0 "Президент перестаёт делать вид, что окружения не существует. Четыре клана получают места за столом и список ожиданий, а Офис получает право решать, кто и в каком порядке сидит. Это быстрее, чем реформы, и дороже, чем кажется: каждый стул за столом рано или поздно пришлёт счёт."
 UKR_ol_state_partners:0 "Государственные партнёры"
 UKR_ol_state_partners_desc:0 "Телеканалы и сайты крупных холдингов становятся «партнёрами государства» по информационной политике. Оправдание: единая картина войны и кризисов. Цена: пресса зависит от владельца, а владелец теперь ждёт ответной любезности."
 UKR_ol_loyal_security:0 "Лояльные силовики"
 UKR_ol_loyal_security_desc:0 "Кадровые решения в СБУ, Нацгвардии и прокуратуре принимаются по принципу «свой - чужой». Оправдание: в кризис нужны люди, на которых можно положиться. Цена: ведомства лояльны лицам, а не закону, и силовой круг ждёт благодарности."
 UKR_ol_procurement:0 "Закупки через своих"
 UKR_ol_procurement_desc:0 "Оборонные и инфраструктурные заказы уходят подрядчикам из ближнего круга: без долгих тендеров, быстро и с гарантией. Оправдание: армия не ждёт конкурсов. Цена: цифры в отчётах растут быстрее, чем качество на складах, а счёт придёт позже."
 UKR_ol_vertical_tt:0 "Открывает окно §YВертикаль§!, шкалу §YВертикаль и кланы§!, доли и претензии четырёх кланов. Дух §YУправляемый олигархат§! заменяет текущую ступень олигархата. Через несколько дней состоится §Yобед в Офисе§!."
 UKR_ol_vertical_dev_tt:0 "§GВитрина§!: промышленность §G+0.02§!.\n§RПодвал§!: общество §R-0.01§!."
 UKR_ol_partners_dev_tt:0 "§GВитрина§!: стабильность и политсила.\n§RПодвал§!: общество §R-0.02§!."
 UKR_ol_security_dev_tt:0 "§GВитрина§!: стабильность, политсила, скорость мобилизации.\n§RПодвал§!: защита от бедности §R-0.015§!."
 UKR_ol_procurement_dev_tt:0 "§GВитрина§!: военное развитие §G+0.04§!, промышленность §G+0.02§!, скорость производства оружия.\n§RПодвал§!: защита от бедности §R-0.01§!. Не всё из этого будет реальным."
 UKR_ol_claim_priv_up_tt:0 "Претензии §YПривата§! растут, его доля власти тоже."
 UKR_ol_claim_sec_up_tt:0 "Претензии §YСилового круга§! растут, его доля власти тоже."
 UKR_ol_claim_met_sec_up_tt:0 "Растут претензии и доля §YМеталла и энергетики§! и §YСилового круга§!."
 UKR_ol_claim_met_down_tt:0 "Претензии §YМеталла и энергетики§! уменьшаются, его доля власти растёт."
 UKR_ol_claim_priv_down_tt:0 "Претензии §YПривата§! уменьшаются, его доля власти растёт."
 UKR_ol_claim_sec_down_tt:0 "Претензии §YСилового круга§! уменьшаются, его доля власти растёт."
 UKR_ol_claim_met_sec_down_tt:0 "Претензии §YСилового круга§! и §YМеталла и энергетики§! уменьшаются."
 UKR_ol_claims_all_down_tt:0 "Претензии всех четырёх кланов немного уменьшаются."
 UKR_ol_grudge_up_tt:0 "Кланы запомнят это: скрытая §Yобида§! растёт."
 UKR_ol_bop_clans_tt:0 "Шкала §YВертикаль и кланы§! смещается к §YКланам§!."
 UKR_ol_bop_vertical_tt:0 "Шкала §YВертикаль и кланы§! смещается к §YВертикали§!."
 UKR_vp_pay_off_tt:0 "Претензии клана §G-30§!. Шкала немного смещается к §YКланам§!."
 UKR_managed_oligarchy:0 "Управляемый олигархат"
 UKR_managed_oligarchy_desc:0 "Хаос обязательств превратился в систему: кланы знают свои места, а Офис знает, кому звонить. Власти проще, цена та же, просто теперь она расписана по датам. Промышленность растёт, общество и защита от бедности понемногу оседают."
 UKR_state_partners_idea:0 "Государственные партнёры"
 UKR_state_partners_idea_desc:0 "Крупные медиахолдинги ведут информационную политику вместе с государством. Спокойнее в эфире, тише в залах суда, дороже потом."
 UKR_loyal_security_idea:0 "Лояльные силовики"
 UKR_loyal_security_idea_desc:0 "В СБУ, Нацгвардии и прокуратуре на ключевых постах те, кто не задаёт лишних вопросов. Порядок обеспечен, независимость нет."
 UKR_priority_procurement_idea:0 "Приоритетные закупки"
 UKR_priority_procurement_idea_desc:0 "Оружие и снабжение идут через проверенных подрядчиков, быстро и без конкурсов. Цифры в отчётах убедительны; проверять их пока никто не просил."
 UKR_office_yermak:0 "Офис Ермака"
 UKR_office_yermak_desc:0 "Андрей Ермак, глава Офиса президента, решает, кому звонить, кого звать на обед и чьё письмо дойдёт до стола."
 UKR_office_yermak_shadow:0 "Офис в тени"
 UKR_office_yermak_shadow_desc:0 "Ермак формально остаётся в стороне, но звонки по-прежнему идут через его кабинет. Влияние осталось, ответственность нет."
 UKR_office_stefanchuk:0 "Офис Стефанчука"
 UKR_office_stefanchuk_desc:0 "Офис возглавил Руслан Стефанчук: юрист, который умеет оформить любое решение в виде закона."
 UKR_undertow_1:0 "Подводное течение"
 UKR_undertow_1_desc:0 "Скрытый дух: рост оппозиционной платформы."
 UKR_undertow_2:0 "Подводное течение"
 UKR_undertow_2_desc:0 "Скрытый дух: рост оппозиционной платформы."
 UKR_undertow_3:0 "Подводное течение"
 UKR_undertow_3_desc:0 "Скрытый дух: рост оппозиционной платформы."
 UKR_arakhamia_premier:0 "Давид Арахамия"
 UKR_arakhamia_premier_desc:0 "Глава фракции «Слуга народа» в Верховной Раде. Знает каждого депутата по голосованию и каждого министра по телефону."
 UKR_bohdan:0 "Андрей Богдан"
 UKR_bohdan_desc:0 "Адвокат, бывший глава Офиса президента (2019-2020), много лет защищавший интересы Игоря Коломойского."
 UKR_vilkul:0 "Александр Вилкул"
 UKR_vilkul_desc:0 "Политик из Кривого Рога и бывший вице-премьер. Представляет интересы горно-металлургического сектора."
 UKR_vertical_clans_balance:0 "Вертикаль и кланы"
 UKR_vertical_clans_balance_desc:0 "Кто кого держит: президент кланы или кланы президента? Шкала показывает, куда склоняется страна. Услуги кланам смещают её к кланам, давление на них к вертикали. Центр - президент-арбитр: самый устойчивый и самый скромный по результатам режим."
 UKR_bop_clans:0 "Кланы"
 UKR_bop_vertical:0 "Вертикаль"
 UKR_bop_vc_arbiter:0 "Президент-арбитр"
 UKR_bop_vc_clans_lead:0 "Кланы договариваются"
 UKR_bop_vc_clans_dominate:0 "Кланы доминируют"
