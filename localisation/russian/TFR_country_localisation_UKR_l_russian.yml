 UKR_pop_libertarian_socialist_p6_tt:0 "Союз левых сил: §G+6%§! популярности"
 UKR_pop_national_socialist_p1_tt:0 "«Свобода»: §G+1%§! популярности"
 UKR_pop_national_socialist_p2_tt:0 "«Свобода»: §G+2%§! популярности"
 UKR_pop_national_socialist_p3_tt:0 "«Свобода»: §G+3%§! популярности"
 UKR_pop_social_democrat_m1_tt:0 "Радикальная партия: §R-1%§! популярности"
 UKR_pop_social_democrat_p1_tt:0 "Радикальная партия: §G+1%§! популярности"
 UKR_pop_social_democrat_p2_tt:0 "Радикальная партия: §G+2%§! популярности"
 UKR_pop_social_democrat_p3_tt:0 "Радикальная партия: §G+3%§! популярности"
 UKR_pop_social_democrat_p5_tt:0 "Радикальная партия: §G+5%§! популярности"
 UKR_pop_social_liberal_p1_tt:0 "«Слуга народа»: §G+1%§! популярности"
 UKR_pop_social_liberal_p2_tt:0 "«Слуга народа»: §G+2%§! популярности"
 UKR_union_za_maibutnie_tt:0 "«За будущее» входит в правящую коалицию."
 UKR_b2_bet_technocrats_tt:0 "§YКто это:§! команда реформаторов вокруг Юлии Свириденко и Михаила Фёдорова: цифровое государство, открытые реестры, евроинтеграция.\n§YЧего потребуют:§! независимых антикоррупционных органов, прозрачного бюджета и места в кабинете для своих людей.\n§YРиск:§! старые элиты и силовики не любят, когда всё видно."
 UKR_b2_bet_left_tt:0 "§YКто это:§! профсоюзы, «Соціальний рух», левые ветеранские объединения и евролевые депутаты.\n§YЧего потребуют:§! нового трудового кодекса, социальных гарантий и ответа олигархов за приватизацию 90-х.\n§YРиск:§! крупный капитал и Брюссель насторожатся."
 UKR_b2_bet_oligarchs_tt:0 "§YКто это:§! крупный бизнес, медиахолдинги и лояльные силовики.\n§YЧего потребуют:§! неприкосновенности активов, «понимающих» регуляторов и тишины в эфирах.\n§YРиск:§! антикоррупционные органы, улица и европейские партнёры."
 UKR_b2_bet_nationalists_tt:0 "§YКто это:§! ветеранские советы, территориальная оборона и правые партии.\n§YЧего потребуют:§! армии в приоритете бюджета, жёсткой языковой и исторической политики, никаких уступок Москве.\n§YРиск:§! левые, русскоязычные регионы и осторожные западные столицы."
 UKR_b2_bet_hidden_tt:0 "§gПоследствия выбора станут ясны после инаугурации.§!"
 # Блок 2: идеи
 UKR_captured_judiciary:0 "Подконтрольные антикоррупционные органы"
 UKR_captured_judiciary_desc:0 "НАБУ и САП формально работают, фактически - согласовывают. Власти стало проще, партнёрам - тревожнее."
 UKR_eu_aid_frozen:0 "Помощь ЕС заморожена"
 UKR_eu_aid_frozen_desc:0 "Брюссель приостановил транши до восстановления независимости антикоррупционных органов."
 UKR_pillar_organic:0 "Органичный союз"
 UKR_pillar_organic_desc:0 "Новая опора президента - продолжение всего, что он делал раньше. Союзники верят ему, избиратели понимают его."
 UKR_pillar_mismatch_minor:0 "Неожиданный союз"
 UKR_pillar_mismatch_minor_desc:0 "Выбор опоры удивил и сторонников, и противников. Новым союзникам ещё предстоит поверить президенту."
 UKR_pillar_mismatch:0 "Разворот на 180°"
 UKR_pillar_mismatch_desc:0 "Президент опёрся на тех, против кого работал все прошлые годы. Старые сторонники чувствуют себя преданными, новые не доверяют."
 # Блок 2: тултипы
 UKR_yermak_resurfaces_tt:0 "Дело тихо спускают на тормозах. Ермак уходит в тень - но такие люди не исчезают навсегда."
 UKR_yermak_trial_tt:0 "Дело доходит до суда. Решение будет за судьями, а не за Офисом."
 UKR_yermak_resigned_tt:0 "Ермак уходит в отставку. Расследование продолжается без публичного давления."
 # Блок 2: события кампании
 ukraine_politics.200.t:0 "Кампания стартует"
 ukraine_politics.200.d:0 "Новый год начинается с политического вакуума: союза в Раде нет, рейтинги партии власти на дне, а до президентских выборов меньше трёх месяцев. Штаб собирается ночью и расходится под утро с одним выводом: старые лозунги больше не работают, стране нужно показать, на кого президент будет опираться дальше."
 ukraine_politics.200.a:0 "Начинаем."
 ukraine_politics.201.t:0 "Стадион 2.0"
 ukraine_politics.201.d:0 "В 2019 году кандидат Зеленский вызвал Порошенко на дебаты на «Олимпийском», и тот ответил: «Стадион так стадион». Пять лет спустя Порошенко записывает видео на фоне того же стадиона и возвращает вызов: теперь отвечать за результаты придётся действующему президенту. Соцсети в восторге - у всех дежавю."
 ukraine_politics.201.a:0 "Стадион так стадион. Опять."
 ukraine_politics.201.b:0 "Дебаты онлайн - через «Дію», с голосованием зрителей."
 ukraine_politics.201.c:0 "Президент работает, а не выступает на стадионах."
 ukraine_politics.202.t:0 "Армия. Мова. Віра. Досвід."
 ukraine_politics.202.d:0 "Порошенко обновляет свой лозунг 2019 года одним словом - «опыт». Его штаб бьёт по распаду союза, слухам вокруг Офиса и «пяти годам экспериментов». Нужно отвечать, и то, как мы ответим, запомнят."
 ukraine_politics.202.a:0 "Ответить фактами и цифрами."
 ukraine_politics.202.b:0 "Ответить социальными обещаниями."
 ukraine_politics.202.c:0 "Ответить жёстко."
 ukraine_politics.202.e:0 "Перехватить патриотическую повестку."
 ukraine_politics.204.t:0 "НАБУ проверяет контракты"
 ukraine_politics.204.d:0 "По версии СМИ, антикоррупционное бюро собирает материалы по контрактам, связанным с окружением Офиса президента. Официально никто ничего не подтверждает."
 ukraine_politics.204.d_sub:0 "По версии СМИ, антикоррупционное бюро собирало материалы по контрактам, связанным с окружением Офиса президента, но после переподчинения дело «буксует». Журналисты публикуют утечки сами, и каждая новая звучит громче официального молчания."
 ukraine_politics.204.d_prot:0 "По версии СМИ, антикоррупционное бюро собирает материалы по контрактам, связанным с окружением Офиса президента. Президент гарантировал бюро независимость - и теперь это расследование идёт в полную силу."
 ukraine_politics.204.a:0 "Посмотрим, что они найдут."
 ukraine_politics.205.t:0 "Первый тур"
 ukraine_politics.205.d:0 "31 марта. Ровно пять лет назад актёр из «Слуги народа» вышел во второй тур с результатом, которого никто не ожидал. Сегодня никто не удивлён, и в этом главная проблема.\n\nЗеленский снова первый, но без прежнего отрыва: сказываются распад союза, слухи вокруг Офиса и усталость от войны в соседних странах. Порошенко уверенно второй. Его штаб уже празднует «возвращение опыта» и печатает плакаты для второго тура. Остальные кандидаты вместе набирают меньше трети, но именно их избиратели через три недели решат, кто будет президентом."
 ukraine_politics.205.a:0 "Три недели. Работаем без выходных."
 ukraine_politics.206.t:0 "Между турами"
 ukraine_politics.206.d:0 "Штаб делит карту страны на тех, кого ещё можно убедить. Всех сразу не получится: каждое обещание одним отталкивает других."
 ukraine_politics.206.a:0 "Бороться за левых избирателей."
 ukraine_politics.206.b:0 "Бороться за правых избирателей."
 ukraine_politics.206.c:0 "Бороться за молодёжь и IT."
 ukraine_politics.206.e:0 "Бороться за тех, кто хочет порядка."
 ukraine_politics.207.t:0 "Второй тур"
 ukraine_politics.207.d:0 "Страна голосует во второй раз. К полуночи экзитполы готовы, и в штабе наступает тишина."
 ukraine_politics.207.a:0 "Ждём результатов."
 # Блок 2: скандал
 ukraine_politics.300.t:0 "Обыски"
 ukraine_politics.300.d:0 "Через неделю после победы детективы НАБУ приходят с обысками по делу, которое, по версии следствия, связано с главой Офиса президента Андреем Ермаком. Подробности держатся в тайне, но фотографии людей в бронежилетах у знакомых дверей уже облетели все каналы."
 ukraine_politics.300.d_sub:0 "Через неделю после победы, несмотря на переподчинение антикоррупционных органов, детективы НАБУ проводят обыски по делу, которое, по версии следствия, связано с главой Офиса президента Андреем Ермаком. Генпрокуратура пытается забрать дело себе, но фотографии обысков уже облетели все каналы."
 ukraine_politics.300.a:0 "Это удар по всей команде."
 ukraine_politics.301.t:0 "Ермак"
 ukraine_politics.301.d:0 "Андрей Ермак - самый близкий к президенту человек и, по версии следствия, фигурант расследования. Сам он всё отрицает. Защищать его - значит поставить на кон доверие ко второму сроку. Сдать - значит показать окружению, чего стоит верность."
 ukraine_politics.301.a:0 "Мы своих не сдаём."
 ukraine_politics.301.b:0 "Принять отставку."
 ukraine_politics.302.t:0 "Опора выходит на сцену"
 ukraine_politics.302.d:0 "Президент так и не определился, на кого опирается. В разгар скандала за него не вступается никто - ни улица, ни элиты, ни эксперты."
 ukraine_politics.302.d_tech:0 "Команда Михаила Фёдорова публикует открытые данные по контрактам и запускает публичную проверку: всё прозрачно, смотрите сами. Для многих это аргумент - президент, который открывает реестры, не может быть главой схемы."
 ukraine_politics.302.d_left:0 "Профсоюзы и ветеранские объединения выходят с требованием «судить виновных, а не менять курс». Скандал они используют как аргумент против олигархов вокруг власти - и за президента, который обещал с ними бороться."
 ukraine_politics.302.d_olig:0 "Крупнейшие медиахолдинги выстраивают одну линию: «атака на стабильность в трудное время». Сюжеты о скандале уходят в конец выпусков, а в эфир выходят эксперты, которые объясняют, почему сейчас не время раскачивать лодку."
 ukraine_politics.302.d_nat:0 "Ветеранские советы и территориальная оборона выводят людей на акции «Единство важнее скандалов». Их лозунг прост: страна накануне большой угрозы, внутренние войны подождут."
 ukraine_politics.302.a:0 "Опора держит."
 ukraine_politics.303.t:0 "Брюссель реагирует"
 ukraine_politics.303.d:0 "Европейская комиссия выражает «обеспокоенность» и ждёт результатов расследования."
 ukraine_politics.303.d_sub:0 "Европейская комиссия связывает скандал с переподчинением антикоррупционных органов и приостанавливает очередной транш помощи до восстановления их независимости."
 ukraine_politics.303.d_prot:0 "Европейская комиссия отмечает, что расследование идёт без вмешательства власти, и называет это «доказательством зрелости украинских институтов»."
 ukraine_politics.303.a:0 "Принять к сведению."
 ukraine_politics.304.t:0 "Инаугурация"
 ukraine_politics.304.d:0 "Президент второй раз принимает присягу. Рада расколота, скандал не утих, но у власти снова есть опора - и пять лет, чтобы доказать, что выбор был правильным."
 ukraine_politics.304.a:0 "Второй срок начинается."

 # Блок 3: институционалисты-технократы
 UKR_t_svyrydenko_cabinet:0 "Кабинет Свириденко"
 UKR_t_svyrydenko_cabinet_desc:0 "Второй срок начинается с нового правительства. Юлия Свириденко, годами отвечавшая за экономику, становится премьером, а Михаил Фёдоров продолжает цифровую трансформацию. Ставка - на институты, а не на лица."
 UKR_t_diia_system:0 "Дія как система"
 UKR_t_diia_system_desc:0 "«Дія» перестаёт быть приложением и становится способом работы государства. Чем меньше бумаг и кабинетов, тем меньше мест, где можно взять."
 UKR_t_digital_registry:0 "Единый цифровой реестр"
 UKR_t_digital_registry_desc:0 "Все реестры - военнообязанных, недвижимости, бизнеса - сводятся в одну систему. В мирное время это удобство, в войну - скорость."
 UKR_t_e_residency:0 "Э-резидентство"
 UKR_t_e_residency_desc:0 "Иностранные предприниматели регистрируют бизнес в Украине, не приезжая. Налоги платят здесь, работать могут откуда угодно."
 UKR_t_it_export:0 "IT-экспорт"
 UKR_t_it_export_desc:0 "Программисты - самый стабильный экспорт страны. Государство упрощает им жизнь и надеется, что они останутся."
 UKR_t_diia_city_2:0 "Дія.City 2.0"
 UKR_t_diia_city_2_desc:0 "Второе поколение специального режима для технологических компаний: больше резидентов, проще правила, связь с университетами."
 UKR_t_cloud_state:0 "Облачное государство"
 UKR_t_cloud_state_desc:0 "Копии всех государственных реестров хранятся в дата-центрах союзников. Если серверы в Киеве замолчат, государство продолжит работать."
 UKR_t_drone_army:0 "Армия дронов"
 UKR_t_drone_army_desc:0 "Из экспериментов с БПЛА вырастает отдельная система: производители, операторы, школы, закупки через открытые площадки."
 UKR_t_cyber_troops:0 "Кибервойска"
 UKR_t_cyber_troops_desc:0 "Айтишники в погонах и добровольцы из IT-армии получают структуру, командование и задачи."
 UKR_t_digital_mobilization:0 "Цифровая мобилизация"
 UKR_t_digital_mobilization_desc:0 "Повестка приходит в приложение, учёт ведётся онлайн, а военкомат превращается в сервис. Быстрее и честнее - пока работает связь."
 UKR_t_open_state:0 "Открытое государство"
 UKR_t_open_state_desc:0 "Данные - публичны, контракты - открыты, решения - объяснены. Запад аплодирует, журналисты довольны, а противник читает те же реестры."
 UKR_t_digital_control:0 "Цифровой контроль"
 UKR_t_digital_control_desc:0 "Все данные государства работают на скорость решений и безопасность. Эффективно - и тревожно для тех, кто помнит, чем заканчиваются такие системы."
 UKR_t_transparent_budget:0 "Прозрачный бюджет"
 UKR_t_transparent_budget_desc:0 "Каждая гривна бюджета видна онлайн в реальном времени. Воровать становится неудобно."
 UKR_t_estonian_experience:0 "Эстонский опыт"
 UKR_t_estonian_experience_desc:0 "Совместная программа с Эстонией, которая строила цифровое государство, пока остальные спорили о бумажных паспортах."
 UKR_t_algorithms:0 "Алгоритмы вместо чиновников"
 UKR_t_algorithms_desc:0 "Лицензии, пособия и проверки распределяет система. Быстро и без взяток - и без возможности объяснить алгоритму, что он ошибся."
 UKR_t_security_single_window:0 "Единое окно безопасности"
 UKR_t_security_single_window_desc:0 "Данные всех реестров доступны службам безопасности в одном окне. Агентам противника становится тесно. Гражданам - тоже."
 UKR_t_state_without_territory:0 "Государство без территории"
 UKR_t_state_without_territory_desc:0 "Если враг возьмёт столицу, он возьмёт здания, но не государство. Реестры, связь, выплаты и управление продолжат работать из облака."
 UKR_svyrydenko:0 "Юлия Свириденко"
 UKR_fedorov:0 "Михаил Фёдоров"
 UKR_network_dependency:0 "Зависимость от сети"
 UKR_network_dependency_desc:0 "Цифровое государство работает быстро - пока есть электричество и связь. Каждый удар по энергетике теперь бьёт и по управлению страной."
 UKR_digital_registry_idea:0 "Единый цифровой реестр"
 UKR_digital_registry_idea_desc:0 "Все реестры в одной системе: мобилизация и решения идут быстрее."
 UKR_digital_mobilization_idea:0 "Цифровая мобилизация"
 UKR_digital_mobilization_idea_desc:0 "Учёт, повестки и призыв работают онлайн."
 UKR_it_export_idea:0 "IT-экспорт"
 UKR_it_export_idea_desc:0 "Технологический сектор кормит бюджет и науку."
 UKR_drone_army:0 "Армия дронов"
 UKR_drone_army_desc:0 "Разведка, корректировка и удары - силами беспилотников, которые производятся по всей стране."
 UKR_cyber_troops:0 "Кибервойска"
 UKR_cyber_troops_desc:0 "Структурированные киберсилы защищают свои сети и вскрывают чужие."
 UKR_open_state:0 "Открытое государство"
 UKR_open_state_desc:0 "Прозрачность как государственная политика: доверие партнёров растёт, но растёт и уязвимость к утечкам."
 UKR_digital_control:0 "Цифровой контроль"
 UKR_digital_control_desc:0 "Государство видит всё и решает быстро. Общество это чувствует."
 UKR_security_single_window:0 "Единое окно безопасности"
 UKR_security_single_window_desc:0 "Службы безопасности получают доступ ко всем реестрам сразу."
 UKR_eu_reconstruction_fund:0 "Фонд восстановления ЕС"
 UKR_eu_reconstruction_fund_desc:0 "Многолетняя программа Евросоюза: гранты и дешёвые кредиты на восстановление в обмен на выполнение реформ. Каждый транш привязан к конкретному закону."
 UKR_made_in_ukraine:0 "Зроблено в Україні"
 UKR_made_in_ukraine_desc:0 "Национальный кэшбэк и локализация госзакупок поддерживают украинского производителя."
 UKR_svyrydenko_reforms:0 "Реформы кабинета Свириденко"
 UKR_svyrydenko_reforms_desc:0 "Экономические программы правительства: поддержка производителя, кредиты, гранты, дерегуляция и приватизация. Государство не строит заводы само - оно помогает строить другим."
 UKR_sv_made_in_ukraine:0 "«Зроблено в Україні»"
 UKR_sv_made_in_ukraine_desc:0 "Национальный кэшбэк за украинские товары и требования локализации в госзакупках."
 UKR_sv_affordable_loans:0 "Доступные кредиты 5-7-9%"
 UKR_sv_affordable_loans_desc:0 "Государство компенсирует бизнесу проценты по кредитам. Предприятия строятся, долг растёт."
 UKR_sv_own_business_grants:0 "Гранты «Власна справа»"
 UKR_sv_own_business_grants_desc:0 "Микрогранты на открытие своего дела: парикмахерские, пекарни, мастерские - и немного меньше бедности."
 UKR_sv_deregulation:0 "Дерегуляция"
 UKR_sv_deregulation_desc:0 "Сотни разрешений и справок отменяются одним пакетом. Чиновникам - меньше власти, бизнесу - меньше поводов платить."
 UKR_sv_big_privatization:0 "Большая приватизация"
 UKR_sv_big_privatization_desc:0 "Убыточные госпредприятия уходят с молотка. Бюджет получает деньги, профсоюзы - повод для протестов."
 UKR_sv_eu_reconstruction_fund:0 "Фонд восстановления ЕС"
 UKR_sv_eu_reconstruction_fund_desc:0 "По образцу реальной программы Ukraine Facility (2024-2027): деньги Евросоюза на восстановление и модернизацию - но только пока Украина выполняет обещанные реформы. Недоступно, если помощь ЕС заморожена."
 UKR_sv_industrial_parks:0 "Индустриальные парки"
 UKR_sv_industrial_parks_desc:0 "Готовые площадки с дорогами, электричеством и налоговыми льготами для частных инвесторов."
 UKR_cloud_state_tt:0 "Государственные реестры сохранены в дата-центрах союзников."
 UKR_state_without_territory_tt:0 "§YЕсли Киев падёт, удар по стабильности и поддержке войны будет вдвое слабее.§!"
 UKR_state_without_territory_kyiv_tt:0 "Государство продолжает работать из облака: удар смягчён."
 ukraine_politics.400.t:0 "Кабинет Свириденко"
 ukraine_politics.400.d:0 "Новое правительство представлено в Раде. Премьер - Юлия Свириденко, экономист, которая годами вела переговоры с партнёрами и писала программы поддержки бизнеса. Михаил Фёдоров остаётся во главе цифровой трансформации. Журналисты называют кабинет «скучным». В правительстве это считают комплиментом."
 ukraine_politics.400.a:0 "Скучно - значит работает."
 ukraine_politics.401.t:0 "Дія лежит"
 ukraine_politics.401.d:0 "Утром «Дія» не открывается. Не работают выплаты, справки, цифровые паспорта. Через несколько часов выясняется: масштабная кибератака на дата-центр. Страна впервые понимает, насколько она зависит от одного приложения."
 ukraine_politics.401.a:0 "Развернуть резервные серверы за рубежом."
 ukraine_politics.401.b:0 "Переждать и восстановить своими силами."
 ukraine_politics.402.t:0 "Дрон из гаража"
 ukraine_politics.402.d:0 "Трое студентов из Харькова показывают разведывательный дрон, собранный в гараже из деталей робота-пылесоса, старого смартфона и очень большого количества изоленты. Он летает. Он передаёт видео. Он даже возвращается. Военные смеются ровно до первого испытания."
 ukraine_politics.402.a:0 "Дать им грант и открыть производство."
 ukraine_politics.402.b:0 "Передать разработку армии."
 ukraine_politics.403.t:0 "Утечка"
 ukraine_politics.403.d:0 "Часть данных открытого реестра всплывает на анонимном форуме вместе с личными данными чиновников и военных. Открытость государства оказалась открытой не только для граждан."
 ukraine_politics.403.a:0 "Признать ошибку и закрыть уязвимость."
 ukraine_politics.403.b:0 "Это работа российских хакеров."
 ukraine_politics.404.t:0 "Цифровой паноптикум"
 ukraine_politics.404.d:0 "Правозащитники и студенты выходят к Кабмину: «Государство знает о нас больше, чем мы сами». Плакаты с глазом над логотипом «Дії» становятся мемом за один вечер."
 ukraine_politics.404.a:0 "Дать парламенту контроль над данными."
 ukraine_politics.404.b:0 "Безопасность важнее."
 ukraine_politics.405.t:0 "Консерваторы против цифры"
 ukraine_politics.405.d:0 "Священники, сельские громады и пенсионеры жалуются: в отделении больше не принимают бумажные заявления, а до ближайшего компьютера - двадцать километров. Оппозиция называет цифровизацию «государством для молодых и городских»."
 ukraine_politics.405.a:0 "Оставить бумажные услуги для тех, кому они нужны."
 ukraine_politics.405.b:0 "Будущее не ждёт."
 ukraine_politics.406.t:0 "Эстонский опыт"
 ukraine_politics.406.d:0 "Эстонская делегация приезжает в Киев с программой совместного развития электронного управления. Таллинн делится опытом, Киев - масштабом. Обе стороны знают, на чьей границе стоит угроза."
 ukraine_politics.406.a:0 "Цифровые союзники - тоже союзники."
 # Блок 3, левые (DESIGN.md, 8.2)
 UKR_l_left_coalition:0 "Левая коалиция"
 UKR_l_left_coalition_desc:0 "Второй срок держится на левом крыле Рады: социал-демократах, зелёных левых и профсоюзных депутатах. Министром социальной политики и труда становится юрист-трудовик Виталий Дудин из «Соціального руху». Капитал нервничает, а Рада впервые за годы чувствует себя хозяином."
 UKR_l_union_alliance:0 "Союз с профсоюзами"
 UKR_l_union_alliance_desc:0 "Профсоюзы - единственная массовая организация, которая есть в каждом городе и на каждом заводе. Правительство садится с ними за стол как с партнёром, а не как с просителем."
 UKR_l_labour_code:0 "Трудовой кодекс"
 UKR_l_labour_code_desc:0 "Старый кодекс писали ещё при Союзе, проекты новых - под диктовку работодателей. Теперь пишем свой: зарплаты, отпуска, защита от увольнений."
 UKR_l_welfare_state:0 "Социальное государство"
 UKR_l_welfare_state_desc:0 "Пенсии, больницы, школы и жильё - не «расходы», а основа, на которой страна выстоит в войну. Бюджет это почувствует."
 UKR_l_oligarch_audit:0 "Аудит олигархических активов"
 UKR_l_oligarch_audit_desc:0 "Прежде чем что-то забирать, надо знать, что кому принадлежит. Государственный аудит проверяет, как приватизировались заводы, шахты и сети."
 UKR_l_strategic_sectors:0 "Национализация стратегических отраслей"
 UKR_l_strategic_sectors_desc:0 "Металлургия, энергетика, нефть и химия - отрасли, без которых не выстоять в войну. Государство забирает контроль над ними. Владельцы обещают судиться, а Брюссель хмурится."
 UKR_l_cooperative_sector:0 "Кооперативный сектор"
 UKR_l_cooperative_sector_desc:0 "Часть предприятий переходит к трудовым коллективам. Первые годы будут трудными: учиться управлять заводом приходится на ходу."
 UKR_l_army_not_for_oligarchs:0 "Армия не для олигархов"
 UKR_l_army_not_for_oligarchs_desc:0 "Ветераны АТО говорят прямо: воевать за Родину - да, за чужие заводы - нет. Армия получает социальные гарантии, а солдат - понимание, что защищает своё."
 UKR_l_veteran_cooperatives:0 "Ветеранские кооперативы"
 UKR_l_veteran_cooperatives_desc:0 "Ветераны получают землю, мастерские и кредиты, чтобы работать вместе. Кто держал оборону плечом к плечу, тот и дело ведёт так же."
 UKR_l_union_territorial_defense:0 "Профсоюзная тероборона"
 UKR_l_union_territorial_defense_desc:0 "Заводские ячейки теробороны организуются через профсоюзы: люди знают друг друга, знают цеха и знают, что защищать."
 UKR_l_social_democracy:0 "Социал-демократия"
 UKR_l_social_democracy_desc:0 "Путь профсоюзов и социалистов: сильное социальное государство в рамках рыночной экономики, «скандинавская модель» по-украински. Европа это понимает и одобряет."
 UKR_l_self_management:0 "Самоуправление"
 UKR_l_self_management_desc:0 "Путь анархистов и независимых профсоюзов: рабочие советы, кооперативы и самоорганизация на местах. Экономика стартует медленнее, зато общество, которое умеет само себя организовать, трудно сломить."
 UKR_l_orthodox_left:0 "Ортодоксальные левые"
 UKR_l_orthodox_left_desc:0 "Путь радикальных коммунистов: партийная дисциплина, план и твёрдая рука. Быстро и эффективно, но слишком многое в этом языке звучит как из Москвы."
 UKR_l_social_dialogue:0 "Трёхсторонний социальный диалог"
 UKR_l_social_dialogue_desc:0 "Правительство, профсоюзы и работодатели договариваются за одним столом. Рада и Банковая перестают тянуть канат и садятся рядом."
 UKR_l_welfare_economy:0 "Экономика благосостояния"
 UKR_l_welfare_economy_desc:0 "Итог экономических реформ: олигархический капитализм уступает место рыночной экономике с сильными социальными гарантиями."
 UKR_l_workers_councils_focus:0 "Рабочие советы"
 UKR_l_workers_councils_focus_desc:0 "Советы трудовых коллективов получают реальную власть на предприятиях и в громадах. Профсоюзная тероборона становится народной самообороной."
 UKR_l_cooperative_economy:0 "Кооперативная экономика"
 UKR_l_cooperative_economy_desc:0 "Итог экономических реформ: вместо олигархов - трудовые коллективы, вместо холдингов - кооперативы."
 UKR_l_party_line:0 "Партийная линия"
 UKR_l_party_line_desc:0 "Дисциплина превыше дискуссий. Решения принимаются быстро, несогласные уходят. Социалисты недовольны, но их никто не спрашивает."
 UKR_l_gosplan:0 "Госплан 2.0"
 UKR_l_gosplan_desc:0 "Итог экономических реформ: национализированные отрасли сводятся в единый государственный план. Работает быстро - пока работает."
 UKR_l_republic_of_labour:0 "Республика труда"
 UKR_l_republic_of_labour_desc:0 "Олигархическая Украина осталась в прошлом. Страна, которая встречает войну, принадлежит тем, кто работает и воюет. Какой она стала - решил выбранный путь."
 UKR_dudin:0 "Виталий Дудин"
 UKR_capital_flight:0 "Бегство капитала"
 UKR_capital_flight_desc:0 "Инвесторы не любят слово «национализация». Часть денег уходит за границу, стройки замедляются."
 UKR_union_partnership:0 "Партнёрство с профсоюзами"
 UKR_union_partnership_desc:0 "Профсоюзы - партнёры правительства. Забастовки редки, потому что вопросы решаются раньше."
 UKR_welfare_state:0 "Социальное государство"
 UKR_welfare_state_desc:0 "Государство берёт на себя пенсии, здравоохранение и жильё. Дорого, но люди знают, за что держатся."
 UKR_state_sector:0 "Государственный сектор"
 UKR_state_sector_desc:0 "Стратегические отрасли под контролем государства. Производство растёт, партнёры за рубежом насторожены."
 UKR_cooperative_sector:0 "Кооперативный сектор: первые годы"
 UKR_cooperative_sector_desc:0 "Трудовые коллективы учатся управлять предприятиями. Пока больше собраний, чем продукции."
 UKR_cooperative_sector_mature:0 "Кооперативный сектор"
 UKR_cooperative_sector_mature_desc:0 "Кооперативы окрепли: работники знают своё дело и держатся за своё предприятие."
 UKR_army_not_for_oligarchs:0 "Армия не для олигархов"
 UKR_army_not_for_oligarchs_desc:0 "Солдат знает, что защищает свою землю и своих людей, а не чужие активы."
 UKR_veteran_cooperatives:0 "Ветеранские кооперативы"
 UKR_veteran_cooperatives_desc:0 "Ветераны работают вместе и готовы вернуться в строй вместе."
 UKR_union_territorial_defense:0 "Профсоюзная тероборона"
 UKR_union_territorial_defense_desc:0 "Заводские отряды теробороны, организованные через профсоюзы."
 UKR_peoples_self_defense:0 "Народная самооборона"
 UKR_peoples_self_defense_desc:0 "Рабочие советы и громады сами организуют оборону своих городов и заводов."
 UKR_nordic_model:0 "«Скандинавская модель»"
 UKR_nordic_model_desc:0 "Социальное государство, сильные профсоюзы и договорённости вместо конфликтов. В Брюсселе это понимают."
 UKR_workers_councils:0 "Рабочие советы"
 UKR_workers_councils_desc:0 "Решения принимаются снизу. Медленно, зато люди за них держатся."
 UKR_party_discipline:0 "Партийная дисциплина"
 UKR_party_discipline_desc:0 "Твёрдая линия и никаких дискуссий. Эффективно, но партнёры на Западе смотрят с подозрением."
 UKR_red_doubt:0 "«С кем мы воюем?»"
 UKR_red_doubt_desc:0 "Часть левых сомневается, нужно ли воевать с «красной» Россией. Кремлёвская пропаганда подливает масла в огонь."
 UKR_republic_of_labour:0 "Республика труда"
 UKR_republic_of_labour_desc:0 "Страна принадлежит тем, кто работает и воюет."
 UKR_social_contract:0 "Общественный договор"
 UKR_social_contract_desc:0 "Правительство левой коалиции договаривается с профсоюзами, забирает у олигархов стратегические активы и строит социальное государство. Власть делят Рада и Банковая, и шкала показывает, кто сейчас сильнее.

§YЛевые группы в коалиции:§!
Профсоюзы: §Y[?UKR_lf_unions|0]§!
Социалисты: §Y[?UKR_lf_socialists|0]§!
Анархисты: §Y[?UKR_lf_anarchists|0]§!
Радикальные коммунисты: §Y[?UKR_lf_communists|0]§!"
 UKR_lc_collective_agreements:0 "Отраслевые коллективные договоры"
 UKR_lc_collective_agreements_desc:0 "Профсоюзы и работодатели подписывают договоры по отраслям: зарплаты, смены, охрана труда."
 UKR_lc_progressive_tax:0 "Прогрессивный налог"
 UKR_lc_progressive_tax_desc:0 "Плоская шкала уходит в прошлое: кто больше зарабатывает, тот больше и платит. Богатые области недовольны."
 UKR_lc_veteran_housing:0 "Земля и жильё ветеранам АТО"
 UKR_lc_veteran_housing_desc:0 "Обещание, которое давали много лет, наконец выполняется: ветераны получают землю и квартиры."
 UKR_lc_workers_cooperative:0 "Рабочий кооператив на заводе"
 UKR_lc_workers_cooperative_desc:0 "Ещё одно предприятие переходит к трудовому коллективу."
 UKR_lc_nationalize_metinvest:0 "Национализация «Метинвеста» (Ахметов)"
 UKR_lc_nationalize_metinvest_desc:0 "Металлургические комбинаты группы Рината Ахметова переходят под контроль государства. Владелец обещает оспорить решение в международных судах."
 UKR_lc_nationalize_dtek:0 "Национализация ДТЭК (Ахметов)"
 UKR_lc_nationalize_dtek_desc:0 "Электростанции и сети энергетического холдинга Рината Ахметова переходят государству. Тарифы замораживаются, акционеры возмущены."
 UKR_lc_nationalize_ukrnafta:0 "Национализация «Укрнафты» и «Укртатнафты»"
 UKR_lc_nationalize_ukrnafta_desc:0 "Государство забирает полный контроль над нефтедобычей и Кременчугским НПЗ, которыми годами управляли менеджеры группы «Приват». В группе называют это рейдерством."
 UKR_lc_nationalize_ostchem:0 "Национализация азотных заводов и облгазов (Фирташ)"
 UKR_lc_nationalize_ostchem_desc:0 "Химические заводы и региональные газовые сети, связанные с Дмитрием Фирташем, переходят государству. Его юристы готовят иски."
 UKR_lc_nationalize_media:0 "Национализация олигархических телеканалов"
 UKR_lc_nationalize_media_desc:0 "«1+1», «Интер» и каналы StarLightMedia переходят в общественную собственность. Олигархи теряют рупор, а Банковая получает новый. Журналисты встревожены."
 UKR_lc_general_strike:0 "Всеобщая забастовка"
 UKR_lc_general_strike_desc:0 "Профсоюзы выводят людей на улицы, чтобы напомнить Банковой, на ком держится коалиция."
 UKR_lc_presidential_decree:0 "Указ президента"
 UKR_lc_presidential_decree_desc:0 "Офис президента решает вопрос указом, не дожидаясь Рады. Быстро, но союзники это запомнят."
 UKR_left_dualism_balance:0 "Двоевластие: Рада и Банковая"
 UKR_left_dualism_balance_desc:0 "Президент победил, но правит с опорой на левую коалицию в Раде. Кто сильнее - парламент с профсоюзами или Офис президента?"
 UKR_bop_rada:0 "Рада и профсоюзы"
 UKR_bop_bankova:0 "Банковая"
 UKR_bop_compromise:0 "Рабочий компромисс"
 UKR_bop_rada_leads:0 "Рада ведёт"
 UKR_bop_rada_dominates:0 "Парламентское большинство диктует"
 UKR_bop_rada_takes_government:0 "Рада забирает правительство"
 UKR_bop_bankova_leads:0 "Банковая ведёт"
 UKR_bop_bankova_dominates:0 "Вертикаль Офиса президента"
 UKR_bop_coalition_breaking:0 "Коалиция на грани"
 UKR_left_dualism_start_tt:0 "Открывает шкалу §YДвоевластие: Рада и Банковая§!."
 UKR_lf_unions_up_tt:0 "§GПрофсоюзы§! становятся сильнее в коалиции."
 UKR_lf_socialists_up_tt:0 "§GСоциалисты§! становятся сильнее в коалиции."
 UKR_lf_anarchists_up_tt:0 "§GАнархисты§! становятся сильнее в коалиции."
 UKR_lf_communists_up_tt:0 "§GРадикальные коммунисты§! становятся сильнее в коалиции."
 UKR_lf_radicals_up_tt:0 "§GАнархисты§! и §Gрадикальные коммунисты§! становятся сильнее в коалиции."
 UKR_lf_all_down_tt:0 "Все левые группы в коалиции §Rослабевают§!."
 UKR_oligarch_audit_tt:0 "Открывает решения о §Yнационализации§! в окне «Общественный договор»."
 UKR_european_influence_down_tt:0 "Европейское влияние §Rснижается§!."
 UKR_european_influence_up_tt:0 "Европейское влияние §Gрастёт§!."
 UKR_russian_influence_up_tt:0 "Российское влияние §Rрастёт§!."
 UKR_cooperative_sector_tt:0 "Через год кооперативы §Gокрепнут§!."
 UKR_social_democracy_req_tt:0 "Профсоюзы или социалисты - не меньше §Y30§!."
 UKR_self_management_req_tt:0 "Анархисты - не меньше §Y30§!."
 UKR_orthodox_left_req_tt:0 "Радикальные коммунисты - не меньше §Y30§!."
 UKR_general_strike_req_tt:0 "Профсоюзы - не меньше §Y40§!."
 ukraine_politics.500.t:0 "Левая коалиция"
 ukraine_politics.500.d:0 "Новое правительство представлено в Раде. Министерство социальной политики и труда возглавил Виталий Дудин - юрист, годами защищавший работников в судах, один из основателей «Соціального руху». Депутаты левого крыла аплодируют стоя, бизнес-ассоциации пишут открытые письма. Впервые за тридцать лет в правительстве говорят не о «инвестиционном климате», а о зарплатах."
 ukraine_politics.500.a:0 "Время работать."
 ukraine_politics.501.t:0 "Съезд левых сил"
 ukraine_politics.501.d:0 "В киевском Доме профсоюзов собрались все, кто называет себя левыми: функционеры ФПУ в костюмах, социалисты с ноутбуками, анархисты в худи и несколько пожилых коммунистов с красными папками. Договориться обо всём они не смогут никогда. Но правительству нужно решить, чей голос в коалиции будет громче."
 ukraine_politics.501.a:0 "Профсоюзы - наша опора."
 ukraine_politics.501.b:0 "Социалисты пишут программу."
 ukraine_politics.501.c:0 "Анархисты умеют организовывать людей."
 ukraine_politics.501.e:0 "Коммунисты дисциплинированы."
 ukraine_politics.502.t:0 "Трудовой кодекс в Раде"
 ukraine_politics.502.d:0 "Проект нового Трудового кодекса вынесен на голосование. Профсоюзы требуют оставить всё: сорокачасовую неделю, защиту от увольнений, коллективные договоры. Работодатели предупреждают, что бизнес уйдёт в тень. Для голосов нужен компромисс - или решимость."
 ukraine_politics.502.a:0 "Принять кодекс профсоюзов."
 ukraine_politics.502.b:0 "Найти компромисс с бизнесом."
 ukraine_politics.503.t:0 "Имущество ФПУ"
 ukraine_politics.503.d:0 "Журналисты публикуют расследование: по версии СМИ, за последние годы Федерация профсоюзов распродала десятки санаториев, домов отдыха и зданий по ценам ниже рыночных. Глава ФПУ Григорий Осовой называет публикацию атакой на профсоюзное движение. Независимые профсоюзы КВПУ во главе с Михаилом Волынцом требуют аудита. Правительство, которое сделало ставку на профсоюзы, должно выбрать, с кем из них оно разговаривает."
 ukraine_politics.503.a:0 "Реформировать ФПУ вместе с независимыми профсоюзами."
 ukraine_politics.503.b:0 "Договориться с руководством ФПУ."
 ukraine_politics.504.t:0 "Брюссель обеспокоен"
 ukraine_politics.504.d:0 "Еврокомиссия выражает «серьёзную обеспокоенность» национализацией и напоминает о защите инвестиций в соглашении об ассоциации. Европейские левые, напротив, пишут приветственные письма. Посол ЕС просит о встрече «в ближайшее удобное время», то есть завтра утром."
 ukraine_politics.504.a:0 "Объяснить: это временная мера военного времени."
 ukraine_politics.504.b:0 "Наши заводы - наше дело."
 ukraine_politics.505.t:0 "Кооператив избрал директора"
 ukraine_politics.505.d:0 "На первом общем собрании бывшего машиностроительного завода рабочие тайным голосованием избрали директора. Им стал... прежний директор. «Он хотя бы знает, где лежат ключи от склада», - объясняет журналистам сварщик. Директор, тридцать лет проработавший «на хозяина», теперь отчитывается перед цехом и, кажется, впервые за годы доволен."
 ukraine_politics.505.a:0 "Демократия есть демократия."
 ukraine_politics.505.b:0 "Главное - не кто, а как."
 ukraine_politics.506.t:0 "Памятник или профсоюз"
 ukraine_politics.506.d:0 "Институт национальной памяти требует снять советскую мозаику с фасада профсоюзного Дворца культуры: по закону о декоммунизации на ней запрещённая символика. Левые активисты встают живой цепью: мозаику, говорят они, делали рабочие, а не режим. Правые организации обещают прийти «помочь с демонтажем». Кабинету нужно решить до выходных."
 ukraine_politics.506.a:0 "Закон есть закон: снять."
 ukraine_politics.506.b:0 "Закрыть символы и повесить табличку с контекстом."
 ukraine_politics.506.c:0 "Оставить как есть."
 ukraine_politics.507.t:0 "Два призыва"
 ukraine_politics.507.d:0 "Левые и националисты вербуют в одном и том же месте: среди ветеранов АТО и молодых мужчин из промышленных городов. Одни зовут в «батальоны без олигархов», другие - в ветеранские советы. В военкоматах путаница, а в соцсетях - взаимные обвинения. Министерство обороны просит правительство навести порядок."
 ukraine_politics.507.a:0 "Общие ветеранские советы для всех."
 ukraine_politics.507.b:0 "Поддержать левые батальоны."
 ukraine_politics.507.c:0 "Уступить националистам."
 ukraine_politics.508.t:0 "Рада забирает правительство"
 ukraine_politics.508.d:0 "Левое большинство в Раде больше не хочет ждать указов с Банковой. Готов законопроект о переходе к парламентской республике: правительство формирует Рада, президент остаётся гарантом и главнокомандующим. У коалиции достаточно голосов. У президента - последний шанс ответить."
 ukraine_politics.508.a:0 "Пусть страной правит парламент."
 ukraine_politics.508.b:0 "Отстоять полномочия президента."
 ukraine_politics.509.t:0 "Коалиция на грани"
 ukraine_politics.509.d:0 "Левые фракции устали узнавать о решениях правительства из телеграм-каналов Офиса президента. На совместном заявлении подписи профсоюзов, социалистов и даже осторожных социал-демократов: либо Банковая возвращает Раде реальные полномочия, либо коалиции больше нет."
 ukraine_politics.509.a:0 "Уступить Раде."
 ukraine_politics.509.b:0 "Перекупить часть фракции."
 ukraine_politics.510.t:0 "«С кем мы воюем?»"
 ukraine_politics.510.d:0 "Российские телеканалы с восторгом показывают украинских коммунистов: «братская левая Украина скоро поймёт, где её настоящие друзья». Кремлёвская пропаганда работает грубо, но часть радикальных левых начинает спрашивать вслух: стоит ли воевать с Россией, где у власти теперь КПРФ? Армия и ветераны смотрят на правительство с тревогой."
 ukraine_politics.510.a:0 "Мы воюем с агрессором, а не с флагом."
 ukraine_politics.510.b:0 "Жёстко пресечь пораженчество."
 ukraine_politics.511.t:0 "Гуляйполе-фест"
 ukraine_politics.511.d:0 "На родине Нестора Махно проходит первый фестиваль самоуправления. Лекции о кооперативах, ярмарка ремесленников, конкурс бород и реконструированная тачанка, у которой постоянно дежурит полиция. Местные довольны: в городок впервые за годы приехали туристы. Политологи спорят, фестиваль это или партийный съезд."
 ukraine_politics.511.a:0 "Пусть гуляют."
 ukraine_politics.511.b:0 "Лишь бы тачанку не угнали."
 ukraine_politics.512.t:0 "Кооперативы окрепли"
 ukraine_politics.512.d:0 "Служебное событие."
 # Блок 3, левые: повествовательные события 520-534
 ukraine_politics.520.t:0 "Павлоградские шахтёры"
 ukraine_politics.520.d:0 "Горняки Павлограда отказываются подниматься на поверхность, пока им не выплатят долги по зарплате. В шахтёрских посёлках вспоминают июль 1989 года: забастовка, начатая в Кузбассе, за несколько дней охватила весь Донбасс, и сотни тысяч шахтёров впервые открыто потребовали от Москвы не только мыла и зарплат, но и политических перемен. Через два года Советского Союза не стало. С тех пор шахтёрская каска в Украине - символ того, что терпение у людей под землёй не бесконечно."
 ukraine_politics.520.a:0 "Правительство становится посредником."
 ukraine_politics.520.b:0 "Это спор работников и работодателя."
 ukraine_politics.521.t:0 "Криворожсталь: история одной приватизации"
 ukraine_politics.521.d:0 "Профсоюз «АрселорМиттал Кривой Рог» требует индексации зарплат, и телеканалы снова показывают старые кадры. В 2004 году крупнейший металлургический комбинат страны продали консорциуму Рината Ахметова и Виктора Пинчука примерно за 800 миллионов долларов. После Оранжевой революции сделку отменили, и в 2005 году повторный аукцион в прямом эфире выиграла Mittal Steel - уже за 4,8 миллиарда. Для многих украинцев это был первый урок того, сколько на самом деле стоит страна, которую распродают по знакомству."
 ukraine_politics.521.a:0 "Поддержать требования профсоюза."
 ukraine_politics.521.b:0 "Не отпугивать крупнейшего инвестора."
 ukraine_politics.522.t:0 "Махно в учебнике"
 ukraine_politics.522.d:0 "Министерство образования обсуждает новый школьный учебник истории. Спор идёт о Несторе Махно: в советских книгах он был бандитом, в учебниках 1990-х - почти не упоминался. Между тем в 1918-1921 годах его Революционная повстанческая армия контролировала большую часть юга, а в Гуляйполе и окрестностях существовала «вольная территория» с советами и коммунами без государственной власти. Махно воевал то с белыми, то с красными, то с гетманцами, и в конце концов проиграл всем."
 ukraine_politics.522.a:0 "Сложная фигура - пусть школьники спорят."
 ukraine_politics.522.b:0 "Одного абзаца хватит."
 ukraine_politics.523.t:0 "Кухня солидарности"
 ukraine_politics.523.d:0 "В промзоне на окраине Киева анархистский коллектив открыл бесплатную столовую для ветеранов АТО и их семей. Днём здесь кормят, вечером чинят рации и собирают аптечки для тех, кто ещё служит. Над входом - чёрно-красный флаг и надпись «Ні богів, ні панів, ні голодних». Ветераны, которые никогда не читали Кропоткина, приходят сюда за борщом и остаются помогать. Полиция заходила дважды: оба раза съела обед и ушла."
 ukraine_politics.523.a:0 "Хорошее дело не нуждается в разрешении."
 ukraine_politics.524.t:0 "Первомай"
 ukraine_politics.524.d:0 "Первого мая по Крещатику идут профсоюзные колонны с флагами отраслей, социалисты с плакатами о зарплатах и небольшая группа анархистов с барабанами. Праздник родился из чикагской забастовки 1886 года за восьмичасовой рабочий день, в Советском Союзе стал парадом с трибунами, а после 1991 года - днём шашлыков. Впервые за долгое время на марш вышли не только пенсионеры. На соседней улице - встречный пикет правых: «Первомай - советский пережиток»."
 ukraine_politics.524.a:0 "Министры идут в колонне."
 ukraine_politics.524.b:0 "Правительство поздравляет всех, кто работает."
 ukraine_politics.525.t:0 "Заробітчани"
 ukraine_politics.525.d:0 "По оценкам, от трёх до пяти миллионов украинцев работают за границей: на польских стройках, чешских заводах, итальянских кухнях. Они присылают домой больше десяти миллиардов долларов в год - больше, чем вся прямая иностранная инвестиция в страну. Слово «заробітчани» знакомо украинцам ещё с XIX века, когда галицкие крестьяне уезжали на заработки в Канаду и Америку. Министерство социальной политики предлагает программу возвращения: гранты на своё дело и жильё."
 ukraine_politics.525.a:0 "Звать людей домой."
 ukraine_politics.525.b:0 "Переводы из-за границы держат экономику."
 ukraine_politics.526.t:0 "Кооператив против агрохолдинга"
 ukraine_politics.526.d:0 "В Полтавской области фермеры объединили паи в кооператив и отказались продлевать аренду крупному агрохолдингу, который обрабатывает сотни тысяч гектаров по всей стране. Рынок земли открылся только в 2021 году, после двадцати лет моратория, и теперь село решает, кем ему быть: хозяевами или арендодателями. Агрохолдинг предлагает двойную плату за пай. Кооперативу нужны техника и кредит."
 ukraine_politics.526.a:0 "Дать кооперативу льготный кредит."
 ukraine_politics.526.b:0 "Рынок рассудит."
 ukraine_politics.527.t:0 "Левые и память о Голодоморе"
 ukraine_politics.527.d:0 "В четвёртую субботу ноября депутаты левой коалиции приходят к мемориалу жертв Голодомора. Голод 1932-1933 годов стал следствием насильственной коллективизации и изъятия зерна; Украина признала его геноцидом украинского народа в 2006 году. Для украинских левых это не чужая тема: «Соціальний рух» напоминает, что сталинизм уничтожал и крестьян, и тех, кто верил в социализм. Свечи в окнах горят по всей стране."
 ukraine_politics.527.a:0 "Помним."
 ukraine_politics.528.t:0 "«Березіль» и Расстрелянное возрождение"
 ukraine_politics.528.d:0 "Харьковский театр восстанавливает «Мину Мазайло» Николая Кулиша в постановке по записям Леся Курбаса. В 1920-х Курбас и его театр «Березіль» были сердцем украинского авангарда: писатели и режиссёры верили, что революция принесёт и социальную справедливость, и расцвет украинской культуры. В 1937 году Курбаса и Кулиша расстреляли в урочище Сандармох вместе с сотнями других. Это поколение называют Расстрелянным возрождением. На премьере - аншлаг."
 ukraine_politics.528.a:0 "Культура - тоже память."
 ukraine_politics.529.t:0 "Зарплата в конверте"
 ukraine_politics.529.d:0 "Налоговая служба и профсоюзы вместе публикуют исследование: по их оценке, каждый третий работник в стране получает часть зарплаты «в конверте». Работодатель экономит на налогах, работник - на пенсии, которой потом не будет. Этот обычай пережил все реформы с 1990-х годов, когда «чёрная» зарплата была единственным способом выжить. Правительство решает, чем бороться с тенью: пряником или кнутом."
 ukraine_politics.529.a:0 "Амнистия для тех, кто выйдет из тени."
 ukraine_politics.529.b:0 "Проверки на каждом предприятии."
 ukraine_politics.530.t:0 "Курьеры против платформы"
 ukraine_politics.530.d:0 "Курьеры службы доставки в Киеве выключают приложения и выстраивают велосипеды перед офисом компании: тарифы снова урезали, а по договору они не работники, а «партнёры» без отпуска и страховки. В Европе суды уже признают таких курьеров наёмными работниками. Профсоюзы впервые пытаются организовать тех, у кого нет ни цеха, ни начальника смены - только рейтинг в телефоне."
 ukraine_politics.530.a:0 "Закон о платформенной занятости."
 ukraine_politics.530.b:0 "Гибкая работа - это свобода."
 ukraine_politics.531.t:0 "«Будь як Ніна»"
 ukraine_politics.531.d:0 "Медсёстры районных больниц снова выходят на пикеты. Движение медиков «Будь як Ніна», возникшее в 2020 году, требует обещанных зарплат: медицинская реформа перевела больницы на оплату «за пациента», и в маленьких городах денег на персонал не хватает. Медсестра с тридцатилетним стажем получает меньше курьера. Пикеты тихие, но в каждом районном центре."
 ukraine_politics.531.a:0 "Поднять зарплаты медикам."
 ukraine_politics.531.b:0 "Пообещать в следующем бюджете."
 ukraine_politics.532.t:0 "Арсенал, январь 1918-го"
 ukraine_politics.532.d:0 "«Мистецький арсенал» открывает выставку о Январском восстании 1918 года. Рабочие киевского завода «Арсенал» поднялись против Центральной Рады в поддержку наступающих большевиков; восстание подавили Сечевые стрельцы и Вольное казачество, а в те же дни под Крутами погибли студенты, защищавшие Киев. Посетители ходят по залам, где сто лет назад стреляли, и спорят: рабочие против национального правительства - это трагедия классов или трагедия нации?"
 ukraine_politics.532.a:0 "История не бывает простой."
 ukraine_politics.533.t:0 "Последние шахты Волыни"
 ukraine_politics.533.d:0 "Государственные шахты Львовско-Волынского угольного бассейна убыточны десятилетиями: их открыли в 1950-х, и уголь здесь давно дороже импортного. Закрыть их - значит оставить без работы целые города вроде Нововолынска и Червонограда. Европейские партнёры предлагают программу «справедливого перехода»: переобучение шахтёров и новые производства на месте старых шахт. Профсоюз горняков готов говорить, но не о закрытии «с понедельника»."
 ukraine_politics.533.a:0 "Справедливый переход: сначала работа, потом закрытие."
 ukraine_politics.533.b:0 "Закрыть убыточные шахты сейчас."
 ukraine_politics.534.t:0 "Протасов Яр"
 ukraine_politics.534.d:0 "На склонах Протасова Яра в Киеве снова появились строительные заборы. Несколько лет назад жители и активисты - от пенсионеров до анархистов - сорвали здесь строительство высоток, неделями дежуря на склонах, пока суд не отменил разрешения. Теперь у застройщика новые документы. Киев застраивается быстрее, чем успевает обсуждать, и для многих горожан борьба за парк - единственный опыт того, что можно победить деньги."
 ukraine_politics.534.a:0 "Парк остаётся парком."
 ukraine_politics.534.b:0 "Городу нужно жильё."
