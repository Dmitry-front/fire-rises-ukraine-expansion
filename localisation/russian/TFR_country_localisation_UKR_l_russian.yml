 # Стадии усталости - названия
 UKR_FATIGUE_STAGE_0_NAME: "§GНачальное напряжение§!"
 UKR_FATIGUE_STAGE_1_NAME: "§YРастущее утомление§!"
 UKR_FATIGUE_STAGE_2_NAME: "§OСерьёзная усталость§!"
 UKR_FATIGUE_STAGE_3_NAME: "§RКритическая усталость§!"
