 ukraine.852.d:0 "Выплаты по рейсу PS752 приходят."
 #Сессия 9: новые ключи хроники блока 1 и ковида
 ukraine.407.e:0 "Создать рабочую группу с организаторами и перевести услуги ФОПам в «Дію»."
 ukraine.310.e:0 "Расширить список и добавить «зеркала» каналов и посредников-владельцев."
 ukraine.312.f:0 "Договориться, чтобы Коломойский ушёл в тень, а претензии заморозили."
 ukraine.311.e:0 "Заморозить и передать государству активы подозреваемых."
 #Сессия 9: новые ключи хроники блока 1 и ковида
 ukraine.409.t:0 "Надбавки, которые не дошли"
 ukraine.409.d:0 "Через два месяца после решения о доплатах медики начинают рассказывать, что надбавки до 300 процентов в зарплате есть, а на счёте нет: часть больниц получила деньги только за первые недели, часть вовсе ничего, а в бухгалтериях никто толком не понимает, по какому коэффициенту считать. В регионах врачи записывают видеообращения, в Киеве профсоюз медиков напоминает о забастовках, а в Минздраве говорят, что деньги переведены, просто не все туда, куда нужно.\n\nПроблема не в злом умысле, а в том, что обещание дали быстрее, чем придумали схему выплат. Теперь нужно закрыть вопрос, пока недовольство не превратилось в акции перед министерством."
 ukraine.409.a:0 "Выплатить задолженность из резерва и проверить каждую больницу."
 ukraine.409.b:0 "Переложить вину на региональные власти и главных врачей."
 ukraine.409.c:0 "Пообещать разобраться и перейти к следующим вопросам."
 #Сессия 11: путь националистов, блок 1 (малые события)
 ukraine.1010.t:0 "Факельное шествие 1 января"
 ukraine.1010.d:0 "1 января, в день рождения Степана Бандеры, в Киеве по традиции проходит факельное шествие: колонна националистов под флагами «Свободы» идёт по центру города, а во Львове и ещё нескольких городах собираются похожие акции. Колонна не самая большая, но камер хватает, и сюжет о «марше бандеровцев» мгновенно разлетается по российским и польским новостям, каждый раз с новым заголовком.\n\nПолиция может сопроводить колонну и перекрыть движение, как делала всегда, может сослаться на карантин и сократить маршрут, а может сделать вид, что ничего особенного не происходит. Организаторы просят не мешать, соседи просят не провоцировать, большинство горожан смотрит краем глаза и возвращается к оливье. Вопрос в том, кто потом будет объяснять всё это иностранным послам."
 ukraine.1010.a:0 "Сопроводить колонну и обеспечить порядок на маршруте."
 ukraine.1010.b:0 "Сократить маршрут, сославшись на карантинные ограничения."
 ukraine.1010.c:0 "Не вмешиваться: полиция действует по обстановке."
 ukraine.1011.t:0 "Вирус против нации"
 ukraine.1011.d:0 "С апреля в соцсетях и закрытых группах расходится слух, что вирус появился не случайно, что он особенно опасен для украинцев, а карантин нужен, чтобы ослабить страну. Тему охотно подхватывают люди и правые сообщества в соцсетях, анонимные каналы добавляют «доказательства» из переведённых роликов и скриншотов, а блогеры собирают просмотры. Почва для слуха давно готова: по опросам, большинство украинцев и без того верит, что вирус создали в лаборатории.\n\nМинздрав просит не паниковать, правые блогеры требуют «своей» повестки, в Офисе спорят, стоит ли отвечать вообще: возразишь - раздуешь, промолчишь - слух превратится в фон. Любой выбор здесь стоит немного, но запоминается надолго."
 ukraine.1011.a:0 "Разобрать слухи с врачами и опубликовать факты через Минздрав."
 ukraine.1011.b:0 "Не реагировать: слух выдохнется сам."
 ukraine.1011.c:0 "Подыграть тревоге: заявить, что государство защитит нацию от любых угроз."
 ukraine.1012.t:0 "Свободу Стерненко"
 ukraine.1012.d:0 "23 февраля Приморский суд Одессы приговаривает Сергея Стерненко, бывшего руководителя одесской ячейки «Правого сектора» и участника Майдана, к семи годам и трём месяцам лишения свободы по делу о похищении человека. Защита называет приговор политическим, сторонники собираются у здания суда и у Офиса президента, лозунг «Свободу Стерненко» расходится по городам, а противники отвечают, что суд не митинг и закон один для всех.\n\nСтерненко известен не только делами в Одессе, но и резкой критикой власти, поэтому каждое слово президента будет прочитано как сигнал. Можно сказать, что решают суд и апелляция, можно напомнить о равенстве перед законом и праве на мирный протест, а можно закулисно поддержать смягчение меры пресечения, и сторонники назовут это уступкой, а противники - вмешательством."
 ukraine.1012.a:0 "Не вмешиваться: решают суд и апелляция."
 ukraine.1012.b:0 "Заявить, что закон один для всех, а мирный протест - право людей."
 ukraine.1012.c:0 "Через депутатов поддержать просьбу о смягчении меры пресечения."
 ukraine.1013.t:0 "Видео из кафе"
 ukraine.1013.d:0 "16 января в силу вступает следующая статья закона о языке: сотрудники кафе, магазинов, салонов и спортклубов обязаны начинать разговор с клиентом по-украински и переходить на другой язык только по его просьбе. Через несколько дней в сети уже ходят ролики, где посетитель и официант выясняют, на каком языке заказывать кофе, под ними тысячи комментариев, а ведущие ток-шоу спорят, кто здесь жертва: человек, которому ответили не на его языке, или официант, которого снимают без спроса.\n\nЯзыковой омбудсмен получает жалобы, а правые активисты предлагают проверять заведения самим. Одни считают, что страна наконец перестаёт стесняться своего языка, другие - что в разгар карантина кафе и без того выживают. Власть может встать на сторону закона, дать время привыкнуть или отшутиться, что кофе от языка не зависит."
 ukraine.1013.a:0 "Поддержать закон и омбудсмена без поблажек."
 ukraine.1013.b:0 "Дать время привыкнуть: сначала объяснять, потом проверять."
 ukraine.1013.c:0 "Отшутиться: кофе от языка не зависит."
 ukraine.1014.t:0 "«Героям слава» на футболке"
 ukraine.1014.d:0 "7 июня Украинская ассоциация футбола показывает форму сборной к чемпионату Европы: на ней контур страны вместе с Крымом и Донбассом и два лозунга, «Слава Украине!» и «Героям слава!». Через день УЕФА требует убрать «Героям слава» как политический лозунг. Россия называет дизайн провокацией, а соцсети делятся на тех, кто видит в словах обычное приветствие, и тех, кто видит в них чужую историю.\n\nСпор о футболке на самом деле спор о том, кого страна называет героями. Этот вопрос вернётся ещё не раз, и ставки будут выше. Пока от власти ждут простого: заявить, что лозунг остаётся, договориться с УЕФА или переложить решение на федерацию."
 ukraine.1014.a:0 "Настоять: лозунг остаётся, пусть УЕФА объясняет."
 ukraine.1014.b:0 "Договориться: оставить «Слава Украине!» и убрать второй лозунг."
 ukraine.1014.c:0 "Передать решение федерации."
