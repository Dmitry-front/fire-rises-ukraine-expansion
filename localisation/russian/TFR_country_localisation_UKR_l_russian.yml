 UKR_pop_conservative_p3_tt:0 "«Европейская Солидарность»: §G+3%§! популярности"
 UKR_pop_libertarian_socialist_p6_tt:0 "Союз левых сил: §G+6%§! популярности"
 UKR_pop_national_socialist_p1_tt:0 "«Свобода»: §G+1%§! популярности"
 UKR_pop_national_socialist_p2_tt:0 "«Свобода»: §G+2%§! популярности"
 UKR_pop_national_socialist_p3_tt:0 "«Свобода»: §G+3%§! популярности"
 UKR_pop_social_democrat_m1_tt:0 "Левый фронт: §R-1%§! популярности"
 UKR_pop_social_democrat_p1_tt:0 "Левый фронт: §G+1%§! популярности"
 UKR_pop_social_democrat_p2_tt:0 "Левый фронт: §G+2%§! популярности"
 UKR_pop_social_democrat_p3_tt:0 "Левый фронт: §G+3%§! популярности"
 UKR_pop_social_democrat_p5_tt:0 "Левый фронт: §G+5%§! популярности"
 UKR_pop_social_liberal_p1_tt:0 "«Слуга народа»: §G+1%§! популярности"
 UKR_pop_social_liberal_p2_tt:0 "«Слуга народа»: §G+2%§! популярности"
 UKR_pop_social_liberal_p3_tt:0 "«Слуга народа»: §G+3%§! популярности"
 UKR_pop_social_liberal_m2_tt:0 "«Слуга народа»: §R-2%§! популярности"
 UKR_union_za_maibutnie_tt:0 "«За будущее» входит в правящую коалицию."
 UKR_b2_bet_technocrats_tt:0 "§YКто это:§! команда реформаторов вокруг Юлии Свириденко и Михаила Фёдорова: цифровое государство, открытые реестры, евроинтеграция.\n§YЧего потребуют:§! независимых антикоррупционных органов, прозрачного бюджета и места в кабинете для своих людей.\n§YРиск:§! старые элиты и силовики не любят, когда всё видно."
 UKR_b2_bet_left_tt:0 "§YКто это:§! профсоюзы, «Соціальний рух», левые ветеранские объединения и евролевые депутаты.\n§YЧего потребуют:§! нового трудового кодекса, социальных гарантий и ответа олигархов за приватизацию 90-х.\n§YРиск:§! крупный капитал и Брюссель насторожатся.\n§YДля президента:§! это не идеология, а способ сохранить власть, возглавив левую повестку раньше других."
 UKR_b2_bet_oligarchs_tt:0 "§YКто это:§! крупный бизнес, медиахолдинги и лояльные силовики.\n§YЧего потребуют:§! неприкосновенности активов, «понимающих» регуляторов и тишины в эфирах.\n§YРиск:§! антикоррупционные органы, улица и европейские партнёры."
 UKR_b2_bet_nationalists_tt:0 "§YКто это:§! ветеранские советы, территориальная оборона и правые партии.\n§YЧего потребуют:§! армии в приоритете бюджета, жёсткой языковой и исторической политики, никаких уступок Москве.\n§YРиск:§! левые, русскоязычные регионы и осторожные западные столицы."
 UKR_b2_bet_hidden_tt:0 "§gПоследствия выбора станут ясны после инаугурации.§!"
 # Блок 2: идеи
 UKR_captured_judiciary:0 "Подконтрольные антикоррупционные органы"
 UKR_captured_judiciary_desc:0 "НАБУ и САП формально работают, фактически - согласовывают. Власти стало проще, партнёрам - тревожнее."
 UKR_eu_aid_frozen:0 "Помощь ЕС заморожена"
 UKR_eu_aid_frozen_desc:0 "Брюссель приостановил транши до восстановления независимости антикоррупционных органов. Пока транши заморожены, стабильность понемногу утекает каждую неделю, а рейтинг партии власти тянет её вниз. «Слуга народа» теряет, «Европейская Солидарность» подбирает сторонников европейского курса."
 UKR_pillar_organic:0 "Органичный союз"
 UKR_pillar_organic_desc:0 "Новая опора президента - продолжение всего, что он делал раньше. Союзники верят ему, избиратели понимают его. Уверенность опоры понемногу укрепляет стабильность каждую неделю."
 UKR_pillar_mismatch_minor:0 "Неожиданный союз"
 UKR_pillar_mismatch_minor_desc:0 "Выбор опоры удивил и сторонников, и противников. Новым союзникам ещё предстоит поверить президенту. Недоверие понемногу точит стабильность каждую неделю, а рейтинг партии власти тянет её вниз."
 UKR_pillar_mismatch:0 "Разворот на 180°"
 UKR_pillar_mismatch_desc:0 "Президент опёрся на тех, против кого работал все прошлые годы. Старые сторонники чувствуют себя преданными, новые не доверяют. Каждую неделю стабильность понемногу уходит вместе с доверием прежних сторонников, а рейтинг партии власти тянет её вниз."
 # Блок 2: тултипы
 UKR_yermak_resurfaces_tt:0 "Дело тихо спускают на тормозах. Ермак уходит в тень - но такие люди не исчезают навсегда."
 UKR_yermak_trial_tt:0 "Дело доходит до суда. Решение будет за судьями, а не за Офисом."
 UKR_yermak_resigned_tt:0 "Ермак уходит в отставку. Расследование продолжается без публичного давления."
 # Блок 2: события кампании
 ukraine_politics.200.t:0 "Кампания стартует"
 ukraine_politics.200.d:0 "Новый год начинается с политического вакуума. Союза в Раде нет, рейтинги партии власти на дне, а до президентских выборов меньше трёх месяцев. Оливье ещё не доеден, а штаб уже собирается на ночное совещание.\n\nРасходятся под утро, с красными глазами и одним выводом: старые лозунги больше не работают. «Новые лица» постарели, «слуга народа» стал властью, а стране нужно показать, на кого президент будет опираться дальше. Кампания стартует."
 ukraine_politics.200.a:0 "Начинаем. Кофе на всех."
 ukraine_politics.201.t:0 "Стадион 2.0"
 ukraine_politics.201.d:0 "В 2019 году кандидат Зеленский вызвал Порошенко на дебаты на «Олимпийском», и тот ответил: «Стадион так стадион». Пять лет спустя история делает круг.\n\nПорошенко записывает видео на фоне того же стадиона и возвращает вызов: теперь отвечать за результаты придётся действующему президенту. Соцсети в восторге, у всех дежавю, а администрация стадиона осторожно интересуется, кто в этот раз платит за аренду."
 ukraine_politics.201.a:0 "Стадион так стадион. Опять."
 ukraine_politics.201.b:0 "Дебаты онлайн - через «Дію», с голосованием зрителей."
 ukraine_politics.201.c:0 "Президент работает, а не выступает на стадионах."
 ukraine_politics.202.t:0 "Армия. Мова. Віра. Досвід."
 ukraine_politics.202.d:0 "Штаб Порошенко обновляет старый лозунг 2019 года одним словом: к армии, мове и вере добавляется «досвід», опыт. Билборды появляются за одну ночь, и на каждом один и тот же подтекст: «мы уже умели управлять, а вы пять лет учились».\n\nУдар точный: распад союза, слухи вокруг Офиса, «пять лет экспериментов». Молчать нельзя, а то, как мы ответим, запомнят надолго. В штабе спорят, отвечать ли по существу или так, чтобы это стало мемом."
 ukraine_politics.202.a:0 "Ответить фактами и цифрами."
 ukraine_politics.202.b:0 "Ответить социальными обещаниями."
 ukraine_politics.202.c:0 "Ответить жёстко."
 ukraine_politics.202.e:0 "Перехватить патриотическую повестку."
 ukraine_politics.204.t:0 "НАБУ проверяет контракты"
 ukraine_politics.204.d:0 "По версии СМИ, антикоррупционное бюро собирает материалы по контрактам, связанным с окружением Офиса президента. Официально никто ничего не подтверждает. Неофициально все знают, в каких кабинетах уже вторую неделю не выключают шредеры.\n\nЖурналисты-расследователи дежурят у здания НАБУ, а в кулуарах Рады делают ставки: успеют ли детективы до выборов."
 ukraine_politics.204.d_sub:0 "По версии СМИ, антикоррупционное бюро собирало материалы по контрактам, связанным с окружением Офиса президента, но после переподчинения дело «буксует». Детективов переводят на другие дела, папки уезжают в Генпрокуратуру.\n\nЖурналисты публикуют утечки сами, и каждая новая звучит громче официального молчания. Послы западных стран всё чаще произносят слово «обеспокоенность», и произносят его всё медленнее."
 ukraine_politics.204.d_prot:0 "По версии СМИ, антикоррупционное бюро собирает материалы по контрактам, связанным с окружением Офиса президента. Президент гарантировал бюро независимость, и теперь это расследование идёт в полную силу.\n\nОкружение президента смотрит на него так, будто он подписал себе приговор. Западные партнёры смотрят так, будто впервые увидели настоящего реформатора. Кто из них прав, скоро станет ясно."
 ukraine_politics.204.a:0 "Посмотрим, что они найдут."
 ukraine_politics.208.t:0 "Регистрация кандидатов"
 ukraine_politics.208.d:0 "Центральная избирательная комиссия принимает документы от кандидатов, и очередь у здания длиннее, чем за справкой в «Дії» в первый день её запуска. Залог для кандидата измеряется миллионами гривен, но желающих всё равно десятки: кто-то хочет в президенты, кто-то в телеэфир, а кто-то просто мечтает, чтобы его фамилия оказалась в бюллетене рядом с известной.\n\nСреди заявителей есть люди с очень знакомыми фамилиями и очень странными программами. В Офисе президента отлично знают, зачем нужны «технические» кандидаты: они делят голоса и портят карту. Вопрос лишь в том, чья это карта и кто ей воспользуется."
 ukraine_politics.208.a:0 "Не вмешиваться. Пусть избиратели разбираются в списке сами."
 ukraine_politics.208.b:0 "Тихо поддержать нескольких «технических» кандидатов в регионах оппозиции."
 ukraine_politics.208.c:0 "Предложить закон против кандидатов-двойников: схожие фамилии на бюллетене запретить."
 ukraine_politics.209.t:0 "Что запомнили после дебатов"
 ukraine_politics.209.d_accept:0 "Вчера «Олимпийский» собрал столько людей, что рекламные щиты у метро жаловались на конкуренцию. Дебаты шли почти три часа: Порошенко напоминал о распаде союза и «яйцах по 17», президент отвечал цифрами по бюджету и просил не путать кампанию с телешоу.\n\nПобедителя не назвал никто, но соцсети уже выбрали лидера: мем, где оба кандидата стоят на пустой трибуне и спорят, кому из них принадлежит пустота. В штабе считают, что стадион сыграл на руку тому, кто был готов к вопросам, и теперь нужно решить, на чём строить следующие недели."
 ukraine_politics.209.d_online:0 "Дебаты через «Дію» собрали три миллиона зрителей и один технический сбой, который длился ровно столько, чтобы все успели его обсудить. Оппозиция сравнила формат с ток-шоу с кнопками, а сторонники президента назвали его первой честной трибуной страны. Зрители голосовали смартфонами и потом спорили, что именно они нажимали.\n\nОба штаба объявили победу, и оба правы: цифры в приложении можно прочитать так, как нужно. В Офисе довольны другим: молодые избиратели впервые за кампанию досмотрели политический эфир до конца."
 ukraine_politics.209.d_refuse:0 "Президент не вышел на «Олимпийский», но стадион всё равно собрался: Порошенко выступил один, а его штаб привёз на трибуну пустое кресло для действующего главы государства. Фото кресла облетело все новости, и вопрос «где президент?» за сутки превратился в мем.\n\nВ Офисе уверяют, что глава государства работал, и это правда: на фотографиях из кабинета видны стопка документов и очень усталое лицо. Но избиратель смотрит не на документы, а на кресло, и в штабе это уже поняли."
 ukraine_politics.209.d:0 "Дебаты остались позади, и штаб подводит итоги. Что запомнили избиратели, станет ясно по ближайшим опросам: пока лидеры спорят о цифрах, рейтинги честно показывают, кому поверили.\n\nУ каждого штаба своя версия того, что произошло, и у каждой есть график. Задача на ближайшие недели проста: не дать оппоненту написать итоги за нас."
 ukraine_politics.209.a:0 "Сделать упор на результаты первого срока."
 ukraine_politics.209.b:0 "Сделать упор на будущее: что получат люди во втором сроке."
 ukraine_politics.209.c:0 "Не комментировать итоги и вернуться к работе."
 ukraine_politics.210.t:0 "Диалог с Москвой"
 ukraine_politics.210.d:0 "Юрий Бойко и «Оппозиционная платформа» объявляют, что единственный способ закончить тарифную зиму и затянувшуюся паузу в отношениях с соседом - прямой диалог с Москвой. Лозунг короткий, слова «мир» и «газ» звучат в каждом втором предложении, а в опросах на юго-востоке это даёт стабильные несколько процентов. Телеканалы, которые вчера пели иначе, внезапно открывают ему эфиры.\n\nДля Офиса это неприятный и очень полезный сюжет одновременно. Неприятный, потому что тема уходит в тарифы и безопасность. Полезный, потому что любой ответ можно использовать: молчание, проверку или публичный спор. Вопрос только в том, чем платить."
 ukraine_politics.210.a:0 "Игнорировать: каждая минута эфира для него работает на нас."
 ukraine_politics.210.b:0 "Попросить СБУ проверить источники финансирования кампании ОП-ЗЖ."
 ukraine_politics.210.c:0 "Предложить публичные дебаты: пусть объяснит, что именно он предлагает Москве."
 ukraine_politics.211.t:0 "Список кандидатов"
 ukraine_politics.211.d:0 "Список кандидатов растёт, и в нём оказывается больше известных фамилий, чем у президента друзей. Виталий Кличко баллотируется на национальном уровне впервые, делает ставку на столичные округа и разговоры о городских проблемах. Дмитрий Разумков, бывший председатель Рады, ведёт кампанию против «вертикали». Ещё десяток кандидатов делит между собой остаток процентов и бесплатное эфирное время.\n\nВ штабе подсчитывают, с кем можно договориться перед вторым туром: никто из них не пройдёт, но голоса их избирателей могут оказаться решающими. Договариваться придётся, и чем раньше, тем дешевле."
 ukraine_politics.211.d_spoilers:0 "Список кандидатов растёт, и в нём оказывается больше известных фамилий, чем у президента друзей. Виталий Кличко баллотируется на национальном уровне впервые, делает ставку на столичные округа и разговоры о городских проблемах. Дмитрий Разумков, бывший председатель Рады, ведёт кампанию против «вертикали». Ещё десяток кандидатов делит между собой остаток процентов и бесплатное эфирное время.\n\nЖурналисты уже заметили, что кампании нескольких «технических» кандидатов подозрительно похожи на донорские: одни и те же подрядчики, одни и те же штабы, одни и те же шутки. В Офисе, разумеется, всё отрицают, но телеканалам не нужны доказательства, чтобы поставить вопрос в эфире."
 ukraine_politics.211.a:0 "Начать переговоры с командой Кличко: Киев против Банковой - плохой сюжет."
 ukraine_politics.211.b:0 "Работать с Разумковым: он нас критикует, но не воюет."
 ukraine_politics.211.c:0 "Ни с кем не договариваться: во втором туре все пойдут к нам."
 ukraine_politics.212.t:0 "Е-голосование для диаспоры"
 ukraine_politics.212.d:0 "Министерство цифровой трансформации приносит в Офис презентацию: миллионы украинцев за границей, очереди у посольств по семь часов и пилотный проект голосования через «Дію» с биометрическим подтверждением личности. Звучит красиво. Закон, правда, пока знает только бумажный бюллетень, а оппозиция заранее объясняет, что «Дія» - способ голосовать за тех, кого прислали сверху.\n\nИнициатива может принести голоса диаспоры, где президента поддерживают, а может принести заголовки «власть хочет цифровые выборы». Время ограничено: чтобы закон успел до 31 марта, голосовать в Раде придётся на этой неделе."
 ukraine_politics.212.a:0 "Внести законопроект о пилоте для диаспоры."
 ukraine_politics.212.b:0 "Пока не готовы: больше бумажных участков и консульств."
 ukraine_politics.212.c:0 "Отказаться: только бумага, никаких экспериментов."
 ukraine_politics.213.t:0 "День тишины"
 ukraine_politics.213.d:0 "Накануне второго тура наступает день тишины, но тишины, как обычно, нет: у телеканалов не агитация, а аналитика, в мессенджерах тысячи роликов, а в соцсетях неожиданные опросы. У штаба полно вопросов: кто первым нарушит правила, получит штраф и заголовки, а кто выдержит, получит неловкую паузу в разговоре с избирателем.\n\nМедиахолдинги ждут сигнала: у них есть эфирное время, у штаба нет желания платить штрафы. В Офисе решают, как провести сутки, не нарушая закон и не отдавая эфир оппонентам."
 ukraine_politics.213.a:0 "Договориться с медиахолдингами: нейтральные «аналитические» сюжеты вместо агитации."
 ukraine_politics.213.b:0 "Соблюдать закон о тишине до последней минуты."
 ukraine_politics.213.c:0 "Запустить мемы: они не считаются агитацией, этого суды ещё не решили."
 ukraine_politics.220.t:0 "Съезд ветеранов"
 ukraine_politics.220.d:0 "В Киеве проходит съезд ветеранов АТО, на который впервые приглашены представители профсоюзов и Офис президента. В зале шумно: одни требуют землю и жильё, другие - льготы и санатории, третьи - чтобы чиновники хоть раз пришли без галстука и без слова «оптимизация». Организаторы разложили на столах распечатки: реестр ветеранов, список обещанных квартир и колонку «выполнено», которая вчера была пустой.\n\nДля президента это шанс показать, что интерес к ветеранам не только предвыборный. Политически всё просто: ветеранское сообщество - одна из самых дисциплинированных аудиторий страны, и тот, кто даст ему землю сегодня, получит голоса завтра. Вопрос лишь в том, с чего начать."
 ukraine_politics.220.a:0 "Земельные участки для ветеранов в рамках нового реестра."
 ukraine_politics.220.b:0 "Льготное жильё и ипотека: приоритет ветеранам."
 ukraine_politics.220.c:0 "Общий стол с профсоюзами: ветеранам и работникам - один переговорный формат."
 ukraine_politics.221.t:0 "Форум ветеранских советов"
 ukraine_politics.221.d:0 "В зале форума ветеранов пахнет кофе, формой и принципиальностью. Организаторы - ветеранские советы при областных администрациях, которые уже год добиваются права голоса при назначении командиров территориальной обороны и распределении ветеранских программ. На сцене карта страны с флажками: где какой совет, где чей резерв и чьи люди кому подчиняются.\n\nДля Офиса это возможность получить опору, которую не нужно кормить партийными деньгами: советы дисциплинированы, их слушают в армии, а при них оппозиция внезапно становится осторожнее в выражениях. Но каждое право голоса, переданное советам, потом придётся забирать назад, а вернуть его бывает труднее, чем отдать."
 ukraine_politics.221.a:0 "Дать советам право рекомендовать командиров территориальной обороны."
 ukraine_politics.221.b:0 "Оставить советы консультативными: слушать, но решать самим."
 ukraine_politics.221.c:0 "Передать часть ветеранских программ советам на местах."
 ukraine_politics.222.t:0 "Первая неприятная публикация"
 ukraine_politics.222.d:0 "Реестры открываются, и первое, что находят журналисты, это не шпионские схемы, а закупка лавочек для парков по цене, на которую можно купить небольшую яхту. Данные лежат в открытом доступе, вопросы появляются через час, а министр, чьё ведомство купило лавочки, - через два.\n\nДля президента это точка выбора: «Прозрачное государство» только что сработало против собственной команды. Можно использовать это как доказательство честной системы, а можно тихо замять, пока слово «лавочки» не стало мемом. Оно, впрочем, уже стало."
 ukraine_politics.222.a:0 "Уволить ответственного и опубликовать расследование. Система работает."
 ukraine_politics.222.b:0 "Потребовать вернуть деньги и ограничиться выговором."
 ukraine_politics.222.c:0 "Назвать закупку рыночной и переключить внимание."
 ukraine_politics.223.t:0 "Свои люди подводят"
 ukraine_politics.223.d:0 "Назначенный из «своих» глава области делает то, на что способен любой «свой»: решает проблемы быстро, вручную и по телефону. Через две недели к нему приходит прокуратура с вопросом, откуда у двоюродного брата подряд на ремонт всех мостов региона. Губернатор уверяет, что мосты были в плохом состоянии, и это правда, а ещё что всё прозрачно, и это уже вопрос.\n\nЭто тот самый момент, о котором предупреждали эксперты: система «своих людей» эффективна ровно до первого скандала. Избиратель пока не знает подробностей, но телеканалы уже выбирают заголовок. Решать нужно сегодня."
 ukraine_politics.223.a:0 "Уволить и назначить проверку: «свои» тоже отвечают."
 ukraine_politics.223.b:0 "Прикрыть: подряд законный, а вопросы политические."
 ukraine_politics.223.c:0 "Тихо перевести губернатора на другую должность."
 ukraine_politics.224.t:0 "Неудобный вопрос"
 ukraine_politics.224.d:0 "Встреча с избирателями на Полтавщине. Президент уже ответил на вопросы про тарифы и дороги, когда женщина в первом ряду, учитель на пенсии, встаёт и спрашивает про чиновника с дачей, оформленной на тёщу. Охрана напрягается, помощники ищут нужную фразу, а зал ждёт, потому что весь зал смотрел новости.\n\nОтвет займёт десять секунд, а запомнят его на десять лет. Видеоролик уже у каждого второго в мессенджерах, и в штабе понимают, что это, возможно, самый важный эпизод всей поездки."
 ukraine_politics.224.a:0 "Признать проблему: этим должны заниматься НАБУ и суд, а не мы."
 ukraine_politics.224.b:0 "Ответить с юмором и перевести разговор на дороги."
 ukraine_politics.224.c:0 "Пообещать лично проверить и публиковать отчёт каждый месяц."
 ukraine_politics.225.t:0 "Закон в пятницу вечером"
 ukraine_politics.225.d:0 "Закон о переподчинении НАБУ и САП проходит Раду в пятницу вечером, когда журналисты уже ушли, а депутаты ещё не добрались до аэропорта. К воскресенью у здания бюро собирается первая акция - сотни людей с самодельными плакатами, а к понедельнику послы стран G7 произносят одно и то же слово: «обеспокоены».\n\nВ Офисе это называют технической реформой, но слово «техническая» перестало успокаивать после первого выпуска новостей. Улица ещё небольшая, посольства ещё вежливые, а оппозиция ещё не получила повод. Президенту решать, насколько дорогой окажется эта пятница."
 ukraine_politics.225.a:0 "Встретиться с активистами и объяснить смысл реформы."
 ukraine_politics.225.b:0 "Не менять курс: закон принят, вопрос закрыт."
 ukraine_politics.225.c:0 "Предложить посольствам консультации: закон можно доработать."
 ukraine_politics.226.t:0 "Окружение просит передумать"
 ukraine_politics.226.d:0 "На закрытой встрече в Офисе президенту аккуратно, без лишних слов, объясняют, что гарантия независимости НАБУ - решение красивое, но дорогое. Заместители перечисляют контракты, которые могут стать предметом интереса, и фамилии, которые лучше не упоминать. Один из советников шутит, что независимые органы хороши, пока независимы от других.\n\nЗападные партнёры тем временем звонят с поздравлениями. Президент знает цену обеим сторонам: можно быть любимцем Брюсселя, но одиноким в собственном кабинете, а можно быть неудобным для всех сразу. Решение принято, но объяснять его придётся долго."
 ukraine_politics.226.a:0 "Решение остаётся. Независимость - не предмет торга."
 ukraine_politics.226.b:0 "Дать окружению гарантии: расследования не коснутся ближнего круга."
 ukraine_politics.226.c:0 "Предложить компромисс: регламент для детективов, но без вмешательства в дела."
 #Сессия 11: путь националистов, блок 2 (кампания 2024)
 ukraine_politics.230.t:0 "Единый кандидат правых"
 ukraine_politics.230.d:0 "В январе «Свобода» и Национальный корпус обсуждают, идти ли на президентские выборы одним кандидатом. В 2019 году общий список правых набрал чуть больше двух процентов, а взаимные упрёки с тех пор не закончились: каждая сторона считает другую недостаточно правой и уверена, что именно её лидер должен стоять в бюллетене первым. Бюллетень, впрочем, один.\n\nОфис президента наблюдает с интересом: единый правый кандидат отнимет голоса у Порошенко, а раздробленные правые отнимут их у всех понемногу. Помочь договориться можно через общих знакомых, помешать - тоже через общих знакомых, а можно ограничиться ролью зрителя и не портить себе репутацию."
 ukraine_politics.230.a:0 "Подтолкнуть правых к единому кандидату через общих знакомых."
 ukraine_politics.230.b:0 "Не вмешиваться: пусть правые решают сами."
 ukraine_politics.230.c:0 "Сыграть на их разногласиях и поддержать спор о лидерстве."
 ukraine_politics.231.t:0 "«В Украине» или «на Украине»"
 ukraine_politics.231.d:0 "Накануне предвыборных дебатов в сети вспыхивает старый спор о предлоге. Иностранный телеканал ставит в титры «на Украине», МИД вежливо пишет редакции, а в лентах появляются словари, лингвисты и вопрос «а вы как говорите, когда едете в Польшу?». Спор неожиданно сближает людей, которые в остальном ни в чём не согласны, и тут же рассорит всех остальных.\n\nВ штабе решают, вмешиваться ли: письмо редакциям выглядит солидно, мем - живо, а законопроект правых о единой норме в официальных текстах обещает громкий заголовок и долгую дискуссию. Избиратели тем временем спрашивают про тарифы и цены, но в ток-шоу про цены не звонят, а про предлог звонят."
 ukraine_politics.231.a:0 "Направить редакциям официальное письмо МИД."
 ukraine_politics.231.b:0 "Отшутиться мемом президентской команды."
 ukraine_politics.231.c:0 "Поддержать законопроект правых о единой норме в официальных текстах."
 ukraine_politics.232.t:0 "«Зрада» или «перемога»"
 ukraine_politics.232.d:0 "Каждый вечер ведущие ток-шоу делят решения власти на «зраду» и «перемогу»: открытая дорога - перемога, отложенный закон - зрада, перенос заседания - зрада с признаками перемоги. Рейтинг передачи растёт быстрее рейтинга любого кандидата, а политики приходят в студию, чтобы заранее узнать, к какой категории отнесут их решения.\n\nШтаб президента понимает, что игнорировать формат нельзя: если не выбрать категорию самому, её выберут за вас. Можно выпустить собственную «перемогу недели», можно признать пару «зрад» и закрыть тему, а можно отвечать одними цифрами и надеяться, что мем устанет первым."
 ukraine_politics.232.a:0 "Выпустить свою «перемогу недели»: дороги, контракты, цифры."
 ukraine_politics.232.b:0 "Публично признать пару «зрад» и закрыть тему."
 ukraine_politics.232.c:0 "Отвечать только цифрами и не вступать в игру."
 ukraine_politics.233.t:0 "Язык в дебатах"
 ukraine_politics.233.d:0 "В финале дебатов ведущий задаёт вопрос о языке: квоты на телевидении, закон о сфере услуг, школы национальных меньшинств на западе. Тема не приносит новых избирателей, но способна потерять старых, и все кандидаты это знают. Венгрия следит за Закарпатьем, Румыния - за Буковиной, а в Харькове и Одессе включают телевизор, чтобы услышать, не забыли ли о них.\n\nМожно держать линию закона без поправок, можно предложить переходный период и поправки для школ меньшинств, а можно уйти от ответа, заявив, что сначала тарифы и безопасность. Любой ответ кто-то услышит как обещание, а кто-то как угрозу."
 ukraine_politics.233.d_enf:0 "В финале дебатов ведущий задаёт вопрос о языке и напоминает, что в январе 2021 года вы поддержали закон и омбудсмена без поблажек. Тема не приносит новых избирателей, но способна потерять старых, и все кандидаты это знают. Венгрия следит за Закарпатьем, Румыния - за Буковиной, а в Харькове и Одессе включают телевизор, чтобы услышать, не забыли ли о них.\n\nМожно подтвердить прежнюю линию, можно предложить переходный период и поправки для школ меньшинств, а можно уйти от ответа, заявив, что сначала тарифы и безопасность. Любой ответ кто-то услышит как обещание, а кто-то как угрозу."
 ukraine_politics.233.d_trans:0 "В финале дебатов ведущий задаёт вопрос о языке и напоминает, что в январе 2021 года вы предложили дать время привыкнуть: сначала объяснять, потом проверять. Тема не приносит новых избирателей, но способна потерять старых, и все кандидаты это знают. Венгрия следит за Закарпатьем, Румыния - за Буковиной, а в Харькове и Одессе включают телевизор, чтобы услышать, не забыли ли о них.\n\nМожно ужесточить линию, можно закрепить мягкий подход поправками для школ меньшинств, а можно уйти от ответа, заявив, что сначала тарифы и безопасность. Любой ответ кто-то услышит как обещание, а кто-то как угрозу."
 ukraine_politics.233.a:0 "Закон не обсуждается: язык - основа государства."
 ukraine_politics.233.b:0 "Предложить поправки: переходный период для школ меньшинств."
 ukraine_politics.233.c:0 "Уйти от вопроса: сначала тарифы и безопасность."
 ukraine_politics.234.t:0 "Ветеранский форум"
 ukraine_politics.234.d:0 "Между турами ветеранские организации проводят форум в Киеве. На сцене участники АТО, военные волонтёры, медики, в первом ряду лидер Национального корпуса Андрей Билецкий, который говорит коротко и по делу: ветеранам нужны права, а не благодарности. Зал аплодирует стоя, камеры показывают президентскую делегацию в центре зала, и каждый её жест будет прочитан как политический сигнал.\n\nДля лидера Национального корпуса удобна любая реакция: рукопожатие подтвердит его статус, дистанция укрепит роль оппозиции, а отсутствие даст повод для обиды. Но избиратели второго тура смотрят не на него, а на то, как будущий президент ведёт себя перед людьми, которые воевали."
 ukraine_politics.234.a:0 "Пожать руку и публично поблагодарить ветеранов."
 ukraine_politics.234.b:0 "Выступить о правах ветеранов и не касаться политических лозунгов."
 ukraine_politics.234.c:0 "Прислать министра: президент занят."
 UKR_right_unity_push:0 "Правые ищут единого кандидата"
 UKR_right_unity_push_desc:0 "Правое поле шевелится: «Свобода» и Национальный корпус примеряют общую вывеску. Центр теряет немного, правые немного набирают, всем нервно. Чем увереннее страна шла к национальной повестке, тем громче объединение. Стабильность чуть падает каждую неделю."
 UKR_language_dispute:0 "Языковой спор"
 UKR_language_dispute_desc:0 "После дебатов о языке спорят в студиях и в кафе: тема объединяет одних и пугает других. Пока спор не уляжется, стабильность понемногу падает каждую неделю. Растёт «Свобода», «Слуга народа» теряет часть русскоязычных избирателей."
 UKR_veteran_spotlight:0 "Ветераны в центре внимания"
 UKR_veteran_spotlight_desc:0 "Рукопожатие на форуме запомнили. Ветеранские организации просят обещанного, а призывники смотрят на них новыми глазами. Пока ветераны в кадре, поддержка войны понемногу растёт каждую неделю. Ветеранская повестка работает на правых: растут «Свобода» и Национальный корпус."
 #Сессия 11: путь националистов, блок 3, шаг 1 (каркас)
 UKR_np_convent:0 "Национальный конвент"
 UKR_np_convent_desc:0 "Национал-демократы и ветераны, «Азовское движение», «Свобода» и улица собираются в одном зале и в одном чате. Вопрос один: кому принадлежит государство и чья программа ляжет в основу второго срока. Программу выберет президент, а вот власть придётся делить с каждой из групп."
 UKR_np_veteran_councils:0 "Ветеранские советы"
 UKR_np_veteran_councils_desc:0 "Ветеранские организации получают места в областных и городских советах и право голоса при распределении земли, жилья и льгот. Это дешёвый способ превратить недовольство в статус, а вооружённую улицу в общественный совет, если хватит терпения."
 UKR_np_memory_institutes:0 "Институты памяти"
 UKR_np_memory_institutes_desc:0 "Институт национальной памяти получает больше средств и больше работы: музеи, образовательные программы, мемориальные недели, архивы. Память становится государственным проектом, а значит, предметом спора о том, чья она."
 UKR_np_heroes_upa:0 "Герои УПА"
 UKR_np_heroes_upa_desc:0 "Государство официально признаёт борцов за независимость XX века и их командиров: памятники, улицы, государственные церемонии. Радикалы довольны, соседи нервничают, а историки напоминают, что у каждой страны свои герои и не все они одинаково приятны другим."
 UKR_np_heroes_present:0 "Герои нашего времени"
 UKR_np_heroes_present_desc:0 "Государство создаёт канон из тех, кто погиб на Майдане, в АТО и в других боях последних лет: пантеон, закон о почитании, стены памяти. Новые герои знакомы по именам, но радикалы спросят, куда делись предки."
 UKR_np_convent_tt:0 "Открывает окно §YСовет нации§!, шкалу §YНация: гражданская или этническая§! и доли власти четырёх групп. Через несколько дней конвент выберет §Yпрограмму§!."
 UKR_nation_council:0 "Совет нации"
 UKR_nation_council_desc:0 "Совет нации объединяет четыре группы, которые каждый день спорят, кто из них настоящий. Решения окна двигают шкалу «Нация: гражданская или этническая» и доли влияния групп.\n\n§YДоли власти:§!\nНационал-демократы и ветераны: §Y[?UKR_np_demo_pct|0]%§!\n«Азовское движение»: §Y[?UKR_np_azov_pct|0]%§!\n«Свобода»: §Y[?UKR_np_svoboda_pct|0]%§!\nУлица: §Y[?UKR_np_street_pct|0]%§!"
 UKR_nc_veteran_council:0 "Ветеранский совет"
 UKR_nc_veteran_council_desc:0 "Собрать ветеранов из всех областей: выслушать, пообещать и немного починить то, что обещали раньше. Дешёвый способ получить политсилу и два месяца подъёма призыва."
 UKR_nc_memorial_week:0 "Мемориальная неделя"
 UKR_nc_memorial_week_desc:0 "Неделя церемоний, выставок и школьных уроков памяти. Поддержка войны и стабильность поднимаются, а историки готовят комментарии."
 UKR_nc_plast_camp:0 "Лагерь «Пласта»"
 UKR_nc_plast_camp_desc:0 "Летний лагерь для подростков: палатки, песни, оказание первой помощи и немного военной подготовки. Резерв и общество получают пользу, шкала смещается к гражданской нации."
 UKR_nc_calm_street:0 "Переговоры с улицей"
 UKR_nc_calm_street_desc:0 "Тихие встречи с организаторами акций, ультрас и лидерами малых групп. Улица теряет часть влияния, партнёры спокойнее, радикалы запомнят, кто их «успокаивал»."
 UKR_nc_national_rally:0 "Национальное вече"
 UKR_nc_national_rally_desc:0 "Большой митинг с флагами, песнями и речами. Политсила и поддержка войны растут сразу, а шкала смещается к этнической нации, и «улица» становится сильнее."
 UKR_np_civic_ethnic_balance:0 "Нация: гражданская или этническая"
 UKR_np_civic_ethnic_balance_desc:0 "Кому принадлежит государство: тем, кто служит, или тем, кто родился и говорит на языке? Шкала показывает, куда склоняется страна."
 UKR_bop_np_civic:0 "Гражданская нация"
 UKR_bop_np_ethnic:0 "Этническая нация"
 UKR_bop_np_compromise:0 "Национальный компромисс"
 UKR_bop_np_civic_leads:0 "Служба важнее происхождения"
 UKR_bop_np_civic_dominates:0 "Гражданство по службе"
 UKR_bop_np_civic_edge:0 "Служба засчитана всем"
 UKR_bop_np_ethnic_leads:0 "Язык и происхождение в приоритете"
 UKR_bop_np_ethnic_dominates:0 "Нация по крови и языку"
 UKR_bop_np_ethnic_edge:0 "Улица вышла из-под контроля"
 ukraine_politics.700.t:0 "Национальный конвент"
 ukraine_politics.700.d:0 "Конвент собирается в одном из киевских залов, и по рядам сразу видно, кто здесь кто: национал-демократы и ветераны сидят с блокнотами, «Азовское движение» стоит у стены ровной шеренгой, «Свобода» занимает первый ряд с флагами, а улица устроилась на балконе с телефонами. Каждая группа принесла собственный проект программы и готова защищать его до последней запятой регламента.\n\nПрезидент выбирает программу. «Республика службы» делает гражданином того, кто служит стране, независимо от происхождения и языка. «Армия-нация» превращает военную школу в основу государства. «Рідний дім» ставит в центр язык, происхождение и веру, и обойдётся всех дороже. Андрей Билецкий при любом выборе остаётся министром внутренних дел, но роль у него разная."
 ukraine_politics.700.a:0 "Республика службы: нация - это те, кто служит."
 ukraine_politics.700.b:0 "Армия-нация: армия как школа и каркас государства."
 ukraine_politics.700.c:0 "Рідний дім: язык, происхождение, вера."
 ukraine_politics.701.t:0 "Конвент: делёж власти"
 ukraine_politics.701.d:0 "Программа выбрана, теперь решается, кто и сколько получит. На столе должности в Совете нации, места в наблюдательных советах, финансирование ветеранских организаций и право на первое слово. Каждая группа считает, что достойна большего, чем ей предлагают, а чат конвента второй час обсуждает регламент.\n\nСейчас у национал-демократов и ветеранов §Y[?UKR_np_demo_pct|0]%§! влияния, у «Азовского движения» §Y[?UKR_np_azov_pct|0]%§!, у «Свободы» §Y[?UKR_np_svoboda_pct|0]%§!, у улицы §Y[?UKR_np_street_pct|0]%§!. Можно разделить поровну, можно поставить на главную группу программы, а можно позвать всех и заплатить за мир."
 ukraine_politics.701.a:0 "Паритет: каждой группе по равному куску."
 ukraine_politics.701.b:0 "Власть главной группе программы, остальные обижены."
 ukraine_politics.701.c:0 "Широкая коалиция: должности всем, цена выше."
 ukraine_politics.730.t:0 "Служба засчитана всем"
 ukraine_politics.730.d:0 "Закон о службе начинает действовать на практике: иностранные добровольцы, крымские татары в строю, русскоязычные ветераны из Харькова и Одессы получают то же гражданство и те же права, что и все остальные, кто служил. В правых чатах это называют изменой идее нации, в зарубежных газетах - редким примером гражданского национализма, который не забыл слово «гражданский».\n\nПравые радикалы обижены, ветераны довольны, а Брюссель впервые за долгое время хвалит украинские законы. Но если не придержать шкалу, «Свобода» и улица уйдут в оппозицию к собственному пути."
 ukraine_politics.730.a:0 "Принять: служба - это гражданство."
 ukraine_politics.730.b:0 "Притормозить: спорные пункты оставить на потом."
 ukraine_politics.731.t:0 "Улица вышла из-под контроля"
 ukraine_politics.731.d:0 "Вечером после вече колонна уходит с площади и добирается до торгового центра, где хозяин вывесил меню на русском. Через час в сети уже три версии случившегося, а утром посольства задают вопросы, на которые у МВД нет коротких ответов. Улица почувствовала, что государство на её стороне, и решила не ждать ордеров.\n\nМожно жёстко остановить колонну полицией и Нацгвардией, можно договориться с организаторами и дать им «общественное патрулирование», а можно объявить, что это воля народа. Первое стоит политсилы, второе - доверия партнёров, третье - денег и помощи ЕС."
 ukraine_politics.731.a:0 "Жёстко остановить: полиция и Нацгвардия."
 ukraine_politics.731.b:0 "Договориться об «общественном патрулировании»."
 ukraine_politics.731.c:0 "Объявить это волей народа."
 UKR_np_republic_of_service:0 "Республика службы"
 UKR_np_republic_of_service_desc:0 "Гражданин - тот, кто служит. Ветеранам права и льготы, иностранным легионерам гражданство, а всем остальным вопросы о том, где они были."
 UKR_np_army_nation:0 "Армия-нация"
 UKR_np_army_nation_desc:0 "Армия и ветеранские корпуса - школа и каркас государства. Сильная оборона, слабые гражданские министерства."
 UKR_np_native_home:0 "Рідний дім"
 UKR_np_native_home_desc:0 "Язык, происхождение и вера как основа государства. Внутри сплочённее, снаружи холоднее."
 UKR_np_veterans_integrated:0 "Ветеранские советы вместо дружин"
 UKR_np_veterans_integrated_desc:0 "Бывшие добровольческие батальоны и дружины переходят под ветеранские советы: меньше улицы, больше общественного контроля."
 UKR_national_corps_patronage:0 "Патронаж Национального корпуса"
 UKR_national_corps_patronage_desc:0 "Бывшие добровольческие части встроены в Нацгвардию и армию, выпускники их школ занимают должности в ведомствах. Армия получает кадры, а гражданские власти - ещё одного влиятельного соседа."
 UKR_far_right_legalised:0 "Легализованные правые"
 UKR_far_right_legalised_desc:0 "Правые организации получили официальный статус, доступ к ведомствам и бюджетам. Улица больше не прячется, а государство больше не делает вид, что не замечает."
 UKR_np_boost_veterans:0 "Ветеранский совет работает"
 UKR_np_boost_veterans_desc:0 "Ветераны видят, что к ним прислушиваются, и охотнее зовут молодёжь на службу."
 UKR_np_boost_memorial:0 "Мемориальная неделя"
 UKR_np_boost_memorial_desc:0 "Общая память на несколько недель успокаивает споры и поднимает настроение."
 UKR_np_boost_rally:0 "Эхо национального вече"
 UKR_np_boost_rally_desc:0 "Митинг дал много энергии, и она пока не рассеялась. Часть энергии уйдёт в неприятные истории."
 UKR_biletsky_civic:0 "Андрей Билецкий"
 UKR_biletsky_civic_desc:0 "Основатель «Азова» возглавляет МВД в рамке гражданской программы: ветеранские советы вместо дружин, служба вместо лозунгов. Одни считают, что он повзрослел, другие - что приспособился."
 UKR_biletsky_army:0 "Андрей Билецкий"
 UKR_biletsky_army_desc:0 "Основатель «Азова» руководит МВД как военной школой: ветеранские кадры, жёсткая дисциплина, патронаж над подразделениями, которые считают себя его людьми."
 UKR_biletsky_ethnic:0 "Андрей Билецкий"
 UKR_biletsky_ethnic_desc:0 "Основатель «Азова» в МВД при программе, где его влияние делят со «Свободой» и улицей. Он нужен, но удобен не всем."
 UKR_np_program_civic_tt:0 "Программа: §YРеспублика службы§!. Нация - это те, кто служит. Шкала начинается на гражданской стороне, дух вмешательства ультраправых заменяется ветеранскими советами."
 UKR_np_program_army_tt:0 "Программа: §YАрмия-нация§!. Армия как школа и каркас государства. Шкала в центре, дух вмешательства ультраправых превращается в патронаж Национального корпуса."
 UKR_np_program_ethnic_tt:0 "Программа: §YРідний дім§!. Язык, происхождение, вера. Шкала на этнической стороне, правые организации легализуются. §RЦена выше всех§!."
 UKR_np_biletsky_civic_tt:0 "Андрей Билецкий возглавляет МВД: §Yветеран в гражданской рамке§!."
 UKR_np_biletsky_army_tt:0 "Андрей Билецкий возглавляет МВД: §Yминистерство как военная школа§!."
 UKR_np_biletsky_ethnic_tt:0 "Андрей Билецкий возглавляет МВД: §Yвлияние делят «Свобода» и улица§!."
 UKR_np_demo_up_tt:0 "Влияние §Gнационал-демократов и ветеранов§! растёт."
 UKR_np_demo_down_tt:0 "Влияние §Rнационал-демократов и ветеранов§! падает."
 UKR_np_azov_up_tt:0 "Влияние §G«Азовского движения»§! растёт."
 UKR_np_svoboda_up_tt:0 "Влияние §G«Свободы»§! растёт."
 UKR_np_street_up_tt:0 "Влияние §Rулицы§! растёт."
 UKR_np_street_down_tt:0 "Влияние §Gулицы§! падает."
 UKR_np_lead_group_up_tt:0 "Главная группа программы §Gсильно усиливается§!, остальные §Rобижены§!."
 UKR_np_all_up_tt:0 "Все четыре группы получают §Gдолжности и влияние§!."
 UKR_np_right_groups_down_tt:0 "Влияние §R«Свободы» и улицы§! падает."
 #Сессия 11: путь националистов, блок 3, шаг 2 (ветки программ, решения, герои)
 UKR_np_civic_veterans_law:0 "Закон о ветеранах-гражданах"
 UKR_np_civic_veterans_law_desc:0 "Закон закрепляет, что служба даёт права: льготы на жильё и землю, приоритет при найме на госслужбу, голос в местных советах. Бухгалтеры уже считают, во сколько обойдётся честность."
 UKR_np_civic_service_citizenship:0 "Служба и гражданство"
 UKR_np_civic_service_citizenship_desc:0 "Иностранные добровольцы, крымские татары и русскоязычные ветераны получают гражданство за службу. Правые чаты называют это изменой, зарубежные газеты - редким примером гражданского национализма."
 UKR_np_civic_veteran_credit:0 "Ветеранский кредит"
 UKR_np_civic_veteran_credit_desc:0 "Льготные кредиты и госзаказ для ветеранского малого бизнеса. Ветеран-бариста перестаёт быть мемом и становится налогоплательщиком."
 UKR_np_civic_plast_defense:0 "Лагеря «Пласта» и тероборона"
 UKR_np_civic_plast_defense_desc:0 "Летние лагеря и школьные кружки получают военную подготовку, а территориальная оборона - постоянных наставников. Резерв растёт, родители спорят, не слишком ли много строя в расписании."
 UKR_np_civic_nation_in_ranks:0 "Нация в строю"
 UKR_np_civic_nation_in_ranks_desc:0 "Страна принимает собственную формулу: гражданин - тот, кто служит, и государство обязано ему тем же. Экономика переходит на смешанную модель с ветеранскими преференциями."
 UKR_np_army_school:0 "Корпус-школа"
 UKR_np_army_school_desc:0 "Военные школы при корпусах становятся основой образования: дисциплина, физподготовка, история. Выпускники приходят в ведомства уже с «правильным» взглядом на жизнь, и министерства замечают это не сразу."
 UKR_np_army_artels:0 "Ветеранские артели"
 UKR_np_army_artels_desc:0 "Бывшие бойцы получают госзаказы на ремонт техники, производство беспилотников и снаряжения. Оборонка растёт, а гражданский сектор считает, что его снова обошли."
 UKR_np_army_axis:0 "Ось Балтика - Чёрное море"
 UKR_np_army_axis_desc:0 "Идея Межморья: союз государств от Балтики до Чёрного моря как альтернатива и Москве, и Брюсселю. Варшава и Бухарест слушают, а память о Волыни напоминает, где у союза слабое звено."
 UKR_np_army_arms:0 "Оружие гражданам"
 UKR_np_army_arms_desc:0 "Закон разрешает гражданам оружие по лицензии при службе в резерве. Резерв растёт, а участковые с удивлением обнаруживают, что у соседа теперь тоже есть мнение, и оно заряжено."
 UKR_np_army_final:0 "Армия-нация"
 UKR_np_army_final_desc:0 "Армия становится каркасом государства: школы, артели, резервы и ветеранские советы подчиняются корпусам. Экономика переходит под военный контроль, и вопрос о том, кто управляет страной, становится вопросом звания."
 UKR_np_ethnic_language_school:0 "Язык и школа"
 UKR_np_ethnic_language_school_desc:0 "Все государственные учреждения и школы переходят на украинский, школы меньшинств сохраняются, но с жёсткими требованиями. Закарпатье и Буковина читают новости внимательнее обычного."
 UKR_np_ethnic_church:0 "Единая церковь"
 UKR_np_ethnic_church_desc:0 "Государство поддерживает единую поместную церковь и ограничивает структуры, связанные с Москвой. Для одних это защита страны, для других вмешательство государства в веру."
 UKR_np_ethnic_economy:0 "Национальная экономика"
 UKR_np_ethnic_economy_desc:0 "Пошлины, квоты и приоритет для украинских производителей: импортозамещение вместо открытости. Заводы получают заказы, потребители получают ценники."
 UKR_np_ethnic_citizenship:0 "Закон о гражданстве"
 UKR_np_ethnic_citizenship_desc:0 "Гражданство получают рождённые на территории Украины и этнические украинцы, остальные после десяти лет проживания, экзамена по языку и истории. Правые довольны, соседи нет, а нотариусы получают новую работу."
 UKR_np_ethnic_final:0 "Рідний дім"
 UKR_np_ethnic_final_desc:0 "Государство окончательно определяет себя через язык, происхождение и веру. Внутри больше сплочённости, снаружи меньше друзей, а экономика переходит на корпоративную модель."
 UKR_nc_language_law2:0 "Закон о языке-2"
 UKR_nc_language_law2_desc:0 "Все государственные учреждения и школы работают только на украинском, школы меньшинств остаются, но с жёсткими требованиями. Общество растёт на западе, Венгрия и Румыния пишут ноты."
 UKR_nc_media_quotas:0 "Квоты 90%"
 UKR_nc_media_quotas_desc:0 "Доля украинского в СМИ не ниже девяноста процентов. Политсила растёт, свобода слова обсуждается, а продюсеры ищут способы перемонтировать сериалы."
 UKR_nc_passport_nation:0 "Паспорт нации"
 UKR_nc_passport_nation_desc:0 "В паспорт возвращается графа «национальность». Политсила растёт, стабильность снижается, а правозащитники пишут письма."
 UKR_nc_lustration:0 "Люстрация"
 UKR_nc_lustration_desc:0 "Чиновники и силовики времён прежних режимов проходят проверку. Коррупция отступает на шаг, стабильность проседает, а старая гвардия обижается."
 UKR_nc_rehab_upa:0 "Реабилитация борцов"
 UKR_nc_rehab_upa_desc:0 "Государство закрепляет в законе статус и почитание борцов за независимость XX века. Радикалы довольны, Варшава начинает спор о памяти."
 UKR_nc_visa_russia:0 "Визовый режим с Россией"
 UKR_nc_visa_russia_desc:0 "Для въезда из России вводятся визы. Влияние Москвы ослабевает, поддержка войны растёт, а пограничники привыкают к очередям."
 UKR_nc_no_brussels:0 "Курс без Брюсселя"
 UKR_nc_no_brussels_desc:0 "Киев заявляет, что вступление в ЕС перестаёт быть целью. Политсила и независимость растут, помощь ЕС замораживается. Решение дорогое и почти необратимое."
 UKR_nc_strategic_corps:0 "Стратегические предприятия под корпуса"
 UKR_nc_strategic_corps_desc:0 "Национальный корпус получает право управлять стратегическими предприятиями через ветеранские корпуса. Промышленность и армия растут, олигархи отступают, а министры экономики нервничают."
 UKR_nc_military_schools:0 "Военные школы при корпусах"
 UKR_nc_military_schools_desc:0 "Корпуса открывают новые классы, полигоны и курсы. Армия получает кадры, государство получает расходы."
 UKR_nc_volunteer_corps_status:0 "Статус добровольческих корпусов"
 UKR_nc_volunteer_corps_status_desc:0 "Добровольческим корпусам придаётся официальный статус, финансирование и место в структуре обороны. Резерв растёт, а гражданские чиновники привыкают к новым соседям."
 UKR_nc_service_decree:0 "Указ о гражданстве за службу"
 UKR_nc_service_decree_desc:0 "Тем, кто служил в украинских частях, указ даёт гражданство независимо от происхождения и языка. Добровольцы из других стран приезжают охотнее, правые чаты шумят."
 UKR_nc_tatar_council:0 "Крымскотатарские ветераны в Совете"
 UKR_nc_tatar_council_desc:0 "Ветераны из крымских татар получают места в Совете нации. Гражданская программа получает символ, а ЕС - повод для похвалы."
 UKR_nc_veteran_grants:0 "Ветеранский бизнес: гранты"
 UKR_nc_veteran_grants_desc:0 "Небольшие гранты на открытие дела: мастерская, кофейня, ферма. Каждый грант стоит немного, каждый бизнес приносит чуть больше."
 UKR_np_nation_in_ranks:0 "Нация в строю"
 UKR_np_nation_in_ranks_desc:0 "Гражданин - тот, кто служит, и государство обязано ему тем же. Армия и общество говорят на одном языке."
 UKR_np_army_nation_final:0 "Государство-армия"
 UKR_np_army_nation_final_desc:0 "Корпуса стали каркасом государства: школы, артели и резервы подчиняются единой вертикали. Страна сильна в обороне и слаба в гражданской жизни."
 UKR_np_native_home_final:0 "Дом нации"
 UKR_np_native_home_final_desc:0 "Язык, происхождение и вера определяют государство. Внутри сплочённее, снаружи холоднее, а экономика платит за эту цену."
 UKR_np_import_substitution:0 "Импортозамещение"
 UKR_np_import_substitution_desc:0 "Пошлины и квоты защищают украинских производителей. Заводы загружены, потребители платят."
 ukraine_politics.710.t:0 "Поле Марса: возвращение имён"
 ukraine_politics.710.d:0 "Во Львове на Лычаковском кладбище, на Поле Марса, где лежат стрелки-сечевики, повстанцы и погибшие последних лет, готовится государственная церемония перезахоронения останков бойцов освободительной борьбы XX века. Организаторы пригласили президента, ветеранские организации и потомков. Местные историки спорят об именах, священники - о порядке службы, а чиновники - о том, сколько человек поместится на площадке, чтобы никто не обиделся.\n\nЦеремония станет сигналом: президент может приехать и выступить, прислать делегацию во главе с министром или провести её без политических лозунгов, только военный ритуал и список имён. Радикалы будут смотреть на тон речи, соседи - на слова о памяти, а историки - на всё сразу."
 ukraine_politics.710.a:0 "Приехать и выступить: государство признаёт борцов."
 ukraine_politics.710.b:0 "Прислать делегацию во главе с министром."
 ukraine_politics.710.c:0 "Провести церемонию без политических лозунгов: военный ритуал и список имён."
 ukraine_politics.711.t:0 "Поле Марса: прощание с героями нашего времени"
 ukraine_politics.711.d:0 "На Лычаковском кладбище во Львове, на Поле Марса, где лежат стрелки-сечевики, повстанцы и погибшие последних лет, проходит государственная церемония прощания с теми, кто погиб на Майдане, в АТО и в других боях последних лет. Ведущий читает не цифры, а имена и города, и список получается длиннее, чем рассчитывали организаторы. Семьи просят не превращать церемонию в митинг, ветеранские организации просят места на трибуне, а министры просят регламент.\n\nПрезидент решает, как провести этот день: стоять в строю вместе с семьями, выступить с короткой речью или передать организацию Министерству ветеранов. Каждый вариант стоит политсилы и запомнится по-разному, а радикалы с интересом следят, не забудут ли в речи про предков."
 ukraine_politics.711.a:0 "Стоять в строю вместе с семьями погибших."
 ukraine_politics.711.b:0 "Короткая речь и минута молчания."
 ukraine_politics.711.c:0 "Передать организацию Министерству ветеранов."
 ukraine_politics.712.t:0 "Ответ Варшавы"
 ukraine_politics.712.d:0 "Через несколько дней польские политики и газеты напоминают о Волыни 1943 года: Варшава считает те события геноцидом, Киев такого определения не принимает, а память о них у двух стран разная и в обоих случаях болезненная. В польских новостях пишут, что украинское государство чествует тех, кого Польша помнит иначе, украинские политики отвечают, что у каждой страны свои герои, а историки двух сторон просят тишины.\n\nМидовские каналы работают, но ответ президента ждут быстро: тон определит, станет ли это эпизодом дипломатической вежливости или затяжным спором. Эксгумации и памятники, торговля и помощь соседа - всё связано, и ошибиться здесь можно дорого."
 ukraine_politics.712.a:0 "Ответить нотой и предложить совместную комиссию историков."
 ukraine_politics.712.b:0 "Назвать это внутренним делом Украины."
 ukraine_politics.712.c:0 "Компромисс: эксгумации возобновить, памятники оставить."
 ukr_np_upa_dispute:0 "Спор о памяти"
 ukr_np_upa_dialogue:0 "Диалог о памяти"
 ukr_np_language_law:0 "Языковой закон"
 ukr_np_axis_overture:0 "Ось Балтика - Чёрное море"
 UKR_np_service_citizenship_tt:0 "Иностранные добровольцы и ветераны получают §Yгражданство за службу§!."
 UKR_np_axis_tt:0 "Отношения с §YПольшей и Румынией§! улучшаются (с Польшей - только без «Героев УПА»)."
 UKR_np_language_neighbours_tt:0 "Отношения с §RВенгрией и Румынией§! ухудшаются."
 UKR_np_final_civic_tt:0 "Тип экономики: §YСмешанная экономика§! с ветеранскими преференциями."
 UKR_np_final_army_tt:0 "Тип экономики: §YВоенный контроль§!."
 UKR_np_final_ethnic_tt:0 "Тип экономики: §YКорпоративизм§!."
 UKR_np_poland_dispute_tt:0 "Отношения с §RПольшей§! ухудшаются: спор о памяти."
 UKR_np_poland_dialogue_tt:0 "Отношения с §GПольшей§! улучшаются: диалог о памяти."
 #Сессия 11: путь националистов, блок 3, шаг 3 (Парубий, ядерный вопрос, юмор, история)
 UKR_parubiy_face:0 "Андрей Парубий"
 UKR_parubiy_face_desc:0 "Бывший спикер Рады и один из командиров самообороны Майдана становится лицом Республики службы: он умеет мирить национал-демократов с ветеранами и говорить с Львовом и Брюсселем одновременно."
 UKR_parubiy_legacy:0 "Память о Парубии"
 UKR_parubiy_legacy_desc:0 "Убийство во Львове 30 августа 2025 года объединило на несколько недель тех, кто спорил обо всём остальном. Его имя остаётся в программе как напоминание о цене публичной жизни."
 UKR_hunt_on_activists:0 "Охота на активистов"
 UKR_hunt_on_activists_desc:0 "Нападения на публичных людей в разных городах заставляют работать с охраной и страхом. Следствие по каждому делу идёт отдельно, версии звучат разные, а доверие к безопасности падает."
 UKR_np_face_sadovyi:0 "Садовый: лицо программы"
 UKR_np_face_sadovyi_desc:0 "Мэр Львова становится лицом Республики службы: администратор и переговорщик, не носящий погон. Сильнее в дипломатии и в городских делах, слабее на трибуне ветеранов."
 UKR_np_face_sternenko:0 "Стерненко: лицо программы"
 UKR_np_face_sternenko_desc:0 "Волонтёр и общественный деятель становится лицом программы: нравится ветеранам и улице, не нравится Офису. Харизма выше, управляемость ниже."
 UKR_np_face_council:0 "Совет ветеранов: коллективное руководство"
 UKR_np_face_council_desc:0 "У программы нет одного лица: решения принимает совет. Стабильнее, но труднее говорить с одним голосом."
 UKR_nc_nuclear_question:0 "Ядерный вопрос"
 UKR_nc_nuclear_question_desc:0 "Заявление об аудите оставшихся ядерных технологий и специалистов, без создания оружия. Решение открывается только при высокой мировой напряжённости и вызывает огромный дипломатический отклик."
 UKR_np_world_tension_tt:0 "Мировая напряжённость выше §Y50%§!."
 UKR_np_nuclear_penalty_tt:0 "Партнёры §Rрезко осуждают§! заявление: помощь ЕС замораживается на три месяца."
 ukraine_politics.723.t:0 "Охота на активистов"
 ukraine_politics.723.d:0 "С сентября в нескольких городах, от Львова до Одессы, нападают на публичных людей: активистов, журналистов, участников общественных движений. Следствие по каждому делу ведёт своё, но в чатах и на ток-шоу всё чаще звучит один вопрос: случайность это или система. Версия российского следа звучит в официальных заявлениях всё увереннее, хотя доказательства в открытом доступе пока скупые.\n\nНациональные группы реагируют по-разному: ветераны требуют охраны, правые активисты обвиняют власть в бездействии, а чиновники осторожно просят не делать выводов до приговора. Власть может усилить защиту публичных людей, заявить, что следствие идёт, или использовать момент, чтобы ужесточить меры."
 ukraine_politics.723.a:0 "Усилить охрану публичных людей и разобраться по каждому делу."
 ukraine_politics.723.b:0 "Заявить, что следствие идёт, и не торопить выводы."
 ukraine_politics.723.c:0 "Использовать момент и ужесточить меры безопасности."
 ukraine_politics.720.t:0 "Выстрелы во Львове"
 ukraine_politics.720.d:0 "30 августа во Львове застрелен Андрей Парубий, бывший спикер Рады и один из командиров самообороны Майдана. Известие приходит днём, к вечеру у его дома собираются люди со свечами, а львовский мэр Андрей Садовый сообщает, что прощание пройдёт в соборе Святого Юра и закончится на Лычаковском кладбище. Следствие, по сообщениям, рассматривает версию российского заказа, но выводы делать рано.\n\nСтрана смотрит не на следствие, а на власть: траур, охрана, обвинения. Группы конвента реагируют по-своему: национал-демократы теряют одного из своих лидеров, ветераны требуют решительных мер, а улица ищет виновных сама. Президент решает, каким будет первый ответ."
 ukraine_politics.720.a:0 "Объявить национальный траур и потребовать быстрого расследования."
 ukraine_politics.720.b:0 "Усилить охрану публичных людей и закрыть уязвимости."
 ukraine_politics.720.c:0 "Публично назвать российский след по версии следствия и вручить ноту."
 ukraine_politics.721.t:0 "Прощание во Львове"
 ukraine_politics.721.d:0 "2 сентября в соборе Святого Юра и на Лычаковском кладбище Львова прощаются с Андреем Парубием. Приходят ветераны, политики разных партий и горожане, многие из которых никогда не голосовали за его партию. Организаторы просят президента решить, как пройдёт церемония: государственной, с траурным шествием ветеранов или закрытой для семьи.\n\nКаждый вариант говорит и о нём, и о тех, кто идёт следом. Государственные похороны делают его частью общего пантеона, шествие ветеранов и дружин превращает прощание в демонстрацию силы, закрытая церемония оставляет семье тишину, но лишает людей повода проститься."
 ukraine_politics.721.a:0 "Государственные похороны и траур."
 ukraine_politics.721.b:0 "Траурное шествие ветеранов и дружин."
 ukraine_politics.721.c:0 "Закрытое прощание с семьёй."
 ukraine_politics.722.t:0 "После Львова"
 ukraine_politics.722.d:0 "После похорон в гражданской программе остаётся пустое место: Парубий был человеком, который мирил национал-демократов с ветеранами и умел говорить и с Брюсселем, и со Львовом. Теперь группы называют разные имена, и каждая считает, что именно её кандидат продолжит дело.\n\nСадовый, мэр Львова, хозяин города прощания, умеет управлять и договариваться, но не носит погон. Стерненко, волонтёр и общественный деятель, нравится ветеранам и улице, но не нравится Офису. Совет ветеранов предлагает не выбирать одного: коллективное руководство, зато без личных амбиций."
 ukraine_politics.722.a:0 "Садовый: мэр Львова становится лицом программы."
 ukraine_politics.722.b:0 "Стерненко: волонтёр и общественный деятель."
 ukraine_politics.722.c:0 "Совет ветеранов: коллективное руководство."
 ukraine_politics.740.t:0 "Ядерный вопрос"
 ukraine_politics.740.d:0 "Мировая напряжённость растёт, и в Киеве снова вспоминают Будапештский меморандум 1994 года: Украина отказалась от ядерного оружия в обмен на гарантии, которые сегодня выглядят скромнее, чем тогда. Национальный корпус и «Свобода» требуют вернуться к разговору о ядерном потенциале, комментаторы напоминают, сколько стоит такая программа, а послы уже готовят слова осуждения.\n\nРечь не о бомбе, а о заявлении: можно объявить аудит оставшихся технологий и специалистов, вынести вопрос на экспертную комиссию или не отвечать вовсе. Любой ответ прочитают в Вашингтоне, Брюсселе и Москве, и каждый поймёт его по-своему."
 ukraine_politics.740.a:0 "Заявить об аудите ядерного потенциала (без создания оружия)."
 ukraine_politics.740.b:0 "Передать вопрос экспертной комиссии."
 ukraine_politics.740.c:0 "Не отвечать на разговоры."
 ukraine_politics.750.t:0 "Чат настоящих националистов"
 ukraine_politics.750.d:0 "В закрытом чате Совета нации идёт четвёртый час разговора, который начался с повестки и дошёл до вопроса «кто настоящий». Каждая группа присылает список критериев, по которым другая оказывается недостаточно настоящей: ветераны считают настоящими тех, кто служил, правые активисты - тех, кто не продавался, ультрас - тех, кто не ушёл с трибуны, а национал-демократы напоминают, что без регламента настоящих не бывает. Скриншоты ходят по сети быстрее протокола.\n\nПредседательствующий просит перейти к бюджету. Бюджет обсуждают двадцать минут, после чего возвращаются к вопросу о настоящих."
 ukraine_politics.750.a:0 "Собрать лидеров за одним столом и закрыть чат."
 ukraine_politics.750.b:0 "Пусть спорят: так видны сильные и слабые."
 ukraine_politics.750.c:0 "Выйти из всех чатов и читать протокол."
 ukraine_politics.751.t:0 "Вышиванка в рекламе пива"
 ukraine_politics.751.d:0 "Известная пивоварня выпускает рекламу с актёром в вышиванке, и сеть делится на тех, кто видит в этом нормальную современную культуру, и тех, кто считает, что вышиванка не для пива. Правые активисты требуют ввести стандарт, левые напоминают, что вышиванка тоже товар, а в комментариях кто-то советует вообще не спорить о том, что носить. Пивоварня замечает, что рекламу обсуждают лучше любого ток-шоу.\n\nНужна ли здесь позиция государства? Можно сказать, что мода - не дело закона, можно предложить добровольный стандарт «вышитой рекламы» или отшутиться в официальном аккаунте."
 ukraine_politics.751.a:0 "Мода не дело закона: не вмешиваться."
 ukraine_politics.751.b:0 "Предложить добровольный стандарт для рекламы."
 ukraine_politics.751.c:0 "Отшутиться в официальном аккаунте."
 ukraine_politics.752.t:0 "Слив из Совета нации"
 ukraine_politics.752.d:0 "За неделю до заседания Совета нации в нескольких анонимных каналах появляется его повестка, а к вечеру и список спорных пунктов. Каналы расходятся во мнениях, кто виноват: одни пишут, что утечка идёт из ведомств, другие - что из самого Совета, третьи - что из чата, где все числятся и никто не читает. Оригиналов никто не видел, но цитаты расходятся по сети.\n\nМожно искать источник, можно сделать повестку открытой и забрать у каналов повод, а можно сделать вид, что ничего не произошло. Все три пути стоят дорого, но по-разному."
 ukraine_politics.752.a:0 "Найти источник утечки."
 ukraine_politics.752.b:0 "Сделать повестку открытой."
 ukraine_politics.752.c:0 "Не реагировать."
 ukraine_politics.753.t:0 "Борщевая война"
 ukraine_politics.753.d:0 "Российский телеканал заявляет, что борщ - русское блюдо, а украинский - его неудачная копия. В сети начинается привычная схватка: кулинарные блогеры, историки и чиновники пишут о происхождении супа, не слишком вникая в факты. Одна пивоварня выпускает «борщ на двоих», а повар из Полтавы публикует рецепт, который собирает миллион просмотров.\n\nВопрос формально кулинарный, но в этом споре каждая сторона защищает свою страну. Власть может ответить нотой, мемом или кулинарным фестивалем."
 ukraine_politics.753.a:0 "Направить ноту МИД: борщ украинский."
 ukraine_politics.753.b:0 "Ответить мемом."
 ukraine_politics.753.c:0 "Устроить фестиваль борща."
 ukraine_politics.754.t:0 "Ветеран-бариста"
 ukraine_politics.754.d:0 "В Киеве открывается кофейня, где ветеранам скидка, а остальным очередь. Хозяин, бывший сапёр, шутит, что очередь и есть главное блюдо, а в сети уже спорят, достойно ли это: одни называют идею честной, другие напоминают, что гражданин не обязан доказывать, где он был. Кофейня за неделю становится известнее некоторых министерств.\n\nВласть может закрепить такие льготы ветеранской карточкой, оставить вопрос бизнесу или заметить, что кофе пьют все, а скидки хороши, пока не превращаются в границу."
 ukraine_politics.754.a:0 "Ввести ветеранскую карточку."
 ukraine_politics.754.b:0 "Оставить решение за бизнесом."
 ukraine_politics.754.c:0 "Напомнить, что скидки не должны делить людей."
 ukraine_politics.755.t:0 "Матч и колонна"
 ukraine_politics.755.d:0 "Перед матчем двух столичных команд ультрас формируют колонну и проходят по центру города, скандируя лозунги, которые час назад были песней, а теперь стали новостью. Полиция сопровождает их на расстоянии, владельцы кафе закрывают окна, а болельщики соперника выкладывают ответное видео с лучшим монтажом. К вечеру колонну обсуждают больше, чем счёт.\n\nУлица напоминает о себе в удобное время, и каждый раз это проверка: кто сильнее, государство или трибуна. Можно усилить полицию, договориться с клубами или сделать вид, что это спорт."
 ukraine_politics.755.a:0 "Усилить полицию и дисциплину на маршрутах."
 ukraine_politics.755.b:0 "Договориться с клубами и лидерами трибун."
 ukraine_politics.755.c:0 "Не замечать: это спорт."
 ukraine_politics.770.t:0 "Круты, январь 1918"
 ukraine_politics.770.d:0 "29 января 1918 года у станции Круты под Нежином молодые добровольцы, студенты и гимназисты, пытались задержать наступление большевистских отрядов на Киев. Сколько их было и кто погиб, историки спорят и сегодня: в одних источниках три сотни, в других меньше, а в общей памяти осталось главное - они пошли и не повернули. Ежегодно в этот день в университетах и школах зажигают свечи.\n\nДля Совета нации эта история - урок о цене слов «до последнего». Её можно рассказывать как рассказ о мужестве молодых или как предупреждение о том, что нельзя отправлять их без поддержки."
 ukraine_politics.770.a:0 "Принять к сведению: Круты в школьной программе."
 ukraine_politics.771.t:0 "Холодный Яр, 1919-1922"
 ukraine_politics.771.d:0 "В 1919-1922 годах в лесах Холодного Яра под Черкассами действует повстанческая республика: отряды местных крестьян и бывших офицеров воюют против всех, кто приходит в село с чужими приказами, - белых и красных. Организованной армии у них нет, есть лес, связь и местная память. После поражения «Холодный Яр» остаётся словом для упорства без шансов на победу.\n\nИстория обсуждается в учебниках осторожно: много легенд, мало документов. Для пути она напоминает, что у сопротивления есть корни ещё до всех нынешних лозунгов."
 ukraine_politics.771.a:0 "Принять к сведению: включить в программу краеведения."
 ukraine_politics.772.t:0 "Стус, сентябрь 1985"
 ukraine_politics.772.d:0 "Василь Стус, поэт и правозащитник, умирает 4 сентября 1985 года в лагере в Пермской области: за стихи и участие в правозащитном движении его судили дважды. Его книги в советское время ходили в самиздате, а сегодня их читают школьники, часто не зная, как они попадали в отчёты КГБ.\n\nПамять о нём не нуждается в лозунгах. Вопрос в том, как государство встречает её: через школьную программу, вечера поэзии или тихие читальни."
 ukraine_politics.772.a:0 "Принять к сведению: вечера поэзии в школах и библиотеках."
 ukraine_politics.773.t:0 "Рух, 1989"
 ukraine_politics.773.d:0 "В сентябре 1989 года в Киеве проходит учредительный съезд Народного руха Украины: бывшие диссиденты, писатели, рабочие и студенты впервые собираются в одном зале под сине-жёлтым флагом, который ещё недавно за ношение наказывали. Вячеслав Чорновил, много лет проведший в лагерях и ссылке, входит в число лидеров нового движения. Через два года страна получает независимость, в которой есть и их труд.\n\nРух позже разделится и ослабнет, но школа публичной политики, которую он дал, остаётся. Для национал-демократов это основание, для остальных - пример того, как не потерять общий зал."
 ukraine_politics.773.a:0 "Принять к сведению: открыть выставку о Руке."
 ukraine_politics.774.t:0 "Революция на граните, октябрь 1990"
 ukraine_politics.774.d:0 "В начале октября 1990 года студенты в Киеве ставят палатки на площади Октябрьской революции, нынешнем Майдане Независимости, и объявляют голодовку: требуют отставки правительства, новых выборов и службы только на территории Украины. Через две недели власти уступают, а палатки становятся первым в стране уличным университетом политики. Студентов поддерживают рабочие и преподаватели, а площадь запоминает, как выглядит мирное давление.\n\nДля Совета нации это пример гражданской инициативы без оружия. Использовать её можно, помня одно: она выиграла потому, что за ней стояла молодёжь, а не группа безопасности."
 ukraine_politics.774.a:0 "Принять к сведению: пригласить студентов в Совет."
 ukraine_politics.775.t:0 "Революция достоинства, февраль 2014"
 ukraine_politics.775.d:0 "С ноября 2013 по февраль 2014 года на Майдане и в Киеве собираются сотни тысяч человек: студенты, ветераны, священники, предприниматели, футбольные ультрас и добровольцы, которые за ночь возводят и поддерживают лагерь. В феврале погибает больше ста человек, их называют Небесной сотней, и память о них становится главным общим текстом разных групп, которые в остальные дни спорят о многом.\n\nДля Совета нации Майдан - не победа одной группы, а общая рана. Поэтому любая программа, которая пытается присвоить его себе, получает ответный вопрос, а программа, которая просто читает имена, встречает тишину и согласие."
 ukraine_politics.775.a:0 "Принять к сведению: имена в списках Совета."
 ukraine_politics.781.t:0 "Добровольцы просят паспорта"
 ukraine_politics.781.d:0 "К консульствам выстраивается очередь: иностранные добровольцы, чьи контракты заканчиваются, просят гражданство по новому закону. Среди заявителей грузины, белорусы, казахи и поляки; чиновникам трудно решить, где заканчивается служба и начинается политика. Бюрократия впервые работает быстрее, чем обещала, а очередь растёт.\n\nПравые чаты спрашивают, не слишком ли это щедро, ветераны напоминают, что обещание нельзя брать назад. Власть может принять всех, кто выполнил условия, ввести дополнительную проверку или ограничить число в год."
 ukraine_politics.781.a:0 "Выдать паспорта всем, кто выполнил условия."
 ukraine_politics.781.b:0 "Ввести дополнительную проверку СБУ."
 ukraine_politics.781.c:0 "Ограничить число паспортов в год."
 ukraine_politics.782.t:0 "Будапешт и закон о языке"
 ukraine_politics.782.d:0 "Будапешт вызывает посла и требует гарантий для школ с венгерским языком обучения в Закарпатье: по мнению венгерской стороны, новый закон нарушает права меньшинства. В Киеве отвечают, что школы остаются, но экзамен по украинскому обязателен, а в Ужгороде родители спорят, на каком языке сдавать экзамен их детям.\n\nПозиция Венгрии влияет не только на двусторонние отношения: на столе вопросы ЕС и помощи. Можно пойти на переговоры, настоять на своём или предложить договор о правах меньшинств в обмен на движение к Евросоюзу."
 ukraine_politics.782.a:0 "Переговоры с Будапештом: гарантии для школ меньшинств."
 ukraine_politics.782.b:0 "Настоять: закон остаётся без изменений."
 ukraine_politics.782.c:0 "Предложить договор о правах меньшинств."
 ukraine_politics.783.t:0 "Две церкви в одном храме"
 ukraine_politics.783.d:0 "После закона о единой церкви приходы Московского патриархата в нескольких областях отказываются менять юрисдикцию, а ПЦУ просит государство не торопить людей, чтобы спор о вере не превратился в спор о зданиях. В сёлах дело доходит до замков на дверях и двух служб в одном храме по очереди, синод и митрополиты обмениваются заявлениями, а священники вполголоса просят закончить всё поскорее.\n\nГосударство может ужесточить требования, дать переходный срок и вернуться к диалогу или оставить решение самим церквям. Каждый вариант стоит разного: стабильности, политсилы или доверия верующих."
 ukraine_politics.783.a:0 "Ужесточить требования и сроки."
 ukraine_politics.783.b:0 "Дать переходный срок и вернуться к диалогу."
 ukraine_politics.783.c:0 "Оставить решение за церквями."
 ukraine_politics.784.t:0 "Слово ветерана"
 ukraine_politics.784.d:0 "На заседании Совета нации ветеран-крымский татарин рассказывает, что значит гражданство, если у тебя забрали родной дом: с 2014 года его семья живёт в другом городе, а он служит стране, которая обещает вернуть. Зал слушает дольше, чем положено по регламенту, а потом разговор неожиданно возвращается к вопросу о ценности службы для тех, кому нечего было терять.\n\nГражданская программа получает символ, который лучше любой речи. Вопрос в том, как им воспользоваться: закрепить места для крымскотатарских ветеранов в Совете, сделать запись выступления публичной или оставить как есть."
 ukraine_politics.784.a:0 "Закрепить места в Совете."
 ukraine_politics.784.b:0 "Опубликовать выступление."
 ukraine_politics.784.c:0 "Оставить как есть."
 ukraine_politics.205.t:0 "Первый тур"
 ukraine_politics.205.d:0 "31 марта. Ровно пять лет назад актёр из «Слуги народа» вышел во второй тур с результатом, которого никто не ожидал. Сегодня никто не удивлён, и в этом главная проблема.\n\nПо данным ЦИК, после обработки почти всех протоколов Зеленский снова первый с §Y[?UKR_r1_zel|0]%§!, Порошенко второй с §Y[?UKR_r1_por|0]%§!. Прежнего отрыва нет: сказываются распад союза и слухи вокруг Офиса. Остальные кандидаты вместе набирают §Y[?UKR_r1_other|0]%§!, и именно их избиратели через три недели решат, кто будет президентом. Штаб Порошенко уже празднует «возвращение опыта» и печатает плакаты для второго тура."
 ukraine_politics.205.d_high:0 "31 марта. Ровно пять лет назад актёр из «Слуги народа» вышел во второй тур с результатом, которого никто не ожидал. Сегодня удивляться нечему, но отрыв приятно больше прогнозов: по данным ЦИК Зеленский первый с §Y[?UKR_r1_zel|0]%§!, Порошенко второй с §Y[?UKR_r1_por|0]%§!.\n\nСоциологи объясняют это просто: люди помнят открытые реестры и честные ответы на неудобные вопросы, а слухи в кулуарах так и остались слухами. Остальные кандидаты вместе набрали §Y[?UKR_r1_other|0]%§!, и именно их избиратели через три недели решат исход. Штаб Порошенко печатает плакаты для второго тура, но уже без прежней уверенности."
 ukraine_politics.205.d_low:0 "31 марта. Ровно пять лет назад актёр из «Слуги народа» вышел во второй тур с результатом, которого никто не ожидал. Сегодня результат тоже неожиданный, но в другую сторону: по данным ЦИК Зеленский первый лишь с §Y[?UKR_r1_zel|0]%§!, Порошенко второй с §Y[?UKR_r1_por|0]%§!.\n\nСоциологи сходятся в диагнозе: слишком много «своих людей», слишком мало прозрачности, а скандалы, которые не расследовали, не забываются. Остальные кандидаты вместе набрали §Y[?UKR_r1_other|0]%§!, и в штабе Порошенко уже репетируют речь про «возвращение опыта»."
 ukraine_politics.205.a:0 "Три недели. Работаем без выходных."
 ukraine_politics.206.t:0 "Между турами"
 ukraine_politics.206.d:0 "Штаб делит карту страны на тех, кого ещё можно убедить. Карта выглядит как лоскутное одеяло: левые на востоке, правые на западе, молодёжь в городах-миллионниках, а те, кто хочет порядка, везде понемногу.\n\nВсех сразу не получится. Каждое обещание одним отталкивает других, а на всё про всё осталось две недели. Политтехнологи ждут решения президента и заранее готовят две версии пресс-релиза."
 ukraine_politics.206.a:0 "Бороться за левых избирателей."
 ukraine_politics.206.b:0 "Бороться за правых избирателей."
 ukraine_politics.206.c:0 "Бороться за молодёжь и IT."
 ukraine_politics.206.e:0 "Бороться за тех, кто хочет порядка."
 ukraine_politics.207.t:0 "Второй тур"
 ukraine_politics.207.d:0 "Страна голосует во второй раз. У участков очереди с самого утра, в соцсетях фотографии бюллетеней, которые публиковать нельзя, а наблюдатели от обоих штабов пересчитывают всё, что можно пересчитать.\n\nК полуночи экзитполы готовы. В штабе наступает тишина: никто не хочет первым открыть результаты. Кто-то нервно шутит, что в 2019-м было проще, тогда хотя бы никто не знал, что такое президентство."
 ukraine_politics.207.a:0 "Открываем результаты."
 ukraine_politics.214.t:0 "После второго тура"
 ukraine_politics.214.d_wide:0 "ЦИК обработал почти все протоколы: Зеленский набирает §Y[?UKR_r2_zel|0]%§!, Порошенко - §Y[?UKR_r2_por|0]%§!. Отрыв такой, что юристы Порошенко перестают звонить в суды и начинают звонить в телестудии.\n\nУже утром Порошенко признаёт результат, благодарит избирателей и объявляет, что продолжит работать в оппозиции. В штабе президента впервые за месяц выключают свет раньше полуночи, а в Офисе уже спорят о том, кому достанется зал для банкета."
 ukraine_politics.214.d_close:0 "По данным ЦИК Зеленский набирает §Y[?UKR_r2_zel|0]%§!, Порошенко - §Y[?UKR_r2_por|0]%§!. Победа есть, но отрыв такой, что в штабе Порошенко мгновенно находят слово «пересчёт».\n\nК полудню юристы обеих сторон уже в ЦИК, а перед зданием дежурят два комплекта наблюдателей, два комплекта журналистов и один продавец кофе, который впервые за много лет доволен политикой. Вопрос теперь не в том, кто выиграл, а в том, насколько громко это будут оспаривать."
 ukraine_politics.214.d_mid:0 "Зеленский набирает §Y[?UKR_r2_zel|0]%§!, Порошенко - §Y[?UKR_r2_por|0]%§!. Отрыв уверенный, но не разгромный, и это тот случай, когда обе стороны могут считать себя если не победителями, то хотя бы не проигравшими.\n\nПорошенко выходит к журналистам поздно вечером, говорит о том, что борьба за страну не закончена, и уходит, не ответив ни на один вопрос. В Офисе президента этот сюжет оценивают по-разному: одни видят в нём уважение к избирателям, другие - заявку на следующие пять лет."
 ukraine_politics.214.a:0 "Позвонить Порошенко и предложить разговор."
 ukraine_politics.214.b:0 "Работать. Ответы будут в Раде."
 ukraine_politics.214.c:0 "Пусть ЦИК пересчитает всё, что просят."
 ukraine_politics.214.d:0 "Идти в суд. Мы выиграли честно."
 ukraine_politics.214.e:0 "Позвать оппозицию к столу: за нами реформы, нам нечего бояться."
 UKR_runoff_result_tt:0 "Итоги второго тура: Зеленский §Y[?UKR_r2_zel|0]%§!, Порошенко §Y[?UKR_r2_por|0]%§!."
 UKR_b2_bet_not_ready_tt:0 "Дерево этого пути ещё не готово и появится в одном из следующих обновлений мода."
 UKR_left_maneuver_tt:0 "§gЭто тактика, а не убеждения: для Офиса поддержка левых - способ забрать их голоса, пока их не забрал кто-то другой.§!"
 UKR_left_front_renamed_tt:0 "Радикальная партия становится «Левым фронтом», «Союз левых сил» расширяется до «Союза левых сил и рабочих советов»."
 UKR_pop_social_democrat_pre_p1_tt:0 "Радикальная партия: §G+1%§! популярности"
 UKR_pop_libertarian_socialist_p1_tt:0 "Союз левых сил: §G+1%§! популярности"
 UKR_pillar_fallback_tt:0 "Опора не выбрана: ставка делается на ту, которую лучше всего поддерживает прошлая политика президента, со штрафом за несоответствие."
 UKR_left_front_surge:0 "Подъём левых"
 UKR_left_front_surge_desc:0 "§YЛевый фронт§! и §YСоюз левых сил§! идут на выборы со своими списками. Митинги становятся больше, а телевизионные рейтинги «Слуги народа» тревожнее. Левый электорат вдруг оказался не молчаливым, а очень даже слышимым. Размах подъёма зависит от того, как последовательно левые собирали коалицию. Митинги понемногу расшатывают стабильность каждую неделю."
 # Блок 2: скандал
 ukraine_politics.300.t:0 "Обыски"
 ukraine_politics.300.d:0 "Через неделю после победы, ещё до того, как успели снять предвыборные билборды, детективы НАБУ приходят с обысками. По версии следствия, дело связано с главой Офиса президента Андреем Ермаком. Сам он все обвинения отрицает.\n\nПодробности держатся в тайне, но фотографии людей в бронежилетах у знакомых дверей облетают все каналы за час. Праздничное настроение в команде заканчивается одновременно с зарядом телефонов у пресс-службы."
 ukraine_politics.300.d_sub:0 "Через неделю после победы, несмотря на переподчинение антикоррупционных органов, детективы НАБУ проводят обыски. По версии следствия, дело связано с главой Офиса президента Андреем Ермаком. Сам он все обвинения отрицает.\n\nГенпрокуратура пытается забрать дело себе, но поздно: фотографии обысков уже облетели все каналы. Оказалось, что подчинить можно органы, но не их детективов, и уж точно не телефоны журналистов."
 ukraine_politics.300.a:0 "Это удар по всей команде."
 ukraine_politics.301.t:0 "Ермак"
 ukraine_politics.301.d:0 "Андрей Ермак - самый близкий к президенту человек, его правая рука все эти годы и, по версии следствия, фигурант расследования. Сам он всё отрицает и пока продолжает приходить на работу, как обычно.\n\nЗащищать его - значит поставить на кон доверие ко второму сроку ещё до инаугурации. Отпустить - значит показать окружению, чего стоит верность в этом кабинете. Оба варианта плохие, и в этом весь смысл политики."
 ukraine_politics.301.a:0 "Мы своих не сдаём."
 ukraine_politics.301.b:0 "Принять отставку."
 ukraine_politics.302.t:0 "Опора выходит на сцену"
 ukraine_politics.302.d:0 "Президент так и не определился, на кого опирается, и сейчас это видно всем. В разгар скандала за него не вступается никто: ни улица, ни элиты, ни эксперты.\n\nДаже вчерашние союзники отвечают на звонки через раз. Одиночество на вершине власти оказалось не метафорой, а очень конкретным пустым залом для брифингов."
 ukraine_politics.302.d_tech:0 "Команда Михаила Фёдорова за одну ночь выкладывает в открытый доступ все контракты, о которых говорят журналисты, и запускает публичную проверку: «Всё прозрачно, смотрите сами».\n\nСайт с документами падает от нагрузки через двадцать минут, и это лучшая реклама. Для многих это аргумент: президент, который сам открывает реестры, вряд ли может быть главой схемы."
 ukraine_politics.302.d_left:0 "Профсоюзы и ветеранские объединения выходят на улицы с требованием «судить виновных, а не менять курс». Скандал они используют как аргумент против олигархов вокруг власти и за президента, который обещал с ними бороться.\n\nНа митинге у Рады шахтёры из Кривого Рога стоят рядом со студентами из Могилянки. Такого единства Киев не видел давно."
 ukraine_politics.302.d_olig:0 "Крупнейшие медиахолдинги как по команде выстраивают одну линию: «атака на стабильность в трудное время». Сюжеты о скандале уходят в конец выпусков, после прогноза погоды, а в эфир выходят эксперты, которые объясняют, почему сейчас не время раскачивать лодку.\n\nВсё это выглядит очень профессионально. И очень знакомо тем, кто помнит украинское телевидение нулевых."
 ukraine_politics.302.d_nat:0 "Ветеранские советы и территориальная оборона выводят людей на акции «Единство важнее скандалов». Строем, с флагами, без единого разбитого окна.\n\nИх лозунг прост: страна накануне большой угрозы, внутренние войны подождут. Многим это кажется разумным. Некоторым - слишком хорошо организованным."
 ukraine_politics.302.a:0 "Опора держит."
 ukraine_politics.303.t:0 "Брюссель реагирует"
 ukraine_politics.303.d:0 "Европейская комиссия выражает «обеспокоенность» и ждёт результатов расследования. В Брюсселе это слово имеет десяток оттенков, и дипломаты в Киеве полдня выясняют, какой из них был сегодня.\n\nПока что - нейтральный. Но в следующем заявлении может прозвучать и слово «транш»."
 ukraine_politics.303.d_sub:0 "Европейская комиссия прямо связывает скандал с переподчинением антикоррупционных органов. Очередной транш помощи приостановлен до восстановления их независимости.\n\nВ Минфине считают, сколько месяцев бюджет продержится без европейских денег. Цифра получается неприятно маленькой."
 ukraine_politics.303.d_prot:0 "Европейская комиссия отмечает, что расследование идёт без вмешательства власти, и называет это «доказательством зрелости украинских институтов».\n\nРедкий случай, когда скандал с обысками в Офисе президента в Брюсселе засчитывают как достижение. Министр иностранных дел просит распечатать заявление и повесить в рамке."
 ukraine_politics.303.a:0 "Принять к сведению."
 ukraine_politics.304.t:0 "Инаугурация"
 ukraine_politics.304.d:0 "Майский Киев, Верховная Рада, рука на Конституции и Пересопницком Евангелии. Президент второй раз принимает присягу.\n\nПять лет назад в этом зале смеялись и аплодировали. Сегодня аплодируют сдержанно: Рада расколота, скандал не утих, половина зала мысленно уже на следующих выборах. Но у власти снова есть опора, и пять лет, чтобы доказать, что выбор был правильным."
 ukraine_politics.304.a:0 "Второй срок начинается."
 ukraine_politics.310.t:0 "Тишина"
 ukraine_politics.310.d:0 "Дело, которое обещало стать громким, внезапно стало тихим. Генпрокуратура «изучает материалы», детективы НАБУ ждут ответов на запросы, а в кабинете главы Офиса по-прежнему горит свет допоздна. По версии СМИ, Андрей Ермак продолжает встречаться с министрами и губернаторами, только теперь делает это в машине, а не в приёмной.\n\nДля президента это удобная конструкция: главный советник на месте, дело в архиве, шума нет. Но в таких конструкциях всегда есть человек, который ждёт повода, и обычно это журналист с хорошим источником. Нужно решить, как долго продлится эта тишина."
 ukraine_politics.310.a:0 "Оставить всё как есть: тишина - это тоже политика."
 ukraine_politics.310.b:0 "Попросить главу Офиса уйти в тень: никаких встреч и звонков от имени президента."
 ukraine_politics.310.c:0 "Объяснить партнёрам: процессуальные решения принимает Генпрокуратура, а не мы."
 ukraine_politics.311.t:0 "Утечка"
 ukraine_politics.311.d:0 "В сети появляется переписка, которая, по версии журналистов, относится к людям из окружения главы Офиса. Обсуждаются контракты, подряды и вопрос, как сделать так, чтобы «бюро ничего не заметило». Подлинность документов подтвердить трудно, опровергнуть ещё труднее, а мем с цитатой из переписки уже собрал больше просмотров, чем официальное заявление Офиса.\n\nОппозиция требует объяснений, партнёры просят подтверждений, а штаб понимает: если утечка окажется правдой, прежняя тишина обойдётся очень дорого. Если окажется неправдой, дорого обойдётся любая попытка её опровергнуть."
 ukraine_politics.311.a:0 "Назвать утечку фейком и найти того, кто слил."
 ukraine_politics.311.b:0 "Потребовать независимую экспертизу подлинности документов."
 ukraine_politics.311.c:0 "Попросить главу Офиса публично объясниться."
 ukraine_politics.312.t:0 "Кто в Офисе?"
 ukraine_politics.312.d:0 "Кабинет главы Офиса на Банковой остаётся пустым две недели, и за это время все успевают составить собственный список претендентов. Силовики хотят человека, который понимает безопасность, дипломаты - человека, которого услышат в Брюсселе, фракция - своего. Каждый список заканчивается одной и той же приписью: лишь бы не вышло как раньше.\n\nПосле всех споров остаётся четыре кандидатуры. Михаил Фёдоров обещает превратить Офис в сервис с отчётностью, Кирилл Буданов - навести порядок и дисциплину, Андрей Сибига - вернуть Офису репутацию в Брюсселе, а Давид Арахамия - сохранить всё как есть, только без лишнего шума. Президент выбирает человека, но на самом деле выбирает, чем будет Офис следующие годы."
 ukraine_politics.312.a:0 "Михаил Фёдоров: Офис как сервис с публичной отчётностью."
 ukraine_politics.312.b:0 "Кирилл Буданов: порядок, дисциплина и безопасность."
 ukraine_politics.312.c:0 "Андрей Сибига: репутация и мосты с Брюсселем."
 ukraine_politics.312.e:0 "Давид Арахамия: свой человек, меньше перемен."
 ukraine_politics.313.t:0 "После Ермака"
 ukraine_politics.313.d:0 "Новый руководитель Офиса приходит с двумя картонными коробками и одним вопросом: кто из сотрудников остался от прежней команды и чем они занимаются? Ответ - почти все и почти всем. В коридорах говорят шёпотом, а в бухгалтерии впервые за много лет сверяют счета с расписанием приёма гостей.\n\nПрезидент понимает, что дело Ермака не закончится отставкой: останутся люди, которых он привёл, и связи, которые он выстроил. Либо новая команда вычистит эти связи, либо они вычистят её."
 ukraine_politics.313.a:0 "Провести внутреннюю проверку Офиса и опубликовать итоги."
 ukraine_politics.313.b:0 "Сменить ключевых людей тихо, без публикаций."
 ukraine_politics.313.c:0 "Оставить кадровый корпус: профессионалы нужны."
 ukraine_politics.314.t:0 "Дело в ВАКС"
 ukraine_politics.314.d:0 "Дело главы Офиса передано в Высший антикоррупционный суд: об этом объявляют в НАБУ, и в тот же день на сайте суда появляется дата первого заседания. Защита говорит о политическом заказе и нарушении процедуры, обвинение - о доказательствах, которые будут представлены в судебном порядке. В зале не протолкнуться: журналисты, активисты и несколько людей в костюмах, которые так и не объяснили, зачем пришли.\n\nПрезидент, как и все, смотрит новости. У него есть выбор: молчать, как требует процедура, или публично дистанцироваться от человека, с которым прошёл все годы власти. Любое решение будет прочитано как сигнал, и не только в Киеве."
 ukraine_politics.314.a:0 "Не вмешиваться: суд - это суд, а Офис - это Офис."
 ukraine_politics.314.b:0 "Публично дистанцироваться от обвиняемого."
 ukraine_politics.314.c:0 "Попросить суд учесть заслуги обвиняемого перед государством."
 ukraine_politics.315.t:0 "Заседания переносятся"
 ukraine_politics.315.d:0 "Заседание по делу переносится в третий раз: то заболел адвокат, то потерялся том дела, то сломался кондиционер в зале. В НАБУ это называют тактикой затягивания, в Офисе - нормальным процессом, а журналисты - сезонным развлечением. Зал постепенно пустеет, и вместе с ним остывает интерес публики.\n\nУ дела есть важная особенность: оно ждёт. Пока приговора нет, любой политик ходит под ним, как под дождём без зонта. Время играет за одну из сторон, и вопрос только в том, за какую."
 ukraine_politics.315.a:0 "Публично поддержать ускорение процесса."
 ukraine_politics.315.b:0 "Не комментировать: суд сам знает, что делать."
 ukraine_politics.315.c:0 "Через союзников в Раде предложить пересмотреть подсудность таких дел."
 ukraine_politics.316.t:0 "Президент против бюро"
 ukraine_politics.316.d:0 "Президент публично защитил главу Офиса и столкнулся с тем, чего боялся: бюро не собирается отступать. НАБУ выпускает заявление в тот же день, и оно написано тем языком, каким не пишут, когда хотят договориться. Генпрокурор молчит, послы вежливо улыбаются, а в ленте новостей впервые за годы появляется слово «кризис».\n\nВ Офисе уже считают, что дальше: либо дело уходит в суд при самом неудобном освещении, либо кто-то должен уступить. Президент слишком давно в политике, чтобы не понимать: уступить сейчас дешевле, чем потом."
 ukraine_politics.316.a:0 "Уступить бюро: дело идёт по закону, Офис не вмешивается."
 ukraine_politics.316.b:0 "Идти на конфликт: пересмотреть полномочия бюро через Раду."
 ukraine_politics.316.c:0 "Искать компромисс через Брюссель: независимая оценка дела."
 ukraine_politics.317.t:0 "После бури"
 ukraine_politics.317.d:0 "После недели, которую в Офисе называют непростой, выясняется, что выиграть спор с бюро нельзя, можно лишь выбрать, как проиграть. Одни депутаты демонстративно держатся подальше от президента, другие, наоборот, стали ближе: те, кому нужно чьё-то покровительство. Социологи отмечают, что люди теперь делят политиков на тех, кто объясняется, и тех, кто нет.\n\nПредстоит решить, как жить дальше: восстановить отношения с бюро и Брюсселем или остаться в обороне, где безопаснее, но скучнее."
 ukraine_politics.317.a:0 "Восстановить диалог с бюро: регулярные встречи и общие брифинги."
 ukraine_politics.317.b:0 "Остаться в обороне: меньше слов, больше решений."
 ukraine_politics.317.c:0 "Сделать нейтральное заявление: власть уважает независимость органов."
 ukraine_politics.319.t:0 "Дело Ермака: итог"
 ukraine_politics.319.d_court:0 "Высший антикоррупционный суд выносит приговор по делу, которое для многих давно стало символом эпохи. Андрей Ермак признан виновным; приговор зачитывают без лишней торжественности и с обязательной пометкой «подлежит обжалованию», которая в украинском судопроизводстве работает как многоточие.\n\nДля президента день тяжёлый: человек, который был рядом все эти годы, уходит из политики по решению суда. Но заголовки за границей совсем другие: «Киев показал, что независимые институты работают». В Брюсселе это пишут с редкой теплотой, в Офисе читают сквозь зубы."
 ukraine_politics.319.d_deal:0 "Дело Ермака заканчивается так, как заканчивается большинство громких дел: тихо и с протоколом. Бывший глава Офиса заключает соглашение со следствием, возвращает то, что следствие считает спорными активами, и уходит из публичной жизни. Приговор мягкий, формулировки аккуратные, а слово «сделка» стоит в каждом втором заголовке.\n\nВ Брюсселе это принимают с осторожным одобрением: результат есть, хотя без показательного суда. В Киеве с облегчением: больше не будет заседаний, на которые приходят люди без объяснения причин. Политический итог ровный: никто не победил, но никто и не проиграл."
 ukraine_politics.319.d_fade:0 "Дело Ермака не заканчивается ничем окончательным: оно просто перестаёт двигаться. Процессуальные сроки истекают, подсудность меняется, а одна из папок уезжает в архив с пометкой, которую не могут расшифровать даже юристы. Бывший глава Офиса появляется на нескольких мероприятиях и ни на одном не даёт интервью.\n\nПартнёры в Брюсселе записывают это как провал: помощь замораживается до новых гарантий. Журналисты называют историю делом-призраком, а в кулуарах Рады всё чаще звучит слово «клан»: вокруг Банковой снова собираются те, кто умеет договариваться без протокола."
 ukraine_politics.319.a:0 "Принять приговор и закрыть страницу."
 ukraine_politics.319.b:0 "Принять результат: главное, что дело закрыто."
 ukraine_politics.319.c:0 "Сделать вид, что вопроса не существует."

 # Блок 3: институционалисты-технократы
 UKR_t_svyrydenko_cabinet:0 "Кабинет Свириденко"
 UKR_t_svyrydenko_cabinet_desc:0 "Второй срок начинается не с парада, а с таблицы. Юлия Свириденко, годами сводившая бюджет так, чтобы он хотя бы выглядел сходящимся, становится премьером. Михаил Фёдоров продолжает переносить государство в смартфон и обещает, что справка о том, что вы существуете, скоро станет не нужна.\n\nСтавка сделана на институты, а не на лица. Бизнес-ассоциации осторожно радуются: наконец-то правила, которые не меняются к вечеру пятницы. Скептики замечают, что фразу «институты, а не лица» обычно произносят прямо перед появлением лиц."
 UKR_t_diia_system:0 "Дія как система"
 UKR_t_diia_system_desc:0 "«Дія» перестаёт быть приложением с красивым интерфейсом и становится способом, которым государство вообще работает. Паспорт, права, бизнес, субсидии - всё в одном кармане, а не в пяти кабинетах на разных этажах.\n\nЛогика проста: чем меньше бумаг и окошек, тем меньше мест, где можно «решить вопрос». Чиновники среднего звена впервые понимают, что цифровизация - это не про удобство граждан, а про их собственную занятость. Реформаторам нравится. Кабинетам - не очень."
 UKR_t_digital_registry:0 "Единый цифровой реестр"
 UKR_t_digital_registry_desc:0 "Реестры военнообязанных, недвижимости, бизнеса и налогов, десятилетиями жившие в разных ведомствах и на разных версиях Excel, наконец сводятся в одну систему. Данные больше не нужно «согласовывать» - достаточно нажать кнопку.\n\nВ мирное время это удобство и экономия нервов. Если же придёт война, это будет разница между несколькими днями и несколькими часами. Правозащитники просят не забывать и о третьем эффекте: чем больше всего в одном месте, тем аккуратнее нужно им распоряжаться."
 UKR_t_e_residency:0 "Э-резидентство"
 UKR_t_e_residency_desc:0 "Иностранный предприниматель может зарегистрировать компанию в Украине, не покупая билет, не собирая справки и не встречаясь ни с одним чиновником. Налоги он платит здесь, а работать может хоть с пляжа.\n\nДля страны, которой годами советовали «сначала наведите порядок», это способ сказать: порядок у нас уже в приложении. Бизнес-ассоциации поддерживают, налоговая осторожно считает, а скептики спрашивают, не превратится ли всё это в удобную схему для оптимизаторов. Ответ зависит от качества проверок."
 UKR_t_it_export:0 "IT-экспорт"
 UKR_t_it_export_desc:0 "Пока другие отрасли обсуждают, как пережить очередной кризис, программисты тихо приносят в страну валюту. Это самый стабильный экспорт, и его не нужно грузить на баржи.\n\nГосударство наконец замечает, что IT-специалистов лучше удерживать, чем провожать. Отраслевые ассоциации и IT-кластеры Львова и Харькова просят простых налоговых правил и понятного будущего. Взамен обещают остаться, платить налоги и не покупать билеты в Варшаву. Обещание, как водится, зависит от зарплат."
 UKR_t_diia_city_2:0 "Дія.City 2.0"
 UKR_t_diia_city_2_desc:0 "Первая версия «Дія.City» доказала, что технологические компании готовы работать в стране, если им не мешать. Вторая идёт дальше: больше резидентов, проще правила и прямая связь с университетами, которые до сих пор выпускали программистов для чужих офисов.\n\nОтраслевые объединения хвалят. Налоговики просят сначала посчитать выпадающие доходы. Ректоры вдруг вспоминают, что технопарки - это тоже про них. Все довольны, пока не дойдёт до распределения грантов."
 UKR_t_cloud_state:0 "Облачное государство"
 UKR_t_cloud_state_desc:0 "Государство решает не класть все реестры в одну корзину, а тем более в подвал в Киеве. Копии данных хранятся в дата-центрах союзников, за пределами досягаемости для ракет и хакеров.\n\nЕсли серверы в Киеве замолчат, страна продолжит выплачивать пенсии, регистрировать компании и проверять документы. Партнёры уважают такую дальновидность. Сторонники суверенитета спрашивают, не значит ли «данные в облаке союзника» «данные у союзника». Технократы отвечают: значит, но ключи шифрования остаются в Киеве."
 UKR_t_drone_army:0 "Армия дронов"
 UKR_t_drone_army_desc:0 "Дроны, собранные волонтёрами и студентами из чего попало, перестают быть хобби энтузиастов. Из хаоса вырастает система: производители, операторы, школы пилотов и закупки через открытые площадки, где видно, кто сколько заплатил.\n\nВоенные сначала смеялись, потом просили ещё. Технологические кластеры и волонтёрские мастерские наконец получают контракты, а не только благодарности в соцсетях. Осторожные генералы напоминают, что дрон не заменяет армию, а вот армия без дронов уже выглядит странно."
 UKR_t_cyber_troops:0 "Кибервойска"
 UKR_t_cyber_troops_desc:0 "Айтишники, ещё вчера воевавшие в чатах и на форумах, получают погоны, командование и служебные обязанности. Добровольцы из IT-армии, прежде действовавшие по принципу «нас позвали - мы пришли», теперь работают по плану.\n\nТехнари довольны: наконец-то можно ссылаться на приказ. Юристы довольны: наконец-то понятно, кто отвечает. Генералы озадачены: как объяснить бойцу, что боевая задача - это код, а не марш-бросок. Но привыкнут."
 UKR_t_digital_mobilization:0 "Цифровая мобилизация"
 UKR_t_digital_mobilization_desc:0 "Повестка приходит в приложение, учёт ведётся онлайн, а военкомат превращается в сервис. Раньше «встать на учёт» означало очередь, неясность и сомнительные советы у входа. Теперь - уведомление, запись и понятный порядок.\n\nЭто быстрее и заметно честнее: меньше места для «договориться». Правозащитники следят, чтобы вместе с сервисом не появилось лишних полномочий. Граждане следят за уровнем сети. Всем остальным остаётся надеяться, что приложение не решит обновиться в самый неподходящий момент."
 UKR_t_open_state:0 "Открытое государство"
 UKR_t_open_state_desc:0 "Данные публичны, контракты открыты, решения объяснены. Антикоррупционные организации получают материал для расследований на годы вперёд, а журналисты - дела, которые раньше приходилось выпрашивать через запросы.\n\nЗапад аплодирует, инвесторы кивают, партнёры готовят следующий транш. Есть и обратная сторона: противник читает те же реестры и, судя по всему, внимательнее многих депутатов. Спецслужбы просят чуть больше закрытых полей. Публика - ещё больше открытых."
 UKR_t_digital_control:0 "Цифровой контроль"
 UKR_t_digital_control_desc:0 "Все данные государства теперь работают на скорость решений и безопасность. Система видит, кто получил справку, кто сменил адрес и кто в ней ошибся, и реагирует раньше, чем человек успеет донести бумагу.\n\nЭффективно, быстро и слегка тревожно для тех, кто помнит, чем заканчиваются системы, знающие о человеке всё. Спецслужбы довольны. Правозащитники напоминают о необходимости независимого надзора. Граждане пока просто хотят, чтобы всё работало."
 UKR_t_transparent_budget:0 "Прозрачный бюджет"
 UKR_t_transparent_budget_desc:0 "Каждая гривна бюджета видна онлайн: кто заказал, кто получил, за какую цену. Расследователям больше не нужно писать запросы - достаточно знать, где искать.\n\nВоровать становится неудобно, хотя фантазия у людей богатая. Антикоррупционные организации и общественные наблюдатели получают инструмент, который прежде казался мечтой. Чиновники получают привычку сначала думать, а потом подписывать. Поначалу это вызывает шок, потом - дисциплину."
 UKR_t_estonian_experience:0 "Эстонский опыт"
 UKR_t_estonian_experience_desc:0 "Эстония строила цифровое государство, пока остальные спорили о бумажных паспортах. Теперь Таллинн делится опытом, а Киев - масштабом: совместная программа по электронному управлению, кибербезопасности и обучению чиновников.\n\nЭстонцы деликатно объясняют, что цифровизация - это не приложение, а привычка доверять системе. Украинцы вежливо отвечают, что доверие пока приходится строить параллельно с сервером. Обе стороны понимают: на этой границе безопасность важнее любых слайдов."
 UKR_t_algorithms:0 "Алгоритмы вместо чиновников"
 UKR_t_algorithms_desc:0 "Лицензии, пособия и проверки теперь распределяет система. Быстро, беспристрастно и без «поблагодарить за скорость». Очередь исчезает, а вместе с ней исчезает и главный аргумент в пользу взяток.\n\nЕсть только один нюанс: алгоритму нельзя объяснить, что он ошибся, - разве что через форму обратной связи, которую читает другой алгоритм. Правозащитники требуют права на апелляцию. Разработчики обещают «улучшить модель». Граждане пока голосуют скоростью."
 UKR_t_security_single_window:0 "Единое окно безопасности"
 UKR_t_security_single_window_desc:0 "Данные всех реестров теперь доступны службам безопасности в одном окне. Проверка человека, занимавшая неделю и три звонка знакомым, занимает несколько секунд. Агентам противника становится тесно. Гражданам, как выяснилось, тоже.\n\nСлужбы безопасности довольны. Правозащитники и юристы просят хотя бы судебный контроль за запросами. Технократы отвечают, что всё логируется. Проблема в том, что логи тоже кто-то читает."
 UKR_t_state_without_territory:0 "Государство без территории"
 UKR_t_state_without_territory_desc:0 "Если враг возьмёт столицу, он возьмёт здания, кабинеты и красивый вид на Днепр, но не государство. Реестры, связь, выплаты и управление продолжат работать из облака, пока где-то есть электричество и хотя бы один защищённый канал.\n\nПартнёры видят в этом гарантию того, что помощь не растворится. Противник - неприятный сюрприз в любом сценарии. Гражданам остаётся главное: приложение продолжит открываться, даже когда город за окном лишится половины света."
 UKR_t_liberal_corporatism:0 "Либеральный корпоративизм"
 UKR_t_liberal_corporatism_desc:0 "Страна, которая научилась работать без территории, теперь учится договариваться без драк. За один стол садятся правительство, бизнес-ассоциации и профсоюзы, и правила рынка пишутся там, а не в кулуарах у тех, кто раньше решал всё по звонку.\n\nКрупный капитал получает предсказуемость и теряет привычные рычаги. Профсоюзы получают место за столом и привыкают к слову «компромисс». Либералы-технократы довольны: наконец-то модель, которую можно описать в презентации и даже исполнить. Скептики замечают, что стол иногда бывает круглым, а договариваются всё равно двое."
 UKR_svyrydenko:0 "Юлия Свириденко"
 UKR_fedorov:0 "Михаил Фёдоров"
 UKR_network_dependency:0 "Зависимость от сети"
 UKR_network_dependency_desc:0 "Цифровое государство работает быстро - пока есть электричество и связь. Каждый удар по энергетике теперь бьёт и по управлению страной."
 UKR_digital_registry_idea:0 "Единый цифровой реестр"
 UKR_digital_registry_idea_desc:0 "Все реестры в одной системе: мобилизация и решения идут быстрее."
 UKR_digital_mobilization_idea:0 "Цифровая мобилизация"
 UKR_digital_mobilization_idea_desc:0 "Учёт, повестки и призыв работают онлайн."
 UKR_it_export_idea:0 "IT-экспорт"
 UKR_it_export_idea_desc:0 "Технологический сектор кормит бюджет и науку."
 UKR_drone_army:0 "Армия дронов"
 UKR_drone_army_desc:0 "Разведка, корректировка и удары - силами беспилотников, которые производятся по всей стране."
 UKR_cyber_troops:0 "Кибервойска"
 UKR_cyber_troops_desc:0 "Структурированные киберсилы защищают свои сети и вскрывают чужие."
 UKR_open_state:0 "Открытое государство"
 UKR_open_state_desc:0 "Прозрачность как государственная политика: доверие партнёров растёт, но растёт и уязвимость к утечкам."
 UKR_digital_control:0 "Цифровой контроль"
 UKR_digital_control_desc:0 "Государство видит всё и решает быстро. Общество это чувствует."
 UKR_security_single_window:0 "Единое окно безопасности"
 UKR_security_single_window_desc:0 "Службы безопасности получают доступ ко всем реестрам сразу."
 UKR_eu_reconstruction_fund:0 "Фонд восстановления ЕС"
 UKR_eu_reconstruction_fund_desc:0 "Многолетняя программа Евросоюза: гранты и дешёвые кредиты на восстановление в обмен на выполнение реформ. Каждый транш привязан к конкретному закону."
 UKR_made_in_ukraine:0 "Зроблено в Україні"
 UKR_made_in_ukraine_desc:0 "Национальный кэшбэк и локализация госзакупок поддерживают украинского производителя."
 UKR_svyrydenko_reforms:0 "Реформы кабинета Свириденко"
 UKR_svyrydenko_reforms_desc:0 "Правительство Свириденко ставит на экономику, которая работает без лозунгов: поддержка производителя, доступные кредиты, гранты, дерегуляция и приватизация. Государство не строит заводы само - оно помогает строить другим и старается не мешать.\n\nБизнес-ассоциации это одобряют. Профсоюзы настороженно следят за приватизацией. Экономисты спорят, что важнее: низкие налоги или предсказуемость. Свириденко предлагает считать и то и другое, если получится свести баланс."
 UKR_sv_made_in_ukraine:0 "«Зроблено в Україні»"
 UKR_sv_made_in_ukraine_desc:0 "Государство возвращает часть денег тем, кто покупает украинское, и требует, чтобы часть госзакупок тоже была локальной. Логика простая: если покупатель платит за наш товар, а производитель платит налоги, деньги остаются в стране.\n\nПроизводители довольны. Импортёры нет. Брюссель внимательно следит, чтобы локализация не превратилась в протекционизм: идея ему нравится, а вот исключения не очень. Покупателям нравится кэшбэк, остальное они обсудят на кассе."
 UKR_sv_affordable_loans:0 "Доступные кредиты 5-7-9%"
 UKR_sv_affordable_loans_desc:0 "Государство компенсирует бизнесу проценты по кредитам, и заводы, пекарни и мастерские начинают строиться там, где раньше их только обсуждали. Предприятия растут, деньги оборачиваются, налоги идут.\n\nЕсть и обратная сторона: долг растёт вместе с числом довольных предпринимателей. Нацбанк и финансисты напоминают, что бесплатных кредитов не бывает - бывают те, за которые платит бюджет. Минфин пока улыбается, но всё записывает."
 UKR_sv_own_business_grants:0 "Гранты «Власна справа»"
 UKR_sv_own_business_grants_desc:0 "Микрогранты на открытие своего дела: парикмахерские, пекарни, мастерские, цветочные лавки - и немного меньше бедности в регионах, где работы раньше не было. Бюджету это обходится дешевле пособий, а людям приятнее получить шанс, чем справку.\n\nНачинающие предприниматели осваивают налоговую отчётность. Бухгалтеры впервые за долгое время радуются наплыву клиентов. Скептики спрашивают, сколько из этих проектов доживёт до второго года. Ответ покажет статистика, а не пресс-релиз."
 UKR_sv_deregulation:0 "Дерегуляция"
 UKR_sv_deregulation_desc:0 "Сотни разрешений, справок и согласований отменяются одним пакетом. Чиновникам - меньше власти, бизнесу - меньше поводов платить за то, что должно быть бесплатным. Предприниматели впервые видят, что точку можно открыть, не обходя пять кабинетов.\n\nПротивники реформы напоминают, что часть этих бумаг всё-таки защищала людей: от небезопасных зданий, от недобросовестных подрядчиков. Реформаторы отвечают, что защищать надо результат, а не процедуру. Проверим это на первой же проверке."
 UKR_sv_big_privatization:0 "Большая приватизация"
 UKR_sv_big_privatization_desc:0 "Убыточные госпредприятия наконец уходят с молотка, а вместе с ними уходят десятилетия дотаций, кадровых схем и вечных обещаний «реорганизовать». Бюджет получает деньги, инвесторы - активы, профсоюзы - повод для протестов.\n\nПрофсоюзы и левые организации говорят о распродаже страны. Реформаторы отвечают, что убыточное предприятие тоже кому-то принадлежит - обычно налогоплательщику. Спор обещает быть долгим, а аукционы - публичными, чтобы никто не мог сказать, что не видел."
 UKR_sv_eu_reconstruction_fund:0 "Фонд восстановления ЕС"
 UKR_sv_eu_reconstruction_fund_desc:0 "По образцу реальной программы Ukraine Facility (2024-2027): деньги Евросоюза на восстановление и модернизацию - но только пока Украина выполняет обещанные реформы. Каждый транш привязан к конкретным законам, а каждый закон - к очередному голосованию в Раде.\n\nБрюссель хвалит прогресс и внимательно читает сноски. Депутаты хвалят транши и сноски читают значительно менее внимательно. Реформаторы и антикоррупционные организации получают редкий рычаг: нет закона - нет денег.\n\nНедоступно, если помощь ЕС заморожена."
 UKR_sv_industrial_parks:0 "Индустриальные парки"
 UKR_sv_industrial_parks_desc:0 "Готовые площадки с дорогами, электричеством, подключением к сетям и налоговыми льготами для частных инвесторов. Вместо полугода согласований - участок, на котором можно начинать строить в понедельник.\n\nРегиональные власти рады: рабочие места и налоги остаются на месте. Инвесторы рады: не нужно каждый раз доказывать, что вы не верблюд. Экологи просят не забывать про экологию. Реформаторы обещают не забывать, если напомнят вовремя."
 UKR_sv_institutions_work:0 "Институты работают"
 UKR_sv_institutions_work_desc:0 "Реформы перестают держаться на энтузиазме одного кабинета: приказы становятся регламентами, регламенты привычкой. Свириденко получает то, о чём мечтает любой премьер: возможность уйти в отпуск и не найти по возвращении пожара."
 UKR_sv_fedorov_defense:0 "Фёдоров идёт в оборону"
 UKR_sv_fedorov_defense_desc:0 "Война показала, что цифровой министр умеет закупать, подключать и считать быстрее многих людей в погонах. Фёдоров принимает ведомство и сразу спрашивает, почему у этого процесса десять согласований."
 UKR_sv_fedorov_defense_upgrade:0 "Фёдоров: технологическая армия"
 UKR_sv_fedorov_defense_upgrade_desc:0 "Дроны, данные и закупки через открытые площадки становятся доктриной ведомства, а не его неформальной жизнью. Военные привыкают, что приложение иногда решает быстрее приказа."
 UKR_upgrade_budanov:0 "Буданов: ГУР в центре"
 UKR_upgrade_budanov_desc:0 "Разведка перестаёт быть вспомогательным ведомством: Буданов получает право планировать операции, а не только докладывать о чужих. Сеть растёт быстрее, чем успевают придумывать для неё названия."
 UKR_sv_reforms_5_tt:0 "Выполнено не менее пяти реформ из окна «Реформы кабинета Свириденко»"
 UKR_sv_fedorov_defense_tt:0 "Михаил Фёдоров возглавит министерство обороны"
 UKR_cloud_state_tt:0 "Государственные реестры сохранены в дата-центрах союзников."
 UKR_state_without_territory_tt:0 "§YЕсли Киев падёт, удар по стабильности и поддержке войны будет вдвое слабее.§!"
 UKR_state_without_territory_kyiv_tt:0 "Государство продолжает работать из облака: удар смягчён."
 ukraine_politics.400.t:0 "Кабинет, который читает регламент"
 ukraine_politics.400.d:0 "Новое правительство представлено в Раде и утверждено удивительно быстро: депутаты даже не успели устать от собственных выступлений.\n\nПремьером становится Юлия Свириденко - экономист, которая годами вела переговоры с партнёрами и писала программы поддержки бизнеса. Михаил Фёдоров остаётся во главе цифровой трансформации и уже обещает, что очередей станет меньше, а форм ещё меньше.\n\nРеакции разные. Бизнес-ассоциации осторожно одобряют: они давно просили правил, которые не меняются к вечеру пятницы. Антикоррупционные организации напоминают, что «скучное» правительство - комплимент только до первого тендера. Старая гвардия в Раде ворчит: раньше вопросы решали министры, теперь их «закрывают тикетами».\n\nЖурналисты называют кабинет скучным. В правительстве это считают комплиментом."
 ukraine_politics.400.a:0 "Скучно - значит работает."
 ukraine_politics.401.t:0 "Дія лежит"
 ukraine_politics.401.d:0 "Утро начинается с тишины. Точнее, с бесконечной загрузки.\n\n«Дія» не открывается. Не работают выплаты, справки, цифровые паспорта. Пенсионеры стоят у отделений, где им говорят: «Система не отвечает». Предприниматели не могут подписать договоры. В мессенджерах растёт паника, и самый популярный вопрос - «у вас тоже?».\n\nЧерез несколько часов выясняется: это масштабная кибератака на дата-центр. Страна впервые понимает, насколько она зависит от одного приложения.\n\nМинистерство цифровой трансформации обещает восстановление «в кратчайшие сроки», но всем ясно: если цифровое государство падает, падает и вера в него. Айтишники требуют резервные серверы за рубежом. Осторожные чиновники напоминают, что данные лучше держать дома. А пока у бумажных окошек происходит любопытная вещь: люди вспоминают старые способы решать вопросы, и не всегда бесплатные."
 ukraine_politics.401.a:0 "Развернуть резервные серверы за рубежом. Данные дороже гордости."
 ukraine_politics.401.b:0 "Переждать и восстановить своими силами. Мы справимся."
 ukraine_politics.402.t:0 "Дрон из гаража"
 ukraine_politics.402.d:0 "Трое студентов из Харькова показывают разведывательный дрон, собранный в гараже из деталей робота-пылесоса, старого смартфона и очень большого количества изоленты. Он летает. Он передаёт видео. Он даже возвращается.\n\nВоенные смеются ровно до первого испытания. После второго просят номер телефона. Харьковский IT-кластер готов предоставить помещение, если кто-нибудь объяснит бухгалтерии, что такое «прототип из пылесоса». Венчурные инвесторы присылают вежливые письма с вопросом «а сколько таких можно сделать». Чиновники из министерства обороны спрашивают то же самое, но с приложением формы на пять страниц.\n\nСтуденты просят только одного: чтобы после гранта у них остался тот же гараж. Там хороший свет."
 ukraine_politics.402.a:0 "Дать им грант и открыть производство."
 ukraine_politics.402.b:0 "Передать разработку армии."
 ukraine_politics.403.t:0 "Утечка"
 ukraine_politics.403.d:0 "Часть данных открытого реестра всплывает на анонимном форуме вместе с личными данными чиновников и военных. Открытость государства оказалась открытой не только для граждан.\n\nПервыми реагируют журналисты: они уже нашли в утечке три истории и одну неловкую опечатку в фамилии министра. Специалисты по кибербезопасности сухо замечают, что предупреждали об этом ещё на этапе проектирования. Спецслужбы требуют закрыть половину полей. Антикоррупционные организации возражают: закрытое поле - как раз то место, где обычно и начинается проблема.\n\nПартнёры смотрят внимательно. Им нравится открытость. Им не нравится, когда она превращается в открытую дверь."
 ukraine_politics.403.a:0 "Признать ошибку и закрыть уязвимость."
 ukraine_politics.403.b:0 "Это работа российских хакеров."
 ukraine_politics.404.t:0 "Цифровой паноптикум"
 ukraine_politics.404.d:0 "Правозащитники и студенты выходят к Кабмину: «Государство знает о нас больше, чем мы сами». Плакаты с глазом над логотипом «Дії» становятся мемом за один вечер.\n\nВ толпе можно увидеть и молодых айтишников, и седых юристов, и активистов, которых давно не видели на улицах. Правозащитные организации требуют независимого надзора за данными. Депутаты обещают «изучить вопрос» - на парламентском языке это значит «подождать, пока пройдёт». Спецслужбы напоминают, что безопасность без данных не бывает. А в Брюсселе уже спрашивают, как всё это сочетается с европейскими нормами защиты информации.\n\nМем про глаз и «Дію» набирает миллионы репостов. Власть впервые видит, что шутка бывает убедительнее письма."
 ukraine_politics.404.a:0 "Дать парламенту контроль над данными."
 ukraine_politics.404.b:0 "Безопасность важнее."
 ukraine_politics.405.t:0 "Консерваторы против цифры"
 ukraine_politics.405.d:0 "Священники, сельские громады и пенсионеры жалуются: в отделении больше не принимают бумажные заявления, а до ближайшего компьютера - двадцать километров. Оппозиция называет цифровизацию «государством для молодых и городских».\n\nАссоциации громад просят не забывать, что интернет в стране покрывает не всё, а терпение людей - не бесконечно. Почта, которая знает каждую деревню лучше любого министерства, вызывается стать посредником: почтальон поможет оформить услугу на месте. Реформаторы возражают, что каждое исключение - лазейка для старой бюрократии, а пенсионеры давно освоили мессенджеры. Пенсионеры подтверждают: освоили. Но не всегда хотят.\n\nСпор идёт не о технологиях. Он идёт о том, для кого это государство."
 ukraine_politics.405.a:0 "Оставить бумажные услуги для тех, кому они нужны."
 ukraine_politics.405.b:0 "Будущее не ждёт."
 ukraine_politics.406.t:0 "Эстонский опыт"
 ukraine_politics.406.d:0 "Эстонская делегация приезжает в Киев с программой совместного развития электронного управления. Таллинн делится опытом, Киев - масштабом. Обе стороны знают, на чьей границе стоит угроза.\n\nЭстонцы рассказывают, как строили систему, когда у них было мало денег, зато была привычка доверять системе. Украинские чиновники слушают, записывают и с уважением отмечают, что население Эстонии сопоставимо с одним крупным районом Киева, а значит, и очереди у них короче. Университеты и IT-кластеры договариваются об обмене студентами и специалистами. Брюссель аплодирует: маленькая страна помогает большой, и никто не спорит о том, кто главнее.\n\nНа прощание эстонцы напоминают: цифровое государство - это не приложение, а договор. Пока его условия соблюдаются, оно работает."
 ukraine_politics.406.a:0 "Цифровые союзники - тоже союзники."
 UKR_markarova:0 "Оксана Маркарова"
 UKR_hetmantsev:0 "Данило Гетманцев"
 UKR_stefanishyna:0 "Ольга Стефанишина"
 UKR_sybiha:0 "Андрей Сибига"
 UKR_klimkin:0 "Павел Климкин"
 UKR_klymenko:0 "Игорь Клименко"
 UKR_zguladze:0 "Эка Згуладзе"
 UKR_shchyhol:0 "Юрий Щиголь"
 UKR_malyuk:0 "Василий Малюк"
 UKR_cabinet_actors_dynamic:0 "Самостоятельные акторы кабинета"
 UKR_cabinet_actors_dynamic_desc:0 "Министры и замы из технократической среды привыкли работать без согласования с Офисом президента. Дела идут быстрее, но у президента больше собеседников и меньше рычагов: каждый такой актор немного снижает прирост политсилы."
 UKR_tech_team_narrow:0 "Ближний круг Фёдорова"
 UKR_tech_team_narrow_desc:0 "Фёдоров приводит с собой несколько человек, которые понимают друг друга с полуслова, а чужие согласования считают лишним этапом. Небольшая команда, зато без лишних споров в коридорах."
 UKR_tech_team_medium:0 "Команда технократов"
 UKR_tech_team_medium_desc:0 "Цифровики, торговые переговорщики и управленцы из агентств получают заместительские должности. Реформы идут заметно быстрее, а Офис президента всё чаще узнаёт о них из новостей."
 UKR_tech_team_wide:0 "Десант технократов"
 UKR_tech_team_wide_desc:0 "Технократы занимают заместительские кресла и руководящие должности почти в каждом министерстве. Государство начинает работать по регламенту, а регламенты, как известно, редко совпадают с желаниями Банковой."
 UKR_cabinet_talks_tt:0 "Свириденко обсудит с президентом кандидатов на экономику, МИД, МВД и разведку"
 UKR_cabinet_actors_1_tt:0 "Самостоятельный актор кабинета: прирост политсилы §R-1%§!"
 UKR_cabinet_actors_3_tt:0 "Самостоятельные акторы кабинета (3): прирост политсилы §R-3%§!"
 UKR_cabinet_actors_5_tt:0 "Самостоятельные акторы кабинета (5): прирост политсилы §R-5%§!"
 ukraine_politics.410.t:0 "Кто будет считать деньги"
 ukraine_politics.410.d:0 "Юлия Свириденко приходит в Офис президента с папкой: в ней три кандидата на экономический блок и по таблице плюсов и минусов на каждого. Президент листает её, отмечает что-то красным и возвращает с вопросом, который в этом здании означает «а кто за него поручится». Обсуждение идёт спокойно, как все разговоры, где обе стороны считают, у кого после него останется больше рычагов.\n\nТимофей Милованов - экономист, привыкший оперировать цифрами, а не сроками полномочий; это человек Свириденко, и он вряд ли станет согласовывать каждую запятую с Офисом. Оксана Маркарова знает язык доноров и бюджетной дисциплины, и её без споров примут и в Брюсселе, и в Минфине. Данило Гетманцев - автор налоговых инициатив и давний союзник президента: его придётся продавливать через премьера и фракцию, зато вопросов о лояльности не возникнет. Самостоятельные министры работают быстрее, но потом спорят с Офисом."
 ukraine_politics.410.a:0 "Тимофей Милованов: пусть считает человек Свириденко."
 ukraine_politics.410.b:0 "Оксана Маркарова: компромисс, который устроит всех понемногу."
 ukraine_politics.410.c:0 "Данило Гетманцев: выбор президента."
 ukraine_politics.411.t:0 "Лицо страны за границей"
 ukraine_politics.411.d:0 "Следующий вопрос - министерство иностранных дел, где за каждое слово отвечает вся страна. Свириденко хочет, чтобы Украина говорила с партнёрами языком программ и сроков, а президент - чтобы партнёры слышали то же самое, что слышит он сам.\n\nОльга Стефанишина ведёт евроинтеграцию и знает наизусть главы, по которым Брюссель задаёт вопросы чаще всего. Андрей Сибига - дипломат из окружения президента: между ним и Банковой нет посредников, а значит, нет и сюрпризов. Павел Климкин возглавлял МИД в 2014-2019 годах и помнит переговоры «нормандского формата» не по пресс-релизам. Его слушают на Западе, но решения он принимает сам, и это не всем по душе."
 ukraine_politics.411.a:0 "Ольга Стефанишина: евроинтеграция как профессия."
 ukraine_politics.411.b:0 "Андрей Сибига: человек из окружения президента."
 ukraine_politics.411.c:0 "Павел Климкин: опытный дипломат без политических долгов."
 ukraine_politics.412.t:0 "Человек в погонах"
 ukraine_politics.412.d:0 "МВД - это не только полиция, но и половина разговоров о том, кто в стране на самом деле решает. Свириденко предлагает кандидатов, которых можно назвать профессионалами, а президент добавляет, что профессионалы тоже должны отвечать на звонки.\n\nЭка Згуладзе известна реформой патрульной полиции: после неё у людей появилась привычка ждать от патрульного вежливости. Игорь Клименко - профессиональный полицейский, привыкший к дисциплине и субординации, и конфликтов с кабинетом от него ждать не стоит. Денис Монастырский знает систему изнутри и проходит по списку президента без лишних вопросов. Министры из реформаторского лагеря спорят чаще, чем хотелось бы Офису."
 ukraine_politics.412.a:0 "Эка Згуладзе: реформа важнее субординации."
 ukraine_politics.412.b:0 "Денис Монастырский: человек, которого знают на Банковой."
 ukraine_politics.412.c:0 "Игорь Клименко: профессионал без политических амбиций."
 ukraine_politics.413.t:0 "Тот, кто знает чужие секреты"
 ukraine_politics.413.d:0 "Василий Малюк: контрразведка без лишних слов."
 ukraine_politics.413.a:0 "Юрий Щиголь: киберщит государства."
 ukraine_politics.413.b:0 "Иван Баканов: старый друг, которому можно доверять."
 ukraine_politics.413.c:0 "Кирилл Буданов: военная разведка с авторитетом в армии."
 ukraine_politics.414.t:0 "Вторая линия"
 ukraine_politics.414.d:0 "Министры назначены, и тут выясняется, что у каждого из них есть заместители, которых тоже кто-то должен утвердить. Свириденко предлагает привести людей из своей среды: цифровиков, торговых переговорщиков, управленцев из агентств. Президент замечает, что каждый новый самостоятельный игрок - это ещё одна точка, где решения кабинета превращаются из приказа в тему для обсуждения.\n\nМихаил Фёдоров остаётся во главе цифровой трансформации и, скорее всего, возьмёт с собой Александра Борнякова и торгового представителя Тараса Качку. Чем шире команда, тем больше в правительстве людей, которые умеют работать без согласования, и тем меньше у Офиса способов остановить их одним звонком. Это стоит политического капитала, зато вместе они двигают дела быстрее."
 ukraine_politics.414.a:0 "Только Фёдоров и ближний круг."
 ukraine_politics.414.b:0 "Фёдоров, Борняков и Качка: средняя команда."
 ukraine_politics.414.c:0 "Широкий десант технократов в министерства и агентства."
 ukraine_politics.540.t:0 "Кто возглавит правительство"
 ukraine_politics.540.d:0 "Левая коалиция получила министра экономики и сразу упёрлась в вопрос, который в Украине не любят задавать вслух: кому принадлежит кабинет? Действующий премьер готов остаться, но профсоюзы напоминают, что их люди ходят на митинги, а не на заседания комитетов. Предлагают двух лидеров: председателя Федерации профсоюзов Украины Григория Осового и председателя Конфедерации свободных профсоюзов Михаила Волынца.\n\nМежду собой они ладят хуже, чем с любой властью: ФПУ привыкла вести переговоры с каждым составом Рады, КВПУ привыкла ставить условия. Если вы раньше работали с ФПУ, Осовый придёт с готовым списком министров, а Волынец откажется сидеть с теми, кто делил имущество профсоюзов. Если держались от ФПУ подальше, будет наоборот. В любом случае премьер из профсоюзов - это премьер, которого не снять одним звонком."
 ukraine_politics.540.a:0 "Григорий Осовый: профсоюзный стаж и опыт переговоров."
 ukraine_politics.540.a_no:0 "Григорий Осовый отказывается: ФПУ не верит обещаниям Офиса."
 ukraine_politics.540.b:0 "Михаил Волынец: независимый профсоюз во главе правительства."
 ukraine_politics.540.b_no:0 "Михаил Волынец отказывается: за одним столом с ФПУ он сидеть не станет."
 ukraine_politics.540.c:0 "Оставить действующего премьера."
 ukraine_politics.541.t:0 "Лицо коалиции за границей"
 ukraine_politics.541.d:0 "Левой коалиции в Брюсселе нужен переводчик: слово «левые» в Европе читают по-разному, и не всегда с радостью. Ольга Стефанишина умеет говорить о трудовых правах на языке директив ЕС, а Ханна Гопко известна работой в комитете Рады по иностранным делам и привычкой не говорить «да» из вежливости.\n\nОбе придут только в правительство, которое не ссорится с Европой: замороженная помощь или захваченные суды закроют перед ними дверь. Действующий министр остаётся запасным вариантом: опытный человек, с которым кабинет знает, чего ожидать, хотя энтузиазма от него по поводу трудового кодекса ждать не стоит."
 ukraine_politics.541.a:0 "Ольга Стефанишина: трудовые права на языке директив ЕС."
 ukraine_politics.541.a_no:0 "Ольга Стефанишина отказывается: при замороженной помощи ЕС она не придёт."
 ukraine_politics.541.b:0 "Ханна Гопко: независимый голос в иностранных делах."
 ukraine_politics.541.b_no:0 "Ханна Гопко отказывается: захваченные суды или замороженная помощь закрывают ей дверь."
 ukraine_politics.541.c:0 "Оставить действующего министра."
 ukraine_politics.542.t:0 "Закон или громкое заявление"
 ukraine_politics.542.d:0 "МВД в левой коалиции - вопрос доверия не только к полиции, но и к самой коалиции. Руслан Рябошапка и Виталий Касько приходят из прокуратуры с репутацией реформаторов; оба согласятся лишь при независимых антикоррупционных органах и судах, которые не говорят голосом Банковой. Олег Ляшко, публичный политик с резкой риторикой, согласится сразу и, судя по его манере, объяснит это в эфире.\n\nПервые двое дороже и тише, но их назначение читается в Брюсселе как знак. Третий дешевле и громче: шум достанется и Раде, и европейским партнёрам. Действующий министр, как обычно, ничего не обещает и ничего не требует."
 ukraine_politics.542.a:0 "Руслан Рябошапка: реформатор из прокуратуры."
 ukraine_politics.542.a_no:0 "Руслан Рябошапка отказывается: без защиты антикоррупционных органов он не придёт."
 ukraine_politics.542.b:0 "Виталий Касько: судебная реформа важнее скорости."
 ukraine_politics.542.b_no:0 "Виталий Касько отказывается: антикоррупционные органы подчинены или суды захвачены."
 ukraine_politics.542.c:0 "Олег Ляшко: дёшево и очень заметно."
 ukraine_politics.542.e:0 "Оставить действующего министра."
 ukraine_politics.543.t:0 "Армия не для посредников"
 ukraine_politics.543.d:0 "В программе левых оборона стоит рядом с социальной политикой: армия не должна кормить посредников. Андрей Загороднюк, бывший министр обороны, давно говорит о прозрачных закупках и гражданском контроле, и в такой программе он выглядит естественно.\n\nОн вернётся, если коалиция не станет заменять профсоюзы ветеранскими советами и не потянет армию в политику. Действующий министр готов остаться: с ним понятно, чего ждать, а вот чего ждать от остальных, пока никто не знает."
 ukraine_politics.543.a:0 "Андрей Загороднюк: прозрачные закупки и гражданский контроль."
 ukraine_politics.543.a_no:0 "Андрей Загороднюк отказывается: ветеранские советы вместо профсоюзов и политизация армии ему не подходят."
 ukraine_politics.543.b:0 "Оставить действующего министра обороны."
 ukraine_politics.544.t:0 "Вторая линия левых"
 ukraine_politics.544.d:0 "Министры названы, и сразу выясняется, что у каждого из них есть люди, без которых коалиция превратится в кабинет из шести человек. Захар Попович и Оксана Дутчак из круга «Соціального руху» умеют говорить о труде без лозунгов. К ним можно добавить историка Тараса Билоуса и Мустафу Найема, занимавшегося восстановлением и закупками, а в широкой команде - депутатов Инну Совсун, Лесю Василенко и Александру Устинову.\n\nЧем шире команда, тем больше в правительстве людей, которые не подчиняются ни Банковой, ни ФПУ, и тем труднее Офису остановить их одним звонком. Зато общество, стабильность и борьба с бедностью получают больше. Каждый такой самостоятельный игрок снижает прирост политсилы на 1%."
 ukraine_politics.544.a:0 "Только Попович и Дутчак."
 ukraine_politics.544.b:0 "Попович, Дутчак, Билоус и Найем: средняя команда."
 ukraine_politics.544.c:0 "Широкая команда: ещё Совсун, Василенко и Устинова."
 ukraine_politics.544.e:0 "Без второй линии: министры справятся сами."
 ukraine_politics.545.t:0 "Красная линия в кабинете"
 ukraine_politics.545.d:0 "Партийная линия на практике означает вопрос, на который никто не любит отвечать: кто в правительстве читает решения партии, а кто экономический план? Пётр Симоненко, лидер Коммунистической партии Украины, приходит с готовым списком отраслей и людей. Для партии это возвращение в большую политику, для Европы - повод пересчитать, что здесь называют левыми.\n\nДудин готов остаться и без портфеля: он напоминает, что «Соціальний рух» создавался не для этого. Решите, кто будет считать, а кто объяснять."
 ukraine_politics.545.a:0 "Пётр Симоненко возглавит экономику, Дудин уходит в Раду."
 ukraine_politics.545.b:0 "Дудин остаётся министром."
 UKR_osovyi:0 "Григорий Осовый"
 UKR_volynets:0 "Михаил Волынец"
 UKR_symonenko:0 "Пётр Симоненко"
 UKR_hopko:0 "Ханна Гопко"
 UKR_ryaboshapka:0 "Руслан Рябошапка"
 UKR_kasko:0 "Виталий Касько"
 UKR_lyashko:0 "Олег Ляшко"
 UKR_left_team_narrow:0 "Ядро «Соціального руху»"
 UKR_left_team_narrow_desc:0 "Несколько человек из круга активистов и исследователей труда, которые знают, как работает профсоюз, и не путают лозунг с законопроектом. Небольшая команда, зато без лишних споров в коридорах."
 UKR_left_team_medium:0 "Команда левых"
 UKR_left_team_medium_desc:0 "К активистам присоединяются историк и человек, занимавшийся восстановлением и закупками. Команда уже не помещается в одну комнату, и это видно по числу совещаний."
 UKR_left_team_wide:0 "Широкая левая коалиция в министерствах"
 UKR_left_team_wide_desc:0 "Активисты, учёные и депутаты-реформаторы в министерствах и агентствах. Они редко согласны друг с другом и ещё реже согласны с Банковой, зато общество, стабильность и борьба с бедностью получают заметно больше."
 # Блок 3, левые (DESIGN.md, 8.2)
 UKR_l_left_coalition:0 "Левая коалиция"
 UKR_l_left_coalition_desc:0 "Второй срок держится на левом крыле Рады: социал-демократах, зелёных левых и профсоюзных депутатах. Министром социальной политики и труда становится юрист-трудовик Виталий Дудин из «Соціального руху». Капитал нервничает, а Рада впервые за годы чувствует себя хозяином. Для Банковой это расчёт, а не убеждения: президент выбирает ту опору, которая сейчас сильнее всех остальных."
 UKR_l_union_alliance:0 "Союз с профсоюзами"
 UKR_l_union_alliance_desc:0 "Профсоюзы - единственная массовая организация, которая есть в каждом городе и на каждом заводе. Правительство садится с ними за стол как с партнёром, а не как с просителем."
 UKR_l_labour_code:0 "Трудовой кодекс"
 UKR_l_labour_code_desc:0 "Старый кодекс писали ещё при Союзе, проекты новых - под диктовку работодателей. Теперь пишем свой: зарплаты, отпуска, защита от увольнений."
 UKR_l_welfare_state:0 "Социальное государство"
 UKR_l_welfare_state_desc:0 "Пенсии, больницы, школы и жильё - не «расходы», а основа, на которой страна выстоит в войну. Бюджет это почувствует."
 UKR_l_oligarch_audit:0 "Аудит олигархических активов"
 UKR_l_oligarch_audit_desc:0 "Прежде чем что-то забирать, надо знать, что кому принадлежит. Государственный аудит проверяет, как приватизировались заводы, шахты и сети."
 UKR_l_strategic_sectors:0 "Национализация стратегических отраслей"
 UKR_l_strategic_sectors_desc:0 "Металлургия, энергетика, нефть и химия - отрасли, без которых не выстоять в войну. Государство забирает контроль над ними. Владельцы обещают судиться, а Брюссель хмурится."
 UKR_l_cooperative_sector:0 "Кооперативный сектор"
 UKR_l_cooperative_sector_desc:0 "Часть предприятий переходит к трудовым коллективам. Первые годы будут трудными: учиться управлять заводом приходится на ходу."
 UKR_l_army_not_for_oligarchs:0 "Армия не для олигархов"
 UKR_l_army_not_for_oligarchs_desc:0 "Ветераны АТО говорят прямо: воевать за Родину - да, за чужие заводы - нет. Армия получает социальные гарантии, а солдат - понимание, что защищает своё."
 UKR_l_veteran_cooperatives:0 "Ветеранские кооперативы"
 UKR_l_veteran_cooperatives_desc:0 "Ветераны получают землю, мастерские и кредиты, чтобы работать вместе. Кто держал оборону плечом к плечу, тот и дело ведёт так же."
 UKR_l_union_territorial_defense:0 "Профсоюзная тероборона"
 UKR_l_union_territorial_defense_desc:0 "Заводские ячейки теробороны организуются через профсоюзы: люди знают друг друга, знают цеха и знают, что защищать."
 UKR_l_social_democracy:0 "Социал-демократия"
 UKR_l_social_democracy_desc:0 "Путь профсоюзов и социалистов: сильное социальное государство в рамках рыночной экономики, «скандинавская модель» по-украински. Европа это понимает и одобряет."
 UKR_l_self_management:0 "Самоуправление"
 UKR_l_self_management_desc:0 "Путь анархистов и независимых профсоюзов: рабочие советы, кооперативы и самоорганизация на местах. Экономика стартует медленнее, зато общество, которое умеет само себя организовать, трудно сломить."
 UKR_l_orthodox_left:0 "Ортодоксальные левые"
 UKR_l_orthodox_left_desc:0 "Путь радикальных коммунистов: партийная дисциплина, план и твёрдая рука. Быстро и эффективно, но слишком многое в этом языке звучит как из Москвы."
 UKR_l_social_dialogue:0 "Трёхсторонний социальный диалог"
 UKR_l_social_dialogue_desc:0 "Правительство, профсоюзы и работодатели договариваются за одним столом. Рада и Банковая перестают тянуть канат и садятся рядом."
 UKR_l_welfare_economy:0 "Экономика благосостояния"
 UKR_l_welfare_economy_desc:0 "Итог экономических реформ: олигархический капитализм уступает место рыночной экономике с сильными социальными гарантиями."
 UKR_l_workers_councils_focus:0 "Рабочие советы"
 UKR_l_workers_councils_focus_desc:0 "Советы трудовых коллективов получают реальную власть на предприятиях и в громадах. Профсоюзная тероборона становится народной самообороной."
 UKR_l_cooperative_economy:0 "Кооперативная экономика"
 UKR_l_cooperative_economy_desc:0 "Итог экономических реформ: вместо олигархов - трудовые коллективы, вместо холдингов - кооперативы."
 UKR_l_party_line:0 "Партийная линия"
 UKR_l_party_line_desc:0 "Дисциплина превыше дискуссий. Решения принимаются быстро, несогласные уходят. Социалисты недовольны, но их никто не спрашивает."
 UKR_l_gosplan:0 "Госплан 2.0"
 UKR_l_gosplan_desc:0 "Итог экономических реформ: национализированные отрасли сводятся в единый государственный план. Работает быстро - пока работает."
 UKR_l_republic_of_labour:0 "Республика труда"
 UKR_l_republic_of_labour_desc:0 "Олигархическая Украина осталась в прошлом. Страна, которая встречает войну, принадлежит тем, кто работает и воюет. Какой она стала - решил выбранный путь."
 UKR_dudin:0 "Виталий Дудин"
 UKR_capital_flight:0 "Бегство капитала"
 UKR_capital_flight_desc:0 "Инвесторы не любят слово «национализация». Часть денег уходит за границу, стройки замедляются."
 UKR_union_partnership:0 "Партнёрство с профсоюзами"
 UKR_union_partnership_desc:0 "Профсоюзы - партнёры правительства. Забастовки редки, потому что вопросы решаются раньше."
 UKR_welfare_state:0 "Социальное государство"
 UKR_welfare_state_desc:0 "Государство берёт на себя пенсии, здравоохранение и жильё. Дорого, но люди знают, за что держатся."
 UKR_state_sector:0 "Государственный сектор"
 UKR_state_sector_desc:0 "Стратегические отрасли под контролем государства. Производство растёт, партнёры за рубежом насторожены."
 UKR_cooperative_sector:0 "Кооперативный сектор: первые годы"
 UKR_cooperative_sector_desc:0 "Трудовые коллективы учатся управлять предприятиями. Пока больше собраний, чем продукции."
 UKR_cooperative_sector_mature:0 "Кооперативный сектор"
 UKR_cooperative_sector_mature_desc:0 "Кооперативы окрепли: работники знают своё дело и держатся за своё предприятие."
 UKR_army_not_for_oligarchs:0 "Армия не для олигархов"
 UKR_army_not_for_oligarchs_desc:0 "Солдат знает, что защищает свою землю и своих людей, а не чужие активы."
 UKR_veteran_cooperatives:0 "Ветеранские кооперативы"
 UKR_veteran_cooperatives_desc:0 "Ветераны работают вместе и готовы вернуться в строй вместе."
 UKR_union_territorial_defense:0 "Профсоюзная тероборона"
 UKR_union_territorial_defense_desc:0 "Заводские отряды теробороны, организованные через профсоюзы."
 UKR_peoples_self_defense:0 "Народная самооборона"
 UKR_peoples_self_defense_desc:0 "Рабочие советы и громады сами организуют оборону своих городов и заводов."
 UKR_nordic_model:0 "«Скандинавская модель»"
 UKR_nordic_model_desc:0 "Социальное государство, сильные профсоюзы и договорённости вместо конфликтов. В Брюсселе это понимают."
 UKR_workers_councils:0 "Рабочие советы"
 UKR_workers_councils_desc:0 "Решения принимаются снизу. Медленно, зато люди за них держатся."
 UKR_party_discipline:0 "Партийная дисциплина"
 UKR_party_discipline_desc:0 "Твёрдая линия и никаких дискуссий. Эффективно, но партнёры на Западе смотрят с подозрением."
 UKR_red_doubt:0 "«С кем мы воюем?»"
 UKR_red_doubt_desc:0 "Часть левых сомневается, нужно ли воевать с «красной» Россией. Кремлёвская пропаганда подливает масла в огонь. Сомнения растут вместе с силой ортодоксов внутри коалиции: чем сильнее они, тем громче вопрос. Растут коммунисты и Союз левых сил, «Слуга народа» теряет. В войне вместе с сомнениями растёт усталость общества."
 UKR_republic_of_labour:0 "Республика труда"
 UKR_republic_of_labour_desc:0 "Страна принадлежит тем, кто работает и воюет."
 UKR_social_contract:0 "Общественный договор"
 UKR_social_contract_desc:0 "Правительство левой коалиции договаривается с профсоюзами, забирает у олигархов стратегические активы и строит социальное государство. Власть делят Рада и Банковая, и шкала показывает, кто сейчас сильнее.\n\n§YЛевые группы в коалиции:§!\nПрофсоюзы: §Y[?UKR_lf_unions|0]§!\nСоциалисты: §Y[?UKR_lf_socialists|0]§!\nАнархисты: §Y[?UKR_lf_anarchists|0]§!\nРадикальные коммунисты: §Y[?UKR_lf_communists|0]§!"
 UKR_lc_collective_agreements:0 "Отраслевые коллективные договоры"
 UKR_lc_collective_agreements_desc:0 "Профсоюзы и работодатели подписывают договоры по отраслям: зарплаты, смены, охрана труда."
 UKR_lc_progressive_tax:0 "Прогрессивный налог"
 UKR_lc_progressive_tax_desc:0 "Плоская шкала уходит в прошлое: кто больше зарабатывает, тот больше и платит. Богатые области недовольны."
 UKR_lc_veteran_housing:0 "Земля и жильё ветеранам АТО"
 UKR_lc_veteran_housing_desc:0 "Обещание, которое давали много лет, наконец выполняется: ветераны получают землю и квартиры."
 UKR_lc_workers_cooperative:0 "Рабочий кооператив на заводе"
 UKR_lc_workers_cooperative_desc:0 "Ещё одно предприятие переходит к трудовому коллективу."
 UKR_lc_nationalize_metinvest:0 "Национализация «Метинвеста» (Ахметов)"
 UKR_lc_nationalize_metinvest_desc:0 "Металлургические комбинаты группы Рината Ахметова переходят под контроль государства. Владелец обещает оспорить решение в международных судах."
 UKR_lc_nationalize_dtek:0 "Национализация ДТЭК (Ахметов)"
 UKR_lc_nationalize_dtek_desc:0 "Электростанции и сети энергетического холдинга Рината Ахметова переходят государству. Тарифы замораживаются, акционеры возмущены."
 UKR_lc_nationalize_ukrnafta:0 "Национализация «Укрнафты» и «Укртатнафты»"
 UKR_lc_nationalize_ukrnafta_desc:0 "Государство забирает полный контроль над нефтедобычей и Кременчугским НПЗ, которыми годами управляли менеджеры группы «Приват». В группе называют это рейдерством."
 UKR_lc_nationalize_ostchem:0 "Национализация азотных заводов и облгазов (Фирташ)"
 UKR_lc_nationalize_ostchem_desc:0 "Химические заводы и региональные газовые сети, связанные с Дмитрием Фирташем, переходят государству. Его юристы готовят иски."
 UKR_lc_nationalize_media:0 "Национализация олигархических телеканалов"
 UKR_lc_nationalize_media_desc:0 "«1+1», «Интер» и каналы StarLightMedia переходят в общественную собственность. Олигархи теряют рупор, а Банковая получает новый. Журналисты встревожены."
 UKR_lc_general_strike:0 "Всеобщая забастовка"
 UKR_lc_general_strike_desc:0 "Профсоюзы выводят людей на улицы, чтобы напомнить Банковой, на ком держится коалиция."
 UKR_lc_presidential_decree:0 "Указ президента"
 UKR_lc_presidential_decree_desc:0 "Офис президента решает вопрос указом, не дожидаясь Рады. Быстро, но союзники это запомнят."
 UKR_left_dualism_balance:0 "Двоевластие: Рада и Банковая"
 UKR_left_dualism_balance_desc:0 "Президент победил, но правит с опорой на левую коалицию в Раде. Кто сильнее - парламент с профсоюзами или Офис президента?"
 UKR_bop_rada:0 "Рада и профсоюзы"
 UKR_bop_bankova:0 "Банковая"
 UKR_bop_compromise:0 "Рабочий компромисс"
 UKR_bop_rada_leads:0 "Рада ведёт"
 UKR_bop_rada_dominates:0 "Парламентское большинство диктует"
 UKR_bop_rada_takes_government:0 "Рада забирает правительство"
 UKR_bop_bankova_leads:0 "Банковая ведёт"
 UKR_bop_bankova_dominates:0 "Вертикаль Офиса президента"
 UKR_bop_coalition_breaking:0 "Коалиция на грани"
 UKR_left_dualism_start_tt:0 "Открывает шкалу §YДвоевластие: Рада и Банковая§!."
 UKR_lf_unions_up_tt:0 "§GПрофсоюзы§! становятся сильнее в коалиции."
 UKR_lf_socialists_up_tt:0 "§GСоциалисты§! становятся сильнее в коалиции."
 UKR_lf_anarchists_up_tt:0 "§GАнархисты§! становятся сильнее в коалиции."
 UKR_lf_communists_up_tt:0 "§GРадикальные коммунисты§! становятся сильнее в коалиции."
 UKR_lf_radicals_up_tt:0 "§GАнархисты§! и §Gрадикальные коммунисты§! становятся сильнее в коалиции."
 UKR_lf_all_down_tt:0 "Все левые группы в коалиции §Rослабевают§!."
 UKR_oligarch_audit_tt:0 "Открывает решения о §Yнационализации§! в окне «Общественный договор»."
 UKR_european_influence_down_tt:0 "Европейское влияние §Rснижается§!."
