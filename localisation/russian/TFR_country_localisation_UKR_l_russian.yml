 UKR_asgard_defense_network:0 "Сеть ПВО «Асгард»"
 UKR_offensive_momentum:0 "Наступательный импульс"
 UKR_azov_steel_operations:0 "Операции сил специального назначения"

 # Подсказки для механик
 UKR_rapid_armored_thrust_tooltip:0 "§YБронетанковые и механизированные дивизии получат значительные тактические преимущества, повышающие их мобильность и ударную мощь.§!"
 UKR_bayraktar_strike_tooltip:0 "§YТочные удары беспилотников ослабят оборонительные возможности противника и снизят эффективность его систем ПВО.§!"
 UKR_nato_intel_tooltip:0 "§YРазведывательная информация от союзников повысит нашу тактическую осведомленность и эффективность управления войсками, а также выявит уязвимости противника.§!"
 UKR_night_raids_tooltip:0 "§YСпециальные операции в ночное время обеспечат тактическое преимущество нашим силам и подорвут моральный дух противника.§!"
 UKR_strategic_triangle_tooltip:0 "§YСоздание укрепленного оборонительного района обеспечит значительные преимущества в обороне ключевых городов и улучшит логистику внутри периметра.§!"
 UKR_asgard_tooltip:0 "§YМодернизированная система ПВО повысит защищенность наших войск и объектов от воздушных ударов противника.§!"
 UKR_serpents_path_tooltip:0 "§YНаступательная операция позволит нашим войскам эффективнее преодолевать оборону противника и продвигаться на вражеской территории.§!"
 UKR_azov_operation_tooltip:0 "§YДействия специальных подразделений в тылу врага нарушат его коммуникации, деморализуют личный состав и создадут благоприятные условия для основных сил.§!"

 #BLR
 UKR_idea_belarus_cooperation:0 "Украинско-Белорусское сотрудничество"
 UKR_idea_belarus_cooperation_desc:0 "После демократических перемен в Беларуси наши страны начали новую главу взаимоотношений. Общие вызовы и стремление к независимости от влияния России сближают наши народы. Совместные экономические проекты уже приносят плоды, а культурный обмен укрепляет историческое братство."

 UKR_belarus_military_cooperation:0 "Военное сотрудничество с Беларусью"
 UKR_belarus_military_cooperation_desc:0 "Наши вооруженные силы проводят совместные учения и обмениваются опытом. Общая граница требует координации в вопросах обороны, а единые стандарты подготовки повышают боеготовность обеих армий. Создание надежного северного фланга значительно укрепляет нашу безопасность."

 ukraine_belarus_friendship_initial:0 "Украинско-Белорусская дружба"
 ukraine_belarus_friendship_initial_desc:0 "Первые шаги к стратегическому партнерству с новой демократической Беларусью заложили основу для долгосрочного сотрудничества. Наши народы, связанные общим славянским наследием, заново открывают друг друга."

 ukraine.500.t:0 "Новая глава в отношениях с Беларусью"
 ukraine.500.d:0 "Политические изменения в Беларуси открывают перед нами уникальное окно возможностей. После десятилетий авторитарного правления Лукашенко, новое руководство страны смотрит на Запад, а не на Восток. Наши дипломаты сообщают о беспрецедентной открытости белорусских коллег к диалогу. Министерство иностранных дел предлагает начать новую главу отношений с северным соседом. Предварительные консультации указывают на возможность создания прочного партнерства в экономической, культурной и, возможно, оборонной сферах. Историческая связь между нашими народами, всегда существовавшая вопреки политическим барьерам, может стать фундаментом нового союза.\n\nАналитики отмечают потенциальные экономические выгоды: восстановление нарушенных цепочек поставок, доступ к новым рынкам и более эффективное использование транзитного потенциала обеих стран. Особенно заманчивы перспективы энергетического сотрудничества и интеграции транспортных коридоров. \n\nОднако некоторые скептики в военных кругах предупреждают о возможной нестабильности в Беларуси и рисках преждевременного сближения. Россия наверняка воспримет наш союз как прямой вызов своим интересам, что может обострить и без того напряженную ситуацию в регионе." 

 ukraine.500.a:0 "Протянуть руку дружбы Беларуси"
 ukraine.500.b:0 "Сейчас не время для экспериментов"

 ukraine.501.t:0 "Углубление сотрудничества с Беларусью"
 ukraine.501.d:0 "За прошедшие месяцы наши отношения с новой демократической Беларусью значительно окрепли. Регулярные встречи на высшем уровне и растущий объем торговли свидетельствуют об успехе выбранного курса. Символичным жестом стало открытие памятника великому белорусскому поэту Янке Купале в Киеве и Тарасу Шевченко в Минске.\n\nТеперь перед нами открывается возможность для качественно нового этапа сотрудничества - в военной сфере. Министерство обороны представило амбициозный план совместных действий, включающий регулярные учения, обмен военными специалистами и создание координационного совета по вопросам безопасности границ.\n\nОсобое внимание уделяется противовоздушной обороне. Наши эксперты разработали схему совместного использования радарных систем, что позволит значительно увеличить время раннего предупреждения о возможных угрозах с воздуха. Для Беларуси это особенно важно, учитывая ограниченные ресурсы их восстанавливающейся армии. Проект предусматривает также создание совместного учебного центра, где военнослужащие обеих стран будут перенимать опыт современной войны.\n\nНе все в нашем руководстве поддерживают такое тесное военное сотрудничество. Существуют опасения, что это может быть воспринято как формирование антироссийского блока и спровоцировать жесткую реакцию Кремля. Кроме того, остаются вопросы о стабильности нового правительства Беларуси и его способности противостоять внешнему давлению."

 ukraine.501.a:0 "Создать военный альянс с Беларусью"
 ukraine.501.b:0 "Ограничимся экономическим сотрудничеством"

 ukraine.502.t:0 "Новая страница в отношениях с Беларусью"
 ukraine.502.d:0 "После подписания мирного договора, Беларусь вновь обрела полную независимость. Наши народы, связанные общей историей и недавним противостоянием, имеют уникальную возможность начать отношения с чистого листа. Посольства обеих стран возобновили свою работу, пограничные пункты открыты для свободного перемещения граждан. Наши экономисты и инженеры уже обсуждают совместные проекты по восстановлению инфраструктуры и промышленности, пострадавших в ходе конфликта. Многие эксперты считают, что тесное сотрудничество между нашими странами не только ускорит процесс восстановления, но и станет гарантией безопасности перед лицом возможных будущих угроз с востока."
 ukraine.502.a:0 "Развивать полномасштабное сотрудничество в восстановлении"
 ukraine.502.b:0 "Сосредоточимся на восстановлении своими силами"
 belarus_mutual_defense_pact_tooltip:0 "Украина и Беларусь начинают программу совместного восстановления"

 UKR_idea_belarus_construct:0 "Братское восстановление"
 UKR_idea_belarus_construct_desc:0 "Пережив годы конфликта, Украина и Беларусь объединили свои усилия для возрождения из пепла войны. Совместные проекты по восстановлению инфраструктуры, обмен технологиями и координация экономических программ позволяют обеим странам эффективнее преодолевать последствия разрушений. Народы, связанные общей историей и недавней борьбой, создают новый фундамент сотрудничества - не из политических амбиций, а из искреннего желания построить мирное и процветающее будущее для следующих поколений."

 #Secret Operation
 UKR_military_budget_expansion:0 "Укрепление спецслужб и военной разведки"
 UKR_military_budget_expansion_desc:0 "В условиях продолжающейся гибридной войны с агрессором критически важно усилить наши оборонные возможности. Основной акцент будет сделан на поддержку ключевых разведывательных подразделений: Главное управление разведки, Силы специальных операций, подразделения технической разведки и БПЛА. Приоритетом станет развитие системы специальных операций, усиление разведывательного потенциала спецслужб с особым вниманием к подготовке агентов глубокого внедрения. Полномочия ключевых подразделений существенно расширяются в части проведения автономных специальных операций и информационной безопасности. Каждый вложенный ресурс - это дополнительный шанс защитить государственный суверенитет. Наш девиз: Информация - оружие, разведка - щит национальной безопасности."

 UKR_shadow_war_capabilities:0 "Асимметричное противодействие агрессору"
 UKR_shadow_war_capabilities_desc:0 "Война в тени - повседневная реальность украинских специальных подразделений. Чем больше территорий захватывает агрессор, тем сильнее становится сопротивление. Каждый новый километр оккупированной земли рождает десятки скрытых ячеек сопротивления, формирует разветвленную сеть подпольных организаций. Силы специальных операций имеют стратегические задачи глубокой разведки противника, проведения диверсионных акций, нарушения вражеских коммуникаций и сбора критически важной стратегической информации. Национальный дух непокоренности - наше главное оружие. Структура подразделений включает элитные группы специального назначения, подразделения морской пехоты и высокомобильные десантные войска. Наша стратегическая цель - превратить каждый клочок оккупированной земли в пространство непредсказуемости и риска для противника."

 UKR_budget_military_expansion_tooltip:0 "§HПереоснащение и усиление специальных подразделений даст больше возможностей противостояния вражеским информационным, дипломатическим и разведывательным влияниям§!"
 UKR_shadow_war_special_ops_tooltip:0 "§HРасширение возможностей асимметричной войны обеспечит поддержку независимых и освободительных сил в противостоянии агрессорам, создаст разветвленную сеть контактов и каналов влияния§!"

 UKR_increased_funding_agency:0 "Расширение разведывательного потенциала"
 UKR_increased_funding_agency_desc:0 "Целевое финансирование и поддержка специальных служб позволяет существенно нарастить разведывательный потенциал страны. Создаются благоприятные условия для быстрого формирования агентурных сетей, подготовки специалистов высокого класса и проведения сложных специальных операций. Каждый дополнительный ресурс, вложенный в разведку, многократно окупается стратегической информацией и возможностью упреждающих действий."
 
 UKR_shadow_war_category:0 "Война в тенях"  
 UKR_shadow_war_category_desc:0 "Гибридные конфликты определяют новую реальность международной политики. Украина, столкнувшись с агрессией и дестабилизацией, принимает меры по противодействию скрытому влиянию и угрозам со стороны РФ. Война в тенях разворачивается на всех уровнях: от тайных спецопераций и разведывательных миссий до дипломатических маневров и поддержки независимых государств СНГ. Эти решения позволят укрепить позиции Украины, обеспечить стратегическое преимущество и защитить национальные интересы."  

 UKR_support_central_asian_resistance_KAZ:0 "Стратегическая военная солидарность с Казахстаном"
 UKR_support_central_asian_resistance_KAZ_desc:0 "Молниеносные военные поставки и экспертная поддержка создают невидимый щит государственного суверенитета. Через специальные каналы передаются критически важные разведданные, современное оборудование и стратегические консультации высшему руководству страны. Наша цель - укрепить обороноспособность и помочь сохранить независимость в условиях нарастающих геополитических вызовов."

 UKR_support_central_asian_resistance_UZB:0 "Экспертная военная поддержка Узбекистана"
 UKR_support_central_asian_resistance_UZB_desc:0 "Скрытые военные коридоры обеспечивают быструю передачу стратегических вооружений и разведывательной информации. Специальные группы военных экспертов готовы моментально предоставить консультационную поддержку руководству страны. Каждый канал связи, каждая поставка - это шаг к укреплению национальной безопасности и независимости."

 UKR_support_central_asian_resistance_TMS:0 "Тактическая военная поддержка Туркменистана"
 UKR_support_central_asian_resistance_TMS_desc:0 "Невидимая сеть военной солидарности охватывает стратегические направления государственной безопасности. Современные системы вооружения, передовая разведывательная информация и моментальная экспертная поддержка готовы защитить суверенитет страны в критический момент."

 UKR_support_central_asian_resistance_TAJ:0 "Оперативная военная защита Таджикистана"
 UKR_support_central_asian_resistance_TAJ_desc:0 "Быстрые военные поставки и глубокая разведывательная поддержка создают надежный заслон внешним угрозам. Специализированные группы военных экспертов готовы моментально предоставить стратегические консультации руководству страны, обеспечивая максимальную готовность к любым сценариям."

 UKR_support_central_asian_resistance_KYR:0 "Комплексная военная солидарность с Кыргызстаном"
 UKR_support_central_asian_resistance_KYR_desc:0 "Многоуровневая система военной поддержки включает молниеносные поставки современного вооружения, передачу критических разведданных и готовность немедленно предоставить стратегические консультации. Каждый канал связи - это дополнительный потенциал для защиты национальных интересов."

 UKR_support_central_asian_resistance_GEO:0 "Скрытное стратегическое противодействие российской агрессии в Грузии"
 UKR_support_central_asian_resistance_GEO_desc:0 "Тайные разведывательные подразделения осуществляют предельно скрытную операцию по передаче критической информации. Специальные группы анализируют военные риски, готовят детальные планы сопротивления, передают разведданные о потенциальных вторжениях. Каждый перехваченный документ, каждый анонимный канал связи наносит точечный удар по российской военной машине. Операция проводится максимально анонимно, без официальных заявлений и публичных контактов."

 UKR_support_central_asian_resistance_AZR:0 "Негласное противодействие территориальным притязаниям в Азербайджане"
 UKR_support_central_asian_resistance_AZR_desc:0 "Глубоко законспирированные группы специалистов создают стратегические барьеры против потенциальной военной агрессии. Через зашифрованные каналы передаются разведданные о военных перемещениях, готовятся упреждающие стратегии защиты государственных границ. Каждый перехваченный план российской армии - это крупица тайной войны за суверенитет."

 UKR_support_central_asian_resistance_ARM:0 "Теневое сдерживание военной угрозы в Армении"
 UKR_support_central_asian_resistance_ARM_desc:0 "Операция полностью скрытного сопровождения национальной безопасности. Аналитические группы в режиме абсолютной секретности отслеживают военные риски, готовят стратегии сопротивления. Каждый переданный сигнал - невидимый удар по российской военной стратегии, без официальных документов и публичных следов."
 
 #29.09 War
 # Основная категория военного настроения
 
 # Решения для контроля ненависти
 UKR_control_war_atrocities:0 "Контроль военных преступлений"
 UKR_control_war_atrocities_desc:0 "Жёсткие приказы по обращению с пленными и гражданскими, усиление военной полиции, OSINT-мониторинг и обучение командирам нормам МГП снижают эскалацию ненависти и укрепляют доверие союзников к нашему ведению войны."
 UKR_control_war_atrocities_tt:0 "Снижает прирост ненависти; улучшает отношение партнёров к соблюдению права войны."

 # Решения для борьбы с усталостью
 UKR_rapid_reconstruction:0 "Экстренная реконструкция"
 UKR_rapid_reconstruction_desc:0 "Мобильные мостовые и инженерные бригады, аварийные энергетические модули, ремонт связи и путей снабжения ускоряем восстановление критической инфраструктуры, принимая краткосрочные бюджетные издержки ради устойчивости тыла."
 UKR_rapid_reconstruction_tt:0 "Временный бонус к ремонту и снабжению при повышенной нагрузке на финансы."

 UKR_civilian_relief:0 "Гражданская гуманитарная помощь"
 UKR_civilian_relief_desc:0 "Организация эвакуационных поездов, развёртывание временных пунктов питания и медпомощи, координация волонтёрских складов снижаем усталость общества и удерживаем доверие к власти даже под ударами по городам."
 UKR_civilian_relief_tt:0 "Поддерживает мирное население в зонах боевых действий."

 UKR_resilience_campaign:0 "Кампания стойкости"
 UKR_resilience_campaign_desc:0 "Информационная поддержка, документальные репортажи, культурные выезды в прифронтовые города и работа психологов повышают волю к сопротивлению и удерживают мораль на высоком уровне, пусть и подогревая решимость мстить врагу."

 UKR_honor_fallen:0 "Чествуем павших"
 UKR_honor_fallen_desc:0 "Государственные церемонии, именные роты и стипендии семьям погибших формируют культуру памяти, поднимают боевой дух и закрепляют общественную готовность выдержать войну до победы."


 # Дополнительные решения
 UKR_veteran_psych_care:0 "Психологическая помощь ветеранам"
 UKR_veteran_psych_care_desc:0 "Открытие центров реабилитации, группы поддержки и терапевтические программы помогают бойцам справиться с посттравматическим стрессом и сохранить связь с мирной жизнью."

 UKR_cultural_morale_boost:0 "Культурные мероприятия для морали"
 UKR_cultural_morale_boost_desc:0 "Концерты в бомбоубежищах, передвижные театры, выставки и поэтические вечера поддерживают дух народа и напоминают, ради чего мы сражаемся."

 # Ежемесячные тики
 UKR_war_mood_monthly_tick:0 "Динамика военного настроения"
 UKR_war_mood_monthly_tick_title:0 "Война продолжается"
 UKR_war_mood_monthly_tick_desc:0 "Каждый месяц войны оставляет след в душах людей растёт и ненависть к врагу, и усталость от испытаний."

  # Инициализация системы
 ukrainewar.1.t:0 "Война началась"
 ukrainewar.1.d:0 "Без объявления войны, территория страны подверглась массированному ракетному обстрелу. Крылатые ракеты, запущенные с бомбардировщиков Ту-95 и Ту-160, баллистические ракеты с мобильных комплексов и корабельные ракеты Калибр накрывают аэродромы Борисполь, Озёрное, Чугуев, Краматорск, Чернобаевку, военные склады, узлы связи и командные пункты по всей стране от Киева до Одессы, от Харькова до Ивано-Франковска.  За первый час выпущено более ста ракет. Воздушное пространство заполнили российские ВКС. На границе фиксируется движение бронетанковых колонн с территории Беларуси на Киев и Чернигов, из России на Харьков и Сумы, из Крыма на Херсон и Мариуполь, с оккупированного Донбасса вглубь Донецкой и Луганской областей. Враг переходит границу одновременно по четырём направлениям. Страна в шоке. Мирное утро разорвано взрывами и сиренами."
 ukrainewar.1.a:0 "Экстренное заседание Совет национальной безопасности и обороны"
 UKR_war_mood_initialized_tt:0 "Система «Национальное настроение войны» активирована: отслеживаются ненависть и усталость, включены динамические модификаторы."

 # Первые удары по гражданским
 ukrainewar.10.t:0 "Шок войны на экранах"
 ukrainewar.10.d:0 "Лента новостей приносит кадры разбомбленных школ и больниц, воронок на детских площадках, пробитых подъездов и спешной эвакуации. Гнев растёт вместе с усталостью  штабы усиливают психологическую поддержку для войск и гражданских, а волонтёрские сети расширяют помощь в прифронтовых городах."
 ukrainewar.10.a:0 "Память и стойкость"

 # Пороги ненависти
 ukrainewar.25.t:0 "Растущая ненависть к врагу"
 ukrainewar.25.d:0 "Сводки с фронта и сообщения беженцев рисуют картину методичного уничтожения всего украинского. Сжигают библиотеки, взрывают памятники, депортируют детей. В социальных сетях и на улицах всё чаще звучат призывы к беспощадной мести. Эта волна гнева укрепляет решимость сражаться, но рискует поглотить саму суть нации, ради которой идёт война."
 ukrainewar.25.a:0 "Враг заплатит за каждое преступление"
 UKR_hate_50_reached_tt:0 "Ненависть к врагу достигла критических значений."

 # Пороги усталости
 ukrainewar.50.t:0 "Усталость от войны"
 ukrainewar.50.d:0 "Месяцы боёв, бесконечные сводки потерь, очереди у гуманитарных пунктов и сирены воздушной тревоги начинают подтачивать дух народа. Люди устают от постоянного напряжения, от вида разрушений, от неопределённости будущего. В обществе растут настроения за мирные переговоры  любые, лишь бы остановить кровопролитие."
 ukrainewar.50.a:0 "Нам нужен мир, но не любой ценой"
 UKR_fatigue_75_reached_tt:0 "Усталость от войны достигает опасного уровня."

 # Потеря столицы

 # Послевоенная конверсия
 ukrainewar.200.t:0 "Конец войны - начало восстановления"
 ukrainewar.200.d:0 "Орудия смолкли, но их эхо ещё долго будет звучать в душах людей. Теперь предстоит не менее сложная задача залечить раны, нанесённые войной не только городам и сёлам, но и сердцам граждан. Ненависть может стать основой для строительства новой сильной нации, а может превратиться в яд, отравляющий будущее. Усталость либо станет мудростью, либо парализует волю к возрождению."
 ukrainewar.200.a:0 "Мы выстояли, теперь будем восстанавливать"
 UKR_postwar_conversion_tt:0 "Военное настроение преобразуется в послевоенные эффекты."

 # События автоматических изменений
 ukrainewar.300.t:0 "Удары по гражданской инфраструктуре"
 ukrainewar.300.d:0 "Вражеские ракеты и беспилотники методично разрушают электростанции, водопроводы, теплосети и больницы. Миллионы людей остаются без света, тепла и связи в разгар зимы. Эти удары не имеют военного смысла их цель сломить дух народа, заставить сдаться от холода и отчаяния. Но каждая разрушенная котельная только разжигает ненависть."
 ukrainewar.300.a:0 "Они пытают народ, но мы выстоим"

 ukrainewar.310.t:0 "Новая волна мобилизации"
 ukrainewar.310.d:0 "В военкоматы приходят отцы семейств, студенты, рабочие обычные люди, вчера ещё мирные граждане. Прощания на вокзалах, слёзы матерей, детские рисунки с пожеланиями папе война требует всё новых жертв. Общество устаёт от постоянных проводов, но понимает: альтернативы нет."
 ukrainewar.310.a:0 "Каждый встанет на защиту Родины"

 # Модификатор ненависти
 UKR_hate_dynamic:0 "Ненависть к врагу"
 UKR_hate_dynamic_desc:0 "Чем сильнее народ ненавидит оккупантов, тем упорнее сражается, но тем больше риск потерять человечность."

 # Модификатор усталости
 UKR_war_fatigue_dynamic:0 "Усталость от войны"
 UKR_war_fatigue_dynamic_desc:0 "Длительные боевые действия истощают моральный дух нации и подрывают способность продолжать сопротивление."

 # Тяжёлые послевоенные травмы
 UKR_severe_war_trauma:0 "Глубокие шрамы войны"
 UKR_severe_war_trauma_desc:0 "Разрушения, потери и страдания оставили неизгладимый след в душах людей. Общество с трудом возвращается к мирной жизни, многие страдают от посттравматического стресса. Восстановление займёт долгие годы."

 UKR_moderate_war_trauma:0 "Военная усталость"
 UKR_moderate_war_trauma_desc:0 "Война истощила физические и моральные силы нации. Люди жаждут покоя и стабильности, предпочитая сосредоточиться на восстановлении, а не на новых конфликтах."

 UKR_light_war_trauma:0 "Боевое напряжение"
 UKR_light_war_trauma_desc:0 "Память о войне ещё свежа, но народ готов идти вперёд. Некоторая настороженность и осторожность естественны после перенесённых испытаний."

 # Закалённость войной
 UKR_hardened_by_war:0 "Закалённые в огне"
 UKR_hardened_by_war_desc:0 "Война превратила мирных граждан в бесстрашных воинов. Нация прошла через горнило боёв и обрела несокрушимую стойкость. Теперь нас не сломить никому."

 UKR_tempered_by_war:0 "Проверенные боем"
 UKR_tempered_by_war_desc:0 "Испытания войны укрепили характер нации. Люди стали более решительными и сплочёнными, готовыми отстаивать свою независимость."

 # Временные эффекты решений
 UKR_rapid_reconstruction_boost:0 "Программа экстренного восстановления"
 UKR_rapid_reconstruction_boost_desc:0 "Мобилизация всех ресурсов на восстановление критически важной инфраструктуры ускоряет ремонтные работы и поднимает дух народа."

 # Диверсии любой ценой
 UKR_sabotage_at_any_cost:0 "Диверсии любой ценой"
 UKR_sabotage_at_any_cost_desc:0 "Война требует от нас решительных действий. Наши спецслужбы развернут масштабную операцию по подрыву российской военной машины изнутри. Диверсанты будут атаковать железнодорожные узлы и склады боеприпасов, хакеры - нарушать работу военных систем связи, а агенты на местах - организовывать саботаж на оборонных предприятиях. Мы используем всю мощь партизанского движения на оккупированных территориях для организации рейдов против российских тыловых объектов. Эти действия усилят наши войска и дезорганизуют врага, но потребуют значительных ресурсов."
 UKR_sabotage_at_any_cost_tooltip:0 "Начинается кампания тотальных диверсий против российских военных объектов и коммуникаций."
 
 # Все против врага
 UKR_everything_against_enemy:0 "Всё против врага"
 UKR_everything_against_enemy_desc:0 "Настало время развернуть полномасштабную гибридную войну против России. Наши специалисты проведут координированную многоуровневую операцию:\n\n§Y•§! Кибератаки на российскую банковскую систему и государственные базы данных\n§Y•§! Массированная информационная кампания, направленная на российское население и военнослужащих\n§Y•§! Подкуп и вербовка российских чиновников и военных\n§Y•§! Разжигание межэтнических и социальных конфликтов внутри РФ\n§Y•§! Поддержка сепаратистских движений на российских окраинах\n§Y•§! Организация утечек компрометирующих материалов на российское руководство\n§Y•§! Дезинформационные операции для подрыва доверия к российским властям\n\nЭто будет тотальная война на всех фронтах - от киберпространства до российских регионов."
 UKR_everything_against_enemy_tooltip:0 "§YРоссия§! получит негативную идею на §Y180 дней§!, которая серьёзно ослабит её военный потенциал и внутреннюю стабильность."

 # Идея для России (SOV)
 UKR_subversion_campaign:0 "Украинская подрывная операция"
 UKR_subversion_campaign_desc:0 "Украинские спецслужбы развернули масштабную кампанию по дестабилизации России. Кибератаки парализуют банковскую систему и государственные сервисы, хакеры взламывают военные базы данных. Подкупленные чиновники сливают секретную информацию, а завербованные офицеры саботируют военные операции. В регионах разжигаются межэтнические конфликты, сепаратисты получают поддержку извне. Информационные атаки подрывают доверие населения к властям, компрометирующие материалы на высокопоставленных лиц появляются в СМИ. Общество расколото, экономика трещит по швам, а военная машина даёт сбои."

 ### ФОКУСЫ
 UKR_forge_professional_officer_corps:0 "Школа Командиров: Новое Поколение"
 UKR_forge_professional_officer_corps_desc:0 "2014 год оставил горький урок: наша армия развалилась под ударом «зелёных человечков» не из-за отсутствия храбрости, а из-за отсутствия §Yпрофессионализма командования§!.\n\nКрым пал за три дня. Донбасс превратился в мясорубку, где ротные командиры учились воевать прямо в окопах, теряя людей из-за собственного незнания. Минские протоколы дали нам передышку - но это лишь затишье перед бурей. Москва не остановится. Мир знает это. §YМы§! знаем это.\n\nС 2020 года мы запускаем §Yпрограмму тотальной переподготовки офицерского корпуса§!. Никаких полумер. Никаких «реформ на бумаге». Капитаны будут учиться планированию операций по стандартам НАТО - не в теории, а на симуляциях реальных боёв: оборона Иловайска, прорыв под Дебальцево, удержание Донецкого аэропорта.\n\nГенералы пройдут стажировки в странах НАТО - там, где §Yпомнят цену свободы§!. Они изучат гибридную войну, киберугрозы, информационные операции. Они научатся побеждать не числом, а умением.\n\nВраг у ворот. Он ждёт момента слабости. §YМы не дадим ему этого момента.§!"
 
 UKR_UAV_warfare_revolution:0 "Глаза над Полем Боя: БПЛА-Доктрина"
 UKR_UAV_warfare_revolution_desc:0 "В 2014 году российские войска вошли в Крым §Yневидимыми§!. Их колонны двигались по ночам, блокпосты возникали из ниоткуда, спецназ ГРУ действовал как призраки. У нас не было глаз на поле боя. Разведка опаздывала на часы, иногда - на дни.\n\nВ Донбассе волонтёры начали запускать коммерческие дроны DJI над позициями сепаратистов. Кустарные, непрофессиональные, но §Yэффективные§!. К 2020 году на линии фронта тысячи дронов - от китайских Mavic до украинских «Лелека».\n\nНо это хаос. Гениальные находки теряются вместе с операторами. Эффективные тактики умирают с батальонами. §YПришло время создать систему.§!\n\nМы разрабатываем первую в мире §YДоктрину Беспилотной Войны для армии XXI века§!. Не как дополнение к авиации - как §Yотдельный род войск§!. Каждый батальон получит собственное подразделение БПЛА. Каждый командир роты будет иметь оператора-разведчика в прямом подчинении.\n\nМы стандартизируем обучение: от базовой подготовки пилотов (5 дней для коммерческих дронов, 3 недели для FPV-камикадзе) до продвинутых курсов целеуказания и координации с артиллерией. Мы создаём §Yтактические схемы применения§!: «Линия дронов» для непрерывного мониторинга фронта, «Рой» для подавления ПВО, «Охотник-убийца» для уничтожения бронетехники.\n\nВраг всё ещё думает танками и самолётами. §YМы думаем алгоритмами и камерами.§!\n\nКогда придёт большая война - а она придёт - небо над Украиной будет §Yнашим§!. Не Су-35 и Ка-52. §YТысячи маленьких глаз, которые видят всё и никогда не спят.§!"
 
 ### ТУЛТИПЫ ФОКУСОВ
 UKR_officer_training_decisions_tooltip:0 "§YОткрывает решения для обучения офицеров:§!\n• Курс Современной Артиллерии\n• Программа Мобильной Войны\n• Школа Тактики Городской Войны\n• Школа Гибридных Операций"
 UKR_drone_doctrine_tooltip:0 "§YУкраина становится пионером беспилотной войны§!\nСнижение стоимости производства штурмовиков и тактических бомбардировщиков\nБонус к разведке и обнаружению вражеской авиации"
 
 ### РЕШЕНИЯ
 UKR_staff_organization_course:0 "Курс Штабной Организации"
 UKR_staff_organization_course_desc:0 "Опыт 2014 года показал: хаос в штабах убивает быстрее, чем вражеские пули. Потеря связи между подразделениями, сбои в снабжении, неправильное планирование операций - всё это стоило нам Крыма и первых месяцев войны на Донбассе.\n\nОбучим генералов современным стандартам штабной работы: планирование операций, координация между родами войск, логистика, управление информационными потоками. Командир - это не только тот, кто ведёт в атаку, но и тот, кто обеспечивает армию всем необходимым для победы."
 UKR_organizer_training_tooltip:0 "§G2 случайных генерала§! получат:\n• §Y+1 к навыку§!\n• Трейт §Y«Организатор»§!"
 
 UKR_mobile_warfare_program:0 "Программа Мобильной Войны"
 UKR_mobile_warfare_program_desc:0 "Современная война - это скорость. Обучим командиров тактике танковых прорывов, координации механизированных подразделений и быстрому манёвру на поле боя."
 UKR_panzer_leader_training_tooltip:0 "§G2 случайных генерала§! получат:\n• §Y+1 к навыку§!\n• Трейт §Y«Лидер танковых войск»§!"
 
 UKR_infantry_tactics_school:0 "Школа Тактики Городской Войны"
 UKR_infantry_tactics_school_desc:0 "Городские бои в Мариуполе, Донецке, Луганске показали: пехота остаётся главной силой в удержании территории. Подготовим командиров к войне в городской среде и в окопах."
 UKR_infantry_leader_training_tooltip:0 "§G2 случайных генерала§! получат:\n• §Y+1 к навыку§!\n• Трейт §Y«Лидер пехоты»§!"
 
 UKR_hybrid_operations_school:0 "Школа Гибридных Операций"
 UKR_hybrid_operations_school_desc:0 "Война XXI века - это спецоперации, диверсии, психологическое давление. Обучим генералов нестандартным методам ведения боевых действий."
 UKR_hybrid_ops_training_tooltip:0 "§G2 случайных генерала§! получат:\n• §Y+1 к навыку§!\n• Трейт §Y«Хитрец»§! или §Y«Коммандос»§!"
 
 ### НАЦИОНАЛЬНЫЙ ДУХ
 UKR_UAV_warfare_pioneers:0 "Пионеры Беспилотной Войны"
 UKR_UAV_warfare_pioneers_desc:0 "Украина стала глобальной лабораторией беспилотной войны. Тактики, рождённые на Донбассе, изучаются в академиях мира. Мы научили коммерческие дроны убивать. Мы создали доктрину, которой ещё нет в НАТО. Когда придёт большая война - небо будет нашим."

 # === СИСТЕМА ВОЕННОГО ДУХА - НЕНАВИСТЬ ===
 UKR_war_spirit_hate_0:0 "Слабая военная решимость"
 UKR_war_spirit_hate_0_desc:0 "Начало конфликта вызвало первые проявления национального единства и решимости противостоять агрессору."
	
 UKR_war_spirit_hate_25:0 "Растущая ненависть к врагу"
 UKR_war_spirit_hate_25_desc:0 "Население начинает испытывать всё более сильную ненависть к захватчикам. Моральный дух войск растёт, а патриотические настроения усиливаются."
	
 UKR_war_spirit_hate_50:0 "Народный гнев"
 UKR_war_spirit_hate_50_desc:0 "Война разожгла яростную ненависть к врагу по всей стране. Граждане готовы на жертвы ради победы, хотя это начинает сказываться на социальной стабильности."
	
 UKR_war_spirit_hate_75:0 "Непримиримая вражда"
 UKR_war_spirit_hate_75_desc:0 "Ненависть к агрессору достигла невиданных масштабов. Военная эффективность значительно выросла, но растущий радикализм и экономические жертвы начинают создавать проблемы."
	
 UKR_war_spirit_hate_100:0 "Тотальная война"
 UKR_war_spirit_hate_100_desc:0 "Страна охвачена фанатичной ненавистью к врагу. Каждый готов сражаться до последнего, но экстремальные настроения, политическая поляризация и истощение ресурсов ставят под угрозу долгосрочную стабильность государства."

 # === СИСТЕМА ВОЕННОГО ДУХА - УСТАЛОСТЬ ===
 UKR_war_spirit_fatigue_0:0 "Ранняя военная усталость"
 UKR_war_spirit_fatigue_0_desc:0 "Первые признаки усталости от войны начинают проявляться в обществе."
	
 UKR_war_spirit_fatigue_25:0 "Нарастающая военная усталость"
 UKR_war_spirit_fatigue_25_desc:0 "Затянувшийся конфликт начинает истощать население. Поддержка войны снижается, производство падает, а доверие к правительству ослабевает."
	
 UKR_war_spirit_fatigue_50:0 "Глубокая военная усталость"
 UKR_war_spirit_fatigue_50_desc:0 "Общество измучено войной. Стабильность находится под угрозой, боевой дух падает, а экономика страдает от продолжительного конфликта. Всё больше ресурсов требуется на гражданские нужды."
	
 UKR_war_spirit_fatigue_75:0 "Критическая военная усталость"
 UKR_war_spirit_fatigue_75_desc:0 "Страна находится на грани истощения. Моральный дух войск катастрофически падает, экономика разваливается, а в обществе зреет недовольство. Радикальные идеи находят всё больше сторонников."
	
 UKR_war_spirit_fatigue_100:0 "Коллапс военного духа"
 UKR_war_spirit_fatigue_100_desc:0 "Нация полностью истощена войной. Общество на грани краха, армия деморализована, экономика в руинах. Власть теряет легитимность, а способность страны продолжать войну находится под серьёзным вопросом."

  # Подсказки для решений
 UKR_veteran_psych_care_tt:0 "Снижает уровни ненависти и усталости через работу с травмированными ветеранами."
 UKR_cultural_morale_boost_tt:0 "Культурные мероприятия поддерживают дух народа и снижают военную усталость."
 UKR_honor_fallen_tt:0 "Память о героях поднимает боевой дух и частично компенсирует усталость."
 UKR_resilience_campaign_tt:0 "Информационная кампания снижает усталость, но может усилить ненависть к врагу."

 # Описания уровней настроения
 ukr_hate_level_low:0 "Начальная решимость (0-24): Народ полон решимости дать отпор агрессору."
 ukr_hate_level_medium:0 "Растущая ненависть (25-49): Сводки о военных преступлениях разжигают гнев в сердцах людей."
 ukr_hate_level_high:0 "Жёсткие меры (50-74): Общество требует беспощадной борьбы с оккупантами."
 ukr_hate_level_extreme:0 "Тотальная ненависть (75-99): Мысль о мести поглощает разум нации."
 ukr_hate_level_fanatical:0 "Фанатичное сопротивление (100+): Ненависть превратилась в религию, определяющую каждый поступок."

 ukr_fatigue_level_low:0 "Лёгкая усталость (0-24): Война ещё воспринимается как временная трудность."
 ukr_fatigue_level_medium:0 "Растущее утомление (25-49): Люди устают от постоянного напряжения."
 ukr_fatigue_level_high:0 "Серьёзная усталость (50-74): В обществе растут пацифистские настроения."
 ukr_fatigue_level_extreme:0 "Критическая усталость (75-99): Народ жаждет мира любой ценой."
 ukr_fatigue_level_collapse:0 "Коллапс морального духа (100+): Воля к сопротивлению практически сломлена."

  # Категория решений
 UKR_war_mood_category: "Военное настроение"
 UKR_war_mood_category_desc: "§YТекущая ситуация:§!\nНенависть к врагу: §Y[?UKRhate]§! - [UKR_HATE_STAGE_NAME]\nВоенная усталость: §Y[?UKRwarfatigue]§! - [UKR_FATIGUE_STAGE_NAME]\n\nУправляйте балансом между ненавистью к врагу и усталостью от войны при помощи решений ниже."
 
