 # Тултипы для стадий ненависти
 UKR_HATE_STAGE_0_TOOLTIP: "§Y0-24: Начальная решимость§!\n\nНарод только начинает осознавать масштаб угрозы. В городах звучат сирены, первые беженцы покидают восточные регионы.\n\n§GПоложительные эффекты:§!\n• Мораль армии: §G+2%§!\n• Поддержка войны: §G+1%§!"

 UKR_HATE_STAGE_1_TOOLTIP: "§Y25-49: Растущая ненависть§!\n\nВраг не щадит мирных жителей. Каждая новость о разрушенных домах и погибших семьях разжигает ярость в сердцах украинцев. Добровольцы штурмуют военкоматы.\n\n§GПоложительные эффекты:§!\n• Защита на своей земле: §G+2%§!\n• Мораль армии: §G+5%§!\n• Поддержка войны: §G+2%§!\n• Атака армии: §G+2%§!\n• Популярность националистов: §G+1%§!"

 UKR_HATE_STAGE_2_TOOLTIP: "§Y50-74: Жёсткие меры§!\n\nНенависть становится силой. Каждый удар по врагу - это месть за разрушенные города и убитых близких. Народ требует решительных действий.\n\n§GПоложительные эффекты:§!\n• Защита на своей земле: §G+3%§!\n• Мораль армии: §G+8%§!\n• Поддержка войны: §G+4%§!\n• Атака армии: §G+5%§!\n• Призыв: §G+10%§!\n• Популярность националистов: §G+2%§!\n\n§RНегативные эффекты:§!\n• Стабильность: §R-2%§!"

 UKR_HATE_STAGE_3_TOOLTIP: "§Y75-99: Тотальная ненависть§!\n\nВраг перешёл все границы - целенаправленные удары по жилым кварталам, больницам, школам. Каждый украинец готов взять оружие. Пощады не будет.\n\n§GПоложительные эффекты:§!\n• Защита на своей земле: §G+5%§!\n• Мораль армии: §G+12%§!\n• Поддержка войны: §G+6%§!\n• Атака армии: §G+8%§!\n• Призыв: §G+15%§!\n• Атака спецназа: §G+10%§!\n• Популярность националистов: §G+3%§!\n\n§RНегативные эффекты:§!\n• Стабильность: §R-5%§!\n• Потребительские товары: §R+2%§!"

 UKR_HATE_STAGE_4_TOOLTIP: "§Y100+: Фанатичное сопротивление§!\n\nЭто уже не война - это борьба за выживание нации. Отступать некуда - позади наши дома, наши семьи. Победа или смерть!\n\n§GПоложительные эффекты:§!\n• Мораль армии: §G+15%§!\n• Поддержка войны: §G+8%§!\n• Атака армии: §G+12%§!\n• Защита на своей земле: §G+15%§!\n• Призыв: §G+20%§!\n• Атака спецназа: §G+15%§!\n• Популярность националистов: §G+5%§!\n• Популярность фашистов: §G+2%§!\n• Популярность нацсоциалистов: §G+1%§!\n\n§RНегативные эффекты:§!\n• Стабильность: §R-8%§!\n• Потребительские товары: §R+5%§!\n• Стоимость политической власти: §R+10%§!"

 # Тултипы для стадий усталости
 UKR_FATIGUE_STAGE_0_TOOLTIP: "§Y0-24: Лёгкая усталость§!\n\nПервые дни войны. Общество охвачено патриотическим подъёмом, но уже появляются первые усталые лица солдат на ротации.\n\n§RНегативные эффекты:§!\n• Стабильность: §R-1%§!\n• Поддержка войны: §R-1%§!"

 UKR_FATIGUE_STAGE_1_TOOLTIP: "§Y25-49: Растущее утомление§!\n\nМесяцы затяжных боёв истощают резервы. Всё больше похоронок, всё меньше добровольцев. В тылу нарастает усталость от постоянной тревоги и нехватки всего необходимого. Экономика трещит по швам.\n\n§RНегативные эффекты:§!\n• Стабильность: §R-3%§!\n• Стабильность в неделю: §R-0.1%§!\n• Поддержка войны: §R-2%§!\n• Поддержка войны в неделю: §R-0.1%§!\n• Организация армии: §R-2%§!\n• Эффективность производства: §R-2%§!"

 UKR_FATIGUE_STAGE_2_TOOLTIP: "§Y50-74: Серьёзная усталость§!\n\nВойна превратилась в кровавую мясорубку. Бесконечные потери на фронте подрывают веру в быструю победу. В обществе растёт запрос на переговоры, хотя бы временное перемирие.\n\n§RНегативные эффекты:§!\n• Стабильность: §R-6%§!\n• Стабильность в неделю: §R-0.5%§!\n• Поддержка войны: §R-4%§!\n• Поддержка войны в неделю: §R-0.1%§!\n• Организация армии: §R-5%§!\n• Мораль армии: §R-3%§!\n• Эффективность производства: §R-5%§!\n• Потребительские товары: §R+3%§!\n• Популярность либертарианских социалистов: §R-1%§!\n• Популярность консерваторов: §R-1%§!"

 UKR_FATIGUE_STAGE_3_TOOLTIP: "§Y75-99: Критическая усталость§!\n\nСтрана на грани истощения. Промышленность еле справляется, мобилизационные резервы на исходе. Всё чаще звучат голоса 'когда же это закончится?'. Даже самые стойкие начинают сомневаться.\n\n§RНегативные эффекты:§!\n• Стабильность: §R-10%§!\n• Стабильность в неделю: §R-1%§!\n• Поддержка войны: §R-8%§!\n• Поддержка войны в неделю: §R-1%§!\n• Организация армии: §R-8%§!\n• Мораль армии: §R-6%§!\n• Скорость мобилизации: §R-10%§!\n• Эффективность производства: §R-8%§!\n• Потребительские товары: §R+5%§!\n• Популярность консерваторов: §R-1%§!\n• Популярность либертарианских социалистов: §R-2%§!"

 UKR_FATIGUE_STAGE_4_TOOLTIP: "§Y100+: Коллапс морального духа§!\n\nМоральный дух армии и народа на грани коллапса. Массовое дезертирство, забастовки на предприятиях, антивоенные митинги. Страна требует мира - любой ценой. Продолжение войны грозит революцией.\n\n§RНегативные эффекты:§!\n• Стабильность: §R-15%§!\n• Стабильность в неделю: §R-2%§!\n• Поддержка войны: §R-12%§!\n• Поддержка войны в неделю: §R-10%§!\n• Организация армии: §R-12%§!\n• Мораль армии: §R-10%§!\n• Скорость мобилизации: §R-15%§!\n• Эффективность производства: §R-12%§!\n• Потребительские товары: §R+8%§!\n• Получение командной власти: §R-10%§!\n• Популярность консерваторов: §R-2%§!\n• Популярность либертарианских социалистов: §R-4%§!\n• Популярность рыночных либералов: §R-1%§!\n• Популярность социал-либералов: §R-1%§!\n• Предел капитуляции: §R-5%§!\n\n§HРиск капитуляции или гражданской войны!§!"

