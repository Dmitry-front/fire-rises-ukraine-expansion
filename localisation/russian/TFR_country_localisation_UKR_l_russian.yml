 # Духи от фокусов (PROPOSAL_spirits.md, пакет 5)
 UKR_decommunization_dispute:0 "Спор о декоммунизации"
 UKR_decommunization_dispute_desc:0 "Названия улиц, памятники и учебники обсуждают на кухнях и в студиях. Разовый удар по стабильности уже получен, а спор тянется дальше: каждую неделю стабильность чуть падает, «Свобода» набирает, КПУ и ПСПУ теряют. Чем дальше страна ушла в национальную повестку, тем громче спор."
 UKR_euro_momentum:0 "Европейский импульс"
 UKR_euro_momentum_desc:0 "Визиты, соглашения и красивые флаги на пресс-конференциях. Партнёры охотнее обсуждают торговлю, стабильность понемногу растёт каждую неделю, а «За будущее» и «Слуга народа» собирают тех, кто голосовал за Европу. ОПЗЖ в это время теряет сторонников. Чем больше страна живёт цифровыми услугами, тем заметнее эффект."
 UKR_diplomatic_surge:0 "Дипломатическое наступление"
 UKR_diplomatic_surge_desc:0 "МИД работает без выходных: звонки, визиты, ноты. Отношения с партнёрами растут быстрее, а поддерживать их дешевле. Политсила прибавляется чуть быстрее."
 UKR_reconciliation_mood:0 "Настроение примирения"
 UKR_reconciliation_mood_desc:0 "Тема Донбасса и общей памяти звучит спокойнее, чем раньше. Стабильность и поддержка обороны понемногу растут каждую неделю, ОПЗЖ теряет, Радикальная партия набирает. Чем больше страна занималась социальными вопросами, тем заметнее."
 UKR_sanctions_regime:0 "Режим санкций"
 UKR_sanctions_regime_desc:0 "СНБО решает быстро, суды успевают позже. Политсила прибавляется быстрее, торговое доверие партнёров слегка падает, стабильность понемногу утекает каждую неделю. ОПЗЖ жалуется на «политические репрессии», но теряет сторонников. Чем жёстче была линия, тем громче эффект."
 UKR_party_machine:0 "Партийная машина"
 UKR_party_machine_desc:0 "Региональные ячейки, лояльные главы администраций и списки на всех уровнях. Политсила прибавляется быстрее, но стабильность понемногу утекает каждую неделю: машине нужно кормить своих. ОПЗЖ растёт, потому что вертикаль привлекает и тех, кто привык к старым схемам, а «Слуга народа» теряет часть избирателей."
 UKR_veteran_wave:0 "Ветеранская волна"
 UKR_veteran_wave_desc:0 "Ветераны идут в местные советы и штабы кампании. Поддержка обороны понемногу растёт каждую неделю, Радикальная партия и Союз левых сил забирают голоса тех, кто против олигархов. Чем ближе стране социальная повестка, тем громче волна."
 UKR_cultural_reforms_desc:0 "Новые программы, фестивали и школьные курсы. Стабильность понемногу растёт каждую неделю, а политические решения обходятся дешевле. Чем ближе стране национальная повестка, тем заметнее растут «Свобода» и «Европейская Солидарность»."
