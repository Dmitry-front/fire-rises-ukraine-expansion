 #Хроника блока 1 (2020-2022), пачка 2
 ukraine.406.t:0 "Местные выборы и «опрос президента»"
 ukraine.406.d:0 "25 октября Украина выбирает мэров и местные советы, а заодно отвечает на пять вопросов президента: опрос проводят прямо в день голосования. Наблюдатели БДИПЧ ОБСЕ позже заметят, что такая затея могла дать преимущество правящей партии, а оппозиция скажет об этом сразу и громче. Результат для «Слуги народа» неприятный: партия не занимает первое место ни в одном крупном городе и ни в одной области. Побеждают местные силы мэров, а в Киеве уверенно лидирует Виталий Кличко.\n\nВ Офисе говорят, что местные выборы всегда про людей, а не про партии. Но год назад «Слуга народа» брала всё, и разница слишком заметна, чтобы её не заметить. Теперь нужно решить, что из этого вывести: работать с мэрами, перестраивать партию или сделать вид, что ничего не случилось."
 ukraine.406.a:0 "Работать с мэрами, потому что децентрализация - ресурс, а не угроза."
 ukraine.406.b:0 "Укрепить партийную вертикаль и сделать выводы."
 ukraine.406.c:0 "Сделать вид, что это были всего лишь местные выборы."
 ukraine.405.t:0 "Конституционный суд против деклараций"
 ukraine.405.d:0 "27 октября Конституционный суд по обращению 47 депутатов признаёт неконституционными нормы об электронном декларировании: Национальное агентство по предотвращению коррупции лишается права проверять декларации, а уголовная ответственность за недостоверные данные отменяется. Одним решением рушится большая часть антикоррупционной системы, которую строили с 2014 года, а в Брюсселе и Вашингтоне напоминают, что безвиз и деньги связаны именно с ней. Дела о недостоверных декларациях остаются без статьи.\n\nУ президента несколько путей: ответить силой и пересобрать суд, искать законное решение вместе с европейскими юристами или принять решение как данность. Вопрос в том, что страшнее: суд без контроля или власть, которая слишком быстро решает, как с ним поступить."
 ukraine.405.a:0 "Распустить суд законопроектом о прекращении полномочий всех судей."
 ukraine.405.b:0 "Обратиться в Венецианскую комиссию и искать законное решение."
 ukraine.405.c:0 "Принять решение суда, а разбираться пусть будет Рада."
 ukraine.404.t:0 "Президент заболел"
 ukraine.404.d:0 "9 ноября Владимир Зеленский пишет в Telegram, что у него положительный тест на коронавирус и температура 37,5, и желает всем 36,6. Заболели и несколько близких к нему чиновников, среди них глава Офиса Андрей Ермак, министр финансов Сергей Марченко и министр обороны Андрей Таран. Через несколько дней президент переезжает в больницу «Феофания», чтобы никого не заразить.\n\nДля страны, где вторая волна уже идёт, а карантин выходного дня вводят через пару дней, это больше чем медицинская новость. Люди смотрят, как власть ведёт себя, когда болеет сама: показывает, где лежит, или отмалчивается. В Офисе спорят, сколько правды готова выдержать страна."
 ukraine.404.a:0 "Говорить открыто о диагнозе, режиме и работе из изоляции."
 ukraine.404.b:0 "Говорить скупо: чувствует себя хорошо, работает - и всё."
 ukraine.407.t:0 "Майдан ФОПов"
 ukraine.407.d:0 "15 декабря на Майдане Независимости собираются тысячи предпринимателей: ФОПы, владельцы кафе, фитнес-клубов и магазинов одежды, которых ограничения выходного дня лишают заработка. Они требуют налоговых послаблений и пытаются поставить палатки на площади, полиция вмешивается, и дело заканчивается столкновениями. Протест называют «SaveФОП», и он умеет возвращаться: следующая большая акция будет в январе.\n\nВласть оказывается между двух огней: эпидемиологи просят не ослаблять карантин, а люди без выручки просят хотя бы не добивать. Каждый вариант кому-то дорого стоит, а январский локдаун уже обсуждается. Есть и четвёртая дорога, менее эффектная: сесть с организаторами за стол и перевести налоговые услуги ФОПам в «Дію», пока они не перевели свою выручку в тень."
 ukraine.407.a:0 "Не допускать палаток на площади и сохранить ограничения."
 ukraine.407.b:0 "Смягчить режим для малого бизнеса и отложить налоговые новшества."
 ukraine.407.c:0 "Выплатить помощь тем, кого закрывает локдаун."
 ukraine.408.t:0 "Вакцины: кто даст, у того и берём"
 ukraine.408.d:0 "8 февраля правительство запрещает регистрацию российской вакцины «Спутник V»: закон об «агрессоре» не позволяет ввозить в страну медицинские препараты из России. Своей вакцины у Украины нет, договорённостей о поставках на нужный объём тоже, а больницы работают на пределе. 24 февраля вакцинация всё-таки стартует с полумиллиона доз индийского Covishield, затем приходят китайская CoronaVac и другие препараты.\n\nОппозиция требует брать любую вакцину, сторонники жёсткой линии отвечают, что вакцина из страны-агрессора - это не медицина, а политика. Решать вам: каким путём страна выходит из пандемии и кому за это придётся что-то объяснять."
 ukraine.408.a:0 "Закупать только вакцины, одобренные ВОЗ, и ждать очереди без риска."
 ukraine.408.b:0 "Брать там, где дают, то есть китайские и индийские поставки без политики."
 ukraine.408.c:0 "Ничего не запрещать, пусть будет и «Спутник»."
 UKR_local_elections_setback:0 "Итоги местных выборов"
 UKR_local_elections_setback_desc:0 "«Слуга народа» не заняла первое место ни в одном крупном городе, а в Офисе до сих пор обсуждают, чья это вина. Пока обсуждают, партия теряет ещё немного. Рейтинг партии власти тянет за собой стабильность. «Слуга народа» теряет, «Европейская Солидарность» подбирает недовольных."
 UKR_constitutional_crisis:0 "Конституционный кризис"
 UKR_constitutional_crisis_desc:0 "Президент и Конституционный суд обмениваются указами и заявлениями, и каждая сторона уверена, что нарушает закон другая. Партнёры в Брюсселе и Вашингтоне следят за этим с растущим беспокойством. Чем жёстче была линия президента, тем сильнее удар. Стабильность понемногу падает каждую неделю, а «Европейская Солидарность» подбирает тех, кто за букву закона."
 UKR_declaration_gap:0 "Дыра в декларировании"
 UKR_declaration_gap_desc:0 "Статьи о недостоверных декларациях больше нет, а проверять декларации некому. Чиновники не спешат это замечать, а вот партнёры замечают. Эта дыра точит доверие понемногу каждую неделю: стабильность и торговое доверие партнёров снижаются."
 #Хроника блока 1 (2020-2022), пачка 3
 ukraine.310.t:0 "Каналы Медведчука"
 ukraine.310.d:0 "СНБО принимает решение, которое Зеленский вводит в действие в тот же вечер: пятилетние санкции против депутата Тараса Козака и трёх телеканалов, связанных с Виктором Медведчуком, - «112 Украина», NewsOne и ZIK. Эфир обрывается, за решение проголосовали 17 из 19 членов СНБО. Власть называет это ответом на российскую пропаганду. Защитники свободы слова отвечают, что закрывать каналы без решения суда, даже плохие, - странный способ защищать демократию.\n\nЗа несколько лет каналы успели обзавестись репутацией. Критики вспоминают ток-шоу, где эксперты спорили о «гражданской войне» вместо российской агрессии, бегущие строки с обещаниями «договориться с Донбассом» и эфиры, в которых вакцина из Москвы выглядела спасением, а украинская медицина - приговором. Сторонники отвечают, что эти каналы смотрят миллионы, а рейтинги у «112» были не хуже, чем у государственных. После запрета зрители быстро находят те же эфиры на YouTube, и в штабах это называют эффектом Стрейзанд.\n\nЗападные дипломаты в целом сдержанно поддерживают, а Медведчук, глава политсовета «ОПЗЖ» и кум Путина, обещает обжаловать решение и намекает, что это только начало. Теперь решать вам, каким путём пойдёт следующий такой случай."
 ukraine.310.a:0 "Пользоваться быстрым путём и дальше, раз он работает."
 ukraine.310.b:0 "Закрепить решение через суд."
 ukraine.310.c:0 "Остановиться на сделанном."
 ukraine.312.t:0 "Коломойский в списке"
 ukraine.312.d:0 "Госсекретарь США Энтони Блинкен публично называет Игоря Коломойского причастным к значительной коррупции в бытность его губернатором Днепропетровщины и объявляет, что ему и членам семьи закрыт въезд в США. В Госдепе добавляют, что бизнесмен продолжает подрывать украинские демократические институты. Для Киева это неловкий момент: по версии СМИ, влияние Коломойского годами доходило до самых верхов, а национализированный в 2016 году ПриватБанк до сих пор обсуждают в судах.\n\nУ Коломойского есть телеканалы, юристы и связи, а у власти есть выбор: воспользоваться случаем и двигаться дальше или осторожно ждать, чем всё закончится. Часть вариантов открыта только тем, кто раньше уже шёл против него: через закон о банках, санкции или проверки телеканалов. Остальные могут только присоединиться или промолчать."
 ukraine.312.a:0 "Присоединиться к давлению и начать проверки ПриватБанка и телеканалов группы."
 ukraine.312.b:0 "Сохранить нейтралитет, ведь у США свои решения, а у нас своя юстиция."
 ukraine.311.t:0 "Государственная измена"
 ukraine.311.d:0 "Генпрокурор объявляет о подозрении в государственной измене Виктору Медведчуку и Тарасу Козаку. По версии следствия, речь идёт о схемах с ресурсами оккупированного Крыма, передаче информации о положении украинских войск и проекте с российскими спецслужбами по созданию агентурной сети в Украине. Суд оставляет Медведчука под домашним арестом, телеканалы закрыты уже три месяца, а в Москве говорят о политических репрессиях и вызывают посла для беседы.\n\nДля власти это шанс закрыть тему, для адвокатов - повод напомнить о презумпции невиновности, а для разведки - вопрос, что ценнее: показательный суд, человек, которого когда-нибудь можно обменять, или активы, которые можно заморозить. Москва уже дала понять, что отношения после этого дела станут холоднее, чем были, а они и так были не тёплыми."
 ukraine.311.a:0 "Довести дело до приговора без сделок."
 ukraine.311.b:0 "Держать дело открытым как рычаг."
 ukraine.313.t:0 "Закон об олигархах"
 ukraine.313.d:0 "23 сентября Рада за один час принимает закон «об олигархах», не дожидаясь заключения Венецианской комиссии. Олигархом признаётся тот, кто отвечает трём из четырёх признаков: влияет на политику, на СМИ, владеет монополиями и имеет активы свыше 90 миллионов долларов. Решение о включении в реестр принимает СНБО, а попавшим в список запрещают финансировать партии и участвовать в приватизации. Президент подпишет закон 5 ноября, а пока его называют историческим и опасным одновременно.\n\nКритики уверены, что закон даёт президенту слишком много власти над бизнесом: именно он решает, кто олигарх, а кто нет. Сторонники отвечают, что другого способа защитить страну от людей, которые покупают политиков вместе с телеканалами, у них нет. Нужно решить, каким будет реестр."
 ukraine.313.a:0 "Сделать реестр жёстким и вносить всех, кто подходит под критерии."
 ukraine.313.b:0 "Оставить реестр мягким, как инструмент давления вместо массовых включений."
 ukraine.313.c:0 "Дождаться заключения Венецианской комиссии."
 ukraine.314.t:0 "Pandora Papers"
 ukraine.314.d:0 "3 октября в Киеве показывают фильм «Офшор 95» журналистов Slidstvo.info, снятый по материалам Pandora Papers. По версии журналистов, офшорная сеть вокруг студии «Квартал 95», которой владели Зеленский и его партнёры, существует с 2012 года, а часть компаний связана с недвижимостью в Лондоне. Среди бенефициаров называют друзей президента, включая Ивана Баканова, который сегодня возглавляет СБУ. Зеленский отвечает, что при Януковиче так строили бизнес все, особенно в телевидении, а студия ничего не отмывала.\n\nДля президента, пришедшего с обещанием посадить коррупционеров, история неудобна по определению: даже без нарушений закона вопросы остаются вопросами. Можно объясняться публично, идти в суд или надеяться, что новости быстро сменятся."
 ukraine.314.a:0 "Объясниться публично, с документами и ответами на вопросы журналистов."
 ukraine.314.b:0 "Пойти в атаку с исками и кампанией против «информационных атак»."
 ukraine.314.c:0 "Не отвечать, через неделю будут другие новости."
 ukraine.315.t:0 "Спикер уходит"
 ukraine.315.d:0 "7 октября Рада голосует за отставку председателя парламента Дмитрия Разумкова: за - 284 депутата. Ещё недавно он считался одним из самых популярных политиков страны, а после спора с Офисом из-за закона об олигархах оказался в оппозиции внутри собственной фракции. Новым спикером на следующий день избирают Руслана Стефанчука, которого называют человеком, лояльным президенту.\n\nРазумков говорит, что остаётся в политике, и многие в «Слуге народа» вдруг вспоминают, что рейтинг партии держался не только на президенте. Решать вам: проголосовать за отставку и закрепить дисциплину или удержать спикера и жить с двумя центрами силы."
 ukraine.315.a:0 "Проголосовать за отставку ради дисциплины."
 ukraine.315.b:0 "Удержать спикера и договориться о балансе."
 ukraine.318.t:0 "Отчёт о «Вагнере»"
 ukraine.318.d:0 "17 ноября журналисты Bellingcat публикуют расследование операции с вагнеровцами, о которой в 2020 году предпочитали молчать. По их версии, украинская спецоперация могла сработать, если бы не вмешательство Офиса президента, и арест в Киеве мог состояться. Тема, которую пытались закрыть тихо, возвращается на первые полосы вместе с вопросом, кто и почему сорвал операцию.\n\nВ Офисе говорят, что это спекуляции, в СБУ - что подробности раскрывать нельзя, а в оппозиции - что это ещё одно доказательство того, что власть не отличает государственные интересы от своих собственных. Решать вам, как реагировать."
 ukraine.319.t:0 "Смена министра обороны"
 ukraine.319.d:0 "Скрытое событие: в ноябре 2021 года Резников сменяет Тарана на посту министра обороны."
 ukraine.318.a:0 "Напомнить, что мы уже признавали эту историю и ничего нового тут нет."
 ukraine.318.b:0 "Отрицать, потому что расследование журналистов не доказательство."
 ukraine.318.c:0 "Признать ошибки и провести внутреннюю проверку."
 ukraine.316.t:0 "Переворот 1-2 декабря"
 ukraine.316.d:0 "26 ноября на пресс-конференции Зеленский заявляет, что разведка получила разговоры людей, готовящих переворот на 1-2 декабря: в записи участвуют россияне, они обсуждают вербовку Рината Ахметова, самого богатого человека страны. Подробностей президент не называет, Кремль всё отрицает, а Ахметов называет слова главы государства абсолютной ложью. Зеленский допускает, что сам Ахметов может быть ни при чём, но уверен, что его окружение втягивает его в войну против президента.\n\nСтрана смотрит на эту сцену с недоумением: перевороты обычно не анонсируют пресс-конференциями. Одни видят в этом сигнал тревоги, другие - способ напомнить о законе об олигархах, а третьи - просто очень неудобное время для выяснения отношений между властью и крупнейшим бизнесом."
 ukraine.316.a:0 "Обнародовать записи и назвать имена."
 ukraine.316.b:0 "Провести тихую проверку силами СБУ и больше ни слова публично."
 ukraine.316.c:0 "Позвать Ахметова в Офис и договориться о правилах."
 ukraine.317.t:0 "Дело Порошенко"
 ukraine.317.d:0 "20 декабря Государственное бюро расследований объявляет о подозрении в государственной измене бывшему президенту Петру Порошенко. По версии следствия, речь идёт об организации поставок угля с оккупированных территорий Донбасса в 2014-2015 годах, а среди упомянутых в деле называют и Медведчука. Порошенко называет дело политической местью, обещает вернуться из-за границы и 17 января действительно возвращается; суд не отправляет его под стражу.\n\nДля власти это сложный выбор. Дело может стать доказательством того, что закон равен для всех, а может выглядеть расправой над главным оппонентом. Всё зависит от того, насколько убедительны материалы и насколько спокойно власть себя ведёт."
 ukraine.317.a:0 "Идти до конца и довести дело до приговора без компромиссов."
 ukraine.317.b:0 "Пусть решает суд, а власть не вмешивается и не комментирует."
 ukraine.317.c:0 "Держать дело открытым, ведь пока оно открыто, оппозиция ведёт себя тише."
 ukraine.840.t:0 "Кибератака на ведомства"
 ukraine.840.d:0 "В ночь на 14 января почти семьдесят сайтов государственных органов, среди них МИД, Минобороны, Кабмин и МЧС, выглядят одинаково: чёрный фон и угрожающее сообщение на украинском, русском и польском. Одновременно в сетях нескольких учреждений находят вредоносную программу, которая выдаёт себя за вирус-вымогатель, а на самом деле стирает данные. Специалисты не сомневаются в российском следе, Москва отрицает причастность.\n\nГлавный урок не в том, что сайты упали, а в том, что у государства слишком много реестров хранится в одном месте, на серверах в одном здании. Что делать дальше: дублировать данные в облаках, выстроить централизованный контроль или ограничиться заявлениями."
 ukraine.840.a:0 "Дублировать реестры в облаке за пределами страны."
 ukraine.840.b:0 "Централизовать: одно ведомство, одни правила, один ответственный."
 ukraine.840.c:0 "Ограничиться заявлениями, ведь хакеры всегда найдутся."
 UKR_pandora_shadow:0 "Тень Pandora Papers"
 UKR_pandora_shadow_desc:0 "Президент не ответил на вопросы, и вопросы никуда не делись. «Слуга народа» теряет доверие избирателей, которые голосовали за честность, а не за красивые объяснения. Доверие уходит понемногу каждую неделю, пока вопросы остаются без ответов."
 ukraine.2.t:0 "Рейс PS752 сбит над Ираном"
 ukraine.2.d:0 "Утром 8 января самолёт «Международных авиалиний Украины» вылетает из Тегерана в Киев, а через несколько минут его сбивают две зенитные ракеты Корпуса стражей исламской революции. Погибают все 176 человек на борту: 90 граждан Ирана, 55 канадцев, 11 украинцев (девять членов экипажа и двое пассажиров), 10 шведов, 7 афганцев и 3 британца. Среди погибших много студентов и молодых специалистов, которые возвращались в Канаду после каникул, а в экипаже люди, которых коллеги считали лучшими в компании.\n\nТри дня Тегеран говорит о технической неисправности и не торопится отдавать самописцы. 11 января Иран признаёт ошибку: самолёт приняли за цель в ночь, когда страна обстреляла американские базы в Ираке и ждала ответа. Теперь Киеву нужно выбрать тон: требовать полного расследования и компенсаций вместе с Канадой, Швецией и Британией или не обострять отношения. Для семей погибших эта разница не абстрактна."
 ukraine.2.o1:0 "Создать международную группу и требовать расследования и компенсаций."
 ukraine.2.o2:0 "Не обострять и вести переговоры тихо, без громких заявлений."
 #Сессия 9: новые ключи хроники блока 1 и ковида
 ukraine_economy.209.c:0 "Не спешить и оставить Нацбанк под временным руководством заместителя."
 ukraine.851.t:0 "PS752: что показало расследование"
 ukraine.851.d:0 "Через полтора месяца у международной группы по рейсу PS752 достаточно материалов, чтобы собрать картину в один документ. Батарея «Тор-М1» стояла на новом месте и не была правильно сориентирована по северу, поэтому оператор видел цель не там, где она находилась. Связь с командным пунктом не работала, и оператор, приняв самолёт за крылатую ракету, пустил две ракеты с интервалом около полминуты. Небо над Тегераном при этом не закрыли, а рейс не задержали: в тот день аэропорт работал как обычно. Иранские власти говорят о «человеческой ошибке», родственники - о том, что человеческих ошибок для одной трагедии слишком много.\n\nВопрос, который международная группа записывает отдельной строкой: виноват не один оператор, а система, которая ждала войны и забыла про гражданские самолёты. Иран тем временем уже называет сумму: около 150 тысяч долларов на семью погибшего, то есть порядка 26 миллионов на 176 человек. Канада и Швеция считают, что платить нужно не только семьям: потеряны самолёт, репутация авиакомпании, страховые выплаты. Киеву решать, сколько требовать и каким путём."
 ukraine.851.a:0 "Принять предложение Тегерана: около 150 тысяч долларов на семью, быстро и без споров."
 ukraine.851.b:0 "Требовать большего: нормы Монреальской конвенции, стоимость самолёта и расходы авиакомпании."
 ukraine.851.c:0 "Идти в суд вместе с Канадой, Швецией и Британией."
 ukraine.852.t:0 "PS752: выплаты"
 ukraine.852.d_accept:0 "Деньги приходят без громких заявлений: Тегеран переводит обещанные выплаты семьям погибших, и в МИД говорят, что сумма называлась с самого начала. Для родственников одиннадцати украинцев на борту это не утешение, но хотя бы закрытый вопрос. Канада и Швеция тем временем продолжают говорить об ответственности и правде, и на их фоне тихая позиция Киева выглядит очень уж спокойной."
 ukraine.852.d_demand:0 "Переговоры тянутся: Тегеран соглашается пересчитать часть выплат, но не признаёт ответственности авиакомпании и стоимость самолёта оценивает по-своему. Юристы спорят о нормах Монреальской конвенции, а в Тегеране напоминают, что страна уже призналась в вине. Часть денег всё же приходит: страховая сумма за потерянный борт и первые выплаты семьям. Остальное - вопрос переписки, которая в этой истории измеряется годами."
 ukraine.852.d_court:0 "Иск подан, и суд, как водится, не торопится. Зато дипломатический эффект приходит быстрее: Канада, Швеция и Британия идут общим фронтом, и Иран вынужден отвечать не отдельным странам, а всей группе сразу. Часть выплат приходит через переговоры параллельно процессу, а остальное зависит от решения, которое придётся ждать долго. Для семей важнее другое: вопрос не закрыт, и о нём помнят."
 ukraine.852.a:0 "Принять к сведению."
 ukraine.312.c:0 "Закрепить закон о банках и подать новые иски по ПриватБанку."
 ukraine.312.e:0 "Проверить лицензии и налоги телеканалов группы Коломойского."
 ukraine.311.c:0 "Начать закрытые переговоры об обмене заключённых."
 UKR_covid_close_borders:0 "Закрыть границы и авиасообщение"
 UKR_covid_close_borders_desc:0 "Правительство закрывает границы для иностранцев и приостанавливает международное авиасообщение, как это сделали соседи. В последние дни перед закрытием люди возвращаются из-за границы, на пунктах пропуска очереди, а бизнес, живущий на поездках, на ближайшие месяцы остаётся без клиентов. Зато эпидемия приходит в страну не из каждого аэропорта сразу."
 UKR_covid_doctors_bonuses:0 "Доплаты медикам"
 UKR_covid_doctors_bonuses_desc:0 "Врачи и медсёстры, которые лечат больных коронавирусом, получают надбавки до 300 процентов к зарплате. Для многих это первая прибавка за годы, а для бюджета ещё одна строка, которой не было в плане. Обещать легко, платить сложнее: деньги нужно найти до того, как люди решат, что обещание было только словами."
 UKR_covid_oxygen_program:0 "Кислород и аппараты ИВЛ"
 UKR_covid_oxygen_program_desc:0 "В больницах не хватает кислорода: линии рассчитаны на другие нагрузки, а заявок приходят сотни. Правительство закупает концентраторы и аппараты ИВЛ и договаривается с предприятиями, производящими технические газы, о переоборудовании части мощностей. Эти деньги не видны на улицах, зато видны в реанимации."
 UKR_covid_weekend_quarantine:0 "Карантин выходного дня"
 UKR_covid_weekend_quarantine_desc:0 "Ограничения вводят на выходные: закрыты кафе, рестораны, торговые центры и спортзалы, работают продуктовые магазины и аптеки. Эпидемиологи называют меру компромиссом между полным локдауном и бездействием, предприниматели - способом разорять малый бизнес по субботам и воскресеньям. Решение понравится не всем, но выбор между «всё» и «ничего» у власти редко бывает."
 UKR_covid_certificates:0 "Covid-сертификаты в «Дії»"
 UKR_covid_certificates_desc:0 "Сертификаты о вакцинации и тесте в приложении «Дія» становятся пропуском для бюджетников, транспорта и крупных мероприятий. Для государства это возможность без новых запретов разделить людей на защищённых и рискующих. Для противников прививок это повод выйти на улицу, а для разработчиков «Дії» ещё одна нагрузка на серверы."
 UKR_fop_distrust:0 "Недоверие предпринимателей"
 UKR_fop_distrust_desc:0 "ФОПы и владельцы кафе уходят с Майдана с ощущением, что власть слушает только эпидемиологов. Они продолжают работать и платить налоги, но помнят, как их встретила полиция. Недоверие накапливается понемногу: стабильность слабо, но стабильно падает. Теряют «За будущее» и «Слуга народа»."
 UKR_fop_tax_pause:0 "Налоговая пауза для ФОПов"
 UKR_fop_tax_pause_desc:0 "Налоговые новшества отложены, а режим для малого бизнеса смягчён. Предприниматели выдыхают, бюджет теряет немного, а к весне все будут спорить, не слишком ли много было обещано. «За будущее» и «Слуга народа» получают немного доверия бизнеса."
 UKR_fop_support_payments:0 "Выплаты на время карантина"
 UKR_fop_support_payments_desc:0 "Тем, кого закрывает локдаун, государство платит напрямую. Очереди в налоговых службах растут, но растёт и выручка магазинов: деньги, как ни странно, тратят. Выплаты запоминают те, кому нужна опора: растут «Слуга народа» и Радикальная партия. Чем ближе стране социальная повестка, тем заметнее эффект."
 UKR_fop_digital_deal:0 "ФОПы в «Дії»"
 UKR_fop_digital_deal_desc:0 "Налоговые услуги для ФОПов уходят в приложение: отчётность, регистрация, закрытие в несколько нажатий. Малый бизнес получает меньше бумаг и больше доверия, а разработчики - лишний повод гордиться. «За будущее» и «Слуга народа» получают долю цифрового электората. Чем больше страна уже живёт в «Дії», тем заметнее."
 ukr_flight752_claims:0 "Требования по рейсу PS752"
 ukr_flight752_quiet:0 "Тихая позиция по PS752"
 ukr_flight752_solidarity:0 "Общее расследование PS752"
 ukr_medvedchuk_case:0 "Дело Медведчука"
 ukr_prisoner_talks:0 "Переговоры об обмене"
 ukr_vaccine_overture:0 "Открытость к «Спутнику V»"
