 UKR_general_strike_req_tt:0 "Профсоюзы - не меньше §Y40§!."
 ukraine_politics.500.t:0 "Левая коалиция"
 ukraine_politics.500.d:0 "Новое правительство представлено в Раде. Министерство социальной политики и труда возглавил Виталий Дудин - юрист, годами защищавший работников в судах, один из основателей «Соціального руху». Депутаты левого крыла аплодируют стоя, бизнес-ассоциации пишут открытые письма. Впервые за тридцать лет в правительстве говорят не о «инвестиционном климате», а о зарплатах. В Офисе это называют «адаптивной тактикой»: когда избиратель меняется, меняется и повестка."
 ukraine_politics.500.a:0 "Время работать."
 ukraine_politics.501.t:0 "Съезд левых сил"
 ukraine_politics.501.d:0 "В киевском Доме профсоюзов собрались все, кто называет себя левыми: функционеры ФПУ в костюмах, социалисты с ноутбуками, анархисты в худи и несколько пожилых коммунистов с красными папками. Договориться обо всём они не смогут никогда. Но правительству нужно решить, чей голос в коалиции будет громче."
 ukraine_politics.501.a:0 "Профсоюзы - наша опора."
 ukraine_politics.501.b:0 "Социалисты пишут программу."
 ukraine_politics.501.c:0 "Анархисты умеют организовывать людей."
 ukraine_politics.501.e:0 "Коммунисты дисциплинированы."
 ukraine_politics.502.t:0 "Трудовой кодекс в Раде"
 ukraine_politics.502.d:0 "Проект нового Трудового кодекса вынесен на голосование. Профсоюзы требуют оставить всё: сорокачасовую неделю, защиту от увольнений, коллективные договоры. Работодатели предупреждают, что бизнес уйдёт в тень. Для голосов нужен компромисс - или решимость."
 ukraine_politics.502.a:0 "Принять кодекс профсоюзов."
 ukraine_politics.502.b:0 "Найти компромисс с бизнесом."
 ukraine_politics.503.t:0 "Имущество ФПУ"
 ukraine_politics.503.d:0 "Журналисты публикуют расследование: по версии СМИ, за последние годы Федерация профсоюзов распродала десятки санаториев, домов отдыха и зданий по ценам ниже рыночных. Глава ФПУ Григорий Осовой называет публикацию атакой на профсоюзное движение. Независимые профсоюзы КВПУ во главе с Михаилом Волынцом требуют аудита. Правительство, которое сделало ставку на профсоюзы, должно выбрать, с кем из них оно разговаривает."
 ukraine_politics.503.a:0 "Реформировать ФПУ вместе с независимыми профсоюзами."
 ukraine_politics.503.b:0 "Договориться с руководством ФПУ."
 ukraine_politics.504.t:0 "Брюссель обеспокоен"
 ukraine_politics.504.d:0 "Еврокомиссия выражает «серьёзную обеспокоенность» национализацией и напоминает о защите инвестиций в соглашении об ассоциации. Европейские левые, напротив, пишут приветственные письма. Посол ЕС просит о встрече «в ближайшее удобное время», то есть завтра утром."
 ukraine_politics.504.a:0 "Объяснить: это временная мера военного времени."
 ukraine_politics.504.b:0 "Наши заводы - наше дело."
 ukraine_politics.505.t:0 "Кооператив избрал директора"
 ukraine_politics.505.d:0 "На первом общем собрании бывшего машиностроительного завода рабочие тайным голосованием избрали директора. Им стал... прежний директор. «Он хотя бы знает, где лежат ключи от склада», - объясняет журналистам сварщик. Директор, тридцать лет проработавший «на хозяина», теперь отчитывается перед цехом и, кажется, впервые за годы доволен."
 ukraine_politics.505.a:0 "Демократия есть демократия."
 ukraine_politics.505.b:0 "Главное - не кто, а как."
 ukraine_politics.506.t:0 "Памятник или профсоюз"
 ukraine_politics.506.d:0 "Институт национальной памяти требует снять советскую мозаику с фасада профсоюзного Дворца культуры: по закону о декоммунизации на ней запрещённая символика. Левые активисты встают живой цепью: мозаику, говорят они, делали рабочие, а не режим. Правые организации обещают прийти «помочь с демонтажем». Кабинету нужно решить до выходных."
 ukraine_politics.506.a:0 "Закон есть закон: снять."
 ukraine_politics.506.b:0 "Закрыть символы и повесить табличку с контекстом."
 ukraine_politics.506.c:0 "Оставить как есть."
 ukraine_politics.507.t:0 "Два призыва"
 ukraine_politics.507.d:0 "Левые и националисты вербуют в одном и том же месте: среди ветеранов АТО и молодых мужчин из промышленных городов. Одни зовут в «батальоны без олигархов», другие - в ветеранские советы. В военкоматах путаница, а в соцсетях - взаимные обвинения. Министерство обороны просит правительство навести порядок."
 ukraine_politics.507.a:0 "Общие ветеранские советы для всех."
 ukraine_politics.507.b:0 "Поддержать левые батальоны."
 ukraine_politics.507.c:0 "Уступить националистам."
 ukraine_politics.508.t:0 "Рада забирает правительство"
 ukraine_politics.508.d:0 "Левое большинство в Раде больше не хочет ждать указов президента. Готов законопроект о переходе к парламентской республике: правительство формирует Рада, президент остаётся гарантом и главнокомандующим. У коалиции достаточно голосов. У президента - последний шанс ответить."
 ukraine_politics.508.a:0 "Пусть страной правит парламент."
 ukraine_politics.508.b:0 "Отстоять полномочия президента."
 ukraine_politics.509.t:0 "Коалиция на грани"
 ukraine_politics.509.d:0 "Левые фракции устали узнавать о решениях правительства из телеграм-каналов Офиса президента. На совместном заявлении подписи профсоюзов, социалистов и даже осторожных социал-демократов: либо Банковая возвращает Раде реальные полномочия, либо коалиции больше нет."
 ukraine_politics.509.a:0 "Уступить Раде."
 ukraine_politics.509.b:0 "Перекупить часть фракции."
 ukraine_politics.510.t:0 "«С кем мы воюем?»"
 ukraine_politics.510.d:0 "Российские телеканалы с восторгом показывают украинских коммунистов: «братская левая Украина скоро поймёт, где её настоящие друзья». Кремлёвская пропаганда работает грубо, но часть радикальных левых начинает спрашивать вслух: стоит ли воевать с Россией, где у власти теперь КПРФ? Армия и ветераны смотрят на правительство с тревогой."
 ukraine_politics.510.a:0 "Мы воюем с агрессором, а не с флагом."
 ukraine_politics.510.b:0 "Жёстко пресечь пораженчество."
 ukraine_politics.511.t:0 "Гуляйполе-фест"
 ukraine_politics.511.d:0 "На родине Нестора Махно проходит первый фестиваль самоуправления. Лекции о кооперативах, ярмарка ремесленников, конкурс бород и реконструированная тачанка, у которой постоянно дежурит полиция. Местные довольны: в городок впервые за годы приехали туристы. Политологи спорят, фестиваль это или партийный съезд."
 ukraine_politics.511.a:0 "Пусть гуляют."
 ukraine_politics.511.b:0 "Лишь бы тачанку не угнали."
 ukraine_politics.512.t:0 "Кооперативы окрепли"
 ukraine_politics.512.d:0 "Служебное событие."
 # Блок 3, левые: повествовательные события 520-534
 ukraine_politics.520.t:0 "Павлоградские шахтёры"
 ukraine_politics.520.d:0 "Горняки Павлограда отказываются подниматься на поверхность, пока им не выплатят долги по зарплате. В шахтёрских посёлках вспоминают июль 1989 года: забастовка, начатая в Кузбассе, за несколько дней охватила весь Донбасс, и сотни тысяч шахтёров впервые открыто потребовали от Москвы не только мыла и зарплат, но и политических перемен. Через два года Советского Союза не стало. С тех пор шахтёрская каска в Украине - символ того, что терпение у людей под землёй не бесконечно."
 ukraine_politics.520.a:0 "Правительство становится посредником."
 ukraine_politics.520.b:0 "Это спор работников и работодателя."
 ukraine_politics.521.t:0 "Криворожсталь: история одной приватизации"
 ukraine_politics.521.d:0 "Профсоюз «АрселорМиттал Кривой Рог» требует индексации зарплат, и телеканалы снова показывают старые кадры. В 2004 году крупнейший металлургический комбинат страны продали консорциуму Рината Ахметова и Виктора Пинчука примерно за 800 миллионов долларов. После Оранжевой революции сделку отменили, и в 2005 году повторный аукцион в прямом эфире выиграла Mittal Steel - уже за 4,8 миллиарда. Для многих украинцев это был первый урок того, сколько на самом деле стоит страна, которую распродают по знакомству."
 ukraine_politics.521.a:0 "Поддержать требования профсоюза."
 ukraine_politics.521.b:0 "Не отпугивать крупнейшего инвестора."
 ukraine_politics.522.t:0 "Махно в учебнике"
 ukraine_politics.522.d:0 "Министерство образования обсуждает новый школьный учебник истории. Спор идёт о Несторе Махно: в советских книгах он был бандитом, в учебниках 1990-х - почти не упоминался. Между тем в 1918-1921 годах его Революционная повстанческая армия контролировала большую часть юга, а в Гуляйполе и окрестностях существовала «вольная территория» с советами и коммунами без государственной власти. Махно воевал то с белыми, то с красными, то с гетманцами, и в конце концов проиграл всем."
 ukraine_politics.522.a:0 "Сложная фигура - пусть школьники спорят."
 ukraine_politics.522.b:0 "Одного абзаца хватит."
 ukraine_politics.523.t:0 "Кухня солидарности"
 ukraine_politics.523.d:0 "В промзоне на окраине Киева анархистский коллектив открыл бесплатную столовую для ветеранов АТО и их семей. Днём здесь кормят, вечером чинят рации и собирают аптечки для тех, кто ещё служит. Над входом - чёрно-красный флаг и надпись «Ні богів, ні панів, ні голодних». Ветераны, которые никогда не читали Кропоткина, приходят сюда за борщом и остаются помогать. Полиция заходила дважды: оба раза съела обед и ушла."
 ukraine_politics.523.a:0 "Хорошее дело не нуждается в разрешении."
 ukraine_politics.524.t:0 "Первомай"
 ukraine_politics.524.d:0 "Первого мая по Крещатику идут профсоюзные колонны с флагами отраслей, социалисты с плакатами о зарплатах и небольшая группа анархистов с барабанами. Праздник родился из чикагской забастовки 1886 года за восьмичасовой рабочий день, в Советском Союзе стал парадом с трибунами, а после 1991 года - днём шашлыков. Впервые за долгое время на марш вышли не только пенсионеры. На соседней улице - встречный пикет правых: «Первомай - советский пережиток»."
 ukraine_politics.524.a:0 "Министры идут в колонне."
 ukraine_politics.524.b:0 "Правительство поздравляет всех, кто работает."
 ukraine_politics.525.t:0 "Заробітчани"
 ukraine_politics.525.d:0 "По оценкам, от трёх до пяти миллионов украинцев работают за границей: на польских стройках, чешских заводах, итальянских кухнях. Они присылают домой больше десяти миллиардов долларов в год - больше, чем вся прямая иностранная инвестиция в страну. Слово «заробітчани» знакомо украинцам ещё с XIX века, когда галицкие крестьяне уезжали на заработки в Канаду и Америку. Министерство социальной политики предлагает программу возвращения: гранты на своё дело и жильё."
 ukraine_politics.525.a:0 "Звать людей домой."
 ukraine_politics.525.b:0 "Переводы из-за границы держат экономику."
 ukraine_politics.526.t:0 "Кооператив против агрохолдинга"
 ukraine_politics.526.d:0 "В Полтавской области фермеры объединили паи в кооператив и отказались продлевать аренду крупному агрохолдингу, который обрабатывает сотни тысяч гектаров по всей стране. Рынок земли открылся только в 2021 году, после двадцати лет моратория, и теперь село решает, кем ему быть: хозяевами или арендодателями. Агрохолдинг предлагает двойную плату за пай. Кооперативу нужны техника и кредит."
 ukraine_politics.526.a:0 "Дать кооперативу льготный кредит."
 ukraine_politics.526.b:0 "Рынок рассудит."
 ukraine_politics.527.t:0 "Левые и память о Голодоморе"
 ukraine_politics.527.d:0 "В четвёртую субботу ноября депутаты левой коалиции приходят к мемориалу жертв Голодомора. Голод 1932-1933 годов стал следствием насильственной коллективизации и изъятия зерна; Украина признала его геноцидом украинского народа в 2006 году. Для украинских левых это не чужая тема: «Соціальний рух» напоминает, что сталинизм уничтожал и крестьян, и тех, кто верил в социализм. Свечи в окнах горят по всей стране."
 ukraine_politics.527.a:0 "Помним."
 ukraine_politics.528.t:0 "«Березіль» и Расстрелянное возрождение"
 ukraine_politics.528.d:0 "Харьковский театр восстанавливает «Мину Мазайло» Николая Кулиша в постановке по записям Леся Курбаса. В 1920-х Курбас и его театр «Березіль» были сердцем украинского авангарда: писатели и режиссёры верили, что революция принесёт и социальную справедливость, и расцвет украинской культуры. В 1937 году Курбаса и Кулиша расстреляли в урочище Сандармох вместе с сотнями других. Это поколение называют Расстрелянным возрождением. На премьере - аншлаг."
 ukraine_politics.528.a:0 "Культура - тоже память."
 ukraine_politics.529.t:0 "Зарплата в конверте"
 ukraine_politics.529.d:0 "Налоговая служба и профсоюзы вместе публикуют исследование: по их оценке, каждый третий работник в стране получает часть зарплаты «в конверте». Работодатель экономит на налогах, работник - на пенсии, которой потом не будет. Этот обычай пережил все реформы с 1990-х годов, когда «чёрная» зарплата была единственным способом выжить. Правительство решает, чем бороться с тенью: пряником или кнутом."
 ukraine_politics.529.a:0 "Амнистия для тех, кто выйдет из тени."
 ukraine_politics.529.b:0 "Проверки на каждом предприятии."
 ukraine_politics.530.t:0 "Курьеры против платформы"
 ukraine_politics.530.d:0 "Курьеры службы доставки в Киеве выключают приложения и выстраивают велосипеды перед офисом компании: тарифы снова урезали, а по договору они не работники, а «партнёры» без отпуска и страховки. В Европе суды уже признают таких курьеров наёмными работниками. Профсоюзы впервые пытаются организовать тех, у кого нет ни цеха, ни начальника смены - только рейтинг в телефоне."
 ukraine_politics.530.a:0 "Закон о платформенной занятости."
 ukraine_politics.530.b:0 "Гибкая работа - это свобода."
 ukraine_politics.531.t:0 "«Будь як Ніна»"
 ukraine_politics.531.d:0 "Медсёстры районных больниц снова выходят на пикеты. Движение медиков «Будь як Ніна», возникшее в 2020 году, требует обещанных зарплат: медицинская реформа перевела больницы на оплату «за пациента», и в маленьких городах денег на персонал не хватает. Медсестра с тридцатилетним стажем получает меньше курьера. Пикеты тихие, но в каждом районном центре."
 ukraine_politics.531.a:0 "Поднять зарплаты медикам."
 ukraine_politics.531.b:0 "Пообещать в следующем бюджете."
 ukraine_politics.532.t:0 "Арсенал, январь 1918-го"
 ukraine_politics.532.d:0 "«Мистецький арсенал» открывает выставку о Январском восстании 1918 года. Рабочие киевского завода «Арсенал» поднялись против Центральной Рады в поддержку наступающих большевиков; восстание подавили Сечевые стрельцы и Вольное казачество, а в те же дни под Крутами погибли студенты, защищавшие Киев. Посетители ходят по залам, где сто лет назад стреляли, и спорят: рабочие против национального правительства - это трагедия классов или трагедия нации?"
 ukraine_politics.532.a:0 "История не бывает простой."
 ukraine_politics.533.t:0 "Последние шахты Волыни"
 ukraine_politics.533.d:0 "Государственные шахты Львовско-Волынского угольного бассейна убыточны десятилетиями: их открыли в 1950-х, и уголь здесь давно дороже импортного. Закрыть их - значит оставить без работы целые города вроде Нововолынска и Червонограда. Европейские партнёры предлагают программу «справедливого перехода»: переобучение шахтёров и новые производства на месте старых шахт. Профсоюз горняков готов говорить, но не о закрытии «с понедельника»."
 ukraine_politics.533.a:0 "Справедливый переход: сначала работа, потом закрытие."
 ukraine_politics.533.b:0 "Закрыть убыточные шахты сейчас."
 ukraine_politics.534.t:0 "Протасов Яр"
 ukraine_politics.534.d:0 "На склонах Протасова Яра в Киеве снова появились строительные заборы. Несколько лет назад жители и активисты - от пенсионеров до анархистов - сорвали здесь строительство высоток, неделями дежуря на склонах, пока суд не отменил разрешения. Теперь у застройщика новые документы. Киев застраивается быстрее, чем успевает обсуждать, и для многих горожан борьба за парк - единственный опыт того, что можно победить деньги."
 ukraine_politics.534.a:0 "Парк остаётся парком."
 ukraine_politics.534.b:0 "Городу нужно жильё."
 #Хроника блока 1 (2020-2022), пачка 1
 ukraine.303.t:0 "Плёнки Гончарука"
 ukraine.303.d:0 "17 января в сеть попадают аудиозаписи совещаний в правительстве. По версии публикаторов, премьер Алексей Гончарук обсуждает с коллегами, насколько глубоко президент разбирается в экономике, и далёк от восторга. Гончарук уверяет, что записи смонтированы из разных кусков и вырваны из контекста, но на всякий случай пишет заявление об отставке. Кто и зачем записывал разговоры в кабинете премьера, остаётся самым популярным вопросом недели.\n\nТеперь решать президенту: принять отставку и распустить кабинет, которому нет и пяти месяцев, или дать молодому премьеру «ещё один шанс». В Раде уже называют фамилии возможных преемников, а в правительстве с особым усердием не обсуждают ничего, кроме бюджета."
 ukraine.303.a:0 "Принять отставку и собрать новый кабинет."
 ukraine.303.b:0 "Отставку не принимать, пусть работают, а там посмотрим."
 ukraine.304.t:0 "Новый премьер"
 ukraine.304.d:0 "4 марта Рада голосует за отставку Алексея Гончарука и назначает премьером Дениса Шмыгаля, бывшего главу Ивано-Франковской области и вице-премьера. Сто восемьдесят восемь дней - один из самых коротких сроков в истории украинских правительств, но отметить его никто не успевает: в министерских кабинетах меняют таблички, а в Минобороны на смену реформатору Андрею Загороднюку приходит Андрей Таран.\n\nНовый премьер обещает не разговаривать, а работать. Он ещё не знает, что март 2020 года окажется самым неудачным месяцем для любых обещаний, потому что в мир приходит что-то очень заразное."
 ukraine.304.a:0 "Работаем."
 ukraine.302.t:0 "Богдан уходит, Ермак приходит"
 ukraine.302.d:0 "11 февраля на сайте президента один за другим появляются два указа: Андрей Богдан освобождён от должности главы Офиса, на его место назначен Андрей Ермак. Богдана, юриста, которого пресса связывает с кругом Игоря Коломойского, до последнего видели на всех важных совещаниях. Ермак - кинопродюсер и юрист, давний знакомый президента, последние месяцы он занимался Донбассом и переговорами с Москвой.\n\nВ Офисе это называют «сборкой команды», в кулуарах - победой одной группы над другой. Теперь придётся решить, каким должен быть Офис в год, когда страна ещё не знает, что ей предстоит: вертикаль с одним центром или Офис с профильными заместителями и публичными правилами."
 ukraine.302.a:0 "Один Офис, одна вертикаль, один человек, который решает."
 ukraine.302.b:0 "Ермак руководит, но у Офиса появляются профильные заместители и правила."
 ukraine.402.t:0 "Новые Санжары"
 ukraine.402.d:0 "20 февраля самолёт с эвакуированными из Уханя садится в Харькове: 45 украинцев и 27 иностранцев из нескольких стран, которым нужно две недели провести отдельно от остальной страны. Санаторий в Новых Санжарах на Полтавщине выбран только накануне, и именно это становится проблемой: местные узнают о постояльцах из новостей и чатов, а не от власти. К вечеру на въезде горят покрышки, дорогу перегораживают, а в автобусы летят камни.\n\nТрёхчасовая дорога превращается в девятичасовую. Автобусы идут колонной под охраной полиции, десять полицейских ранены, около тридцати местных жителей задержаны. Пока колонна ползёт к санаторию, по мессенджерам расходится «служебная записка Минздрава» о заражённых среди эвакуированных. Министерство называет её подделкой, но опровержение всегда едет медленнее, чем слух, особенно по ночной дороге с горящими шинами.\n\nПозже выяснится, что у эвакуированных вируса нет, а две недели в санатории они проведут тише и спокойнее, чем всё остальное вокруг. Но для страны это первый урок эпидемии: люди боятся не только болезни, но и того, что решения принимаются без них. Теперь нужно показать, как власть разговаривает с испуганным городом."
 ukraine.402.a:0 "Приехать самому и поговорить с людьми."
 ukraine.402.b:0 "Усилить полицию и закрыть дорогу."
 ukraine.402.c:0 "Оставить Минздраву и местной власти."
 ukraine.403.t:0 "Огонь у Чернобыля"
 ukraine.403.d:0 "4-5 апреля сухая трава и мусор загораются у села Рагивка рядом с зоной отчуждения, ветер делает остальное: через несколько дней горят уже леса внутри зоны, огонь подходит к хранилищам радиоактивных отходов, а дым накрывает Киев, и воздух столицы ненадолго становится одним из самых грязных в мире. Радиационный фон в зоне временно растёт, в Киеве остаётся в норме. Полиция задерживает 27-летнего жителя соседнего села, который признаётся, что поджёг траву.\n\nНо главный вопрос не в том, кто бросил спичку. Он в том, почему через тридцать четыре года после аварии лесхоз, спасатели и администрация зоны не могут договориться, кто за что отвечает. Пожар потушат, остальное - вопрос репутации, а заодно дыхания."
 ukraine.403.a:0 "Поднять МЧС и армию и закрыть зону для всех."
 ukraine.403.b:0 "Назвать виновных: поджигатель, лесхоз и руководство зоны."
 ukraine.403.c:0 "Заверить, что радиация в норме и всё под контролем."
 ukraine_economy.208.t:0 "Деньги МВФ"
 ukraine_economy.208.d:0 "9 июня Совет директоров МВФ одобряет для Украины 18-месячную программу stand-by на пять миллиардов долларов. Первый транш, около двух миллиардов, приходит сразу и нужен как воздух: пандемия, просевший экспорт и бюджетная дыра. Главное условие выполнено ещё в мае: Рада приняла закон, который не даёт бывшим владельцам национализированных банков вернуть их через суд.\n\nТеперь вопрос в том, выдержит ли закон давление. У него влиятельные противники, а бывший владелец ПриватБанка Игорь Коломойский, судя по публикациям, не собирается сдаваться. Нужно решить, насколько жёстко держать линию, когда следующий транш зависит от слов «независимость Нацбанка»."
 ukraine_economy.208.a:0 "Держать линию и не трогать ни независимость Нацбанка, ни закон о банках."
 ukraine_economy.208.b:0 "Подписать, но оставить себе пространство для манёвра."
 ukraine_economy.209.t:0 "Смолий уходит"
 ukraine_economy.209.d:0 "1 июля глава Нацбанка Яков Смолий пишет заявление об отставке и объясняет её систематическим политическим давлением. По версии СМИ, речь идёт и о споре вокруг ПриватБанка, и о недовольстве политикой ставок. Рада принимает отставку 3 июля. МВФ молчит, но все понимают, что это молчание дорого стоит: программа держится на независимости регулятора, а в разгар кризиса регулятор остался без главы.\n\nК середине июля в Киеве обсуждают двух вероятных кандидатов. Первый заместитель главы Нацбанка Сергей Николайчук - профессионал изнутри, которого рынок и миссия МВФ знают давно. Глава государственного «Укргазбанка» Кирилл Шевченко - банкир, которого Офис знает лучше, чем рынок. Директор-распорядитель МВФ Кристалина Георгиева тем временем звонит президенту: независимость Нацбанка - условие программы, а не пожелание."
 ukraine_economy.209.a:0 "Назвать Сергея Николайчука: профессионал изнутри и спокойствие для МВФ."
 ukraine_economy.209.b:0 "Назвать Кирилла Шевченко: банкира, с которым Офису удобнее работать."
 ukraine.503.t:0 "Вагнергейт"
 ukraine.503.d:0 "29 июля под Минском задерживают 33 россиян, которых белорусская сторона называет бойцами ЧВК «Вагнер», приехавшими дестабилизировать президентскую кампанию. Через несколько дней выясняется неудобная деталь: к этой истории причастна Украина. По версии журналистов, спецслужбы готовили операцию не один месяц: заманить вагнеровцев, воевавших на Донбассе, на территорию, где их можно задержать и судить. Что-то пошло не так на последнем этапе.\n\nМинск требует объяснений, Москва требует вернуть своих людей, а Киев вдруг оказывается в положении, в котором лучше бы вообще не оказываться. Остаётся выбрать: настаивать на экстрадиции, говорить с Минском тихо или честно признать, что операция была и закончилась неудачей."
 ukraine.503.a:0 "Требовать экстрадиции через ноту, Интерпол и публичное давление."
 ukraine.503.b:0 "Говорить с Минском тихо, потому что канал важнее скандала."
 ukraine.503.c:0 "Признать операцию и начать внутреннее расследование."
 ukraine.504.t:0 "Беларусь едет в Киев"
 ukraine.504.d:0 "После 9 августа в Беларуси не возвращается нормальная жизнь: протесты, аресты, обыски в офисах. Для айти-сектора, который даёт около пятой части белорусского экспорта, это сигнал. К октябрю в Киев переезжают сотни специалистов, за ними целые компании, а один из переехавших стартапов позже станет «единорогом». Украина для них удобна: безвиз, близкий язык, пятипроцентный налог для ФОПов и свободные места в коворкингах Киева, Львова и Харькова.\n\nПолитически вопрос сложнее. Минск смотрит на «охоту на айтишников» без восторга, Москва с подозрением. С другой стороны, несколько тысяч программистов не требуют кредитов, им нужны только понятные правила."
 ukraine.504.a:0 "Открыть двери айтишникам: жильё, визовые окна и налоговые каникулы."
 ukraine.504.b:0 "Помогать по обычным правилам, без громких жестов."
 ukraine.504.c:0 "Не вмешиваться, чтобы не портить отношения с Минском."
 ukraine.850.t:0 "Карабах: урок дронов"
 ukraine.850.d:0 "27 сентября начинается война в Нагорном Карабахе, и через две недели она превращается в учебный фильм для генштабов. Азербайджанские «Байрактары» бьют по армянским танкам, РЛС и системам ПВО, а ролики с попаданиями смотрит весь мир. Для Украины, у которой за плечами шесть лет окопной войны на Донбассе и контракт на турецкие аппараты, это не новость, но и не абстракция. Когда австрийская Rotax останавливает поставки двигателей для «Байрактаров», турки начинают присматриваться к украинским «Ивченко-Прогрессу» и «Мотор Сичи».\n\nВ штабе спорят, что делать с уроком: покупать больше и быстрее, делать своё или наблюдать, потому что дрон без обученных операторов и тактики остаётся просто дорогой игрушкой."
 ukraine.850.a:0 "Ускорить закупки и сервис по турецкой линии."
 ukraine.850.b:0 "Делать своё: КБ, моторы и «Лелека»."
 ukraine.850.c:0 "Смотреть и учиться, покупая только нужное сегодня."
 #Идеи хроники блока 1
 UKR_last_chance_cabinet:0 "Кабинет на испытательном сроке"
 UKR_last_chance_cabinet_desc:0 "Премьеру дали шанс, но все понимают, что шанс короткий. Министры работают с оглядкой на президента, а команда президента - с оглядкой на следующую утечку. Если рейтинг партии власти падает, стабильность падает вместе с ним."
 UKR_novi_sanzhary_panic:0 "Паника Новых Санжар"
 UKR_novi_sanzhary_panic_desc:0 "Покрышки в Новых Санжарах догорели, а недоверие осталось. Люди не верят, что их предупредят заранее, и на всякий случай не верят и тем, кто пытается предупредить. Недоверие оседает понемногу каждую неделю: стабильность медленно утекает, пока люди не увидят, что власть умеет предупреждать."
 UKR_zone_smoke:0 "Дым над Киевом"
 UKR_zone_smoke_desc:0 "Киевляне неделю дышали тем, что принёс ветер из Полесья. Пресс-службы уверяют, что всё в норме, а приложения с качеством воздуха уверяют в обратном. Часть семей, которым есть куда уехать, пересматривает планы, и население растёт медленнее, чем могло бы."
 UKR_nbu_pressure:0 "Давление вокруг Нацбанка"
 UKR_nbu_pressure_desc:0 "Отставка главы регулятора в разгар кризиса - не лучшая рекомендация для заёмщика. Миссия МВФ задаёт вопросы, а рынок отвечает курсом. Заёмщику дороже занимать, а партнёры охотнее обсуждают риски, чем торговлю."
 UKR_belarus_tech_wave:0 "Беларусь в Киеве"
 UKR_belarus_tech_wave_desc:0 "Белорусские разработчики снимают офисы в Киеве, Львове и Харькове и привозят с собой клиентов. Коворкинги заполнены, арендодатели тихо повышают цены, а вместе с айтишниками приезжают их семьи, врачи, преподаватели и повара, которые тоже что-то создают."
