 # Лестницы олигархата и коррупции: волны реформ (PROPOSAL_spirits.md, пакет 4)
 UKR_deoligarchization_wave:0 "Волна деолигархизации"
 UKR_deoligarchization_wave_desc:0 "Реестр, аудит активов и дела против бенефициаров не сходят с новостей: реформы видны, а проигравшие шумят. На время растут стабильность, политсила и доверие партнёров, «Слуга народа» набирает, «За будущее» и ОПЗЖ теряют. Чем ниже ступень, тем сильнее волна."
 UKR_anticorruption_wave:0 "Волна антикоррупционных реформ"
 UKR_anticorruption_wave_desc:0 "Новые процедуры, независимые органы и первые громкие дела. На время растут стабильность и доверие партнёров, «Слуга народа» набирает, ОПЗЖ теряет. Вторая ступень сильнее первой."
 UKR_deoligarchization_wave_dynamic:0 "Настроение избирателей: деолигархизация"
 UKR_deoligarchization_wave_dynamic_desc:0 "Популярность партий дрейфует, пока действует дух. Сила зависит от ступени реформ."
 UKR_anticorruption_wave_dynamic:0 "Настроение избирателей: антикоррупционные реформы"
