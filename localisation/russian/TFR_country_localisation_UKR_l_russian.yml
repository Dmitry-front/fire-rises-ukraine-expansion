 ukraine_category_name:0 "Украинская внешняя политика"
 ukraine_influence_belarus:0 "Влиять на Беларусь"
 ukraine_influence_belarus_desc:0 "Украинские чиновники выходят на связь с белорусскими коллегами через неофициальные каналы. Дружеские встречи, дипломатические приемы и случайные беседы в коридорах международных саммитов - за вежливыми улыбками скрываются намёки, вопросы и предложения. \"Выбор - всегда ваш, но стабильность бывает разной\", - звучит между строк. Никто ничего не обещает, но сигналы понятны."

 UKR_startup_ecosystem_category:0 "Украинская стартап-экосистема"
 UKR_startup_ecosystem_category_desc:0 "После избрания Владимира Зеленского президентом в 2019 году, правительство Украины взяло курс на активную поддержку IT-сектора и технологических стартапов. Концепция 'Дія City' и другие инициативы направлены на создание благоприятных условий для технологического бизнеса. Согласно данным Национальной ассоциации IT, к 2019 году IT-индустрия Украины показывала ежегодный рост в 20-25%, обеспечивая более 4% ВВП страны и являясь третьим по величине экспортным сектором с доходом около 4,5 млрд долларов. Правительство Зеленского стремится превратить Украину в ведущий технологический хаб Восточной Европы, увеличив долю IT в ВВП до 10% к 2025 году."
 
 
 UKR_national_startup_fund:0 "Создание Украинского фонда стартапов"
 UKR_national_startup_fund_desc:0 "Украинский фонд стартапов (УФС), созданный постановлением Кабинета Министров Украины №740 от 12 июля 2019 года, является государственным фондом с первоначальным бюджетом в 440 млн гривен (около 18 млн долларов). Миссия фонда заключается в предоставлении финансирования на ранних стадиях для технологических стартапов через прозрачный процесс отбора. УФС предлагает гранты на пре-сид стадии в размере до 25 000 долларов и на сид стадии до 50 000 долларов, с возможностью получения обоих грантов суммарно до 75 000 долларов. К концу 2020 года УФС профинансировал более 80 стартапов на общую сумму около 2 млн долларов, а к 2021 году - более 200 проектов. Правительство рассчитывает, что до 2025 года стартапы, получившие поддержку УФС, создадут более 10 000 высокооплачиваемых рабочих мест и привлекут не менее 100 млн долларов иностранных инвестиций в экономику Украины."
 
 UKR_diia_city_initiative:0 "Внедрение специального правового режима Дія City"
 UKR_diia_city_initiative_desc:0 "Дія City - это особый правовой режим для IT-индустрии, разработанный Министерством цифровой трансформации и принятый Верховной Радой в 2021 году (законопроекты №4303 и №5376). Данный режим предлагает беспрецедентные для Украины налоговые условия и правовую защиту для технологических компаний. Вместо стандартного корпоративного налога в 18%, компании-резиденты Дія City платят лишь 5% налога на распределенную прибыль. Для сотрудников предусмотрен сниженный налог на доходы в размере 5% (вместо стандартных 18%), а единый социальный взнос рассчитывается от минимальной зарплаты, а не от фактической. Гиг-контракты, введенные в рамках режима, предоставляют гибкие условия найма, сочетающие преимущества найма и ФОП. Для резидентства в Дія City компания должна иметь не менее 9 сотрудников со средней зарплатой не менее эквивалента 1 200 евро в месяц. По оценкам Министерства цифровой трансформации, к 2025 году резидентами Дія City должны стать более 2 000 компаний, а IT-экспорт Украины достигнет 16,5 млрд долларов."
 
 UKR_fund_invest_in_education:0 "Инвестиции в техническое образование"
 UKR_fund_invest_in_education_desc:0 "Правительство Украины в сотрудничестве с ведущими университетами (КПИ им. Игоря Сикорского, ХНУ им. В.Н. Каразина, ЛНУ им. Ивана Франко, Национальный университет 'Львовская политехника') запустило программу модернизации технического образования. В рамках этой инициативы Министерство образования и науки Украины выделило более 250 млн гривен на обновление учебных программ, создание инновационных лабораторий и налаживание практических программ стажировок с технологическими компаниями. Введена программа 'IT Creative', предполагающая дуальное образование, где студенты часть времени обучаются в университете, а часть работают в IT-компаниях. В сотрудничестве с EPAM, SoftServe, GlobalLogic и другими IT-компаниями созданы более 50 совместных лабораторий в университетах. По данным правительства, за 2020-2022 годы количество выпускников IT-специальностей должно увеличиться на 35%, достигнув 20 000 человек ежегодно, что поможет удовлетворить растущий спрос на специалистов, который оценивается в 30 000-40 000 новых рабочих мест ежегодно в IT-секторе Украины."
 
 UKR_create_innovation_parks:0 "Создание региональных инновационных парков"
 UKR_create_innovation_parks_desc:0 "По модели успешного инновационного парка UNIT.City в Киеве, площадью 25 гектаров и инвестициями более 150 млн долларов, правительство Украины запустило программу создания дополнительных инновационных парков в крупных городах страны. В Львове создается LvivTech.City площадью 1,8 гектара и инвестициями более 95 млн долларов, в Харькове - Екополис ХТЗ на территории бывшего Харьковского тракторного завода площадью 150 гектаров с планируемыми инвестициями до 1 млрд долларов, в Одессе - Инновационный парк Одесса на 5 гектарах. Инновационные парки предоставляют офисные помещения, исследовательские лаборатории, акселераторы для стартапов и сервисную инфраструктуру для технологических компаний. Согласно стратегии 'Украина - инновационная нация', разработанной Министерством цифровой трансформации, к 2025 году в стране должно быть создано не менее 8 полноценных инновационных парков в различных регионах, которые обеспечат рабочими местами более 70 000 специалистов и привлекут инвестиции в размере не менее 2 млрд долларов."
 
 UKR_international_tech_partnerships:0 "Формирование международных технологических партнерств"
 UKR_international_tech_partnerships_desc:0 "Министерство иностранных дел и Министерство цифровой трансформации Украины активно работают над установлением партнерских отношений с ведущими технологическими экосистемами США, Великобритании, Германии и других стран ЕС. В 2019-2021 годах были подписаны меморандумы о сотрудничестве с Кремниевой долиной (США), Tech City UK (Великобритания), Station F (Франция) и Digital Hub Initiative (Германия). В рамках программы EU4Digital была запущена работа по гармонизации цифровых рынков Украины и ЕС с финансированием более 11 млн евро. Создан Ukraine Global Innovation Fund с капитализацией 100 млн долларов для совместных инвестиций с международными венчурными фондами. По данным Украинской ассоциации венчурного капитала, благодаря международному сотрудничеству объем инвестиций в украинские технологические компании вырос с 336 млн долларов в 2019 году до более 500 млн долларов в 2020 году. К 2025 году правительство планирует увеличить этот показатель до 1,5 млрд долларов ежегодно. Данные партнерства способствуют обмену знаниями, инвестиционным возможностям и доступу к международным рынкам для украинских технологических компаний."
 
 UKR_diia_city_benefits:0 "Преимущества Дія City"
 UKR_diia_city_benefits_desc:0 "Компании, зарегистрированные в правовом режиме Дія City, получают значительные налоговые льготы: 5% налог на распределенную прибыль вместо стандартного корпоративного налога в 18%, сниженный налог на доходы физических лиц для сотрудников в размере 5% вместо 18%, и упрощенные правила регулирования трудовых отношений. Эта система разработана для привлечения как отечественных, так и иностранных технологических инвестиций. По данным Министерства цифровой трансформации, налоговая нагрузка для IT-компаний снижается в среднем на 40%. Введены новые инструменты защиты интеллектуальной собственности и инвестиций, включая опционные программы для сотрудников (ESOP), гарантии защиты авторских прав и конфиденциальной информации. Правовой режим Дія City предоставляет особые механизмы корпоративного управления, включая возможность заключения корпоративных договоров по английскому праву. По прогнозам экспертов, к 2025 году благодаря этим преимуществам количество IT-специалистов в Украине вырастет с 200 000 до 450 000 человек, а украинский IT-экспорт увеличится в 3-4 раза."
 
 UKR_improved_tech_education:0 "Усовершенствованное техническое образование"
 UKR_improved_tech_education_desc:0 "Модернизация технического образования в украинских университетах выпускает новое поколение квалифицированных разработчиков программного обеспечения, инженеров и технологических предпринимателей, поддерживая рост инновационной экономики страны. Создано более 30 совместных образовательных программ университетов с ведущими технологическими компаниями. Ежегодно проводится более 100 хакатонов и технологических соревнований с общим призовым фондом более 5 млн гривен. Запущена национальная платформа IT-образования с бесплатными онлайн-курсами, которую к 2022 году посетили более 500 000 украинцев. По данным исследования ассоциации IT Ukraine, благодаря комплексным образовательным инициативам средняя зарплата в IT-секторе выросла на 15-20% и достигла 2 500-3 000 долларов в месяц, что в 5-6 раз выше средней зарплаты по стране. Улучшенное техническое образование стимулирует также появление R&D-центров международных компаний: за 2019-2021 годы в Украине открыли такие центры более 20 компаний, включая Amazon, Viber, Ring (Amazon), Snap и другие."
 
 unlock_decision_tooltip:0 "Разблокирует решения по развитию украинской стартап-экосистемы"
 UKR_startup_ecosystem_help:0 "Эти решения позволяют вам усилить технологический сектор Украины через стратегические инвестиции и политические реформы"

 UKR_anti_corruption_campaign:0 "Запустить антикоррупционную кампанию"
 UKR_anti_corruption_campaign_desc:0 "Следуя программе «слуга народа», наше правительство должно бороться с эндемической коррупцией, которая десятилетиями поражала Украину. Черпая вдохновение из успешных моделей Эстонии и Грузии, мы внедрим комплексную стратегию, направленную на прозрачность власти, цифровизацию государственных услуг и укрепление антикоррупционных институтов. Согласно исследованиям Всемирного банка, сокращение возможностей для коррупции через электронное правительство доказало свою эффективность в переходных экономиках, снижая случаи взяточничества до 70% в некоторых секторах. Эта кампания потребует значительного политического капитала, но представляет собой первый решающий шаг к значимым реформам."
 
 UKR_establish_high_anticorruption_court:0 "Создать Высший антикоррупционный суд"
 UKR_establish_high_anticorruption_court_desc:0 "Для закрепления наших антикоррупционных реформ необходимо создать независимый Высший антикоррупционный суд с особой юрисдикцией над делами о коррупции. Международный опыт таких стран, как Индонезия и Словакия, показывает, что специализированные антикоррупционные суды значительно повышают показатели обвинительных приговоров и сокращают время рассмотрения дел при правильном внедрении и изоляции от политического давления. Исследования Центра антикоррупционных ресурсов U4 указывают, что такие суды наиболее успешны, когда судьи проходят тщательную проверку и получают конкурентоспособное вознаграждение, чтобы противостоять взяткам. Хотя создание этого института временно напряжёт наши политические ресурсы, оно создаст длительные механизмы подотчётности и отправит мощный сигнал внутренним и международным заинтересованным сторонам о том, что Украина привержена верховенству закона."
 # Отношения в игре
 diplomatic_treaty_ukr:0 "Дипломатическое соглашение"
 diplomatic_treaty_ukr_desc:0 "Это соглашение укрепляет отношения между нашими странами и способствует развитию двусторонних связей."
 # Главный фокус - Стратегия национального обновления
 UKR_path_to_new_ukraine:0 "Путь к новой Украине"
 UKR_path_to_new_ukraine_desc:0 "После десятилетий неопределенности и внешних угроз, под руководством президента Зеленского, Украина стоит на пороге исторических перемен. Успешно начатая экономическая трансформация позволяет нам определить ключевые векторы развития государства. Мы должны модернизировать нашу экономику, обеспечить энергетическую безопасность, укрепить обороноспособность и возродить национальный дух. Наша стратегия национального обновления затронет все аспекты жизни страны - от энергетики и промышленности до образования и культуры. Только сильная, независимая, процветающая Украина будет иметь полноценное право голоса в международных отношениях и обеспечит достойное будущее следующим поколениям своих граждан."
 UKR_new_path_tooltip:0 "Открывает возможности для всестороннего развития Украины в трех ключевых направлениях: энергетическая безопасность, военная модернизация и национальное возрождение."
 
 # Ядерная безопасность и энергетика
 UKR_chernobyl_legacy:0 "Наследие Чернобыля"
 UKR_chernobyl_legacy_desc:0 "Чернобыльская катастрофа 1986 года оставила неизгладимый след в истории Украины и всего мира. Завершение строительства нового безопасного конфайнмента ('Арки') над разрушенным четвертым энергоблоком - грандиозный инженерный проект стоимостью более 2 миллиардов евро - позволяет герметизировать реактор на ближайшие 100 лет и предотвратить выброс радиоактивных веществ в окружающую среду. Этот уникальный объект высотой 110 метров, весом 36 тысяч тонн, созданный в сотрудничестве с международными партнерами, является крупнейшей в мире подвижной наземной конструкцией. 'Арка' не только решает экологические проблемы зоны отчуждения, но и демонстрирует способность Украины реализовывать технологически сложные проекты мирового уровня. Продолжая международное сотрудничество в этой сфере, мы не только обезопасим зону отчуждения для будущих поколений, но и станем мировыми экспертами в области ядерной безопасности, открывая дорогу для дальнейшего безопасного развития атомной энергетики."
 
 UKR_modernize_nuclear_facilities:0 "Модернизация атомных электростанций"
 UKR_modernize_nuclear_facilities_desc:0 "Атомная энергетика составляет более половины энергобаланса Украины. Четыре действующие АЭС (Запорожская, Ровенская, Южно-Украинская и Хмельницкая) с 15 энергоблоками общей мощностью более 13 ГВт являются стратегическими объектами национальной безопасности. Масштабная программа модернизации включает внедрение современных систем безопасности по стандартам МАГАТЭ, обновление автоматики и контрольно-измерительного оборудования, замену устаревших систем и компонентов, а также продление эксплуатационного ресурса энергоблоков. Особое внимание уделяется разработке новых технологий ядерного топлива, позволяющих снизить зависимость от импортных поставок и повысить экономическую эффективность. Модернизация предусматривает также внедрение современных систем хранения отработанного ядерного топлива и решение проблемы радиоактивных отходов. К 2030 году наши АЭС должны соответствовать самым строгим международным стандартам безопасности и эффективности, что не только продлит срок их службы, но и значительно повысит их производительность и надежность."
 
 UKR_energy_independence:0 "Энергетическая независимость"
 UKR_energy_independence_desc:0 "Десятилетиями энергетическая зависимость была ахиллесовой пятой Украины, делая нас уязвимыми перед политическим и экономическим давлением. Сегодня мы наконец способны обеспечить полную энергетическую независимость. Наша стратегия включает развитие синтетических видов топлива, строительство заводов по производству водорода из ядерной энергии, а также полный отказ от импорта российских энергоносителей. Модернизация газотранспортной системы, развитие возобновляемых источников энергии и создание замкнутого цикла производства ядерного топлива позволят превратить Украину из заложника энергетической политики соседей в полностью самодостаточное государство, способное экспортировать избыточную энергию в Европейский Союз. Внедрение новейших технологий энергосбережения и умных сетей существенно повысит эффективность наших промышленных предприятий, снизит потребление ресурсов и укрепит экономический суверенитет страны. Это не просто экономический вопрос - это вопрос национальной безопасности и суверенитета, который определит будущее нашего государства на десятилетия вперед."
 
 UKR_energy_self_sufficiency:0 "Энергетическая самодостаточность"
 UKR_factory_efficiency_increase:0 "Эффективность производства значительно повышена благодаря стабильному энергоснабжению и внедрению новых технологий энергосбережения"
 
 # Военная модернизация
 UKR_military_adaptability:0 "Военная адаптивность"  
 UKR_military_adaptability_desc:0 "Украина делает ставку на развитие военной инженерии, ремонтных мощностей и адаптацию вооружения под современные реалии. В условиях нестабильных поставок и нехватки ресурсов ключевую роль играет способность быстро восстанавливать поврежденную технику, модернизировать устаревшее оборудование и эффективно использовать трофейное вооружение. Мы расширяем сеть ремонтных баз и создаем мобильные бригады технического обслуживания, способные проводить полевой ремонт даже в сложных боевых условиях. Дополнительно реформируется система военного образования, обеспечивая подготовку высококвалифицированных специалистов в сфере механики, электроники и баллистики. Современные технологии и креативные инженерные решения позволят минимизировать зависимость от импорта, повысить боеспособность войск и укрепить оборонный потенциал страны."

 UKR_military_adaptability_idea:0 "Военная адаптация"  
 UKR_military_adaptability_tooltip:0 "Украинская оборонная промышленность и инженерные подразделения сосредоточены на адаптации, модернизации и восстановлении военной техники. Опытные инженеры и техперсонал обеспечивают быструю конверсию и ремонт оборудования, минимизируя зависимость от внешних поставок. Образовательные программы и обучение кадров способствуют развитию технических специальностей в армии, повышая эффективность полевого ремонта и логистики. Гибкость и технологическая адаптация позволяют использовать трофейное и устаревшее вооружение с максимальной эффективностью, обеспечивая устойчивость армии в условиях ограниченных ресурсов."
 
 UKR_military_industrial_complex:0 "Военно-промышленный комплекс"
 UKR_military_industrial_complex_desc:0 "Украинский ВПК обладает огромным потенциалом, унаследованным еще с советских времен, и способен обеспечить армию современным вооружением отечественного производства. Государственный концерн 'Укроборонпром', объединяющий более 100 предприятий в пяти основных отраслях оборонной промышленности, готов наладить серийное производство современных образцов вооружения и военной техники. Приоритетными направлениями являются: производство танков 'Оплот' с усиленной защитой и мощным 125-мм орудием, БТР-4 с боевым модулем 'Парус', модернизированных РСЗО 'Верба' и 'Ольха' с увеличенной дальностью и точностью, противотанковых комплексов 'Стугна-П' и 'Корсар', способных поражать современную бронетехнику, а также беспилотных систем различного назначения. \n\nРазконсервация и ремонт 120 современных танков с последующим их поступлением в ВСУ станет первым шагом к полному переоснащению наших бронетанковых сил. Особое внимание уделяется разработке и производству высокоточных боеприпасов."
 
 UKR_unique_tank_mods:0 "Открывает доступ к уникальным украинским модернизациям бронетехники, включая активную защиту 'Нож', комплексы динамической защиты нового поколения, современные прицельные комплексы и системы управления огнем"
 
 UKR_special_forces_equipment:0 "Оснащение сил специальных операций"
 UKR_special_forces_equipment_desc:0 "Современные конфликты требуют современных решений. Силы специальных операций Украины должны стать элитным высокоэффективным инструментом защиты национальных интересов как на своей территории, так и за её пределами. Программа оснащения включает закупку и разработку беспилотных разведывательных систем воздушного и наземного базирования, современных средств связи с многоуровневой криптозащитой, снайперских комплексов высокой точности для различных тактических задач, нелетального оружия для проведения специальных операций и индивидуальной экипировки бойца по стандартам НАТО. Особое внимание уделяется развитию разведывательных возможностей, включая подготовку специалистов для ведения агентурной работы, радиоперехвата и киберопераций, а также совершенствованию навыков противодиверсионных операций и борьбы с терроризмом. Оснащенные новейшим отечественным и западным оборудованием, наши силы специальных операций станут не только элитой украинской армии, но и мощным инструментом обеспечения национальной безопасности в сложных геополитических условиях."
 
 # Национальное возрождение
 UKR_decommunization:0 "Декоммунизация"
 UKR_decommunization_desc:0 "Советское наследие долгое время тормозило развитие украинского государства. Процесс декоммунизации - болезненный, но необходимый этап очищения национальной памяти и преодоления постсоветских комплексов. Пакет законов о декоммунизации предусматривает запрет коммунистической и нацистской символики и пропаганды, открытие архивов советских спецслужб (в особенности КГБ и его предшественников), переименование населенных пунктов, улиц и площадей, носящих имена коммунистических деятелей, демонтаж памятников советским деятелям и установку новых монументов героям Украины. По всей стране были демонтированы тысячи памятников Ленину и другим деятелям коммунистического режима, переименованы сотни населенных пунктов (например, Днепропетровск стал Днепром, Кировоград - Кропивницким) и тысячи улиц. Несмотря на временное снижение общественной поддержки и возможные конфликты, особенно в восточных и южных регионах, где сильны просоветские настроения, эти меры необходимы для формирования новой украинской идентичности, свободной от тоталитарного прошлого. Политика декоммунизации направлена на окончательное разрушение остатков тоталитарного прошлого - от символического уровня до изменения общественного сознания."
 
 UKR_decommunization_decisions:0 "Открывает категорию решений 'Декоммунизация', позволяющую проводить конкретные мероприятия по избавлению от советского наследия, переименованию объектов и обновлению исторической памяти"
 soviet_legacy:0 "Советское наследие"

 #UKR_decommunization
 #Главное событие
 ukraine.1000.t:0 "Декоммунизация Украины"
 ukraine.1000.d:0 "С момента обретения независимости в 1991 году украинская политическая и интеллектуальная элита стремилась определить свой собственный исторический нарратив, отличный от советского. Тем не менее, советское наследие глубоко укоренилось в общественных пространствах, образовательной системе и исторической памяти. Памятники советским деятелям до сих пор стоят на площадях городов, улицы и целые населенные пункты носят имена коммунистических лидеров, а в учебниках истории сохраняются устаревшие интерпретации событий. \n\nДекоммунизация представляет собой процесс критического пересмотра советского периода истории и устранения его символического присутствия в публичном пространстве. Однако этот процесс вызывает острые дебаты. Радикальное крыло выступает за полное очищение публичного пространства от коммунистического наследия и переписывание истории с более националистических позиций. Умеренные силы настаивают на более взвешенном подходе - критике тоталитарных аспектов режима при сохранении положительных аспектов социального развития советского периода.\n\nКакой подход мы выберем в этот критический момент истории Украины?"
 ukraine.1000.a:0 "Пришло время пересмотреть наше отношение к советскому прошлому"
 UKR_decommunization_begin_tt:0 "Мы начинаем процесс декоммунизации Украины. Наши решения определят будущее отношение страны к советскому прошлому."

 #Событие 1: Цифровой архив репрессий
 ukraine.1001.t:0 "Цифровой архив политических репрессий"
 ukraine.1001.d:0 "Между 1917 и 1991 годами миллионы украинцев стали жертвами политических репрессий. Голодомор 1932-1933 годов унес жизни до 4 миллионов украинцев. В период Большого террора 1937-1938 годов сотни тысяч были расстреляны или отправлены в ГУЛАГ. Последующие волны репрессий и депортаций, включая массовые выселения крымских татар в 1944 году, продолжили эту трагическую историю.\n\nАрхивы КГБ и других органов советской власти содержат огромное количество документов об этих преступлениях. Создание цифрового архива репрессий могло бы помочь сохранить память о жертвах, предоставить родственникам информацию о судьбах их близких и способствовать исторической справедливости.\n\nОднако возникает вопрос о том, как именно организовать этот архив. Следует ли предоставить полный и неограниченный доступ ко всем документам, включая личные дела жертв и информаторов? Или же необходимо ограничить доступ к особо чувствительным данным, защищая право на приватность? Возможно, стоит вообще оставить эти архивы закрытыми, чтобы не бередить старые раны?"
 ukraine.1001.a:0 "Создать полный цифровой архив со свободным доступом"
 ukraine.1001.b:0 "Предоставить ограниченный доступ, защищая личные данные"
 ukraine.1001.c:0 "Оставить архивы в текущем состоянии"
 UKR_full_archive_access_tt:0 "§RРадикальный подход:§! Полное открытие архивов вызовет общественный резонанс и негодование среди сторонников левых идей. Многие узнают о судьбах своих родственников, но будут обнародованы и данные информаторов, что приведет к конфликтам."
 UKR_moderate_archive_access_tt:0 "§YУмеренный подход:§! Избирательный подход к открытию архивов позволит сохранить память о жертвах, не нарушая приватности потомков как жертв, так и виновных в репрессиях."
 UKR_nope_archive_access_tt:0 "§GСтатус-кво:§! Сохранение закрытости архивов предотвратит общественные потрясения, но затруднит процесс исторического примирения."

 #Событие 2: Демонтаж советских памятников
 ukraine.1002.t:0 "Демонтаж советских памятников"
 ukraine.1002.d:0 "Городские пространства Украины насыщены монументами советской эпохи. Памятники Ленину, Дзержинскому, Щорсу и другим деятелям коммунистического режима можно найти в каждом крупном городе. Многие из этих фигур напрямую связаны с политическими репрессиями и насильственной советизацией Украины.\n\nФеликс Дзержинский, основатель ЧК, организовал массовые политические репрессии. Николай Щорс командовал большевистскими войсками во время гражданской войны. Григорий Петровский, чьим именем был назван целый район Киева, подписывал документы о массовых расстрелах и коллективизации, приведшей к Голодомору.\n\nВопрос демонтажа этих памятников стал предметом общественной дискуссии. Одни требуют полного демонтажа всех монументов, связанных с коммунистическим прошлым. Другие предлагают более избирательный подход - убрать памятники наиболее одиозным фигурам, но сохранить монументы, посвященные культурным деятелям или героям войны. Третьи настаивают на сохранении памятников как части культурного наследия, независимо от их политического контекста."
 ukraine.1002.a:0 "Демонтировать все советские памятники без исключения"
 ukraine.1002.b:0 "Позволить народу самостоятельно решить судьбу памятников"
 ukraine.1002.c:0 "Демонтировать только памятники причастным к репрессиям"
 ukraine.1002.m:0 "Сохранить памятники как историческое наследие"
 UKR_full_monuments_removal_tt:0 "§RРадикальный подход:§! Тотальный демонтаж всех советских памятников вызовет раскол в обществе, но продемонстрирует решительный разрыв с коммунистическим прошлым."
 UKR_crowd_monuments_removal_tt:0 "§RРадикальный подход:§! Стихийное разрушение памятников («ленинопад») создаст атмосферу гражданского неповиновения и приведет к эпизодам насилия, но станет символом народного отвержения советской идеологии."
 UKR_selective_monuments_removal_tt:0 "§YУмеренный подход:§! Избирательный демонтаж позволит сохранить культурно значимые монументы, одновременно избавившись от символов репрессий."
 UKR_keep_monuments_tt:0 "§GСтатус-кво:§! Сохранение памятников избавит от финансовых затрат и общественных конфликтов, но затормозит процесс национальной идентификации."

 #Событие 3: Открытие архивов КГБ
 ukraine.1003.t:0 "Открытие архивов КГБ"
 ukraine.1003.d:0 "Архивы КГБ содержат обширную информацию не только о жертвах репрессий, но и о методах работы советских спецслужб, их агентурной сети и операциях. Эти документы могли бы пролить свет на многие темные страницы истории Украины: принудительная коллективизация, Голодомор, массовые расстрелы, депортации, преследование инакомыслящих.\n\nНапример, в архивах хранятся документы о деятельности печально известного Василия Блохина, главного палача НКВД, лично расстрелявшего тысячи людей. Или материалы о Павле Судоплатове, организаторе убийств украинских националистических лидеров за рубежом.\n\nОднако открытие этих архивов несет в себе риски. Многие документы содержат конфиденциальную информацию о гражданах, включая тех, кто сотрудничал с органами госбезопасности. Полное раскрытие таких материалов может привести к общественным конфликтам и даже актам возмездия.\n\nКакую политику следует проводить в отношении этих архивов?"
 ukraine.1003.a:0 "Полностью открыть все архивы для общественности"
 ukraine.1003.b:0 "Предоставить доступ только историкам и исследователям"
 ukraine.1003.c:0 "Обеспечить ограниченный доступ к избранным материалам"
 ukraine.1003.m:0 "Увеличить срок государственной тайны для этих документов"
 UKR_full_archives_tt:0 "§RРадикальный подход:§! Полное раскрытие архивов приведет к громким разоблачениям, общественным конфликтам и переоценке исторических событий."
 UKR_historians_archives_tt:0 "§YУмеренный подход:§! Предоставление доступа только профессиональным историкам обеспечит научное изучение документов без излишнего общественного резонанса."
 UKR_limited_archives_tt:0 "§YУмеренный подход:§! Ограниченный доступ к избранным материалам позволит постепенно интегрировать новые исторические факты в общественное сознание."
 UKR_keep_archives_secret_tt:0 "§GСтатус-кво:§! Сохранение секретности архивов предотвратит возможные конфликты, но затруднит процесс исторического примирения."

 #Событие 4: Реформа исторического образования
 ukraine.1004.t:0 "Реформа исторического образования"
 ukraine.1004.d:0 "Школьные и университетские учебники истории долгое время формировались под влиянием советской историографии. Многие события, особенно связанные с украинским национально-освободительным движением, освещались искаженно или замалчивались.\n\nНапример, Украинская Народная Республика (1917-1921) представлялась как буржуазное националистическое образование, а не как попытка создания независимого демократического государства. Голодомор 1932-1933 годов либо не упоминался вовсе, либо описывался как неизбежное следствие неурожая, а не как результат преднамеренной политики советского руководства.\n\nТеперь перед нами стоит задача реформирования исторического образования. Следует ли полностью пересмотреть советскую интерпретацию истории и представить РСФСР как оккупанта украинских земель? Или же нужно стремиться к более объективному, научно обоснованному изложению исторических событий, признавая как негативные, так и позитивные аспекты советского периода?"
 ukraine.1004.a:0 "Переписать историю: РСФСР - оккупант Украины"
 ukraine.1004.b:0 "Оставить существующие учебники без изменений"
 ukraine.1004.c:0 "Создать объективные учебники на основе исторических фактов"
 ukraine.1004.m:0 "Акцентировать внимание на репрессиях и преступлениях режима"
 UKR_radical_education_reform_tt:0 "§RРадикальный подход:§! Полное переписывание истории с националистических позиций разорвет связь с советским историческим нарративом, но может привести к новым искажениям."
 UKR_no_education_reform_tt:0 "§GСтатус-кво:§! Сохранение существующих учебников сэкономит ресурсы, но законсервирует устаревшие интерпретации истории."
 UKR_balanced_education_reform_tt:0 "§YУмеренный подход:§! Создание объективных учебников, основанных на исторических фактах, поможет формированию критического мышления у молодого поколения."
 UKR_emphasis_crimes_education_tt:0 "§YУмеренно-радикальный подход:§! Акцент на преступлениях режима подчеркнет его тоталитарный характер, сохраняя при этом признание социальных достижений советского периода."

 #Событие 5: Институт национальной памяти
 ukraine.1005.t:0 "Создание Института национальной памяти"
 ukraine.1005.d:0 "Для систематической работы с историческим наследием и формирования новой политики памяти предлагается создать специализированное учреждение - Институт национальной памяти. Этот институт мог бы координировать архивные исследования, разрабатывать рекомендации по реформе образования, заниматься мемориализацией жертв тоталитарных режимов и просветительской деятельностью.\n\nОднако возникает вопрос о том, какую именно миссию должен выполнять этот институт. Должен ли он стать инструментом декоммунизации и европеизации, продвигая западные ценности и интерпретации истории? Или же ему следует стремиться к исторической объективности, признавая сложность и неоднозначность прошлого?\n\nОсобое внимание может быть уделено Голодомору - одной из самых трагических страниц украинской истории. Создание специального исследовательского центра, посвященного этой трагедии, могло бы способствовать более глубокому пониманию ее причин и последствий.\n\nКакую модель Института национальной памяти мы выбираем?"
 ukraine.1005.a:0 "Институт как инструмент декоммунизации и европеизации"
 ukraine.1005.b:0 "Пустая трата денег - отказаться от создания института"
 ukraine.1005.c:0 "Институт как средство исторической объективности"
 ukraine.1005.m:0 "Создать специальный институт изучения Голодомора"
 UKR_european_memory_tt:0 "§RРадикальный подход:§! Институт будет активно продвигать европейские ценности и интерпретации истории, способствуя интеграции Украины в западный культурный контекст."
 UKR_no_memory_institute_tt:0 "§GСтатус-кво:§! Отказ от создания института сэкономит бюджетные средства, но затруднит формирование систематической политики памяти."
 UKR_objective_memory_tt:0 "§YУмеренный подход:§! Институт будет стремиться к исторической объективности, признавая сложность и неоднозначность прошлого."
 UKR_holodomor_memory_tt:0 "§YУмеренно-радикальный подход:§! Акцент на исследовании Голодомора подчеркнет трагический характер советской политики в отношении Украины, но сохранит научный подход к истории."

 #Финальное событие
 ukraine.1006.t:0 "Итоги декоммунизации"
 ukraine.1006.d:0 "Процесс декоммунизации, начатый нами, подходит к своему логическому завершению. Мы приняли ряд решений, определивших отношение нашего государства к советскому прошлому и способам его интерпретации. Теперь пришло время оценить результаты этой политики и ее влияние на украинское общество.\n\nНаши решения сформировали определенный подход к историческому наследию, который будет определять общественный дискурс и национальную идентичность на долгие годы вперед. Какое наследие мы оставляем будущим поколениям? Какие уроки они извлекут из нашей политики памяти?"
 ukraine.1006.a:0 "Радикальная декоммунизация успешно завершена!"
 ukraine.1006.b:0 "Умеренная декоммунизация принесла свои плоды"
 ukraine.1006.c:0 "Смешанный подход дал неоднозначные результаты"
 ukraine.1006.m:0 "Процесс декоммунизации провалился..."
 UKR_radical_path_completed_tt:0 "§RРадикальная декоммунизация:§! Мы полностью разорвали связи с советским прошлым, переписали историю с националистических позиций и очистили публичное пространство от коммунистической символики. Это вызвало определенное напряжение в обществе, но укрепило украинскую национальную идентичность и ускорило интеграцию в западный культурный контекст."
 UKR_moderate_path_completed_tt:0 "§YУмеренная декоммунизация:§! Мы критически пересмотрели советское наследие, признали преступления тоталитарного режима, но сохранили объективный подход к истории. Это способствовало общественному примирению и формированию более зрелой национальной идентичности, основанной на фактах, а не на мифах."
 UKR_mixed_path_completed_tt:0 "§YСмешанный подход:§! Наши решения не были последовательными, что привело к неоднозначным результатам. В одних сферах мы проявили радикализм, в других - умеренность или даже консерватизм. Это создало определенную путаницу в исторической политике, но позволило учесть разнообразие мнений в украинском обществе."
 UKR_bad_path_completed_tt:0 "§GПровал декоммунизации:§! Мы не смогли выработать четкую политику в отношении советского наследия, что привело к сохранению старых интерпретаций истории и символики. Это затормозило формирование современной украинской идентичности и вызвало разочарование среди патриотически настроенных граждан."
 
 UKR_decommunization_category:0 "Меры по декоммунизации"
 UKR_decommunization_category_desc:0 "Декоммунизация остается важной частью исторической политики Украины, направленной на избавление от советского наследия, укрепление национальной идентичности и переосмысление исторического прошлого. Эти меры включают демонтаж советских памятников, реформу исторического образования и рассекречивание архивов спецслужб. Хотя они вызывают споры, их значение в формировании будущего Украины трудно переоценить."

 UKR_digital_repressions_archive:0 "Цифровизация архивов репрессий"
 UKR_digital_repressions_archive_desc:0 "Украина приступает к масштабному проекту цифровизации и анализа архивов политических репрессий советского периода. Этот шаг направлен на увековечение памяти жертв репрессий, а также на обеспечение доступа общества к историческим материалам. Публикация архивных данных становится важным элементом исторической справедливости и национальной памяти."

 UKR_monuments_removal:0 "Демонтаж советских памятников"
 UKR_monuments_removal_desc:0 "Масштабная программа по демонтажу советских памятников и коммунистической символики. Это решение направлено на устранение идеологического влияния СССР в общественных пространствах и замену старых символов новыми, отражающими национальную историю Украины. Однако такие действия вызывают споры: часть общества считает их необходимыми, а другие видят в них попытку переписывания истории."

 UKR_kgb_archives:0 "Рассекречивание архивов КГБ"
 UKR_kgb_archives_desc:0 "Следуя примеру других постсоветских стран, Украина приступает к рассекречиванию архивов КГБ. Публикация этих документов открывает обществу доступ к ранее засекреченным данным о репрессиях, слежке за гражданами и преследовании инакомыслящих. Это шаг к прозрачности, но он может вызвать политические и дипломатические осложнения."

 UKR_history_education_reform:0 "Реформа исторического образования"
 UKR_history_education_reform_desc:0 "Правительство инициирует реформу системы исторического образования, пересматривая учебные программы с целью критической переоценки советского наследия. Теперь акцент делается на национальной истории Украины, движениях сопротивления и последствиях советской политики. Эта реформа необходима для формирования национального самосознания, но также вызывает споры вокруг объективности преподавания истории."

 UKR_national_memory_institute:0 "Институт национальной памяти"
 UKR_national_memory_institute_desc:0 "Создается новый институт, занимающийся изучением исторической памяти и борьбой с попытками пересмотра истории в пользу советской интерпретации. Институт национальной памяти ведет научные исследования, проводит просветительскую работу и участвует в разработке законодательных инициатив по декоммунизации. Его деятельность играет ключевую роль в формировании исторической политики Украины, но остается предметом дискуссий в политических кругах."
 UKR_national_memory_institute_radical:0 "Институт памяти: курс на декоммунизацию"
 UKR_national_memory_institute_radical_desc:0 "Институт национальной памяти стал инструментом активной декоммунизации: переименования, архивы, законодательные инициативы. Государство говорит о прошлом твёрдо и однозначно - это сплачивает одних и раздражает других."
 UKR_national_memory_institute_moderate:0 "Институт памяти: историческая объективность"
 UKR_national_memory_institute_moderate_desc:0 "Институт работает как научное учреждение: открытые архивы, исследования, дискуссии с участием историков из разных стран. Медленнее, зато без лишних скандалов."
 UKR_national_memory_institute_moderate_Holodomor:0 "Институт памяти жертв Голодомора"
 UKR_national_memory_institute_moderate_Holodomor_desc:0 "Главным направлением работы института стало изучение Голодомора и увековечение памяти его жертв. Общая трагедия объединяет общество сильнее любых лозунгов."


 UKR_radical_decommunization_complete:0 "Радикальная декоммунизация"
 UKR_radical_decommunization_complete_desc:0 "Полная ликвидация коммунистического наследия в политике, культуре и общественной жизни. Левые идеи вытесняются из общественного дискурса, а национальная идентичность выходит на первый план."

 UKR_moderate_decommunization_complete:0 "Умеренная декоммунизация"
 UKR_moderate_decommunization_complete_desc:0 "Постепенное и сбалансированное избавление от коммунистического прошлого. Власти внедряют реформы, ограничивающие влияние тоталитарных идеологий, но при этом сохраняют преемственность в образовательной и социальной сферах."

 UKR_mixed_decommunization_outcome:0 "Смешанный подход к декоммунизации"
 UKR_mixed_decommunization_outcome_desc:0 "Компромиссный вариант реформ, учитывающий интересы различных групп. Декоммунизация сочетается с элементами социальной справедливости, что способствует укреплению национального согласия и стабильности."

 UKR_ukrainian_renaissance:0 "Украинское возрождение"
 UKR_ukrainian_renaissance_desc:0 "Возрождение украинской культуры, языка и идентичности - не просто символический жест, а стратегическая необходимость в условиях информационного противостояния. Культурное возрождение Украины - не менее важная задача, чем экономическое развитие или укрепление обороноспособности. Государственная поддержка украинского кинематографа (через систему грантов и субсидий Госкино), литературы (программа 'Украинская книга'), музыки, театра и других видов искусства привлечет творческую молодежь и создаст условия для формирования новой культурной элиты. Украинизация информационного пространства через систему квот на украиноязычный контент в радио- и телеэфире, запуск новых культурных проектов и каналов, повышение конкурентоспособности украинского медиапродукта против российской культурной экспансии. \n\nПрограмма 'Культурная дипломатия' предусматривает проведение фестивалей украинской культуры за рубежом, участие в международных творческих проектах и создание позитивного имиджа страны. Укрепляя свою культурную самобытность, мы создаем основу для национального единства и противостоим внешним информационным угрозам."
 
 UKR_cultural_reforms:0 "Культурные реформы"
 UKR_culture_decisions:0 "Открывает категорию решений 'Культурное развитие', расширяющую возможности для поддержки национальной культуры, украинского языка и продвижения культурных проектов"
 
 UKR_education_reform:0 "Реформа образования"
 UKR_education_reform_desc:0 "Будущее нации формируется в классах и лабораториях. Школьное образование трансформируется с акцентом на компетентностный подход, вводится 12-летнее обучение с профильным образованием в старших классах. В высшем образовании будет усилена автономия университетов, внедрены антиплагиатные системы и механизмы академической добропорядочности, развиваются программы двойных дипломов с европейскими вузами. Особое внимание уделяется развитию точных наук, IT-образования и инженерных специальностей для обеспечения технологического прорыва. Реформа предусматривает создание сети современных научно-исследовательских лабораторий с новейшим оборудованием, привлечение зарубежных ученых и возвращение украинских научных кадров из-за границы."
 
 UKR_education_future:0 "Образование будущего"
 
 # Технологии и идеи
 UKR_nuclear_reactor_up:0 "Модернизация ядерных реакторов"
 UKR_synth_resources:0 "Синтетические ресурсы"

 #Фокусы COVID
 UKR_address_covid_threat:0 "Противостоять угрозе COVID-19"
 UKR_address_covid_threat_desc:0 "Новый коронавирус, стремительно распространяющийся по миру, достиг границ нашей страны. Пандемия COVID-19 представляет беспрецедентную угрозу не только для здоровья граждан, но и для экономической стабильности и национальной безопасности Украины. Правительство должно принять срочные меры по защите населения, мобилизации медицинских ресурсов и минимизации социально-экономических последствий кризиса. Время действовать решительно - каждый день промедления может стоить сотен жизней и миллиардов гривен. Только скоординированные усилия всех ветвей власти и общества позволят Украине преодолеть этот глобальный вызов с минимальными потерями."

 # Названия решений COVID
 UKR_implement_adaptive_quarantine:0 "Ввести адаптивный карантин"
 UKR_expand_healthcare_budget:0 "Расширить бюджет здравоохранения"
 UKR_healthy_nation_program:0 "Запустить программу «Здоровая нация»"
 UKR_vaccinate_population:0 "Вакцинировать население"
 UKR_enforce_lockdowns:0 "Ввести строгий локдаун"
 UKR_use_army_aganist_covid:0 "Привлечь армию к борьбе с COVID-19"

 # Описания COVDI
 UKR_implement_adaptive_quarantine_desc:0 "В условиях стремительного распространения пандемии COVID-19 традиционные методы борьбы с эпидемиями оказываются малоэффективными. Адаптивный карантин позволит нам вводить ограничения в зависимости от эпидемиологической обстановки в конкретных регионах, разделив страну на «зоны» различного уровня опасности. Это поможет сохранить баланс между здоровьем граждан и функционированием экономики."
 
 UKR_expand_healthcare_budget_desc:0 "Система здравоохранения Украины оказалась не готова к масштабной пандемии. Срочное расширение финансирования медицинской сферы позволит закупить необходимое оборудование для больниц, создать дополнительные койко-места и обеспечить медицинский персонал средствами индивидуальной защиты. Вливание средств в здравоохранение - не просто мера против COVID-19, но и стратегическая инвестиция в будущее нации."
 
 UKR_healthy_nation_program_desc:0 "Пандемия показала, насколько важно общее здоровье населения для противостояния новым угрозам. Программа «Здоровая нация» будет включать информационные кампании о профилактике заболеваний, популяризацию здорового образа жизни и меры по укреплению иммунитета граждан. Особое внимание будет уделено развитию спорта в домашних условиях: серии онлайн-тренировок, рекомендации по организации физической активности в ограниченном пространстве и советы по укреплению иммунитета через правильное питание и режим дня. Через телевидение и социальные сети граждане получат доступ к качественным образовательным материалам, которые помогут им поддерживать здоровье даже в условиях карантинных ограничений. Пусть наш народ выйдет из пандемии более сильным и здоровым, чем когда-либо."
 
 UKR_vaccinate_population_desc:0 "С появлением вакцин против COVID-19 открывается путь к окончательной победе над пандемией. Массовая вакцинация населения требует значительных организационных усилий и ресурсов, но является единственным надежным способом вернуться к нормальной жизни. Создав эффективную программу вакцинации, мы не только защитим здоровье граждан, но и укрепим авторитет страны на международной арене."
 
 UKR_enforce_lockdowns_desc:0 "В условиях критического роста заболеваемости мы вынуждены пойти на решительные меры. Введение строгого локдауна временно ограничит экономическую активность и свободу передвижения граждан, но позволит разорвать цепочки передачи вируса и снизить нагрузку на медицинскую систему. Жесткие ограничения сегодня - это спасенные жизни завтра."
 
 UKR_use_army_aganist_covid_desc:0 "В чрезвычайной ситуации необходимо использовать все доступные ресурсы. Военнослужащие Вооруженных Сил Украины могут оказать неоценимую помощь в борьбе с пандемией: от развертывания полевых госпиталей до обеспечения соблюдения карантинных мер. Армейская дисциплина и организованность помогут нам преодолеть кризис с минимальными потерями."

 # Эффекты и подсказки COVDI
 UKR_adaptive_quarantine_tooltip:0 "Введение адаптивного карантина позволит более гибко реагировать на эпидемиологическую ситуацию в различных регионах."
 UKR_expanded_healthcare_budget_tooltip:0 "Дополнительное финансирование здравоохранения поможет справиться с кризисом, но временно снизит доходы бюджета."
 UKR_healthy_nation_initiative_tooltip:0 "Программа «Здоровая нация» повысит осведомленность населения о профилактике COVID-19 и укрепит общественное здоровье."
 # Категория решений COVDI
 UKR_covid_response_decisions:0 "Борьба с пандемией COVID-19"
 UKR_covid_response_decisions_desc:0 "Пандемия коронавируса стала серьезным испытанием для Украины. Правительству предстоит принять ряд мер по сдерживанию распространения инфекции, поддержке системы здравоохранения и минимизации экономических потерь. От эффективности этих решений зависит, как быстро страна сможет преодолеть кризис и вернуться к нормальной жизни."

 # Национальные духи COVDI
 UKR_adaptive_quarantine:0 "Адаптивный карантин"
 UKR_adaptive_quarantine_desc:0 "Система ограничительных мер, основанная на разделении территории страны на зоны с различным уровнем эпидемиологической опасности. В каждой зоне действует свой набор ограничений в зависимости от показателей заболеваемости. Такой подход позволяет сдерживать распространение инфекции без полной остановки экономической деятельности во всей стране, но требует значительных административных ресурсов для контроля и координации."

 UKR_expanded_healthcare_budget:0 "Расширенный бюджет здравоохранения"
 UKR_expanded_healthcare_budget_desc:0 "Существенное увеличение финансирования медицинской сферы для борьбы с пандемией. Дополнительные средства направлены на закупку аппаратов ИВЛ, кислородных концентраторов, средств индивидуальной защиты для медработников, расширение коечного фонда и доплаты медицинскому персоналу. Эти расходы ложатся тяжелым бременем на государственный бюджет, но являются необходимыми для спасения жизней граждан и предотвращения коллапса системы здравоохранения."

 UKR_healthy_nation_initiative:0 "Инициатива «Здоровая нация»"
 UKR_healthy_nation_initiative_desc:0 "Комплексная государственная программа, направленная на укрепление здоровья населения в условиях пандемии. Включает в себя широкую информационную кампанию о профилактике COVID-19, популяризацию домашних физических упражнений, рекомендации по правильному питанию и режиму дня для поддержания иммунитета. Участники программы - известные спортсмены, врачи и диетологи - регулярно проводят онлайн-занятия и консультации. Инициатива не только помогает гражданам поддерживать физическую форму в условиях карантина, но и способствует формированию более ответственного отношения к собственному здоровью."

 UKR_covid_crisis:0 "Кризис COVID-19"
 UKR_covid_crisis_desc:0 "Пандемия коронавируса вызвала серьезный кризис в здравоохранении, экономике и социальной сфере. Переполненные больницы, нехватка медицинского персонала и оборудования, падение производства, рост безработицы и социальная напряженность - все это стало реальностью для Украины. Государство вынуждено балансировать между необходимостью жестких карантинных мер для защиты здоровья граждан и сохранением экономической активности. Преодоление кризиса требует принятия сложных, порой непопулярных решений и мобилизации всех доступных ресурсов."
  # Событие начала COVID-19
 ukraine.400.t:0 "COVID-19 достиг Украины"
 ukraine.400.d:0 "Сегодня в Украине подтвержден первый случай заболевания COVID-19. Пациент, вернувшийся из-за границы, был госпитализирован в изолированную палату. Его состояние оценивается как стабильное. Министерство здравоохранения сообщает, что все контактировавшие с ним лица находятся под наблюдением врачей.\n\nЭксперты предупреждают, что это только начало. Опыт других стран показывает, как быстро может распространяться новый коронавирус. Наша система здравоохранения, ослабленная годами недофинансирования, может оказаться не готова к масштабной эпидемии.\n\nПравительство уже начало разрабатывать план действий по противодействию распространению вируса. Однако многое будет зависеть от того, насколько серьезно общество отнесется к этой угрозе и будет ли соблюдать необходимые меры предосторожности."
 ukraine.400.a:0 "Нам нужно принять решительные меры."

 # Событие завершения пандемии COVID-19
 ukraine.401.t:0 "Пандемия COVID-19 побеждена"
 ukraine.401.d:0 "Сегодня Министерство здравоохранения Украины объявило о полном снятии всех противоэпидемических ограничений, связанных с COVID-19. За последние два месяца количество новых случаев заболевания стабильно держится на минимальном уровне, а система здравоохранения работает в обычном режиме.\n\nПандемия стала серьезным испытанием для нашей страны. Мы потеряли многих граждан, экономика понесла значительный ущерб, а некоторые отрасли до сих пор не вернулись к докризисному уровню. Однако кризис также показал способность украинского общества объединяться перед лицом угрозы и адаптироваться к новым реалиям.\n\nМедицинская система страны получила значительное развитие, были внедрены новые протоколы лечения и профилактики инфекционных заболеваний. Многие граждане стали более ответственно относиться к своему здоровью и гигиене. Эти позитивные изменения останутся с нами и после завершения пандемии.\n\nХотя COVID-19 не исчез полностью, он больше не представляет такой серьезной угрозы для общественного здоровья, как раньше. Украина, наконец, может перевернуть эту страницу истории и сосредоточиться на восстановлении и развитии."
 ukraine.401.a:0 "Мы выстояли в этом испытании."

 # Подсказка для эффекта
 UKR_covid_tt:0 "Пандемия COVID-19 в Украине..."
 UKR_covid_over_tt:0 "Пандемия COVID-19 в Украине окончена."

 # Категория решений ВОЙНЫ
 UKR_against_occupiers:0 "Противостояние агрессору"
 UKR_against_occupiers_desc:0 "В час испытаний мы должны использовать все возможные средства для противостояния российской агрессии. Дипломатическими и военными методами мы обеспечим суверенитет Украины."
 
 # Решения для международной поддержки
 UKR_resistance_coalition:0 "Сформировать коалицию сопротивления"
 UKR_resistance_coalition_desc:0 "Россия рассчитывала на разобщенность мирового сообщества. Нам необходимо создать коалицию демократических стран для поддержки нашей борьбы. Европейские партнеры готовы оказать политическую и материальную поддержку Украине в противостоянии агрессии."
 
 UKR_idea_resistance_coalition:0 "Коалиция сопротивления"
 UKR_idea_resistance_coalition_desc:0 "Объединенная коалиция западных стран оказывает политическую, экономическую и военную поддержку Украине. Это усиливает нашу позицию на дипломатической арене и повышает моральный дух населения."
 
 UKR_regional_alliance:0 "Региональный оборонительный альянс"
 UKR_regional_alliance_desc:0 "Страны Восточной Европы, имеющие общий опыт сопротивления российскому давлению, готовы к более тесному оборонительному сотрудничеству. Польша, страны Балтии и Украина могут создать региональный блок, который укрепит нашу общую безопасность."
 
 UKR_idea_regional_alliance:0 "Восточноевропейский оборонительный альянс"
 UKR_idea_regional_alliance_desc:0 "Совместные усилия стран Восточной Европы по противодействию российской угрозе. Альянс предусматривает обмен разведданными, координацию военных действий и логистическую поддержку."
 
 UKR_idea_regional_alliance_member:0 "Член Восточноевропейского оборонительного альянса"
 UKR_idea_regional_alliance_member_desc:0 "Наша страна является частью регионального альянса, направленного на сдерживание российской агрессии в Восточной Европе."
 
 UKR_lend_lease_program:0 "Программа ленд-лиза"
 UKR_lend_lease_program_desc:0 "Наши западные партнеры готовы предоставить необходимое вооружение и военное снаряжение по программе, аналогичной исторической помощи США союзникам во время Второй мировой войны. Это критично важно для нашей способности противостоять превосходящим силам противника."
 
 UKR_idea_lend_lease:0 "Западный ленд-лиз"
 UKR_idea_lend_lease_desc:0 "Сотни единиц вооружения и тысячи единиц снаряжения поступают в украинскую армию от западных союзников, что существенно повышает нашу боеспособность и позволяет компенсировать численное превосходство противника."
 
 #Флот и порт
 UKR_port_infrastructure_investment:0 "Модернизация портовой инфраструктуры Одессы"
 UKR_port_infrastructure_investment_desc:0 "После потери Крыма и российской агрессии Одесский порт становится критически важным узлом национальной экономики. До 2014 года порт обрабатывал более 25 млн тонн грузов ежегодно, но потеря Крыма сократила грузооборот на 40%. Модернизация включает расширение контейнерных терминалов, реконструкцию причальных сооружений и внедрение современных логистических технологий. Наша цель - увеличить грузооборот до 35 млн тонн и превратить Одессу в ключевой транспортный хаб Черноморского региона."

 UKR_maritime_revival:0 "Возрождение военно-морского потенциала"
 UKR_maritime_revival_desc:0 "После аннексии Крыма ВМС Украины потеряли более 70% своего флота. Сегодня на вооружении остались два патрульных катера проекта 'Айленд' - 'Слава Украине' и 'Независимость'. Стратегия возрождения флота предусматривает создание современной базы в Одессе, закупку новых патрульных судов и развитие морской авиации. Особый акцент - на легких быстроходных катерах, способных эффективно действовать в условиях асимметричной войны."

 UKR_convoy_fleet_development:0 "Развитие торгового судоходства"
 UKR_convoy_fleet_development_desc:0 "Торговая война с Россией привела к обвалу двустороннего товарооборота с 38 млрд долларов в 2013 году до менее 4 млрд в 2022. Украина вынуждена перестраивать логистические маршруты. Программа развития торгового флота предусматривает создание национального торгового флота, способного работать в условиях блокированных портов и альтернативных морских коридоров. Планируется увеличение числа балкеров и контейнеровозов для диверсификации международной торговли."

 UKR_maritime_doctrine_adaptation:0 "Адаптация военно-морской доктрины"
 UKR_maritime_doctrine_adaptation_desc:0 "Новая военно-морская доктрина учитывает уроки конфликта в Азовском море и потери Крыма. Основные принципы: мобильность, асимметричные действия и высокотехнологичное вооружение. Особое внимание - беспилотной морской технике, прибрежным ударным комплексам и интеграции морской компоненты с сухопутными и воздушными силами. Цель - создание флота, способного эффективно действовать в условиях гибридной войны."

 UKR_maritime_defense_strategy:0 "Комплексная стратегия морской обороны"
 UKR_maritime_defense_strategy_desc:0 "Стратегия предусматривает создание многоуровневой системы морской безопасности. Ключевые элементы: развитие прибрежных систем обороны, включая противокорабельные ракетные комплексы, создание сети морских и воздушных датчиков, подготовка специальных морских подразделений для действий в сложной тактической обстановке. Особый акцент на киберзащите и электронной warfare для противодействия российским военно-морским силам."

 UKR_port_infrastructure_tooltip:0 "Комплексная модернизация портовой инфраструктуры"
 UKR_convoy_fleet_development_tooltip:0 "Создание современного торгового флота"
 UKR_maritime_defense_strategy_tooltip:0 "Формирование эффективной системы морской обороны"

 # Решения для внутренней безопасности
 UKR_SBU_emergency_powers:0 "Чрезвычайные полномочия СБУ"
 UKR_SBU_emergency_powers_desc:0 "В условиях войны необходимо предоставить Службе безопасности Украины расширенные полномочия для эффективного противодействия российской агентуре, диверсионным группам и пропаганде противника на нашей территории."
 
 UKR_idea_SBU_emergency_powers:0 "Усиленный режим контрразведки"
 UKR_idea_SBU_emergency_powers_desc:0 "Служба безопасности Украины проводит активные мероприятия по выявлению шпионов, диверсантов и сторонников противника. Это повышает нашу внутреннюю безопасность, но требует дополнительных ресурсов и наносит определенный ущерб гражданским свободам."
 
 # Решения для логистики и экономики
 UKR_carpathian_logistics_plan:0 "Карпатский логистический план"
 UKR_carpathian_logistics_plan_desc:0 "Карпатский регион с его горной местностью и труднодоступными территориями может стать надежным тылом для наших военных операций. Разработка специального логистического плана, включающего создание запасных складов горючего и оборудование защищенных маршрутов снабжения, значительно укрепит нашу оборонительную позицию."
 
 UKR_idea_carpathian_logistics:0 "Карпатская логистическая сеть"
 UKR_idea_carpathian_logistics_desc:0 "Разветвленная сеть защищенных маршрутов снабжения и складов в Карпатском регионе обеспечивает надежный тыл для наших вооруженных сил. Даже в случае временной потери контроля над восточными территориями, мы сохраняем логистическую устойчивость."
 
 UKR_civilian_vehicle_adaptation:0 "Адаптация гражданской техники"
 UKR_civilian_vehicle_adaptation_desc:0 "В условиях нехватки стандартной военной техники необходимо мобилизовать и адаптировать гражданские транспортные средства для военных нужд. Грузовики, автобусы и даже тракторы после соответствующей модификации могут выполнять различные задачи на фронте."
 
 UKR_idea_adapted_civilian_vehicles:0 "Адаптированная гражданская техника"
 UKR_idea_adapted_civilian_vehicles_desc:0 "Тысячи единиц гражданской техники модифицированы для военных нужд. Хотя они уступают специализированной военной технике, их количество и доступность частично компенсируют технологическое превосходство противника."
 
 # Решения для военной подготовки
 UKR_air_defense_priority:0 "Приоритет ПВО"
 UKR_air_defense_priority_desc:0 "Превосходство российских ВВС представляет серьезную угрозу. Необходимо сосредоточить усилия на укреплении нашей противовоздушной обороны для защиты ключевых объектов инфраструктуры и группировок войск."
 
 UKR_idea_air_defense_priority:0 "Усиленная противовоздушная оборона"
 UKR_idea_air_defense_priority_desc:0 "Концентрация ресурсов на развитии средств ПВО позволяет частично нейтрализовать превосходство противника в воздухе. Ключевые города и военные объекты находятся под защитой средств противовоздушной обороны."
 
 UKR_minefield_key_directions:0 "Минирование ключевых направлений"
 UKR_minefield_key_directions_desc:0 "Устройство минных полей на вероятных направлениях наступления противника значительно замедлит продвижение вражеских войск и увеличит их потери. Хотя это создаст долгосрочные проблемы для мирного населения, в текущих условиях это необходимая мера."
 
 UKR_idea_minefields:0 "Обширные минные поля"
 UKR_idea_minefields_desc:0 "Наиболее вероятные маршруты наступления противника превращены в опасные минные поля. Это существенно замедляет продвижение вражеских войск и повышает их потери, однако создает долгосрочные гуманитарные проблемы для местного населения."

 # Быстрый бронетанковый удар
 UKR_rapid_armored_thrust:0 "Быстрый бронетанковый удар"
 UKR_rapid_armored_thrust_desc:0 "Сосредоточение бронетанковых частей для мощного прорыва вражеской линии обороны с последующим быстрым продвижением в глубину территории, отрезая пути снабжения и окружая противника. Основано на тактике «молниеносной войны», адаптированной к современным условиям боя."

 # Координация ударов Bayraktar TB2
 UKR_bayraktar_strike_coordination:0 "Координация ударов Bayraktar TB2"
 UKR_bayraktar_strike_coordination_desc:0 "Использование беспилотников Bayraktar TB2 для высокоточных ударов по командным пунктам, системам ПВО и бронетехнике противника. Оперативное применение данных воздушной разведки позволяет эффективно координировать действия наземных сил и авиации."

 # Совместная разведывательная операция с НАТО
 UKR_nato_intelligence_operation:0 "Совместная разведывательная операция с НАТО"
 UKR_nato_intelligence_operation_desc:0 "Налаживание тесного сотрудничества с разведывательными службами стран НАТО для получения актуальной информации о перемещениях войск противника, его намерениях и уязвимостях. Доступ к спутниковым данным, перехвату коммуникаций и аналитической экспертизе союзников значительно повышает эффективность планирования операций."

 # Операция ночных рейдов
 UKR_night_raids_operation:0 "Операция ночных рейдов"
 UKR_night_raids_operation_desc:0 "Проведение ночных рейдов силами специальных подразделений с использованием современных средств ночного видения. Внезапные атаки в темное время суток дезорганизуют противника, подрывают его моральный дух и нарушают логистические цепочки, создавая постоянное давление на вражеские позиции."

 # Оборона треугольника Днепр-Киев-Херсон
 UKR_strategic_triangle_defense:0 "Оборона треугольника Днепр-Киев-Херсон"
 UKR_strategic_triangle_defense_desc:0 "Создание укрепленного оборонительного периметра, связывающего стратегически важные города Днепр, Киев и Херсон. Эта оборонительная стратегия максимально использует природные преграды, позволяя контролировать ключевые транспортные узлы и линии снабжения, создавая прочный щит для защиты основной территории страны."

 # Проект "Асгард" - Мобильная сеть ПВО
 UKR_project_asgard:0 "Проект «Асгард» - Мобильная сеть ПВО"
 UKR_project_asgard_desc:0 "Разработка и развертывание распределенной системы противовоздушной обороны, состоящей из мобильных зенитно-ракетных комплексов, интегрированных в единую информационную сеть. Постоянная смена позиций и перекрытие зон ответственности делает эту систему трудноуязвимой для вражеской авиации и ракетных ударов."

 # Наступление "Змеиный путь"
 UKR_serpents_path_assault:0 "Наступление «Змеиный путь»"
 UKR_serpents_path_assault_desc:0 "Проведение серии скоординированных атак вдоль границы с использованием гибкой тактики просачивания и маневрирования. Подобно змее, атакующие силы обходят сильные позиции противника, концентрируясь на слабых участках и важных узлах управления. Эта стратегия позволяет максимально эффективно использовать ограниченные ресурсы."

 # Специальная операция "Азовская сталь"
 UKR_azov_steel_operation:0 "Специальная операция «Азовская сталь»"
 UKR_azov_steel_operation_desc:0 "Использование элитных подразделений для проведения высокорисковых операций глубоко за линией фронта. Бойцы, закаленные в боях как сталь, выполняют задачи по ликвидации вражеских командиров, диверсиям на ключевых объектах инфраструктуры и захвату стратегически важных позиций, подготавливая почву для более масштабных наступательных действий."

