 UKR_vertical_power:0 "Вертикаль"
 UKR_vertical_power_desc:0 "Президент больше не чистит окружение, а договаривается с ним. Каждая услуга кланам даёт быстрый результат и запись в долг, каждое давление даёт контроль и обиду. Шкала показывает, кто кого держит.\n\n§YЛояльность кланов:§! §Y[?UKR_ol_loyalty|0]§! из 100 - [UKR_OL_LOYALTY_WORD]\n\n§YКланы (доля власти, претензии):§!\nМеталл и энергетика (Ахметов: СКМ, «Метинвест», ДТЭК): §Y[?UKR_cl_met_pct|0]%§!, претензии §Y[?UKR_cl_met_claim|0]§!\nПриват (Коломойский: «Приват», «1+1 Медиа», «Укрнафта»): §Y[?UKR_cl_priv_pct|0]%§!, претензии §Y[?UKR_cl_priv_claim|0]§!\nГаз и химия (Фирташ: Group DF, «Остчем», облгазы): §Y[?UKR_cl_gas_pct|0]%§!, претензии §Y[?UKR_cl_gas_claim|0]§!\nСиловой круг (СБУ, Нацгвардия, МВД, прокуратура): §Y[?UKR_cl_sec_pct|0]%§!, претензии §Y[?UKR_cl_sec_claim|0]§!\n\n§YВитрина и подвал§! (шкала TFR, изменение с начала пути):\nПромышленность: §Y[?industrial_development_var|2]§! ([?UKR_ol_d_ind|2]) - [UKR_OL_TREND_IND]\nВоенное: §Y[?military_development_var|2]§! ([?UKR_ol_d_mil|2]) - [UKR_OL_TREND_MIL]\nСельское хозяйство: §Y[?farming_development_var|2]§! ([?UKR_ol_d_farm|2]) - [UKR_OL_TREND_FARM]\nОбщество: §Y[?society_development_var|2]§! ([?UKR_ol_d_soc|2]) - [UKR_OL_TREND_SOC]\nЗащита от бедности: §Y[?poverty_development_var|2]§! ([?UKR_ol_d_pov|2]) - [UKR_OL_TREND_POV]\nНаука: §Y[?academic_development_var|2]§! ([?UKR_ol_d_acad|2]) - [UKR_OL_TREND_ACAD]"
