l_russian:
 UKR_allies_category:0 "Европейское НАТО"
 UKR_allies_category_desc:0 "Мы просим и надеемся, что нас услышат. Доверие европейских столиц растёт от побед, сдержанности, реформ и прозрачности, падает от потерь, скандалов и безрассудства. Ниже - просьбы к Польше, Германии, Франции, Британии и Прибалтике: чем меньше доверия, тем дороже и медленнее ответ, а шансов на согласие меньше.\n\n§YДоверие:§! [UKR_NATO_TRUST_DISPLAY]\n§YЕдинство НАТО:§! [UKR_NATO_UNITY_DISPLAY]"
 UKR_ALLIES_TITLE:0 "§YЕвропейское НАТО§!"
 UKR_ALLIES_TRUST_LABEL:0 "Доверие"
 UKR_ALLIES_UNITY_LABEL:0 "Единство НАТО"
 UKR_ALLIES_TRUST_TOOLTIP:0 "§YДоверие европейского НАТО§!\n\nНасколько столицы Европы верят, что помощь Украине не пропадёт зря. Растёт от побед, сдержанности в войне, реформ и прозрачности, падает от потерь, скандалов и эскалации.\n\n§YПоследнее изменение:§! [UKR_NATO_TRUST_LAST]"
 UKR_ALLIES_UNITY_TOOLTIP:0 "§YЕдинство НАТО§!\n\nСостояние альянса по механике TFR (ступени от 1 до 5). Мы его не меняем, только учитываем: чем единее НАТО, тем больше техники приходит в пакетах помощи.\n\nСтупень 3 - обычный объём, ниже - меньше, выше - больше. Пока в альянсе нет ступеней (до раскола США), объём обычный.\n\nСейчас объём помощи: §Y[?UKR_nato_aid_mult|0]%§! от обычного."
