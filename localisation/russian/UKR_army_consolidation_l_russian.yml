l_russian:
 UKR_army_consolidation:0 "Армия нового образца"
 UKR_army_consolidation_desc:0 "Реформа армии шла по частям: новая система командования, школа офицеров, беспилотники, выбранная доктрина. Каждая часть дала свой результат, но управлять ими поодиночке уже неудобно. Генштаб сводит всё в единый устав и единую систему подготовки. Правила становятся общими для всех родов войск, лишние согласования уходят."
 UKR_army_consolidation_tooltip:0 "§YСводит в один дух:§!\nСтруктуру командования НАТО, Пионеров беспилотной войны и духи выбранной доктрины. Общий бонус §Gна 10% выше§! суммы прежних, штрафы не растут."
 UKR_army_reform_offensive:0 "Армия нового образца: манёвр"
 UKR_army_reform_offensive_desc:0 "Единая система командования, разведки и беспилотников подчинена наступательной доктрине. Штабы планируют быстрее, подвижные части быстрее выходят в прорыв."
 UKR_army_reform_combined:0 "Армия нового образца: совместные операции"
 UKR_army_reform_combined_desc:0 "Единый устав связывает пехоту, артиллерию, бронетехнику и разведку в одну схему. Подразделения держатся дольше и взаимодействуют без лишних согласований."
 UKR_army_reform_defensive:0 "Армия нового образца: глубокая оборона"
 UKR_army_reform_defensive_desc:0 "Единая система обороны объединяет командование, разведку и инженерные службы. Позиции строятся быстрее, держатся дольше и обходятся дешевле в снабжении."
 UKR_rapid_offensive_surge:0 "Стремительное наступление"
 UKR_rapid_offensive_surge_desc:0 "Генштаб на три месяца переводит армию на режим стремительных атак: выше темп и запас топлива, но ниже организация и больше расход снабжения. После окончания нужен долгий перерыв."
 UKR_t_drone_synergy_tooltip:0 "§YСвязка с БПЛА:§!\nДух Пионеров уже сведён в «Армию нового образца», поэтому дополнительно: армейский опыт §G+25§!, командная сила §G+25§!, военное развитие §G+0.05§!"
