 UKR_ALLIES_AD_LABEL:0 "Щит неба"
 UKR_ALLIES_AD_TOOLTIP:0 "§YЩит неба§!\n\nУровень противовоздушной обороны от 0 до 3. Его дают очки ПВО (запросы к Германии, Франции и Литве) и приоритет ПВО. Чем выше уровень, тем реже и слабее удары по гражданской инфраструктуре. С каждым ударом запас перехватчиков с некоторым шансом тает."
 UKR_ALLIES_SEAT_LABEL:0 "Место в штабе"
 UKR_ALLIES_SEAT_TOOLTIP:0 "§YМесто в штабе коалиции§!\n\nГость, участник или постоянное место. Ступень зависит от доверия и от ваших решений в коалиции. Участники штаба быстрее планируют и получают более ровные решения по просьбам."
