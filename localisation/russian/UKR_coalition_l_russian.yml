l_russian:
 ukraine_coalition.1.t:0 "Первый штаб коалиции"
 ukraine_coalition.1.d_seat:0 "Европейские столицы согласовали общий штаб, где сводят воедино поставки, обучение и планы операций, и нас пригласили за стол как участника, а не только как просителя. Так устроены форматы поддержки Украины, возникшие в 2022 году: регулярные встречи министров обороны десятков стран, на которых расписывают, кто что и когда передаёт, и координационные центры, где офицеры стран-доноров работают рядом с украинскими.\n\nДля нас это доступ к общему планированию и более быстрые решения: просьбы теперь рассматривают как части одного плана, а не по одной. Союзники предлагают разместить в нашем штабе офицеров связи. Это удобно, но часть решений придётся согласовывать."
 ukraine_coalition.1.d_guest:0 "Коалиция создаёт общий штаб, но нас пока только слушают. Решения принимают столицы, которые дают больше всего техники и денег, а место за столом зависит от доверия: мы приглашены как гости, можем излагать нужды и получать данные, но не голосовать. Доверие растёт от побед, сдержанности и выполненных обещаний, и тогда за стол посадят на равных.\n\nСоюзники всё же предлагают разместить в нашем штабе офицеров связи, чтобы они понимали, чего нам не хватает, и могли хлопотать за нас дома."
 ukraine_coalition.1.a:0 "Принять офицеров связи"
 ukraine_coalition.1.b:0 "Решения остаются за Киевом"
 ukraine_coalition.2.t:0 "Постоянное место за столом"
 ukraine_coalition.2.d:0 "Накопленное доверие сработало. Союзники готовы перевести нас из участников штаба в постоянные члены основной группы: наш представитель увидит полную картину поставок и будет участвовать в планировании следующих этапов, а не получать готовый график.\n\nВ реальности страны, не входящие в альянс, место за общим столом получают не по договору об обороне, а через формат: постоянный совет или контактную группу, где партнёр участвует в обсуждении на равных, но не принимает на себя оборонных обязательств других. Нам предлагают именно такой статус. Цена - обязательство делиться данными о потерях и расходе помощи."
 ukraine_coalition.2.a:0 "Принять постоянное место"
 ukraine_coalition.2.b:0 "Отказаться, чтобы не связывать себе руки"
 ukraine_coalition.10.t:0 "Кто командует коалицией"
 ukraine_coalition.10.d_ger:0 "Берлин возглавил блок, но выбор лидера не снял вопрос, кто командует на деле. Париж напоминает, что у Франции и Британии есть собственные ядерные силы, а у Германии нет, и просит делить командование между тремя столицами. Лондон поддерживает идею штаба на троих. Берлин отвечает, что платит больше всех и больше всех поставляет техники.\n\nСпор о том, кто главный, в Европе старше нынешней войны: Франция в 1966 году вышла из объединённого командования НАТО и вернулась в него только в 2009 году, потому что не хотела отдавать решения о своих силах. Нас просят поддержать одну из сторон, потому что наш голос в блоке стал весомым."
 ukraine_coalition.10.d_fra:0 "Париж возглавил блок, и Берлин с Лондоном недовольны. Германия напоминает, что у неё самая большая экономика Европы и самая крупная доля в поставках, и просит учитывать это при решениях. Лондон ссылается на опыт совместных операций и тесные разведывательные связи и предлагает общий штаб на троих.\n\nСпор о том, кто главный, в Европе старше нынешней войны: Франция в 1966 году вышла из объединённого командования НАТО и вернулась в него только в 2009 году, потому что не хотела отдавать решения о своих силах. Теперь именно ей достаётся роль, которой она десятилетиями избегала. Нас просят поддержать одну из сторон."
 ukraine_coalition.10.d_eng:0 "Лондон возглавил блок, и в Берлине и Париже этим недовольны. Германия считает, что лидировать должен тот, кто больше платит и больше поставляет. Франция настаивает, что у неё собственный ядерный потенциал и независимая линия, и не готова подчиняться чужому плану.\n\nСпор о том, кто главный, в Европе старше нынешней войны: Франция в 1966 году вышла из объединённого командования НАТО и вернулась в него только в 2009 году, потому что не хотела отдавать решения о своих силах. Лидерство без согласия остальных хрупко, и нас просят занять сторону."
 ukraine_coalition.10.d_none:0 "Блок пока без признанного лидера: Берлин, Париж и Лондон спорят о том, чья линия станет общей, и каждый тянет одеяло на себя. Германия платит больше всех, у Франции и Британии есть собственные ядерные силы, и никто не готов подчиниться другому.\n\nСпор о том, кто главный, в Европе старше нынешней войны: Франция в 1966 году вышла из объединённого командования НАТО и вернулась в него только в 2009 году, потому что не хотела отдавать решения о своих силах. Нас просят занять сторону, потому что наше мнение в блоке стало что-то значить."
 ukraine_coalition.10.a:0 "Поддержать лидера блока"
 ukraine_coalition.10.b:0 "Предложить общий штаб с офицерами всех трёх стран"
 ukraine_coalition.10.c:0 "Не вмешиваться: наше дело - фронт"
 ukraine_coalition.11.t:0 "Газ и украинские хранилища"
 ukraine_coalition.11.d:0 "Зима без российского газа оказывается тяжёлой: Германия, которая десятилетиями строила промышленность на трубе из России, ищет, где хранить и чем заменить недостающие объёмы. У Украины одни из крупнейших в Европе подземных хранилищ газа, и в реальности именно они много лет служили европейским трейдерам складом. Берлин просит открыть их для европейских закупок.\n\nНо зима и у нас тяжёлая: удары по энергетике, ограничения, и газ, закачанный для Европы, не достанется нашим домам. Можно открыть хранилища, оставить газ себе или предложить обмен: хранение за противовоздушную защиту."
 ukraine_coalition.11.a:0 "Открыть хранилища для европейских закупок"
 ukraine_coalition.11.b:0 "Оставить газ себе"
 ukraine_coalition.11.c:0 "Хранение в обмен на ПВО"
 ukraine_coalition.12.t:0 "Реестр формирований"
 ukraine_coalition.12.d:0 "Союзники хотят знать, кому передают оружие. Вокруг армии десятки добровольческих батальонов, иностранные добровольцы и территориальная оборона, и не у всех подразделений понятна подчинённость. Донорам нужен единый реестр: кто входит в состав вооружённых сил, как учитывается выданная техника и кто отвечает за её судьбу.\n\nВ реальности такие требования возникают при любой крупной помощи: учёт конечного пользователя - обычная часть экспортного контроля, а отдельные добровольческие формирования уже вызывали споры в парламентах стран-доноров. Реестр повысит доверие, но часть добровольцев и их сторонников сочтёт это посягательством на самостоятельность."
 ukraine_coalition.12.a:0 "Ввести единый реестр под общим контролем"
 ukraine_coalition.12.b:0 "Включить добровольцев в состав армии без публичного реестра"
 ukraine_coalition.12.c:0 "Отказать: добровольцы подчиняются только Киеву"
 ukraine_coalition.30.t:0 "«Давут»: Франция просит о поддержке"
 ukraine_coalition.30.d:0 "Париж готовит десантную операцию против Крыма. Для Франции это первая за десятилетия крупная высадка с моря, и ей нужны данные о береговой обороне, ПВО и позициях флота противника, которые лучше всего знает украинская разведка.\n\nМорской десант - самый тяжёлый вид операции: нужны господство в воздухе, разминирование подходов и согласованность всех родов войск, поэтому такие операции готовят месяцами, а партнёров, знающих театр, просят помочь разведкой и прикрытием. Нас просят о том же: выделить ресурсы, не открывая второго фронта для самих себя."
 ukraine_coalition.30.a:0 "Выделить разведку, ПВО и авиацию прикрытия"
 ukraine_coalition.30.b:0 "Ограничиться информированием"
 ukraine_coalition.30.c:0 "Просить включить украинский контингент"
 ukraine_coalition.31.t:0 "«Давут»: итог операции"
 ukraine_coalition.31.d_win:0 "Французская операция удалась: десант закрепился на Крымском побережье, и полуостров перестал быть недосягаемым тылом для противника. Успех в таких операциях - заслуга всей цепочки: разведки, прикрытия, снабжения и выдержки пехоты на берегу.\n\nДля нас это шанс говорить о Крыме не как о потерянном, а как о вопросе повестки. Но союзникам важен спокойный тон: слишком громкие заявления могут насторожить столицы, которые боятся эскалации."
 ukraine_coalition.31.d_fail:0 "Операция сорвалась: десант не закрепился, и Франции пришлось отвести силы. Морские десанты бывают провальными и у сильных армий, достаточно вспомнить Дьеп в 1942 и Галлиполи в 1915 годах, а общество союзника тяжело переносит потери.\n\nПарижу нужна поддержка, а нам нужна его вера в общее дело. Но у нас есть право на собственное мнение: можно публично встать рядом или тихо дистанцироваться."
 ukraine_coalition.31.a:0 "Заявить: Крым возвращается в повестку"
 ukraine_coalition.31.b:0 "Не форсировать риторику: союзникам нужен тихий успех"
 ukraine_coalition.31.c:0 "Публично поддержать союзника"
 ukraine_coalition.31.d:0 "Дистанцироваться: у каждого свои ошибки"
 ukraine_coalition.32.t:0 "Совместное наступление"
 ukraine_coalition.32.d:0 "Германия, Франция и Британия согласовали общее наступление против России. Это редкий случай, когда союзники договариваются не только о поставках, но и о едином плане: удары на нескольких направлениях в одно время, чтобы противник не успевал перебрасывать резервы.\n\nДля нас главный вопрос - какую роль нам отвели. Большие наступательные операции коалиций выигрываются согласованностью сроков, снабжением и господством в воздухе, а не числом дивизий, и партнёр, не успевающий за общим графиком, подводит остальных."
 ukraine_coalition.32.a:0 "Взять главное направление"
 ukraine_coalition.32.b:0 "Сковывающие удары на втором направлении"
 ukraine_coalition.32.c:0 "Отказаться: армия измотана"
 ukraine_coalition.50.t:0 "Намёки на переговоры"
 ukraine_coalition.50.d:0 "В европейских столицах растёт усталость от войны: бюджеты трещат, избиратели спрашивают, сколько это ещё продлится, а часть политиков публично говорит о «заморозке линии». Дипломаты пока не требуют, а лишь намекают, что союзникам было бы проще продолжать помощь, если бы Киев показал готовность к контактам.\n\nВ реальности давление партнёров на воюющую страну обычно идёт именно так: сначала закрытые встречи и «обмен мнениями», потом условия к новым пакетам помощи. Мы просили помощи и не можем делать вид, что ничего не слышим."
 ukraine_coalition.50.a:0 "Отвергнуть публично"
 ukraine_coalition.50.b:0 "Согласиться на закрытые консультации"
 ukraine_coalition.50.c:0 "Потребовать гарантий безопасности вместо заморозки"
 ukraine_coalition.51.t:0 "Условия союзников"
 ukraine_coalition.51.d:0 "Намёки закончились. Столицы дали понять, что следующие пакеты помощи будут привязаны к участию в переговорах: без шагов навстречу очереди на поставки растянутся, а за каждую новую просьбу придётся платить дороже, вниманием к советам партнёров.\n\nТакая условность помощи (поставки в обмен на реформы или шаги в дипломатии) - обычный инструмент: ей пользовались международные кредиторы десятилетиями. Принять условия значит дать передышку армии и обществу, отказаться значит рискнуть доверием и местом в штабе."
 ukraine_coalition.51.a:0 "Принять условия и сесть за стол"
 ukraine_coalition.51.b:0 "Отказаться"
 ukraine_coalition.52.t:0 "Дорожная карта гарантий"
 ukraine_coalition.52.d:0 "Союзники готовы говорить не о заморозке, а о том, что будет после: о гарантиях безопасности. В реальности вопрос «что удержит агрессора после перемирия» решали по-разному: членством в альянсе (статья 5 Североатлантического договора 1949 года), двусторонними гарантиями с обязательствами помощи, постоянным присутствием союзных войск и крупной военной помощью, которая делает новое нападение слишком дорогим.\n\nНам предлагают последний путь: долгосрочные соглашения о поставках, обучении и совместном производстве. Это не членство, но это понятный горизонт, который усталому обществу нужен не меньше, чем фронту."
 ukraine_coalition.52.a:0 "Принять дорожную карту"
 ukraine_coalition.52.b:0 "Настаивать на членстве без компромиссов"
 ukraine_coalition.70.t:0 "Многослойная противовоздушная оборона"
 ukraine_coalition.70.d_l2:0 "Над ключевыми объектами работают два яруса защиты: дальнобойные зенитные комплексы бьют по крупным целям, а зенитные самоходные установки и мобильные группы закрывают малую высоту. В реальности слои ПВО не заменяют друг друга: дорогая ракета, потраченная на дешёвый дрон, проигрывает по цене, а зенитная пушка не достанет баллистическую цель.\n\nУдары по инфраструктуре станут реже и слабее, но запас перехватчиков тает с каждой атакой, и его придётся пополнять запросами к союзникам."
 ukraine_coalition.70.d_l3:0 "Над столицей и узлами энергетики работает многослойная система: дальнобойные комплексы перехватывают баллистические ракеты, средние и ближние дальности закрывают крылатые, зенитные установки и мобильные группы с пулемётами ловят дроны. Это самая дорогая часть обороны, зато она спасает больше всего жизней.\n\nУдары по инфраструктуре теперь заметно реже и слабее, но запас перехватчиков расходуется с каждой атакой, и поддерживать его придётся постоянно."
 ukraine_coalition.70.a:0 "Беречь перехватчики"
 ukrainewar.300.d_l2:0 "Вражеские ракеты и беспилотники снова бьют по электростанциям, водопроводам и теплосетям, но часть целей удаётся прикрыть: зенитные комплексы и мобильные группы сбивают значительную долю налёта. Часть районов остаётся без света, но не на недели, и общество переносит эти удары легче, чем прежде.\n\nОднако запас перехватчиков тает с каждой атакой."
 ukrainewar.300.d_l3:0 "Налёт ракет и дронов пытается пробить многослойную защиту столицы и энергетических узлов, и большинство целей сбивают. Отдельные попадания вызывают перебои, но город не погружается во тьму, и вражеская стратегия давления на тыл буксует.\n\nЦена такого щита - постоянно расходуемые перехватчики."
 UKR_air_defense_level_1:0 "Щит неба: первая ступень"
 UKR_air_defense_level_1_desc:0 "Отдельные зенитные батареи прикрывают столицу и несколько ключевых объектов. Налёт они не остановят, но заметно ограничат ущерб. Ступень зависит от очков ПВО (запросы к Германии, Франции и Литве) и от приоритета ПВО; очки тают с каждым ударом."
 UKR_air_defense_level_2:0 "Щит неба: вторая ступень"
 UKR_air_defense_level_2_desc:0 "Два яруса защиты: дальнобойные комплексы и зенитные установки малой дальности. Удары по инфраструктуре реже и слабее. Запас перехватчиков тает с каждой атакой."
 UKR_air_defense_level_3:0 "Щит неба: третья ступень"
 UKR_air_defense_level_3_desc:0 "Многослойная система вокруг столицы и узлов энергетики. Удары по инфраструктуре заметно реже и слабее. Содержание щита требует постоянно пополнять запас перехватчиков."
 UKR_coalition_seat_1:0 "Участник штаба коалиции"
 UKR_coalition_seat_1_desc:0 "Наши офицеры работают в общем штабе союзников: доступ к планированию и более быстрые решения по нашим просьбам."
 UKR_coalition_seat_2:0 "Постоянное место за столом штаба"
 UKR_coalition_seat_2_desc:0 "Постоянный представитель Украины участвует в основной группе планирования коалиции и видит полную картину поставок. Взамен мы делимся данными о потерях и расходе помощи."
 UKR_joint_planning:0 "Совместное планирование с союзниками"
 UKR_joint_planning_desc:0 "Офицеры союзников и наши штабисты планируют операции вместе, и планы выходят быстрее и согласованнее."
 UKR_coalition_friction:0 "Охлаждение в коалиции"
 UKR_coalition_friction_desc:0 "Часть союзников недовольна нашей позицией. Дипломатам приходится тратить больше времени на объяснения."
 UKR_gas_squeeze:0 "Газ в европейских хранилищах"
 UKR_gas_squeeze_desc:0 "Часть газа ушла в хранилища для европейских закупок, и нашим домам и промышленности тепла достаётся меньше. Цена дружбы с союзниками в тяжёлую зиму."
 UKR_peace_pressure:0 "Давление союзников на переговоры"
 UKR_peace_pressure_desc:0 "Столицы привязывают новые пакеты помощи к шагам навстречу переговорам. Каждая просьба отнимает больше сил, а общество устало от неопределённости. Цены запросов к странам на время выросли."
 UKR_security_track:0 "Дорожная карта гарантий безопасности"
 UKR_security_track_desc:0 "У страны появился понятный горизонт: долгосрочные соглашения о поставках, обучении и совместном производстве. Это не членство, но общество получило ответ на вопрос «что дальше»."
