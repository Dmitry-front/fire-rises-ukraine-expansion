l_russian:
 UKR_defense_industry_category:0 "Оборонная промышленность"
 UKR_defense_industry_category_desc:0 "Украинские оборонные предприятия работают на износ и на энтузиазме. Государство может подкинуть им заказ, деньги и кадры: на время программы нужная техника подешевеет, а по её окончании организация получит финансирование для собственного развития."
 UKR_mio_cost_a:0 "Нужно 25 ПП и не менее 2 млрд ликвидности"
 UKR_mio_cost_b:0 "Нужно 35 ПП и не менее 3 млрд ликвидности"
 UKR_mio_cost_c:0 "Нужно 50 ПП и не менее 5 млрд ликвидности"
 UKR_mio_funds_200_tt:0 "По окончании программы организация получит §G200§! ед. финансирования"
 UKR_mio_funds_250_tt:0 "По окончании программы организация получит §G250§! ед. финансирования"
 UKR_mio_funds_300_tt:0 "По окончании программы организация получит §G300§! ед. финансирования"
 UKR_malyshev_organization:0 "Завод имени Малышева и КБ имени Морозова"
 UKR_malyshev_organization_desc:0 "Харьковский центр танкостроения, наследник школы Т-64 и Т-84. Партии небольшие, но ходовая часть надёжна, а решения по защите собственные."
 UKR_malyshev_initial_trait:0 "Харьковская школа танкостроения"
 UKR_malyshev_initial_trait_desc:0 "Особенность организации: Завод имени Малышева и КБ имени Морозова"
 UKR_armor_repair_organization:0 "Бронетанковые ремонтные заводы"
 UKR_armor_repair_organization_desc:0 "Заводы во Львове, Киеве и Николаеве ремонтируют и переделывают технику. В войне на износ ценится не новая машина, а возвращённая в строй."
 UKR_armor_repair_initial_trait:0 "Ремонт и переделка"
 UKR_armor_repair_initial_trait_desc:0 "Особенность организации: Бронетанковые ремонтные заводы"
 UKR_kraz_organization:0 "КрАЗ и производители бронемашин"
 UKR_kraz_organization_desc:0 "Кременчугский автозавод и частные сборщики делают колёсные бронемашины большой проходимости."
 UKR_kraz_initial_trait:0 "Кременчугская школа"
 UKR_kraz_initial_trait_desc:0 "Особенность организации: КрАЗ и производители бронемашин"
 UKR_drone_cluster_organization:0 "Оборонный кластер БПЛА"
 UKR_drone_cluster_organization_desc:0 "Мастерские, стартапы и волонтёры, которые собирают дроны быстрее, чем их успевает описать классический оборонный заказ."
 UKR_drone_cluster_initial_trait:0 "Мастерские и волонтёры"
 UKR_drone_cluster_initial_trait_desc:0 "Особенность организации: Оборонный кластер БПЛА"
 UKR_antonov_organization:0 "Антонов"
 UKR_antonov_organization_desc:0 "Киевская авиастроительная школа: транспортные самолёты, дальность и работа с тяжёлыми грузами."
 UKR_antonov_initial_trait:0 "Киевская школа авиастроения"
 UKR_antonov_initial_trait_desc:0 "Особенность организации: Антонов"
 UKR_motor_sich_organization:0 "Мотор Сич и Ивченко-Прогресс"
 UKR_motor_sich_organization_desc:0 "Запорожские авиадвигатели для самолётов и вертолётов, а в последние годы и для беспилотников."
 UKR_motor_sich_initial_trait:0 "Запорожская школа двигателей"
 UKR_motor_sich_initial_trait_desc:0 "Особенность организации: Мотор Сич и Ивченко-Прогресс"
 UKR_aircraft_repair_organization:0 "Авиаремонтные заводы"
 UKR_aircraft_repair_organization_desc:0 "Заводы во Львове, Николаеве и Чугуеве держат в воздухе советские МиГ-29 и Су-27, а иногда делают их лучше новых."
 UKR_aircraft_repair_initial_trait:0 "Опыт капремонта"
 UKR_aircraft_repair_initial_trait_desc:0 "Особенность организации: Авиаремонтные заводы"
 UKR_mykolaiv_yard_organization:0 "Николаевские верфи"
 UKR_mykolaiv_yard_organization_desc:0 "Черноморский судостроительный завод и «Зоря-Машпроект»: корветы, береговая оборона и газотурбинные установки."
 UKR_mykolaiv_yard_initial_trait:0 "Черноморская школа судостроения"
 UKR_mykolaiv_yard_initial_trait_desc:0 "Особенность организации: Николаевские верфи"
 UKR_mio_trait_oplot_engine:0 "Двигатель типа 6ТД"
 UKR_mio_trait_oplot_engine_desc:0 "Опыт харьковских дизелей: больше скорости и надёжности."
 UKR_mio_trait_reactive_armor:0 "Динамическая защита"
 UKR_mio_trait_reactive_armor_desc:0 "Броня и защита растут, танк становится дороже."
 UKR_mio_trait_trophy_fund:0 "Трофейный фонд"
 UKR_mio_trait_trophy_fund_desc:0 "Захваченная техника быстро возвращается в строй и почти не требует ресурсов."
 UKR_mio_trait_field_repair:0 "Ремонт у линии фронта"
 UKR_mio_trait_field_repair_desc:0 "Ремонтные бригады работают рядом с позициями, линии выходят на пик эффективности быстрее."
 UKR_mio_trait_wheeled_chassis:0 "Колёсные шасси"
 UKR_mio_trait_wheeled_chassis_desc:0 "Скорость и экономия топлива на плохих дорогах."
 UKR_mio_trait_mine_resistant_hull:0 "Противоминный корпус"
 UKR_mio_trait_mine_resistant_hull_desc:0 "Защита экипажа выше, машина дороже."
 UKR_mio_trait_garage_workshops:0 "Гаражные мастерские"
 UKR_mio_trait_garage_workshops_desc:0 "Производство растёт быстрее и стоит дешевле, но качество сборки хуже."
 UKR_mio_trait_volunteer_funding:0 "Волонтёрское финансирование"
 UKR_mio_trait_volunteer_funding_desc:0 "Сборы и пожертвования ускоряют приток средств организации."
 UKR_mio_trait_neuro_guidance:0 "Нейросетевое наведение"
 UKR_mio_trait_neuro_guidance_desc:0 "Беспилотники точнее находят цели и быстрее проходят оборону."
 UKR_mio_trait_transport_school:0 "Школа транспортной авиации"
 UKR_mio_trait_transport_school_desc:0 "Больше дальность и ниже цена тяжёлых машин."
 UKR_mio_trait_rough_field_landing:0 "Посадка на неподготовленные полосы"
 UKR_mio_trait_rough_field_landing_desc:0 "Выше надёжность и ниже расход топлива."
 UKR_mio_trait_ivchenko_engines:0 "Двигатели Ивченко"
 UKR_mio_trait_ivchenko_engines_desc:0 "Тяга и надёжность двигателей растут."
 UKR_mio_trait_fuel_economy:0 "Экономичный расход топлива"
 UKR_mio_trait_fuel_economy_desc:0 "Большая дальность за счёт аккуратного расхода."
 UKR_mio_trait_mig29_upgrade:0 "Модернизация МиГ-29"
 UKR_mio_trait_mig29_upgrade_desc:0 "Новая электроника повышает манёвренность и огневую мощь, но удорожает самолёт."
 UKR_mio_trait_su27_overhaul:0 "Капремонт Су-27"
 UKR_mio_trait_su27_overhaul_desc:0 "Продлённый ресурс планера и лучшая защита."
 UKR_mio_trait_gas_turbines:0 "Газотурбинные установки"
 UKR_mio_trait_gas_turbines_desc:0 "Скорость и экономия топлива кораблей."
 UKR_mio_trait_coastal_defense:0 "Береговая оборона"
 UKR_mio_trait_coastal_defense_desc:0 "Сильнее ПВО и дешевле корабли, меньше дальность."
 UKR_mio_malyshev_boost:0 "Программа модернизации танков"
 UKR_mio_malyshev_boost_desc:0 "Харьковские цеха работают в усиленном режиме: средние и лёгкие танки дешевле."
 UKR_mio_trophy_boost:0 "Трофейная программа"
 UKR_mio_trophy_boost_desc:0 "Ремонт и переделка захваченной техники поставлены на поток."
 UKR_mio_kraz_boost:0 "Программа бронемашин КрАЗ"
 UKR_mio_kraz_boost_desc:0 "Кременчугские сборщики получили госзаказ: колёсные бронемашины дешевле."
 UKR_mio_drone_boost:0 "Мастерские БПЛА"
 UKR_mio_drone_boost_desc:0 "Госзаказ и волонтёры вместе: дроны дешевле и бьют точнее."
 UKR_mio_antonov_boost:0 "Программа транспортной авиации"
 UKR_mio_antonov_boost_desc:0 "Киевские конструкторы получили заказ: тяжёлые и транспортные самолёты дешевле."
 UKR_mio_motor_sich_boost:0 "Программа авиадвигателей"
 UKR_mio_motor_sich_boost_desc:0 "Запорожские двигателисты работают с заводами: лёгкие и средние самолёты дешевле."
 UKR_mio_aircraft_boost:0 "Программа модернизации истребителей"
 UKR_mio_aircraft_boost_desc:0 "Авиаремонтные заводы обновляют бортовые системы: истребители надёжнее и манёвреннее."
 UKR_mio_yard_boost:0 "Программа николаевских верфей"
 UKR_mio_yard_boost_desc:0 "Верфи получили заказ на малые корабли: они дешевле."
 UKR_mio_malyshev_overhaul:0 "Модернизация танков в Харькове"
 UKR_mio_malyshev_overhaul_desc:0 "Выделить Харьковскому заводу госзаказ и кадры: на полгода средние и лёгкие танки станут дешевле, а по окончании программы организация получит финансирование."
 UKR_mio_trophy_repair:0 "Трофейная программа"
 UKR_mio_trophy_repair_desc:0 "Поставить ремонт и переделку захваченной и повреждённой техники на поток. На время программы бронетехника надёжнее, а ремонт идёт быстрее."
 UKR_mio_kraz_armored:0 "Госзаказ на бронемашины КрАЗ"
 UKR_mio_kraz_armored_desc:0 "Дать кременчугским сборщикам госзаказ на колёсные бронемашины: на время программы они дешевле."
 UKR_mio_drone_workshops:0 "Поддержка мастерских БПЛА"
 UKR_mio_drone_workshops_desc:0 "Свести волонтёров, стартапы и госзаказ. Беспилотники на время программы дешевле и точнее."
 UKR_mio_antonov:0 "Программа транспортной авиации"
 UKR_mio_antonov_desc:0 "Заказать «Антонову» тяжёлые и транспортные самолёты: на время программы они дешевле."
 UKR_mio_motor_sich:0 "Программа авиадвигателей"
 UKR_mio_motor_sich_desc:0 "Связать запорожских двигателистов с авиазаводами: на время программы лёгкие и средние самолёты дешевле."
 UKR_mio_aircraft_overhaul:0 "Модернизация истребителей"
 UKR_mio_aircraft_overhaul_desc:0 "Авиаремонтные заводы обновляют МиГ-29 и Су-27: на время программы истребители надёжнее и манёвреннее."
 UKR_mio_mykolaiv_yard:0 "Заказ николаевским верфям"
 UKR_mio_mykolaiv_yard_desc:0 "Разместить на верфях заказ на корветы и малые корабли: на время программы они дешевле."
