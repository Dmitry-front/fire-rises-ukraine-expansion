 ukraine_industry.1.t:0 "Первая серия из Харькова"
 ukraine_industry.1.d:0 "Харьковское бюро имени Морозова и завод имени Малышева - это школа, из которой вышли Т-64, Т-80 и «Оплот». Последние годы они живут в режиме малой серии: заказов мало, деньги приходят с опозданием, а инженеры, помнящие советские цеха, один за другим уходят на пенсию. Оплаченная вами программа наконец дала результат: первая обновлённая серия с двигателем 6ТД, динамической защитой и новыми прицелами стоит во дворе завода.\n\nНа приёмку приехал генерал, а директор встречает его в цеху, где на стене всё ещё висит график 1985 года. Армия готова забрать всё до последней машины. Но тянущийся годами экспортный контракт (Таиланд помнит про «Оплот») тоже просит, чтобы его наконец закрыли."
 ukraine_industry.1.a:0 "Всё в армию: экспорт подождёт."
 ukraine_industry.1.b:0 "Закрыть экспортный контракт: деньги нужны заводу."
 ukraine_industry.2.t:0 "Колонна у ворот"
 ukraine_industry.2.d:0 "За заборами бронетанковых ремонтных заводов во Львове, Киеве и Николаеве стоят сотни единиц хранения: Т-64, Т-72, БМП. Часть из них трофеи, оставшиеся с боёв 2014-2015 годов; они ржавели под открытым небом и числились в ведомостях как «имущество, подлежащее оценке». Программа дала заводу линию, и директор разложил на столе два списка.\n\nВ первом машины, которые можно вернуть в строй за пару месяцев работы. Во втором те, что дешевле сдать металлургам, давно звонящим насчёт лома. Один и тот же старый Т-72 может стать и танком, и тремя тоннами хорошей стали."
 ukraine_industry.2.a:0 "Вернуть в строй всё, что можно."
 ukraine_industry.2.b:0 "Часть сдать на лом и вложиться в линию."
 ukraine_industry.3.t:0 "Колёса из Кременчуга"
 ukraine_industry.3.d:0 "Кременчугский автозавод помнят по самосвалам, которые возили щебень по всему Союзу. Теперь в его цехах рядом стоят гражданские грузовики и колёсные бронемашины вроде «Спартана» и «Раптора»: те же мосты, те же сварщики, другая броня. Заказ армии вывел линию на новые обороты, и директор впервые за долгое время не считает дни до зарплаты.\n\nМощности цеха не растягиваются. Из ворот могут выйти бронетранспортёры для бригад, а могут грузовики на экспорт: в Африке и на Ближнем Востоке КрАЗ знают и покупают, а твёрдая валюта сейчас нужна не меньше брони."
 ukraine_industry.3.a:0 "Бронетранспортёры бригадам."
 ukraine_industry.3.b:0 "Грузовики на экспорт: валюта сейчас важнее."
 ukraine_industry.4.t:0 "Мастерская в гараже"
 ukraine_industry.4.d:0 "Кластер вырос не из заводов, а из волонтёрских мастерских. В одном гараже под Киевом собирают разведывательные дроны чуть ли не на коленке, в соседнем паяют платы, в третьем пишут программу, которая отличает танк от трактора и в основном не путает. Стенд для проверки вибрации когда-то был кофемашиной, и никто не жалуется: работает.\n\nПока вы платили за программу, в Генштабе подготовили документ на сорок страниц: сертификация, стандарты, акты приёмки. Мастера читают его молча. Госзаказ принесёт деньги и стабильность, но каждая бумага замедлит цикл от идеи до выезда на позицию. Вопрос в том, чем рискнуть: порядком или скоростью."
 ukraine_industry.4.a:0 "Сертификация и госзаказ: порядок важен."
 ukraine_industry.4.b:0 "Оставить гаражи в покое: скорость важнее."
 ukraine_industry.5.t:0 "Вторая «Мрия»"
 ukraine_industry.5.d:0 "В ангаре «Антонова» под Киевом десятилетиями стоит недостроенный второй фюзеляж Ан-225 «Мрия»: по документам он готов примерно на три четверти. Каждые несколько лет в прессе появляются инвесторы с планами его достроить, и каждый раз дело заканчивается красивой церемонией и пустой строкой в бюджете.\n\nПрограмма дала заводу ресурсы, и главный конструктор предлагает самый громкий вариант: достроить самый большой самолёт в мире и показать, что Украина умеет не только чинить, но и строить. Другой путь скромнее: серия региональных Ан-178 для армии и транспортной авиации, которая не попадёт на обложки, зато поедет в части."
 ukraine_industry.5.a:0 "Достроить вторую «Мрию»: страна покажет себя."
 ukraine_industry.5.b:0 "Серия Ан-178 для армии."
 ukraine_industry.6.t:0 "Запорожские моторы"
 ukraine_industry.6.d:0 "«Мотор Сич» делает двигатели, которые стоят на вертолётах и самолётах в десятках стран, а в последние годы и на турецких беспилотниках. Завод не раз оказывался в центре истории: часть акций выкупил китайский инвестор (Skyrizon), СБУ вела дела, Вашингтон высказывал недовольство, а инженеры просто хотели, чтобы заказы не заканчивались.\n\nПрограмма принесла деньги, и теперь у вас на столе три разные бумаги: предложение инвестора дать завод новую жизнь за долю, проект указа о государственном контроле и меморандум о совместном предприятии с турецкими партнёрами. Каждый путь что-то даёт и что-то забирает у страны."
 ukraine_industry.6.a:0 "Продать долю инвестору: деньги важны, риск терпим."
 ukraine_industry.6.b:0 "Взять завод под государственный контроль."
 ukraine_industry.6.c:0 "Совместное предприятие с Турцией: двигатели для всех."
 ukraine_industry.7.t:0 "Второй ресурс"
 ukraine_industry.7.d:0 "Авиаремонтные заводы во Львове, Николаеве и Чугуеве годами держат в воздухе советские МиГ-29 и Су-27: меняют лонжероны, переписывают документацию, иногда делают машину надёжнее новой. Работа тихая и незаметная, но именно она не даёт парку превратиться в музей под открытым небом.\n\nПрограмма принесла заводам средства, и на совещании звучат два сценария. Первый: глубокая модернизация МиГ-29 с современной авионикой, чтобы старые машины прожили ещё десяток лет. Второй смотрит дальше: рано или поздно в украинском небе могут появиться западные истребители, а для них нужны своя база, стандарты и специалисты, которых лучше начать готовить сейчас."
 ukraine_industry.7.a:0 "Глубокая модернизация МиГ-29 и Су-27."
 ukraine_industry.7.b:0 "Центр обслуживания для будущих западных машин."
 ukraine_industry.8.t:0 "Недостроенный корвет"
 ukraine_industry.8.d:0 "На стапеле Черноморского судостроительного завода в Николаеве стоит корпус корвета проекта 58250 «Волынь»: заложен ещё в 2011 году, деньги закончились раньше, чем сталь. Рядом работает «Зоря-Машпроект» с газотурбинными установками, которые покупают флоты в разных странах, кроме собственного. Корабль превратился в местную достопримечательность: рабочие шутят, что он старше половины их стажёров.\n\nПрограмма снова вернула деньги верфям, и вопрос встал ребром. Достроить корпус дома: долго, дорого, зато вся цепочка остаётся в стране. Или заказать недостающие системы и корпусные блоки у партнёров, как это уже делают по соседним проектам, и довести корабль в Николаеве до готовности."
 ukraine_industry.8.a:0 "Достроить дома: пусть цепочка останется в стране."
 ukraine_industry.8.b:0 "Системы у партнёров, сборка в Николаеве."
 ukraine_industry.9.t:0 "Оружие для обороны"
 ukraine_industry.9.d:0 "Винницкий «Форт» делает пистолеты и автоматы, которые носят полицейские и нацгвардейцы, в том числе по лицензии израильских образцов. Территориальной обороне оружия нужно много и сразу: не парадные стволы, а простые, выносливые, чтобы с ними справился вчерашний бухгалтер после двух недель сборов.\n\nПрограмма принесла заводу заказ, но в углу склада лежит старая дилемма. Армия понемногу переходит на патрон 5,56 НАТО, и это упрощает снабжение партнёрами. Но склады ломятся от 5,45, а резервистам и добровольцам нужно что-то прямо сейчас."
 ukraine_industry.9.a:0 "Перейти на калибр НАТО."
 ukraine_industry.9.b:0 "Пока оставить 5,45 для резервистов и ТрО."
 ukraine_industry.10.t:0 "Орудие, которого ждёт фронт"
 ukraine_industry.10.d:0 "В военных учебниках слово «артиллерия» ещё не вышло из моды, и конструкторы это знают. На испытательном полигоне стоит новое колёсное орудие калибра 155 мм (в бумагах «Богдана», в разговорах конструкторов разное): мобильное, с готовой автоматикой, на отечественном шасси. До серии ему осталось несколько неприятных циклов испытаний.\n\nГенералы торопят. Каждый месяц без новых стволов - это месяц, когда снабжение бригад держится на старых запасах. Но слишком быстрая серия означает мелкие поломки в самый неподходящий момент, и тогда доверие к отечественной артиллерии придётся зарабатывать заново."
 ukraine_industry.10.a:0 "Ускорить серию: фронту нужны стволы."
 ukraine_industry.10.b:0 "Довести испытания до конца."
 ukraine_industry.11.t:0 "«Нептун»"
 ukraine_industry.11.d:0 "Киевское КБ «Луч» и днепровское «Южное» много лет делали ракеты тихо и без витрин. Теперь их общая работа, противокорабельная крылатая ракета «Нептун», проходит испытания и выходит на береговую оборону. Дальность, малая заметность и отечественные двигатели делают её серьёзным аргументом в разговоре о безопасности Чёрного моря.\n\nВозникает вопрос, что делать с известностью. Выставка в Европе привлекла бы покупателей и друзей, но Москва прочитает это как вызов. Закрытый путь даёт армии время и неожиданность, но оставляет заводам скромный бюджет. Конструкторы, как водится, надеются, что решение примут до конца квартала."
 ukraine_industry.11.a:0 "Показать на выставке и открыть переговоры об экспорте."
 ukraine_industry.11.b:0 "Держать в тайне: армии нужен эффект неожиданности."
 ukraine_industry.12.t:0 "Свой эфир"
 ukraine_industry.12.d:0 "Радиоэлектроника - то поле, где армии Украины приходится учиться быстрее всех. Заводы под Киевом и Харьковом делают станции связи, средства РЭБ и оптику, а в мастерских при них сидят программисты, которые пишут прошивку по ночам, потому что днём нужны железо и деньги. Устаревшие радиостанции советского образца заменяются тем, что удаётся достать.\n\nПрограмма дала заводам ресурс и поставила вопрос стандартов. Строить собственную систему связи и РЭБ: быстро, под себя, с риском несовместимости. Или принять стандарты НАТО и подгонять заводы под них: медленнее, дороже, зато станции будут говорить с союзниками."
 ukraine_industry.12.a:0 "Собственная система связи и РЭБ."
 ukraine_industry.12.b:0 "Совместимость со стандартами НАТО."
 ukraine_industry.13.t:0 "Катер без экипажа"
 ukraine_industry.13.d:0 "Идея простая и немного безумная: быстрый катер, снятый экипаж, спутниковая связь, камера и заряд. У морской державы с большим флотом такая идея вызвала бы смех, а у страны, у которой флота почти нет, она вызывает интерес. Конструкторы в Николаеве и Одессе называют проект тремя разными именами, чтобы никто не понял, о чём идёт речь.\n\nПрограмма принесла деньги, и теперь решается вопрос тайны. Закрытый проект ГУР даёт эффект неожиданности и защищает от чужих глаз, но остаётся сугубо внутренним делом. Показательные испытания для партнёров привлекут союзников и деньги, но с этого дня проект перестанет быть тайной."
 ukraine_industry.13.a:0 "Закрытый проект ГУР."
 ukraine_industry.13.b:0 "Показательные испытания для партнёров."
