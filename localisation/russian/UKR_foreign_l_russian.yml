l_russian:
 UKR_req_opt_full:0 "Согласиться полностью."
 UKR_req_opt_part:0 "Согласиться частично."
 UKR_req_opt_no:0 "Отказать."
 UKR_req_res_full:0 "Благодарим. Помощь будет использована с отчётом."
 UKR_req_res_part:0 "Это лучше, чем ничего. Благодарим."
 UKR_req_res_no:0 "Понимаем. Вернёмся к вопросу позже."
 UKR_req_wait_tt:0 "Ответ придёт примерно через §Y[?UKR_req_delay|0]§! дн.; цена и срок зависят от доверия (сейчас §Y[?UKR_req_pct|0]%§! от базовой цены)."
 UKR_req_wait_b_tt:0 "Ответ придёт примерно через §Y[?UKR_req_delay_b|0]§! дн. (Прибалтика отвечает быстро); цена зависит от доверия (сейчас §Y[?UKR_req_pct|0]%§! от базовой цены)."
 UKR_aid_package_tt:0 "Состав пакета: стрелковое оружие и боеприпасы (Польша), снаряжение поддержки (Германия), противотанковые комплексы (Британия)."
 UKR_lend_lease_tt:0 "Состав поставки: стрелковое оружие (Франция, Италия), снаряжение поддержки (Германия), противотанковые комплексы (Британия), грузовики и транспортёры (Польша); на 150 дней действует дух ленд-лиза."
 UKR_aid_delay_tt:0 "Пакет придёт примерно через §Y[?UKR_aid_delay|0]§! дн.; чем ниже доверие, тем дольше."
 UKR_aid_delay_ll_tt:0 "Поставка придёт примерно через §Y[?UKR_ll_delay|0]§! дн.; чем ниже доверие, тем дольше."
 ukr_allies_request_met:0 "Просьба Украины выполнена"
 ukr_allies_request_partial:0 "Просьба Украины выполнена частично"
 ukr_allies_grain_dispute:0 "Спор о зерне: жалобы и давление"
 ukr_allies_grain_solidarity:0 "Согласие на ограничения для зерна"
 ukr_allies_exhumations:0 "Разрешены эксгумации на Волыни"

 UKR_req_pl_hub:0 "Просить Варшаву: транзитный хаб"
 UKR_req_pl_hub_desc:0 "Просим Польшу принимать союзные грузы на юго-востоке страны и перегружать их для Украины.\n\n§YЧто это.§! Узловые аэродромы и станции Подкарпатья. На границе меняется колея (в Европе 1435 мм, у нас 1520 мм), поэтому вагоны перегружают или меняют тележки.\n§YВ реальности.§! С начала полномасштабной войны, в 2022 году, через юго-восток Польши, в первую очередь через аэропорт Жешув-Ясёнка, шла значительная часть западной военной помощи; узел прикрывали силами союзников.\n§YЧто даст.§! Быстрее пополняются потери и склады, приходит техника тыла."
 ukraine_foreign.300.t:0 "Просьба Киева: транзитный коридор"
 ukraine_foreign.300.d:0 "Украина просит открыть юго-восточные аэродромы и станции для союзных грузов и взять перегрузку на себя. Решение придётся защищать перед избирателями: узел может стать целью."
 ukraine_foreign.310.t:0 "Ответ Варшавы: транзитный хаб"
 ukraine_foreign.310.d_full:0 "Варшава согласилась: аэропорт и станции Подкарпатья работают на союзные грузы круглосуточно. Составы идут в Украину без долгих остановок."
 ukraine_foreign.310.d_part:0 "Польша открыла коридор не полностью: часть рейсов и составов принята, остальное по особому разрешению. Это лучше, чем ничего."
 ukraine_foreign.310.d_no:0 "Варшава отказала. В канцелярии опасаются, что узел станет целью, и просят вернуться к вопросу позже."

 UKR_req_pl_arms:0 "Просить Варшаву: оружие из польских арсеналов"
 UKR_req_pl_arms_desc:0 "Просим Польшу передать часть техники и боеприпасов из собственных складов, пока промышленность союзников раскачивается.\n\n§YЧто это.§! Танки Т-72 и польские ПТ-91 «Твярды» (в польской армии с 1990-х), самоходные гаубицы 155 мм «Краб» (с 2010-х) и ПЗРК «Пёрун» (с 2010-х).\n§YВ реальности.§! В 2022 году Польша первой из НАТО передала сотни танков Т-72, затем самоходные гаубицы «Краб» и тысячи ПЗРК «Гром» и «Пёрун».\n§YЧто даст.§! Артиллерия, зенитные расчёты и бронетехника, которые можно двинуть в бой за недели."
 ukraine_foreign.301.t:0 "Просьба Киева: оружие из польских складов"
 ukraine_foreign.301.d:0 "Украина просит передать часть танков, самоходных гаубиц и зенитных комплексов из арсеналов Войска Польского. Военные предупреждают, что собственные склады опустеют."
 ukraine_foreign.311.t:0 "Ответ Варшавы: оружие из арсеналов"
 ukraine_foreign.311.d_full:0 "Варшава передала танки, самоходные гаубицы и зенитные комплексы из арсеналов Войска Польского. Колонны уже идут к границе."
 ukraine_foreign.311.d_part:0 "Польша передала только часть запрошенного: остальное нужно самой армии. Но танки и гаубицы уже идут к границе."
 ukraine_foreign.311.d_no:0 "Варшава отказала: министерство обороны считает запасы минимально допустимыми. Просьбу можно повторить позже."

 UKR_req_pl_medevac:0 "Просить Варшаву: госпитали и эвакуация раненых"
 UKR_req_pl_medevac_desc:0 "Просим Польшу принимать наших раненых в своих госпиталях и организовать медицинскую эвакуацию через границу.\n\n§YЧто это.§! Эвакуационные поезда и самолёты, места в больницах Подкарпатья и других воеводств, реабилитация. Чем быстрее раненый попадает в госпиталь, тем выше шанс вернуть его в строй.\n§YВ реальности.§! Польша приняла более миллиона беженцев из Украины, а польские больницы лечили и раненых военных; эвакуацию координировали с ЕС и НАТО.\n§YЧто даст.§! На время часть потерь возвращается в строй."
 ukraine_foreign.302.t:0 "Просьба Киева: госпитали и эвакуация"
 ukraine_foreign.302.d:0 "Украина просит принимать раненых военных и организовать эвакуацию через границу. Просьба ложится на плечи больниц, которые и так загружены."
 ukraine_foreign.312.t:0 "Ответ Варшавы: госпитали и эвакуация"
 ukraine_foreign.312.d_full:0 "Варшава согласилась: эвакуационные поезда и борты идут в Польшу, госпитали выделили сотни коек. Многие раненые вернутся в строй."
 ukraine_foreign.312.d_part:0 "Польша выделила места в госпиталях, но эвакуацию придётся вести нашими силами: транспорта не хватает."
 ukraine_foreign.312.d_no:0 "Варшава отказала: больницы перегружены беженцами. Просим вернуться к вопросу позже."

 UKR_req_ger_air:0 "Просить Берлин: щит для неба"
 UKR_req_ger_air_desc:0 "Просим Германию передать зенитные комплексы и самоходные установки для защиты городов и энергосистемы.\n\n§YЧто это.§! Зенитные комплексы средней дальности IRIS-T SLM, самоходные зенитные установки «Гепард» (стояли на вооружении бундесвера с 1970-х до 2010-х) и ЗРК «Пэтриот».\n§YВ реальности.§! С 2022 года Германия передавала IRIS-T SLM и около полусотни «Гепардов», а позже, вместе с партнёрами, и батареи «Пэтриот».\n§YЧто даст.§! Зенитная техника на склад и шаг к защите инфраструктуры от ударов с воздуха."
 ukraine_foreign.400.t:0 "Просьба Киева: противовоздушный щит"
 ukraine_foreign.400.d:0 "Украина просит зенитные комплексы для защиты городов и энергосистемы. Ответ определит, сколько ракет и систем Германия может выделить, не оголив собственную ПВО."
 ukraine_foreign.410.t:0 "Ответ Берлина: щит для неба"
 ukraine_foreign.410.d_full:0 "Берлин согласился: на склады приходят зенитные комплексы средней дальности и самоходные установки. У городов больше шансов пережить удары."
 ukraine_foreign.410.d_part:0 "Германия выделила часть запрошенных систем: остальное, по словам канцелярии, нужно собственной армии и ждёт заказов промышленности."
 ukraine_foreign.410.d_no:0 "Берлин отказал: канцелярия ссылается на пустеющие склады и ждёт нового заказа промышленности. Просьбу можно повторить позже."

 UKR_req_ger_credit:0 "Просить Берлин: кредитная линия"
 UKR_req_ger_credit_desc:0 "Просим Германию возглавить финансовую поддержку: льготные займы, гарантии и прямые гранты на бюджет и закупки.\n\n§YЧто это.§! Часть помощи приходит грантом, часть льготным займом, привязанным к реформам и отчётности. Заём увеличивает долг, грант нет.\n§YВ реальности.§! С 2022 года Германия давала гранты и гарантии, участвовала в макрофинансовой помощи ЕС и в общей программе G7; выплаты привязывали к реформам и отчётам.\n§YЧто даст.§! Деньги в бюджет и часть долга. Чем меньше коррупции, тем охотнее дают."
 ukraine_foreign.401.t:0 "Просьба Киева: финансовая поддержка"
 ukraine_foreign.401.d:0 "Украина просит кредитную линию и бюджетные гранты. Министерство финансов напоминает, что деньги придётся отчитывать перед бундестагом."
 ukraine_foreign.411.t:0 "Ответ Берлина: кредитная линия"
 ukraine_foreign.411.d_full:0 "Берлин согласился: часть средств придёт грантом, часть льготным кредитом под реформы. Бюджет на ближайшие месяцы закрыт."
 ukraine_foreign.411.d_part:0 "Германия дала меньше запрошенного: гарантии на часть займа и скромный грант. Остальное после отчёта о реформах."
 ukraine_foreign.411.d_no:0 "Берлин отказал: канцелярия требует сначала отчитаться о прошлых траншах и реформах. Просьбу можно повторить позже."

 UKR_req_ger_armor:0 "Просить Берлин: тяжёлая техника"
 UKR_req_ger_armor_desc:0 "Просим Германию передать танки, боевые машины пехоты и самоходные гаубицы из запасов бундесвера и промышленности.\n\n§YЧто это.§! Танки «Леопард 2» (в Германии с 1970-х, модификация 2А6 с 2000-х), боевые машины пехоты «Мардер» (с 1970-х) и самоходные гаубицы PzH 2000 (с 1990-х).\n§YВ реальности.§! В 2022 году Германия передала первые PzH 2000, а в 2023 году, после месяцев споров, согласилась на «Леопарды 2» и «Мардеры», когда США и другие союзники решили присоединиться.\n§YЧто даст.§! Бронетехника и артиллерия для наступательных операций; но без доверия решение у Берлина вырвать трудно."
 ukraine_foreign.402.t:0 "Просьба Киева: тяжёлая техника"
 ukraine_foreign.402.d:0 "Украина просит танки, боевые машины пехоты и самоходные гаубицы. Канцлер колеблется: не хочет эскалации и ждёт, что решат союзники."
 ukraine_foreign.412.t:0 "Ответ Берлина: тяжёлая техника"
 ukraine_foreign.412.d_full:0 "Берлин согласился: «Леопарды», «Мардеры» и самоходные гаубицы идут на склады. Решение далось тяжело, но дорога открыта."
 ukraine_foreign.412.d_part:0 "Германия передала часть техники: остальное, по словам канцелярии, придёт, когда к решению присоединятся союзники."
 ukraine_foreign.412.d_no:0 "Берлин отказал: канцелярия не хочет «идти впереди союзников». Просьбу можно повторить позже."

 UKR_req_fra_caesar:0 "Просить Париж: артиллерийский контракт"
 UKR_req_fra_caesar_desc:0 "Просим Францию поставить колёсные самоходные гаубицы и снаряды и заключить длительный контракт с промышленностью.\n\n§YЧто это.§! CAESAR: 155-мм гаубица на шасси грузовика 6x6; во французской армии с 2000-х, быстро меняет позицию после выстрела и поэтому хуже поддаётся контрбатарейному огню.\n§YВ реальности.§! С 2022 года Франция передала Украине десятки CAESAR (часть оплатили другие страны, включая Данию) и заказывала новые партии у промышленности.\n§YЧто даст.§! Мобильная артиллерия и снаряды к ней; ответ зависит от того, сколько Франция может выделить, не оголив собственную армию."
 ukraine_foreign.420.t:0 "Просьба Киева: артиллерийский контракт"
 ukraine_foreign.420.d:0 "Украина просит самоходные гаубицы CAESAR и снаряды. Генштаб предупреждает, что запас снарядов собственной армии ограничен."
 ukraine_foreign.430.t:0 "Ответ Парижа: артиллерийский контракт"
 ukraine_foreign.430.d_full:0 "Париж согласился: гаубицы CAESAR и снаряды к ним идут в Украину. Промышленность получила заказ."
 ukraine_foreign.430.d_part:0 "Франция дала часть запрошенного: гаубиц меньше, снаряды только по графику производства."
 ukraine_foreign.430.d_no:0 "Париж отказал: собственным войскам не хватает снарядов. Просьбу можно повторить позже."

 UKR_req_fra_air:0 "Просить Париж: авиация и зенитные ракеты"
 UKR_req_fra_air_desc:0 "Просим Францию передать зенитные ракетные комплексы, крылатые ракеты и боевые самолёты.\n\n§YЧто это.§! ЗРК SAMP/T (франко-итальянский, ракеты «Астер 30»), крылатые ракеты SCALP-EG (двойник британской Storm Shadow, дальность свыше 250 км), истребители 4-го поколения «Мираж 2000» (во французской авиации с 1980-х).\n§YВ реальности.§! В 2023-2024 годах Франция поставила SCALP и SAMP/T, а затем готовила передачу «Миражей».\n§YЧто даст.§! Зенитное прикрытие, дальний удар по тылам и боевая авиация; но Париж отдаёт такие системы осторожно."
 ukraine_foreign.421.t:0 "Просьба Киева: авиация и зенитные ракеты"
 ukraine_foreign.421.d:0 "Украина просит зенитные ракетные комплексы, крылатые ракеты и истребители. Каждая из этих систем снимается с вооружения самой Франции."
 ukraine_foreign.431.t:0 "Ответ Парижа: авиация и ракеты"
 ukraine_foreign.431.d_full:0 "Париж согласился: на склады приходят зенитные комплексы, крылатые ракеты и истребители. Решение принято на уровне президента."
 ukraine_foreign.431.d_part:0 "Франция выделила часть: зенитные комплексы и ракеты, но самолёты придётся ждать."
 ukraine_foreign.431.d_no:0 "Париж отказал: в Елисейском дворце считают такие системы слишком чувствительными. Просьбу можно повторить позже."

 UKR_req_fra_volunteers:0 "Просить Париж: реестр иностранных добровольцев"
 UKR_req_fra_volunteers_desc:0 "Просим Францию помочь с учётом и проверкой иностранных добровольцев: принимать заявки при консульствах, согласовывать списки и снять юридические риски с вернувшихся.\n\n§YЧто это.§! Единый реестр: кто приехал, кем служит, кто за него поручился. Проверка снимает вопрос союзников о том, не пробираются ли в Украину радикалы и наёмники.\n§YВ реальности.§! С 2022 года в Международный легион обороны Украины ехали тысячи иностранцев, в том числе французы; страны Европы относились к этому по-разному: от молчаливой терпимости до предостережений.\n§YЧто даст.§! Приток людей и опыта, формальный статус добровольцам и меньше подозрений; но если у нас сильны радикалы, Париж откажет."
 ukraine_foreign.422.t:0 "Просьба Киева: реестр добровольцев"
 ukraine_foreign.422.d:0 "Украина просит помочь с учётом иностранных добровольцев и разрешить приём заявок при консульствах. Парламентская комиссия спрашивает, кто именно поедет и под чьим командованием."
 ukraine_foreign.432.t:0 "Ответ Парижа: реестр добровольцев"
 ukraine_foreign.432.d_full:0 "Париж согласился: консульства принимают заявки, списки проверяются совместно. К добровольцам стало меньше вопросов."
 ukraine_foreign.432.d_part:0 "Франция разрешила учёт, но приём заявок при консульствах не допустила: добровольцы поедут на свой страх и риск."
 ukraine_foreign.432.d_no:0 "Париж отказал: в Елисейском дворце не хотят отвечать за граждан, воюющих за границей. Просьбу можно повторить позже."

 UKR_req_eng_intel:0 "Просить Лондон: разведывательное партнёрство"
 UKR_req_eng_intel_desc:0 "Просим Британию делиться разведданными и помочь защитить наши каналы связи.\n\n§YЧто это.§! Данные радио- и радиотехнической разведки, спутниковые снимки, совместная оценка угроз и защита шифров.\n§YВ реальности.§! Перед вторжением 2022 года Британия и США рассекретили часть данных о планах России, а с начала войны британское Министерство обороны публикует регулярные обзоры её хода.\n§YЧто даст.§! На время растут возможности перехвата и накопления данных; но Лондон делится только с теми, кто умеет хранить секреты."
 ukraine_foreign.440.t:0 "Просьба Киева: обмен разведданными"
 ukraine_foreign.440.d:0 "Украина просит постоянный обмен данными и помощь в защите связи. Разведывательные службы напоминают: источники уязвимы, а утечки стоят дорого."
 ukraine_foreign.450.t:0 "Ответ Лондона: разведывательное партнёрство"
 ukraine_foreign.450.d_full:0 "Лондон согласился: открыт постоянный канал обмена, данные приходят ежедневно. Контрразведка проверяет наши каналы связи."
 ukraine_foreign.450.d_part:0 "Британия согласилась на ограниченный обмен: часть данных мы получим только в виде оценок, без первоисточников."
 ukraine_foreign.450.d_no:0 "Лондон отказал: службы не уверены в защите наших каналов. Просьбу можно повторить позже."

 UKR_req_eng_training:0 "Просить Лондон: учебная миссия"
 UKR_req_eng_training_desc:0 "Просим Британию организовать на своей территории подготовку наших новобранцев и офицеров.\n\n§YЧто это.§! Курсы на британских полигонах: общевойсковая подготовка, тактика малых подразделений, медицина, сапёрное дело, обучение командиров.\n§YВ реальности.§! С 2022 года Британия руководила операцией «Интерфлекс»: инструкторы из нескольких стран за несколько недель готовили новобранцев, и за годы операции обучение прошли десятки тысяч человек.\n§YЧто даст.§! Опыт армии и более быстрая подготовка дивизий на время миссии."
 ukraine_foreign.441.t:0 "Просьба Киева: учебная миссия"
 ukraine_foreign.441.d:0 "Украина просит принять новобранцев и офицеров на подготовку на британских полигонах. Армия оценивает, сколько инструкторов можно снять с собственных частей."
 ukraine_foreign.451.t:0 "Ответ Лондона: учебная миссия"
 ukraine_foreign.451.d_full:0 "Лондон согласился: наши новобранцы и офицеры едут на британские полигоны, инструкторы начинают набор. Подготовка займёт недели, а не месяцы."
 ukraine_foreign.451.d_part:0 "Британия приняла меньше курсантов: офицеры ждут следующего набора, новобранцы пройдут обучение в сокращённом виде."
 ukraine_foreign.451.d_no:0 "Лондон отказал: инструкторов не хватает для собственных частей. Просьбу можно повторить позже."

 UKR_req_eng_missiles:0 "Просить Лондон: противотанковые и дальнобойные ракеты"
 UKR_req_eng_missiles_desc:0 "Просим Британию передать противотанковые комплексы и ракеты дальнего действия.\n\n§YЧто это.§! NLAW (шведско-британский одноразовый противотанковый комплекс, в британской армии с 2000-х), Starstreak (зенитный комплекс с лазерным наведением, с 1990-х), Storm Shadow (крылатая ракета с дальностью свыше 250 км, у британских ВВС с начала 2000-х).\n§YВ реальности.§! В 2022 году Британия передала тысячи NLAW, затем Starstreak, а в 2023 году первой из западных стран поставила Storm Shadow, ограничив их применение.\n§YЧто даст.§! Противотанковая и зенитная техника и дальний удар по тылам; Лондон просит гарантий, что ракеты не уйдут на сторону."
 ukraine_foreign.442.t:0 "Просьба Киева: ракеты"
 ukraine_foreign.442.d:0 "Украина просит противотанковые и зенитные комплексы и ракеты дальнего действия. Министерство обороны обсуждает условия применения."
 ukraine_foreign.452.t:0 "Ответ Лондона: ракеты"
 ukraine_foreign.452.d_full:0 "Лондон согласился: противотанковые и зенитные комплексы и ракеты дальнего действия поставлены Украине. Условия применения оговорены."
 ukraine_foreign.452.d_part:0 "Британия передала часть запрошенного: противотанковые и зенитные комплексы, а по дальнобойным ракетам решения пока нет."
 ukraine_foreign.452.d_no:0 "Лондон отказал: условия применения не согласованы. Просьбу можно повторить позже."

 UKR_req_eng_naval:0 "Просить Лондон: морская коалиция и дроны"
 UKR_req_eng_naval_desc:0 "Просим Британию возглавить морскую коалицию и помочь Украине флотом без флота: безэкипажные катера, тральщики, обучение моряков.\n\n§YЧто это.§! Безэкипажные катера и подводные дроны, тральщики и береговая оборона, пока большие корабли заперты проливами.\n§YВ реальности.§! В 2022 году Украина первой применила безэкипажные катера в бою; в 2023 году Британия и Норвегия создали Коалицию морского потенциала, а Лондон передал Украине тральщики типа Sandown.\n§YЧто даст.§! Деньги и технологии для кластера БПЛА и морских дронов, опыт морякам и шаг к безопасности Чёрного моря."
 ukraine_foreign.443.t:0 "Просьба Киева: морская коалиция"
 ukraine_foreign.443.d:0 "Украина просит возглавить морскую коалицию и помочь с безэкипажными катерами, тральщиками и обучением. Адмиралтейство напоминает: корабли не могут войти в Чёрное море из-за режима проливов."
 ukraine_foreign.453.t:0 "Ответ Лондона: морская коалиция"
 ukraine_foreign.453.d_full:0 "Лондон согласился: создаётся морская коалиция, оборонные организации получают финансирование, моряки места в британских училищах."
 ukraine_foreign.453.d_part:0 "Британия согласилась на часть: помощь с обучением и скромное финансирование, но коалиция откладывается."
 ukraine_foreign.453.d_no:0 "Лондон отказал: Адмиралтейство не готово брать на себя обязательства по Чёрному морю. Просьбу можно повторить позже."

 UKR_req_est_package:0 "Просить Таллин: быстрый пакет"
 UKR_req_est_package_desc:0 "Просим Эстонию срочно передать из собственных запасов то, что можно отправить за несколько дней.\n\n§YЧто это.§! Малый, но быстрый пакет: 155-мм гаубицы FH-70 (в европейских армиях с 1970-х), переносные противотанковые комплексы Javelin (с 1990-х), боеприпасы.\n§YВ реальности.§! Эстония передала Украине гаубицы FH-70 и Javelin и вошла в число стран, дающих помощи больше всех в процентах от ВВП; поставки начались ещё до начала полномасштабного вторжения.\n§YЧто даст.§! Небольшая, но срочная помощь; Таллин отвечает быстрее других."
 ukraine_foreign.460.t:0 "Просьба Киева: срочный пакет"
 ukraine_foreign.460.d:0 "Украина просит передать из запасов то, что можно отправить за несколько дней. У Эстонии немного, но решение принимается без долгих споров."
 ukraine_foreign.470.t:0 "Ответ Таллина: быстрый пакет"
 ukraine_foreign.470.d_full:0 "Таллин согласился: гаубицы, противотанковые комплексы и боеприпасы уже в пути. Пакет невелик, но пришёл вовремя."
 ukraine_foreign.470.d_part:0 "Эстония передала то, что может: часть гаубиц и боеприпасов. Остального у неё просто нет."
 ukraine_foreign.470.d_no:0 "Таллин отказал: запасы после прошлых передач на минимуме. Просьбу можно повторить позже."

 UKR_req_lat_drones:0 "Просить Ригу: коалиция дронов"
 UKR_req_lat_drones_desc:0 "Просим Латвию вместе с Британией возглавить коалицию по беспилотникам: общие закупки, финансирование мастерских и поставки.\n\n§YЧто это.§! Совместные закупки и финансирование производства: разведывательные дроны, ударные FPV, наземные роботы. Латвия берёт на себя координацию.\n§YВ реальности.§! В 2024 году Латвия и Британия возглавили «Коалицию дронов» в формате «Рамштайн»; Латвия также передавала Украине зенитные комплексы «Стингер».\n§YЧто даст.§! Деньги для кластера БПЛА и зенитные ракеты."
 ukraine_foreign.461.t:0 "Просьба Киева: коалиция дронов"
 ukraine_foreign.461.d:0 "Украина просит возглавить коалицию по беспилотникам: общие закупки и финансирование мастерских. Армия готова скоординировать, если партнёры подтвердят свои взносы."
 ukraine_foreign.471.t:0 "Ответ Риги: коалиция дронов"
 ukraine_foreign.471.d_full:0 "Рига согласилась: коалиция создана, первые деньги идут на мастерские, зенитные ракеты уже в пути."
 ukraine_foreign.471.d_part:0 "Латвия согласилась на часть: скромные взносы и зенитные ракеты, но общая коалиция пока без партнёров."
 ukraine_foreign.471.d_no:0 "Рига отказала: без согласия партнёров Латвия не готова брать на себя координацию. Просьбу можно повторить позже."

 UKR_req_lit_support:0 "Просить Вильнюс: зенитные ракеты и инструкторы"
 UKR_req_lit_support_desc:0 "Просим Литву передать переносные зенитные комплексы и командировать инструкторов.\n\n§YЧто это.§! ПЗРК «Стингер» (в армиях НАТО с 1980-х) и инструкторы для подготовки расчётов и сапёров.\n§YВ реальности.§! Литва передала Украине «Стингеры», а общество собирало деньги на помощь: в 2022 году народный сбор на беспилотник «Байрактар» был настолько быстрым, что производитель решил подарить машину.\n§YЧто даст.§! Зенитные ракеты, опыт и шаг к защите неба."
 ukraine_foreign.462.t:0 "Просьба Киева: ПВО и инструкторы"
 ukraine_foreign.462.d:0 "Украина просит переносные зенитные комплексы и инструкторов. Литва отвечает осторожно: собственные запасы малы, но общество требует помогать."
 ukraine_foreign.472.t:0 "Ответ Вильнюса: ПВО и инструкторы"
 ukraine_foreign.472.d_full:0 "Вильнюс согласился: зенитные ракеты идут Украине, инструкторы готовят расчёты. Литовцы собрали деньги ещё до решения правительства."
 ukraine_foreign.472.d_part:0 "Литва передала часть ракет, инструкторов обещала позже."
 ukraine_foreign.472.d_no:0 "Вильнюс отказал: правительство ждёт ответа партнёров по Балтии. Просьбу можно повторить позже."

 ukraine_foreign.320.t:0 "Зерно на польской границе"
 ukraine_foreign.320.d:0 "Украинское зерно, идущее транзитом через Польшу, оседает на местном рынке и обрушивает цены для польских фермеров. Варшава грозит запретом ввоза, а фермеры и перевозчики блокируют переходы. В нашей реальности так было в 2023 году: Польша, Венгрия и Словакия закрыли рынки для украинского зерна, ЕС ввёл временные ограничения, а Киев жаловался в ВТО.\n\nТеперь нужно решить, как отвечать."
 ukraine_foreign.320.a:0 "Согласиться на запрет и пустить зерно через «коридоры солидарности»."
 ukraine_foreign.320.b:0 "Жаловаться в ВТО и давить через Брюссель."
 ukraine_foreign.320.c:0 "Тихие переговоры: лицензии на вывоз и квоты."
 UKR_pl_exhumations:0 "Разрешить эксгумации на Волыни"
 UKR_pl_exhumations_desc:0 "Даём Варшаве разрешение искать и эксгумировать останки польских жертв Волынской трагедии 1943-1944 годов и ухаживать за захоронениями. Взамен просим такого же отношения к украинским могилам в Польше.\n\n§YЧто это.§! Комиссии историков и судебных экспертов, работы в сёлах Волыни и Галичины, согласование с местными властями. Тема болезненная: это вопрос памяти и для поляков, и для украинцев.\n§YВ реальности.§! В середине 2020-х, впервые за много лет, в селе Пузники (Тернопольская область) начались эксгумации по согласованию Киева и Варшавы.\n§YЧто даст.§! Заметно теплеет отношение Польши, растёт доверие; часть националистов недовольна."
 ukraine_foreign.321.t:0 "Эксгумации начались"
 ukraine_foreign.321.d:0 "Польские и украинские эксперты начали работу в поле. Первые останки найдены и приняты с уважением. Вопрос остаётся трудным, но разговор начался, и в Варшаве это заметили."
 ukraine_foreign.321.a:0 "Работаем дальше."
 ukraine_foreign.480.t:0 "Пакет западной помощи прибыл"
 ukraine_foreign.480.d:0 "Очередная партия помощи пересекла границу: польская стрелковая техника и боеприпасы, немецкое снаряжение поддержки и британские противотанковые комплексы. Каждый такой пакет невелик, но между крупными поставками он держит армию на ходу. Размер партии зависит от единства НАТО."
 ukraine_foreign.480.a:0 "Принять и распределить по бригадам."
 ukraine_foreign.481.t:0 "Ленд-лиз: первая поставка"
 ukraine_foreign.481.d:0 "Программа ленд-лиза заработала: из Франции и Италии пришли стрелковые комплексы, из Германии снаряжение поддержки, из Британии противотанковые комплексы, из Польши грузовики и транспортёры. Поставки рассчитаны на месяцы, поэтому действует и временный дух ленд-лиза.\n\n§YВ реальности.§! Закон о ленд-лизе для Украины США приняли в 2022 году: он упростил передачу техники без немедленной оплаты и ускорил поставки."
 ukraine_foreign.481.a:0 "Принять поставку."

 UKR_pl_hub_idea:0 "Польский транзитный хаб"
 UKR_pl_hub_idea_desc:0 "Через юго-восток Польши идут союзные грузы: быстрее пополняются потери и склады."
 UKR_pl_hub_idea_lim:0 "Ограниченный польский хаб"
 UKR_pl_hub_idea_lim_desc:0 "Польша пропускает часть союзных грузов: пополнение идёт чуть быстрее."
 UKR_pl_medevac_idea:0 "Польская медицинская эвакуация"
 UKR_pl_medevac_idea_desc:0 "Раненых лечат в польских госпиталях: часть возвращается в строй."
 UKR_pl_medevac_idea_lim:0 "Ограниченная эвакуация в Польшу"
 UKR_pl_medevac_idea_lim_desc:0 "Польша принимает часть раненых: меньше возвращается в строй."
 UKR_vol_vetted_idea:0 "Проверенные добровольцы"
 UKR_vol_vetted_idea_desc:0 "Иностранные добровольцы проходят учёт и проверку: армия быстрее набирает опыт."
 UKR_vol_vetted_idea_lim:0 "Добровольцы под учётом"
 UKR_vol_vetted_idea_lim_desc:0 "Учёт добровольцев ведётся частично: эффект скромнее."
 UKR_uk_intel_idea:0 "Британское разведывательное партнёрство"
 UKR_uk_intel_idea_desc:0 "Лондон делится разведданными и помогает защищать наши каналы связи."
 UKR_uk_intel_idea_lim:0 "Ограниченный обмен с Британией"
 UKR_uk_intel_idea_lim_desc:0 "Лондон делится только оценками, без первоисточников."
 UKR_uk_training_idea:0 "Британская учебная миссия"
 UKR_uk_training_idea_desc:0 "Новобранцы и офицеры проходят подготовку на британских полигонах: дивизии учатся быстрее."
 UKR_uk_training_idea_lim:0 "Сокращённая британская миссия"
 UKR_uk_training_idea_lim_desc:0 "Британия принимает меньше курсантов: эффект скромнее."
