l_russian:
 UKR_golden_age:0 "Золотой век Украины"
 UKR_golden_age_desc:0 "Выборы позади, союз «Слуги народа» и «За будущее» держит Раду, а курс, начатый в 2020 году, дошёл до результата: примирение с регионами закреплено законами, армия служит по новым уставам, дороги и мосты строятся, школьные программы переписаны. На Банковой готовят план развития на десять лет и уверяют, что самое трудное позади. Социологи довольны, телемарафон бодр, а Рада впервые за много лет не устраивает боксёрские матчи в прямом эфире.\n\nНад золотыми полями Украины встаёт солнце, и кажется, что будущее наконец наступает: колосья клонятся под ветром, как в старых стихах, а над новыми кварталами и старыми хатами поднимается утренний дым. Так хочется верить, что дальше будет только лучше. Но дьявол, как известно, в деталях, а детали, как водится, лежат в бумагах, которые пока никто не читал."
 UKR_golden_age_available_tt:0 "Парламентские выборы прошли, союз в Раде заключён"
