 UKR_golden_age:0 "Золотой век Украины"
 UKR_golden_age_desc:0 "Парламент избран, союз в Раде заключён, реформы доведены до конца: армия работает по новым уставам, дороги строятся, школьные программы переписаны, а Киев занят делом, а не распрями. Офис президента готовит программу на десятилетие вперёд и обещает, что самое трудное позади. Социологи довольны, СМИ пока осторожны, оппозиция пока молчит.\n\nВ такие периоды обычно и стоит почаще проверять, кто и чем занят за закрытыми дверями."
 UKR_golden_age_available_tt:0 "Парламентские выборы прошли, союз в Раде заключён"
