 UKR_golden_age:0 "Золотой век Украины"
 UKR_golden_age_desc:0 "Выборы позади, союз «Слуги народа» и «За будущее» держит Раду, а курс, начатый в 2020 году, дошёл до результата: примирение с регионами закреплено законами, армия служит по новым уставам, дороги и мосты строятся, школьные программы переписаны. На Банковой готовят план развития на десять лет и уверяют, что самое трудное позади. Социологи довольны, телемарафон бодр, а Рада впервые за много лет голосует без драк в кулуарах.\n\nУ власти, которой всё удаётся, есть привычка расслабляться. Союз в Раде держится на расчёте, а не на дружбе, в коридорах всё чаще спрашивают, кто и что подписывал за закрытыми дверями, а вопросы журналистов пока звучат вежливо. Золотые века в истории редко заканчивались по плану."
 UKR_golden_age_available_tt:0 "Парламентские выборы прошли, союз в Раде заключён"
