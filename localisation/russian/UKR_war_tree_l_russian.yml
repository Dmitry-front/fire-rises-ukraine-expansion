l_russian:
 UKR_w_war_comes_home:0 "Война пришла в каждый дом"
 UKR_w_war_comes_home_desc:0 "Сирены, укрытия, колонны на дорогах. То, о чём говорили годами, стало повседневностью: страна просыпается уже на другой войне.\n\nЭтот фокус завершается сам и отмечает рубеж: с этого дня вся политика, экономика и жизнь подчинены одному вопросу."
 UKR_w_martial_law:0 "Военное положение и единый штаб"
 UKR_w_martial_law_desc:0 "Военное положение - особый правовой режим: ограничения на выезд и собрания, право государства требовать ресурсы для обороны, запрет выборов. Неделя уходит на указы, голосование в парламенте и создание единого штаба, где сходятся армия, власть и связь.\n\nПока идёт война, выборы не проводятся. Дальше дерево разветвляется: каждый выбор открывает новые решения и временные духи, но закрывает другие пути."
 UKR_w_supreme_command:0 "Ставка Верховного главнокомандующего"
 UKR_w_supreme_command_desc:0 "Ставка - орган, где глава государства и военные вместе решают, как вести войну. Единый центр сокращает путь от приказа к исполнению, а Генштаб получает право планировать на всю страну.\n\nОткрывает возможность укрепить границу."
 UKR_w_unified_command:0 "Единое командование"
 UKR_w_unified_command_desc:0 "Вся армия, Территориальная оборона и силы безопасности подчиняются одному штабу. Планирование проще, наступательные операции согласованнее, но местные командиры теряют часть инициативы.\n\nОткрывает наступательное решение."
 UKR_w_operational_commands:0 "Операционные командования"
 UKR_w_operational_commands_desc:0 "Фронт делят на направления со своими командующими, которым дано право решать на месте. Подразделения гибче и живучее, но общему плану труднее.\n\nОткрывает решение о быстром бронированном ударе."
 UKR_w_battle_experience:0 "Боевой опыт - в доктрину"
 UKR_w_battle_experience_desc:0 "Уроки первых месяцев записывают в уставы: что работало, что стоило лишних потерь. Вместо вчерашних учебников - практика фронта. Выигрыш зависит от выбранной системы командования.\n\nОткрывает решение о штурме опорного пункта."
 UKR_w_general_mobilization:0 "Всеобщая мобилизация"
 UKR_w_general_mobilization_desc:0 "Призыв по всей стране: резервисты, добровольцы, специалисты. Людей нужно обучить, одеть и вооружить, а каждый призванный - это человек, ушедший с завода или с поля.\n\nОткрывает вторую и третью волны мобилизации и выбор способа, которым государство будет собирать людей."
 UKR_w_pay_the_soldiers:0 "Достойное содержание"
 UKR_w_pay_the_soldiers_desc:0 "Контракт с достойной оплатой, выплаты семьям, льготы раненым. Люди идут охотнее и держатся на фронте дольше, но бюджет платит каждый месяц.\n\nВзаимоисключающий выбор: способ мобилизации - деньги, лозунги или принуждение."
 UKR_w_call_to_the_nation:0 "Призыв к нации"
 UKR_w_call_to_the_nation_desc:0 "Мобилизация лозунгами: история, язык, образ врага. Волна добровольцев и высокий дух, но такая риторика подпитывает ненависть и усиливает националистов.\n\nВзаимоисключающий выбор: способ мобилизации."
 UKR_w_forced_mobilization:0 "Принудительный призыв"
 UKR_w_forced_mobilization_desc:0 "Облавы у военкоматов, повестки на улице, штрафы за уклонение. Армия получает людей быстро, но общество недовольно, а союзники смотрят на это без одобрения.\n\nВзаимоисключающий выбор: способ мобилизации."
 UKR_w_reserve_and_veterans:0 "Резерв и ветераны"
 UKR_w_reserve_and_veterans_desc:0 "Бывшие бойцы возвращаются инструкторами, раненых лечат и переучивают, резервисты проходят подготовку. Результат зависит от того, как страна мобилизовала людей раньше.\n\nОткрывает решения по памяти погибших и помощи ветеранам."
 UKR_w_united_news:0 "Единые новости"
 UKR_w_united_news_desc:0 "Все телеканалы выпускают общий эфир: единая картина, меньше паники, нет противоречий. Но свободные СМИ теряют голос, а доверие к официальной версии держится только на успехах.\n\nВзаимоисключающий выбор: информационная политика военного времени. Открывает кампанию стойкости."
 UKR_w_open_communication:0 "Открытая коммуникация"
 UKR_w_open_communication_desc:0 "Ежедневные брифинги, честные потери, спор в эфире. Доверие и прозрачность растут, союзники видят открытую страну, но враг читает всё, что мы говорим.\n\nВзаимоисключающий выбор: информационная политика военного времени. Открывает культурную кампанию."
 UKR_w_relocate_industry:0 "Эвакуация промышленности на запад"
 UKR_w_relocate_industry_desc:0 "Заводы разбирают и вывозят с востока и юга на запад: станки, люди, архивы. Месяцы простоя, но потом производство возвращается там, куда сложнее достать.\n\nОткрывает карпатский логистический план и рассредоточение производства."
 UKR_w_state_war_order:0 "Государственный оборонный заказ"
 UKR_w_state_war_order_desc:0 "Государство размещает заказы напрямую, определяет цены и сроки. Предсказуемо и подконтрольно, но частная инициатива ограничена. Усиливает танковые, ремонтные и артиллерийские предприятия.\n\nВзаимоисключающий выбор: кто управляет военным производством. Открывает дополнительный оборонный проект."
 UKR_w_private_contracts:0 "Контракты для частных производителей"
 UKR_w_private_contracts_desc:0 "Заказы получают частные компании: дроны, радиоэлектроника, катера. Скорость и изобретательность выше, но контроль слабее, а прибыль уходит владельцам.\n\nВзаимоисключающий выбор: кто управляет военным производством. Открывает дополнительный оборонный проект."
 UKR_w_sky_shield:0 "Щит неба"
 UKR_w_sky_shield_desc:0 "Многослойная ПВО: дальнобойные комплексы вокруг столицы и узлов энергетики, зенитные расчёты и мобильные огневые группы прикрывают города. Каждый комплекс стоит дорого, но удары по инфраструктуре становятся реже и слабее."
 UKR_w_resilient_grid:0 "Живучая энергосистема"
 UKR_w_resilient_grid_desc:0 "Распределённая генерация, резервные подстанции, мобильные ремонтные бригады. Удары по энергетике по-прежнему болезненны, но свет возвращается быстрее.\n\nОткрывает решение о ремонтных бригадах энергетиков."
 UKR_w_appeal_to_the_world:0 "Обращение к миру"
 UKR_w_appeal_to_the_world_desc:0 "Выступления в парламентах и международных организациях, свидетельства очевидцев, ежедневные материалы для прессы. Симпатии мира - ресурс, который нужно постоянно обновлять.\n\nОткрывает пакет западной помощи, коалицию сопротивления и конференцию доноров."
 UKR_w_europe_first:0 "Европа - первым делом"
 UKR_w_europe_first_desc:0 "Курс на прочную связь с европейскими столицами: общие штабы, консультации, открытость. Помощь течёт увереннее, но мы берём на себя обязательства и теряем часть самостоятельности.\n\nВзаимоисключающий выбор: на кого опираться. Открывает ленд-лиз и разведывательную операцию с НАТО."
 UKR_w_own_strength:0 "Опора на собственные силы"
 UKR_w_own_strength_desc:0 "Не просить, а производить. Ставка на отечественные заводы и конструкторов: дольше и дороже, но чужие решения от нас не зависят.\n\nВзаимоисключающий выбор: на кого опираться. Добавляет средства организациям оборонной промышленности."
 UKR_w_regional_security:0 "Региональная безопасность"
 UKR_w_regional_security_desc:0 "Договоры с ближайшими соседями: общие склады, общая ПВО, быстрый обмен данными. Это не вступление в союз, но шаг к нему.\n\nОткрывает региональный союз, а при хорошем доверии коалиции поднимает место Украины в штабе."
 UKR_w_drone_war:0 "Дроны на передовой"
 UKR_w_drone_war_desc:0 "Серийные беспилотники разведки и удара, собранные в мастерских и на заводах, дают то, чего не хватает артиллерии: глаза на передовой и дешёвый удар.\n\nОткрывает координацию ударов и серию дронов."
 UKR_w_deep_strikes:0 "Удары вглубь территории противника"
 UKR_w_deep_strikes_desc:0 "Склады, штабы и переправы за линией фронта становятся целями. Это ломает логистику врага и поднимает дух, но европейские столицы опасаются эскалации.\n\nВзаимоисключающий выбор: как вести войну. Открывает ночные рейды, диверсионную войну и ответ всеми средствами."
 UKR_w_attrition_defense:0 "Оборона на истощение"
 UKR_w_attrition_defense_desc:0 "Не рваться вперёд, а выматывать: минные поля, глубоко эшелонированные рубежи, огонь по наступающим колоннам. Меньше риска и больше доверия партнёров, но инициатива у врага.\n\nВзаимоисключающий выбор: как вести войну. Открывает оборону стратегического треугольника."
 UKR_w_black_sea_drones:0 "Чёрное море: безэкипажные катера"
 UKR_w_black_sea_drones_desc:0 "Флот без кораблей: катера, несущие взрывчатку и разведку, сковывают противника в акватории. Дёшево и эффективно против больших кораблей.\n\nОткрывает морскую операцию."
 UKR_w_p_tech_digital_hq:0 "Цифровой штаб"
 UKR_w_p_tech_digital_hq_desc:0 "Единая цифровая платформа для командиров, волонтёров и логистики: заявки, карты, учёт. Технократы строят управление войной как систему данных.\n\nФокус доступен только на пути технократов."
 UKR_w_p_tech_drone_command:0 "Командование беспилотных систем"
 UKR_w_p_tech_drone_command_desc:0 "Отдельный род войск: дроны, связь, подготовка операторов. Технократы переносят опыт стартапов на фронт."
 UKR_w_p_left_labor_front:0 "Трудовой фронт"
 UKR_w_p_left_labor_front_desc:0 "Профсоюзы и трудовые коллективы берут на себя часть работы тыла: оборонные заказы, ремонт, помощь семьям. Президент расширяет охват аудитории: война подаётся как общее дело, а не только забота армии.\n\nФокус доступен только на пути левых."
 UKR_w_p_left_people_defense:0 "Народная оборона"
 UKR_w_p_left_people_defense_desc:0 "Местные отряды самообороны, дружины в посёлках, обучение гражданских базовым навыкам. База мобилизации расширяется за счёт добровольцев на местах."
 UKR_w_p_olig_business_cabinet:0 "Бизнес в военном кабинете"
 UKR_w_p_olig_business_cabinet_desc:0 "Крупные собственники входят в оперативные советы: логистика, топливо, связь. Дела идут быстрее, но влияние денег на государственные решения растёт.\n\nФокус доступен только на пути олигархов."
 UKR_w_p_olig_patron_battalions:0 "Шефство над частями"
 UKR_w_p_olig_patron_battalions_desc:0 "Холдинги закрепляют за собой отдельные части: снабжение, транспорт, ремонт. Фронт получает больше техники, а владельцы - политический капитал."
 UKR_w_p_nat_nation_council:0 "Совет нации"
 UKR_w_p_nat_nation_council_desc:0 "Идейное руководство мобилизацией: память, язык, ритуалы, образ врага. Националисты задают тон общественному настрою.\n\nФокус доступен только на пути националистов."
 UKR_w_p_nat_volunteer_corps:0 "Добровольческие корпуса"
 UKR_w_p_nat_volunteer_corps_desc:0 "Добровольческие формирования получают официальный статус и снабжение. Боевой дух высок, но контроль над ними вызывает споры и тревожит союзников."
 UKR_wi_martial_law:0 "Военное положение"
 UKR_wi_martial_law_desc:0 "Особый правовой режим военного времени: страна живёт по законам обороны. Люди и ресурсы мобилизуются быстрее, но свободы ограничены, а выборы не проводятся, пока идёт война."
 UKR_wi_stavka:0 "Ставка"
 UKR_wi_stavka_desc:0 "Единый центр военных решений сокращает путь от приказа к исполнению."
 UKR_wi_unified_command:0 "Единое командование"
 UKR_wi_unified_command_desc:0 "Все силы подчинены одному штабу: наступательные операции согласованы, но местные командиры связаны приказами сверху."
 UKR_wi_operational:0 "Операционные командования"
 UKR_wi_operational_desc:0 "Направления фронта ведут собственные командующие: гибкость и живучесть растут, общий план становится сложнее."
 UKR_wi_staff_rhythm:0 "Штабной ритм"
 UKR_wi_staff_rhythm_desc:0 "Опыт первых месяцев превратился в чёткие процедуры: планы готовятся быстрее, приказы доходят точнее."
 UKR_wi_local_initiative:0 "Инициатива на местах"
 UKR_wi_local_initiative_desc:0 "Командиры на направлениях привыкли решать сами: подразделения быстрее учатся и лучше держат позиции."
 UKR_wi_military_pay:0 "Достойное содержание армии"
 UKR_wi_military_pay_desc:0 "Хорошие выплаты бойцам и семьям: люди идут служить охотнее и дольше держатся в строю, но расходы растут каждый месяц."
 UKR_wi_patriotic_wave:0 "Патриотическая волна"
 UKR_wi_patriotic_wave_desc:0 "Лозунги, история и образ врага подняли добровольцев и дух. Такая волна не бывает вечной и требует новых слов."
 UKR_wi_forced_draft:0 "Принудительный призыв"
 UKR_wi_forced_draft_desc:0 "Армия получает людей быстро, но каждая облава у военкомата подрывает доверие к власти."
 UKR_wi_unified_info:0 "Единый информационный эфир"
 UKR_wi_unified_info_desc:0 "Единая картина дня снижает панику и поднимает дух, но свободные голоса слышны всё хуже."
 UKR_wi_open_comms:0 "Открытая коммуникация"
 UKR_wi_open_comms_desc:0 "Честные брифинги и публичный спор укрепляют доверие общества и союзников, хотя дают материал и противнику."
 UKR_wi_relocation:0 "Эвакуированная промышленность"
 UKR_wi_relocation_desc:0 "Заводы переезжают на запад: сначала простой и расходы, потом выпуск там, куда труднее достать."
 UKR_wi_state_order:0 "Государственный оборонный заказ"
 UKR_wi_state_order_desc:0 "Прямые заказы государства дают предсказуемые поставки и понятные сроки."
 UKR_wi_private_contracts:0 "Частные оборонные контракты"
 UKR_wi_private_contracts_desc:0 "Гибкие частные производители быстрее осваивают новое, но государству труднее их контролировать."
 UKR_wi_sky_shield:0 "Щит неба"
 UKR_wi_sky_shield_desc:0 "Новые комплексы ПВО и мобильные группы прикрывают города и энергетику."
 UKR_wi_resilient_grid:0 "Живучая энергосистема"
 UKR_wi_resilient_grid_desc:0 "Распределённая генерация и резервные подстанции: удар по одному узлу уже не гасит город."
 UKR_wi_world_sympathy:0 "Симпатии мира"
 UKR_wi_world_sympathy_desc:0 "Обращения к миру подняли внимание прессы и общественное сочувствие. Это не вечный капитал и со временем остывает."
 UKR_wi_europe_course:0 "Европейский курс"
 UKR_wi_europe_course_desc:0 "Тесная связь с европейскими столицами даёт политический вес, но часть решений приходится согласовывать."
 UKR_wi_self_reliance:0 "Опора на себя"
 UKR_wi_self_reliance_desc:0 "Ставка на отечественное производство: дольше и дороже, но чужие решения не зависят от нас."
 UKR_wi_regional:0 "Региональные договорённости"
 UKR_wi_regional_desc:0 "Общие склады и быстрый обмен данными с соседями облегчают снабжение."
 UKR_wi_drone_surge:0 "Дроновая волна"
 UKR_wi_drone_surge_desc:0 "Массовые беспилотники дают разведку и дешёвый удар на всём фронте."
 UKR_wi_deep_strike:0 "Удары вглубь"
 UKR_wi_deep_strike_desc:0 "Удары за линией фронта ломают логистику врага и поднимают дух, но тревожат европейские столицы."
 UKR_wi_attrition:0 "Оборона на истощение"
 UKR_wi_attrition_desc:0 "Минные поля и рубежи в глубину: враг платит за каждый километр."
 UKR_wi_black_sea:0 "Чёрное море"
 UKR_wi_black_sea_desc:0 "Безэкипажные катера сковывают флот противника и открывают морские пути."
 UKR_wi_pause:0 "Оперативная пауза"
 UKR_wi_pause_desc:0 "Части получили время на пополнение и отдых; организация выше, пополнение быстрее."
 UKR_wi_grid_repair:0 "Ремонтные бригады энергетиков"
 UKR_wi_grid_repair_desc:0 "Бригады уже на местах: свет возвращается быстрее."
 UKR_wi_p_tech_digital_hq:0 "Цифровой штаб"
 UKR_wi_p_tech_digital_hq_desc:0 "Заявки, карты и учёт в одной системе: решения принимаются быстрее."
 UKR_wi_p_tech_drone_command:0 "Командование беспилотных систем"
 UKR_wi_p_tech_drone_command_desc:0 "Отдельный род войск с собственной подготовкой операторов и связью."
 UKR_wi_p_left_labor_front:0 "Трудовой фронт"
 UKR_wi_p_left_labor_front_desc:0 "Профсоюзы и трудовые коллективы помогают тылу: заказы, ремонт, помощь семьям."
 UKR_wi_p_left_people_defense:0 "Народная оборона"
 UKR_wi_p_left_people_defense_desc:0 "Местные отряды самообороны расширяют базу мобилизации."
 UKR_wi_p_olig_business_cabinet:0 "Бизнес в военном кабинете"
 UKR_wi_p_olig_business_cabinet_desc:0 "Собственники в оперативных советах ускоряют решения, но деньги влияют на политику сильнее."
 UKR_wi_p_olig_patron_battalions:0 "Шефство над частями"
 UKR_wi_p_olig_patron_battalions_desc:0 "Холдинги обеспечивают отдельные части снабжением и ремонтом."
 UKR_wi_p_nat_nation_council:0 "Совет нации"
 UKR_wi_p_nat_nation_council_desc:0 "Идейное руководство мобилизацией задаёт тон общественному настрою."
 UKR_wi_p_nat_volunteer_corps:0 "Добровольческие корпуса"
 UKR_wi_p_nat_volunteer_corps_desc:0 "Добровольческие формирования получили статус и снабжение; дух высок, но споров о контроле хватает."
 UKR_wd_operational_pause:0 "Оперативная пауза"
 UKR_wd_operational_pause_desc:0 "Фронту нужно время: пополнить части, сменить уставших, наладить связь. Короткая пауза в активных действиях снижает усталость и поднимает организацию, но противник тоже получает передышку."
 UKR_wd_mobilization_campaign:0 "Мобилизационная кампания"
 UKR_wd_mobilization_campaign_desc:0 "Очередной набор людей. Результат зависит от выбранного способа мобилизации: деньги дают меньше людей, но спокойнее общество; лозунги поднимают дух и ненависть; принуждение даёт больше всего людей и больше всего недовольства."
 UKR_wd_factory_dispersal:0 "Рассредоточение производства"
 UKR_wd_factory_dispersal_desc:0 "Цеха разносят по небольшим площадкам, склады прячут, смены переносят. Каждый налёт теперь ломает меньше, хотя эффективность производства падает."
 UKR_wd_donor_conference:0 "Конференция доноров"
 UKR_wd_donor_conference_desc:0 "Международная встреча, где страны-доноры объявляют взносы и перечисляют, на что они пойдут: бюджет, энергетика, восстановление. Хорошая подготовка и прозрачные отчёты повышают доверие партнёров."
 UKR_wd_drone_batch:0 "Серия дронов"
 UKR_wd_drone_batch_desc:0 "Очередная партия беспилотников из мастерских и заводов уходит на передовую. Дёшево, быстро и каждый раз чуть умнее предыдущей."
 UKR_wd_grid_repair:0 "Ремонтные бригады энергетиков"
 UKR_wd_grid_repair_desc:0 "Бригады с запасом оборудования выезжают сразу после удара и восстанавливают подстанции под обстрелом. Свет возвращается быстрее, а люди видят, что власть работает."
 ukrainewar.810.t:0 "Война пришла в каждый дом"
 ukrainewar.810.d:0 "Утро начинается не с будильника, а с сирены. В подвалах и метро - соседи с детьми и сумками, на трассах - колонны, у банкоматов - тишина. Ещё вчера страна спорила о кабинетах и налогах, сегодня все разговоры о том, где выход и сколько у нас времени.\n\nВ канцеляриях не спят: военное положение, единый штаб, мобилизация и связь с партнёрами решаются в одну неделю. Дальше начинается дерево войны: каждое решение открывает новые возможности, но закрывает другие. Выбирать придётся быстро."
 ukrainewar.810.a:0 "Мы к этому шли. Теперь - работать."
 ukrainewar.811.t:0 "Военное положение"
 ukrainewar.811.d:0 "Парламент проголосовал за военное положение и всеобщую мобилизацию. Указ вводит ограничения на выезд и собрания, запрещает выборы на время войны и передаёт часть полномочий военным администрациям. Это не победа и не поражение, а инструмент: он позволяет государству требовать то, без чего оборона невозможна, и именно поэтому его нельзя растягивать без нужды.\n\nЕдиный штаб собрал армию, Территориальную оборону, пограничников, разведку и гражданскую власть под одной крышей. Теперь вопрос не в том, что делать, а в том, как."
 ukrainewar.811.a:0 "Так нужно."
 ukrainewar.812.t:0 "Война затягивается"
 ukrainewar.812.d:0 "Первые недели позади. Фронт стабилизировался, но стало ясно, что быстрой развязки не будет. Нужны другие инструменты: учить, строить, договариваться, производить. Пора думать не о первых днях, а о первых месяцах и годах.\n\nНа дереве войны открываются фокусы второй ступени."
 ukrainewar.812.a:0 "Готовимся к долгой войне."
