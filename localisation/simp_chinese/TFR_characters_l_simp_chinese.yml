 POLITICS_nicolas_mayer_rossignol_DESC: "虽然他是一位普通的亲欧盟的鲁昂联邦派市长，但迈尔-罗斯尼多先生出人意料地获得了成为诺曼底新独立共和国领导人的提名。\n\n被推入了一个他不相信的权力职位，梅尔-罗斯尼托尔正在高层中不择手段地破坏诺曼的事业。"
