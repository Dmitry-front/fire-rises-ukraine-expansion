 CHI_tsai_ing_wen_char: "蔡英文"
 CHI_tsai_ing_wen_char_desc: "谁也比得上台湾的独身地位。作为中华民国的第一任独立统治者，未婚与女性，她已经克服了无数人对成为政治家和法学学者的偏见。\n\n她在1986年进入政府，但在2000年陈水生成为第一位非国民党的领导人时，她开始了政治。最初，她曾是内地管理委员会的成员，后来在2005年成为立法会兼2006年的副总裁。2008年，她在大选失败后，夺取了民主进步党并带领党入选2010年的地方选举。在她失去了2010年新台北地区分层选举和2012年的总统选举，并辞去了政党领导人的职务。然而，在马英捷皇的欧足党丑闻和向日葵运动之后，共和党重获了动力。她作为领导人回来并赢得了2016年的选举，击败了国民党25点以上。\n\n随后，她提升了台湾人的身份，强化了与日本和美国的关系，并保持了与中国的战略分歧。随着她的支持度在2018度以下的低位之后回升，她将再次进行第二个任期的斗争。"
 CHI_han_kuo_yu_char: "汉国玉"
 CHI_han_kuo_yu_char_desc: "汉国玉，也被称为丹尼尔·汉，通常被描述为“非传统的”，甚至是“民粹主义的”政治家。作为抵抗战争老兵的后裔，他在学术上进行了斗争，劝说他的父母把他送到皇家王室军事学院。在那里，他成为了一个船长，在鲁比克立方块的启发下，决定努力学习大学。\n\n1990年，他成为了台北县的议会代表，在与同事的争吵之后，在1992年获得了声望。同年，他赢得了一个立法席位，但失去了2001年的科米特主任，促使他离开政治，在北京大学学习。他于2017年回到政治舞台，尽管失去了党的领导层，却成为了科米特党的考西翁市长候选人。2018年，他结束了人民党在城里的长期统治，但因他加入2020年总统竞赛而面临反弹，公民们指责他抛弃了高雄。\n\n尽管他对自己的能力有所怀疑，但他赢得了总统任期，并发誓要反对“独立运动”，重振经济，尽管许多人害怕他那极端的、不现实的政策。"
