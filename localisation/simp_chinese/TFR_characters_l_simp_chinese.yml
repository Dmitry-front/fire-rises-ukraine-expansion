 BRA_jair_bolsonaro_char: "贾伊尔·博尔索纳罗"
 BRA_jair_bolsonaro_char_desc: "在一场分裂和有争议的竞选活动后，一名前陆军总司令博尔索纳罗在2019年登上了巴西总统之位。他以激烈的言辞和对法律和秩序的强烈立场而闻名，博尔索纳罗把自己定位为保守价值观和经济自由化的捍卫者，并成为反对过去影响巴西政治的左翼运动的坚强支持者。\n\n博尔索纳罗的统治由他对犯罪的侵略立场、他对私有化和放松政策的承诺，以及他对政治正确性的蔑视而决定。他是一个极化的人物：被那些把他看作是传统价值和民族自豪感的救世主的人所喜爱，并被指责他破坏民主和无视人权的批评家们所厌恶。\n\n博尔索纳罗的政府面临着巨大挑战，包括大规模的抗议，亚马逊地区的森林规模增长，以及对他周围环境政策的批评。\n\n尽管动荡，博尔索纳罗仍然保持着一个强烈忠诚的支持者基础，他们认为他是通过打击腐败，减少政府的干预，并恢复军队在政治中的影响，以恢复巴西的伟大。他的任期为建立更民粹主义的巴西铺平了舞台，勃罗索纳罗经常提高该国过去的军事独裁，这表明他的总统可以为将来更大规模的政治变革铺平道路。"
