 NSM_burt_colucci_char: "布尔特·科卢奇"
 NSM_burt_colucci_char_desc: "2019年3月，布尔特·考路奇从前任领导人杰夫·舒普手中夺取了国家社会主义运动的控制权。在美国崩溃的几个月后，纳粹党在美洲获得了很大的影响力，并在几周内获得了数百新成员国。\n\n随着密歇根当局的垮台，尼西米亚人民党利用了这种情况，获得了密歇根东部的一块区域，以及底特律的一些地区。这使得科路奇成功巩固了尼湿米亚作为美国的一个派系的地位。但是随着尼湿米亚的巩固，尼湿米亚开始分裂，两个主要内部派别也在形成。希特勒党人试图走在纳粹德国的台阶上，而洛克威尔人则试图形成美国版本的法西斯主义。\n\n随着科路奇掌握着尼湿米亚的缰绳并成为希特勒派系的领导人，他决不能让派系分裂他的政党。\n\n直至他彻底毁灭了尼湿米亚的罕见机会。"
