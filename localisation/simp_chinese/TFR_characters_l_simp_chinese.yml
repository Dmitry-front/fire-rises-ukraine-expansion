 ATW_joshua_sutter_char: "约书亚·舒特"
 ATW_joshua_sutter_char_desc: "一个见识过世间最坏情况的孩子，无法对这个世界的失败和现状说清现实。当世界陷入火海之时，他不知道为什么会变成这样。人生并没有教会他什么。他一丝一毫地站在梦境中，以至于这个噩梦终将结束。但直到这一刻，他才停止——直到有一天，他被另一个为毫无意义的道德而挥动双手的人夺走了他的生命。约书亚·萨特尔是一个笼罩在迷茫之中的人，被公众视为九个角度的关键人物，即联邦调查局和极端主义书籍出版商的线人。作为阿杨国家的一次性领导人，萨特尔与极端主义的联系非常广泛。他向朝鲜承诺效忠，经营印度教教派，并创造了圣血五重的圣血，一个“异教”，一个“阿涅格勒斯骑士团的分裂。他对阿托姆瓦芬分裂的影响是不可低估的，因为他们本来就已经暴力地推动着这个组织超越了道德和人性的概念。带领其成员走出不道德的险恶道路后，约书亚作为一名线人时很好地利用了来自联邦调查局的资金，但就像一个护身符一样，他从供求的缝隙中溜了出来，回归了他的命运。帝国为他提供了在背后堵住匕首的手段的讽刺之处，将从他的痛苦中流动的暗能量将抵挡这场大洪水，将一个建立在老旧、多余和折磨的尸体上的新帝国纳入进来的欲望。世间永远的腐烂和痛苦，地狱。"
