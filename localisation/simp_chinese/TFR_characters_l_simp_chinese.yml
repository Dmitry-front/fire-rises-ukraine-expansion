 UKR_honcharuk:0 "奥莱克西·洪恰鲁克"
 UKR_honcharuk_desc:0 "一位年轻的技术官僚，在乌克兰成为了最年轻的首相。一位“人民党的仆从”的代表，致力于经济发展。"
