 ATW_brandon_russell_char: "布兰登·罗素"
 ATW_brandon_russell_char_desc: "长久以来每个人都在疲劳——无论是身体还是精神上都感到疲惫。只要看一看他的眼睛——没有时间可浪费，缰绳上也没有驾驶员。把他赶走，离我们很远。当这个孩子引爆炸弹时，没有人会愿意随时见证它。\n\n布兰登·克林特·罗素生生于1995年，是一个将一生献给国家社会主义事业的人，在18岁时，他出现在了铁游行等在线论坛。受到纳兹主义革命方面的影响，他很快宣布阿托姆瓦芬分裂的成立，一个准军事组织决定全面摧毁目前的全球秩序。利用他在国家卫队中的经历和他研究核物理学的经验，他剔除了团体中被动分子，并意识到胜利的唯一途径是极端的暴力，其产生的是致命的放射性火力。\n\n直到有一天，他因为储存了制造爆炸物的材料而面临存储成本，导致他被关在具体监狱大厅里，他仍被紧紧地关在监狱里，因为他鼓励其他成员继续他们的使命。他当然会被释放出来，但共和国人民党知道，他将继续完成任务。现在，随着合众国被变革的火焰吞噬，他像秃鹫一样俯视着崩溃，准备完成阿托姆瓦芬的使命。\n\n摧毁世界秩序，惩罚腐朽的人，并终结我们所熟知的历史。\n\n\"世界上没有懦夫的空间了……剑已经拔出，没有回头路。\""
 ATW_james_mason_char: "詹姆斯·梅森"
 ATW_james_mason_char_desc: "詹姆斯·诺兰·梅森在五十多年来一直是美国法西斯主义者，可追溯到他在1966年加入乔治·林肯·罗克威尔美国纳粹党的青年势力时。在罗克韦尔被刺杀后，梅森走上了一条越来越激进的道路：他认为洛克韦尔的选举主义已经失败了，而恢复美国白色霸权的唯一方法就是破坏社会稳定，推翻联邦政府。他最大的意识形态影响包括继任的国民党领袖威廉·路德·皮尔斯和邪教领袖查尔斯·曼森。\n\n2002年佩尔斯逝世后，梅森成为美国领先的新主义思想家。他的《西斯》通讯的著作集在极右侧的地下，严重影响了后来被称为阿托姆瓦芬的奥秘游击队恐怖组织网络。由于美国政府的忠诚四分五裂，其执行破碎命令的能力在美国的南部拔地而起，并邀请他们最伟大的灵感作为其领导人。虽然他只指挥了少数狂热战士，但石匠和他的扭曲种族乌托邦更接近于现实。许多人担心如果他能拥有一座大型城市，更不用说一座核武库了。"
