 GER_frankwalter_steinmeir: "弗兰克-瓦尔特·斯坦迈尔"
 GER_STEINMEIR_DESC: "自2017年以来，弗兰克-沃尔特·斯坦迈尔一直是德国总统，并拥有多年政治经验来担当这一角色。作为社会民主党的成员，他在很长一段时间里都致力于维护民主和自由的价值观。\n\n他在德托莫尔德出生于“56年”，因为他学习法律和政治科学，最终在法律方面获得了博士学位。他在20世纪90年代作为乔治哈德·施勒德的顾问开始了他的漫长的政治生涯，首先是在下萨克森州，后来在柏林，他后来成为了总理，帮助了2010年议程的福祉和劳动改革。\n\n他在德国总理安吉拉·默克尔的领导下担任了两次外交部长，领导了与俄罗斯、伊朗及欧盟等主要国家的各种谈判。他还担任副总理，并领导联邦议会的反对派。\n\n施泰因迈尔曾利用自己的职位来捍卫自由民主。他虽然不是一个有头脑的人，但他被称为德国人的家喻户晓。"
 GER_EUROCOMMISSION_DESC: "《柏林宪法条约》；爵位六、三，第174条：\n“委员会是联邦的最高统治和统治权威。委员会有七位成员。在每次大选后，委员会委员由议会选举产生……任期为四年。行政权力的基础是从国会中赢得民主权威。”\n\n欧盟的梦想几乎在沉默中死亡。当俄国的坦克翻过欧洲平原，导弹划破天空时，欧洲联盟已经处于完全崩溃的边缘。但从战争的毁灭中，一个新的秩序已经出现。\n\n没有一位州或政府领导欧洲，没有强人发表演讲或指挥军队。相反，它被欧盟委员会集体管理，一个负责捍卫联盟理想的超国家机构，现在比以往任何时候都更加强大。委员会与整个联盟在国家主权和雄心上一直保持着狭窄的分歧，自里斯本条约最初建立以来，委员会就一直以来。批评家们将其称为不可靠的，一种全球主义的冷酷引擎。支持者们认为它是一个可以独立存在的欧洲人中，最大的希望。\n\n现在，随着欧洲抛弃了国家元首，将自己置于布鲁塞尔的完全支配之下，欧盟委员会发现自己正处在未知的土地上。随着机构集权以及委员会权力大范围扩大，它已不再是一个小机构。它实际上是由两亿多公民组成的实际政府。\n\n这场实验不是由任何一个男人或女人领导，而是由一种制度领导。它可能是这种制度的最后一种。如果它再次落入俄罗斯人手中，欧洲将再次分裂。也许这是最后一次了。"
 GER_FEHLINGER_DESC: "Gunther Fehlinger-Jahn建立起了一个人都无法预料的职业生涯。他生于1968年，注定要领导奥地利的传统生活：体操教育，奥地利联邦海尔的副手，以及近十年前的维也纳经济大学。但费赫林格从未满足于停留在常规生活中。在马斯特里希特陷入混乱的岁月后，他将越来越多的精力投入到自由民主的宏大理想中。\n\n在一个领导人通过学院崛起的时代，费赫林格通过他不渗透的表达和对一个由北约领导的强大和统一的欧洲的坚定信仰秘密地建立了自己的权力。作为北约各个宣传委员会和巴尔干整合组织的主席，他孜孜不倦地捍卫联盟的扩张，并时不时地警告欧洲人与俄罗斯人战斗到底。然而，费赫林格由于在社交媒体上的臭名昭著闻闻闻名于世。他经常被剪辑，发行出火热的公告，半份外交备忘录，一半是一片弥漫的情调。有些人认为他是一个有远见的，另一些则是一位妄想的曲子。\n\n然而，历史最终将证明费赫林格是对的。\n\n当梅德韦杰夫的军队开进东欧时，欧陆和整个世界都盼望着布鲁塞尔的领导权，却发现他们优柔寡断。在这种真空中，费林格尔不再是一个政治家，而是一个自由欧洲的领导者。他多年来一直在警告过这一时刻。这个疯子现在是军事家了。费林格尔将布鲁塞尔变成了一个反俄罗斯的革命堡垒，发誓解放东方，并拆解了俄罗斯国家本身。他不承诺欧洲的和平，承诺战争和胜利。\n\n对他来说，这场战争是民主与暴政之间的终局。"
 GER_SCHWAB_DESC: "出生于1938年的符腾堡，克劳斯·施瓦布是一位在纳粹战争机器中纠缠不休的瑞士实业家之子。他早期的教育分为特里希里希的宁静和战后德国的残垣断壁。他的学术经验准确而深思熟虑。到20世纪60年代，他在工程学和经济学方面都获得了博士学位，而且是来自哈佛的大师，在那里他被亨利·基斯林格所教导。施瓦布开始了日内瓦的商业政策教学，但他的真正遗产将在1971年兴起，他成立了欧洲管理论坛，这是一个每年由亿万富翁、技术官僚和世界领导人聚集在一起讨论未来的峰会。它后来演变成现在以铁腕统治欧洲的组织。\n\n施瓦布于1971年创立了世界经济论坛，以一种独特的任务：培养能够“改变全球、区域和工业议程”的思想。几十年来，他一直在玩了一场漫长的游戏：安静的会议，召集了聚会，无数关于国家和市场融合的白色文件。大多数人认为他是一个无害的分身。愚者们。\n\n克劳斯·施瓦布的一生在首相和总统的耳边低语，但他最终还是摆脱了阴影。委员会邀请WEF技术人士执掌大权，施瓦布为他的毕生工作提供了结点：根据2040年议程和第四次工业革命，欧洲将会重建，而非人类，而是为了施瓦布坚持要成为人类。现在只剩下一个问题：\n\n你准备好了吗？"
 GER_BYUNG_CHUL_HAN_DESC: "众所周知，北汉是一位文化理论家和哲学家。他批评新自由主义和资本对整个人类社会的影响广为人知。\n\n汉写了三十多本书，所有这些都在以各种方式破坏现代生活，他对透明社会的极权性的感觉已成为新自由市场力量中的力量的一种工具，打破了其他任何社会规范，自愿开放被崇拜。\n\n随着死亡联系的失败和资本的不断下降，毫无疑问，人们会寻找替代方案，不一定会相反地走上政治道路。\n\n汉从未对自己的个人生活敞开心扉，他最近改变了职业生涯，但似乎没有改变，德国和他的共同哲学家和专家的领导，毫无疑问，不断的变化是不可避免的。\n自毁、压力暴露，对资本的热情将变成过去式，过去的人永远不会想回到现在。\n\n巨大的疲劳已经结束，生命的时代已经结束了。"
 GER_ARMSTROFF_DESC: "克劳斯·彼得罗夫于1957年出生于前东德。德意志统一后，他在莱茵兰-帕拉蒂纳特文州的威顿哈尔定居了一段时间。他作为电工工作了一段时间，但却屈服于一个激进的、极右翼的思维，认为他有许多同胞当时正在经历的经历。因此，他加入了国民党，从2009年开始，他担任了巴德·迪克海姆地区议会的成员，并在国民党莱茵兰-帕拉蒂纳特的国务板中发挥了领导作用。然而，他逐渐开始憎恨政党已经成长起来的内部和意识形态争端。因此，2013年他放弃了国民党，组建了自己的政党。德尔三世。韦格，一个对社会主义思想持更开放的政党，接受了国家革命立场，延续了奥斯特拉斯特瑟的遗产。\n\n他所在的政党将享有有限的成功，至少在欧洲战争蹂躏欧洲大陆之前，迫使东欧的人民再次遵循共产主义。因此，当公众对政府的信心瓦解时，军方强硬派发动政变。然而，他们很快发现了他们的目标，除了对共产主义的仇恨之外，他们非常分裂。他和他的政党在这场混乱中成为统一军政府的一个强烈声音。因此，他们把他提升到联邦总理的位置。\n\n现在他已经完全控制了德国，他对一个好战、反资本主义、四分五裂的德国的愿景只是时间问题。每个时间问题在于他的改革将如何长远进行，以及克里姆林宫将如何看待他们。"
 GER_BUNDESTAG_DESC: "这是我们历史上第一次刺杀联邦议会的总统。正因如此，我们选择的程序遵循格鲁恩德·萨尔福特的第五十七条，而后者将被移交给德国联邦议会。目前来说，该机构将集体恢复德国的秩序，并在联邦定罪30天内准备进行总统紧急选举。\n\n然而，在我们已经两极分化的社会下，没人希望联邦议会在这一时刻做很多事情。只要尽其所能，就能够促进本已激进化人口的稳定。然而，议会内部的斗争使这项任务变得更加困难，再加上似乎没有德国政治家得到来自普通民众的任何支持。\n\n我们所能做的只是为这些选举做准备，但随着全国的骚乱，我们的军队拒绝服从我们的命令，这些审判不会容易。"
 GER_FRANZ_DESC: "出生于1978年的塞尔克林根，即当时的西德，法兰克·弗朗茨是在德国的一个政治分裂和经济不确定性所标志的重新统一的德国中长大的。在这个时代，一些德国人转向了激进运动，促进了现政府“更好的替代方案”。弗朗茨也不例外。他在2000年代初加入了国家民主党，后来在其衰退时崛起并领导该党。凭借能以更显著的方式重新确立极端主义的天赋，弗兰兹推崇了一种新的政治形象，其植根于传统主义、秩序和文化复兴。\n\n尽管在公众中并不流行，但弗兰茨仍然在极右翼活动，在军事与民族主义群体中悄悄地建立了联系。在欧洲战争结束后不久，他就看到了他胜利的时刻。北约在欧东欧控制苏联前进的失败导致疲惫民众大规模失望。因此，他们转向了更激进的思想。\n\n联邦议会陷入混乱后不久，军队就指责柏林的优柔寡断和软弱，发动了一场迅速的政变。他们希望恢复主权和力量，转而支持弗朗茨，他被许多人视为团结和决心的形象。由准军事和绝望的公众支持，他被任命为紧急强权的首相。现在，弗兰兹完全控制住了他的霸权。他选择与欧洲各地的类似运动结盟，还是转向过去取决于他的意志。"
 GER_HEINRICH_DESC: "尽管自古以来，德国的君主制曾是德国不可分割的一部分，但实际上在上个世纪中，德国贵族对国家没有任何影响。但是海因里希十三亲王正计划结束这一现实。海因里希在1951年出生于瑞斯家族，并深受德意志帝国历史的重崇。他敬佩自己的高尚头衔，因此越来越不信任德国的民主体制。作为在90年代期的成功商人，海因里希从公众视线中退出，转而投身君主主义圈子和阴谋主义运动。到2020年，他已经成为德国地下贵族的中心人物，把自己视为德意志由上帝钦定的国家元首，德国一直遵循着其历史上的大部分历史。\n\n随着北约在与复兴的苏联的惨烈战争中解体，德国陷入了危机。俄罗斯在东欧的胜利、经济动荡和难民潮摧毁了公众对政府的信心。在混乱中，军事强硬派发动了政变，驱逐了柏林的民间领导人。\n\n德国渴望一个具有历史合法性的统一的元首，海因里希十三世成为了国家的领导人。尽管备受争议，他高贵的世系以及全国复兴的呼声仍然与公众的不安发生共鸣。不久后，垂死的共和国瓦解了。德意志重回了帝国的根基。德意志恢复了往昔的帝国根基，另一世界残存的君主也为之相伴，组建了一场盛大的加冕仪式。许多人对这一行为在德国或许意味着什么——但军政府的领导人尚在残存之际，与苏联人的战争似乎已无可避免，只不过美感已经改变了。"
 GER_OTTE_DESC: "马克思·奥特并非普通的政治人物。这位出生于1964年的60岁的经济学家和精明的分析师，在德国的政治格局中，踏上了一条汹涌而迷人的道路。尽管他在官位上是德国民主联盟的一员，但他的观点却大幅向右倾斜。\n\n奥特利用他巨大的金融影响力，通过对冲基金和私人交易构建起来，反复在意识形态和物质上向阿法德独立运动提供支持。他的那些大师们杰出的书籍预言了2008年的金融崩溃，巩固了他作为经济崩溃预言者的声誉。\n\n在移民危机的背景下，美国动荡和与俄罗斯的紧张局势加剧的情况下，奥特在选举中成为了“黑马”候选人。在这种不确定的时刻，德国可能正需要这样的人物来恢复稳定和希望。"
 GER_DIETMAR_DESC: "与那些主导全球政治的老一辈相比，巴尔茨奇显得愈发年轻。就如同他们一样，他从不缺少对全球化和军国主义的偏见。\n\n出生于国民民主联盟，并且仍然忠于其许多原则——尽管在现代时过境迁——巴尔茨奇曾是社会主义报纸的编辑，甚至曾接受过莫斯科全国联盟下社会科学院的培训。\n\n作为一名经典的左翼政治家，他强烈反对全球化和军国主义。然而，正如臭名昭著的“拉福德雷案”所表明，他也并不在合适的时机放弃借用权的策略。由于一些神秘和矛盾，巴尔茨奇继续默默地运作——并且没有了改变路线的迹象。"
