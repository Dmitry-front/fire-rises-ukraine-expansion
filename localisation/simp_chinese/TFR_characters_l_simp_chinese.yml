 UKR_shmyhal_desc:0 "作为首相，德尼斯·史密哈尔是一位执行务实改革政策的经验丰富的行政官员。"
 UKR_razumkov:0 "德米特罗·拉齐乌科夫"
 UKR_razumkov_desc:0 "乌克兰政治中的重要人物——“人民党的党员”之一，最高拉达议长。"
 UKR_marchenko:0 "谢尔希伊·马尔申科"
 UKR_marchenko_desc:0 "财政部长，主张在危机期间保持财政平衡和经济稳定。"
 UKR_mylovanov:0 "蒂莫菲·米洛瓦诺夫"
 UKR_mylovanov_desc:0 "专业的经济学家和改革家，自由经济思想的拥护者和行政变革。"
 UKR_arakhamia:0 "戴维·阿拉汉米亚"
 UKR_arakhamia_desc:0 "议会内的“人民派的仆从”领袖，乌克兰经济数字化的支持者。"
 UKR_prystaiko:0 "白晶瓦迪姆·普瑞斯塔伊科"
 UKR_prystaiko_desc:0 "经验丰富的外交官，正致力于为乌克兰推行平衡的外交政策。"
 UKR_kuleba:0 "德米特罗·库列巴"
 UKR_kuleba_desc:0 "年轻而精力充沛的外交部长，主张乌克兰整合进西方国家架构。"
 UKR_avakov:0 "阿尔森·阿瓦科夫"
 UKR_avakov_desc:0 "长期在泽伦斯基新政府内维持立场的内务部长，是个沉重的政治人物。"
