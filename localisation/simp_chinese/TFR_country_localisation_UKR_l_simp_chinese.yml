 UKR_request_nato_partnership:0 "请求与北约合作"
 UKR_special_military_operation:0 "乌克兰武装部队"
 UKR_special_military_operation_desc:0 "乌克兰军队的建立基于苏联的军事体系，为了适应现代的挑战，他们进行了大规模的改革。职业部队的建立，情报能力的提高，先进技术的落实。乌克兰军队正在演变成一支独立和高效的部队，不仅能够保卫国家主权，还可以在21世纪制定新的战争标准。"
 UKR_novorossiyan_offensive_decision:0 "新罗斯攻势"
 UKR_novorossiyan_offensive_decision_desc:0 "收回东乌克兰领土战略行动"
 UKR_first_mobilization_wave:0 "第一动员浪潮"
 UKR_first_mobilization_wave_desc:0 "优先动员行动，旨在紧急配置乌克兰武装部队的人员。动员行动包括了A1和A2类征兵士兵和预备役。动员行动规定在战区征募最多10万士兵，并随后超时三个月的超时训练。"
 UKR_second_mobilization_wave:0 "第二次动员浪潮"
 UKR_second_mobilization_wave_desc:0 "第二次战略动员活动着眼于观察战况，将乌克兰武装部队的工作人员配置到人员中。其组织包括B1和B2等兵种的征募与后备兵，并特别关注训练装甲部队、炮兵与防空部队的专家。其动员计划计划计划计划计划征募多达125，000名现役军人，在现实战区开展强化训练。"
 UKR_third_mobilization_wave:0 "三局动员浪潮"
 UKR_third_mobilization_wave_desc:0 "在对抗时期大规模的征兵的最后阶段。动员包括C1和C2等兵种的征召兵和预备役员，包括受过军事训练的老年龄组的公民和出身有限的专家。"
 UKR_political_decisions:0 "政治决策"
 UKR_political_decisions_desc:0 "2020年已经成为乌克兰的审判与机遇的时期。\n\n国内政策的特点在于正在进行中的打击腐败斗争，以及需要进行改革以加强民主体制。\n\n在该国东部，由于正在进行的冲突，紧张局势持续存在。\n\n外交政策旨在加深与欧洲联盟和北约的融合，以及寻求国际社会的支持以解决冲突并确保乌克兰的领土完整。\n\n战略形势需要加强国家的防御能力，并找到和平解决冲突的方法。"
 UKR_establish_border_defense_system_desc:0 "在局势日益紧张的情况下，有必要增强国家的防线以保护我们的边境。"
 UKR_appeal_to_un_security_council_desc:0 "国际社会必须意识到乌克兰所面临的侵犯和威胁。我们必须呼吁联合国安全理事会给予支持。"
 UKR_request_nato_partnership_desc:0 "为了确保我国的安全，有必要深化与北约的合作并渴望加入这一联盟。"
 political_pressure:0 "政治压力"
 political_pressure_desc:0 "国际社会对乌克兰施压。"
 diplomatic_support:0 "外交支持"
 diplomatic_support_desc:0 "乌克兰得到外交支持。"
 hostile_status:0 "敌对状态"
 hostile_status_desc:0 "对乌克兰的态度是敌意。"
 military_cooperation:0 "军事合作"
 military_cooperation_desc:0 "与乌克兰的军事合作。"
 ukraine_category_name:0 "乌克兰外交政策"
 ukraine_influence_belarus:0 "影响白俄罗斯"
 ukraine_influence_belarus_desc:0 "乌克兰官员通过非正式渠道与他们的白俄罗斯同行建立了谨慎的联系。友好的会面，外交的接待，以及在国际峰会上流露的风度和礼貌的微笑中，都充满了暗示、问题和提议。“选择权往往在你，但以多种形式实现稳定”是双方的信息。虽然没有做出承诺，但信号却十分明确。"
 UKR_startup_ecosystem_category:0 "乌克兰启动生态系统"
 UKR_startup_ecosystem_category_desc:0 "沃罗迪米尔·泽伦斯基在2019年当选总统后，乌克兰政府采取了向向向积极寻求支持的信息技术部门和科技创业项目的方向。“狄亚市”概念和其他举措旨在为技术企业创造一个有利的条件。根据国家信息技术协会（国家IT协会）的说法，到2019年，乌克兰的信息技术产业年增长率为20-25%，提供国家GDP的4%以上，并且是第三大出口行业，其收入约为450亿美元。泽伦斯基政府致力于将乌克兰改造为东欧最大的技术中心，到2025年，信息技术在GDP中的份额上升到10%。"
 UKR_startup_support:0 "启动支援计划"
 UKR_startup_support_desc:0 "泽伦斯基总统的行政部门制定了一个支持乌克兰技术创业的全面计划。2000年“人民党的仆人”执政后，政府由奥莱克西·本沙鲁克组建，后来在达尼斯·沙米哈尔统治下，通过了国家数字转型战略。作为“40天商业”计划的一部分，加快企业注册程序并简化了获取许可程序。在米哈伊洛·费多罗夫的领导下，数字变革部的创立是实施乌克兰旨在创建繁荣创新生态系统和经济多元化的数字战略的关键一步。"
 UKR_national_startup_fund:0 "乌克兰启动基金创建"
 UKR_national_startup_fund_desc:0 "乌克兰启动资金是乌克兰内阁在2000年7月12日第740号决议中设立的乌克兰启动资金，其初步预算为4.4亿格里夫尼亚人（大约为1800万美元）。该基金的任务是通过一个透明的选择过程，为技术开办提供早期阶段资金。美国家庭在预先筛选阶段提供赠款，并在启动阶段提供5万美元，此时提供总额多达75万美元的资金。到2020年底，美国基金会为约200万美元，以及超过2200的项目，共资助了80多家启动项目。政府预计到2025年，由美国家庭支持的启动项目将创造超过10，000个高薪岗位，并吸引了至少1亿美元的外国投资进入乌克兰经济。"
 UKR_diia_city_initiative:0 "实施迪亚市特别法律制度"
 UKR_diia_city_initiative_desc:0 "第迪亚市是IT产业的特殊法律制度，由数码转化部制定，并于2021年被全国拉达公司采用（第4303号与第5376号）。这一体制为乌克兰的科技公司提供了前所未有的税收条件和法律保护。不同于18％的标准企业税，迪亚市常驻公司只按分配利润缴纳5％的税。对于雇员，其所得税降低了5%（而非标准工资），其统一社会贡献则由最低工资而非实际工资来计算。在现政权下引入的Gig合同提供了灵活的就业条件，结合了就业和私人创业的好处。作为迪亚市的常住者，公司必须有至少9名平均工资不低于1 200欧元的雇员。根据数字转型部的估计，到205年，2 000多家公司将成为迪亚市的居民，乌克兰的信息技术出口将达到165亿美元。"
 UKR_fund_invest_in_education:0 "技术教育投资"
 UKR_fund_invest_in_education_desc:0 "乌克兰政府与主要大学（ITor Sikorsky KPI，V.N. KALNU，Ivan Franko LNU，Lviv 理工大学）合作，启动了一项将技术教育现代化的方案。作为这项计划的一部分，乌克兰教育和科学部拨款250多亿小时来更新课程设置，建立创新实验室，与技术公司建立实用实习方案。“IT创意”计划已经出台，提供双重教育，供学生在大学学习，并从事信息技术公司工作。在与EMP、SoftSerpe，GlobalLogic公司和其他IT公司合作下，在大学内建立了50多个联合实验室。据政府称，从2020年至2012年，信息学院毕业生的数量应该增加35%，每年达到2万人，这有助于满足不断增长的专家需求，估计乌克兰信息技术部门每年有30万至40万个新岗位。"
 UKR_create_innovation_parks:0 "建立地区创新园"
 UKR_create_innovation_parks_desc:0 "继美国国家技术银行（UIT）成功建立且拥有25公顷土地，投资额超过1.5亿美元的基辅城市创新园区之后，乌克兰政府发起了一项计划，在该国主要城市建设更多的创新园区。液沃科技中心正在液存地上建设，其区划为1.8公顷，投资额超过9.5亿美元，位于哈尔基夫地区，位于拥有150公顷土地的哈基夫拖车厂区的 Arukolis KhTZ，并计划投资最多10亿美元，位于五公顷的“奥代萨”创新园。创新园区为科技公司提供了办公空间、研究实验室、启动加速器以及服务设施。根据2025年“创新国家”政策，全国范围内应至少有8个成熟的开发园区，这将为超过70，000名专家提供岗位，并吸引超过20亿美元的投资。"
 UKR_international_tech_partnerships:0 "国际技术伙伴关系的建立"
 UKR_international_tech_partnerships_desc:0 "乌克兰外交部和数字变革部正在积极同美国、英国、德国以及其他欧盟国家的主要科技生态系统建立合作关系。2019-2021年，乌克兰全球创新基金与美国锡里肯谷地（美国）、英国科技城（英国）、英国站（法国）和数字中心倡议（德国）签署了合作协议。在《欧陆四国计划》框架内，开展了统一乌克兰与欧盟数字市场的工作，资金超过1100万欧元。乌克兰全球创新基金已经创建，资本化了1亿美元，用于与国际冒险基金共同投资。根据乌克兰风险资本协会提供的国际合作，对乌克兰科技公司的投资量从2019年的3.36亿美元增加到了2020年的3亿多亿美元。到2025年，政府计划每年将这笔资金增加到15亿美元。这些伙伴关系为知识交流、投资机会以及乌克兰技术公司的国际市场提供了帮助。"
 UKR_diia_city_benefits:0 "迪亚城的收益"
 UKR_diia_city_benefits_desc:0 "在狄亚城市法律制度登记的公司将得到丰厚的税收：5％的分配利润税，而非18％的标准企业税；5％的雇员个人所得税减少（而不是18％），并且简化了劳动条例。该制度旨在吸引国内外的技术投资。根据数字改造部的说法，资讯公司的平均税收减幅为40％。采用了新的保护知识产权和投资的工具，包括职工股票选项计划（ESOPs），保护版权保护的保障，以及保密信息。狄亚城市法律制度提供了特殊的公司管理机制，包括根据英国法律缔结公司协议的可能性。根据专家预测，由于这些优势，乌克兰的IT专家人数将从20万增加到45万，并且乌克兰的IT出口将增加35万倍。"
 UKR_improved_tech_education:0 "改进技术教育"
 UKR_improved_tech_education_desc:0 "乌克兰大学的技术教育现代化正在催生新一代合格软件开发人员、工程师和技术企业家，支持国家创新经济的增长。在大学和知名技术公司之间，共创了超过30个联合教育项目。每年有超过100个黑客莫测和技术竞赛举办，资金总额超过500万格里维尼亚人。全国的信息技术教育平台已经启动，免费在线课程到2022年，超过50万乌克兰人。根据IT乌克兰协会的研究，由于全面的教育倡议，信息技术部门的平均工资增加了15-200%，并且每月达到2，500-3000美元，比国家平均工资高5-6倍。改良的技术教育还刺激了国际公司研发中心出现：从201921年，超过20家公司，包括亚马逊，维伯里，环(亚马逊)、9.普等，以及其他公司，在乌克兰建立了此类中心。"
 unlock_decision_tooltip:0 "解锁建设乌克兰启动生态系统的决议。"
 UKR_startup_ecosystem_help:0 "这些决议允许你通过战略投资和政策改革来加强乌克兰的技术部门"
 UKR_anti_corruption_campaign:0 "开展反腐败运动"
 UKR_anti_corruption_campaign_desc:0 "在实施“人民服务者”计划后，我国政府必须打击困扰乌克兰数十年的本土腐败。我们将从爱沙尼亚和格鲁吉亚的成功模式中汲取灵感，实施一套综合性战略，致力于在政府、公共服务数字化和加强反腐败机构方面实现透明。根据世界银行的研究，通过电子政务来减少腐败的机会在转型经济中被证明是有效的，在某些部门中，贿赂事件的发生率将降低70%。虽然该运动需要大量政治资本，但却是迈向有意义改革的第一步。"
 UKR_establish_high_anticorruption_court:0 "建立高腐化法院"
 UKR_establish_high_anticorruption_court_desc:0 "为了巩固我们的反腐败改革，我们需要建立一个独立的高反腐败法庭，拥有对腐败案件拥有特别的管辖权。来自印度尼西亚和斯洛伐克等国家的国际经验表明，在妥善实施和隔绝政治压力时，专业反腐败法庭将显著提高定罪率，缩短案件处理时间。五大反贪资源中心的研究显示，在法官进行了严格审查并从抵制贿赂中获得竞争性补偿时，这种法庭最为成功。虽然设立该机构将暂时削弱我们的政治资源，但它将建立持久的问责机制，并向国内和国际利益攸关方发出一个强烈信号，即乌克兰忠于法治。"
 diplomatic_treaty_ukr:0 "外交协议"
 diplomatic_treaty_ukr_desc:0 "这项条约强化了两国间的关系，促进了双边关系的发展。"
 UKR_path_to_new_ukraine:0 "新乌克兰之路"
 UKR_path_to_new_ukraine_desc:0 "在泽伦斯基总统的领导下，乌克兰经历了数十年的不确定性和外部威胁之后，它站在了历史变革的门槛上。经济改革的成功使我们可以确定国家发展的关键推动因素。我们必须实现我们经济的现代化，确保能源安全，加强防御能力，并振兴民族精神。我们的国家复兴战略将影响该国生活的各个方面——从能源、工业到教育和文化。只有一个强大、独立、繁荣的乌克兰，才能在国际关系中拥有成熟的声音，并确保下一代公民有一个体面的未来。"
 UKR_new_path_tooltip:0 "为乌克兰在以下三个关键领域的全面发展开辟机会：能源安全、军队现代化和国家复兴。"
 UKR_chernobyl_legacy:0 "切尔诺贝利的遗产"
 UKR_chernobyl_legacy_desc:0 "1986年的切尔诺贝利灾难在乌克兰乃至整个世界的历史上留下了不可磨灭的印记。在摧毁的第四动力单元（一种耗费了20亿欧元的庞大工程项目）的加成（“圣约”）中建成后，我们可以在接下来的100年当中封印这个反应堆，并防止放射性物质释放到环境中。这个独一无二的结构，高度110英尺，重量为36000吨，与国际合作伙伴合作建成，是世界上最大的可移动土地结构。“圣约”不仅解决了排斥区的环境问题，也表明乌克兰有能力执行规模世界级的技术复杂项目。通过继续在这一领域开展国际合作，我们不仅将保障未来世代的排斥区的安全，同时也将成为全球核能安全专家，为进一步安全发展核能开辟道路。"
 UKR_modernize_nuclear_facilities:0 "核电站现代化"
 UKR_modernize_nuclear_facilities_desc:0 "核能是乌克兰能量平衡的一半以上。4座拥有15个电力单位且总能力超过13的全球西部的核电厂（扎波里热、里文、南乌克兰和赫梅尔尼茨基）的4座核电厂是国家安全的战略目标。大规模现代化进程包括按照原子能机构的标准安装现代安全系统，更新自动化和控制设备，取代过时的系统及部件，以及延长电力单位的运行寿命。我们特别重视开发新的核能技术以减少对进口物资的依赖以及提高其经济效益。这一现代化还提出了实施现代乏核燃料储存系统以及解决放射性废料问题的条件。2030年，我们的核电厂不仅应当满足严格的国际安全及效率标准，不仅应该延长其服役寿命，还要显著提高其生产力和可靠性。"
 UKR_energy_independence:0 "实现能源独立"
 UKR_energy_independence_desc:0 "几十年来，能源依赖一直是乌克兰的阿喀琉斯的脚步，使我们在政治和经济压力面前变得脆弱不堪。今天，我们终于能够确保完全的能源独立。我们的战略包括开发合成燃料，建造用于核能氢生产的工厂，以及完全抛弃俄罗斯的能源进口。气运系统现代化，开发可再生能源，建立封闭的燃料生产周期，都将将乌克兰从邻国的能源政策中解放出来，转变为能够向欧盟出口盈余能源的完全自给自足的国家。引进最新的节能技术和智能电网将显著提高我国工业企业的效率，减少资源消耗，并增强国家的经济主权。这不仅仅是一个经济问题——这需要国家安全和主权，将决定我国未来几十年的发展。"
 UKR_energy_self_sufficiency:0 "能源自给自足"
 UKR_factory_efficiency_increase:0 "由于能源供应稳定以及采用新的节能技术，生产效率显著提高。"
 UKR_military_adaptability:0 "军事适应性"
 UKR_military_adaptability_desc:0 "乌克兰专注于发展军事工程、修理能力和使武器适应现代现实。在缺乏补给和资源的条件下，快速修复受损装备的能力、过时装备的现代化以及有效使用缴获的武器起着至关重要的作用。我们正在扩大维修基地网络，并建立能在难以应对的战斗条件下进行现场维修的移动维修部队。此外，我国正在改革军事教育系统，以便为身经百战的机械学、电子学和弹道学高度合格专家提供培训。现代技术和创新工程解决方案将减少对进口的依赖，增加作战能力，并增强国家的防御潜力。"
 UKR_military_adaptability_idea:0 "军事适应"
 UKR_military_adaptability_tooltip:0 "乌克兰的国防工业和工程单位着眼于装备的改造、现代化和复原。有经验的工程师和技术人员确保装备的转化和修理速度，减少了对外部补给的依赖。教育方案和人员培训促进了军事专业技术的发展，提高了战地维修和后勤的效率。灵活性和技术适应允许使用被俘和过时的武器，发挥最大的效率，确保军队在有限的资源下的可持续性。"
 UKR_military_industrial_complex:0 "军工复合体"
 UKR_military_industrial_complex_desc:0 "乌克兰的国防工业从苏联时代继承了巨大的潜力，并且能够为军队提供国产的现代化武器。国家关心的有“乌克罗博龙普拉姆”——这个企业联合在5个主要工业部门中，已经准备好建立现代武器和军事装备的序列生产。优先领域包括：生产拥有强化防护和强大125毫米火炮的“欧普洛特”坦克、BTR-4型“帕鲁斯”作战模块、现代化的“韦尔巴”和“维利亚”MLRS，其射程和准确度都有提高，“斯图尼亚-P”和“哥萨”反坦克系统能够击败现代装甲车以及用于多种目的的无人驾驶系统。\n\n训练和维修120辆现代坦克，之后将之转移到乌克兰武装部队，将是我国装甲部队完全再武装的第一步。高度精度弹药的开发和生产将受到特别关注。"
 UKR_unique_tank_mods:0 "解锁独特的乌克兰装甲现代化技术，包括“刀”主动防护系统、新一代动态保护复合体、现代观光综合体以及火控系统。"
 UKR_special_forces_equipment:0 "特种作战装备"
 UKR_special_forces_equipment_desc:0 "现代战争需要现代的解决方案。乌克兰特种作战部队应该成为一个精英、非常有效的保护国土内外国家利益的工具。装备计划包括购买和发展无人机和地面侦察系统的现代化通讯设备，拥有多种级别的加密、为各种战术任务配备的高度精确的狙击手系统，特种作战使用的非致命武器，以及根据北约标准提供的个人士兵装备。此计划特别关注情报国的发展，包括特工工作、无线电拦截和网络作战的专家训练，以及提高反间谍行动与反恐技能。我们的特种作战部队将不仅成为乌克兰军队的精锐，同时也是保证在复杂地缘政治条件下国家安全的强大工具。"
 UKR_decommunization:0 "消除共产主义"
 UKR_decommunization_desc:0 "苏联的遗产长久以来都阻碍着乌克兰国家的发展。去共化过程是清洗国家记忆和清除后苏联综合体的一个痛苦而必要的阶段。一整套去共产主义法律为禁止共产主义和纳粹主义符号和宣传提供了条件，开放了苏联特殊事业的档案馆（尤其是前辈们），重新命名了以共产主义人物命名的定居点、街道和广场，拆除了苏联形象的纪念碑，并为乌克兰的英雄树立了新的纪念碑。全国上千的列宁纪念碑和其他共产主义形象被拆解，数百个定居点被重新命名（例如，德尼普罗佩特洛夫斯克成为第聂伯罗，吉罗沃伊拉德成为克罗夫斯基）和数千条街道。尽管公众支持度暂时下降，可能的冲突也可能会发生，特别是在亲苏主义情绪强大的东部和南部地区，这些措施对于建立一个摆脱极权主义过去而独立的新的乌克兰身份，是必要的。去共产主义政策的目标就是彻底摧毁极权主义的残余——从象征性的层面上到改变大众意识。"
 UKR_decommunization_decisions:0 "打开“灭世”类决策，可用具体措施消除苏联留下的遗产、重命名对象并更新历史记忆"
 ukraine.1000.t:0 "乌克兰的去共产主义"
 ukraine.1000.d:0 "自从在1991年获得独立以来，乌克兰的政治精英和知识精英一直试图界定其历史叙事与苏联的历史分界线。尽管如此，苏联的遗产仍然深深植根于公共空间、教育系统和历史记忆之中。致苏联的纪念碑仍然位于城市广场、街道和整个定居点上，上面写着共产主义领导人的名字，历史教科书则保留了过时的对事件的描述。\n\n共产主义代表了对苏联历史时期的批判性重新审视，将其象征性的存在从公共空间中移除的过程。然而，这个过程引发了激烈的辩论。激进派主张彻底清洗公共空间，从共产主义遗产中清洗公共空间，从民族精神上重新写作历史。温和派坚持采取更加平衡的方式——在保持苏联时期的积极发展的同时，批判政权的极权主义方面。\n\n在乌克兰历史的关键时刻，我们应该如何选择？"
 ukraine.1000.a:0 "是时候重新考虑一下我们与苏联过去的关系了。"
 UKR_decommunization_begin_tt:0 "我们正着手在乌克兰去共产主义进程。我们的决策将决定该国未来对苏联未来的态度。"
 ukraine.1001.t:0 "政治镇压数字档案馆"
 ukraine.1001.d:0 "1917年至1991年之间，数以百万计的乌克兰人成了政治压迫的牺牲品。1932-1933年的大饥荒夺走了最多400万乌克兰人的生命。在1937-1938年的大恐怖中，数以万计的乌克兰人被处决或送往GULAG。随之而来的大规模镇压和驱逐出境，包括1944年大规模驱逐克里米亚鞑靼人，延续了这一惨痛的历史。\n\n阿库尼亚当局和其它苏联当局的档案中包含了大量关于这些罪行的文件。建立一个数字压制档案可以帮助保留受害者记忆，为亲属提供关于他们所爱之人命运的信息，并为历史正义作出贡献。\n\n然而，如何管理这个档案馆引发了一个问题。是否应该完全不受限制地获取所有文件，包括受害者和线人的个人档案？还是应该限制访问特别敏感数据，保护隐私？也许最好关闭这些档案馆，以免出现严重的旧伤？"
 ukraine.1001.a:0 "创建一个可免费访问的数字档案"
 ukraine.1001.b:0 "提供有限的通信权限，保护个人数据"
 ukraine.1001.c:0 "将档案保留在目前地区"
 UKR_full_archive_access_tt:0 "§R激进政策：§!档案馆的完全开放将导致左翼理念的支持者们公开共鸣和愤慨。许多人将了解其亲属的命运，但情报数据也将公开，导致冲突。"
 UKR_moderate_archive_access_tt:0 "§Y温和政策：§!选择性地打开档案馆可以在不侵犯受害者后代和那些受到压迫的人的隐私的前提下保存受害者记忆。"
 UKR_nope_archive_access_tt:0 "§G现状：§!守住档案馆可以防止社会动荡，但会妨碍历史和解的进程。"
 ukraine.1002.t:0 "拆除苏维埃纪念碑"
 ukraine.1002.d:0 "乌克兰的城市空间充斥着来自苏联时代的纪念碑。列宁，德兹任斯基，什乔尔的雕像，以及其他共产主义政权的雕像在每一个大城市随处可见。这些人中有许多与政治镇压和强制乌克兰实现苏维埃直接相关。\n\n切卡的创始人菲利克斯·德泽日斯基组织了大规模政治镇压。尼古拉·什乔尔在内战期间指挥布尔什维克军队。在他之后，整个基辅地区被命名，签署了大量处决和集体化导致大饥荒的文件。\n\n拆除这些纪念碑的问题成为公众讨论的话题。有些人要求完全移除所有与共产主义过去有关的纪念碑。其他人则建议采取更选择性的方法——移除最可憎的人物留下纪念碑，但要保留专门为文化人物或战争英雄建立的纪念碑。仍然有人坚持将纪念碑作为文化遗产的一部分，而无论其政治背景如何。"
 ukraine.1002.a:0 "毫无例外地拆除所有苏联的名胜"
 ukraine.1002.b:0 "让人民自行决定纪念碑的命运。"
 ukraine.1002.c:0 "只为那些参与镇压的人拆建纪念碑"
 ukraine.1002.m:0 "将纪念碑保留为历史遗产"
 UKR_full_monuments_removal_tt:0 "§R激进政策：§!完全拆除所有苏联纪念碑将会导致社会分裂，但将证明与共产主义的过往有决定性的突破。"
 UKR_crowd_monuments_removal_tt:0 "§R激进政策：§!自发销毁纪念碑（“Leninopad”）将营造一种非暴力对抗的气氛，并导致暴力事件的发生，但会成为人们拒绝苏联意识形态的象征。"
 UKR_selective_monuments_removal_tt:0 "§Y温和手段：§!选择性的拆解将使得保存历史悠久的纪念碑成为可能，而不至于去除压抑的象征。"
 UKR_keep_monuments_tt:0 "§G现状：§!保留纪念碑可以节省经济成本和社会冲突，但会减缓国家认同的进程。"
 ukraine.1003.t:0 "开放目录档案"
 ukraine.1003.d:0 "罗米亚档案中不仅包含了被镇压的受害者，也包含了有关苏联间谍机构、其密探网络和行动的广泛的信息。这些文件可以揭露乌克兰历史的许多暗页：强制集体化、大饥荒、大规模处决、驱逐出境、对持不同政见者的迫害。\n\n例如，档案包含了关于臭名昭著的苏联人民内务委员部的总行刑官瓦西里·布洛欣的档案，他亲自开枪袭击了成千上万的人。或者关于乌克兰民族主义者在国外谋杀领导人组织者帕维尔·苏多普拉托夫的材料。\n\n然而，开放这些档案有着风险。许多档案包含了关于公民的机密信息，包括与国家安全机构合作的人。完全披露这些材料可能会导致公共冲突，甚至导致报复行为。\n\n我们应该在这些档案方面采取什么政策？"
 ukraine.1003.a:0 "向公众完全开放所有档案"
 ukraine.1003.b:0 "只提供历史学家和研究者权限"
 ukraine.1003.c:0 "提供有限的所选材料供应"
 ukraine.1003.m:0 "延长此类文件的国家保密期限"
 UKR_full_archives_tt:0 "§R激进政策：§!档案馆的全面披露将导致备受关注的发现、公共冲突以及历史事件重新评估。"
 UKR_historians_archives_tt:0 "§Y温和点：§!仅提供专业历史学家的权限，可以确保在公众不会过于共鸣的情况下对文档进行科学研究。"
 UKR_limited_archives_tt:0 "§Y温和方式：§!有限地使用特定的材料，使得新的历史事实可以逐渐融入公众意识中。"
 UKR_keep_archives_secret_tt:0 "§G现状：§!保密档案可以防止冲突，但是会影响历史和解的进程。"
 ukraine.1004.t:0 "历史教育改革"
 ukraine.1004.d:0 "在苏联历史学的影响下，学校和大学历史教科书早已成型。许多事情，尤其是乌克兰民族解放运动的事件都被扭曲或沉默了。\n\n例如，乌克兰人民共和国（1917-1921年）是作为资产阶级民族主义分子提出的，而不是作为建立独立的民主国家的尝试。1932-1933年的大饥荒既不被提及，也被认为是庄稼歉收的必然结果，而不是由苏联领导人刻意执行的政策造成的。\n\n现在，我们面临着改革历史教育的任务。我们是否应该彻底修改苏联历史的解释，将苏联作为乌克兰领土的占领者？还是应该为更客观、科学地介绍历史事件而努力，认可苏联时期的消极和积极方面？"
 ukraine.1004.a:0 "重写历史：俄苏维埃社会主义共和国是乌克兰的占领者"
 ukraine.1004.b:0 "维持已有的教科书不变"
 ukraine.1004.c:0 "根据历史事实创建目标教科书"
 ukraine.1004.m:0 "强调政权的镇压和犯罪"
 UKR_radical_education_reform_tt:0 "§R激进政策：§!由民族主义者进行历史重写，将打破与苏联历史叙事的联系，但可能会导致新的扭曲。"
 UKR_no_education_reform_tt:0 "§G现状：§!保存已有的教程可以节省资源，但会保留过时的历史诠释。"
 UKR_balanced_education_reform_tt:0 "§Y温和政策：§!根据历史事实创建客观的教程将有助于在年轻一代形成批判思想。"
 UKR_emphasis_crimes_education_tt:0 "§Y温和主义倾向：§!强调当局的罪行，将突出其极权主义性质，同时保持对苏联时期的社会成就的认可。"
 ukraine.1005.t:0 "建立国家记忆学院"
 ukraine.1005.d:0 "为了系统地研究历史遗产并建立一种新的记忆政策，建议建立一个专门的机构——国家记忆研究所。这个研究所可以协调档案研究，制定教育改革的建议，处理极权政权受害者的纪念问题，并开展教育活动。\n\n然而，探求这个研究所到底应该完成什么任务。它应该成为一个消化与欧洲化的工具，宣传西方的价值观和历史解释？还是它应该努力实现历史的客观性，承认过去的复杂性和含糊？\n\n我们可以特别关注乌克兰历史上最悲惨的一页“大饥荒”。建立一个专门研究这场悲剧的特别研究中心有助于加深对其原因和结果的了解。\n\n我们选择了国家记忆研究所的哪一种模式？"
 ukraine.1005.a:0 "作为去共产主义与欧洲化的工具而建立。"
 ukraine.1005.b:0 "资金浪费 - 拒绝创建学院"
 ukraine.1005.c:0 "化身为史实的客观性"
 ukraine.1005.m:0 "设立专门研究大饥荒的研究所。"
 UKR_european_memory_tt:0 "§R激进政策：§!协会将积极提倡欧洲人对历史的价值观和解释，以帮助乌克兰融入西方文化背景。"
 UKR_no_memory_institute_tt:0 "§G目前情况：§!拒绝创建该研究所将会节省预算资金，但会使得制定系统的记忆政策变得十分困难。"
 UKR_objective_memory_tt:0 "§Y温和政策：§!学院将致力于历史学上的客观性，并承认其过去所经历的复杂而模棱两可。"
 UKR_holodomor_memory_tt:0 "§Y温和主义方法：§!专注于本土研究会强调苏联对乌克兰政策的悲剧性，但会保持对历史的科学态度。"
 ukraine.1006.t:0 "消除共产主义成果"
 ukraine.1006.d:0 "我们所发起的去共产主义进程正迎来其合理结局。我们已经做出了一系列决定，决定了我们国家对于苏联过去的态度以及如何解释它。现在是时候评价这项政策的结果及其对乌克兰社会的影响了。\n\n我们的决策对历史遗产产生了某种影响，这将决定我们未来几年的公众舆论和民族认同。我们将给后代留下什么样的遗产？他们将从我们的记忆政策中汲取哪些经验？"
 ukraine.1006.a:0 "激进分子和解成功完成！"
 ukraine.1006.b:0 "温和的和解已经取得成果"
 ukraine.1006.c:0 "混合方案带来了难以解释的结果"
 ukraine.1006.m:0 "消灭共产主义进程失败了……"
 UKR_radical_path_completed_tt:0 "§R激进的去共产主义：§!我们彻底切断了与苏联人过去的联系，从民族主义据点重写了历史，并清除了共产主义象征主义在公众场合的存在。这在社会上造成了一些紧张因素，但增强了乌克兰国家的身份，并加快融入了西方文化背景中。"
 UKR_moderate_path_completed_tt:0 "§Y温和的去共产主义：§!我们批判性地修正了苏联的遗产，承认极权主义政权的罪行，但维持了对历史的客观态度。这促进了公共和解，并形成了基于事实而非神话的更成熟的国家认同。"
 UKR_mixed_path_completed_tt:0 "§Y混合方针：§!我们的决策是不一致的，这导致了模糊的结果。在一些我们展示了激进主义，另一些则是温和甚至保守主义。这在历史政策上造成了一定的混乱，但却让我们考虑到乌克兰社会的观点的多样性。"
 UKR_bad_path_completed_tt:0 "§G清除共产主义失败：§!我们未能针对苏联传统发展出明确的政策，导致保留了对历史和象征主义的旧释。这减缓了现代乌克兰人身份认同的形成，也造成了爱国思想居民的失望。"
 UKR_decommunization_category:0 "反共措施"
 UKR_decommunization_category_desc:0 "去共产主义仍然是乌克兰历史政策的一个关键方面，其目的是消除苏联留下的遗产，强化民族认同，重塑历史叙事。这些措施从拆解苏联的纪念碑，到改革历史教育和开辟情报档案等等都有。尽管有争议，但这些举动在塑造乌克兰的未来方面有着重要的作用。"
 UKR_digital_repressions_archive:0 "镇压档案数字化"
 UKR_digital_repressions_archive_desc:0 "乌克兰付出了巨大的努力，将苏联的镇压档案数据化并进行分析。这项举措旨在记录政治压迫，荣耀受害者记忆，并使历史记录公之于众。乌克兰通过这样做巩固了历史正义，并确保过去的罪行永远不会被遗忘。"
 UKR_monuments_removal:0 "拆除苏联纪念碑"
 UKR_monuments_removal_desc:0 "一项在全国范围的移除苏联纪念碑与共产主义符号的计划，其目的是消除苏维埃意识形态在乌克兰的公共空间中挥之不去的影响，代之以民族团结和共抗的象征。然而，这种行为仍然有争议的，因为有人认为它们是一种历史抹杀而非必要的进步。"
 UKR_kgb_archives:0 "档案馆分类"
 UKR_kgb_archives_desc:0 "参照其他后苏维埃诸国的旨意，乌克兰源源不断地进行了亚特兰西档案的破解。这些文件的开放让历史学家和大众得以检视苏联过去的行动，并揭示了监控，清洗和镇压异见的详情。此举是迈向透明的一大步，但也引发了政治和外交紧张局势。"
 UKR_history_education_reform:0 "历史教育改革"
 UKR_history_education_reform_desc:0 "政府开始了历史教育改革，确保了对苏维埃时代的叙事进行批判性重新评估。课程课程现在强调了乌克兰国家历史、抵抗运动以及苏联政策的影响。这项改革被认为对增强国家意识至关重要，但也引发了对历史客观性的争议。"
 UKR_national_memory_institute:0 "国家记忆研究所"
 UKR_national_memory_institute_desc:0 "致力于保存历史记忆和对抗苏联时代修正主义的新机构。国家记忆研究所进行了研究，提高了公众意识，并支持非共产主义的法律框架。它的工作对塑造乌克兰的历史政策起了重要作用，尽管在某些政治团体中它的作用仍然存在着争议。"
 UKR_radical_decommunization_complete:0 "激进的去共产主义"
 UKR_radical_decommunization_complete_desc:0 "与苏联的过世断绝了决定性的脱节后，乌克兰全面实施了激进的去共产主义。解体共产主义符号、清洗国家机构中的亲苏分子，以及严格的意识形态政策确保了这一方针的可逆性。虽然这加强了国家的复原力，但也加深了左翼运动意识形态上的分歧。"
 UKR_moderate_decommunization_complete:0 "温和的贬低共产主义"
 UKR_moderate_decommunization_complete_desc:0 "乌克兰采取了一种平衡的方法来消除共产主义，在保持政治稳定的同时消除了苏联的影响。该国重视民主价值观和学术进步，而在没有大清洗的情况下逐步改革体制。这一策略促进了经济增长与国际合作，同时避免了过度的两极分化。"
 UKR_mixed_decommunization_outcome:0 "混合的去共产主义方案"
 UKR_mixed_decommunization_outcome_desc:0 "在去共产主义领域采取了一种务实的策略，将改革与连续性的元素融为一体。虽然共产主义和极右翼的意识形态失去了影响力，但社会民主主义者在国民讨论中获得了更多的影响力。该方针将意识形态变革与经济的实用主义相调和，促进了学术与社会发展。"
 soviet_legacy:0 "苏联遗产"
 UKR_ukrainian_renaissance:0 "乌克兰文艺复兴"
 UKR_ukrainian_renaissance_desc:0 "乌克兰文化、语言以及身份的复兴不仅是一种象征性的姿态，也是在信息对抗的条件下的一项战略需要。乌克兰的文化复兴与经济发展或增强国防能力同样重要。国家支持乌克兰电影院（通过国家电影机构捐赠和补贴的制度）、文学（“乌克雷尼书籍”节目）、音乐、戏剧以及其他艺术将吸引创生青年，并为培养新的文化精英创造条件。通过无线电和电视行业向乌克兰语的内容定价体系，将信息空间乌植化，启动新的文化项目和渠道，提高乌克兰媒体产品对抗俄罗斯文化扩张的竞争力。\n\n“文化外交”节目为海外举办乌克兰文化节日提供了参加国际文化创生项目的机会，并创造了国家的正面形象。通过强化我们的文化认同，我们将为国家团结奠定基础并抵制外部的信息威胁。"
 UKR_cultural_reforms:0 "文化改革"
 UKR_culture_decisions:0 "打开“文化发展”类决议，增加支持民族文化、乌克兰语言和促进文化项目的机会。"
 UKR_education_reform:0 "教育改革"
 UKR_education_reform_desc:0 "国家的未来在教室和实验室中建立。学校教育正在以基于能力的方式转变，引入了12年制的高等教育。在高等教育中，大学的自主权将得到加强，反垄断系统和学术界健全机制将得以实施，并将与欧洲大学制定双重文凭计划。特别注重精确科学、信息技术教育和工程专业的发展，以确保技术突破。这项改革规定建立一个现代化研究实验室网络，提供最新的设备，吸引外国科学家以及从国外返回的乌克兰科学家。"
 UKR_education_future:0 "教育未来"
 UKR_nuclear_reactor_up:0 "核反应堆现代化"
 UKR_synth_resources:0 "合成资源"
 UKR_address_covid_threat:0 "消除COVID-19威胁"
 UKR_address_covid_threat_desc:0 "新式的冠状病毒已经迅速蔓延至我国边境。COVID-19传染病不仅对我们公民的健康，而且还对乌克兰的经济稳定和国家安全构成了前所未有的威胁。政府必须立即采取措施保护人民，动员医疗资源，将危机的社会经济后果降到最低。现在是时候果断采取行动了——每天的拖延都可能导致数以百亿计的人命和数十亿计的疲劳。只有政府各部门和社会的协调一致的努力才能使乌克兰以最小的损失来克服这个全球性的挑战。"
 UKR_implement_adaptive_quarantine:0 "实施适应性隔离"
 UKR_expand_healthcare_budget:0 "增加医保预算"
 UKR_healthy_nation_program:0 "启动“健康国家”项目"
 UKR_vaccinate_population:0 "疫苗传染给人民"
 UKR_enforce_lockdowns:0 "实施严格的封锁"
 UKR_use_army_aganist_covid:0 "利用军队对抗COVID-19"
 UKR_implement_adaptive_quarantine_desc:0 "面对快速传播的COVID-19大流行，对付流行病的传统方法被证明是无效的。适应性隔离将使我们能够根据特定区域的流行病学情况实施限制，将国家划分为不同程度的风险 “区域”。这将帮助保持公民健康和经济运行之间的平衡。"
 UKR_expand_healthcare_budget_desc:0 "乌克兰的医疗体系并没有为大规模疫情做好准备。紧急扩大医疗部门的资金将使我们能够为医院采购必要的设备，提供额外的床位能力，并为医务人员提供个人防护装备。医疗保健投资不仅是针对COVID-19的措施，也是国家未来的一项战略性投资。"
 UKR_healthy_nation_program_desc:0 "这种流行病已经显示出了国民的整体健康状况在抵御新威胁方面是多么的重要。“健康的国家”计划将包括宣传预防疾病，促进健康生活方式，以及加强公民免疫力的措施。人们将会特别注意国内体育运动的发展：一系列在线锻炼，关于在限制空间内组织体能活动的建议，以及通过适当的营养和日常例行公事加强免疫力的建议。通过电视和社交媒体，公民将得到高质量教育材料，帮助他们即使在检疫的条件下也能维持其健康。让我们的人民比以往任何时候都更加强壮、更健康。"
 UKR_vaccinate_population_desc:0 "随着针对COVID-19疫苗的出现，战胜这场传染病的道路已经打开。对人口的大规模接种需要大量的组织工作和资源，但它才是恢复正常生活的唯一可靠途径。通过制定一项有效的疫苗接种计划，我们不仅能保护我国公民的健康，而且还能强化我国在国际舞台上的地位。"
 UKR_enforce_lockdowns_desc:0 "面对疫情的发病率大幅上升，我们不得不采取果断措施。实施严格的封锁政策将暂时限制经济活动和公民的流动自由，但也会打破病毒传播的链条，减轻医疗系统的负担。现在严格的限制意味着明天会拯救生命。"
 UKR_use_army_aganist_covid_desc:0 "在紧急情况下，需要利用一切资源。乌克兰武装部队的士兵可以在防治传染病方面提供宝贵的援助：从部署战地医院到确保检疫措施的遵守情况。军队的纪律和组织将有助于我们以最小的代价渡过危机。"
 UKR_adaptive_quarantine_tooltip:0 "引入适应性检疫，可以对不同地区的流行病学情况作出更灵活的反应。"
 UKR_expanded_healthcare_budget_tooltip:0 "追加医疗保健资金将有助于应对危机，但也会暂时减少预算收入。"
 UKR_healthy_nation_initiative_tooltip:0 "“健康国家”计划将提高公众对于COVID-19的预防意识以及改善公共卫生的认识。"
 UKR_covid_response_decisions:0 "对抗科维德19号疫情"
 UKR_covid_response_decisions_desc:0 "冠状病毒传染病对乌克兰来说已经是一个严重的挑战。政府必须采取一系列措施来控制感染的蔓延，支持医疗系统，并最大限度地减少经济损失。国家尽快克服危机并恢复正常生活取决于这些决定的有效性。"
 UKR_adaptive_quarantine:0 "适应性隔离"
 UKR_adaptive_quarantine_desc:0 "一种基于将国家领土划分为具有不同程度流行病风险的区域的限制性措施。每个地区都有自己的限制，取决于发病率。这种方法可以控制感染的蔓延，而不完全停止全国的经济活动，但需要大量行政资源来监测和协调。"
 UKR_expanded_healthcare_budget:0 "扩大医保预算"
 UKR_expanded_healthcare_budget_desc:0 "医疗部门用于防治大流行病的资金大幅增加，并增加了额外拨款购买通风器、氧气培养器、医疗工作者个人防护设备、扩大床位以及额外支付医疗人员费用。这些开支在国家预算中是一个沉重的负担，但对于拯救公民的生命和防止医疗系统崩溃是必要的。"
 UKR_healthy_nation_initiative:0 "“健康国家”倡议"
 UKR_healthy_nation_initiative_desc:0 "旨在加强疫情期间健康状况的国家综合计划。它包含了针对预防家庭健康、促进家庭锻炼、合理营养养分及维持免疫力的日常例行公事方面的广泛的宣传活动。项目参与者包括著名的运动员、医生和营养学家，他们定期举办在线课程及咨询。这项举措不仅帮助公民在隔离期间保持现状，也提倡一种对自身健康更负责任的态度。"
 UKR_covid_crisis:0 "COVID-19 危机"
 UKR_covid_crisis_desc:0 "冠状病毒大流行在医疗保健、经济和社会领域都造成了严重的危机。拥挤的医院，缺乏医疗人员和设备，产量下降，失业率上升，以及社会矛盾——所有这些都已经成为了乌克兰的现实。国家不得不在严格检疫措施保护公民健康和保持经济活动之间做出平衡。克服这场危机需要作出困难且不受欢迎的决策并调集所有可用资源。"
 ukraine.400.t:0 "COVID-19 抵达乌克兰"
 ukraine.400.d:0 "今天，第一个ECVID-19病例在乌克兰得到了证实。这位患者是从外国归来的，但却在隔离隔离区里被治疗。他的病情被评估为稳定。卫生部报告说，所有与他接触的人都在医疗监督下。\n\n专家们警告说这只是个开始。其他国家的经历表明新的冠冕病毒传播的速度有多快。由于经费不足多年，我们的医疗系统可能还没有准备好一场大规模疫情。\n\n政府已经开始制定一项防止病毒扩散的行动计划。然而，许多人将取决于社会是否严肃地对待这种威胁，以及是否会遵守必要的预防措施。"
 ukraine.400.a:0 "我们必须采取果断的行动。"
 ukraine.401.t:0 "COVID-19大流行被击败"
 ukraine.401.d:0 "今天，乌克兰卫生部宣布完全解除了与COVID-19相关的所有反瘟疫限制。在过去的两个月里，新病例一直保持在最低限度，医疗系统正常运转。\n\n这场流行病对我国来说是一个严重的挑战。我们失去了许多公民，经济遭受了巨大的损失，有些工业还没有回到危机前的水平。然而，这场危机也显示出乌克兰社会有能力团结起来面对威胁和适应新的现实。\n\n国家的医疗系统已进行了重大发展，新的治疗和预防传染病协议已经出台。许多公民对他们的健康和卫生变得更加负责。即使在疫情结束后，这些积极的变化仍将留在那里。\n\n尽管COVID-19还没有完全消失，但它不再对公共卫生构成了前所未有的严重威胁。乌克兰终于可以翻开历史的一页，将重心放在复苏和发展上。"
 ukraine.401.a:0 "我们的确忍受了这次审判。"
 UKR_covid_tt:0 "乌克兰第19大瘟疫……"
 UKR_covid_over_tt:0 "乌克兰的COVID-19大流行已经结束了。"
 UKR_against_occupiers:0 "对抗侵略者"
 UKR_against_occupiers_desc:0 "在这个审判时刻，我们必须利用一切手段来对抗俄罗斯的侵略。通过外交和军事手段，我们将确保乌克兰的主权。"
 UKR_resistance_coalition:0 "建立抵抗联盟"
 UKR_resistance_coalition_desc:0 "俄罗斯期待着国际社会的分裂。我们需要建立一个民主国家联盟来支持我们的斗争。欧洲的伙伴准备向乌克兰提供政治和物质支持以应对侵略。"
 UKR_idea_resistance_coalition:0 "抵抗阵线"
 UKR_idea_resistance_coalition_desc:0 "一个西方国家联合政府，为乌克兰提供政治、经济和军事支持。这加强了我们在外交领域的地位，提高了人民的士气。"
 UKR_regional_alliance:0 "地区防御同盟"
 UKR_regional_alliance_desc:0 "东欧各国有着共同反抗俄罗斯施压的经验，已经准备好进行更密切的防御合作。波兰，波罗的国家和乌克兰可以建立一个能够加强我们集体安全的区域集团。"
 UKR_idea_regional_alliance:0 "东欧防御同盟"
 UKR_idea_regional_alliance_desc:0 "东欧国家联合努力应对俄罗斯威胁。联盟规定共享情报、协调军事行动和后勤保障。"
 UKR_idea_regional_alliance_member:0 "东欧防御同盟成员"
 UKR_idea_regional_alliance_member_desc:0 "我国是旨在遏制俄罗斯侵略东欧的区域联盟的一部分。"
 UKR_lend_lease_program:0 "租借法案计划"
 UKR_lend_lease_program_desc:0 "我们的西方盟友已经准备通过一个类似于美国在二战期间援助盟友的项目来提供必要的武器和军事装备。这对于我们抵御强大敌人的能力来说至关重要。"
 UKR_idea_lend_lease:0 "西租借法案"
 UKR_idea_lend_lease_desc:0 "数以百计的武器和数以万计的装备从西方盟友手中赶到乌克兰军队中，这显著增强了我们的作战能力，令我们得以补偿敌军在数量上的优势。"
 UKR_port_infrastructure_investment:0 "十二群岛港口基础设施现代化"
 UKR_port_infrastructure_investment_desc:0 "在克里米亚沦陷和俄罗斯的侵略后，圣爱德萨港成为了国民经济中至关重要的节点。在2014年前，这座港口每年处理货物2，500万吨，但克里米亚的损失使货物周转能力减少了40%。现代化包括扩建集装箱终端，重建停靠设备，以及应用现代物流技术。我们的目标是将货物周转率提高到3，500万吨，并将圣爱德萨改造为黑海地区的主要运输枢纽。"
 UKR_maritime_revival:0 "海军潜力的复苏"
 UKR_maritime_revival_desc:0 "在吞并克里米亚之后，乌克兰海军失去了70%的舰队。今天，“伊拉克”计划中的两艘巡逻艇还在服役——“荣耀归于乌克兰”和“独立”。舰队复兴战略包括在奥德萨建立一个现代基地，购买新的巡逻艇，并发展航海航空。特别强调轻型、高速、能够在非对称战争中有效运转的船只。"
 UKR_convoy_fleet_development:0 "发展海上贸易"
 UKR_convoy_fleet_development_desc:0 "与俄罗斯的贸易战争导致了双边贸易顺差，从2013年的380亿美元归于2022年的40亿美元。乌克兰被迫重组后勤路线。商业舰队发展计划包括创建一支能在港口阻塞条件和其他海上走廊中运转的国家贸易舰队。计划包括增加运输船和集装箱船的数量以促进国际贸易多样化。"
 UKR_maritime_doctrine_adaptation:0 "海军学说适应"
 UKR_maritime_doctrine_adaptation_desc:0 "新海军学说着重于思考亚速海冲突与克里米亚沦陷导致的教训。关键原则：机动性，不对称行动和高科技武器。这里会特别关注无人航海技术，沿海袭击复合体，以及海洋部件与陆地和空军的整合。其目的是建立一支能够在混合战情况下高效行动的舰队。"
 UKR_maritime_defense_strategy:0 "综合海上防御战略"
 UKR_maritime_defense_strategy_desc:0 "战略包括建立多层次的海上安保系统。关键因素包括发展带反舰导弹群的海岸防御系统，建立海空传感器网络，以及组建专门的海上单位，以在复杂的战术环境下作战。网络防御和电子战是俄罗斯海军的重中之重。"
 UKR_port_infrastructure_tooltip:0 "港口基础设施全面现代化"
 UKR_convoy_fleet_development_tooltip:0 "现代商船队的建立"
 UKR_maritime_defense_strategy_tooltip:0 "组建有效海上防御系统"
 UKR_SBU_emergency_powers:0 "SBU 紧急权力"
 UKR_SBU_emergency_powers_desc:0 "在战时的情况下，有必要授予乌克兰安全局更多权力，以有效对抗俄罗斯特工、破坏集团和敌人在我国领土上的宣传。"
 UKR_idea_SBU_emergency_powers:0 "加强反间谍政权"
 UKR_idea_SBU_emergency_powers_desc:0 "乌克兰安全局实施积极措施，识别间谍、破坏分子和敌人的支持者。这提高了我们的国内安全水平，但需要额外的资源，并对公民自由造成一些损失。"
 UKR_carpathian_logistics_plan:0 "喀尔巴阡后勤计划"
 UKR_carpathian_logistics_plan_desc:0 "喀尔巴阡地区拥有多山的地形和难以到达的领土，可以成为我们军事行动的可靠后方。制定特殊的后勤计划，包括建立后备油库和建立受保护的补给路线，将显著加强我们的防御阵地。"
 UKR_idea_carpathian_logistics:0 "喀尔巴阡后勤网"
 UKR_idea_carpathian_logistics_desc:0 "在喀尔巴阡地区的庞大补给线和仓库网络为我国武装部队提供了一个可靠的后方。即使东部地区的控制权暂时丧失，我们也会维持后勤的稳定。"
 UKR_civilian_vehicle_adaptation:0 "民用载具设计应用"
 UKR_civilian_vehicle_adaptation_desc:0 "在标准军事装备短缺的环境下，为了军事需求，有必要调动和改造民用载具。卡车、客车甚至拖拉机经适当改装后可以在前线执行各种任务。"
 UKR_idea_adapted_civilian_vehicles:0 "改进型民用载具"
 UKR_idea_adapted_civilian_vehicles_desc:0 "成千上万的民用载具被改装用于军事目的。尽管它们不及专业化的军事装备，但其数量和可用性部分地补偿了敌人的技术优势。"
 UKR_air_defense_priority:0 "防空优先级"
 UKR_air_defense_priority_desc:0 "俄罗斯空军的优势性是一个严重的威胁。我们有必要集中精力来加强我们的空中防御，以保护关键的基础设施以及军队编队。"
 UKR_idea_air_defense_priority:0 "加强空军防御"
 UKR_idea_air_defense_priority_desc:0 "集中发展防空系统的资源使我们能够部分消除敌方的制空权。关键城市和军事设施由防空系统保护。"
 UKR_minefield_key_directions:0 "矿业关键方向"
 UKR_minefield_key_directions_desc:0 "在敌人前进的可能方向上建立雷场将显著减缓敌军的行动速度并增加其损失。虽然这将给平民带来长期问题，但在目前的情况下这是一个必要的措施。"
 UKR_idea_minefields:0 "广泛雷区"
 UKR_idea_minefields_desc:0 "敌人最有可能行进的路线被改装成了危险的水雷。这大大减缓了敌人部队的进步并增加了他们的损失，但却给当地居民带来了长期的人道主义问题。"
 UKR_rapid_armored_thrust:0 "快速装甲推力"
 UKR_rapid_armored_thrust_desc:0 "集中了装甲单位的火力以突破敌方的防线，之后迅速推进进入了领土深处，切断了敌军的补给线并包围了敌军。基于“闪电战”战术，适应了现代战场环境。"
 UKR_bayraktar_strike_coordination:0 "巴伊拉塔尔 TB2攻击协同"
 UKR_bayraktar_strike_coordination_desc:0 "利用巴伊拉克塔尔TB2型无人机精确打击指挥站、防空系统和敌方装甲。空中侦察数据的实际应用使地面部队和空中行动得到有效的协调。"
 UKR_nato_intelligence_operation:0 "北约联合情报行动"
 UKR_nato_intelligence_operation_desc:0 "与北约情报机构密切合作以获取有关敌军动向、意图和脆弱性的最新信息。获取卫星数据、通信拦截和盟友分析专业知识极大提高了行动规划的有效性。"
 UKR_night_raids_operation:0 "夜间袭击行动"
 UKR_night_raids_operation_desc:0 "特种部队使用现代夜视装备进行夜间袭击。在黑暗中突然袭击会瓦解敌人，降低他们的士气并扰乱后勤链条，给敌人的阵地造成持续压力。"
 UKR_strategic_triangle_defense:0 "第聂伯-基夫-赫尔松三角防御"
 UKR_strategic_triangle_defense_desc:0 "建立一条连接战略要地——迪米普罗、基辅和赫尔松的防御周界。这种防御策略最大限度地利用自然屏障，允许控制关键运输枢纽和补给线，创造出保护国家核心领土的坚实屏障。"
 UKR_project_asgard:0 "“阿斯加德”计划 - 机动防空网"
 UKR_project_asgard_desc:0 "由机动防空导弹组成的分布式防空系统的开发与部署将整合成一个统一的信息网络。持续的阵地变化与重叠的责任区使得这个系统难以成为敌方空袭和导弹袭击的目标。"
 UKR_serpents_path_assault:0 "“塞彭特线”边境突袭"
 UKR_serpents_path_assault_desc:0 "利用灵活的渗透和机动策略在边境上进行一系列协同攻击。像蛇一样，攻击部队绕过敌人的有利阵地，专注于薄弱地区和控制节点。这一策略允许最大限度有效地利用有限的资源。"
 UKR_azov_steel_operation:0 "“亚速·钢铁”特种作战"
 UKR_azov_steel_operation_desc:0 "使用精锐部队在战线后的深处执行高风险行动。像钢一样在战斗中温和的战斗机可以执行任务消灭敌方指挥官，破坏关键基础设施并占领战略要地，为更大规模的进攻行动做准备。"
 UKR_armored_thrust_bonus:0 "装甲部队进攻点数"
 UKR_drone_strike_bonus:0 "协同无人机打击"
 UKR_nato_intelligence_support:0 "支持北约情报机构"
 UKR_night_combat_bonus:0 "夜间战斗优势"
 UKR_strategic_triangle:0 "战略防御三角"
 UKR_asgard_defense_network:0 "“阿斯加德”防空网"
 UKR_offensive_momentum:0 "进攻点数"
 UKR_azov_steel_operations:0 "特种部队行动"
 UKR_rapid_armored_thrust_tooltip:0 "§Y装甲机械化部队将获得显著战术优势，提升其机动性和打击力。§!"
 UKR_bayraktar_strike_tooltip:0 "§Y精准打击无人机会削弱敌方的防御能力并降低其防空系统效率。§!"
 UKR_nato_intel_tooltip:0 "§Y盟友提供的情报将提高我们的战术意识和指挥效率，并揭示敌人的弱点。§!"
 UKR_night_raids_tooltip:0 "§Y夜间特殊行动将为我方提供战术优势，同时降低敌军士气。§!"
 UKR_strategic_triangle_tooltip:0 "§Y建立防御工事区将在保卫关键城市和提升周边后勤方面取得长足优势。§!"
 UKR_asgard_tooltip:0 "§Y现代化的防空系统将提高我方部队和设施的安全，使其免遭敌军空袭。§!"
 UKR_serpents_path_tooltip:0 "§Y进攻行动将使我们部队更有效地战胜敌人的防线并在敌方领土上前进。§!"
 UKR_azov_operation_tooltip:0 "§Y在敌后作战的特殊单位会破坏通讯，士气低落，并为主力部队创造有利条件。§!"
 UKR_idea_belarus_cooperation:0 "乌克兰-白俄罗斯合作"
 UKR_idea_belarus_cooperation_desc:0 "在白俄罗斯的民主改革之后，我国与俄罗斯的关系翻开了新的篇章。共同的挑战和追求独立于俄罗斯影响对我们的国家更紧密地联系在一起。联合经济项目已经取得成果，而文化交流也强化了历史友情。"
 UKR_belarus_military_cooperation:0 "同白俄罗斯的军事合作"
 UKR_belarus_military_cooperation_desc:0 "我们的军队正在进行联合演习，并交流专业知识。共享的边界需要协调的防御工作，而统一训练标准提高了两军的战备状态。建立安全的北部侧翼将显著加强我们的安全。"
 ukraine_belarus_friendship_initial:0 "乌克兰-白俄罗斯友谊"
 ukraine_belarus_friendship_initial_desc:0 "迈向与白俄罗斯新民主派合作的第一步，已经为长期合作奠定了基础。我们的人民，团结在斯拉夫人的共同遗产下，正在重新发现彼此。"
 ukraine.500.t:0 "与白俄罗斯的关系的新篇章"
 ukraine.500.d:0 "白俄罗斯的政治改革为我们提供了一个独特的机会。经过几十年的卢卡申科独裁统治，新的领导人向西看去，而不是向东看去。我们的外交官报告说，白俄罗斯官员向对话开放了前所未有的开放。外交部提议与我们的北部邻国开启新的篇章。初步磋商表明，在经济、文化和可能情况下，我们的人民之间具有强大的伙伴关系的潜力。尽管一直存在政治障碍，但我们民族之间的历史联系可能会形成新的联盟的基础。\n\n分析家们强调了潜在的经济效益：恢复断裂的供应链，进入新市场，以及更有效地利用两国的过境潜力。尤其是，能源合作和运输走廊一体化的前景。\n\n然而，军方内部的一些持怀疑态度的人警告白俄罗斯可能不稳定，以及过早和解的风险。俄罗斯无疑会将我们的联盟视为对其利益的直接挑战，这可能会进一步升级一个已经十分紧张的地区局势。"
 ukraine.500.a:0 "向白俄罗斯伸出友谊之手"
 ukraine.500.b:0 "现在不是实验的时候"
 ukraine.501.t:0 "深化与白俄罗斯的合作"
 ukraine.501.d:0 "在过去的几个月里，我们与新的民主白俄罗斯的关系得到了显著的加强。定期的高层会议和越来越多的贸易量表明我们选择的进程取得了成功。一个象征性的举动是在基辅为伟大的白俄罗斯诗人扬卡·库帕拉献上了一座纪念碑，也是在明斯克为色雷斯·舍夫琴科献上的一座纪念碑。\n\n现在我们有机会开展合作，以进行实质性的新的军事层面的合作。国防部提出了一项雄心勃勃的联合行动计划，包括定期演习、军事人员交流，以及建立边境安全协调委员会。\n\n空中防御受到了特别关注。我们的专家已经制定了联合使用雷达系统的方案，这将显著提高预警能力，以应对潜在的空中威胁。考虑到其恢复的军队数量有限，这对白俄罗斯来说尤其重要。该项目还包括建立一个联合培训中心，两国军人将在那里相互交流现代战争经验。\n\n我们领导层中的每个人都支持这样密切的军事合作。有担心，这可能会被视为形成一个反苏集团，引发克里姆林宫的强烈反应。此外，关于白俄罗斯新政府的稳定性及其抵御外部压力的能力，仍有问题。"
 ukraine.501.a:0 "和白俄罗斯建立军事同盟"
 ukraine.501.b:0 "限制经济伙伴关系"
 ukraine.502.t:0 "与白俄罗斯的关系的新篇章"
 ukraine.502.d:0 "和平条约签署后，白俄罗斯重新获得了完全的独立。我们受共同历史和最近的斗争所束缚，给了我们一个千载难逢的机会来建立与纯洁国家的关系。两国大使馆已经恢复其行动，边境检查站现在对公民的自由移动开放。我们的经济学家和工程师已经在讨论重建在冲突中受损的基础设施和工业的联合项目。许多专家认为，我们两国之间的密切合作不仅可以加速复苏进程，还可以在面对未来可能来自东方的威胁时作为安全保障。"
 ukraine.502.a:0 "在重建方面开展全面合作"
 ukraine.502.b:0 "专注于用我们自己的资源重建。"
 belarus_mutual_defense_pact_tooltip:0 "乌克兰和白俄罗斯启动了联合重建项目"
 UKR_idea_belarus_construct:0 "兄弟般的重建"
 UKR_idea_belarus_construct_desc:0 "经年累月的冲突后，乌克兰和白俄罗斯团结起来，从战争的灰烬中崛起。联合基础设施的恢复项目、技术交流和经济计划的协调让两国更有效地克服毁灭的后果。受共同历史和最近的斗争束缚的国家正为合作建立新的基础，而不是基于政治野心，而是从建立一个光辉和平繁荣的未来的真诚愿望中。"
 UKR_military_budget_expansion:0 "加强特种作战和军事情报"
 UKR_military_budget_expansion_desc:0 "在与侵略者同时发生的混合作战中，提高我们的防御能力是至关重要的。他们的主要焦点将是支援关键情报单位：情报总局、特种作战部队、侦察技术和无人机单位。优先发展特种作战系统，增强特种部队的情报潜力，特别注意深层渗透特工的培训。在自主特种作战和信息安全方面，关键单位的权力被显著扩大。每一种投入的资源都是保护国家主权的又一个机会。我们的座右铭是：情报是一种武器，情报是国家安全的盾牌。"
 UKR_shadow_war_capabilities:0 "对侵略者进行不对称的反击"
 UKR_shadow_war_capabilities_desc:0 "黑暗中的战争是乌克兰特种部队的日常现实。侵略者占领的领土越多，抵抗就越强。新公里的土地诞生了几十个隐藏的抵抗组织的地下组织网络。特种行动部队有以下的战略任务：纵深敌人的侦察，进行破坏行动，破坏敌人的通讯，并收集极为重要的战略信息。我们的主要武器是国家的不崩溃精神。部队的结构包括精英专用部队，海军单位，以及高度机动性的空降部队。我们的战略目标是将每个被占领土地变成一个充满不确定和敌人风险的空间。"
 UKR_budget_military_expansion_tooltip:0 "§H重新装备和加强特种单位将提供更多机会来对抗敌方的信息、外交和情报影响§!"
 UKR_shadow_war_special_ops_tooltip:0 "§H扩大非对接战争能力将确保支持独立和解放部队对抗侵略者，建立广泛的联络网和影响力渠道§!"
 UKR_increased_funding_agency:0 "扩充情报潜力"
 UKR_increased_funding_agency_desc:0 "针对特殊服务的融资和支持显著提升了我国的情报潜力。为情报网络的快速组建、对高水平专家的培训以及开展复杂特别行动创造了有利的条件。每投入额外的情报资源，都可以通过战略信息和先发制人的能力相乘以回报。"
 UKR_shadow_war_category:0 "影子战争"
 UKR_shadow_war_category_desc:0 "混合冲突定义了国际政治的新现实。面对侵略和不稳定因素，乌克兰采取了决定性的措施来对抗俄罗斯联邦的秘密影响和威胁。影子战争在多个战线上展开：从秘密特种作战和情报任务，到外交演习，以及支持独联体各地的独立国家。这些决定将加强乌克兰的地位，确保战略优势，并保护国家利益。"
 UKR_support_central_asian_resistance_KAZ:0 "军事战略支援哈萨克斯坦"
 UKR_support_central_asian_resistance_KAZ_desc:0 "快速的军事补给和专家支援创造了一个无形的国家主权之盾。关键情报，先进装备和战略咨询都通过特殊渠道发给国家领导层。我们的目标是在不断增长的地缘政治挑战中加强防卫能力，帮助维护独立。"
 UKR_support_central_asian_resistance_UZB:0 "乌兹别克斯坦军事支援专家"
 UKR_support_central_asian_resistance_UZB_desc:0 "秘密军事走廊确保了战略武器和情报的快速转移。特别军事专家组已经准备好向该国领导人提供即时咨询支持。每一个通信渠道和每一个货运都是加强国家安全和独立的一个步骤。"
 UKR_support_central_asian_resistance_TMS:0 "支持土库曼斯坦的战术军事援助"
 UKR_support_central_asian_resistance_TMS_desc:0 "一个无形的军事团结网络涵盖国家安全的战略领域。现代武器系统，尖端情报和即时专家的支持已经准备好在关键时刻保卫国家主权。"
 UKR_support_central_asian_resistance_TAJ:0 "为塔吉克斯坦提供军事保护作战"
 UKR_support_central_asian_resistance_TAJ_desc:0 "快速运送军队和提供高超情报支持可以创造出一个抵御外敌的可靠护盾。专业军事专家团队已经准备好与本国的领导人进行即时战略磋商，并确保他们对任何场景都做好万全准备。"
 UKR_support_central_asian_resistance_KYR:0 "与吉尔吉斯斯坦的全面军事联军"
 UKR_support_central_asian_resistance_KYR_desc:0 "多层次的军事支援系统包括快速交付现代武器、传递关键情报和随时准备进行战略谈判。每一个通讯渠道都增加了保护国家利益的额外潜力。"
 UKR_support_central_asian_resistance_GEO:0 "秘密对抗俄罗斯入侵格鲁吉亚行为"
 UKR_support_central_asian_resistance_GEO_desc:0 "秘密情报机构正在进行极其秘密的行动以传递关键情报。特殊小组分析军事风险，准备详细的抵抗计划，并传递潜在入侵的情报。每个被截获的文件，每个匿名通讯频道都对俄罗斯的机器进行精确打击。该行动以最大的匿名方式进行，没有官方声明或公共接触。"
 UKR_support_central_asian_resistance_AZR:0 "秘密抵制阿塞拜疆领土宣称"
 UKR_support_central_asian_resistance_AZR_desc:0 "深思熟虑的专业团队创造了对抗潜在军事入侵的战略屏障。加密渠道传递有关军事运动的情报，准备先发制人保护国家边界。每一个被拦截的俄罗斯军队计划都是争夺主权秘密战争的碎片。"
 UKR_support_central_asian_resistance_ARM:0 "亚美尼亚军事威胁的暗影遏制"
 UKR_support_central_asian_resistance_ARM_desc:0 "与国家安全相关的秘密行动。分析小组在绝对保密的情况下追踪军事风险，准备抵抗战略。每一个传输的信号都是对俄罗斯军事战略的无形打击，没有官方文件或公共痕迹。"
