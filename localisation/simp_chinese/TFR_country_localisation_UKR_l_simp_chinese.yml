 UKR_far_right_meddling_desc: "自梅丹以来，我们的政府就被右翼分子和政客大量渗透。警察部队和军队是最受影响的结构，军队拥有来自国家支持的极右翼营，得到了各种政府官员和一些寡头的赞助。这也帮助克里姆林宫声称我们有“天主教法西斯主义者”的天性，让他们在顿巴斯支持分裂主义的俄罗斯人渣。我们必须接纳我们更激进的同胞，或彻底削弱他们的影响。"
