 ukraine.1.t: "乌克兰违反明斯克议定书"
 ukraine.1.d: "乌克兰政府违反了与诺沃罗西亚联邦州的和平协议，并允许乌克里亚军队再次开始边界冲突。"
 ukraine.1.o1: "真是一次彻头彻尾的努力。"
 ukraine.1.o2: "撕毁合约！背水一战！"
 ukraine.2.t: "乌克兰航空752号班机在伊朗坠落"
 ukraine.2.d: "伊朗政府通知我们，伊朗共和军卫队的成员意外击落了我们的一艘客机。从伊玛目的霍梅尼国际机场起飞的民用飞机被水面空降导弹击中。共有176名乘客丧生。"
 ukraine.2.o1: "可怕的悲剧！"
 ukraine.3.t: "俄罗斯谴责乌克兰“纳粹主义”"
 ukraine.3.d: "俄罗斯政府最近企图破坏我国政府，并将其对克里米亚和顿巴斯的非法占领描绘成正当的，为此对我国发动了又一轮毫无根据的指控。他们利用国家宣传网，例如共和党和斯普特尼克，其政客和权威人污蔑了泽伦斯基总统的政权“腐败匪徒”、“内法西斯匪徒”，以及“希特勒合作者的孙子”。\n\n尽管他们或许对亚速营这样的组织内是否存在一些过于狂热的分子是正确的，但其他主张却比普京声称的民主合法性都要脆弱！他们利用旧式的宣传手段，将任何与沙皇或苏联作战的乌克兰当做外国傀儡或法西斯疯子污蔑。我们不会容忍这个最新的诽谤案件，我们将呼吁世界其他国家谴责俄罗斯人赤裸裸的谎言！"
 ukraine.3.a: "也许他们认为历史是站在他们一边的，但历史会证明我们是正确的！"
 ukraine.5.t: "邀请加入北约"
 ukraine.5.d: ""
 ukraine.5.a: "我们立场一致！"
 ukraine.12.t: "乌克兰誓言要保卫库班"
 ukraine.12.d: ""
 ukraine.12.a: "他们知道另一个选项……"
 ukraine.13.t: "图波·戈夫诺"
 ukraine.13.d: "图波戈·戈夫纳"
 ukraine.14.t: "共产主义起义！"
 ukraine.14.d: ""
 ukraine.14.a: "杀光他们！"
 UKR_liberal_oligarchy: "自由寡头制"
 ukraine.4.t:0 "乌克兰开战准备"
 ukraine.4.d:0 "在不断增长的军事冲突威胁下，乌克兰政府启动了紧急措施来增强国家的防御能力。通过与波兰和罗马尼亚合作，在关键地区开始建设防御工事，同时军事工业的扩张。值得注意的是，新的防御区已经在第聂伯罗、切尔卡西州和基辅地区部署。这一决定是旨在保护关键领域的更广泛的遏制战略的一部分。"
 ukraine.4.a:0 "我们必须做好应对任何事态发展的准备。"
 UKR_intelligence_operation:0 "HUR报告"
 UKR_intelligence_operation_desc:0 "经过总情报局（HUR）的彻底分析，一个专门单位被组建来持续监控俄罗斯联邦的行动。这份以法国和美国的外部情报来源以及国内数据为基础的报告显示，俄罗斯军队采用的战术包括机动打击集团、装甲师和联邦海军情报局（FSB）和外国情报处（FSB）的行动单位。建议强调加强控制和快速应对反俄罗斯侵略措施的必要性。"
 ukraine.800.t:0 "HUR报告：监测俄罗斯行动"
 ukraine.800.d:0 "2014年2月，在对麦丹的大规模抗议中，情报机构记录了俄罗斯最高领导层的紧急会议，并批准了夺取克里米亚的计划。在三天之内，黑海舰队的陆战步兵就收到了战争命令，而红军特种部队则开始准备在半岛上的行动。2月27日，武装团体占领了最高委员会及部长理事会的办公楼，并在莫斯科的指挥下展现了高度的战术准备。到2月28日早晨，辛菲罗波尔和贝尔贝克机场被俄罗斯控制，帮助快速占领战略要地。到3月初，俄罗斯在该地区的兵力估计达到15 000人。随后，科米亚被合并时，由国防军和外国情报部门积极配合，并部署了包括军中第76个空降师在内的机动突击队。除此之外，更多的情报证实，在无线电拦截和业务报告的支持下，部队在胡科沃和顿涅茨克附近移动。\n\n根据分析，俄罗斯总情报局做出了一项决定，即：建立一个专门部门，以持续监测俄罗斯军队行动，并任命新的外国情报部门，布达诺夫，来协调国家安全工作。"
 ukraine.800.a:0 "确认报告并任命部长。"
 ukraine.820.t:0 "哈萨克志愿军抵达乌克兰"
 ukraine.820.d:0 "自从俄罗斯占领哈萨克斯坦之后，许多爱国者不得不背井离乡或前往地下。他们学习了我们对于俄罗斯侵略的抵抗，一群前哈萨克军官和志愿军组成了一支作战单位，并抵达了乌克兰。\n\n营司令努尔兰·卡西莫夫上校在与我们军队领导层的会晤中说：“我们的斗争是一回事，通过为乌克兰的自由而战，我们也正在为哈萨克斯坦的自由而战。在它征服所有前苏维埃共和国之前，克里姆林宫永不停歇。我们不会允许这种事发生。”\n\n这个营由训练有素的战士组成，有许多有特种部队经验。他们带来了一些武器，并准备立即投入战斗。尽管难以穿越占领区，但他们士气高昂，并且他们对于抵抗侵略者的决心坚定不移。"
 ukraine.820.a:0 "团结使我们更强大！"
 kazakh_volunteers_tooltip:0 "向§Y哈萨克自由营§!提供了经验丰富的战斗机和现代装备。"
 ukraine.821.t:0 "乌兹别克志愿军加入乌克兰抵抗组织"
 ukraine.821.d:0 "今天，乌克兰边境上出现了一个不寻常的景象：一群身着乌兹别克斯坦与乌克兰国旗的卡车派出了一群志愿军逃离了俄罗斯占领的乌兹别克斯坦。这个以伟大的帖木儿国家为名的营由前乌兹别克军队士兵和平民爱国者组成。\n\n营司令鲁斯塔姆·阿克赫梅多夫少校在对乌克兰军官的讲话中强调：“克里姆林宫的机器并不区分我们的人民——因为它，我们都是帝国地图上的领土。但我们的人民记住自由的滋味，我们已经准备好与我们的乌克兰兄弟并肩作战。\\n\n乌兹别克志愿军带来了宝贵的医疗人员和装备，这对前线医院特别重要。大多数战士都有服役经验，他们已经表达了参加针对俄罗斯占领者最有挑战性的行动的愿望。"
 ukraine.821.a:0 "我们的斗争正在成为国际化！"
 uzbek_volunteers_tooltip:0 "获得§Y帖木儿营§!经验丰富的医疗人员。"
 ukraine.822.t:0 "格鲁吉亚自由军团抵达前线"
 ukraine.822.d:0 "自从俄罗斯再次占领格鲁吉亚并建立傀儡政权以来，成千上万的格鲁吉亚人被迫背井离乡。今天，其中最优秀的格鲁吉亚人已经抵达乌克兰，组建了格鲁吉亚自由军团。\n\n这已经不是格鲁吉亚志愿军第一次为乌克兰而战了。自从俄罗斯第一次入侵2014年，格鲁吉亚战士在战场上证明了他们的忠诚和勇气。现在，随着他们自己的国家被占领，他们将乌克兰解放作为将整个地区从克里姆林暴政中解放出来的第一步。\n\n军团指挥官乔尔吉·马穆拉什维利将军在与乌克兰总统会晤时指出：\"格鲁吉亚人永远不会忘记2008年，正如乌克兰人永远不会忘记的那样。2014年，我们的记忆和痛苦将我们团结在一起。但今天，我们也被共同的胜利希望联合在一起。自由将通过基辅到第比利斯。\\n\n军团中有许多经验丰富的战士，他们已经在与格鲁吉亚和乌克兰的俄罗斯占领者作战过。他们的机动部队在城市环境和山区地形上特别有效。"
 ukraine.822.a:0 "为了我们和你的自由！"
 georgian_volunteers_tooltip:0 "拥有高机动性的§Y格鲁吉亚自由军团§!。"
 ukraine.823.t:0 "卡斯蒂斯卡利诺斯基军团加入乌克兰部队"
 ukraine.823.d:0 "在克里姆林宫全面控制白俄罗斯的条件下，拒绝承认其傀儡政权的爱国主义白俄罗斯人组建了卡斯蒂斯·卡利诺斯基军团，并抵达了乌克兰。\n\n这支部队的历史始于在顿巴斯第一次冲突中的小团体加入乌克兰营。随着时间的推移，他们的人数不断增加，特别是在残酷镇压白俄罗斯的抗议活动之后。现在，随着俄罗斯完全控制白俄罗斯领土，这个军团已经成为了白俄罗斯抵抗的真正象征。\n\n在誓约仪式上，军团司令，白俄罗斯军队谢尔盖·扬楚克中校宣布：“今天，我们的人民的命运在乌克兰战场上决定。我们从占领者手中保卫的每个乌克兰城市都是解放明斯克、戈梅尔和布雷斯特的一步。我们的斗争是不可分割的。”\n\n卡利诺斯基军团装备精良，拥有发达的支持体系，包括工程、医疗和侦察单位。许多战士都有在白俄罗斯军队精英部队中服役的经验。"
 ukraine.823.a:0 "白俄罗斯万岁！荣耀归于乌克兰！"
 belarusian_volunteers_tooltip:0 "§Y白俄罗斯卡斯蒂斯卡利诺斯基军团§!获得了全面支持。"
 ukraine.824.t:0 "阿塞拜疆旅在乌克兰阵线"
 ukraine.824.d:0 "在被俄罗斯征服后，许多阿塞拜疆军事人员拒绝效忠于新政权并被迫逃亡。今天，一支由这些军官和士兵组成的沙俄旅正与乌克兰并肩作战。\n\n在埃尔山·马梅多夫上校的带领下，这支旅带来了在纳戈尔诺-卡拉巴赫冲突中获得的宝贵经验。他们对现代高技术战争的知识，特别是使用无人机和反坦克系统，可能证明能决定性地对抗俄罗斯的装甲部队。\n\n“我们不能在帝国再次扩张时袖手旁观，”马梅多夫上校宣布道。“今天是苏维埃共和国的防线。如果基辅陷落，自由的火炬就会熄灭。我们不会允许这种事发生。”\n\n阿塞拜疆旅已经以其纪律和技术水平吸引了乌克兰司令部的关注。尽管其规模相对较小，但这支部队在前方的关键位置可能会有很大的影响。"
 ukraine.824.a:0 "他们的经验将是无价之宝！"
 azerbaijani_volunteers_tooltip:0 "与反坦克战专家一起收到§Y阿塞拜疆旅§!。"
 ukraine.825.t:0 "塔吉克抵抗营抵达乌克兰"
 ukraine.825.d:0 "自从俄国占领塔吉克斯坦，并建立起亲克里姆林政权以来，一群塔吉克军事和平民活动家组成了一个抵抗营，克服了无数的障碍，进入了乌克兰领土。\n\n这个营由前塔吉克军队特种部队指挥官鲁斯塔姆·纳扎罗夫领导。“我们的人民被一个共同的过去所团结在一起，不幸的是这是一个共同的威胁。克里姆林宫不会停留在一个国家——它的目标是恢复帝国。我们必须在这里，现在，”他于乌克兰军队开会时指出。\n\n虽然塔吉克营在数量和装备上与其他外国部队相比较差，但其战士拥有山地战和游击战术的宝贵经验。他们中的许多人曾在塔吉克山地旅服役过，熟悉俄罗斯的军事战术和装备。\n\n对于乌克兰军队来说，塔吉克志愿军的到来不仅有军事意义，也有着象征意义的意义，表明俄罗斯侵略的抵抗使来自中欧的人民团结到了中亚。"
 ukraine.825.a:0 "争取自由的战斗是没有边界的！"
 tajik_volunteers_tooltip:0 "获得§Y塔吉克抵抗营§!的游击战经验。"
 ukraine.828.t:0 "亚美尼亚阿拉拉特突击队参战"
 ukraine.828.d:0 "今天，组成“阿拉拉特营”的一大群亚美尼亚志愿兵抵达了乌克兰军队的阵地。当俄罗斯军队进入亚美尼亚，在那里建立了完全的控制权后，许多爱国的亚美尼亚人拒绝接受占领，决定继续在乌克兰土地上作战。\n\n营司令亚拉姆·萨尔基斯扬上校在对乌克兰指挥部的讲话中指出，“历史教会了亚美尼亚人民自由绝不是轻易给予的；你总是要为此而战。今天，不仅乌克兰人和亚美尼亚人，所有前苏联人民的命运都在这些战场上决定。通过赢得这里，我们将开始解放我们本土的土地。”\n\n亚美尼亚战士有着重要的战斗经验，许多人曾参与卡拉巴赫的冲突。他们的反坦克作战技能和在困难的山区环境中作战的能力尤其有价值。这个营装备了精良的技术和武器，志愿军设法在俄罗斯军队完全控制他们的国家之前撤离。"
 ukraine.828.a:0 "欢迎，兄弟们！"
 armenian_volunteers_tooltip:0 "向§Y亚美尼亚阿拉拉特营§!提供炮兵和反坦克专家。"
 ukraine.829.t:0 "土库曼机动分队陷落乌克兰"
 ukraine.829.d:0 "一群土库曼志愿者经过里海抵达了乌克兰，然后通过秘密路线穿过高加索地区到达了乌克兰。尽管土库曼斯坦实行孤立主义政策及随后的俄罗斯占领该国，但这些勇敢的个体还是设法组织抵抗，并最终抵达乌克兰，与一个共同的敌人进行战斗。\n\n土库曼军队前特种部队的指挥官多夫莱特·贝迪耶夫上校率领该支部队。“土库曼尼斯坦多年来一直与世界隔绝，但我们人民一直对自由开放。俄罗斯的占领表明，中立是一种安全幻觉。我们今天就在这里，因为我们明白：如果乌克兰陷落，整个地区将沉入新帝国的黑暗之中，”他在与乌克兰军官会晤时表示。\n\n土库曼志愿者组建了一支机动分遣队，专门进行快速突击和侦察行动。许多战士曾在沙漠地区服役，这使得他们在南乌克兰的开阔空间十分有效。"
 ukraine.829.a:0 "自由团结了所有人！"
 turkmen_volunteers_tooltip:0 "以高机动性和侦察技能获得§Y土库曼机动分队§!。"
 ukraine.830.t:0 "吉尔吉斯山营抵达乌克兰"
 ukraine.830.d:0 "俄国军队占领了吉尔吉斯斯坦之后，相当多的吉尔吉斯军事人员拒绝服从新政权。在排除了无数的阻碍与迫害后，一队官兵设法组织抵抗，最终突破了乌克兰领土，在那里他们成立了吉尔吉斯山营。\n\n指挥官博洛特·阿萨诺夫中校，吉尔吉斯军队一支山地步兵旅的前指挥官，在他对乌克兰指挥官的第一次演说中写道：“我们的人民不仅受到苏联共同的过去的影响，而且还受到追求自由的共同愿望。吉尔吉斯人一直是自由的山民，我们不会接受新的俄罗斯枷锁。通过为乌克兰而战，我们将在今天为吉尔吉斯斯坦的自由而战！”\n\n这个营专门从事困难地形与空中防御的战斗行动。该营的战士在天山地地区有着丰富的作战经验，这使得他们在乌克兰的丘陵和山区的行动具有特别的价值，尽管他们拥有有限的重型武器，但他们的战略训练和战斗精神弥补了这一不足。"
 ukraine.830.a:0 "山鹰加入到我们的斗争中去！"
 kyrgyz_volunteers_tooltip:0 "获得§Y吉尔吉斯山营§!战斗经验。"
 UKR_donbass_conflict_and_crimea_annexation:0 "顿巴斯冲突与克里米亚吞并"
 UKR_donbass_conflict_and_crimea_annexation_desc:0 "2014年，俄罗斯吞并克里米亚并支持顿巴斯的分离主义运动，违反了1994年布达佩斯备忘录。这些事件标志着乌克兰现代历史的一个转折点。13，000人在冲突中丧命，数百万人流离失所。乌克兰失去了7％领土的控制权，仅Donbas的工业损失估计为500亿美元。对侵略者的制裁是国际压力的第一个步骤，但全面战争的威胁仍然存在。"
 UKR_oligarchs_and_economy:0 "寡头与经济"
 UKR_oligarchs_and_economy_desc:0 "乌克兰是经济不平等程度最高的国家之一。到2020年初，超过70%的关键经济部门只由十几个寡头控制。该国最大的大亨财富——里纳特·阿克赫莫佐夫，维克托·平金库克，伊戈尔·科洛莫伊斯基——超过140亿美元，最低工资维持在150美元。乌克兰需要全面去实行分权统治；没有它，经济将仍然受制于私有利益。"
 UKR_corruption_and_power_consolidation:0 "腐败与权力巩固"
 UKR_corruption_and_power_consolidation_desc:0 "地方腐败仍然是乌克兰的一个严重问题。政治权力必须被集中起来，以打击腐败，并在关键国家机构中实施改革。\n\n执法机构的改革，NABU和SAP还没有取得显著成效，而反弹计划和暗影交易仍然在破坏人们对政府的信任。乌克兰人需要一次对腐败的果断打击，否则国家将保持寡头氏族的权力。"
 UKR_presidential_elections:0 "总统大选"
 UKR_presidential_elections_desc:0 "2019年总统大选已经成为对旧有政治精英不信任的象征。伏罗基米尔·泽伦斯基在第二轮选举中获得了73%的选票，取得了该国历史上最大的胜利。然而，新总统缺乏政治经验，使人们对他的实施承诺的改革的能力产生了怀疑。寡头党和亲俄罗斯派已经在寻找恢复政权的方法，如果没有真正的变化，公众的信任可能会很快消失。"
 UKR_path_to_independence:0 "独立之路"
 UKR_path_to_independence_desc:0 "乌克兰面临一个历史性抉择：要么成为一个完全主权国家，要么留在地缘政治参与者的阴影下。俄罗斯对煤气行业的依赖，军队资金不足，以及外部债权人的压力阻碍了发展。为了加强独立自主，有必要发展国内经济，军队现代化，并实施司法改革。妥协的时代已经结束——乌克兰必须证明自己足以适应世界。"
 UKR_european_integration:0 "融入欧洲"
 UKR_european_integration_desc:0 "乌克兰自信地向欧洲前进着。自2017年以来，与欧盟的无签证制度已经生效，与欧洲国家的贸易在2019年增长了7%。然而，腐败和软弱的法律体系在加入欧盟的过程中仍然困难重重。在今后的几年里，国家需要将其立法与欧盟的准则相一致，改革司法系统，并证明乌克兰是欧洲，不是东西方之间的灰暗缓冲区。"
 UKR_secure_western_aid:0 "确保西方援助"
 UKR_secure_western_aid_desc:0 "自从战争开始以来，乌克兰从来自美国、英国以及欧盟的军事援助中获得了超过38亿美元。现代标枪反坦克系统，无人机供应以及武装部队的改革使得乌克兰军队更加强大，但这还远远不够。我们需要进一步增强同北约的合作，吸引新的科技，并按照同盟的标准训练军事人员。没有西方的支持，乌克兰就有独自面对敌人的风险。"
 UKR_develop_domestic_industry:0 "发展本国工业"
 UKR_develop_domestic_industry_desc:0 "乌克兰拥有巨大的工业潜力。该国的军事工业综合体是世界上10家最大的军工制造商之一，但在2014年之后，产量减少了40%。哈基夫、第涅普罗和扎波里日亚的工厂需要现代化，以恢复乌克兰作为一个工业巨头的地位。没有强大的经济，战争就无法胜利——国家需要新的工业化！"
 UKR_defensive_fortifications:0 "防御工事"
 UKR_defensive_fortifications_desc:0 "东方的防御系统是乌克兰的盾牌。然而，截至2020年，只有30%的计划要塞已建成。与俄罗斯交界的“墙”计划尚未完工，战争可能会再次爆发。为了保护国家，我们迫切需要建造防御工事，建造混凝土弹盒，部署水雷。乌克兰必须成为一座要塞，而不是一条横穿敌国的走廊！"
 UKR_territorial_defense_forces:0 "本土防卫军"
 UKR_territorial_defense_forces_desc:0 "组建领土防御部队将动员平民来保卫自己的地区，并释放常规军队去执行其他任务。\n\n在混合战争的条件下，每个州都必须准备好进行防御。领土防御部队的建立将动员数十万后备兵和武装公民。波兰、波罗的海国家和芬兰已经实施了成功的领土防御模式——乌克兰应该走在相同的道路上。"
 UKR_diplomatic_offensive:0 "外交攻势"
 UKR_diplomatic_offensive_desc:0 "积极外交是我们战略的关键要素之一。我们必须增加对侵略者的国际压力，并争取国际社会的支持。乌克兰必须将国际舞台变成一个寻找真理的战场。2019年，一项联合国决议支持了乌克兰的领土完整，但是俄罗斯仍然在承受着外交压力。我们需要加强在联合国、欧安组织、北约的地位，并吸引更多的盟友。外交是21世纪的武器，乌克兰必须完美的掌握它。"
 UKR_national_reconciliation:0 "民族和解"
 UKR_national_reconciliation_desc:0 "内部团结是强大国家的基石。它必须克服地区差异，以共同价值观和目标巩固社会。乌克兰人必须在面对外部威胁的情况下团结起来。亲俄罗斯的宣传与内部冲突削弱了国家，而试图与侵略者“实现和平”的尝试只能触发新的危机。团结就是力量，没有它，乌克兰就无法获胜。是时候结束旧的争端，团结一致面向未来了！"
 UKR_government_corruption_low:0 "乌克兰主权政府"
 UKR_government_corruption_low_desc:0 "许多寡头氏族的影响力已经在我们的政府机构中蔓延了相当长的一段时间。卑鄙的贿赂、勒索和其他滥用权力行为在我们的政府官员中广泛存在。尽管我们已经制定了反贪法，但薄弱的司法系统和恶劣的经济条件使这些法律的执行变得非常困难，即使在某些情况下不是完全不可能执行。"
 UKR_economic_transformation:0 "乌克兰经济转型"
 UKR_economic_transformation_desc:0 "乌克兰的经济体系需要深度的现代化。自独立以来，国家经济就面临着挑战：落后的工业基础、低投资水平以及复杂的行政障碍。政府致力于为企业增长创造有利的条件，改善投资环境，发展极为重要的部门。改革的重要组成部分包括改进税收政策，打击腐败，以及将经济数字化。"
 UKR_big_construction:0 "大型建造"
 UKR_big_construction_desc:0 "国家需要大量投资建设：90%以上的道路状况不尽人意，铁路基础设施贬值超过60%，许多地区缺乏现代化的交通物流。推出“大建设”计划的目的是实现道路网现代化，发展铁路网络并建设新的社会设施。这将创造就业岗位并提高整体经济发展水平。然而，该计划需要大量预算资源，这可能会增加公共财政负担。"
 UKR_digital_economy:0 "数字经济"
 UKR_digital_economy_desc:0 "乌克兰以数字转型为赌注加速经济增长。实施电子服务业、发展信息技术及支持创新企业将有助于增加投资流入，并使公共行政更加透明。其中一个关键的项目将是“迪亚.City”——一个针对IT公司的特殊制度，旨在营造有利的商业条件，这将增强乌克兰在全球市场的竞争力。"
 UKR_startup_support:0 "启动支援计划"
 UKR_startup_support_desc:0 "泽伦斯基总统的行政部门制定了一个支持乌克兰技术创业的全面计划。2000年“人民党的仆人”执政后，政府由奥莱克西·本沙鲁克组建，后来在达尼斯·沙米哈尔统治下，通过了国家数字转型战略。作为“40天商业”计划的一部分，加快企业注册程序并简化了获取许可程序。在米哈伊洛·费多罗夫的领导下，数字变革部的创立是实施乌克兰旨在创建繁荣创新生态系统和经济多元化的数字战略的关键一步。"
 UKR_startup_ecosystem_tooltip:0 "数字乌克兰。发展信息技术基础设施。投资创创科技。"
 UKR_agricultural_reform:0 "农业改革"
 UKR_agricultural_reform_desc:0 "农业是乌克兰经济的重要部门之一，但其效率却受到过时物质基础的制约。超过50%的农业机械经手于既定服务周期之外运转，其机械化程度某些方面仍然很低。实施改革将有利于农业部门的现代化，吸引投资和提高生产力，使乌克兰在全球粮食市场成为强大的参与者。"
 UKR_land_market_opening:0 "开拓陆上市场"
 UKR_land_market_opening_desc:0 "土地改革的启动是发展农业的重要一步。引入透明机制来购买和销售耕地，不仅可以吸引私人投资，还可以增加土地价值。然而，伴随着公众的怀疑与怀疑，因为大片农场可能会出现土地被集中化的风险。国家将承担监督和规范市场的任务，以避免这种后果。"
 UKR_invest_in_infrastructure:0 "投资基础设施建设"
 UKR_invest_in_infrastructure_desc:0 "如果没有高质量的基础设施建设，经济发展就无法实现。投资铁路、港口和后勤现代化将为国家提供新的贸易机会，并加快国内的交通联系。其中一个关键方向将是更新“乌克里兹尼兹尼亚”的滚动储备以及发展高速铁路线，这将改善商业条件并提高人民的生活水平。"
 UKR_reform_general_staff_nato_standards:0 "改革总参谋部：北约标准"
 UKR_reform_general_staff_nato_standards_desc:0 "现代战争需要严格的纪律、专业的指挥和对作战行动的有效管理。将北约标准整合到总参谋部的架构中，将确保世界领先军队层面上的部队协调。这将改善战略规划、作战灵活性以及与盟国的互动。"
 UKR_mobile_tactics_doctrine:0 "机动学说：进攻战术"
 UKR_mobile_tactics_doctrine_desc:0 "快速移动、对敌人关键阵地的果断打击以及对深度突破的追求——这些都是现代机动作战的基础。机械化和摩托化部队的发展将使我们能够应用机动作战战术，这将确保战场优势地位。"
 UKR_modernize_tank_forces:0 "坦克部队现代化"
 UKR_modernize_tank_forces_desc:0 "装甲部队是任何现代军队的骨干力量。使用最新装备对坦克进行大规模重整将提高步兵单位的作战能力、进攻速度和火力支援。投资研发和生产现代坦克将强化我们的防御能力。"
 UKR_blitzkrieg_tactics:0 "闪电战战术"
 UKR_blitzkrieg_tactics_desc:0 "历史已经证明，闪电般猛烈的进攻行动可以在敌人重新集结之前就将其粉碎。发展快速机动、深度突破和坦克、机械化航空部队之间密切互动的理念将使我们能够在任何战斗条件下占据主导地位。"
 UKR_combined_arms_doctrine:0 "平衡学说：联合行动"
 UKR_combined_arms_doctrine_desc:0 "所有军事分支机构的有效互动是胜利的关键。装甲、步兵、炮兵和航空的联合使用将最大化上述各部门的实力。适当的部队协调将为进行进攻和防御作战奠定坚实的基础。"
 UKR_mobile_groups_tactics:0 "移动战群战术"
 UKR_mobile_groups_tactics_desc:0 "机动和速度是现代军事战略的核心要素。建立高度机动的突击小组将使我们能够对前线的变化作出有效反应，迅速将部队集中在关键点，并对敌人发动闪电打击。"
 UKR_consolidate_tactical_gains:0 "巩固战术进展"
 UKR_consolidate_tactical_gains_desc:0 "战场上的胜利不仅取决于娴熟的攻击，也取决于是否有能力坚守敌方阵地。我们将在战略要地部署要塞防线，增强工程部队，确保行动后勤，这将使我们能够最大限度地减少损失，并确保可靠地保留领土。"
 UKR_defensive_doctrine:0 "纵深防御：防御学说"
 UKR_defensive_doctrine_desc:0 "有效的防御不仅需要坚守阵地，还要对部队进行机动，反击和优先保护。发展现代的深层防御概念将使我们能够摧毁敌人，摧毁他们的通信，为转移至反攻创造条件。"
 UKR_endemic_corruption:0 "地方腐败"
 UKR_endemic_corruption_desc:0 "乌克兰的腐败历史悠久，可以追溯到苏联时代。寡头、低效的官僚作风以及薄弱的法制对这个国家的影响，建立了一个腐败渗透到所有政府和业务层次的制度。透明国际研究一贯将乌克兰排在欧洲最腐败的国家之一，估计每年GDP损失4至6%的腐败。这一系统性问题破坏了经济发展，阻止了外国投资，并摧毁了公众对国家机构的信任。"
 UKR_corruption_reforming:0 "反贪婪改革"
 UKR_corruption_reforming_desc:0 "乌克兰已经开始与NABU（国家反腐败局）和国家反贪局（NNABU）及NAPC（国家反贪局）等新的专门机构一起执行一套综合性反腐败框架。尽管这些改革借鉴了罗马尼亚和格鲁吉亚等国家的成功模式，但它们面对着来自利益攸关方的重大阻力。最初的进展令人鼓舞，但仍然十分脆弱，这从战后苏维埃改革的混合成功就可以看出。经济研究表明，降低腐败水平有可能将乌克兰的年GDP增长提高1-2.2%，尽管过渡期常常扰乱既定的商业做法和行政程序。"
 UKR_western_support:0 "西方支援组织"
 UKR_western_support_desc:0 "乌克兰得到了来自西方国家的大量经济、技术和军事援助，提高了它的防御能力和改革潜力。"
 UKR_industrial_revitalization:0 "工业振兴"
 UKR_industrial_revitalization_desc:0 "工业现代化和多样化计划旨在增强乌克兰产品的竞争力以及出口潜力。"
 UKR_territorial_defense_idea:0 "本土防卫军"
 UKR_territorial_defense_idea_desc:0 "新的领土防御系统能动员当地居民来保护关键基础设施并打击破坏组织。"
 UKR_economic_reform_attempts:0 "经济改革尝试"
 UKR_economic_reform_attempts_desc:0 "政府正在努力改革经济，但寡头和官僚机构的阻力减缓了这一进程。"
 UKR_big_construction_idea:0 "大建造项目"
 UKR_land_reform_idea:0 "土地改革"
 UKR_digital_state_idea:0 "口语智能的地区"
 UKR_startup_ecosystem_idea:0 "乌克兰启动生态系统"
 UKR_land_market_idea:0 "开放土地市场"
 UKR_infrastructure_modernization_idea:0 "基础设施现代化"
 UKR_economic_transformation_idea:0 "乌克兰经济转型"
 UKR_big_construction_idea_desc:0 "“大建设”项目是在全国使基础设施现代化的大规模项目。公路、学校、医院和其他基础设施设施正在加快建造。尽管对低效率开支有批评，但该计划刺激了经济并创造了就业机会。"
 UKR_land_reform_idea_desc:0 "开放农业土地市场是一个历史性的决定，结束了多年来的暂停。由于这项改革，土地正在变成一个成熟的经济资产，吸引投资和刺激农业部门的现代化，这是乌克兰经济的主要驱动因素之一。"
 UKR_digital_state_idea_desc:0 "”直通智能电话“计划旨在将政府服务与作战官僚体系数字化。“迪亚”计划让国民可以快捷而方便地使用政府服务，这不仅提高了国家机器的效率，也显著降低了腐败的机会。"
 UKR_startup_ecosystem_idea_desc:0 "政府正在积极地为信息技术部门和创业创造有利的条件。税收鼓励、特殊法律制度以及「创业基金」形成了一个促进创新的生态系统。乌克兰的资讯科技专家以专业水平闻名，正在成为国家的重要的出口资源。"
 UKR_land_market_idea_desc:0 "停止农耕土地销售的暂停使经济的庞大部分“摆脱阴影”。农民利用土地作为抵押，有机会使用信贷资源，投资者有机会投资于有希望的农耕农产企业。尽管外国人受到限制，土地市场仍然刺激了投资的流入，以及农业生产的现代化。"
 UKR_infrastructure_modernization_idea_desc:0 "大规模的运输基础设施现代化可以改善物流并降低运输成本。新的道路、桥梁和升级后的港口不仅加快了货物在全国各地的移动，而且还加强了乌克兰作为欧亚交通枢纽的地位。现代基础设施是实现竞争经济的关键。"
 UKR_economic_transformation_idea_desc:0 "乌克兰经济转型旨在构建欧洲式的现代化竞争经济。正在进行的改革旨在放松管制，将低效的企业私有化，改善投资环境，融入欧洲的经济结构。关键目标是提高公民的福利，加强国家的经济恢复力。"
 UKR_nato_command_structure:0 "北约指挥的建筑"
 UKR_nato_command_structure_desc:0 "乌克兰正在按照北约标准改革其军事系统，从而改善作战规划和指挥管理。"
 UKR_blitzkrieg_doctrine:0 "闪电战学说"
 UKR_blitzkrieg_doctrine_desc:0 "乌克兰正专注于机动进攻行动，这提高了其机械化和摩托化部队的速度和突破力。"
 UKR_rapid_offensive_operations:0 "快速进攻战术"
 UKR_rapid_offensive_operations_desc:0 "我军以闪电般的攻击为导向，在速度和主动性上均胜过敌军，但代价是牺牲了资源需求与组织度。"
 UKR_mobile_battlegroups:0 "移动战斗群"
 UKR_mobile_battlegroups_desc:0 "火炮火力与机械化部队高机动性相结合，使乌克兰部队在战斗中更加灵活与均衡。"
 UKR_consolidation_tactics:0 "巩固阵地战术"
 UKR_consolidation_tactics_desc:0 "我军强调防御学说，提升堑壕 、 要塞化和遏制敌军推进的能力。"
 UKR_fortification_bureau:0 "工事局"
 UKR_fortification_bureau_desc:0 "已经专门建立了一个负责建设防御设施，加强战线，以及保护战略要地的局位。"
 UKR_echeloned_defense:0 "扩大防御"
 UKR_echeloned_defense_desc:0 "乌克兰的防御策略基于多层要塞化工事构建，使敌人的突破更加复杂，损失最小化。"
 UKR_western_military_advisors:0 "西方军事顾问"
 UKR_western_military_advisors_desc:0 "通过与北约的合作，我们引进了西方的军事专家，帮助我们的军队现代化，并改善了战斗训练。"
 UKR_modern_command_and_control:0 "现代指挥控制系统"
 UKR_modern_command_and_control_desc:0 "现代化通讯、情报、协调技术的实施让乌克兰武装部队在战斗中更加高效且有组织。"
 UKR_fortification_construction:0 "建设要塞"
 UKR_fortification_construction_desc:0 "乌克兰一直面临着威胁，而现在我们必须加强我们的防御。建立新的防御工事和防御结构将增强我们的防御，并阻碍敌人的进步。我们还将改进工程技术，以加快防御工事的建造和生产。"
 UKR_deep_defense_tactics:0 "纵深防御战术"
 UKR_deep_defense_tactics_desc:0 "我们正通过实施深入梯度的防御来适应现代现实。这种战术将使我们能够拥有阵地，提高堑壕战的有效性，并减少敌人的攻击伤害。多亏了更好的组织，我们的部队才能经得起更长时间的进攻。"
 UKR_agricultural_boom:0 "农业繁荣"
 UKR_agricultural_boom_desc:0 "土地市场的开放极大促进了农业部门的发展。新的投资、优惠贷款以及改进技术都大大提高了农业生产的效率。乌克兰自信地增强了其作为“欧洲粮仓”的地位，提高了农产品的生产和出口。"
 UKR_slow_land_reform:0 "缓慢的土地改革"
 UKR_slow_land_reform_desc:0 "土地改革的进度比预期的要慢。复杂的官僚程序、法律的不确定性以及持续的不信任限制了土地市场的活动。虽然有些进展是显著的，但改革的全面潜力还远未实现。"
 UKR_digital_leadership_idea:0 "数字领袖"
 UKR_digital_leadership_idea_desc:0 "迪亚计划发展成为了世界上最先进的数字政府之一。乌克兰成为了其他国家公共服务数字化领域的榜样。这项计划的成功不仅使公民的生活变得更加方便，而且还通过最小化官僚系统中的人力因素来显著降低腐败风险。"
 UKR_digital_security_issues:0 "数字安全学议题"
 UKR_digital_security_issues_desc:0 "暴露在政府数字系统中的脆弱性引起了人们对公民个人资料安全的疑虑。为了进行全面的安全审计并解决已经查明的缺点，数字化方面的暂时放缓是必要的。"
 UKR_energy_price_control:0 "地区能源价格监管"
 UKR_energy_price_control_desc:0 "在能源危机的背景下，政府对能源和水电价格实行了严格的监管。这一措施使民众免遭高额关税的增长，但也给国家预算带来了额外的负担，降低了能源部门的投资吸引力。"
 UKR_energy_market_adjustment:0 "电力行业的市场适应性"
 UKR_energy_market_adjustment_desc:0 "政府允许能源价格在市场因素的影响下成立，同时扩大了对低收入阶层的针对性补贴计划。虽然这种做法短期内造成了社会紧张，但它创造了提高能源效率和吸引工业投资的激励措施。"
 UKR_investment_boom:0 "投资激增"
 UKR_investment_boom_desc:0 "成功的投资论坛在乌克兰启动了一系列主要的国际项目。外国直接投资的流入显著加快，创造了新的就业机会，刺激了经济增长。投资者们在信息技术、可再生能源和农业技术等领域尤其活跃。"
 UKR_investment_disappointment:0 "投资者利益不足"
 UKR_investment_disappointment_desc:0 "尽管做了大量的准备，但投资论坛并没有达到预期效果。国际投资者们正表现出谨慎的态度，指出在产权保护、司法制度和公司治理方面持续存在的问题。为了改善投资环境，需要进行额外的改革。"
 UKR_export_focused_industry:0 "出口导向型工业"
 UKR_export_focused_industry_desc:0 "政府积极支持专注于出口的工业企业。根据国际标准，出口信贷、税收奖励以及产品认证援助有助于乌克兰制造商扩大在外国市场的存在。出口收入的增长加强了国家货币，并改善了国家贸易平衡。"
 UKR_domestic_industry_focus:0 "发展国内工业市场"
 UKR_domestic_industry_focus_desc:0 "经济政策的优先事项已经变成了国内工业市场的发展。进口替代产品、政府采购国内产品以及刺激国内需求，旨在构建一个更可持续和自给自足的经济体系，减少对全球市场波动的依赖。"
 UKR_modified_land_reform_idea:0 "土地改革改进"
 UKR_modified_land_reform_idea_desc:0 "在大规模抗议活动后，政府做出了让步并引进了土地改革变革。单手限制土地集中，并赋予了当地社区更多的权力来控制土地交易。这些改变安抚了一些抗议者，但却减缓了改革的步伐并降低了其经济效率。"
 UKR_booming_it_sector_idea:0 "蓬勃发展的信息产业"
 UKR_booming_it_sector_idea_desc:0 "乌克兰的信息技术工业正经历着一个真正的黄金时代。多亏对基础设施的投资，教育，以及对技术企业有利的条件，信息技术服务的出口正逐渐成为外汇流入该国的主要来源之一。“乌克兰硅谷”吸引着越来越多的国际投资者和人才。"
 UKR_it_tax_policy:0 "增加IT行业的税收"
 UKR_it_tax_policy_desc:0 "政府为信息公司增税，改变了这一部门企业家个人的条件。这为预算提供了短期资金流入，但却在行业中引发了不满。一些公司已开始考虑将自己的办事处迁移到拥有更有利税收制度的国家。"
 UKR_construction_investigation:0 "调查“巨型建筑”时的弊端"
 UKR_construction_investigation_desc:0 "在“大建造”计划中发现了大规模的腐败计划后，发起了一次正式调查。许多项目被暂时暂停，招标程序正在接受审查。这对基础设施建设的速度产生了负面影响，但会在未来更有效地使用公共资金。"
 UKR_government_anti_corruption:0 "反贪政策"
 UKR_government_anti_corruption_desc:0 "乌克兰政府发起了一系列的反腐败改革。"
 ukraine.105.t:0 "违反布达佩斯备忘录"
 ukraine.105.d:0 "1994年布达佩斯备忘录为乌克兰提供了安全保障来换取放弃核武器。然而，2014年，俄罗斯其中一个保障者吞并了克里米亚，支持了东乌克兰分裂主义，这明显违背了它的义务。这被召唤了国际条约的有效性，破坏了核不扩散制度。国际社会表示了关切，但是没有采取任何切实措施来恢复乌克兰的领土独立。"
 ukraine.105.a:0 "要求其他签署国履行独立保障！"
 ukraine.105.b:0 "我们只能靠自己的力量了。"
 ukraine.106.t:0 "2020年经济"
 ukraine.106.d:0 "2020年，乌克兰经济形势艰难，人均GDP仍然是欧洲最低水平之一，尽管出口多样化取得了一定成功，但始终依赖原材料。银行系统在2014-2015年危机后已经稳定下来，但对真实部门的贷款仍然有限。寡头群体控制了大部分经济，阻碍了公平的竞争和投资吸引。COVID-19大流行加剧了这些问题，导致了额外的生产削减和失业上升。"
 ukraine.106.a:0 "执行反腐败改革。"
 ukraine.106.b:0 "专注吸引投资。"
 ukraine.107.t:0 "最高拉达与寡头党"
 ukraine.107.d:0 "尽管乌克兰最高拉达的成分重获新生，但它仍然受到寡头主义群体的巨大影响。许多议员代表了大企业的利益，这有时会导致重要改革的阻止。人们正在讨论一项去寡头法案，该法案应该能够限制寡头对政治和媒体的影响。然而，专家们对该法案的有效性表示怀疑。泽伦斯基总统正试图巩固权力以实施必要的改革，但却面临各种政治力量的阻力。"
 ukraine.107.a:0 "通过去政府化法案。"
 ukraine.107.b:0 "寻求与有影响力的团体妥协。"
 ukraine.108.t:0 "总统大选"
 ukraine.108.d:0 "2019年，乌克兰举行了总统选举，导致了政治精英阶层的更迭。沃洛迪米尔·泽伦斯基，一位著名的喜剧演员，在争取战胜现任总统彼得·波罗申科后赢得了令人信服的胜利。他的胜利的原因是社会因腐败而疲惫，东方冲突正在发生，以及上一届政府未兑现的承诺。选民投票支持改革，希望重建政治制度并解决问题。然而，新总统缺乏政治经验，这引起了某些社会阶层和国际伙伴的担忧。"
 ukraine.108.a:0 "泽伦斯基用滑坡取得了胜利。"
 ukraine.108.b:0 "波罗申科可保有权力（替代历史）。"
 ukraine.100.t:0 "独立之路"
 ukraine.100.d:0 "自1991年获得独立以来，乌克兰一直走在建设国家的道路上。今天，这个国家正面临着战略发展方向的抉择。欧洲的一体化和改革仍是一个优先事项，但东部的冲突和吞并克里米亚所带来的严重障碍。政府在实施必要改革的同时，寻求加强防御能力。乌克兰人民对真正的独立、免受腐败和外部影响的愿望越来越发声。选择的道路将决定国家未来几十年的发展。"
 ukraine.100.a:0 "乌克兰定将长存，盛存！"
 ukraine.110.t:0 "外交攻势"
 ukraine.110.d:0 "为了获得国际社会的支援，乌克兰正在加大外交努力的力度。总统和外交部长已经多次访问欧洲首都和华盛顿。有关乌克兰领土完整以及该国东部形势的问题正在国际论坛上提出。我们特别关注了与北约和欧盟的互动以及与关键伙伴的双边关系的发展。这些努力正在取得成果：俄国面临的国际压力越来越大，对乌克兰的支持变得越来越具体和显著。"
 ukraine.110.a:0 "专注于同美国合作。"
 ukraine.110.b:0 "优先级 - 欧洲一体化。"
 ukraine.300.t:0 "围绕阿尔森·阿瓦科夫的丑闻"
 ukraine.300.d:0 "内务部长阿森·阿瓦科夫发现自己正处于腐败丑闻的中心。公众的不满情绪正在增加，降低了人们对政府的信任。"
 ukraine.300.a:0 "这对我国稳定生涯是致命的打击！"
 ukraine.301.t:0 "阿森·阿瓦科夫辞职"
 ukraine.301.d:0 "在经历了几个月的政治纷争和公众压力后，阿森·阿瓦科夫被辞去内务部长职务。他辞职是由于有关执法机构中腐败和低效率的改革所造成的丑闻造成的。\n\n公众反应是混杂的：一些人支持这个决定，认为这是实现政府清洗的一个步骤，而另一些人则认为阿瓦科夫变成了转移人们注意力的“替罪羊”。总统的形象已经受到损害：有些人认为这是软弱和优柔寡断的，另一些人则是对政府恢复信任的尝试。"
 ukraine.301.a:0 "接受后果并任命一位新部长。"
 ukraine_economy.200.t:0 "反对打开土地市场抗议"
 ukraine_economy.200.d:0 "在法律废除了对农耕土地的暂停出售之后，全国爆发了大规模的抗议活动。据社会学家称，大约有72%的人反对以其目前的形式开放土地市场。抗议者——他们中的许多人是小农民和农村居民——对土地被寡头和大型农业财产收归国有的可能性感到担忧。\n\n社会主义党正积极批评土地改革，通过协调抗议行动，已经大大加强了它的地位。在基辅，成千上万的人聚集在沃尔哈夫纳拉达之外，上面写着“人民的土地！”的牌照——以及“拒绝乌克兰的出售！”。\n\n政府应该如何应对这种情况？"
 ukraine_economy.200.a:0 "镇压抗议——土地改革对国家是必要的！"
 ukraine_economy.200.b:0 "考虑到抗议者的要求，对土地改革做出调整"
 ukraine_economy.201.t:0 "信息产业出口繁荣"
 ukraine_economy.201.d:0 "支持经济创生和数字化的计划已经取得了显著成果。根据乌克兰国家银行（National Bank of Untrea）的数据，信息技术服务出口在过去一年中增长了36%，达到了68亿美元。乌克兰的IT专家和公司在全球市场上变得越来越具有竞争力。\n\n信息乌克兰协会指出，在行业工作的人数已经增加到285000人，行业的平均工资高于全国平均水平（3）倍。大型国际公司继续开放在乌克兰的研发中心，受到当地专家的高水平培训和IT公司有利的税收制度的吸引。\n\n一些经济学家建议利用行业不断增长的收入来补充预算，而企业代表则呼吁为进一步增长维持优惠条件。"
 ukraine_economy.201.a:0 "维持对IT产业的增益，并增加支援"
 ukraine_economy.201.b:0 "对资讯科技企业增税——他们买得起。"
 ukraine_economy.202.t:0 "“巨型建筑”计划中的腐败丑闻"
 ukraine_economy.202.d:0 "「南chiGroshi」的一篇调查性新闻报导揭露了在执行「大营建设」计划时的严重违章。据记者称，该计划下的公路建设成本超过平均市场价格30-40%，而且招标系统的组织形式也使得大多数合同都按照同高级官员圈子相关的公司进行。\n\n根据调查，一些项目使用低质量的材料，已经导致几个最近修缮的公路区段的过早恶化。据专家估计，潜在的损坏总量为230亿格里夫尼亚斯。\n\n反对派政客要求立即进行调查并让几名官员辞职。我们该如何应对这一丑闻？"
 ukraine_economy.202.a:0 "展开全面反贪调查"
 ukraine_economy.202.b:0 "淡化丑闻并继续“建造巨头”计划"
 ukraine_economy.203.t:0 "土地改革的首要成果"
 ukraine_economy.203.d:0 "自从土地市场开放以来，已经过去了足够长的时间来总结这一历史性改革的最初成果。根据农耕政策部的说法，在头6个月中，农耕土地上有超过42000公顷的土地交易，面积超过10万公顷。\n\n乌克兰国家银行指出，农业生产者获得信贷的能力有了显著提高——银行已经开始积极接受土地作为抵押。与去年同期相比，农业部门发放的贷款增加了24％。\n\n然而，专家对改革的结果进行了含糊的评估。一些经济学家指出，土地价格低于预期，并且外国在农业部门的投资比例并没有像预期那样显著增长。反对派政治家继续批评这一改革，并指出了垄断土地市场的风险。"
 ukraine_economy.203.a:0 "改革成功刺激了农业部门发展。"
 ukraine_economy.203.b:0 "改革结果低于预期——需要进行调整"
 ukraine_economy.204.t:0 "「国通智能听力」计划的成功"
 ukraine_economy.204.d:0 "“迪亚”应用程序正成为欧洲最成功的数字变革项目之一。根据数字变革部的数据，超过1200万乌克兰人已经在使用该软件，且可用的数字服务数量超过70。\n\n数字护照、驾驶执照、出生证明和其他智能手机文件极大地简化了公民的日常生活。根据一项社会学调查，76%的使用者积极评价了此应用，乌克兰已经在公共服务数字化方面进入TOP-10国家。\n\n然而，最近有报告称，该系统出现了一些严重的技术故障以及保护个人数据的潜在漏洞。神经安保专家警告，需要强化国家数字系统保护。"
 ukraine_economy.204.a:0 "继续开发项目并加强网络安全"
 ukraine_economy.204.b:0 "暂停安保审计方面的系统扩展"
 ukraine_economy.205.t:0 "能源危机"
 ukraine_economy.205.d:0 "乌克兰受到了严重的能源危机的打击。欧洲市场里的天然气价格以每千立方米的1900美元的速度飙升，导致电力和供暖成本的急剧上升。据能源部统计，热电厂仓库的煤炭储量严重低落——少于600，000吨，所需吨量至少为150万吨。\n\n许多工业企业已经因能源价格高企宣布暂时停产。社会学调查显示，25%以上的乌克兰人担心即将升温的水电费。\n\n该国政府需要紧急采取措施来稳定能源部门的局势。"
 ukraine_economy.205.a:0 "引入国家对能源价格的监管"
 ukraine_economy.205.b:0 "允许市场做出调整，为人口中最脆弱的部分提供补贴"
 ukraine_economy.206.t:0 "投资论坛“采购：未来即刻开始”"
 ukraine_economy.206.d:0 "大型投资论坛“未来开始！”在基辅国际展览中心开幕。来自42个国家的500多名商业代表出席了这次活动，其中包括来自大型国际公司和投资基金的代表团。\n\n泽连斯基总统亲自介绍了乌克兰的投资潜力，强调了在数字化、基础设施建设和土地改革方面的成就。论坛特别关注了信息技术部门、可再生能源、农工业综合体和物流项目。\n\n据经济部说，价值超过50亿美元的30多个投资项目已经准备就绪。论坛的成功实施可能是国际投资者了解乌克兰实现经济突破的重要信号。"
 ukraine_economy.206.a:0 "签署重要投资项目备忘录"
 ukraine_economy.206.b:0 "外国投资者谨慎——论坛没有满足预期"
 ukraine_economy.207.t:0 "乌克兰全球市场的工业"
 ukraine_economy.207.d:0 "在基础设施现代化和工业能力升级后，乌克兰企业已经开始更加积极地进入国际市场。根据国家统计服务，工业产品的出口比上一年增长18.7%。\n\n机械工程增长尤为明显（+24.3%）、食品工业（+19.6%）和冶金业（+15.2%）。大流行之后全球经济的复苏为乌克兰出口者创造了有利的条件。\n\n专家指出，运输基础设施现代化显著改善了物流，降低了向外国买家提供产品的成本。然而，人们担心，太积极的向外部市场发展可能会使经济容易受到全球经济形势波动的影响。"
 ukraine_economy.207.a:0 "支持出口商，加强在国际市场的存在"
 ukraine_economy.207.b:0 "专注于发展国内市场以提高经济恢复能力"
