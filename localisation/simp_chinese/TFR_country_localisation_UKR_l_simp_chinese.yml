 UKR_corrupt_army_staff: "腐化军队参谋"
 UKR_corrupt_army_staff_desc: "我们国家军队高层对腐败并不陌生，这是一个可悲的事实。贿赂无论何时上岗还是内行我国军事学术进步，都横行无忌，连我们高层中的许多人常常在追求个人富强而不是让国家尽其所能地为国家服务。这已经削减了我们军队总的效率，而这也很遗憾地反映了整个军队的表现。"
 UKR_government_corruption: "乌克兰主权政府"
 UKR_government_corruption_desc: "许多寡头氏族的影响力已经在我们的政府机构中蔓延了相当长的一段时间。卑鄙的贿赂、勒索和其他滥用权力行为在我们的政府官员中广泛存在。尽管我们已经制定了反贪法，但薄弱的司法系统和恶劣的经济条件使这些法律的执行变得非常困难，即使在某些情况下不是完全不可能执行。"
 UKR_minsk_protocol: "明斯克议定书"
 UKR_minsk_protocol_desc: "\n\n\n£GFX_英国R_minsk_protocolor\n\n\n\n\n\n\n2014年和2015年，该国政府与俄罗斯联邦和欧安组织达成了协议，目的是终止与顿巴斯地区分裂主义者的其他重大战斗。虽然战争已经不可避免地再次爆发，但根据该协议，已经制定了新的指令，以最大限度地减少战斗规模以及两支作战部队所受的伤害。除了停止进一步针对叛军的进攻性敌对行动外，还将从指定地区移除所有远程火炮装备，这是我们签订的明斯克二号修订协议的两大主要要求。我们将遵守上述协议，并停止更多针对俄罗斯分裂主义者的攻击。"
 UKR_mass_insurgency: "对顿巴斯的冲突"
 UKR_mass_insurgency_desc: "随着顿涅茨克人民共和国和卢汉斯克人民共和国分裂出来的各个邦国，这两个非法国对我们发动了营攻，意图“解放”乌克兰土地上的俄罗斯少数民族。在他们的努力中，组建了叛乱团体来与我们的军队作战，这已被证明是有效对抗我们的。"
 UKR_embargoed_economy: "经济禁运"
 UKR_embargoed_economy_desc: "随着俄罗斯对克里米亚的敌意夺取，我们与全世界的贸易已陷入瘫痪。由于无法进入大型海盗港，我们的船只没有大型装载与运输货物的枢纽，使我们的出口经济陷入一片混乱。"
 UKR_ukrainianrussian_church_schism: "乌克兰东正教会"
 UKR_ukrainianrussian_church_schism_desc: "2018年10月，在君士坦丁堡圣会议下决议批准乌克兰东正教会独立。这在很大程度上是俄罗斯正教会一些乌克兰神职人员被驱逐后的政治举措，君士坦丁堡与莫斯科之间的分裂在15日正式拉开帷幕，此时俄罗斯正教会的圣会议正式禁止莫斯科牧首区所有成员参与圣餐、洗礼与婚姻。这一结果引发了人们对东正教在欧洲东方政治中的地位的争论，并且在很大程度上被乌克兰民众视为乌克兰独立于俄罗斯的另一步——尽管这导致了两国之间的紧张关系。"
 UKR_novo_conflict: "§Y我们将遵守协议并停止对俄罗斯分离主义者的攻击。§!"
