l_simp_chinese:
 BM_HISTORY_TITLE: "历史简介"
 GATHERING_STORM_NAME: "勇敢的新世界"
 GATHERING_STORM_DESC: "当世界步入21世纪时，社会的新层面开始形成。政治变革的开端是早已存在的实体逐渐走出其初始版图，互联网能够向全球广大民众广播任何形式的表达方式，这在社会内部创造了新的财富。新旧的冲突也在广阔的海洋和沙中不起眼的线上公开和努力地进行。也许地球必将再次陷入混乱。也许混乱本身正在转瞬即逝。在这个世界上，只有你能够决定。"
 FIRE_NAME: "§Y点亮配对界面§!"
 FIRE_NAME_DESC: "世界已经从动荡的2000年代和相对平静的2010年代初期走出，世界似乎已经准备好迎接自1991年以来最大的动荡。随着反建制的唐纳德·特朗普的再次选举迅速逼近，东欧和亚洲的紧张局势不断升温，以及全球各地的极端主义不断蔓延。世界的预测似乎已经暗淡而令人不安的“新日冕病毒”在中国酝酿，似乎这个世界的火药桶上拉开了火花。"
 ENG_GATHERING_STORM_DESC: "欧洲联盟比以往任何时候都不受欢迎。英国人很快将自己国家的一切错误都归咎于布鲁塞尔的官员以及柏林的德国政府。人们在这个特殊的问题上产生了深刻的分歧。英国已经从2008年的经济危机中恢复了过来，但离开欧盟将可能摧毁过去十年的经济进展。即使这样……国家主权也比不上经济的小收益吗？"
 FRA_GATHERING_STORM_DESC: "法国在巴黎遇到了经济困难和重大的恐怖袭击，导致社会和政治紧张局势加剧。在这些挑战中，民众对穆斯林和犹太社群的情绪日益两极分化。民族主义政党，即国民阵线，在这个困难时期看到了获得政权的机会。\n\n民主机构和法国欧洲一体化将延续下去，还是法国能在美好的旧日中像自己一样独立自主？"
 GER_GATHERING_STORM_DESC: "德国受到了难民危机、经济困难和对希腊、意大利和西班牙等国家内部憎恨的加剧，仍然虎视眈眈。欧洲联盟继续向南扩张，而德国的政策受到了邻国越来越多的批评。\n\n是该继续走这条道路，还是应该重启旧的边境冲突，让士兵们再次行进？"
 JAP_GATHERING_STORM_DESC: "日本每天都面临着战争的可能性，中国的舰队正积极接近成岛群岛，朝鲜发射的导弹也在平流层发射。最近，日本宪法第9条修正案允许更加活跃的军队驻扎国外。\n\n尽管这种军事主义的转变不受欢迎，但对未来几年的国家安全来说，这可能是至关重要的。"
 ITA_GATHERING_STORM_DESC: "没有任何7国集团国家与欧洲4国像意大利一样受到2008年经济危机的强烈影响。国家恢复速度缓慢，政府的支持度下降。非洲移民的流入并不能带给人们国内稳定的形象。意大利需要考虑她的选择。当然，现在不是复兴帝国主义的时候，但需要进行大刀阔斧的改革……"
 PRC_GATHERING_STORM_DESC: "曾经不可战胜的东方巨头正慢慢觉醒。随着共产党比以往更加强大、更加充满活力，中国挑战超级大国之位的工作正在进行当中。然而，依然存在许多重大挑战：经济失衡、环境污染、内部斗争的沉浮、动荡不定的国际前景。通向未来的道路任重道远，困难重重，险象环生。\n\n中国需要直面这些挑战，数十亿人的未来错综复杂地与结果联系在一起。"
 RAJ_GATHERING_STORM_DESC: "印度的经济正在快速增长，其人口也在迅速增长。虽然在国际聚光灯下仍不大，“虎”也有良好的饮食和咆哮。印度正在狩猎，其猎物也时刻毫无防备。"
 SPR_GATHERING_STORM_DESC: "同其他南欧国家一样，西班牙在2008年陷入了经济危机，这需要来自北欧经济的经济刺激。波德莫斯和城邦给旧政治系统带来了新的民粹主义和新的不确定性，而加泰罗尼亚的独立运动则比以往任何时候都更威胁到西班牙的统一。\n\n经济复苏将是一条漫长而艰难的道路——西班牙会与欧洲站在一起，坚持避免迫在眉睫的灾难的协议——还是西班牙的未来不同于北欧的未来？"
 SOV_GATHERING_STORM_DESC: "1991年苏联解体后，很显然俄罗斯的荣光之路不会轻而易举。虽然制度和经济欠佳，但军队庞大不堪，却落后于时代，政治扩张被削弱，俄罗斯不得不屈尊袖手旁观十年。现在它希望回到注意力的中心。"
 USA_GATHERING_STORM_DESC: "内部的分裂比以往任何时候都更加严重，外部的挑战比冷战结束以来的任何时期都要严重，美国显然不生活在一个国家的黄金时代。她的人民越来越警惕中国的侵略、工业衰退和经济困境，而公众对美国军事同盟的支持也逐渐消失。美国总统将面临重新定义它真正意味着什么——成为地球上最伟大的国家、自由之地和勇敢者的家园的任务。"
 UKR_GATHERING_STORM_DESC: "在尊严革命之后，乌克兰面临了吞并克里米亚和在顿巴斯的战争。布达佩斯备忘录遭到了违反，俄罗斯的侵略还在继续。国内正在进行改革，但经济仍然脆弱，冲突有可能升级为全面战争。乌克兰站在了十字路口：加强防御，向西方更进一步，或发现自己身处火线之下。"
 OTHER_GATHERING_STORM_DESC: ""
