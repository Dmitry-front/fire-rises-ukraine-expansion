l_simp_chinese:
 UNIT_BALANCING: "§W火势已经完全淹没了所有单位，并增加了6个新的军团和4个新的单位。新单位如下："
 UNIT_MILITIA: "§W民兵£unit_militia_icon_small:需要步兵装备与反坦克装备以节省与低廉的成本部署。"
 UNIT_MOT_MILITIA: "§W摩托化民兵£unit_mot_militia_icon_small：更替常规摩托化。其参与度更高，但HP较低。需要步兵装备、摩托化装备、防空和反坦克装备以及装甲ATGMs"
 UNIT_RECCE: "§W规制£unit_recce_icon_small:敌军或侦查步兵比轻步兵或民兵更轻、更快。需要步兵装备、支援装备、反坦克武器和防空装备"
 UNIT_SPECIAL_FORCES: "§W特种部队£unit_special_forces_icon_small：特种部队拥有最高的组织和生命值。拥有最长的训练时间之一。需要步兵装备、反坦克炮和防空装备以及支援装备。"
 UNIT_SPAA: "§W自行推进防空炮：自行防空炮被重新加入游戏，与同型号相比几乎没有什么变化。需要SPAA装备。"
 UNIT_COMPANIES: "§WMBT公司、装甲制造商、SPA公司和SPAA公司是4个新的辅助公司。它们的使用和设备需求本身就是前置。"
 GENERAL_BALANCE: "§W于§!§C火力崛起§!§W与§!§C£cn黎明§!相似，§W添加了一些调整。没有战斗宽度，3个以此为单位添加步兵营，而在4个单位中添加了机动营，使得你更倾向于增加战斗宽度。某些学说也增加了战斗宽度来支持连队。单位越重，战斗宽度就越大。请不要编成15w的步兵编制，你将付出沉重的代价，士兵被指示只制造盔甲和机械化部队。步兵科技到2020年时只给机械化、轻机械化和摩托化部队提供加成。一些部队在现代设定中已经没有用处而被移除。移除的单位包括：所有中型SPAA、坦克、SPAA炮。所有重型、SPAA、坦克、自行火炮、轻型SPAAA和SPA自行火炮。所有草原炮的牵引式乔宾炮。山地步兵和骑兵§!"
 UNIT_UPKEEP: "每个营都有其§R维持费用§!，将从你方的§C最大可用§!§Y每月§!中作为军事花费扣除。记住，重构40万装甲师是发展你经济的好办法。\n§Y民兵§!：1百万\n§Y摩托化民兵§!：4百万\n§Y轻步兵§!：100百万\n§Y海军陆战队§!：300万\n§Y炮兵§!：700万\n§Y伞兵§!：400万\n§Y精锐步兵§!：20百万\n§Y特种部队§!：500万\n§Y摩托化部队§!：80百万\n§Y自行驱动防空火炮§!：80百万\n§Y轻型机械化机械化部队§!：80百万\n§Y机械化部队§!：90百万\n§Y自行火炮§!：100百万\n§Y自行火炮§!：100百万\n§Y两栖坦克§!：120百万\n§Y主战坦克§!：150百万"
 ABT_MOD: "《火之崛》是我们在2020年1月1日至2020年1月1日建立的模组。无论从开局看什么情况都与我们目前的时间表不同，但是它会在游戏后期出现。“火之崛起”（亦或者简称TFR）是一款非常适合决议栏（Paradox对moders最有祝福）、聚焦树和事件的模组。要跟上它们是很重要的，因为没有它们，你的游戏就不会按照预期工作，你可能会输或者输掉游戏，所以一定要注意。\n\n我们已经为这款模组奉献了我们的内心和灵魂，希望你们能够享受我们辛勤劳作的成果。"
 DISCLAIM: "“圣火崛起”的制作者§R不§!支持或支持在本mod中显示的任何极端意识形态或团体。这不过是虚构的作品。"
 CONTACT: "§W话虽如此，但我们希望你们能参与mod并加入我们的争端！"
 FEAT_: "§W满足国家：\n§Y[USA.GetNameWithFlag]§!\n§Y[PRC.GetNameWithFlag]§!\n§Y[SOV.GetNameWithFlag]§!\n§Y[FRA.GetNameWithFlag]§!\n§Y[GER.GetNameWithFlag]§!\n§Y[JAP.GetNameWithFlag]§!\n第二满足的美国内战阵营：\n§Y[ATW.GetNameWithFlag]§!\n§Y[APA.GetNameWithFlag]§!\n§Y[NSM.GetNameWithFlag]§!\n§Y[PTF.GetNameWithFlag]§!\n§Y[USB.GetNameWithFlag]§!\n§Y[USC.GetNameWithFlag]§!\n以及更多在游玩时可找到。"
 ABT_MONEY: "§W系统虽然简单，但是深度很高。\n你将每月增加§G收入§!和§R支出§!。"
 ABT_MONEY_2: "在火花崛起阶段，现实§GGDP§!是经济实力的重要衡量指标，代表了为£inflation 通货膨胀调整的夜币§GGDP§!，清楚了解实际经济情况。现实§GGDP§!是理解§Y债务对GDP比率§!的关键，因为§R债务§!相对于实际§GGDP§!表示潜在的经济§R不稳定§!。现实§GGDP§!由§Y商业价值§!、§Y个人价值§!、§Y社会支出§!、§Y军事支出§!和§Y出口§!进行计算，然后§R减去§!§Y进口§!。每年的总调整为£inflation 通货膨胀，以反映国家的真正经济产出。\n\n£in通货膨胀是指国家经济的总体价格上升，进而侵蚀了购买力。£inflation 通货膨胀受§Y利率§!法律和货币供应变化的影响。管理£inflation 通货膨胀至关重要，因为高£inflation 通货膨胀会导致经济困境和惩罚，而£inflation 通货膨胀会导致进一步衰退。\n\n§R负债§!代表政府负债。当国家面临月度§R赤字§!时，缺乏足够的§clquitience§!——即可用于立即使用的§R债务§!增长。必须谨慎管理：如果§Y债务对GDP比率§!超过一定阈值，因降低投资者信心而减少减益。控制§R负债§!可以促进国家稳定、鼓励国家繁荣。你可以通过“自动支付”或直接在§Y「经济和贸易」§!标签页中支付§R债务§!。\n\n§Y利率§!会影响每月的§R债务§!付款，是§R支出§!的关键环节。更高的利率会提高§R债务§!的花费，使得监测和管理避免无法管理付款和不稳定相当重要。\n\n§R霸权§!是通过税收获得的§R支出§!储备，对于§Y军事维护费§!（§Y陆军§!、§Y海军§!、§Y空军§!、§Y军事工业§!）和§Y社会开支§!至关重要。如果§C雄心§!低于零，则会增加为§R债务§!，必须偿还。\n\n£de乌洛普发展度根据修正每月改变，或可以通过§Y国策§!和§Y决议§!§G增加§!或§R减少§!。如果£de乌洛普发展度达到§G100%§!，其将§G提升§!一个等级，并§R降低§!£de乌洛普发展度§G100%§!。如果£de乌洛普发展度达到§R-100%§!，则会§R下降§!一个等级，并使£de乌洛普发展度§G增加§!§G100%§!。£devolpsation 发展度对于确保国家每一个部分都处于§G最大§!程度来说§G很重要§!。\n\n§Y发电厂§!、§Y能源农场§!和§Y核反应堆§!是被称为§Y“发电厂”§!的建筑类型，它允许你获得各种§G地区加成§!，并且是在一个地区§G增加§!§G建筑槽§!的主要方式，因为§Y工业科技§!不再这样了。然而，每种类型的§Y发电站§!都与对方§R互斥§!，且§R不能建在相同地区§!，所以需要调整它们的位置。\n\n决定§G收入§!和§R支出§!的变量列表可以通过查看§Y“经济和贸易”§!标签来查看。"
 ABT_MONEY_3: "§W正如人们所说，这个系统非常容易掌握。除了美国之外，大国在管理其经济上应该没有问题。对这一模组所做的大部分修改是为了防止小国陷入整个游戏的负面。"
 ABT_MONEY_4: "§Y中华人民共和国§!§W是使用货币系统的最大国家之一。游击COVID，帮助其他国家，找到治愈方法，其他行动需要你大部分资金的使用。不过，如果你经费管理不当，国家就会被病毒摧毁……希望它不会得逞吧。"
 ABT_MONEY_5: "§W要想在§R第二次美国内战§!中扮演次要阵营，你只能用火药节省你的风味。如果大部分战争中存在的话，大多数阵营都不会拥有§Y民用§!或§Y军用§!工厂。你赚的钱应该用于为你的部队购买装备。请注意，并不是所有的装备都可以买到，有一些质量更低。你可以以低廉的价格购买超过1500辆§YPA卢蒂斯§!，但它们不能在战场上坚持多久……你的钱到哪里去了？谁给你提供这些武器？这是一个贸易秘密。"
