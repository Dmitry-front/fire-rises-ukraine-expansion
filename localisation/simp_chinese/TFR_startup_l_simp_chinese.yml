 UKR_country_summary: "§Y国家概况§!：\n乌克兰在苏联崩溃后获得了独立，并继续在动荡的世界上寻求自身的道路。该国在东西方之间取得了平衡，经历了两次革命，顿巴斯也陷入了持续的冲突。到2020年年初，国际形势正在变得越来越不稳定。世界正陷入混乱，乌克兰正处在地缘政治风暴的中心。在西方，曾经强大的美国正处于内战的边缘，而在它的东部邻国——俄罗斯——的复仇情绪正在加剧。在这种情况下，新当选的总统泽伦斯基沃洛迪米尔·泽伦斯基（Voldymyr Zelensky）没有政治经验，他试图在不同势力的利益之间斡旋，力图维护乌克兰的主权和领土完整。\n与俄罗斯即将爆发的冲突可能升级为全面欧洲战争，乌克兰会挺过即将到来的风暴，还是会成为新世界秩序中又一个牺牲品？这个国家的命运现在就掌握在你的手中。"
 UKR_country_paths: "§Y国家路径§!：\n§B- 沃罗迪梅尔·泽伦斯基（人民公仆）§!§!\n这是乌克兰火势崛起子模组的第一个版本，大多数还在开发中。目前，只有沃罗迪梅尔·泽伦斯基路线得到执行，其基础的焦点和决议（媒体化与文化还有待准备）。军事部分仍然不发达，未来的版本将添加许多与俄罗斯联邦不可避免的冲突相关的决策、焦点和事件。你的反馈对我们来说非常有价值！下一个版本计划包括事件图标和照片。感谢您对这个项目的理解和兴趣！"
 UKR_country_other: "§Y来自英国R-TFR开发者的建议：§!\n- 利用直到2025-2026年的时间为与俄罗斯不可避免的冲突做准备。 - 鉴于美国的混乱，寻求欧洲的新盟友。 -§Y军队现代化§!对于生存至关重要。 - 监控俄罗斯的发展，日里诺夫斯基、梅德韦杰夫或日加诺夫的崛起可能会影响敌人的战略。 - 内部稳定与军事准备同样重要。 - 准备好与俄罗斯的冲突，升级为泛欧战争。 - 欢乐吧！"
 UKR_country_note: "§Y开发者记录：§!\n这是乌克兰火升引擎的首版，还有很多还在开发之中。目前，只有沃罗迪米尔·泽伦斯基路线才得以实施，其基础国策和决议（媒体化与文化尚不明确）。军事部分仍然不发达，未来的版本将添加许多决策，国策，以及一些与与俄罗斯联邦不可避免的冲突有关的事件。你的反馈对我们来说非常有价值！下版本计划添加事件图标和图片。感谢您对这个项目的理解和兴趣！"
 USB_caligula_country_summary: "§R《国家总览》§!：\n美国是建立在古老的骨头上的民族，这个概念注定要永远持续下去。\n\n许多人试图撕碎它，苏联人试图尝试，日本人试图，中国人试图，纳粹试图。\n然而今天，正是自己的人和女人试图撕裂唯一一个致力于自由的国家，那些想破坏多年进步的暴君。第一次内战已经证明，只有强烈的控制才能引导我们度过这场内部风暴，就像天鹅放薄了羽毛，必须做出牺牲一样。\n\n每个愿望，每一个欲望，每一个耳语和祈祷都已经抵达总统的耳边。\n压力，痛苦和哭泣，就像肩膀的重量一样。\n任何人都会开明或开明。\n\n我作为美国的化身，我们的民主正受到攻击，首都D。\n各地都有叛徒，就像吸血鬼一样潜伏着，自由是我们神圣的水，奉献了脊梁来刺穿他们的心，我们是美国人，我们从不投降，我们从未放弃。\n\n我看到上帝，民主，他们说到启程，将一切交给你。\n你知道，有时人们就像一个凤凰一样，不好过。\n有时候你必须像一个凤凰一样，摆脱寄生虫。\n\n这些叛徒已经证明他们并不打算求和平或求情，我们也不会同意。\n房子就在山上，家人在哭泣。\n没有自由之树，整片森林终将成真。"
