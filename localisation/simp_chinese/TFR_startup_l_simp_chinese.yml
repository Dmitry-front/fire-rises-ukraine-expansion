 TFR_ldpr_info_tooltip: "§8LDP§!是俄罗斯的民族主义政党，以其民粹主义和经常存在争议的立场而闻名于世。由§8维迪米尔·日里诺夫斯基§!于1991年创立的§8LD PL§!将自由主义和民族主义相结合，倡导建立强大的中央集权政府，保护俄罗斯的利益，以及保守的社会价值观。\n\n\n£GFX_LDPR_intro_texticon\n\n\n\n\n\n§8维迪米尔·日里诺夫斯基§!，长期担任§8LD 元首§!的领袖，是俄罗斯政治中一位家常便饭、直言不讳的人。他以挑衅性言论和戏剧风格而闻名，§8日里诺夫斯基§!自1990年代初在俄罗斯政治格局中一直声名远扬。尽管他的言论备受争议，§8日里诺夫斯基§!还是对其强烈的国家主权和反西方情绪立场获得了支持。\n\n在§8日里诺夫斯基§!的领导下，§8波兰人民党§!保持着在俄罗斯议会的存在，并且经常在关键问题上与执政党结盟。虽然批评家们指责§8PLD§!是“受控的反对派”政党，但§8日里诺夫斯基§!富有魅力的领导层和民族主义纲领一直在俄罗斯人口中吸引忠诚的追随者。"
 TFR_cprf_info_tooltip: "§R中俄共§!是俄罗斯一个突出的左翼政党，主张社会主义政策、工人权益和维护社会福利计划。作为§R苏联共产党§!的继任者，§R中俄共§!于1993年创立。在俄罗斯政治中有着显著的影响力，特别是在与§C统一俄罗斯§!的执政党相反。\n\n\n£GFX_CRF_intro_texticon\n\n\n\n\n\n\n§R根纳季·齐加诺夫§!自建国之初就是中共和党的领导人，以对共产主义意识形态和俄罗斯资本主义改革的坚定支持而闻名。§R齐加诺夫§!多次竞选总统，将自己定位为工人阶级的捍卫者，并批评现政府的政策。尽管面临其他反对派人士的挑战，§R中俄共§!仍然是§R中俄共§!的重要人物，也是俄罗斯政治中支持社会主义原则的代言人。"
 TFR_ur_info_tooltip: "§C“统一俄罗斯”§!是国内的重要政治力量，以其与政府和总统§Y弗拉基米尔·普京§!的密切联系而闻名。该党成立于2001年，提倡保守和民族主义的政策，强调稳定、国家团结和经济发展。§C“统一俄罗斯”§!因其对政治权力的严格控制以及选举欺诈的指控而受到批评，但它仍然是俄罗斯的执政党，掌握着国家杜马的大部分权力，并控制了许多地区政府。\n\n\n£GFX_intro_texticon\n\n\n\n\n\n\n在§CMedvedev's§!的领导下，§C“统一俄罗斯”§!继续发扬其传统的价值观和强大的领导力，并注重加强俄罗斯在全球的地位。尽管存在一些内部分裂和挑战，但该党在俄罗斯的政治中保持了主导地位，其政策与战略在塑造中扮演了关键角色。"
 TFR_jr_info_tooltip: "§p 光是俄罗斯§!是俄罗斯的社会民主政党，主张社会正义、福利政策以及混合经济。\n\n\n£GFX_JR_intro_texticon\n\n\n\n\n\n\n\n\n政党由以温和务实治理而闻名的老政治家§pSergei Mironov§!领导。§pMMironov§!是联邦委员会前议长，多年来一直是俄罗斯政治中的关键人物。在他的领导下，§pA 正义俄罗斯§!已经确立作为工人阶级的声音，以及进步社会政策的支持者。\n有传言说，§pP“只有俄罗斯”§!可能在未来与较弱的政党合并——对于俄国的真理与爱国者来说。与较弱的政党合并的希望为§p俄罗斯§!提供了扩大支持和呼吁范围的机会。通过与其他具有相同价值观和目标的政党建立战略联盟，§pA 光是俄罗斯§!就可以增加选举前景，并可能获得更多的杜马席位。这种合作方法也可以帮助政党巩固资源，简化其信息，并向选民提供一个更有凝聚力的平台。"
 TFR_liberal_info_tooltip: "§6自由反对派§!是俄罗斯的非系统政治力量，主张激进改革，与西方建立自由选举和友谊。 §6自由非系统反对派§!包括了被政治体系“排挤”的政党，因为他们缺乏在政府结构中的代表以及与统治集团互动，如§6“未来罗斯马”§!和§6PARNAS§!。他们多用非常规的政治斗争方法，资源有限，特别是在社会网络上特别活跃。\n\n\n£GFX_Freecrates_intro_texticon\n\n\n\n\n\n\n§6反对派§!没有官方领导人，但最近§6亚列克谢·奈奈§!非常适合担任这种候选人，也是反对派最杰出的人物。他建立了§6反贪婪基金会§!，负责新闻调查，据称是公开俄罗斯政府最高机关的腐败计划。\n\n多亏了他的调查，§6亚列克谢海军§!设法获得了广泛的观众，他组织了大量的支持者对抗腐败的集会和收集捐赠，继续非系统对抗政府的斗争。"
