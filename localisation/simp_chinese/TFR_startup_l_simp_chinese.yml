 SYR_country_summary: "§Y国家总览§!：\n叙利亚陆军由一整支由职业士兵、东印度兵、土卫兵和陆战队员组成的乌合之众。最初它有能力防御，但缺乏在进攻时区分开来的能力。"
 SYR_country_paths: "§Y国家分支§!：\n叙利亚有2条通用的MD路径…§Bba§!§Wsh§!§R阿尔德§!或§BSS§!§WN§!§RP§!"
 SOV_country_summary: "§Y《国家总览》§!：\n曾经有人说过，俄罗斯是一个谜，包缠在谜团中。这样的短语雄辩地告诉了西方的莫斯科，以及“另一个”的说法。这是一个神秘而难以捉摸的土地，由自己的规则扮演。是一片不毛之地，有着艰难的气候和坚韧的人民。\n像俄罗斯这样的国家，在20世纪末遭受如此悲剧是最合适的，然而，继续崛起。每次，俄罗斯的熊会再次回归。每次，它都会变得更加强大，更危险，更团结。\n弗拉基米尔·普京已经统治了这个国家二十年。在他的统治下，俄罗斯再次反对西方的地缘政治秩序。尽管普京获得了广泛的支持，但仍然有一些人认为他做得不够，但左翼右翼的反对者仍然在社会中保留了存在。新的十年，承诺新的挑战，新的机会，随着美国遭受政治危机，俄罗斯可能最终能够带来多极世界。然而，有报道说，新病毒正在到来……"
 SOV_country_paths: "\n\n§Y国家分支§!：\n§C - 德米特里·梅德韦杰夫（UR）§!\n§R- 根纳季·齐加诺夫（CPRF）§!\n§8 - 弗拉基米尔·齐里诺夫斯基（利维埃人民党）§!"
 SOV_country_other: "§YRU-TFR小贴士：§!\n-ALWAYS 对你们的能力充满信心。\n-§Y格拉西莫夫学说§!即是未来。\n-即使失败后也将继续游玩，你可能会发现§G还没结束！§!\n-欢乐无比！"
 PRC_country_summary: "§Y国家概况§!：\n对于像中国这样的古老国家来说，过去100年不仅是一个“羞辱世纪”，也是一个深刻改变中国身份的彻底变革时期。在头50年中，中国从“天堂之王”转变为了“东亚西洋刺人”，连续被西方列强和日本军国主义分子入侵和征服。在随后的50年里，中国所谓的“两个命运的末日”，即共产主义和资本主义之间的持久冲突，已经使这个国家经历了难以置信的政治动荡和经济繁荣的继承。\n现在，21世纪中的二十年，在中国共产党的领导下，这个伟大的国家正庄严地走向“大复兴”。有些人称之为“中国世纪”的时代，而其他人则认为中国最终会崩溃，就像其他国家一样，被自己在历史上挑战霸权的野心所吞噬。现在，中国的中国人民党，习近平和140亿中国人的土地似乎再次迎来历史的转折点……"
 PRC_country_paths: "\n\n§Y国家分支§!：\n§Y-西镇进军（实体）§!\n§O - 李祖真（复仇主义）§!\n§C - 王阳（改革派）§!\n§R- 胡春华（左派）§!"
 PRC_country_other: "§Y一些有帮助的中国谚语和谚语：§!\n- 如果你追赶超速，你就无法到达那里。\n- 简单组建一支一千人的军队，但难找一个优秀的将军。\n- 失败是成功的母亲。\n-§Y当人们团结起来时，泰山会动的！§!"
 FRA_country_summary: "§Y国家总览§!：\n在冷战的余波中，法国设想自己在全球舞台上成为关键角色，成为一个文化和外交强国，创下全新的世界秩序。然而，它很快将面临无数挑战，其中很多人没有做好应对准备。从旧的敌对思潮的复苏，到新的地缘政治紧张局势，以及其领土内的动荡，法国并非注定要迎来自己所期待的和谐时代。相反，它发现自己正处着一个日益复杂的全球舞台，挑战着它的传统作用和影响力。\n随着国家的城市中心与保守的乡村社群日益分裂，新的病毒在武汉崛起的呼声逐渐传开，法国步入了新世纪，对兹比格涅夫·布热津斯基的著名名言提出了挑战：\n\n“法国的精英们对于法国仍然是全球强权的念头有着痴迷的妄想。”"
 FRA_country_paths: "\n\n\n§Y国家路径§!：\n§C - 海军陆战队（遥控）§!\n§Y- 埃曼纽尔·马克龙（遥控）§!\n§5 - 5 隐藏的选举路径！§!"
 FRA_country_other: "§Y提示与诡计：§!\n更准确的LARP，效果越好。"
 JAP_country_summary: "§Y国家总览§!：\n日本是日出之国，是一个有着传统和新文化的国家，席卷了整个世界，这个国家在二战后处于历史的顶端，并在多年时间里最终崛起并延续到了冷战的绝大多数时间，但所有的奇迹终有一日会结束，日本的经济奇迹也不例外。\n20世纪的最后二十年景对日本并不有利，1985年的“经济泡沫”危机的开端结束了经济繁荣的漫长时期，并标志着一个新时代的开始，即所谓的“失落的十年”，持续了近30年。日本人民无疑没有在新形势的压力下放弃，就像他们的祖先一样，他们准备努力战斗到底。\n新的十年对日本至关重要，它最终能否打破停滞的锁链？日本能否阻止中国不满足的侵略扩张？只有时间能说明……\n\n“高岸王朝！”"
 JAP_country_paths: "\n\n\n\n§Y国家路径§!：\n§G- 国民党§!\n§9 - 公民联盟§!"
 JAP_country_other: "\n§Y提示与诡计：§!\n你应该……\n\n永远不要放弃！！\n£GFX_nevergiveup"
 GER_country_summary: "§Y国家总览§!：\n德国是在历史的熔炉中打造的国家，其过去的回声与其充满活力的时空共鸣。曾因冷战时期的意识形态而四分五裂，1990年的东方与西方统一标志着一个转折点，将德国变成了欧洲经济力量和文化影响力的强国。\n\n战后的几年里，德国从第二次世界大战的灰烬中崛起，打造出一个强大的市场经济，使世界羡慕不已。德国因其工程才能和创新精神而闻名，是沃尔克文和西门斯等全球巨人的大本营，依靠出口繁荣，拥有高技能的劳动力。\n\n然而，21世纪带来了挑战。移民危机、全球气候变化的压力，以及不断演变的地缘政治需求适应性与耐性。随着德国重视这些复杂性，其对民主和社会公正的承诺仍然坚定不移，将其定位为欧洲统一的领导者。"
