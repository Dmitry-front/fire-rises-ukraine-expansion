 SOV_usual_oligarch_info: "\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_SOV_oligarchs_banner\n\n\n\n\n\n\n\n\n\n\n\n\n\n§H寡头们§!£GFX_Gazprom_logo - 是90多岁草草败的孩童，当时国家财产被私人所有，俄罗斯经济陷入混乱。由于私有化、政治关系和腐败，他们得以积累巨额财富并建立真正的商业帝国。在普京时代，他们保留了自己的影响力，适应了新的现实：有些加入国家计划，而另一些人则利用首都通过商品垄断进一步丰富了自身财富。"
 SOV_red_directors_info: "\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_SOV_red_ganners_banner\n\n\n\n\n\n\n\n许多曾经经营大型公司的人，都将企业卖给了政府一无所有，但被新政府所属部门的指挥人保留了影响力。这些§R红衣指导人§!£GFX_Red_capors_grabes 是前寡头和企业家，他们意识到在新苏维埃俄罗斯接受游戏规则会更好。他们的利益仍然商品化，尽管他们标榜社会主义，但他们仍然追求自己的目标，与当局谈判以维持自己的地位。"
 SOV_peoples_entrepreneurs_info: "\n\n\n\n\n\n\n\n\n\n\n\n£GFX_SOV_peoples_entrepreneurs_banner\n\n\n\n\n\n\n\n\n\n\n\n£GFX_Peoples_entrepreneurys_design\n£GFX_Peoples_entrepreneurys_design\n\n\n\n\n\n\n在§t人民企业家§!£GFX_Peoples_entrepreneuryors_design 中，长期以来共产派赞助者、人文主义实业者、“人民企业”的拥有者以及决定与共产党合作的前寡头。他们愿意为新政府提供资源和资本，以期借此帮助他们保留自己的影响力，并在变化的环境下继续发财。他们仍然在追逐利润，假装为人民的利益而工作，但他们的真正目标仍然是私人的。"
 SOV_new_oligarchs_info: "\n\n\n\n\n\n\n\n\n\n\n£GFX_SOV_new_oligarchs_banner\n\n\n\n\n\n\n\n\n\n\n\n§7新的寡头§!£GFX_new_oligarchs_grables - 商人和企业家在之前的民主革命之后回到了政府，以夺回他们觉得被普京和他的盟友夺走的一切。他们很快通过腐败和关系找到了成为俄罗斯新政府的一部分的方法。\n他们的影响到处都有，包括在克里姆林宫大厅，就像20年代初一样。现在，他们已经将国家资源私有化，并建立了自己的媒体和经济帝国。然而，并不是每个人都对“好的”寡头取代“巴德”的想法感到满意。他们的统治正面临反对垄断的政客的反对。"
